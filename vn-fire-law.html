. Cơ sở kinh doanh khí đốt có tổng lượng khí đốt tồn chứa trên 500 kg.\n16. Cửa hàng xăng dầu.\n17. Khách sạn, nhà khách, nhà nghỉ, cơ sở nghỉ dưỡng, cơ sở dịch vụ lưu trú khác cao từ 3 tầng trở lên hoặc có tổng diện tích sàn từ 500 m² trở lên.\n18. Bưu điện, bưu cục, cơ sở cung cấp dịch vụ bưu chính, viễn thông khác cao từ 3 tầng trở lên hoặc có tổng diện tích sàn từ 500 m² trở lên.\n19. Trụ sở làm việc của cơ quan nhà nước, trụ sở, nhà làm việc của doanh nghiệp, tổ chức chính trị, xã hội có nhà cao từ 3 tầng trở lên hoặc có tổng diện tích sàn từ 500 m² trở lên.\n20. Nhà đa năng, nhà hỗn hợp, trừ nhà ở kết hợp sản xuất, kinh doanh có nhà cao từ 3 tầng trở lên hoặc có tổng diện tích sàn từ 500 m² trở lên.\n21. Nhà máy lọc dầu; nhà máy hóa dầu; nhà máy lọc, hóa dầu; nhà máy chế biến khí; nhà máy sản xuất nhiên liệu sinh học; kho chứa dầu mỏ, sản phẩm dầu mỏ; kho chứa khí hóa lỏng; trạm chiết nạp khí hóa lỏng; trạm phân phối khí đốt.\n22. Nhà máy điện.\n23. Trạm biến áp có điện áp từ 110 kV trở lên.\n24. Cơ sở sản xuất vật liệu nổ, tiền chất thuốc nổ công nghiệp, vũ khí, công cụ hỗ trợ; kho cố định chứa vật liệu nổ, tiền chất thuốc nổ công nghiệp, vũ khí, công cụ hỗ trợ.\n25. Cơ sở sản xuất công nghiệp có nhà phục vụ sản xuất thuộc hạng nguy hiểm cháy nổ A, B.\n26. Cơ sở sản xuất công nghiệp có nhà phục vụ sản xuất thuộc hạng nguy hiểm cháy C.\n27. Cơ sở sản xuất công nghiệp có nhà phục vụ sản xuất thuộc hạng nguy hiểm cháy D, E có khối tích từ 5.000 m3 trở lên hoặc có tổng diện tích sàn từ 1.000 m² trở lên.\n28. Kho chứa hàng hóa có hạng nguy hiểm cháy và cháy nổ A, B, C có tổng diện tích sàn từ 200 m2 trở lên.\n29. Kho dự trữ quốc gia.\n30. Kho chứa hàng hóa có hạng nguy hiểm cháy D, E có khối tích từ 5.000 m3 trở lên hoặc có tổng diện tích sàn từ 1.000 m² trở lên.\n31. Nhà để xe ô tô, xe máy, nhà trưng bày ô tô, xe máy có tổng diện tích sàn từ 500 m² trở lên.\n32. Nhà máy nước, nhà máy xử lý chất thải.\n33. Nhà ga hành khách, nhà khách phục vụ ngoại giao, nhà ga hàng hóa thuộc cảng hàng không; nhà kỹ thuật máy bay; đài kiểm soát không lưu.\n34. Cảng, bến thủy nội địa; bến cảng biển thuộc công trình từ cấp III trở lên theo quy định của pháp luật về xây dựng.\n35. Cảng cạn.\n36. Cảng cá loại II.\n37. Bến xe khách, trung tâm đăng kiểm phương tiện giao thông, trạm dừng nghỉ có tổng diện tích sàn từ 500 m² trở lên.\n38. Nhà ga hành khách, nhà ga hàng hóa, đề - pô (depot) đường sắt, nhà ga cáp treo, nhà ga hành khách, đề - pô (depot) đường sắt đô thị có tổng diện tích sàn từ 300 m² trở lên.\n39. Hầm đường ô tô, hầm đường sắt, hầm đường sắt đô thị có chiều dài từ 500 m trở lên.\n40. Cơ sở sửa chữa, bảo dưỡng phương tiện giao thông cơ giới đường bộ có tổng diện tích sàn từ 500 m² trở lên.\n41. Cơ sở sửa chữa phương tiện thủy nội địa, tàu biển có tổng diện tích sàn từ 1.000 m² trở lên.\n42. Cơ sở hạt nhân.\n43. Cơ sở trợ giúp xã hội có nhà cao từ 3 tầng trở lên hoặc tổng diện tích sàn từ 300 m² trở lên.\n44. Nhà ở kết hợp sản xuất, kinh doanh có tổng diện tích phục vụ sản xuất, kinh doanh từ 200 m2 trở lên./.","y":"1. 높이 5층 이상이거나 총 바닥면적 1.000 m² 이상인 건물이 있는 아파트(공동주택), 집합주택(기숙형 공동주택).\n2. 원아 50명 이상이거나 총 바닥면적 500 m2 이상인 어린이집, 유치원, 유아학교.\n3. 높이 3층 이상이거나 총 바닥면적 1.500 m² 이상인 건물이 있는 초등학교, 중학교, 고등학교, 여러 학교급이 있는 일반학교, 대학교, 전문대학, 중등직업학교, 직업훈련학교, 기술공 학교, 교육 관련 법령에 따른 그 밖의 교육시설, 우주 연구시설, 전문 분야 데이터베이스 센터 및 그 밖의 전문 분야 연구시설.\n4. 병원.\n5. 높이 3층 이상이거나 총 바닥면적 300 m² 이상인 건물이 있는 진료소(종합 또는 전문), 보건소, 조산원, 전염병 예방·방역 시설, 보건의료 분야 연구·실험 시설, 요양원, 재활시설, 정형시설, 양로시설 및 「진료·치료법」에 따른 그 밖의 의료시설.\n6. 관람석 수용 능력이 2.000석 이상인 경기장(스타디움).\n7. 좌석 1.000석 이상이거나 총 바닥면적 1.000 m² 이상인 경기용 체육관, 각종 스포츠 종목 훈련관, 수영장, 관람석이 있는 각종 스포츠 경기장, 경주장, 사격장, 「체육·스포츠법」에 따라 설립된 그 밖의 체육시설.\n8. 극장, 영화관, 서커스장.\n9. 높이 3층 이상이거나 총 바닥면적 500 m² 이상인 건물이 있는 회의센터(컨벤션센터), 박물관, 도서관, 진열관, 전시관.\n10. 높이 2층 이상이거나 총 바닥면적 300 m2 이상인 수족관, 노래방(가라오케) 서비스 영업시설, 무도장(클럽), 오락·유흥 서비스 영업시설, 예술 공연시설, 그 밖의 문화활동 시설.\n11. 총 바닥면적 300 m² 이상인 시장, 상업센터(쇼핑센터), 슈퍼마켓.\n12. 총 바닥면적 300 m² 이상인 음식 서비스 영업시설, 법령에 따른 그 밖의 서비스 영업시설.\n13. 총 바닥면적 200 m² 이상인 가연성(쉽게 타는) 상품 영업시설.\n14. 총 바닥면적 1.000 m² 이상인, 난연성 상품 또는 가연성 포장재에 담긴 불연성 상품의 영업시설.\n15. 가스 총 저장량이 500 kg을 초과하는 연료가스 영업시설.\n16. 주유소(석유류 판매점).\n17. 높이 3층 이상이거나 총 바닥면적 500 m² 이상인 호텔, 영빈관(게스트하우스), 여관, 휴양시설, 그 밖의 숙박 서비스 시설.\n18. 높이 3층 이상이거나 총 바닥면적 500 m² 이상인 우체국, 우편취급국, 그 밖의 우편·통신 서비스 제공 시설.\n19. 높이 3층 이상이거나 총 바닥면적 500 m² 이상인 건물이 있는 국가기관의 청사, 기업·정치조직·사회조직의 본사·업무용 건물.\n20. 높이 3층 이상이거나 총 바닥면적 500 m² 이상인 건물이 있는 다목적 건물, 복합 건물. 다만, 생산·영업 겸용 주택은 제외한다.\n21. 정유공장; 석유화학공장; 정유·석유화학공장; 가스 처리공장; 바이오연료 생산공장; 석유·석유제품 저장창고; 액화가스 저장창고; 액화가스 충전소; 연료가스 분배소.\n22. 발전소.\n23. 전압 110 kV 이상의 변전소.\n24. 폭약류(폭발물), 산업용 폭약 전구물질, 무기, 보조도구(지원장구)의 생산시설; 폭약류(폭발물), 산업용 폭약 전구물질, 무기, 보조도구(지원장구)를 보관하는 고정 창고.\n25. 화재·폭발 위험 등급 A, B에 해당하는 생산용 건물이 있는 공업 생산시설.\n26. 화재 위험 등급 C에 해당하는 생산용 건물이 있는 공업 생산시설.\n27. 화재 위험 등급 D, E에 해당하는 생산용 건물이 있고 체적 5.000 m3 이상이거나 총 바닥면적 1.000 m² 이상인 공업 생산시설.\n28. 총 바닥면적 200 m2 이상인, 화재 및 화재·폭발 위험 등급 A, B, C의 화물을 보관하는 창고.\n29. 국가비축 창고.\n30. 체적 5.000 m3 이상이거나 총 바닥면적 1.000 m² 이상인, 화재 위험 등급 D, E의 화물을 보관하는 창고.\n31. 총 바닥면적 500 m² 이상인 자동차·오토바이 주차건물, 자동차·오토바이 전시장.\n32. 정수장(상수도 공장), 폐기물 처리공장.\n33. 공항(항공항)에 속한 여객터미널, 외교용 영빈관(귀빈실), 화물터미널; 항공기 정비동(격납고); 항공교통 관제탑.\n34. 내수로 항만·부두; 건설 관련 법령에 따른 III급 이상 건축물에 해당하는 해항 부두.\n35. 내륙항(내륙 컨테이너 기지).\n36. II종 어항.\n37. 총 바닥면적 500 m² 이상인 여객버스 터미널, 교통수단 등록검사센터, 휴게소.\n38. 총 바닥면적 300 m² 이상인 철도 여객역사, 화물역사, 차량기지(depot), 케이블카 역사, 도시철도 여객역사, 차량기지(depot).\n39. 길이 500 m 이상인 자동차도로 터널, 철도 터널, 도시철도 터널.\n40. 총 바닥면적 500 m² 이상인 도로 자동차(원동기 교통수단) 수리·정비 시설.\n41. 총 바닥면적 1.000 m² 이상인 내수로 선박, 해상 선박 수리시설.\n42. 원자력(핵) 시설.\n43. 높이 3층 이상이거나 총 바닥면적 300 m² 이상인 건물이 있는 사회복지(사회부조) 시설.\n44. 생산·영업에 사용되는 총 면적이 200 m2 이상인 생산·영업 겸용 주택./.","o":[]},{"id":"nd347-10","d":"nd347","n":"10","t":"Sửa đổi, bổ sung khoản 8, khoản 17 Điều 1","k":"제1조 제8항, 제17항의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"1. Sửa đổi, bổ sung khoản 8 như sau:\n“8. Khoản 6 Điều 18 về tổ chức thi công, nghiệm thu công trình, phương tiện giao thông; bảo đảm an toàn phòng cháy và chữa cháy trong quá trình thi công.”.\n2. Sửa đổi, bổ sung khoản 17 như sau:\n“17. Điều 44 về sản xuất, lắp ráp, nhập khẩu, lưu thông phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ.”.","y":"1. 제8항을 다음과 같이 개정·보충한다:\n“8. 건축물, 교통수단의 시공 조직, 준공검사(인수검사); 시공 과정에서의 소방(화재예방·진압) 안전 보장에 관한 제18조 제6항.”.\n2. 제17항을 다음과 같이 개정·보충한다:\n“17. 소방 및 구조·구난 장비·설비의 생산, 조립, 수입, 유통에 관한 제44조.”.","o":[]},{"id":"nd347-11","d":"nd347","n":"11","t":"Sửa đổi, bổ sung điểm c khoản 1, khoản 4 Điều 4","k":"제4조 제1항 c호, 제4항의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"1. Sửa đổi, bổ sung điểm c khoản 1 như sau:\n“c) Giấy chứng nhận thẩm duyệt thiết kế hoặc văn bản thẩm duyệt thiết kế về phòng cháy và chữa cháy hoặc văn bản thẩm định thiết kế về phòng cháy và chữa cháy đối với công trình thuộc diện phải thẩm duyệt thiết kế, thẩm định thiết kế về phòng cháy và chữa cháy; biên bản nghiệm thu hoàn thành hạng mục công trình, công trình có liên quan đến phòng cháy và chữa cháy để đưa vào sử dụng theo quy định của pháp luật về xây dựng;”.\n2. Sửa đổi, bổ sung khoản 4 như sau:\n“4. Hồ sơ quy định tại khoản 2 và khoản 3 Điều này được lập, lưu trữ dưới dạng tài liệu giấy hoặc tài liệu điện tử hoặc kết hợp tài liệu giấy và tài liệu điện tử theo quy định của pháp luật về lưu trữ.\nTài liệu quy định tại các điểm g, h, i, l và điểm n khoản 1 Điều này được lưu trữ tối thiểu 05 năm kể từ năm lập, ban hành.”.","y":"1. 제1항 c호를 다음과 같이 개정·보충한다:\n“c) 소방 설계 심의승인(thẩm duyệt) 또는 소방 설계 심사 대상 건축물의 경우 설계 심의승인 증명서 또는 소방 설계 심의승인 문서 또는 소방 설계 심사 문서; 건설 관련 법령에 따라 사용에 투입하기 위한, 소방과 관련된 건축물의 부분 공사(공종), 건축물의 완공 준공검사(인수검사) 조서;”.\n2. 제4항을 다음과 같이 개정·보충한다:\n“4. 이 조 제2항 및 제3항에 규정된 서류는 기록보존 관련 법령에 따라 종이 문서 또는 전자 문서 또는 종이 문서와 전자 문서를 결합한 형태로 작성·보존한다.\n이 조 제1항 g호, h호, i호, l호 및 n호에 규정된 문서는 작성·발행한 해부터 최소 05년간 보존한다.”.","o":[]},{"id":"nd347-12","d":"nd347","n":"12","t":"Sửa đổi, bổ sung tên điều, khoản 1 Điều 6","k":"제6조의 조 제목, 제1항의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"1. Sửa đổi, bổ sung tên Điều 6 như sau:\n“Điều 6. Thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan chuyên môn về xây dựng”.\n2. Sửa đổi, bổ sung khoản 1 Điều 6 như sau:\n“1. Công trình thuộc đối tượng phải thẩm định Báo cáo nghiên cứu khả thi tại cơ quan chuyên môn về xây dựng và thuộc Phụ lục III kèm theo Nghị định này phải được cơ quan chuyên môn về xây dựng thẩm định thiết kế về phòng cháy và chữa cháy. Việc thực hiện thẩm định thiết kế về phòng cháy và chữa cháy trong Báo cáo nghiên cứu khả thi và thời gian trả kết quả thẩm định thiết kế về phòng cháy và chữa cháy được tích hợp, lồng ghép với quá trình thực hiện thẩm định Báo cáo nghiên cứu khả thi và trả kết quả thẩm định theo quy định của pháp luật về xây dựng.”.","y":"1. 제6조의 제목을 다음과 같이 개정·보충한다:\n“제6조. 건설 전문기관의 소방 설계 심사”.\n2. 제6조 제1항을 다음과 같이 개정·보충한다:\n“1. 건설 전문기관에서 타당성조사 보고서 심사를 받아야 하는 대상에 해당하고 이 시행령에 첨부된 부록 III에 해당하는 건축물은 건설 전문기관의 소방 설계 심사를 받아야 한다. 타당성조사 보고서에서의 소방 설계 심사의 수행 및 소방 설계 심사 결과 회신 기간은 건설 관련 법령에 따른 타당성조사 보고서 심사 수행 과정 및 심사 결과 회신과 통합·병행하여 처리한다.”.","o":[]},{"id":"nd347-13","d":"nd347","n":"13","t":"Sửa đổi, bổ sung tên Điều 7","k":"제7조 제목의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"“Điều 7. Thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan đăng kiểm”.","y":"“제7조. 등록검사기관의 소방 설계 심사”.","o":[]},{"id":"nd347-14","d":"nd347","n":"14","t":"Sửa đổi, bổ sung điểm a khoản 4 Điều 9","k":"제9조 제4항 a호의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"“a) Đối với thiết kế kỹ thuật hoặc thiết kế bản vẽ thi công công trình trong báo cáo kinh tế - kỹ thuật đầu tư xây dựng, thiết kế xây dựng triển khai sau khi dự án được phê duyệt: văn bản đề nghị thẩm định thiết kế về phòng cháy và chữa cháy theo Mẫu số PC11 kèm theo Nghị định này; giấy tờ hợp pháp về đất đai hoặc văn bản về chủ trương đầu tư, xây dựng công trình theo quy định pháp luật về đầu tư, pháp luật về đầu tư công, pháp luật về đầu tư theo phương thức đối tác công tư; hồ sơ thiết kế kỹ thuật hoặc thiết kế bản vẽ thi công thể hiện những nội dung quy định tại điểm e và điểm g khoản 1 Điều 16 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ;”.","y":"“a) 건설투자 경제·기술 보고서 내 건축물의 기술설계 또는 시공도면 설계, 사업(프로젝트)이 승인된 후 전개하는 건설설계의 경우: 이 시행령에 첨부된 서식 PC11에 따른 소방 설계 심사 신청 문서; 투자 관련 법령, 공공투자 관련 법령, 민관협력(PPP) 방식 투자 관련 법령에 따른 토지에 관한 적법한 서류 또는 건축물의 투자·건설 방침에 관한 문서; 「소방 및 구조·구난법」 제16조 제1항 e호 및 g호에 규정된 내용을 나타내는 기술설계 또는 시공도면 설계 서류;”.","o":[]},{"id":"nd347-15","d":"nd347","n":"15","t":"Sửa đổi, bổ sung Điều 11","k":"제11조의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"“Điều 11. Trách nhiệm phối hợp trong thẩm định thiết kế về phòng cháy và chữa cháy\nCơ quan quản lý chuyên ngành trong công tác thẩm định thiết kế về phòng cháy và chữa cháy có trách nhiệm phối hợp tham gia ý kiến đối với các nội dung thuộc phạm vi trách nhiệm khi có yêu cầu để phục vụ công tác thẩm định thiết kế về phòng cháy và chữa cháy.”.","y":"“제11조. 소방 설계 심사에서의 협조 책임\n소방 설계 심사 업무에서의 전문 분야 관리기관은 소방 설계 심사 업무를 위하여 요청이 있는 경우 책임 범위에 속하는 내용에 대하여 협조하여 의견을 제시할 책임이 있다.”.","o":[]},{"id":"nd347-16","d":"nd347","n":"16","t":"Sửa đổi, bổ sung điểm đ khoản 1, điểm c khoản 3 Điều 12","k":"제12조 제1항 đ호, 제3항 c호의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"1. Sửa đổi, bổ sung điểm đ khoản 1 như sau:\n“đ) Tổ chức nghiệm thu về phòng cháy và chữa cháy đối với dự án, công trình và chịu trách nhiệm trước pháp luật về kết quả nghiệm thu; khai báo trên hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy trước khi đưa công trình vào hoạt động;”.\n2. Sửa đổi, bổ sung điểm c khoản 3 như sau:\n“c) Tổ chức nghiệm thu về phòng cháy và chữa cháy đối với phương tiện giao thông và chịu trách nhiệm trước pháp luật về kết quả nghiệm thu; thông báo bằng văn bản cho cơ quan quản lý chuyên ngành về việc đưa phương tiện giao thông vào hoạt động.”.","y":"1. 제1항 đ호를 다음과 같이 개정·보충한다:\n“đ) 사업(프로젝트), 건축물에 대하여 소방 준공검사(인수검사)를 실시하고 준공검사(인수검사) 결과에 대하여 법 앞에 책임을 진다; 건축물을 가동(운영)에 투입하기 전에 소방, 구조·구난 데이터베이스 및 화재 신호 전송 시스템에 신고한다;”.\n2. 제3항 c호를 다음과 같이 개정·보충한다:\n“c) 교통수단에 대하여 소방 준공검사(인수검사)를 실시하고 준공검사(인수검사) 결과에 대하여 법 앞에 책임을 진다; 교통수단을 운행(운영)에 투입하는 것에 대하여 전문 분야 관리기관에 문서로 통보한다.”.","o":[]},{"id":"nd347-17","d":"nd347","n":"17","t":"Sửa đổi, bổ sung điểm a, điểm b khoản 2 Điều 13","k":"제13조 제2항 a호, b호의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"1. Sửa đổi, bổ sung điểm a như sau:\n“a) Cơ quan Công an theo phân cấp tổ chức kiểm tra:\nKiểm tra định kỳ 01 năm một lần đối với cơ sở thuộc nhóm 1 quy định tại Phụ lục II kèm theo Nghị định này, công trình xây dựng trong quá trình thi công thuộc diện phải thẩm duyệt thiết kế, thẩm định thiết kế về phòng cháy và chữa cháy, phương tiện giao thông quy định tại Phụ lục III kèm theo Nghị định này; kiểm tra định kỳ 02 năm một lần đối với cơ sở thuộc nhóm 2 quy định tại Phụ lục II kèm theo Nghị định này.\nKiểm tra đột xuất khi có dấu hiệu vi phạm pháp luật, có đơn khiếu nại, tố cáo về vi phạm pháp luật liên quan đến phòng cháy, chữa cháy theo quy định hoặc theo yêu cầu phục vụ bảo đảm an ninh, trật tự của cơ quan có thẩm quyền đối với cơ sở quy định tại Phụ lục II kèm theo Nghị định này và phương tiện giao thông quy định tại Phụ lục III kèm theo Nghị định này.\nNội dung kiểm tra định kỳ, đột xuất: đối với cơ sở theo quy định tại các điểm a, c, d và điểm đ khoản 1 Điều này; đối với công trình xây dựng trong quá trình thi công thuộc diện phải thẩm duyệt thiết kế, thẩm định thiết kế về phòng cháy và chữa cháy theo quy định tại các điểm c, d, l và điểm m khoản 1 Điều này; đối với phương tiện giao thông quy định tại Phụ lục III kèm theo Nghị định này theo quy định tại các điểm b, c, d, l và điểm m khoản 1 Điều này;”.\n2. Sửa đổi, bổ sung điểm b như sau:\n“b) Ủy ban nhân dân cấp tỉnh phân công, phân cấp cơ quan chuyên môn về xây dựng tổ chức kiểm tra:\nKiểm tra định kỳ 01 năm một lần đối với cơ sở thuộc nhóm 1 quy định tại Phụ lục II kèm theo Nghị định này, 02 năm một lần đối với cơ sở thuộc nhóm 2 quy định tại Phụ lục II kèm theo Nghị định này.\nKiểm tra đột xuất khi có dấu hiệu vi phạm pháp luật, có đơn khiếu nại, tố cáo về vi phạm pháp luật liên quan đến phòng cháy, chữa cháy và cứu nạn, cứu hộ theo quy định hoặc khi có yêu cầu phối hợp để phục vụ bảo đảm an ninh, trật tự của cơ quan có thẩm quyền đối với cơ sở thuộc Phụ lục II kèm theo Nghị định này.\nNội dung kiểm tra định kỳ, đột xuất theo quy định tại điểm g và điểm h khoản 1 Điều này;”.","y":"1. a호를 다음과 같이 개정·보충한다:\n“a) 공안기관은 권한 위임(분급)에 따라 점검을 실시한다:\n이 시행령에 첨부된 부록 II에 규정된 제1그룹에 속하는 사업장, 소방 설계 심의승인(thẩm duyệt)·소방 설계 심사 대상으로서 시공 과정에 있는 건설 공사(건축물), 이 시행령에 첨부된 부록 III에 규정된 교통수단에 대하여 01년에 1회 정기 점검; 이 시행령에 첨부된 부록 II에 규정된 제2그룹에 속하는 사업장에 대하여 02년에 1회 정기 점검.\n법령 위반의 징후가 있거나, 규정에 따라 소방과 관련된 법령 위반에 관한 이의신청(진정)·고발장이 있거나, 권한 있는 기관의 안보·질서 보장을 위한 요구에 따르는 경우 이 시행령에 첨부된 부록 II에 규정된 사업장 및 이 시행령에 첨부된 부록 III에 규정된 교통수단에 대하여 수시(불시) 점검.\n정기·수시 점검의 내용: 사업장의 경우 이 조 제1항 a호, c호, d호 및 đ호의 규정에 따른다; 소방 설계 심의승인(thẩm duyệt)·소방 설계 심사 대상으로서 시공 과정에 있는 건설 공사(건축물)의 경우 이 조 제1항 c호, d호, l호 및 m호의 규정에 따른다; 이 시행령에 첨부된 부록 III에 규정된 교통수단의 경우 이 조 제1항 b호, c호, d호, l호 및 m호의 규정에 따른다;”.\n2. b호를 다음과 같이 개정·보충한다:\n“b) 성급 인민위원회는 건설 전문기관에 업무를 분장·위임(분급)하여 점검을 실시하게 한다:\n이 시행령에 첨부된 부록 II에 규정된 제1그룹에 속하는 사업장에 대하여 01년에 1회, 이 시행령에 첨부된 부록 II에 규정된 제2그룹에 속하는 사업장에 대하여 02년에 1회 정기 점검.\n법령 위반의 징후가 있거나, 규정에 따라 소방 및 구조·구난과 관련된 법령 위반에 관한 이의신청(진정)·고발장이 있거나, 권한 있는 기관의 안보·질서 보장을 위한 협조 요구가 있는 경우 이 시행령에 첨부된 부록 II에 해당하는 사업장에 대하여 수시(불시) 점검.\n정기·수시 점검의 내용은 이 조 제1항 g호 및 h호의 규정에 따른다;”.","o":[]},{"id":"nd347-18","d":"nd347","n":"18","t":"Sửa đổi, bổ sung khoản 3 Điều 14","k":"제14조 제3항의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"“3. Cơ quan Công an, cơ quan chuyên môn về xây dựng, Ủy ban nhân dân cấp xã theo phân cấp tổ chức kiểm tra định kỳ đối với cơ sở quy định tại Phụ lục I kèm theo Nghị định này, công trình xây dựng thuộc diện phải thẩm duyệt thiết kế hoặc thẩm định thiết kế về phòng cháy và chữa cháy trong quá trình thi công, phương tiện giao thông quy định tại Phụ lục III kèm theo Nghị định này thuộc phạm vi quản lý theo trình tự, thủ tục như sau:\na) Trước ngày 15 tháng 12 hằng năm, cơ quan Công an, cơ quan chuyên môn về xây dựng, Ủy ban nhân dân cấp xã theo phân cấp xây dựng kế hoạch kiểm tra định kỳ của năm kế tiếp đối với cơ sở, công trình, phương tiện giao thông thuộc phạm vi quản lý và được điều chỉnh khi cần thiết;\nb) Thành lập Đoàn kiểm tra hoặc phân công cán bộ thực hiện kiểm tra và gửi văn bản thông báo về thời gian, nội dung và thành phần tham gia kiểm tra cho đối tượng được kiểm tra trước 03 ngày làm việc;\nc) Trưởng đoàn hoặc cán bộ được phân công giới thiệu thành phần, nội dung, phương pháp và phân công thành viên trong đoàn thực hiện kiểm tra về phòng cháy, chữa cháy theo thẩm quyền;\nd) Kết thúc kiểm tra phải lập biên bản theo Mẫu số PC03 kèm theo Nghị định này; trường hợp đối tượng kiểm tra không ký biên bản thì ghi rõ lý do vào biên bản kiểm tra.”.","y":"“3. 공안기관, 건설 전문기관, 사(면)급 인민위원회는 권한 위임(분급)에 따라, 관리 범위에 속하는 이 시행령에 첨부된 부록 I에 규정된 사업장, 소방 설계 심의승인(thẩm duyệt) 또는 소방 설계 심사 대상으로서 시공 과정에 있는 건설 공사(건축물), 이 시행령에 첨부된 부록 III에 규정된 교통수단에 대하여 다음의 순서·절차에 따라 정기 점검을 실시한다:\na) 매년 12월 15일 이전에 공안기관, 건설 전문기관, 사(면)급 인민위원회는 권한 위임(분급)에 따라 관리 범위에 속하는 사업장, 건축물, 교통수단에 대한 다음 해의 정기 점검 계획을 수립하며, 필요한 경우 조정한다;\nb) 점검단을 구성하거나 담당 공무원을 지정하여 점검을 실시하게 하고, 점검의 시간, 내용 및 참여 구성원에 관한 통보 문서를 03영업일 전에 피점검 대상에게 송부한다;\nc) 점검단장 또는 지정된 담당 공무원은 구성원, 내용, 방법을 소개하고 점검단 구성원에게 권한에 따른 소방 점검(검사)의 수행을 분담시킨다;\nd) 점검을 마치면 이 시행령에 첨부된 서식 PC03에 따라 조서를 작성하여야 한다; 피점검 대상이 조서에 서명하지 아니하는 경우에는 그 사유를 점검 조서에 명확히 기재한다.”.","o":[]},{"id":"nd347-19","d":"nd347","n":"19","t":"Bổ sung khoản 8 sau khoản 7 Điều 14","k":"제14조 제7항 다음에 제8항을 보충","c":"제2장 시행령 105/2025 개정","x":"“8. Trường hợp cơ quan Công an, cơ quan chuyên môn về xây dựng phối hợp kiểm tra về phòng cháy, chữa cháy định kỳ, đột xuất cơ sở thuộc Phụ lục II kèm theo Nghị định này, cơ quan Công an chủ trì, phối hợp với cơ quan chuyên môn về xây dựng thực hiện kiểm tra theo trình tự, thủ tục như sau:\na) Kiểm tra về phòng cháy, chữa cháy định kỳ theo quy định tại các điểm b, c và điểm d khoản 3 Điều này;\nb) Kiểm tra về phòng cháy, chữa cháy đột xuất theo quy định tại khoản 5 Điều này.”.","y":"“8. 공안기관, 건설 전문기관이 이 시행령에 첨부된 부록 II에 해당하는 사업장에 대한 정기·수시 소방 점검(검사)을 협조하여 실시하는 경우, 공안기관이 주관하고 건설 전문기관과 협조하여 다음의 순서·절차에 따라 점검을 실시한다:\na) 정기 소방 점검(검사)은 이 조 제3항 b호, c호 및 d호의 규정에 따른다;\nb) 수시(불시) 소방 점검(검사)은 이 조 제5항의 규정에 따른다.”.","o":[]},{"id":"nd347-20","d":"nd347","n":"20","t":"Sửa đổi, bổ sung khoản 7 Điều 20","k":"제20조 제7항의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"“7. Chế độ hoạt động của Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành:\na) Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành của khu công nghiệp, cụm công nghiệp có tổng diện tích từ 75 ha trở lên, kho dầu mỏ và sản phẩm dầu mỏ có tổng dung tích từ 100.000 m3 đến dưới 500.000 m3, nhà máy dệt có công suất từ 25 triệu m2/năm trở lên, nhà máy nhiệt điện có tổng công suất từ 600 MW đến dưới 1.200 MW và nhà máy thuỷ điện có tổng công suất từ 1.000 MW trở lên, cảng hàng không có công suất thiết kế dưới 10 triệu hành khách/năm được hoạt động theo chế độ kiêm nhiệm. Thành viên trong ca trực đang thực hiện các nhiệm vụ khác tại cơ sở khi nhận được báo động phải khẩn trương di chuyển ngay đến vị trí để phương tiện và triển khai các hoạt động chữa cháy, cứu nạn, cứu hộ. Người được phân công điều khiển xe chữa cháy phải trực tại địa điểm bố trí xe chữa cháy;\nb) Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành của cơ sở quy định tại các điểm b, e, g và điểm i khoản 1 và khoản 3 Điều này, kho dầu mỏ và sản phẩm dầu mỏ có tổng dung tích từ 500.000 m3 trở lên, nhà máy nhiệt điện có tổng công suất từ 1.200 MW trở lên, cảng hàng không có công suất thiết kế từ 10 triệu hành khách/năm trở lên hoạt động theo chế độ chuyên trách. Thành viên trong ca trực được phân công trực theo xe chữa cháy, tàu chữa cháy phải trực tại khu vực quy định.”.","y":"“7. 전문 소방 및 구조·구난대의 활동 체제:\na) 총 면적 75 ha 이상인 공단(산업단지)·산업클러스터, 총 용적 100.000 m3 이상 500.000 m3 미만인 석유 및 석유제품 저장창고, 생산능력 2,500만 m2/년 이상인 방직공장, 총 출력 600 MW 이상 1.200 MW 미만인 화력발전소 및 총 출력 1.000 MW 이상인 수력발전소, 설계 처리능력 여객 1,000만 명/년 미만인 공항(항공항)의 전문 소방 및 구조·구난대는 겸임 체제로 활동할 수 있다. 사업장에서 다른 임무를 수행 중인 당직조 구성원은 경보를 받으면 즉시 장비·설비 보관 위치로 신속히 이동하여 화재진압, 구조·구난 활동을 전개하여야 한다. 소방차 운전을 배정받은 사람은 소방차 배치 장소에서 당직 근무하여야 한다;\nb) 이 조 제1항 b호, e호, g호 및 i호와 제3항에 규정된 사업장, 총 용적 500.000 m3 이상인 석유 및 석유제품 저장창고, 총 출력 1.200 MW 이상인 화력발전소, 설계 처리능력 여객 1,000만 명/년 이상인 공항(항공항)의 전문 소방 및 구조·구난대는 전담(전임) 체제로 활동한다. 소방차, 소방선에 따라 당직 근무하도록 배정된 당직조 구성원은 규정된 구역에서 당직 근무하여야 한다.”.","o":[]},{"id":"nd347-21","d":"nd347","n":"21","t":"Sửa đổi, bổ sung Điều 23","k":"제23조의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"“Điều 23. Kê khai thông tin, quản lý chất lượng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ trong sản xuất, lắp ráp, nhập khẩu và lưu thông trên thị trường\n1. Phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ trước khi lưu thông trên thị trường phải thực hiện kê khai thông tin trên hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy theo Mẫu số PC24 kèm theo Nghị định này.\nRiêng đối với phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ được miễn thực hiện công bố hợp quy thì gửi kèm kết quả đánh giá sự phù hợp đối với phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ do tổ chức đánh giá sự phù hợp đã đăng ký hoặc được chỉ định hoặc công nhận thực hiện theo quy định.\n2. Đối với phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ nhập khẩu đủ điều kiện theo quy định tại khoản 1 Điều này, thì được miễn thực hiện kiểm tra chất lượng hàng hóa khi nhập khẩu theo quy định.\n3. Việc kê khai thông tin được thực hiện bằng phương thức điện tử trên hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy. Trường hợp hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy chưa vận hành hoặc chưa đáp ứng yêu cầu tiếp nhận, xử lý thông tin thì việc kê khai được thực hiện bằng văn bản theo Mẫu số PC24 kèm theo Nghị định này hoặc phương thức điện tử khác gửi đến cơ quan quản lý chuyên ngành có thẩm quyền để cập nhật, theo dõi.”.","y":"“제23조. 생산, 조립, 수입 및 시장 유통에서의 소방 및 구조·구난 장비·설비의 정보 신고, 품질 관리\n1. 소방 및 구조·구난 장비·설비는 시장에 유통되기 전에 이 시행령에 첨부된 서식 PC24에 따라 소방, 구조·구난 데이터베이스 및 화재 신호 전송 시스템에 정보를 신고하여야 한다.\n다만, 적합성 공표(기술 규정 적합 공표)의 이행이 면제되는 소방 및 구조·구난 장비·설비의 경우에는 규정에 따라 등록하였거나 지정 또는 인정받은 적합성 평가 기관이 수행한 해당 소방 및 구조·구난 장비·설비에 대한 적합성 평가 결과를 첨부하여 제출한다.\n2. 이 조 제1항의 규정에 따른 요건을 충족하는 수입 소방 및 구조·구난 장비·설비의 경우에는 규정에 따라 수입 시 상품 품질 검사의 이행이 면제된다.\n3. 정보 신고는 소방, 구조·구난 데이터베이스 및 화재 신호 전송 시스템에서 전자적 방식으로 한다. 소방, 구조·구난 데이터베이스 및 화재 신호 전송 시스템이 아직 운영되지 아니하거나 정보의 접수·처리 요건을 아직 충족하지 못하는 경우에는 이 시행령에 첨부된 서식 PC24에 따른 문서 또는 그 밖의 전자적 방식으로 신고하여 권한 있는 전문 분야 관리기관에 송부하여 갱신·관리하게 한다.”.","o":[]},{"id":"nd347-22","d":"nd347","n":"22","t":"Bổ sung khoản 5 sau khoản 4 Điều 29","k":"제29조 제4항 다음에 제5항을 보충","c":"제2장 시행령 105/2025 개정","x":"“5. Đối với cá nhân thực hiện nhiều nhiệm vụ thuộc các đối tượng quy định tại khoản 1 Điều 45 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ thì thực hiện việc huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ theo các nội dung quy định tại các điểm b, c, d và điểm e khoản 1, các khoản 2, 3 và khoản 4 Điều 28 Nghị định này; thời gian huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ như sau:\na) Huấn luyện nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ tối thiểu 24 giờ và không quá 32 giờ;\nb) Bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ tối thiểu 08 giờ và không quá 12 giờ.”.","y":"“5. 「소방 및 구조·구난법」 제45조 제1항에 규정된 대상에 해당하는 여러 임무를 수행하는 개인의 경우에는 이 시행령 제28조 제1항 b호, c호, d호 및 e호, 제2항, 제3항 및 제4항에 규정된 내용에 따라 소방 및 구조·구난 직무 훈련·교육을 실시한다; 소방 및 구조·구난 직무 훈련·교육 시간은 다음과 같다:\na) 소방 및 구조·구난 직무 훈련은 최소 24시간 이상 32시간 이하;\nb) 소방 및 구조·구난 직무 교육(보수교육)은 최소 08시간 이상 12시간 이하.”.","o":[]},{"id":"nd347-23","d":"nd347","n":"23","t":"Sửa đổi, bổ sung điểm a, điểm c khoản 4 Điều 35","k":"제35조 제4항 a호, c호의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"1. Sửa đổi, bổ sung điểm a như sau:\n“a) Chi hỗ trợ mua sắm trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ: tối đa không quá 75% số tiền thực tế thu được từ bảo hiểm cháy, nổ bắt buộc của các doanh nghiệp bảo hiểm trong năm tài chính. Việc mua sắm trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ thực hiện theo quy định của pháp luật về đấu thầu;”.\n2. Sửa đổi, bổ sung điểm c như sau:\n“c) Chi hỗ trợ lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ trong: hoạt động tập huấn, bồi dưỡng nghiệp vụ tuyên truyền về phòng cháy, chữa cháy, cứu nạn, cứu hộ, kiểm tra về phòng cháy, chữa cháy, điều tra, xác minh, giải quyết vụ cháy, huấn luyện nghiệp vụ về chữa cháy, cứu nạn, cứu hộ; thực hiện công tác kiểm tra, giám sát việc tham gia bảo hiểm cháy, nổ bắt buộc của các cơ sở, công tác điều tra, xác minh, giải quyết vụ cháy: tối đa không quá 5% số tiền thực tế thu được từ bảo hiểm cháy, nổ bắt buộc của các doanh nghiệp bảo hiểm trong năm tài chính. Nội dung chi, mức chi thực hiện theo chế độ chi tiêu tài chính hiện hành;”.","y":"1. a호를 다음과 같이 개정·보충한다:\n“a) 소방경찰(소방·구조구난 경찰)을 위한 소방 및 구조·구난 장비·설비의 구매·장비 지원 지출: 회계연도 중 보험회사들의 화재·폭발 의무보험에서 실제 징수한 금액의 최대 75%를 초과하지 아니한다. 소방 및 구조·구난 장비·설비의 구매·장비는 입찰 관련 법령의 규정에 따라 실시한다;”.\n2. c호를 다음과 같이 개정·보충한다:\n“c) 다음에 있어서 소방경찰(소방·구조구난 경찰)을 지원하는 지출: 소방 및 구조·구난에 관한 홍보 직무 연수·교육 활동, 소방 점검(검사), 화재 사건의 조사·확인·처리, 화재진압·구조·구난에 관한 직무 훈련; 사업장들의 화재·폭발 의무보험 가입에 대한 점검·감독 업무, 화재 사건의 조사·확인·처리 업무의 수행: 회계연도 중 보험회사들의 화재·폭발 의무보험에서 실제 징수한 금액의 최대 5%를 초과하지 아니한다. 지출 내용, 지출 수준은 현행 재정 지출 제도에 따른다;”.","o":[]},{"id":"nd347-24","d":"nd347","n":"24","t":"Sửa đổi, bổ sung điểm c khoản 4 Điều 38","k":"제38조 제4항 c호의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"“c) Tuyên truyền, phổ biến, giáo dục kiến thức, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ; huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật; xây dựng phong trào toàn dân tham gia phòng cháy, chữa cháy, cứu nạn, cứu hộ; tổ chức hoạt động của trung tâm học tập cộng đồng về phòng cháy, chữa cháy, cứu nạn, cứu hộ;”.","y":"“c) 소방 및 구조·구난에 관한 지식·법령의 홍보, 보급, 교육; 법령의 규정에 따른 소방 및 구조·구난 직무 훈련·교육; 전 국민이 소방 및 구조·구난에 참여하는 운동의 구축; 소방 및 구조·구난에 관한 지역사회 학습센터의 활동 조직;”.","o":[]},{"id":"nd347-25","d":"nd347","n":"25","t":"Sửa đổi khoản 6 Điều 39","k":"제39조 제6항의 개정","c":"제2장 시행령 105/2025 개정","x":"“6. Thẩm định thiết kế về phòng cháy và chữa cháy; thực hiện bảo hiểm cháy, nổ bắt buộc gắn với hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.”.","y":"“6. 소방 설계 심사; 소방 및 구조·구난 활동과 연계한 화재·폭발 의무보험의 시행.”.","o":[]},{"id":"nd347-26","d":"nd347","n":"26","t":"Sửa đổi khoản 7, khoản 8 Điều 40","k":"제40조 제7항, 제8항의 개정","c":"제2장 시행령 105/2025 개정","x":"1. Sửa đổi khoản 7 như sau:\n“7. Phân cấp cơ quan, đơn vị Công an thực hiện thẩm định thiết kế về phòng cháy và chữa cháy; tổ chức kiểm tra việc thực hiện quy định về thẩm định thiết kế về phòng cháy và chữa cháy và quy định việc thực hiện nội dung này trong lực lượng Công an nhân dân.”.\n2. Sửa đổi khoản 8 như sau:\n“8. Thực hiện chỉ định và quản lý hoạt động của tổ chức đánh giá sự phù hợp theo quy định của pháp luật về chất lượng sản phẩm, hàng hóa, pháp luật về tiêu chuẩn, quy chuẩn kỹ thuật.”.","y":"1. 제7항을 다음과 같이 개정한다:\n“7. 소방 설계 심사를 수행할 공안 기관·단위에 권한을 위임(분급)한다; 소방 설계 심사에 관한 규정의 이행에 대한 점검을 실시하고, 인민공안 역량 내에서 이 내용의 수행에 관하여 규정한다.”.\n2. 제8항을 다음과 같이 개정한다:\n“8. 제품·상품 품질 관련 법령, 기술 표준·기술 규정 관련 법령의 규정에 따라 적합성 평가 기관의 지정 및 그 활동의 관리를 수행한다.”.","o":[]},{"id":"nd347-27","d":"nd347","n":"27","t":"Sửa đổi, bổ sung điểm b, điểm đ khoản 3, điểm b, điểm đ khoản 7, điểm b, điểm c khoản 8 Điều 41","k":"제41조 제3항 b호·đ호, 제7항 b호·đ호, 제8항 b호·c호의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"1. Sửa đổi điểm b, điểm đ khoản 3\na) Sửa đổi điểm b như sau:\n“b) Hướng dẫn, chỉ đạo, tổ chức thực hiện thẩm định thiết kế về phòng cháy và chữa cháy thuộc lĩnh vực quản lý quy định tại Điều 17 của Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ;”.\nb) Sửa đổi điểm đ như sau:\n“đ) Kiểm tra cơ quan chuyên môn về xây dựng trong việc tổ chức thẩm định thiết kế về phòng cháy và chữa cháy cùng với việc kiểm tra tổ chức thẩm định Báo cáo nghiên cứu khả thi dự án, công trình xây dựng thuộc chuyên ngành theo quy định của pháp luật về xây dựng;”.\n2. Sửa đổi điểm b, điểm đ khoản 7\na) Sửa đổi điểm b như sau:\n“b) Hướng dẫn, chỉ đạo, tổ chức thực hiện thẩm định thiết kế về phòng cháy và chữa cháy thuộc lĩnh vực quản lý quy định tại Điều 17 của Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ;”.\nb) Sửa đổi điểm đ như sau:\n“đ) Kiểm tra cơ quan chuyên môn trực thuộc trong việc tổ chức thẩm định thiết kế về phòng cháy và chữa cháy cùng với việc kiểm tra tổ chức thẩm định Báo cáo nghiên cứu khả thi dự án, công trình xây dựng thuộc chuyên ngành theo quy định của pháp luật về xây dựng.”.\n3. Sửa đổi điểm b, điểm c khoản 8\na) Sửa đổi điểm b như sau:\n“b) Hướng dẫn, chỉ đạo, tổ chức thực hiện thẩm định thiết kế về phòng cháy và chữa cháy thuộc lĩnh vực quản lý quy định tại Điều 17 của Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ;”.\nb) Sửa đổi điểm c như sau:\n“c) Kiểm tra cơ quan chuyên môn trực thuộc trong việc tổ chức thẩm định thiết kế về phòng cháy và chữa cháy cùng với việc kiểm tra tổ chức thẩm định Báo cáo nghiên cứu khả thi dự án, công trình xây dựng thuộc chuyên ngành theo quy định của pháp luật về xây dựng.”.","y":"1. 제3항 b호, đ호의 개정\na) b호를 다음과 같이 개정한다:\n“b) 「소방 및 구조·구난법」 제17조에 규정된 관리 분야에 속하는 소방 설계 심사의 수행을 안내, 지도, 조직한다;”.\nb) đ호를 다음과 같이 개정한다:\n“đ) 건설 관련 법령의 규정에 따른 전문 분야에 속하는 사업(프로젝트), 건설 공사(건축물)의 타당성조사 보고서 심사 조직에 대한 점검과 함께, 소방 설계 심사의 조직에 있어서 건설 전문기관을 점검한다;”.\n2. 제7항 b호, đ호의 개정\na) b호를 다음과 같이 개정한다:\n“b) 「소방 및 구조·구난법」 제17조에 규정된 관리 분야에 속하는 소방 설계 심사의 수행을 안내, 지도, 조직한다;”.\nb) đ호를 다음과 같이 개정한다:\n“đ) 건설 관련 법령의 규정에 따른 전문 분야에 속하는 사업(프로젝트), 건설 공사(건축물)의 타당성조사 보고서 심사 조직에 대한 점검과 함께, 소방 설계 심사의 조직에 있어서 소속 전문기관을 점검한다.”.\n3. 제8항 b호, c호의 개정\na) b호를 다음과 같이 개정한다:\n“b) 「소방 및 구조·구난법」 제17조에 규정된 관리 분야에 속하는 소방 설계 심사의 수행을 안내, 지도, 조직한다;”.\nb) c호를 다음과 같이 개정한다:\n“c) 건설 관련 법령의 규정에 따른 전문 분야에 속하는 사업(프로젝트), 건설 공사(건축물)의 타당성조사 보고서 심사 조직에 대한 점검과 함께, 소방 설계 심사의 조직에 있어서 소속 전문기관을 점검한다.”.","o":[]},{"id":"nd347-28","d":"nd347","n":"28","t":"Sửa đổi, bổ sung tên điều và điểm a, điểm b, điểm c khoản 1 Điều 44","k":"제44조의 조 제목 및 제1항 a호, b호, c호의 개정·보충","c":"제2장 시행령 105/2025 개정","x":"1. Sửa đổi tên điều như sau:\n“Điều 44. Sửa đổi, bổ sung, bãi bỏ một số điều của Nghị định số 67/2023/NĐ-CP ngày 06 tháng 9 năm 2023 quy định về bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới, bảo hiểm cháy, nổ bắt buộc, bảo hiểm bắt buộc trong hoạt động đầu tư xây dựng, Nghị định số 78/2021/NĐ-CP ngày 01 tháng 8 năm 2021 về thành lập và quản lý Quỹ phòng, chống thiên tai, Nghị định số 161/2024/NĐ-CP ngày 18 tháng 12 năm 2024 quy định danh mục hàng hóa nguy hiểm, vận chuyển hàng hóa nguy hiểm và trình tự, thủ tục cấp giấy phép, cấp giấy chứng nhận hoàn thành chương trình tập huấn cho người lái xe hoặc người áp tải vận chuyển hàng hóa nguy hiểm trên đường bộ, Nghị định số 34/2024/NĐ-CP ngày 31 tháng 3 năm 2024 quy định danh mục hàng hoá nguy hiểm, vận chuyển hàng hoá nguy hiểm bằng phương tiện giao thông cơ giới đường bộ và phương tiện thủy nội địa, Nghị định số 65/2018/NĐ-CP ngày 12 tháng 5 năm 2018 quy định chi tiết thi hành một số điều của Luật Đường sắt”.\n2. Sửa đổi, bổ sung điểm a khoản 1 như sau:\n“a) Sửa đổi, bổ sung điểm b khoản 5 Điều 4 như sau:\n“b) Đối với bảo hiểm cháy, nổ bắt buộc: Cơ sở thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy nhưng chưa có văn bản thẩm định thiết kế về phòng cháy và chữa cháy;”.\n3. Sửa đổi, bổ sung điểm b khoản 1 như sau:\n“b) Sửa đổi, bổ sung điểm a khoản 1 Điều 23 như sau:\n“Nhà, công trình và các tài sản gắn liền với nhà, công trình, máy móc, thiết bị phục vụ sản xuất, kinh doanh, trừ nhà, công trình độc lập bảo đảm các quy định của tiêu chuẩn, quy chuẩn kỹ thuật, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ và có mức độ nguy hiểm cháy thấp;”.\n4. Sửa đổi, bổ sung điểm c khoản 1 như sau:\n“c) Sửa đổi, bổ sung khoản 1 Điều 24 như sau:\n“1. Số tiền bảo hiểm cháy, nổ bắt buộc tối thiểu là giá trị tính thành tiền theo giá thị trường của các tài sản quy định tại khoản 1 Điều 23 Nghị định này tại thời điểm giao kết hợp đồng bảo hiểm.\nĐối với các tài sản quy định tại điểm b khoản 1 Điều 23 Nghị định này được bảo hiểm phù hợp thời gian lưu trữ hàng hóa, vật tư tại cơ sở.\nĐối với cơ sở có nhiều nhà, công trình độc lập có tính chất hoạt động khác nhau, bảo đảm các quy định của tiêu chuẩn, quy chuẩn kỹ thuật, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ, mức phí bảo hiểm đối với nhà, công trình được phép tính theo loại hình cơ sở quy định tại Phụ lục VI kèm theo Nghị định này.”.","y":"1. 조 제목을 다음과 같이 개정한다:\n“제44조. 자동차(원동기 차량) 소유자의 민사책임 의무보험, 화재·폭발 의무보험, 건설투자 활동에서의 의무보험에 관하여 규정하는 2023년 9월 06일자 시행령 제67/2023/NĐ-CP호, 자연재해 예방·대응 기금의 설립 및 관리에 관한 2021년 8월 01일자 시행령 제78/2021/NĐ-CP호, 위험 화물 목록, 위험 화물 운송 및 도로에서 위험 화물을 운송하는 운전자 또는 호송인에 대한 허가증 발급, 연수 과정 수료 증명서 발급의 순서·절차를 규정하는 2024년 12월 18일자 시행령 제161/2024/NĐ-CP호, 위험 화물 목록, 도로 자동차(원동기 교통수단) 및 내수로 선박에 의한 위험 화물 운송을 규정하는 2024년 3월 31일자 시행령 제34/2024/NĐ-CP호, 「철도법」의 일부 조항의 시행을 상세히 규정하는 2018년 5월 12일자 시행령 제65/2018/NĐ-CP호의 일부 조항의 개정·보충·폐지”.\n2. 제1항 a호를 다음과 같이 개정·보충한다:\n“a) 제4조 제5항 b호를 다음과 같이 개정·보충한다:\n“b) 화재·폭발 의무보험의 경우: 소방 설계 심사 대상에 해당하나 아직 소방 설계 심사 문서가 없는 사업장;”.\n3. 제1항 b호를 다음과 같이 개정·보충한다:\n“b) 제23조 제1항 a호를 다음과 같이 개정·보충한다:\n“주택(건물), 건축물 및 주택(건물)·건축물에 부착된 자산, 생산·영업에 사용되는 기계·설비. 다만, 기술 표준·기술 규정, 소방 및 구조·구난 관련 법령의 규정을 충족하고 화재 위험도가 낮은 독립된 주택(건물)·건축물은 제외한다;”.\n4. 제1항 c호를 다음과 같이 개정·보충한다:\n“c) 제24조 제1항을 다음과 같이 개정·보충한다:\n“1. 화재·폭발 의무보험의 최저 보험가입금액은 보험계약 체결 시점에 이 시행령 제23조 제1항에 규정된 자산을 시장가격에 따라 금전으로 환산한 가액이다.\n이 시행령 제23조 제1항 b호에 규정된 자산의 경우에는 사업장에서의 화물·자재 보관 기간에 맞추어 보험에 가입할 수 있다.\n활동 성격이 서로 다른 여러 독립된 주택(건물)·건축물이 있고 기술 표준·기술 규정, 소방 및 구조·구난 관련 법령의 규정을 충족하는 사업장의 경우, 주택(건물)·건축물에 대한 보험료율은 이 시행령에 첨부된 부록 VI에 규정된 사업장 유형에 따라 산정할 수 있다.”.","o":[]},{"id":"nd347-29","d":"nd347","n":"29","t":"Sửa đổi, bổ sung khoản 3, khoản 6 và bổ sung khoản 7 Điều 46","k":"제46조 제3항, 제6항의 개정·보충 및 제7항의 보충","c":"제2장 시행령 105/2025 개정","x":"1. Sửa đổi, bổ sung khoản 3 như sau:\n“3. Đối với dự án đầu tư xây dựng công trình, công trình đã được cơ quan Công an cấp Giấy chứng nhận thẩm duyệt thiết kế về phòng cháy và chữa cháy mà trước hoặc trong quá trình thi công có điều chỉnh thiết kế làm thay đổi điều kiện an toàn về phòng cháy và chữa cháy quy định tại khoản 4 Điều 6 và khoản 3 Điều 9 Nghị định này thì việc thẩm duyệt điều chỉnh thiết kế về phòng cháy và chữa cháy được tiếp tục thực hiện theo quy định tại Điều 13 Nghị định số 136/2020/NĐ-CP và khoản 5 Điều 1 Nghị định số 50/2024/NĐ-CP. Thời hạn xử lý hồ sơ đề nghị thẩm duyệt điều chỉnh thực hiện theo quy định tại khoản 6 Điều 9 Nghị định này.”.\n2. Bổ sung khoản 6 sau khoản 5 như sau:\n“6. Đối với cơ sở được xây dựng và hoạt động trước ngày 01 tháng 7 năm 2025 đã được quản lý về phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định tại Nghị định số 136/2020/NĐ-CP, Nghị định số 50/2024/NĐ-CP và thuộc danh mục quy định tại Phụ lục I kèm theo Nghị định này, tiếp tục thực hiện việc quản lý, kiểm tra về phòng cháy, chữa cháy đối với cơ sở theo quy định tại Điều 13 và Điều 14 Nghị này.”.\n3. Bổ sung khoản 7 sau khoản 6 như sau:\n“7. Đối với thành phố được thành lập sau ngày 01 tháng 7 năm 2025, Ủy ban nhân dân thành phố phải hoàn thành các công việc quy định tại khoản 1 Điều 27 Nghị định này kể từ ngày Quốc hội thông qua Nghị quyết về việc thành lập, cụ thể như sau:\na) Trong thời hạn không quá 01 năm, phải hoàn thành việc phân loại, lập và công bố danh sách khu vực, nhà ở thuộc khu vực không bảo đảm hạ tầng giao thông hoặc nguồn nước phục vụ chữa cháy theo quy định của pháp luật, quy chuẩn kỹ thuật trong hoạt động phòng cháy, chữa cháy trên địa bàn quản lý;\nb) Trong thời hạn không quá 03 năm, phải hoàn thành việc trang bị và kết nối thiết bị truyền tin báo cháy với hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy đối với nhà ở tại thành phố quy định tại khoản 5 Điều 20 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ”.","y":"1. 제3항을 다음과 같이 개정·보충한다:\n“3. 공안기관으로부터 소방 설계 심의승인(thẩm duyệt) 증명서를 발급받은 건설투자 사업(프로젝트), 건축물로서 시공 전 또는 시공 과정에서 이 시행령 제6조 제4항 및 제9조 제3항에 규정된 소방 안전 조건을 변경하는 설계 조정이 있는 경우에는 소방 설계 조정 심의승인을 시행령 제136/2020/NĐ-CP호 제13조 및 시행령 제50/2024/NĐ-CP호 제1조 제5항의 규정에 따라 계속 수행한다. 조정 심의승인 신청 서류의 처리 기한은 이 시행령 제9조 제6항의 규정에 따른다.”.\n2. 제5항 다음에 제6항을 다음과 같이 보충한다:\n“6. 2025년 7월 01일 전에 건설되어 운영 중이고 시행령 제136/2020/NĐ-CP호, 시행령 제50/2024/NĐ-CP호의 규정에 따라 소방 및 구조·구난에 관한 관리를 받아 왔으며 이 시행령에 첨부된 부록 I에 규정된 목록에 해당하는 사업장의 경우에는 이 시행령 제13조 및 제14조의 규정에 따라 해당 사업장에 대한 소방 관리, 소방 점검(검사)을 계속 수행한다.”.\n3. 제6항 다음에 제7항을 다음과 같이 보충한다:\n“7. 2025년 7월 01일 후에 설립된 시(중앙직할시)의 경우, 시 인민위원회는 국회가 설립에 관한 결의를 통과시킨 날부터 이 시행령 제27조 제1항에 규정된 업무를 완료하여야 하며, 구체적으로 다음과 같다:\na) 01년을 초과하지 아니하는 기한 내에, 관할 지역에서 법령, 소방 활동에서의 기술 규정에 따른 화재진압용 교통 기반시설 또는 수원(水源)이 확보되지 아니한 구역, 그 구역에 속한 주택의 분류, 목록 작성 및 공표를 완료하여야 한다;\nb) 03년을 초과하지 아니하는 기한 내에, 「소방 및 구조·구난법」 제20조 제5항에 규정된 시(중앙직할시) 내 주택에 대하여 화재 신호 전송 장치의 설치 및 소방, 구조·구난 데이터베이스 및 화재 신호 전송 시스템과의 연결을 완료하여야 한다”.","o":[]},{"id":"nd347-30","d":"nd347","n":"30","t":"Bãi bỏ một số quy định, biểu mẫu, phụ lục","k":"일부 규정, 서식, 부록의 폐지","c":"제2장 시행령 105/2025 개정","x":"1. Bãi bỏ Điều 10.\n2. Bãi bỏ khoản 5 Điều 6; khoản 2 Điều 7; khoản 9 Điều 39; điểm d và điểm e khoản 3 Điều 41; khoản 3 Điều 44; khoản 5 Điều 46.\n3. Bãi bỏ Phụ lục V kèm theo Nghị định số 105/2025/NĐ-CP.\n4. Bãi bỏ Mẫu số PC15, Mẫu số PC16, Mẫu số PC17, Mẫu số PC19, Mẫu số PC20 và Mẫu số PC21 tại Phụ lục VIII kèm theo Nghị định số 105/2025/NĐ-CP.","y":"1. 제10조를 폐지한다.\n2. 제6조 제5항; 제7조 제2항; 제39조 제9항; 제41조 제3항 d호 및 e호; 제44조 제3항; 제46조 제5항을 폐지한다.\n3. 시행령 제105/2025/NĐ-CP호에 첨부된 부록 V를 폐지한다.\n4. 시행령 제105/2025/NĐ-CP호에 첨부된 부록 VIII의 서식 PC15, 서식 PC16, 서식 PC17, 서식 PC19, 서식 PC20 및 서식 PC21을 폐지한다.","o":[]},{"id":"nd347-31","d":"nd347","n":"31","t":"Thay thế, bổ sung một số nội dung, biểu mẫu, phụ lục","k":"일부 내용, 서식, 부록의 대체·보충","c":"제2장 시행령 105/2025 개정","x":"1. Thay thế Phụ lục III kèm theo Nghị định số 105/2025/NĐ-CP bằng Phụ lục III kèm theo Nghị định này.\n2. Thay thế Phụ lục IV kèm theo Nghị định số 105/2025/NĐ-CP bằng Phụ lục IV kèm theo Nghị định này.\n3. Thay thế Mẫu số PC01 tại Phụ lục VIII kèm theo Nghị định số 105/2025/NĐ-CP bằng Mẫu số PC01 tại Phụ lục VIII kèm theo Nghị định này.\n4. Thay thế Mẫu số PC11 tại Phụ lục VIII kèm theo Nghị định số 105/2025/NĐ-CP bằng Mẫu số PC11 tại Phụ lục VIII kèm theo Nghị định này.\n5. Thay thế Mẫu số PC12 tại Phụ lục VIII kèm theo Nghị định số 105/2025/NĐ-CP bằng Mẫu số PC12 tại Phụ lục VIII kèm theo Nghị định này.\n6. Bổ sung Mẫu số PC24 vào sau Mẫu số PC23 tại Phụ lục VIII kèm theo Nghị định số 105/2025/NĐ-CP.\n7. Thay thế cụm từ “thiết kế, kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy cùng với kiểm tra việc tổ chức thẩm định Báo cáo nghiên cứu khả thi đầu tư xây dựng, Báo cáo kinh tế - kỹ thuật đầu tư xây dựng, thiết kế xây dựng triển khai sau thiết kế cơ sở, kiểm tra công tác nghiệm thu” bằng cụm từ “thiết kế về phòng cháy và chữa cháy cùng với kiểm tra việc tổ chức thẩm định Báo cáo nghiên cứu khả thi đầu tư xây dựng” tại điểm k khoản 1 Điều 42.","y":"1. 시행령 제105/2025/NĐ-CP호에 첨부된 부록 III을 이 시행령에 첨부된 부록 III으로 대체한다.\n2. 시행령 제105/2025/NĐ-CP호에 첨부된 부록 IV를 이 시행령에 첨부된 부록 IV로 대체한다.\n3. 시행령 제105/2025/NĐ-CP호에 첨부된 부록 VIII의 서식 PC01을 이 시행령에 첨부된 부록 VIII의 서식 PC01로 대체한다.\n4. 시행령 제105/2025/NĐ-CP호에 첨부된 부록 VIII의 서식 PC11을 이 시행령에 첨부된 부록 VIII의 서식 PC11로 대체한다.\n5. 시행령 제105/2025/NĐ-CP호에 첨부된 부록 VIII의 서식 PC12를 이 시행령에 첨부된 부록 VIII의 서식 PC12로 대체한다.\n6. 시행령 제105/2025/NĐ-CP호에 첨부된 부록 VIII의 서식 PC23 다음에 서식 PC24를 보충한다.\n7. 제42조 제1항 k호에서 “설계, 소방 준공검사(인수검사) 확인과 함께 건설투자 타당성조사 보고서, 건설투자 경제·기술 보고서, 기본설계 이후 전개하는 건설설계의 심사 조직에 대한 점검, 준공검사(인수검사) 확인”이라는 문구를 “소방 설계와 함께 건설투자 타당성조사 보고서의 심사 조직에 대한 점검”이라는 문구로 대체한다.","o":[]},{"id":"nd347-32","d":"nd347","n":"32","t":"Sửa đổi, bổ sung khoản 3, khoản 4 Điều 18","k":"제18조 제3항, 제4항의 개정·보충","c":"제3장 시행령 106/2025 개정","x":"1. Sửa đổi, bổ sung khoản 3 như sau:\n“3. Phạt tiền từ 30.000.000 đồng đến 50.000.000 đồng đối với hành vi đưa công trình, hạng mục công trình, phương tiện giao thông đã được thẩm duyệt thiết kế hoặc thẩm định thiết kế về phòng cháy và chữa cháy vào khai thác, sử dụng khi chủ đầu tư, chủ sở hữu công trình, chủ phương tiện giao thông chưa hoàn thành việc tổ chức nghiệm thu về phòng cháy và chữa cháy theo quy định.”.\n2. Sửa đổi, bổ sung khoản 4 như sau:\n“4. Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với hành vi đưa công trình, hạng mục công trình, phương tiện giao thông thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy vào khai thác, sử dụng khi chưa có văn bản thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan quản lý chuyên ngành.”.","y":"1. 제3항을 다음과 같이 개정·보충한다:\n“3. 발주자(투자자), 건축물 소유자, 교통수단 소유자가 규정에 따른 소방 준공검사(인수검사)의 실시를 완료하지 아니한 때에, 소방 설계 심의승인(thẩm duyệt) 또는 소방 설계 심사를 받은 건축물, 건축물의 부분 공사(공종), 교통수단을 운영·사용에 투입하는 행위에 대하여 30.000.000동 이상 50.000.000동 이하의 과태료를 부과한다.”.\n2. 제4항을 다음과 같이 개정·보충한다:\n“4. 전문 분야 관리기관의 소방 설계 심사 문서가 아직 없는 때에, 소방 설계 심사 대상에 해당하는 건축물, 건축물의 부분 공사(공종), 교통수단을 운영·사용에 투입하는 행위에 대하여 40.000.000동 이상 50.000.000동 이하의 과태료를 부과한다.”.","o":[]},{"id":"nd347-39","d":"nd347","n":"39","t":"Bãi bỏ Điều 74 Nghị định số 217/2026/NĐ-CP ngày 19 tháng 6 năm 2026 của Chính phủ quy định chi tiết một số điều của Luật Xây dựng về quản lý hoạt động xây dựng.","k":"건설 활동 관리에 관한 「건설법」의 일부 조항을 상세히 규정하는 정부의 2026년 6월 19일자 시행령 제217/2026/NĐ-CP호 제74조의 폐지.","c":"제5장 시행 조항","x":"","y":"","o":[]},{"id":"nd347-40","d":"nd347","n":"40","t":"Điều khoản chuyển tiếp","k":"경과 규정","c":"제5장 시행 조항","x":"1. Đối với hồ sơ đề nghị giải quyết thủ tục hành chính được đơn giản hóa theo quy định tại Nghị định này đã được cơ quan có thẩm quyền tiếp nhận hoặc đã được đóng dấu bưu chính trước ngày Nghị định này có hiệu lực thi hành thì thực hiện theo quy định của pháp luật đang có hiệu lực điều chỉnh trong lĩnh vực đó tại thời điểm hồ sơ được tiếp nhận.\n2. Đối với hồ sơ đề nghị giải quyết thủ tục hành chính đã được bãi bỏ theo quy định tại Nghị định này đã được cơ quan có thẩm quyền tiếp nhận hoặc đã được đóng dấu bưu chính trước ngày Nghị định này có hiệu lực thi hành thì dừng việc giải quyết thủ tục hành chính, hoàn trả hồ sơ cho cá nhân, tổ chức nếu có yêu cầu.\n3. Văn bản, giấy tờ đã được cơ quan, người có thẩm quyền ban hành, cấp trước ngày Nghị định này có hiệu lực thi hành mà chưa hết hiệu lực hoặc chưa hết thời hạn sử dụng thì tiếp tục được áp dụng, sử dụng theo quy định của pháp luật cho đến khi hết thời hạn.\n4. Hồ sơ đề nghị cấp Giấy phép lưu thông phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ và vật liệu, cấu kiện ngăn cháy, chống cháy đã được tiếp nhận trước ngày Nghị định này có hiệu lực thi hành nhưng chưa được giải quyết thì cơ quan có thẩm quyền hướng dẫn cơ quan, tổ chức, cá nhân thực hiện kê khai thông tin theo quy định tại Điều 21 Nghị định này.","y":"1. 이 시행령의 규정에 따라 간소화된 행정절차의 처리 신청 서류로서 이 시행령의 시행일 전에 권한 있는 기관이 접수하였거나 우편 소인이 찍힌 것은 서류가 접수된 시점에 해당 분야를 규율하는 현행 유효한 법령의 규정에 따라 처리한다.\n2. 이 시행령의 규정에 따라 폐지된 행정절차의 처리 신청 서류로서 이 시행령의 시행일 전에 권한 있는 기관이 접수하였거나 우편 소인이 찍힌 것은 행정절차의 처리를 중지하고, 요청이 있는 경우 개인·조직에게 서류를 반환한다.\n3. 이 시행령의 시행일 전에 권한 있는 기관·사람이 발행·발급한 문서·서류로서 아직 효력이 만료되지 아니하였거나 사용 기한이 만료되지 아니한 것은 기한이 만료될 때까지 법령의 규정에 따라 계속 적용·사용된다.\n4. 소방 및 구조·구난 장비·설비와 방화(구획)·내화 자재·부재의 유통 허가증 발급 신청 서류로서 이 시행령의 시행일 전에 접수되었으나 아직 처리되지 아니한 것은 권한 있는 기관이 기관·조직·개인에게 이 시행령 제21조의 규정에 따라 정보 신고를 하도록 안내한다.","o":[]},{"id":"nd347-41","d":"nd347","n":"41","t":"Hiệu lực thi hành","k":"시행일(효력)","c":"제5장 시행 조항","x":"1. Nghị định này có hiệu lực thi hành kể từ ngày 15 tháng 9 năm 2026.\n2. Đối với việc kê khai thông tin, quản lý chất lượng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ trong sản xuất, lắp ráp, nhập khẩu và lưu thông trên thị trường được quy định tại khoản 2 Điều 10; Điều 21; khoản 2 Điều 26; khoản 2, khoản 3\nĐiều 30 ; khoản 2, khoản 6 Điều 31; khoản 4 Điều 40 có hiệu lực thi hành cùng thời điểm Luật sửa đổi, bổ sung một số điều của Luật Quản lý, sử dụng vũ khí, vật liệu nổ và công cụ hỗ trợ, Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ có hiệu lực.","y":"1. 이 시행령은 2026년 9월 15일부터 시행한다.\n2. 생산, 조립, 수입 및 시장 유통에서의 소방 및 구조·구난 장비·설비의 정보 신고, 품질 관리에 관하여 다음에 규정된 사항: 제10조 제2항; 제21조; 제26조 제2항; 제2항, 제3항\n제30조; 제31조 제2항, 제6항; 제40조 제4항은 「무기, 폭약류(폭발물) 및 보조도구(지원장구)의 관리·사용법」, 「소방 및 구조·구난법」의 일부 조항을 개정·보충하는 법이 효력을 발생하는 시점과 동시에 시행한다.","o":[["Cụm từ '', khoản 4''được bổ sung bởi Điều 50 Nghị định số 392/2026/NĐ-CP",""]]},{"id":"nd347-42","d":"nd347","n":"42","t":"Tổ chức thực hiện","k":"시행 조직","c":"제5장 시행 조항","x":"1. Bộ trưởng Bộ Công an có trách nhiệm:\na) Chủ trì, hướng dẫn, kiểm tra, đôn đốc việc tổ chức thực hiện Nghị định này;\nb) Rà soát, công bố, công khai thủ tục hành chính được sửa đổi, bổ sung, thay thế, bãi bỏ theo quy định của pháp luật về kiểm soát thủ tục hành chính;\nc) Rà soát, sửa đổi, bổ sung, thay thế hoặc bãi bỏ theo thẩm quyền biểu mẫu, quy trình nội bộ, quy trình điện tử, dịch vụ công trực tuyến, cơ sở dữ liệu, phần mềm nghiệp vụ có liên quan để bảo đảm thống nhất với quy định của Nghị định này;\nd) Tổ chức cập nhật, đồng bộ thông tin về việc cắt giảm, đơn giản hóa thủ tục hành chính, điều kiện kinh doanh trên Cổng Dịch vụ công quốc gia, Hệ thống thông tin giải quyết thủ tục hành chính của Bộ Công an và Cơ sở dữ liệu quốc gia về thủ tục hành chính.\n2. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này.","y":"1. 공안부 장관은 다음의 책임이 있다:\na) 이 시행령의 시행 조직을 주관, 안내, 점검, 독려한다;\nb) 행정절차 통제 관련 법령의 규정에 따라 개정·보충·대체·폐지된 행정절차를 검토, 공표, 공개한다;\nc) 이 시행령의 규정과의 통일성을 보장하기 위하여 관련 서식, 내부 절차, 전자 절차, 온라인 공공서비스, 데이터베이스, 업무용 소프트웨어를 권한에 따라 검토, 개정, 보충, 대체 또는 폐지한다;\nd) 국가 공공서비스 포털, 공안부 행정절차 처리 정보시스템 및 행정절차에 관한 국가 데이터베이스에 행정절차, 영업 조건의 감축·간소화에 관한 정보의 갱신·동기화를 조직한다.\n2. 각 부 장관, 부급 기관의 장, 각 성·시 인민위원회 위원장 및 관련 조직·개인은 이 시행령을 시행할 책임을 진다.","o":[]},{"id":"nd347-PLIII","d":"nd347","n":"PLIII","t":"DANH MỤC CÔNG TRÌNH, PHƯƠNG TIỆN GIAO THÔNG THUỘC DIỆN THẨM ĐỊNH THIẾT KẾ VỀ PHÒNG CHÁY VÀ CHỮA CHÁY DO CƠ QUAN QUẢN LÝ CHUYÊN NGÀNH THẨM ĐỊNH (Kèm theo Nghị định số 347/2026/NĐ-CP ngày 08 tháng 9 năm 2026 của Chính phủ) Công trình khi thiết kế, cải tạo, thay đổi công năng sử dụng, phương tiện giao thông khi sản xuất, lắp ráp, đóng mới, hoán cải trong danh mục dưới đây thuộc diện thẩm định thiết kế về phòng cháy và chữa cháy:","k":"전문 분야 관리기관이 심사하는 소방 설계 심사 대상 건축물, 교통수단 목록 (정부의 2026년 9월 08일자 시행령 제347/2026/NĐ-CP호에 첨부) 아래 목록에 있는 건축물을 설계, 개조, 사용 용도 변경하는 경우, 교통수단을 생산, 조립, 신조, 개조하는 경우 소방 설계 심사 대상에 해당한다:","c":"부록","x":"1. Công trình nhà ở: nhà chung cư, nhà ở tập thể cao từ 7 tầng trở lên hoặc có tổng diện tích sàn từ 3.000 m2 trở lên.\n2. Công trình giáo dục, đào tạo, nghiên cứu:\nCông trình độc lập hoặc tổ hợp các công trình sử dụng cho mục đích giáo dục, đào tạo, nghiên cứu trong các cơ sở sau: nhà trẻ, trường mầm non, trường mẫu giáo có từ 150 cháu trở lên hoặc có tổng diện tích sàn từ 2.000 m2 trở lên; trường tiểu học, trường trung học cơ sở, trường trung học phổ thông, trường phổ thông có nhiều cấp học, trường đại học, trường cao đẳng, trường trung học chuyên nghiệp, trường dạy nghề, trường công nhân kỹ thuật, trường nghiệp vụ và các loại trường hoặc trung tâm đào tạo khác, cơ sở nghiên cứu vũ trụ, các trung tâm cơ sở dữ liệu chuyên ngành và các cơ sở nghiên cứu chuyên ngành khác cao từ 5 tầng trở lên hoặc có tổng diện tích sàn từ 3.000 m2 trở lên.\n3. Công trình y tế:\nCông trình độc lập hoặc tổ hợp các công trình sử dụng cho mục đích khám bệnh, chữa bệnh trong các cơ sở sau: bệnh viện; phòng khám (đa khoa hoặc chuyên khoa), trạm y tế, nhà hộ sinh, cơ sở phòng chống dịch bệnh, cơ sở nghiên cứu, thí nghiệm chuyên ngành y tế, điều dưỡng, phục hồi chức năng, chỉnh hình, dưỡng lão, các cơ sở y tế khác cao từ 5 tầng trở lên hoặc có tổng diện tích sàn từ 2.000 m2 trở lên.\n4. Công trình thể thao: sân vận động có sức chứa của khán đài từ 5.000 chỗ ngồi trở lên; nhà thi đấu, nhà tập luyện các môn thể thao có khán đài từ 5.000 chỗ ngồi trở lên hoặc có tổng diện tích sàn từ 5.000 m2 trở lên.\n5. Công trình văn hóa: nhà hát, rạp chiếu phim, rạp xiếc có từ 300 chỗ ngồi trở lên; trung tâm hội nghị, nhà văn hóa, bảo tàng, thư viện, nhà triển lãm, nhà trưng bày cao từ 05 tầng trở lên hoặc có tổng diện tích sàn từ 3.000 m2 trở lên; công trình vui chơi, giải trí, công trình vũ trường, karaoke, các công trình văn hóa khác cao từ 4 tầng trở lên hoặc có tổng diện tích sàn từ 1.000 m2 trở lên.\n6. Công trình thương mại: trung tâm thương mại, siêu thị, chợ, cửa hàng kinh doanh hàng hoá dễ cháy có tổng diện tích sàn từ 2.000 m2 trở lên; nhà hàng, cửa hàng ăn uống có tổng diện tích sàn từ 3.000 m2 trở lên.\n7. Công trình cao từ 7 tầng trở lên hoặc có tổng diện tích sàn từ 3.000 m2 trở lên gồm:\na) Khách sạn, nhà khách, nhà nghỉ và các cơ sở dịch vụ lưu trú khác;\nb) Bưu điện, bưu cục, cơ sở cung cấp dịch vụ bưu chính, viễn thông khác;\nc) Tòa nhà sử dụng làm trụ sở, nhà làm việc.\n8. Công trình đa năng, công trình hỗn hợp (có từ 2 công năng trở lên, trừ công trình nhà ở riêng lẻ có kết hợp sản xuất, kinh doanh) trong đó có phần công trình có quy mô, công năng thuộc các mục 1 đến mục 7 Phụ lục này hoặc cao từ 7 tầng trở lên hoặc có tổng diện tích sàn từ 3.000 m2 trở lên.\n9. Công trình độc lập hoặc tổ hợp các công trình hoặc dây chuyền công nghệ sử dụng cho việc sản xuất các loại sản phẩm trong các dự án đầu tư xây dựng công trình, công trình sau đây:\na) Nhà máy lọc dầu; nhà máy hóa dầu; nhà máy lọc, hóa dầu; nhà máy chế biến khí; nhà máy sản xuất nhiên liệu sinh học; kho chứa dầu mỏ, sản phẩm dầu mỏ; kho chứa khí hóa lỏng; trạm chiết khí hóa lỏng; trạm phân phối khí; cửa hàng xăng dầu, trạm cấp xăng dầu nội bộ có từ 01 cột bơm trở lên;\nb) Nhà máy điện; trạm biến áp có điện áp từ 110 kV trở lên;\nc) Nhà máy sản xuất vật liệu nổ, tiền chất thuốc nổ công nghiệp, vũ khí, công cụ hỗ trợ; kho cố định chứa vật liệu nổ, tiền chất thuốc nổ công nghiệp, vũ khí, công cụ hỗ trợ;\nd) Công trình sản xuất công nghiệp khác có nhà phục vụ sản xuất thuộc hạng nguy hiểm cháy nổ A, B có khối tích từ 7.000 m3 trở lên hoặc tổng diện tích sàn từ 1.000 m2 trở lên; công trình sản xuất công nghiệp có nhà phục vụ sản xuất thuộc hạng nguy hiểm cháy C có khối tích từ 15.000 m3 trở lên hoặc tổng diện tích sàn từ 2.000 m2 trở lên; công trình sản xuất công nghiệp có nhà phục vụ sản xuất thuộc hạng nguy hiểm cháy D, E có khối tích từ 30.000 m3 trở lên hoặc tổng diện tích sàn từ 10.000 m2 trở lên.\n10. Nhà kho chứa hàng hóa có hạng nguy hiểm cháy và cháy nổ A, B, C có khối tích từ 15.000 m3 trở lên hoặc tổng diện tích sàn từ 2.000 m2 trở lên.\n11. Hạ tầng kỹ thuật của khu đô thị, khu nhà ở, khu công nghiệp, cụm công nghiệp, khu du lịch, khu nghiên cứu, đào tạo, khu thể dục, thể thao.\n12. Nhà để xe ô tô, xe máy, nhà trưng bày ô tô, xe máy dạng kín có tổng diện tích sàn từ 2.000 m2 trở lên.\n13. Nhà ga hành khách, nhà khách phục vụ ngoại giao, nhà ga hàng hóa thuộc cảng hàng không, nhà kỹ thuật máy bay, đài kiểm soát không lưu; cảng, bến thủy nội địa, bến cảng biển từ cấp III trở lên; bến xe khách, trung tâm đăng kiểm phương tiện giao thông, trạm dừng nghỉ, nhà sửa chữa, bảo dưỡng phương tiện giao thông cơ giới đường bộ, nhà sửa chữa phương tiện thủy nội địa, tàu biển có tổng diện tích sàn từ 3.000 m2 trở lên; nhà ga hành khách, nhà ga hàng hóa, đề-pô (depot) đường sắt, nhà ga cáp treo có tổng diện tích sàn từ 3.000 m2 trở lên.\n14. Hầm đường ô tô, hầm đường sắt, hầm tàu điện ngầm có chiều dài từ 1.000 m trở lên.\n15. Công trình thuộc cơ sở hạt nhân.\n16. Phương tiện giao thông được sản xuất, lắp ráp, đóng mới, hoán cải để vận tải hành khách, xăng, dầu, chất lỏng dễ cháy, khí cháy, vật liệu nổ, hóa chất có nguy hiểm về cháy, nổ thuộc các trường hợp sau:\na) Phương tiện đường thủy nội địa:\n- Phương tiện có sức chở người từ 50 người trở lên;\n- Phương tiện từ 500 GT trở lên;\n- Phương tiện có động cơ tổng công suất máy chính từ 300 sức ngựa trở lên.\nb) Tàu biển Việt Nam không hoạt động tuyến quốc tế từ 500 GT trở lên./.\n* Ghi chú:\n- Tổng diện tích sàn được xác định đối với nhà có quy mô lớn nhất của dự án đầu tư xây dựng công trình, công trình;\n- Công trình, hạng mục công trình không thuộc diện thẩm định thiết kế về phòng cháy và chữa cháy triển khai thiết kế đồng thời với công trình quy định tại Phụ lục này trong dự án đầu tư xây dựng và có sử dụng chung hệ thống báo cháy tự động hoặc hệ thống chữa cháy với công trình thuộc diện thẩm định thiết kế về phòng cháy và chữa cháy thì phải thẩm định thiết kế về phòng cháy và chữa cháy đối với các nội dung quy định tại điểm a, điểm b khoản 2 Điều 9 Nghị định này;\n- Nhà ở riêng lẻ có kết hợp sản xuất, kinh doanh là nhà ở được xây dựng theo quy định của pháp luật về nhà ở và pháp luật về xây dựng;\n- Cấp công trình xác định theo quy định của pháp luật về xây dựng;\n- GT: tổng dung tích của phương tiện theo pháp luật về hàng hải.","y":"1. 주거용 건축물: 높이 7층 이상이거나 총 바닥면적 3.000 m2 이상인 아파트(공동주택), 집합주택(기숙형 공동주택).\n2. 교육, 훈련, 연구용 건축물:\n다음 시설에서 교육, 훈련, 연구 목적으로 사용되는 독립 건축물 또는 건축물 복합체: 원아 150명 이상이거나 총 바닥면적 2.000 m2 이상인 어린이집, 유아학교, 유치원; 높이 5층 이상이거나 총 바닥면적 3.000 m2 이상인 초등학교, 중학교, 고등학교, 여러 학교급이 있는 일반학교, 대학교, 전문대학, 중등직업학교, 직업훈련학교, 기술공 학교, 직무학교 및 그 밖의 각종 학교 또는 훈련센터, 우주 연구시설, 전문 분야 데이터베이스 센터 및 그 밖의 전문 분야 연구시설.\n3. 의료용 건축물:\n다음 시설에서 진료·치료 목적으로 사용되는 독립 건축물 또는 건축물 복합체: 병원; 높이 5층 이상이거나 총 바닥면적 2.000 m2 이상인 진료소(종합 또는 전문), 보건소, 조산원, 전염병 예방·방역 시설, 보건의료 분야 연구·실험 시설, 요양시설, 재활시설, 정형시설, 양로시설, 그 밖의 의료시설.\n4. 체육용 건축물: 관람석 수용 능력이 5.000석 이상인 경기장(스타디움); 관람석 5.000석 이상이거나 총 바닥면적 5.000 m2 이상인 경기용 체육관, 각종 스포츠 종목 훈련관.\n5. 문화용 건축물: 좌석 300석 이상인 극장, 영화관, 서커스장; 높이 05층 이상이거나 총 바닥면적 3.000 m2 이상인 회의센터(컨벤션센터), 문화회관, 박물관, 도서관, 전시관, 진열관; 높이 4층 이상이거나 총 바닥면적 1.000 m2 이상인 오락·유흥 건축물, 무도장(클럽)·노래방(가라오케) 건축물, 그 밖의 문화용 건축물.\n6. 상업용 건축물: 총 바닥면적 2.000 m2 이상인 상업센터(쇼핑센터), 슈퍼마켓, 시장, 가연성(쉽게 타는) 상품 판매점; 총 바닥면적 3.000 m2 이상인 식당(레스토랑), 음식점.\n7. 높이 7층 이상이거나 총 바닥면적 3.000 m2 이상인 다음의 건축물:\na) 호텔, 영빈관(게스트하우스), 여관 및 그 밖의 숙박 서비스 시설;\nb) 우체국, 우편취급국, 그 밖의 우편·통신 서비스 제공 시설;\nc) 본사·청사, 업무용 건물로 사용되는 빌딩.\n8. 다목적 건축물, 복합 건축물(2개 이상의 용도가 있는 것. 다만, 생산·영업을 겸하는 단독주택 건축물은 제외한다)로서 그중 이 부록 제1목부터 제7목까지에 해당하는 규모·용도의 건축물 부분이 있거나, 높이 7층 이상이거나 총 바닥면적 3.000 m2 이상인 것.\n9. 다음의 건설투자 사업(프로젝트), 건축물에서 각종 제품의 생산에 사용되는 독립 건축물 또는 건축물 복합체 또는 공정 라인(기술 라인):\na) 정유공장; 석유화학공장; 정유·석유화학공장; 가스 처리공장; 바이오연료 생산공장; 석유·석유제품 저장창고; 액화가스 저장창고; 액화가스 충전소; 가스 분배소; 주유기 01기 이상이 있는 주유소(석유류 판매점), 내부용 석유류 급유소;\nb) 발전소; 전압 110 kV 이상의 변전소;\nc) 폭약류(폭발물), 산업용 폭약 전구물질, 무기, 보조도구(지원장구)의 생산공장; 폭약류(폭발물), 산업용 폭약 전구물질, 무기, 보조도구(지원장구)를 보관하는 고정 창고;\nd) 화재·폭발 위험 등급 A, B에 해당하는 생산용 건물이 있고 체적 7.000 m3 이상이거나 총 바닥면적 1.000 m2 이상인 그 밖의 공업 생산 건축물; 화재 위험 등급 C에 해당하는 생산용 건물이 있고 체적 15.000 m3 이상이거나 총 바닥면적 2.000 m2 이상인 공업 생산 건축물; 화재 위험 등급 D, E에 해당하는 생산용 건물이 있고 체적 30.000 m3 이상이거나 총 바닥면적 10.000 m2 이상인 공업 생산 건축물.\n10. 체적 15.000 m3 이상이거나 총 바닥면적 2.000 m2 이상인, 화재 및 화재·폭발 위험 등급 A, B, C의 화물을 보관하는 창고 건물.\n11. 도시구역(신도시), 주거단지, 공단(산업단지), 산업클러스터, 관광단지, 연구·훈련단지, 체육·스포츠단지의 기술 기반시설.\n12. 총 바닥면적 2.000 m2 이상인 밀폐형 자동차·오토바이 주차건물, 자동차·오토바이 전시장.\n13. 공항(항공항)에 속한 여객터미널, 외교용 영빈관(귀빈실), 화물터미널, 항공기 정비동(격납고), 항공교통 관제탑; III급 이상의 내수로 항만·부두, 해항 부두; 총 바닥면적 3.000 m2 이상인 여객버스 터미널, 교통수단 등록검사센터, 휴게소, 도로 자동차(원동기 교통수단) 수리·정비동, 내수로 선박·해상 선박 수리동; 총 바닥면적 3.000 m2 이상인 철도 여객역사, 화물역사, 차량기지(depot), 케이블카 역사.\n14. 길이 1.000 m 이상인 자동차도로 터널, 철도 터널, 지하철 터널.\n15. 원자력(핵) 시설에 속한 건축물.\n16. 여객, 휘발유, 유류, 인화성 액체, 가연성 가스, 폭약류(폭발물), 화재·폭발 위험이 있는 화학물질을 운송하기 위하여 생산, 조립, 신조, 개조되는 교통수단으로서 다음의 경우에 해당하는 것:\na) 내수로 선박:\n- 승선 정원(사람 수송 능력)이 50명 이상인 선박;\n- 500 GT 이상인 선박;\n- 주기관 총 출력 300마력 이상의 엔진이 있는 선박.\nb) 국제 항로를 운항하지 아니하는 500 GT 이상의 베트남 해상 선박./.\n* 비고:\n- 총 바닥면적은 건설투자 사업(프로젝트), 건축물 중 규모가 가장 큰 건물을 기준으로 산정한다;\n- 소방 설계 심사 대상에 해당하지 아니하는 건축물, 건축물의 부분 공사(공종)로서 건설투자 사업(프로젝트)에서 이 부록에 규정된 건축물과 동시에 설계를 전개하고 소방 설계 심사 대상 건축물과 자동 화재경보 설비 또는 소화 설비를 공동으로 사용하는 것은 이 시행령 제9조 제2항 a호, b호에 규정된 내용에 대하여 소방 설계 심사를 받아야 한다;\n- 생산·영업을 겸하는 단독주택은 주택 관련 법령 및 건설 관련 법령의 규정에 따라 건설된 주택이다;\n- 건축물의 등급은 건설 관련 법령의 규정에 따라 정한다;\n- GT: 해사 관련 법령에 따른 선박의 총톤수.","o":[]},{"id":"nd347-PLIV","d":"nd347","n":"PLIV","t":"DANH MỤC PHƯƠNG TIỆN PHÒNG CHÁY, CHỮA CHÁY, CỨU NẠN, CỨU HỘ (Kèm theo Nghị định số 347/2026/NĐ-CP ngày 08 tháng 9 năm 2026 của Chính phủ)","k":"소방 및 구조·구난 장비·설비 목록 (정부의 2026년 9월 8일자 시행령 347/2026/NĐ-CP 에 첨부)","c":"부록","x":"1. Phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới:\na) Xe chữa cháy: xe chữa cháy có xitec; xe chữa cháy không có xitec; xe chữa cháy sân bay; xe chữa cháy rừng; xe chữa cháy hóa chất (bột, chất tạo bọt, khí); xe chữa cháy đường hầm; xe chữa cháy đường sắt; xe chữa cháy lưỡng cư;\nb) Các loại xe chuyên dùng phục vụ chữa cháy, cứu nạn, cứu hộ: xe thang; xe nâng; xe trung tâm thông tin chỉ huy; xe khám nghiệm hiện trường cháy; xe chiếu sáng chữa cháy, cứu nạn, cứu hộ; xe trạm bơm; xe chở nước; xe chở phương tiện; xe chở hóa chất; xe cứu nạn, cứu hộ; xe hút khói; xe sửa chữa, bảo dưỡng kỹ thuật; xe xử lý hóa chất độc hại, sinh học và hạt nhân; xe cung cấp chất khí chữa cháy; xe chở và nạp bình khí thở chữa cháy, cứu nạn, cứu hộ;\nc) Máy bay chữa cháy; trực thăng phục vụ chữa cháy, cứu nạn, cứu hộ; phương tiện bay không người lái chữa cháy, cứu nạn, cứu hộ; tàu chữa cháy; xuồng chữa cháy, cứu nạn, cứu hộ; ca nô chữa cháy, cứu nạn, cứu hộ; robot chữa cháy, cứu nạn, cứu hộ; mô tô chữa cháy;\nd) Máy bơm chữa cháy các loại; bơm của hệ thống chuyên dùng trên xe chữa cháy;\nđ) Các loại phương tiện cơ giới khác phục vụ công tác chữa cháy, cứu nạn, cứu hộ: máy nạp khí sạch; thiết bị chữa cháy đeo vai có động cơ; thiết bị cưa, cắt, khoan, đục, đập, tời, kéo, banh, kích, nâng (có sử dụng động cơ); thiết bị xử lý thực bì (máy cắt thực bì, máy cắt cỏ); máy phát điện; quạt thổi khói; quạt hút khói; máy thổi gió.\n2. Phương tiện chữa cháy thông dụng: vòi, ống hút chữa cháy; lăng chữa cháy; đầu nối; ba chạc chữa cháy; hai chạc chữa cháy; ezectơ; trụ nước chữa cháy; cột lấy nước chữa cháy; thang chữa cháy; bình chữa cháy các loại.\n3. Chất chữa cháy các loại: hóa chất chữa cháy gốc nước; bột chữa cháy; khí chữa cháy; chất tạo bọt chữa cháy.\n4. Thiết bị báo cháy độc lập; thiết bị thuộc hệ thống báo cháy: tủ trung tâm báo cháy; đầu báo cháy các loại; thiết bị truyền tin báo cháy; mô - đun (module) các loại; chuông báo cháy; đèn báo cháy; nút ấn báo cháy.\n5. Thiết bị thuộc hệ thống loa thông báo và hướng dẫn thoát nạn: thiết bị điều khiển hệ thống âm thanh; mi-cờ-rô-phôn (microphone); thiết bị truyền tín hiệu; loa.\n6. Thiết bị thuộc hệ thống chữa cháy (bằng khí, sol-khí, nước, bột, bọt, chất chữa cháy gốc nước): tủ điều khiển chữa cháy; chuông, còi, đèn, bảng hiển thị cảnh báo xả chất chữa cháy; van báo động; van tràn ngập; van giám sát; van chọn vùng; công tắc áp lực; công tắc dòng chảy; ống phi kim loại dùng trong hệ thống cấp nước chữa cháy tự động; ống mềm dùng cho đầu phun chữa cháy; họng tiếp nước chữa cháy (họng chờ); đầu phun chất chữa cháy các loại; chai, thiết bị chứa khí, sol-khí, bột, bọt, chất chữa cháy gốc nước các loại.\n7. Đèn, phương tiện chiếu sáng sự cố, chỉ dẫn thoát nạn.\n8. Trang phục và thiết bị bảo hộ cá nhân phục vụ công tác chữa cháy, cứu nạn, cứu hộ: quần, áo, mũ, giày, ủng, găng tay, thắt lưng, kính, khẩu trang chữa cháy; quần, áo, mũ, giày, ủng, găng tay, cách nhiệt; ủng, găng tay cách điện; đèn, thiết bị chiếu sáng (loại cầm tay hoặc gắn trên trang phục); mặt nạ lọc độc (gồm mặt trùm, bộ lọc, các thiết bị phụ trợ đi kèm); mặt nạ phòng độc cách ly (gồm bình khí, van điều áp, mặt trùm, dây đeo và khung đỡ, đồng hồ đo áp, van cấp khí, thiết bị cảnh báo, các thiết bị phụ trợ đi kèm); thiết bị định vị cầm tay.\n9. Phương tiện cứu người: dây cứu nạn, cứu hộ; đai cứu nạn, cứu hộ; đệm cứu người; thang cứu người; ống tụt cứu người; thiết bị dò tìm người.\n10. Phương tiện, thiết bị phục vụ cứu nạn, cứu hộ: trên cao; dưới nước; trong không gian hạn chế; sự cố hóa chất (quần, áo, mũ, giày, ủng, găng tay, thiết bị bảo vệ hô hấp, máy phân tích nồng độ hóa chất, các thiết bị phụ trợ đi kèm); sự cố phóng xạ (quần, áo, mũ, giày, ủng, găng tay, thiết bị bảo vệ hô hấp, máy đo cường độ phóng xạ, các thiết bị phụ trợ đi kèm); thiết bị phục vụ sơ cứu người bị nạn.\n11. Phương tiện, dụng cụ phá dỡ thô sơ: kìm; cưa; búa; rìu; cuốc; xẻng; xà beng; dụng cụ phá dỡ đa năng.\n12. Phương tiện, thiết bị thông tin liên lạc phục vụ chữa cháy, cứu nạn cứu hộ: bộ đàm; thiết bị của hệ thống thông tin hữu tuyến; thiết bị của hệ thống thông tin vô tuyến; các thiết bị giám sát phục vụ chữa cháy.","y":"1. 동력식 화재진압, 구조·구난 장비:\na) 소방차: 물탱크가 있는 소방차; 물탱크가 없는 소방차; 공항 소방차; 산림 소방차; 화학 소방차(분말, 포 소화약제, 가스); 터널 소방차; 철도 소방차; 수륙양용 소방차;\nb) 화재진압, 구조·구난을 지원하는 각종 특수차량: 사다리차; 고소작업차(굴절차); 지휘통신 센터 차량; 화재 현장 감식 차량; 화재진압, 구조·구난용 조명차; 펌프 스테이션 차량; 급수차; 장비 운반차; 화학약제 운반차; 구조·구난차; 배연차; 기술 수리·정비 차량; 유독 화학물질, 생물 및 핵 처리 차량; 소화가스 공급 차량; 화재진압, 구조·구난용 공기호흡기 용기 운반 및 충전 차량;\nc) 소방 항공기; 화재진압, 구조·구난용 헬리콥터; 화재진압, 구조·구난용 무인비행장치; 소방선; 화재진압, 구조·구난용 보트; 화재진압, 구조·구난용 카누(모터보트); 화재진압, 구조·구난용 로봇; 소방 오토바이;\nd) 각종 소방펌프; 소방차에 탑재된 전용 시스템의 펌프;\nđ) 화재진압, 구조·구난 업무를 지원하는 그 밖의 각종 동력식 장비: 청정 공기 충전기; 엔진이 달린 배낭식(어깨 착용식) 소화 장치; 톱질, 절단, 천공, 끌질, 파쇄, 윈치, 견인, 확장, 잭, 인양 장치(엔진을 사용하는 것); 지피식생 처리 장치(지피식생 절단기, 예초기); 발전기; 송연기(연기 송풍기); 배연기(연기 흡입기); 송풍기.\n2. 일반 화재진압 장비: 소방호스, 소방 흡수관; 소방 관창; 연결구(커플링); 소방용 3구 분기관; 소방용 2구 분기관; 이젝터; 소화전(지상식); 소방용수 취수 기둥; 소방 사다리; 각종 소화기.\n3. 각종 소화약제: 수계 소화약제; 소화 분말; 소화 가스; 포 소화약제.\n4. 단독형 화재경보 장치; 화재경보 설비에 속하는 장치: 화재경보 수신반(중앙 제어반); 각종 화재감지기; 화재 신호 전송 장치; 각종 모듈(module); 화재경보 벨; 화재경보등; 화재경보 발신기(누름 버튼).\n5. 안내 방송 및 피난 유도 스피커 설비에 속하는 장치: 음향 설비 제어 장치; 마이크로폰(microphone); 신호 전송 장치; 스피커.\n6. 소화 설비(가스, 에어로졸, 물, 분말, 포, 수계 소화약제에 의한 것)에 속하는 장치: 소화 제어반; 소화약제 방출 경고 벨, 사이렌, 등, 표시판; 경보 밸브; 일제개방 밸브(델류지 밸브); 감시 밸브; 구역 선택 밸브; 압력 스위치; 유수 스위치(플로 스위치); 자동 소화용수 공급 설비에 사용하는 비금속 배관; 소화 헤드용 플렉시블 호스; 소방용수 송수구(연결송수구); 각종 소화약제 방출 헤드; 각종 가스, 에어로졸, 분말, 포, 수계 소화약제 용기 및 저장 장치.\n7. 비상 조명, 피난 유도용 등 및 장비.\n8. 화재진압, 구조·구난 업무용 복장 및 개인 보호 장비: 화재진압용 바지, 상의, 모자(헬멧), 신발, 장화, 장갑, 벨트, 보안경, 마스크; 단열(방열) 바지, 상의, 모자(헬멧), 신발, 장화, 장갑; 절연 장화, 절연 장갑; 등, 조명 장치(휴대형 또는 복장 부착형); 방독 여과 마스크(면체, 정화통, 부속 보조 장치 포함); 격리식 방독 마스크(공기 용기, 압력조정 밸브, 면체, 멜빵 및 지지 프레임, 압력계, 공기 공급 밸브, 경보 장치, 부속 보조 장치 포함); 휴대용 위치 확인 장치.\n9. 인명 구조 장비: 구조·구난용 로프; 구조·구난용 벨트(안전대); 인명 구조용 매트; 인명 구조용 사다리; 인명 구조용 미끄럼 강하관(구조대); 인명 탐지 장치.\n10. 구조·구난용 장비·설비: 고소; 수중; 제한된 공간 내; 화학 사고(바지, 상의, 모자, 신발, 장화, 장갑, 호흡 보호 장치, 화학물질 농도 분석기, 부속 보조 장치); 방사능 사고(바지, 상의, 모자, 신발, 장화, 장갑, 호흡 보호 장치, 방사선 강도 측정기, 부속 보조 장치); 피해자 응급처치용 장치.\n11. 수동식 파괴 장비·도구: 펜치(집게); 톱; 망치; 도끼; 괭이; 삽; 쇠지렛대; 다목적 파괴 도구.\n12. 화재진압, 구조·구난용 통신 장비·설비: 무전기; 유선 통신 시스템의 장치; 무선 통신 시스템의 장치; 화재진압을 지원하는 각종 감시 장치.","o":[]},{"id":"nd106-1","d":"nd106","n":"1","t":"Phạm vi điều chỉnh","k":"적용 범위","c":"제1장 총칙","x":"1. Nghị định này quy định xử phạt vi phạm hành chính trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ, bao gồm: hành vi vi phạm hành chính, hình thức, mức xử phạt, biện pháp khắc phục hậu quả đối với từng hành vi vi phạm hành chính, thẩm quyền lập biên bản, thẩm quyền xử phạt, mức phạt tiền cụ thể theo từng chức danh đối với hành vi vi phạm hành chính trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ.\n2. Các hành vi vi phạm hành chính trong lĩnh vực quản lý nhà nước khác liên quan đến lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ mà không quy định tại Nghị định này thì áp dụng quy định tại các Nghị định quy định về xử phạt vi phạm hành chính trong các lĩnh vực đó để xử phạt.\n3. Đối với các hành vi vi phạm về phòng cháy, chữa cháy rừng thực hiện theo quy định tại Nghị định quy định xử phạt vi phạm hành chính trong lĩnh vực lâm nghiệp. Trường hợp các hành vi vi phạm hành chính về phòng cháy, chữa cháy rừng không được quy định tại Nghị định quy định xử phạt vi phạm hành chính trong lĩnh vực lâm nghiệp thì thực hiện xử phạt theo quy định tại Nghị định này.","y":"1. 이 시행령은 소방 및 구조·구난 분야의 행정위반 처벌에 관하여 규정하며, 다음을 포함한다: 행정위반 행위, 각 행정위반 행위에 대한 처벌 형식, 처벌 수준, 시정조치(결과 복구 조치), 조서 작성 권한, 처벌 권한, 소방 및 구조·구난 분야의 행정위반 행위에 대한 직위별 구체적인 과태료 수준.\n2. 소방 및 구조·구난 분야와 관련된 그 밖의 국가관리 분야의 행정위반 행위로서 이 시행령에 규정되지 아니한 것은 해당 분야의 행정위반 처벌을 규정하는 각 시행령의 규정을 적용하여 처벌한다.\n3. 산림 소방(화재예방·진압)에 관한 위반 행위에 대하여는 임업 분야의 행정위반 처벌을 규정하는 시행령의 규정에 따라 시행한다. 산림 소방(화재예방·진압)에 관한 행정위반 행위가 임업 분야의 행정위반 처벌을 규정하는 시행령에 규정되지 아니한 경우에는 이 시행령의 규정에 따라 처벌한다.","o":[]},{"id":"nd106-2","d":"nd106","n":"2","t":"Đối tượng áp dụng","k":"적용 대상","c":"제1장 총칙","x":"1. Cá nhân, tổ chức Việt Nam; cá nhân, tổ chức nước ngoài có hành vi vi phạm hành chính trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ trong phạm vi lãnh thổ, vùng nội thủy, lãnh hải, vùng tiếp giáp lãnh hải, vùng đặc quyền kinh tế và thềm lục địa của nước Cộng hòa xã hội chủ nghĩa Việt Nam; trên tàu bay mang quốc tịch Việt Nam, tàu biển mang cờ quốc tịch Việt Nam, trừ trường hợp điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên có quy định khác.\n2. Tổ chức quy định tại khoản 1 Điều này bao gồm:\na) Tổ chức kinh tế được thành lập theo quy định của Luật Doanh nghiệp gồm: Doanh nghiệp tư nhân, công ty cổ phần, công ty trách nhiệm hữu hạn, công ty hợp danh và các đơn vị phụ thuộc doanh nghiệp;\nb) Tổ chức kinh tế được thành lập theo quy định của Luật Hợp tác xã gồm: Hợp tác xã, liên hiệp hợp tác xã, tổ hợp tác và các đơn vị phụ thuộc Hợp tác xã;\nc) Tổ chức được thành lập theo quy định của Luật Đầu tư gồm: Nhà đầu tư trong nước, nhà đầu tư nước ngoài (trừ cá nhân) và tổ chức kinh tế có vốn đầu tư nước ngoài;\nd) Tổ chức được thành lập theo quy định của Luật Thương mại;\nđ) Tổ chức chính trị, tổ chức chính trị - xã hội, tổ chức xã hội, tổ chức xã hội - nghề nghiệp;\ne) Cơ quan nhà nước;\ng) Đơn vị sự nghiệp;\nh) Ban Quản trị nhà chung cư hoạt động theo mô hình ban quản trị, có tư cách pháp nhân;\ni) Tổ chức được giao trực tiếp quản lý cơ sở theo quy định tại Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ;\nk) Các tổ chức khác được thành lập theo quy định của pháp luật.\n3. Người có thẩm quyền lập biên bản vi phạm, thẩm quyền xử phạt vi phạm hành chính và tổ chức, cá nhân có liên quan đến việc xử phạt vi phạm hành chính trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ theo quy định tại Nghị định này.","y":"1. 베트남 사회주의 공화국의 영토, 내수, 영해, 접속수역, 배타적 경제수역 및 대륙붕의 범위 안에서; 베트남 국적의 항공기, 베트남 국적기를 게양한 선박에서 소방 및 구조·구난 분야의 행정위반 행위를 한 베트남 개인, 조직; 외국 개인, 조직. 다만, 베트남 사회주의 공화국이 회원국인 국제조약에 달리 규정된 경우는 제외한다.\n2. 이 조 제1항에 규정된 조직은 다음을 포함한다:\na) 「기업법」의 규정에 따라 설립된 경제조직으로서 다음을 포함한다: 개인기업, 주식회사, 유한책임회사, 합명회사 및 기업의 종속 단위;\nb) 「협동조합법」의 규정에 따라 설립된 경제조직으로서 다음을 포함한다: 협동조합, 협동조합연합회, 협동조(협력조) 및 협동조합의 종속 단위;\nc) 「투자법」의 규정에 따라 설립된 조직으로서 다음을 포함한다: 국내 투자자, 외국 투자자(개인 제외) 및 외국인투자 경제조직;\nd) 「상법」의 규정에 따라 설립된 조직;\nđ) 정치조직, 정치·사회조직, 사회조직, 사회·직업조직;\ne) 국가기관;\ng) 사업단위(공공서비스 단위);\nh) 관리위원회 모델로 운영되며 법인격을 가진 공동주택(아파트) 관리위원회;\ni) 「소방 및 구조·구난법」의 규정에 따라 사업장을 직접 관리하도록 위임받은 조직;\nk) 법률의 규정에 따라 설립된 그 밖의 조직.\n3. 이 시행령의 규정에 따른 위반 조서 작성 권한자, 행정위반 처벌 권한자 및 소방 및 구조·구난 분야의 행정위반 처벌과 관련된 조직, 개인.","o":[["Điểm i khoản 2 Điều 2 được sửa đổi, bổ sung bởi Điều 1 Nghị định số 69/2026/NĐ-CP","nd69-1"]]},{"id":"nd106-3","d":"nd106","n":"3","t":"Hình thức xử phạt vi phạm hành chính và biện pháp khắc phục hậu quả","k":"행정위반 처벌 형식 및 시정조치(결과 복구 조치)","c":"제1장 총칙","x":"1. Các hình thức xử phạt chính trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ bao gồm:\na) Cảnh cáo;\nb) Phạt tiền.\n2. Các hình thức xử phạt bổ sung trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ bao gồm:\na) Đình chỉ hoạt động có thời hạn;\nb) Tịch thu tang vật vi phạm hành chính;\nc) Tước quyền sử dụng giấy phép là văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy từ 06 tháng đến 12 tháng.\n3. Các biện pháp khắc phục hậu quả trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ bao gồm:\na) Biện pháp khắc phục hậu quả quy định tại điểm a khoản 1 Điều 28 Luật Xử lý vi phạm hành chính;\nb) Các biện pháp khác được quy định cụ thể tại Nghị định này.\n4. Thủ tục thi hành biện pháp khắc phục hậu quả buộc nộp lại giấy phép bị tẩy xóa, sửa chữa làm sai lệch nội dung:\na) Người có thẩm quyền ra quyết định, cá nhân, tổ chức vi phạm có trách nhiệm thi hành biện pháp khắc phục hậu quả buộc nộp lại giấy phép bị tẩy xóa, sửa chữa làm sai lệch nội dung thực hiện theo quy định tại các khoản 1, 2, 3 và khoản 4 Điều 85 Luật Xử lý vi phạm hành chính;\nb) Người có thẩm quyền ra quyết định thi hành biện pháp khắc phục hậu quả theo quy định tại điểm a khoản này phải thông báo bằng văn bản cho cơ quan, người có thẩm quyền đã cấp giấy phép đó.\n5. Cơ quan, người có thẩm quyền xử phạt vi phạm thực hiện việc tước quyền sử dụng giấy phép dưới dạng văn bản điện tử đã được cấp trước đó trên môi trường điện tử đối với hành vi vi phạm trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ theo quy định tại khoản 6 Điều 15 Nghị định này trên môi trường điện tử. Việc tước quyền sử dụng văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy được cập nhật trạng thái trên hệ thống Cơ sở dữ liệu về phòng cháy chữa cháy và cứu nạn, cứu hộ do Bộ Công an xây dựng, quản lý và ứng dụng thông tin điện tử khác theo quy định.\nBổ sung\nBổ sung\nBổ sung","y":"1. 소방 및 구조·구난 분야의 주된 처벌 형식은 다음을 포함한다:\na) 경고;\nb) 과태료.\n2. 소방 및 구조·구난 분야의 추가 처벌은 다음을 포함한다:\na) 기한부 영업(활동) 정지;\nb) 행정위반 증거물 몰수;\nc) 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서인 허가서의 사용권을 06개월부터 12개월까지 박탈.\n3. 소방 및 구조·구난 분야의 시정조치(결과 복구 조치)는 다음을 포함한다:\na) 「행정위반처리법」 제28조 제1항 a호에 규정된 시정조치(결과 복구 조치);\nb) 이 시행령에 구체적으로 규정된 그 밖의 조치.\n4. 삭제·수정되어 내용이 왜곡된 허가서의 반납을 강제하는 시정조치(결과 복구 조치)의 집행 절차:\na) 결정 권한자, 삭제·수정되어 내용이 왜곡된 허가서의 반납을 강제하는 시정조치(결과 복구 조치)를 집행할 책임이 있는 위반 개인, 조직은 「행정위반처리법」 제85조 제1항, 제2항, 제3항 및 제4항의 규정에 따라 시행한다;\nb) 이 항 a호의 규정에 따라 시정조치(결과 복구 조치)의 집행을 결정할 권한이 있는 자는 해당 허가서를 발급한 권한 있는 기관, 권한자에게 서면으로 통보하여야 한다.\n5. 위반 처벌 권한이 있는 기관, 권한자는 이 시행령 제15조 제6항의 규정에 따른 소방 및 구조·구난 분야의 위반 행위에 대하여, 종전에 전자 환경에서 발급된 전자문서 형태의 허가서의 사용권 박탈을 전자 환경에서 시행한다. 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서의 사용권 박탈은 공안부가 구축·관리하는 소방 및 구조·구난 데이터베이스 시스템 및 규정에 따른 그 밖의 전자정보 응용 시스템에 상태가 갱신된다.\n(신설)\n(신설)\n(신설)","o":[["Khoản 8 Điều 3 được bổ sung bởi khoản 3 Điều 2 Nghị định số 69/2026/NĐ-CP","nd69-2"],["Khoản 6 Điều 3 được bổ sung bởi khoản 1 Điều 2 Nghị định số 69/2026/NĐ-CP","nd69-2"],["Khoản 7 Điều 3 được bổ sung bởi khoản 2 Điều 2 Nghị định số 69/2026/NĐ-CP","nd69-2"]]},{"id":"nd106-4","d":"nd106","n":"4","t":"Mức phạt tiền trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ","k":"소방 및 구조·구난 분야의 과태료 수준","c":"제1장 총칙","x":"1. Mức phạt tiền tối đa trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ đối với cá nhân đến 50.000.000 đồng. Đối với tổ chức có cùng hành vi vi phạm, mức phạt tiền gấp 02 lần mức phạt tiền đối với cá nhân.\n2. Mức phạt tiền quy định tại Chương II Nghị định này là mức phạt được áp dụng đối với một hành vi vi phạm hành chính của cá nhân.\n3. Hộ gia đình, hộ kinh doanh, cộng đồng dân cư vi phạm các quy định của Nghị định này bị áp dụng mức phạt tiền đối với cá nhân vi phạm hành chính.","y":"1. 소방 및 구조·구난 분야에서 개인에 대한 과태료 최고액은 50.000.000동까지이다. 동일한 위반 행위를 한 조직에 대하여는 과태료 수준이 개인에 대한 과태료 수준의 02배이다.\n2. 이 시행령 제2장에 규정된 과태료 수준은 개인의 하나의 행정위반 행위에 대하여 적용되는 과태료 수준이다.\n3. 이 시행령의 규정을 위반한 가구, 개인사업자(사업가구), 주민공동체는 행정위반을 한 개인에 대한 과태료 수준을 적용받는다.","o":[]},{"id":"nd106-5","d":"nd106","n":"5","t":"Thời hiệu xử phạt vi phạm hành chính","k":"행정위반 처벌 시효","c":"제1장 총칙","x":"1. Thời hiệu xử phạt vi phạm hành chính trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ là 01 năm.\n2. Thời hạn sử dụng kết quả thu thập được bằng phương tiện, thiết bị kỹ thuật nghiệp vụ do cơ quan, người có thẩm quyền xử phạt vi phạm hành chính, cá nhân, tổ chức được giao quản lý phương tiện, thiết bị kỹ thuật nghiệp vụ được sử dụng phương tiện, thiết bị kỹ thuật nghiệp vụ cung cấp được tính từ thời điểm phương tiện, thiết bị kỹ thuật nghiệp vụ ghi nhận được kết quả cho đến hết ngày cuối cùng của thời hiệu xử phạt vi phạm hành chính quy định tại khoản 1 Điều 6 của Luật Xử lý vi phạm hành chính.\nQuá thời hạn nêu trên mà người có thẩm quyền xử phạt vi phạm hành chính đối với hành vi vi phạm không ra quyết định xử phạt theo thẩm quyền thì kết quả thu thập được bằng phương tiện, thiết bị kỹ thuật nghiệp vụ không còn giá trị sử dụng.\n3. Thời điểm để tính thời hiệu xử phạt vi phạm hành chính được quy định như sau:\na) Đối với hành vi vi phạm hành chính đã kết thúc thì thời hiệu được tính từ thời điểm chấm dứt hành vi vi phạm;\nb) Đối với hành vi vi phạm hành chính đang thực hiện thì thời hiệu được tính từ thời điểm phát hiện hành vi vi phạm;\nc) Đối với các hành vi vi phạm được phát hiện bằng phương tiện, thiết bị kỹ thuật nghiệp vụ thì thời điểm chấm dứt hành vi vi phạm được tính từ thời điểm phương tiện, thiết bị kỹ thuật nghiệp vụ ghi nhận hành vi vi phạm.\n4. Thời điểm để tính thời hiệu xử phạt vi phạm hành chính quy định tại khoản 3 Điều này trong một số trường hợp cụ thể được quy định như sau:\na) Thời điểm chấm dứt hành vi vi phạm để tính thời hiệu xử phạt vi phạm hành chính đối với hành vi quy định tại khoản 1 và khoản 2 Điều 18 Nghị định này được tính từ ngày bàn giao công trình, hạng mục công trình, phương tiện giao thông theo quy định;\nb) Thời điểm chấm dứt hành vi vi phạm để tính thời hiệu xử phạt vi phạm hành chính đối với hành vi quy định tại khoản 3 và khoản 4 Điều 18 Nghị định này được tính từ ngày công trình, hạng mục công trình, phương tiện giao thông chấm dứt hoạt động.\n5. Người có thẩm quyền xử phạt căn cứ các hồ sơ, tài liệu có liên quan để xác định thời điểm tính thời hiệu xử phạt theo đúng quy định của Luật Xử lý vi phạm hành chính và các quy định pháp luật khác có liên quan.","y":"1. 소방 및 구조·구난 분야의 행정위반 처벌 시효는 01년이다.\n2. 행정위반 처벌 권한이 있는 기관, 권한자, 업무용 기술 장비·설비의 관리를 위임받아 업무용 기술 장비·설비를 사용할 수 있는 개인, 조직이 제공하는, 업무용 기술 장비·설비로 수집한 결과의 사용 기한은 업무용 기술 장비·설비가 결과를 기록한 시점부터 「행정위반처리법」 제6조 제1항에 규정된 행정위반 처벌 시효의 마지막 날이 끝날 때까지로 계산한다.\n위 기한이 지나도록 위반 행위에 대한 행정위반 처벌 권한자가 권한에 따른 처벌 결정을 내리지 아니한 경우에는 업무용 기술 장비·설비로 수집한 결과는 더 이상 사용 효력이 없다.\n3. 행정위반 처벌 시효를 계산하는 시점은 다음과 같이 규정한다:\na) 이미 종료된 행정위반 행위에 대하여는 위반 행위가 종료된 시점부터 시효를 계산한다;\nb) 진행 중인 행정위반 행위에 대하여는 위반 행위를 발견한 시점부터 시효를 계산한다;\nc) 업무용 기술 장비·설비로 발견된 위반 행위에 대하여는 위반 행위의 종료 시점을 업무용 기술 장비·설비가 위반 행위를 기록한 시점부터 계산한다.\n4. 이 조 제3항에 규정된 행정위반 처벌 시효를 계산하는 시점은 일부 구체적인 경우에 다음과 같이 규정한다:\na) 이 시행령 제18조 제1항 및 제2항에 규정된 행위에 대한 행정위반 처벌 시효를 계산하기 위한 위반 행위의 종료 시점은 규정에 따라 건축물, 건축물의 공종(부분 공사), 교통수단을 인도한 날부터 계산한다;\nb) 이 시행령 제18조 제3항 및 제4항에 규정된 행위에 대한 행정위반 처벌 시효를 계산하기 위한 위반 행위의 종료 시점은 건축물, 건축물의 공종(부분 공사), 교통수단이 운영(활동)을 종료한 날부터 계산한다.\n5. 처벌 권한자는 관련 서류, 자료에 근거하여 「행정위반처리법」 및 그 밖의 관련 법률 규정에 맞게 처벌 시효의 계산 시점을 확정한다.","o":[["Khoản 4 Điều 5 được sửa đổi, bổ sung bởi Điều 3 Nghị định số 69/2026/NĐ-CP","nd69-3"]]},{"id":"nd106-6","d":"nd106","n":"6","t":"Vi phạm quy định về tuyên truyền, phổ biến kiến thức, pháp luật, huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난에 관한 홍보, 지식·법률 보급, 직무 훈련·교육에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt cảnh cáo hoặc phạt tiền từ 300.000 đồng đến 500.000 đồng đối với hành vi làm hỏng băng rôn, khẩu hiệu, pa nô, áp phích, tranh ảnh tuyên truyền về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n2. Phạt tiền từ 1.000.000 đồng đến 3.000.000 đồng đối với hành vi không tổ chức tuyên truyền, phổ biến, giáo dục kiến thức, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ đối với các đối tượng quy định tại Điều 8 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ.\n3. Phạt tiền từ 4.000.000 đồng đến 6.000.000 đồng đối với hành vi không tổ chức bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ hằng năm cho đối tượng quy định tại các điểm c, d, đ, e và điểm g khoản 1 Điều 45 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ đã được huấn luyện nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n4. Phạt tiền từ 6.000.000 đồng đến 8.000.000 đồng đối với hành vi sử dụng đối tượng quy định tại các điểm d, đ, e và điểm g khoản 1 Điều 45 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ nhưng chưa được huấn luyện nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n5. Biện pháp khắc phục hậu quả:\na) Buộc khôi phục lại tình trạng ban đầu đối với hành vi vi phạm quy định tại khoản 1 Điều này;\nb) Buộc tổ chức bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ đối với hành vi vi phạm quy định tại khoản 3 Điều này;\nc) Buộc tổ chức huấn luyện nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ đối với hành vi vi phạm quy định tại khoản 4 Điều này.","y":"1. 소방 및 구조·구난에 관한 홍보용 현수막, 구호(표어), 패널, 포스터, 그림·사진을 훼손하는 행위에 대하여 경고 또는 300.000동 이상 500.000동 이하의 과태료를 부과한다.\n2. 「소방 및 구조·구난법」 제8조에 규정된 대상에 대하여 소방 및 구조·구난에 관한 지식, 법률의 홍보, 보급, 교육을 실시하지 아니하는 행위에 대하여 1.000.000동 이상 3.000.000동 이하의 과태료를 부과한다.\n3. 「소방 및 구조·구난법」 제45조 제1항 c호, d호, đ호, e호 및 g호에 규정된 대상으로서 소방 및 구조·구난 직무 훈련을 이미 받은 자에게 매년 소방 및 구조·구난 직무 교육을 실시하지 아니하는 행위에 대하여 4.000.000동 이상 6.000.000동 이하의 과태료를 부과한다.\n4. 「소방 및 구조·구난법」 제45조 제1항 d호, đ호, e호 및 g호에 규정된 대상으로서 소방 및 구조·구난 직무 훈련을 받지 아니한 자를 소방 및 구조·구난 임무 수행에 사용하는 행위에 대하여 6.000.000동 이상 8.000.000동 이하의 과태료를 부과한다.\n5. 시정조치(결과 복구 조치):\na) 이 조 제1항에 규정된 위반 행위에 대하여 원상회복을 강제한다;\nb) 이 조 제3항에 규정된 위반 행위에 대하여 소방 및 구조·구난 직무 교육의 실시를 강제한다;\nc) 이 조 제4항에 규정된 위반 행위에 대하여 소방 및 구조·구난 직무 훈련의 실시를 강제한다.","o":[["Khoản 4 Điều 6 được sửa đổi, bổ sung bởi Điều 4 Nghị định số 69/2026/NĐ-CP","nd69-4"]]},{"id":"nd106-7","d":"nd106","n":"7","t":"Vi phạm quy định về ban hành, niêm yết nội quy, biển cấm, biển báo, biển chỉ dẫn về phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난에 관한 내규, 금지 표지, 경고 표지, 안내 표지의 제정·게시에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 1.000.000 đồng đến 3.000.000 đồng đối với một trong các hành vi sau đây:\na) Ban hành nội quy phòng cháy, chữa cháy, cứu nạn, cứu hộ không đủ nội dung theo quy định hoặc không phù hợp với đặc điểm, tính chất hoạt động của cơ sở, phương tiện giao thông;\nb) Niêm yết nội quy, biển báo, biển cấm, biển chỉ dẫn về phòng cháy, chữa cháy, cứu nạn, cứu hộ không đúng vị trí quy định.\n2. Phạt tiền từ 4.000.000 đồng đến 6.000.000 đồng đối với hành vi không duy trì nội quy, biển báo, biển cấm, biển chỉ dẫn về phòng cháy, chữa cháy, cứu nạn, cứu hộ đã được niêm yết.\n3. Phạt tiền từ 6.000.000 đồng đến 8.000.000 đồng đối với hành vi không ban hành hoặc không niêm yết nội quy, biển báo, biển cấm, biển chỉ dẫn về phòng cháy, chữa cháy, cứu nạn, cứu hộ.","y":"1. 다음 각 행위 중 하나에 대하여 1.000.000동 이상 3.000.000동 이하의 과태료를 부과한다:\na) 소방 및 구조·구난 내규를 규정에 따른 내용을 갖추지 아니하고 제정하거나 사업장, 교통수단의 활동 특성, 성질에 맞지 아니하게 제정하는 행위;\nb) 소방 및 구조·구난에 관한 내규, 경고 표지, 금지 표지, 안내 표지를 규정된 위치에 맞지 아니하게 게시하는 행위.\n2. 이미 게시된 소방 및 구조·구난에 관한 내규, 경고 표지, 금지 표지, 안내 표지를 유지하지 아니하는 행위에 대하여 4.000.000동 이상 6.000.000동 이하의 과태료를 부과한다.\n3. 소방 및 구조·구난에 관한 내규, 경고 표지, 금지 표지, 안내 표지를 제정하지 아니하거나 게시하지 아니하는 행위에 대하여 6.000.000동 이상 8.000.000동 이하의 과태료를 부과한다.","o":[]},{"id":"nd106-8","d":"nd106","n":"8","t":"Vi phạm quy định về thành lập quản lý Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành; phân công người thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"사업장 자체 소방·구조구난대, 전문 소방·구조구난대의 설립·관리; 소방 및 구조·구난 임무 수행자의 지정에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với một trong các hành vi sau đây:\na) Thành lập Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành không bảo đảm số người theo quy định;\nb) Cơ quan, tổ chức hoạt động trong cơ sở không cử người tham gia Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở.\n2. Phạt tiền từ 6.000.000 đồng đến 8.000.000 đồng đối với một trong các hành vi sau đây:\na) Không phân công người thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ tại cơ sở thuộc diện quản lý về phòng cháy, chữa cháy có dưới 20 người thường xuyên làm việc;\nb) Không bố trí địa điểm trực chữa cháy, cứu nạn, cứu hộ của Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành.\n3. Phạt tiền từ 8.000.000 đồng đến 10.000.000 đồng đối với hành vi không bố trí lực lượng, phương tiện của Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành trực chữa cháy, cứu nạn, cứu hộ hằng ngày.\n4. Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với hành vi không thành lập Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở.\n5. Phạt tiền từ 20.000.000 đồng đến 30.000.000 đồng đối với hành vi không thành lập Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành.","y":"1. 다음 각 행위 중 하나에 대하여 3.000.000동 이상 5.000.000동 이하의 과태료를 부과한다:\na) 사업장 자체 소방·구조구난대, 전문 소방·구조구난대를 규정에 따른 인원수를 확보하지 아니하고 설립하는 행위;\nb) 사업장 내에서 활동하는 기관, 조직이 사업장 자체 소방·구조구난대에 참여할 사람을 보내지 아니하는 행위.\n2. 다음 각 행위 중 하나에 대하여 6.000.000동 이상 8.000.000동 이하의
