t toán kinh phí bảo đảm cho công tác phổ biến, giáo dục pháp luật;\nc) Chi hỗ trợ lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ trong hoạt động tập huấn, bồi dưỡng nghiệp vụ tuyên truyền, kiểm tra về phòng cháy, chữa cháy, điều tra, xử lý vụ cháy, huấn luyện nghiệp vụ về chữa cháy, cứu nạn, cứu hộ; thực hiện kiểm tra, giám sát việc tham gia bảo hiểm cháy, nổ bắt buộc của các cơ sở: tối đa không quá 15% số tiền thực tế thu được từ bảo hiểm cháy, nổ bắt buộc của các doanh nghiệp bảo hiểm trong năm tài chính. Nội dung chi, mức chi thực hiện theo chế độ chi tiêu tài chính hiện hành;\nd) Chi hỗ trợ khen thưởng thành tích của tổ chức, cá nhân trực tiếp tham gia, phối hợp trong công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ: tối đa không quá 5% số tiền thực tế thu được từ bảo hiểm cháy, nổ bắt buộc của các doanh nghiệp bảo hiểm trong năm tài chính.","y":"1. 이 시행령에 첨부된 부록 VII에 규정된 목록에 속하는 사업장은 사업장의 재산에 대하여 화재·폭발 의무보험에 가입하여야 한다. 다만, 국방부, 공안부의 관리 범위에 속하며 군사, 국방, 안보, 질서 목적에 사용되는 사업장은 제외한다. 그 밖의 사업장은 화재·폭발 의무보험에 가입하도록 권장한다.\n국가기밀 목록에 속하는 재산, 특수 재산, 전용 재산, 국가관리 업무에 사용되는 재산을 가진 사업장에 대해서는 보험을 제공하는 기업은 화재·폭발 의무보험 서비스를 제공하는 과정에서 안보, 안전, 보안에 관한 요건을 보장하여야 한다.\n2. 화재·폭발 의무보험을 취급하는 보험회사가 회계연도 중에 납부하는 출연금의 수준은 직전 회계연도에 원수보험계약에서 실제로 수취한 화재·폭발 의무보험 보험료 총액의 2%이다.\n3. 화재·폭발 의무보험에서 발생하는 수입원의 관리는 자동차 소유자의 민사책임 의무보험, 화재·폭발 의무보험, 건설 투자 활동에서의 의무보험에 관하여 규정한 정부의 2023년 9월 06일자 시행령 제67/2023/NĐ-CP호 및 관련 법령의 규정에 따른다.\n4. 화재·폭발 의무보험에서 발생하는 수입원은 다음과 같이 소방 및 구조·구난 활동에 사용한다:\na) 소방경찰(소방·구조구난 경찰)을 위한 소방 및 구조·구난 장비·설비의 구매·장비 지원 지출: 회계연도 중 보험회사들의 화재·폭발 의무보험에서 실제로 수취한 금액의 최대 65%를 넘지 않는다. 소방 및 구조·구난 장비·설비의 구매·장비는 입찰에 관한 법령의 규정에 따른다;\nb) 소방 및 구조·구난과 화재·폭발 의무보험에 관한 지식·법령의 홍보, 보급, 교육 지원 지출: 회계연도 중 보험회사들의 화재·폭발 의무보험에서 실제로 수취한 금액의 최대 15%를 넘지 않는다. 소방 및 구조·구난에 관한 지식·법령의 홍보, 보급, 교육의 지출 내용 및 지출 수준은 법령 보급·교육 업무를 위한 보장 경비의 관리, 사용 및 결산에 관한 법령의 규정에 따른다;\nc) 홍보, 소방 점검(검사), 화재 사건의 조사·처리에 관한 직무 연수·교육, 화재진압 및 구조·구난에 관한 직무 훈련 활동에서의 소방경찰(소방·구조구난 경찰) 지원 지출; 사업장들의 화재·폭발 의무보험 가입에 대한 점검, 감독의 실시: 회계연도 중 보험회사들의 화재·폭발 의무보험에서 실제로 수취한 금액의 최대 15%를 넘지 않는다. 지출 내용, 지출 수준은 현행 재정 지출 제도에 따른다;\nd) 소방 및 구조·구난 업무에 직접 참가, 협력한 조직·개인의 공적에 대한 포상 지원 지출: 회계연도 중 보험회사들의 화재·폭발 의무보험에서 실제로 수취한 금액의 최대 5%를 넘지 않는다.","o":[["Điểm a khoản 4 Điều 35 được sửa đổi, bổ sung bởi khoản 1 Điều 23 1 Nghị định số 347/2026/NĐ-CP","nd347-23"],["Điểm c khoản 4 Điều 35 được sửa đổi, bổ sung bởi khoản 2 Điều 23 2 Nghị định số 347/2026/NĐ-CP","nd347-23"]]},{"id":"nd105-36","d":"nd105","n":"36","t":"Đóng góp tự nguyện, tài trợ bằng tiền, hiện vật của cơ quan, tổ chức, cá nhân trong nước, tổ chức, cá nhân nước ngoài cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 활동을 위한 국내 기관·조직·개인, 외국 조직·개인의 금전, 현물에 의한 자발적 기부, 후원","c":"제6장 소방 및 구조·구난 활동의 여건 보장","x":"1. Tiền, hiện vật của cơ quan, tổ chức, cá nhân trong nước, tổ chức, cá nhân nước ngoài đóng góp tự nguyện, tài trợ cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ phải sử dụng đúng với mục đích quy định tại khoản 4 Điều 50 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ.\nTrường hợp có thỏa thuận, đề nghị về mục đích sử dụng, mức chi cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ thì việc quản lý, sử dụng thực hiện theo thỏa thuận, đề nghị của cơ quan, tổ chức, cá nhân đóng góp, tài trợ và phù hợp với mục đích sử dụng cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ quy định tại khoản 4 Điều 50 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ.\n2. Tiếp nhận, quản lý hiện vật, nguồn tài chính do cơ quan, tổ chức, cá nhân trong nước, tổ chức, cá nhân nước ngoài đóng góp tự nguyện, tài trợ cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ như sau:\na) Nguồn tài chính bằng tiền được gửi vào tài khoản của Bộ Công an mở tại Kho bạc Nhà nước và được tổng hợp đầy đủ vào ngân sách nhà nước theo quy định của pháp luật về ngân sách nhà nước và quy định của pháp luật có liên quan;\nb) Nguồn tài chính là hiện vật, sau khi thực hiện xác lập sở hữu toàn dân được giao cho cơ quan Công an được thụ hưởng quản lý, sử dụng theo quy định pháp luật về quản lý tài sản công và quy định của pháp luật có liên quan. Việc xác lập sở hữu toàn dân thực hiện theo quy định của Nghị định số 29/2018/NĐ-CP ngày 05 tháng 3 năm 2018 của Chính phủ và quy định của pháp luật có liên quan;\nc) Thông tin về đóng góp tự nguyện, tài trợ của cơ quan, tổ chức, cá nhân trong nước, tổ chức, cá nhân nước ngoài được cung cấp và công bố trên Cổng thông tin điện tử của Bộ Công an và Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ theo quy định của pháp luật, trừ trường hợp cơ quan, tổ chức, cá nhân đóng góp tự nguyện, tài trợ có thỏa thuận không công bố thông tin;\nd) Nguồn tài chính từ việc vận động, tiếp nhận các nguồn đóng góp tự nguyện hỗ trợ khắc phục khó khăn các trường hợp do sự cố thực hiện theo quy định tại Nghị định số 93/2021/NĐ-CP ngày 27 tháng 10 năm 2021 của Chính phủ.\n3. Bộ Công an căn cứ thực tế nguồn tài chính từ đóng góp tự nguyện, tài trợ và yêu cầu thực tiễn quyết định về mức chi cho các nội dung liên quan đến hoạt động phòng cháy và chữa cháy quy định tại khoản 4 Điều 50 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ sau khi thống nhất với Bộ Tài chính.\n4. Bộ Công an chịu trách nhiệm quản lý, sử dụng nguồn tài chính từ đóng góp tự nguyện, tài trợ theo quy định của pháp luật về ngân sách nhà nước và quy định của pháp luật có liên quan.","y":"1. 국내 기관·조직·개인, 외국 조직·개인이 소방 및 구조·구난 활동을 위하여 자발적으로 기부, 후원한 금전, 현물은 「소방 및 구조·구난법」 제50조 제4항에 규정된 목적에 맞게 사용하여야 한다.\n소방 및 구조·구난 활동을 위한 사용 목적, 지출 수준에 관한 합의, 요청이 있는 경우에는 그 관리, 사용은 기부, 후원한 기관·조직·개인의 합의, 요청에 따르며, 「소방 및 구조·구난법」 제50조 제4항에 규정된 소방 및 구조·구난 활동을 위한 사용 목적에 부합하여야 한다.\n2. 국내 기관·조직·개인, 외국 조직·개인이 소방 및 구조·구난 활동을 위하여 자발적으로 기부, 후원한 현물, 재원의 접수, 관리는 다음과 같다:\na) 금전으로 된 재원은 국고(국가금고)에 개설된 공안부의 계좌에 입금되며, 국가예산에 관한 법령의 규정 및 관련 법령의 규정에 따라 국가예산에 전부 합산된다;\nb) 현물인 재원은 전민소유(국가 소유) 확립을 실시한 후, 공공재산 관리에 관한 법령의 규정 및 관련 법령의 규정에 따라 수혜를 받는 공안기관에 인도되어 관리, 사용된다. 전민소유의 확립은 정부의 2018년 3월 05일자 시행령 제29/2018/NĐ-CP호의 규정 및 관련 법령의 규정에 따른다;\nc) 국내 기관·조직·개인, 외국 조직·개인의 자발적 기부, 후원에 관한 정보는 법령의 규정에 따라 공안부 및 소방·구조구난경찰국의 전자정보포털에 제공, 공표된다. 다만, 자발적으로 기부, 후원한 기관·조직·개인이 정보를 공표하지 아니하기로 합의한 경우는 제외한다;\nd) 사고로 인한 경우의 어려움 극복을 지원하는 자발적 기부금의 모금, 접수에서 발생하는 재원은 정부의 2021년 10월 27일자 시행령 제93/2021/NĐ-CP호의 규정에 따른다.\n3. 공안부는 자발적 기부, 후원으로 인한 재원의 실제 상황 및 실무상의 요구에 근거하여, 재무부와 협의하여 합의한 후 「소방 및 구조·구난법」 제50조 제4항에 규정된 소방 활동과 관련된 내용에 대한 지출 수준을 결정한다.\n4. 공안부는 국가예산에 관한 법령의 규정 및 관련 법령의 규정에 따라 자발적 기부, 후원으로 인한 재원을 관리, 사용할 책임을 진다.","o":[]},{"id":"nd105-37","d":"nd105","n":"37","t":"Hỗ trợ từ Quỹ phòng, chống thiên tai theo quy định của pháp luật về phòng, chống thiên tai cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"재난(자연재해) 예방·대응에 관한 법령의 규정에 따른 재난 예방·대응 기금으로부터의 소방 및 구조·구난 활동 지원","c":"제6장 소방 및 구조·구난 활동의 여건 보장","x":"1. Hàng năm, Công an tỉnh, thành phố trực thuộc trung ương chủ trì, phối hợp với cơ quan chức năng có liên quan đề xuất mức hỗ trợ và báo cáo Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương quyết định mức hỗ trợ từ Quỹ phòng, chống thiên tai để sử dụng chi bảo đảm cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ quy định tại khoản 4 Điều 38 Nghị định này mà ngân sách nhà nước chưa đầu tư hoặc chưa đáp ứng yêu cầu.\n2. Việc quản lý, sử dụng nguồn tài chính hỗ trợ từ Quỹ phòng, chống thiên tai theo quy định của pháp luật về ngân sách nhà nước và quy định của pháp luật có liên quan.","y":"1. 매년 성·중앙직할시 공안은 관련 직능기관과 주관·협력하여 지원 수준을 제안하고, 성·중앙직할시 인민위원회에 보고하여, 이 시행령 제38조 제4항에 규정된 소방 및 구조·구난 활동으로서 국가예산이 아직 투자하지 아니하였거나 요구를 충족하지 못한 활동을 보장하는 지출에 사용하기 위한 재난 예방·대응 기금으로부터의 지원 수준을 결정하게 한다.\n2. 재난 예방·대응 기금으로부터 지원받은 재원의 관리, 사용은 국가예산에 관한 법령의 규정 및 관련 법령의 규정에 따른다.","o":[]},{"id":"nd105-38","d":"nd105","n":"38","t":"Ngân sách nhà nước bảo đảm cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 활동을 위하여 국가예산이 보장하는 사항","c":"제6장 소방 및 구조·구난 활동의 여건 보장","x":"1. Dự phòng ngân sách nhà nước theo quy định của pháp luật về ngân sách nhà nước được sử dụng để chi cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ trong các trường hợp cấp bách sau đây:\na) Khi xảy ra thảm họa theo quy định của pháp luật về phòng thủ dân sự dẫn đến cháy, nổ;\nb) Hỗ trợ, khắc phục hậu quả cháy, nổ quy định tại điểm a khoản này.\n2. Nội dung chi cho hoạt động của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ bao gồm:\na) Đảm bảo chế độ, chính sách cho lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ theo quy định của pháp luật;\nb) Hoạt động nghiệp vụ về phòng cháy, chữa cháy, cứu nạn, cứu hộ; diễn tập, thực tập phòng cháy, chữa cháy, cứu nạn, cứu hộ theo kế hoạch hàng năm được Bộ trưởng Bộ Công an phê duyệt;\nc) Đào tạo, huấn luyện, tổ chức và tham gia hội thi nghiệp vụ chữa cháy và cứu nạn, cứu hộ cho lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ;\nd) Mua sắm, trang bị thiết bị, phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ và các tài sản khác phục vụ hoạt động của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ;\nđ) Xây dựng, nâng cấp, cải tạo, sửa chữa (trừ các công trình được đầu tư bằng nguồn vốn đầu tư phát triển) công trình chuyên dụng, doanh trại, trụ sở làm việc của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ; sửa chữa, bảo trì, bảo dưỡng thiết bị, phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ đã được trang bị;\ne) Hoạt động nghiên cứu khoa học và công nghệ; đối ngoại và hợp tác quốc tế; huy động tiềm lực khoa học và công nghệ về phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật;\ng) Các nhiệm vụ chi khác cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ quy định tại Nghị định số 165/2016/NĐ-CP ngày 24 tháng 12 năm 2016 quy định về quản lý, sử dụng ngân sách nhà nước đối với một số hoạt động thuộc lĩnh vực quốc phòng, an ninh.\nTrường hợp nội dung chi cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ trùng với nội dung chi quy định tại Nghị định số 165/2016/NĐ-CP thì thực hiện theo quy định tại Nghị định này.\n3. Nội dung chi ngân sách nhà nước của các bộ, cơ quan trung ương cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ bao gồm:\na) Đầu tư, trang bị, sửa chữa, bảo trì, bảo dưỡng hệ thống, phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nb) Hoạt động của Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành thuộc cơ quan, tổ chức thụ hưởng ngân sách nhà nước;\nc) Đào tạo, huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật;\nd) Xây dựng, quản lý, khai thác, vận hành hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy theo quy định tại khoản 4 Điều 52 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ;\nđ) Các hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ khác theo quy định của pháp luật.\n4. Nội dung chi của ngân sách địa phương cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ bao gồm:\na) Hoạt động thường xuyên của lực lượng dân phòng; hỗ trợ thường xuyên cho Đội trưởng, Đội phó đội dân phòng;\nb) Mua sắm phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng dân phòng;\nc) Tuyên truyền, phổ biến, giáo dục kiến thức, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ; huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật; xây dựng phong trào toàn dân tham gia phòng cháy, chữa cháy, cứu nạn, cứu hộ; tổ chức hoạt động của trung tâm giáo dục cộng đồng về phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nd) Trang bị thiết bị truyền tin báo cháy kết nối với hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy đối với nhà ở tại thành phố trực thuộc trung ương thuộc khu vực không bảo đảm hạ tầng giao thông hoặc nguồn nước phục vụ chữa cháy theo quy định của pháp luật, quy chuẩn kỹ thuật trong hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nđ) Chế độ, chính sách đối với người được huy động, người tham gia phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật;\ne) Chi trả bồi thường đối với trường hợp phương tiện, tài sản của cơ quan, tổ chức, cá nhân bị mất, hư hỏng, bị thiệt hại khi tham gia chữa cháy, cứu nạn, cứu hộ theo quyết định huy động của Chủ tịch Ủy ban nhân dân các cấp;\ng) Đầu tư xây dựng, lắp đặt, quản lý, bảo trì, bảo dưỡng trụ nước chữa cháy trên hệ thống cấp nước tập trung, điểm, bến để xe chữa cháy, máy bơm chữa cháy lấy nước phục vụ chữa cháy tại các bể, ao, hồ, sông, suối, kênh;\nh) Chi cho hoạt động cải tạo, chỉnh trang đối với các khu vực đô thị không bảo đảm hạ tầng giao thông hoặc nguồn nước phục vụ chữa cháy;\ni) Thực hiện các nhiệm vụ theo quy hoạch hạ tầng phòng cháy và chữa cháy do Ủy ban nhân dân cấp tỉnh phê duyệt;\nk) Diễn tập, thực tập phòng cháy, chữa cháy, cứu nạn, cứu hộ theo kế hoạch của địa phương;\nl) Thực hiện chính sách khuyến khích cá nhân tham gia hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ tình nguyện;\nm) Căn cứ khả năng cân đối của ngân sách địa phương, Ủy ban nhân dân cấp tỉnh trình Hội đồng nhân dân cùng cấp quyết định chi hỗ trợ một số hoạt động của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ quy định tại khoản 2 Điều này;\nn) Các hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ khác theo quy định của pháp luật.","y":"1. 국가예산 관련 법령에 따른 국가예산 예비비는 다음 각 호의 긴급한 경우에 소방 및 구조·구난 활동을 위한 지출에 사용된다:\na) 민방위(민간방위) 관련 법령에 따른 재난이 발생하여 화재·폭발로 이어진 경우;\nb) 이 항 a호에 규정된 화재·폭발의 피해 지원 및 결과 복구.\n2. 소방경찰(소방·구조구난 경찰)의 활동을 위한 지출 내용은 다음을 포함한다:\na) 법령에 따른 소방경찰(소방·구조구난 경찰)에 대한 제도·정책의 보장;\nb) 소방 및 구조·구난에 관한 직무 활동; 공안부 장관이 승인한 연간 계획에 따른 소방 및 구조·구난 종합훈련(연습)·실습;\nc) 소방경찰(소방·구조구난 경찰)을 위한 양성, 훈련, 화재진압 및 구조·구난 직무 경연대회의 개최 및 참가;\nd) 소방경찰(소방·구조구난 경찰)의 활동에 사용되는 소방 및 구조·구난 장비·설비와 그 밖의 자산의 구매·비치;\nđ) 소방경찰(소방·구조구난 경찰)의 전용 시설물, 병영, 청사의 건설, 개량, 개조, 수리(개발투자 자금으로 투자되는 시설물은 제외한다); 이미 비치된 소방 및 구조·구난 장비·설비의 수리, 유지관리, 정비;\ne) 과학기술 연구 활동; 대외 및 국제협력; 법령에 따른 소방 및 구조·구난에 관한 과학기술 잠재력의 동원;\ng) 국방·안보 분야에 속하는 일부 활동에 대한 국가예산의 관리·사용을 규정하는 2016년 12월 24일자 시행령 제165/2016/NĐ-CP호에 규정된 소방 및 구조·구난 활동을 위한 그 밖의 지출 임무.\n소방 및 구조·구난 활동을 위한 지출 내용이 시행령 제165/2016/NĐ-CP호에 규정된 지출 내용과 중복되는 경우에는 이 시행령의 규정에 따라 시행한다.\n3. 소방 및 구조·구난 활동을 위한 각 부, 중앙기관의 국가예산 지출 내용은 다음을 포함한다:\na) 소방 및 구조·구난 설비(시스템)·장비의 투자, 비치, 수리, 유지관리, 정비;\nb) 국가예산 수혜 기관·조직에 소속된 사업장 자체 소방·구조구난대, 전문 소방·구조구난대의 활동;\nc) 법령에 따른 소방 및 구조·구난 양성, 직무 훈련·교육;\nd) 「소방 및 구조·구난법」 제52조 제4항의 규정에 따른 소방, 구조·구난 및 화재 신호 전송 데이터베이스 시스템의 구축, 관리, 활용, 운영;\nđ) 법령에 따른 그 밖의 소방 및 구조·구난 활동.\n4. 소방 및 구조·구난 활동을 위한 지방예산의 지출 내용은 다음을 포함한다:\na) 민방위 소방대의 상시 활동; 민방위 소방대 대장, 부대장에 대한 상시 지원;\nb) 민방위 소방대를 위한 소방 및 구조·구난 장비·설비의 구매;\nc) 소방 및 구조·구난에 관한 지식·법령의 홍보, 보급, 교육; 법령에 따른 소방 및 구조·구난 직무 훈련·교육; 전 국민이 소방 및 구조·구난에 참여하는 운동의 조성; 소방 및 구조·구난에 관한 지역사회 교육센터의 활동 조직;\nd) 법령 및 소방 및 구조·구난 활동에 관한 기술 규정에 따라 화재진압을 위한 교통 기반시설 또는 수원이 확보되지 아니한 지역에 속하는 중앙직할시 내 주택에 대하여 소방, 구조·구난 및 화재 신호 전송 데이터베이스 시스템과 연결되는 화재 신호 전송 장치의 비치;\nđ) 법령에 따라 동원된 사람, 소방 및 구조·구난에 참여한 사람에 대한 제도·정책;\ne) 각급 인민위원회 위원장의 동원 결정에 따라 화재진압, 구조·구난에 참여하던 중 기관·조직·개인의 장비·자산이 분실, 훼손, 피해를 입은 경우에 대한 보상금 지급;\ng) 집중식 급수 시스템상의 소화전(화재진압용 급수주), 저수조·연못·호수·강·개울·수로에서 화재진압용 물을 취수하기 위한 소방차·소방펌프의 정차 지점·부두의 건설 투자, 설치, 관리, 유지관리, 정비;\nh) 화재진압을 위한 교통 기반시설 또는 수원이 확보되지 아니한 도시 지역에 대한 개조·정비 활동을 위한 지출;\ni) 성급 인민위원회가 승인한 소방 기반시설 계획에 따른 임무의 수행;\nk) 지방의 계획에 따른 소방 및 구조·구난 종합훈련(연습)·실습;\nl) 개인이 자원 소방 및 구조·구난 활동에 참여하도록 장려하는 정책의 시행;\nm) 성급 인민위원회는 지방예산의 수지 균형 능력에 근거하여 이 조 제2항에 규정된 소방경찰(소방·구조구난 경찰)의 일부 활동에 대한 지원 지출을 같은 급 인민의회에 제출하여 결정하도록 한다;\nn) 법령에 따른 그 밖의 소방 및 구조·구난 활동.","o":[["Điểm c khoản 4 Điều 38 được sửa đổi, bổ sung bởi Điều 24 Nghị định số 347/2026/NĐ-CP","nd347-24"]]},{"id":"nd105-39","d":"nd105","n":"39","t":"Nội dung quản lý nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난에 관한 국가관리의 내용","c":"제7장 소방 및 구조·구난 국가관리","x":"1. Xây dựng và tổ chức thực hiện chiến lược, chính sách, đề án, dự án, quy hoạch, kế hoạch về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n2. Ban hành và tổ chức thực hiện các văn bản quy phạm pháp luật về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n3. Tuyên truyền, phổ biến pháp luật, hướng dẫn xây dựng phong trào toàn dân tham gia phòng cháy, chữa cháy, cứu nạn, cứu hộ; huấn luyện, bồi dưỡng nghiệp vụ, kiến thức về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n4. Đào tạo, xây dựng lực lượng, trang bị, quản lý phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n5. Bảo đảm điều kiện cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n6. Thẩm định thiết kế, kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy; thực hiện bảo hiểm cháy, nổ bắt buộc gắn với hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n7. Nghiên cứu, ứng dụng khoa học và công nghệ trong phòng cháy, chữa cháy, cứu nạn, cứu hộ; thống kê, tổng hợp, xây dựng hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy.\n8. Kiểm tra, thanh tra, xử lý vi phạm, giải quyết khiếu nại, tố cáo về phòng cháy, chữa cháy, cứu nạn, cứu hộ, bảo hiểm cháy, nổ bắt buộc; điều tra giải quyết vụ cháy.\n9. Cấp phép trước khi lưu thông trên thị trường đối với phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n10. Hợp tác quốc tế về phòng cháy, chữa cháy, cứu nạn, cứu hộ.","y":"1. 소방 및 구조·구난에 관한 전략, 정책, 방안(제안), 사업, 계획(규획), 시행계획의 수립 및 시행 조직.\n2. 소방 및 구조·구난에 관한 법규범 문서의 제정 및 시행 조직.\n3. 법령의 홍보·보급, 전 국민이 소방 및 구조·구난에 참여하는 운동의 조성 지도; 소방 및 구조·구난에 관한 직무·지식의 훈련·교육.\n4. 인력 양성, 소방대 구축, 소방 및 구조·구난 장비·설비의 비치·관리.\n5. 소방 및 구조·구난 활동을 위한 여건의 보장.\n6. 소방 설계 심사, 소방 준공검사(인수검사) 확인; 소방 및 구조·구난 활동과 연계된 화재·폭발 의무보험의 시행.\n7. 소방 및 구조·구난에서의 과학기술 연구·응용; 통계, 종합, 소방, 구조·구난 및 화재 신호 전송 데이터베이스 시스템의 구축.\n8. 소방 및 구조·구난, 화재·폭발 의무보험에 관한 점검(검사), 감사, 위반 처리, 이의신청·고발의 해결; 화재 사건의 조사·해결.\n9. 소방 및 구조·구난 장비·설비에 대한 시장 유통 전 허가.\n10. 소방 및 구조·구난에 관한 국제협력.","o":[["Khoản 6 Điều 39 được sửa đổi bởi Điều 25 Nghị định số 347/2026/NĐ-CP","nd347-25"],["Khoản 9 Điều 39 bị bãi bỏ bởi khoản 2 Điều 30 Nghị định số 347/2026/NĐ-CP","nd347-30"]]},{"id":"nd105-40","d":"nd105","n":"40","t":"Trách nhiệm của Bộ Công an","k":"공안부의 책임","c":"제7장 소방 및 구조·구난 국가관리","x":"1. Đề xuất cấp có thẩm quyền ban hành và tổ chức thực hiện chiến lược, chính sách, đề án, dự án, quy hoạch, kế hoạch về phòng cháy, chữa cháy, cứu nạn, cứu hộ trên phạm vi toàn quốc.\n2. Đề xuất cấp có thẩm quyền ban hành hoặc ban hành theo thẩm quyền văn bản quy phạm pháp luật, tiêu chuẩn, quy chuẩn kỹ thuật về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n3. Hướng dẫn thực hiện nhiệm vụ công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ của lực lượng Công an nhân dân.\n4. Hướng dẫn, chỉ đạo tuyên truyền, phổ biến, giáo dục kiến thức, pháp luật về phòng cháy, chữa cháy, cứu nạn, cứu hộ, xây dựng phong trào toàn dân tham gia phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n5. Tổ chức xây dựng chương trình, tài liệu về huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ; phân cấp, chỉ đạo, hướng dẫn việc huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n6. Thực hiện công tác quản lý về phòng cháy, chữa cháy đối với cơ sở thuộc Phụ lục II kèm theo Nghị định này; phân cấp cơ quan, đơn vị Công an có thẩm quyền thực hiện quản lý, kiểm tra, thanh tra về phòng cháy, chữa cháy; giải quyết khiếu nại, tố cáo liên quan đến lĩnh vực phòng cháy, chữa cháy, cứu nạn, cứu hộ trong phạm vi thẩm quyền.\n7. Phân cấp cơ quan, đơn vị Công an thực hiện thẩm định thiết kế, kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy; tổ chức kiểm tra việc thực hiện quy định về thẩm định thiết kế, nghiệm thu về phòng cháy và chữa cháy và quy định việc thực hiện các nội dung này trong lực lượng Công an nhân dân.\n8. Thực hiện chỉ định và quản lý hoạt động của tổ chức đánh giá sự phù hợp theo quy định của pháp luật về chất lượng sản phẩm, hàng hóa, pháp luật về tiêu chuẩn, quy chuẩn kỹ thuật; phân cấp cơ quan, đơn vị Công an có thẩm quyền cấp giấy phép lưu thông đối với phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n9. Thực hiện công tác điều tra, xử lý vụ cháy và xử lý vi phạm quy định của pháp luật về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n10. Quy định việc tiếp nhận, xử lý thông tin báo cháy, báo tình huống cứu nạn, cứu hộ, chỉ huy chữa cháy, cứu nạn, cứu hộ, tổ chức trực sẵn sàng chữa cháy, cứu nạn, cứu hộ và triển khai hoạt động chữa cháy, cứu nạn, cứu hộ; phân cấp cơ quan, đơn vị Công an xây dựng, phê duyệt, thực tập phương án chữa cháy, cứu nạn, cứu hộ, phương án cứu nạn, cứu hộ.\n11. Xây dựng và tổ chức thực hiện dự án đầu tư cơ sở hạ tầng, doanh trại, trụ sở làm việc, trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ; ban hành và tổ chức thực hiện các quy định về định mức, tiêu chuẩn trang bị, quản lý, bảo quản, bảo dưỡng và sử dụng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n12. Xây dựng lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ; tổ chức đào tạo cán bộ chuyên môn về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n13. Tổ chức việc nghiên cứu, phổ biến và ứng dụng khoa học và công nghệ hiện đại trong lĩnh vực phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n14. Thực hiện thống kê nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ; tổ chức sơ kết, tổng kết công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n15. Tổ chức hệ thống thông tin quản lý, chỉ huy điều hành hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ; xây dựng, quản lý, khai thác, vận hành hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy.\n16. Trình Chính phủ về việc tham gia các tổ chức quốc tế, ký kết hoặc tham gia các điều ước quốc tế về hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ; thực hiện các hoạt động quốc tế liên quan đến hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ theo thẩm quyền.\n17. Thực hiện các nhiệm vụ khác theo quy định của pháp luật.","y":"1. 전국 범위의 소방 및 구조·구난에 관한 전략, 정책, 방안(제안), 사업, 계획(규획), 시행계획을 권한 있는 기관에 제정하도록 제안하고 그 시행을 조직한다.\n2. 소방 및 구조·구난에 관한 법규범 문서, 기술 표준·기술 규정을 권한 있는 기관에 제정하도록 제안하거나 권한에 따라 제정한다.\n3. 인민공안 조직의 소방 및 구조·구난 업무 임무 수행을 지도한다.\n4. 소방 및 구조·구난에 관한 지식·법령의 홍보, 보급, 교육과 전 국민이 소방 및 구조·구난에 참여하는 운동의 조성을 지도·지휘한다.\n5. 소방 및 구조·구난 직무 훈련·교육에 관한 프로그램, 자료의 작성을 조직한다; 소방 및 구조·구난 직무 훈련·교육을 분권(위임)하고 지휘·지도한다.\n6. 이 시행령에 첨부된 부록 II에 속하는 사업장에 대한 소방 관리 업무를 수행한다; 소방에 관한 관리, 점검(검사), 감사를 수행할 권한이 있는 공안 기관·단위를 분권(위임)한다; 권한 범위 내에서 소방 및 구조·구난 분야와 관련된 이의신청·고발을 해결한다.\n7. 소방 설계 심사, 소방 준공검사(인수검사) 확인을 수행하는 공안 기관·단위를 분권(위임)한다; 소방 설계 심사, 소방 준공검사(인수검사)에 관한 규정의 이행에 대한 점검을 조직하고 인민공안 조직 내에서 이러한 내용의 수행에 관하여 규정한다.\n8. 제품·상품 품질 관련 법령, 기술 표준·기술 규정 관련 법령에 따라 적합성 평가 기관의 지정 및 그 활동의 관리를 수행한다; 소방 및 구조·구난 장비·설비에 대한 유통 허가서를 발급할 권한이 있는 공안 기관·단위를 분권(위임)한다.\n9. 화재 사건의 조사·처리 및 소방 및 구조·구난 관련 법령 규정 위반의 처리 업무를 수행한다.\n10. 화재 신고, 구조·구난 상황 신고 정보의 접수·처리, 화재진압 및 구조·구난 지휘, 화재진압 및 구조·구난 상시 대기 근무의 조직과 화재진압 및 구조·구난 활동의 전개에 관하여 규정한다; 화재진압·구조구난 계획(방안), 구조·구난 계획(방안)을 수립, 승인, 훈련(실습)하는 공안 기관·단위를 분권(위임)한다.\n11. 소방경찰(소방·구조구난 경찰)을 위한 기반시설, 병영, 청사 투자 및 소방 및 구조·구난 장비·설비 비치 사업을 수립하고 그 시행을 조직한다; 소방 및 구조·구난 장비·설비의 정수(定數), 비치 기준, 관리, 보관, 정비 및 사용에 관한 규정을 제정하고 그 시행을 조직한다.\n12. 소방경찰(소방·구조구난 경찰)을 구축한다; 소방 및 구조·구난 전문 간부의 양성을 조직한다.\n13. 소방 및 구조·구난 분야에서 현대 과학기술의 연구, 보급 및 응용을 조직한다.\n14. 소방 및 구조·구난에 관한 국가 통계를 수행한다; 소방 및 구조·구난 업무의 중간평가·총결산을 조직한다.\n15. 소방 및 구조·구난 활동의 관리, 지휘·통제 정보 시스템을 조직한다; 소방, 구조·구난 및 화재 신호 전송 데이터베이스 시스템을 구축, 관리, 활용, 운영한다.\n16. 소방 및 구조·구난 활동에 관한 국제기구 참여, 국제조약의 체결 또는 가입에 관하여 정부에 제출한다; 권한에 따라 소방 및 구조·구난 활동과 관련된 국제 활동을 수행한다.\n17. 법령에 따른 그 밖의 임무를 수행한다.","o":[["Khoản 7 Điều 40 được sửa đổi bởi khoản 1 Điều 26 Nghị định số 347/2026/NĐ-CP","nd347-26"],["Khoản 8 Điều 40 được sửa đổi bởi khoản 2 Điều 26 Nghị định số 347/2026/NĐ-CP","nd347-26"]]},{"id":"nd105-41","d":"nd105","n":"41","t":"Trách nhiệm của các bộ, cơ quan ngang bộ, cơ quan thuộc Chính phủ","k":"각 부, 부급 기관, 정부 소속 기관의 책임","c":"제7장 소방 및 구조·구난 국가관리","x":"1. Các bộ, cơ quan ngang bộ, cơ quan thuộc Chính phủ trong phạm vi nhiệm vụ, quyền hạn, lĩnh vực quản lý của mình có trách nhiệm:\na) Ban hành, trình cấp có thẩm quyền ban hành và tổ chức thực hiện văn bản quy phạm pháp luật, tiêu chuẩn, quy chuẩn kỹ thuật về phòng cháy, chữa cháy và cứu nạn, cứu hộ theo thẩm quyền;\nb) Chỉ đạo tổ chức quản lý, hướng dẫn về công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nc) Bố trí kinh phí cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ, trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nd) Thực hiện các nhiệm vụ khác theo quy định của pháp luật.\n2. Bộ Quốc phòng:\na) Thực hiện quản lý nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ đối với cơ sở, công trình, khu quân sự, phương tiện giao thông thuộc phạm vi quản lý của Bộ Quốc phòng phục vụ mục đích quân sự, quốc phòng và công trình quốc phòng sử dụng lưỡng dụng theo quy định của pháp luật về quản lý, bảo vệ công trình quốc phòng và khu quân sự; trường hợp xét thấy cần thiết, Bộ Quốc phòng đề nghị Bộ Công an hướng dẫn áp dụng các quy định trong nước hoặc quốc tế về bảo đảm an toàn phòng cháy, chữa cháy, cứu nạn, cứu hộ đối với dự án, công trình quân sự, quốc phòng;\nb) Chỉ đạo các cơ quan, đơn vị chức năng thuộc phạm vi quản lý chủ trì, phối hợp với cơ quan Công an và cơ quan có liên quan xây dựng, thực tập phương án chữa cháy, cứu nạn, cứu hộ và tổ chức chữa cháy, cứu nạn, cứu hộ đối với công trình quốc phòng sử dụng lưỡng dụng.\n3. Bộ Xây dựng:\na) Chủ trì, phối hợp với Bộ Công an quy định về giải pháp kỹ thuật nâng cao an toàn phòng cháy, chữa cháy cho các cơ sở, công trình không bảo đảm yêu cầu về phòng cháy và chữa cháy và không có khả năng khắc phục theo các tiêu chuẩn, quy chuẩn kỹ thuật tại thời điểm đưa vào hoạt động đến trước ngày Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ có hiệu lực thi hành thuộc thẩm quyền quản lý;\nb) Hướng dẫn, chỉ đạo, tổ chức thực hiện thẩm định thiết kế, kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy thuộc lĩnh vực quản lý quy định tại Điều 17 và Điều 18 của Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ;\nc) Rà soát, điều chỉnh quy hoạch đô thị và nông thôn, các quy hoạch thuộc phạm vi quản lý gắn với quy hoạch hạ tầng về phòng cháy và chữa cháy bảo đảm phù hợp với tình hình thực tiễn;\nd) Phân cấp cơ quan, đơn vị có thẩm quyền cấp giấy phép lưu thông đối với vật liệu, cấu kiện ngăn cháy, chống cháy;\nđ) Kiểm tra cơ quan chuyên môn về xây dựng trong việc tổ chức thẩm định thiết kế, kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy cùng với kiểm tra việc tổ chức thẩm định Báo cáo nghiên cứu khả thi đầu tư xây dựng, Báo cáo kinh tế - kỹ thuật đầu tư xây dựng,\nthiết kế xây dựng triển khai sau thiết kế cơ sở , kiểm tra công tác nghiệm thu dự án, công trình xây dựng theo quy định của pháp luật về xây dựng;\ne) Quy định việc phân cấp quản lý, kiểm tra về phòng cháy, chữa cháy đối với cơ sở thuộc Phụ lục II kèm theo Nghị định này, phương tiện giao thông do cơ quan chuyên môn trực thuộc thực hiện.\n4. Bộ Giáo dục và Đào tạo:\na) Phối hợp với Bộ Công an xây dựng nội dung kiến thức, kỹ năng về phòng cháy, chữa cháy, cứu nạn, cứu hộ cho học sinh, sinh viên trong các cơ sở giáo dục, giáo dục nghề nghiệp;\nb) Hướng dẫn, chỉ đạo các cơ sở giáo dục tổ chức thực hiện việc tích hợp, lồng ghép kiến thức, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ vào chương trình giảng dạy. Chủ trì ban hành văn bản quy định các điều kiện bảo đảm việc giảng dạy, trang bị kiến thức, thực hành các kỹ năng về phòng cháy, chữa cháy, cứu nạn, cứu hộ trong cơ sở giáo dục mầm non, giáo dục phổ thông, giáo dục đại học, giáo dục nghề nghiệp phù hợp với từng cấp học, ngành học.\n5. Bộ Tài chính:\na) Chủ trì, phối hợp với các bộ, ngành trung ương, cơ quan ngang bộ trình cấp có thẩm quyền bố trí dự toán chi hằng năm để thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật về ngân sách nhà nước; tổng hợp việc phân bổ nguồn lực trong kế hoạch đầu tư phát triển 5 năm, kế hoạch tài chính - ngân sách nhà nước 3 năm, dự toán ngân sách nhà nước hằng năm cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ của các bộ, ngành, địa phương;\nb) Thẩm định nguồn vốn và khả năng cân đối vốn các chương trình, dự án thuộc chương trình mục tiêu quốc gia, dự án quan trọng quốc gia, chương trình đầu tư công do Chính phủ quyết định chủ trương đầu tư, chương trình, dự án đầu tư công do Thủ tướng Chính phủ quyết định chủ trương đầu tư để đầu tư xây dựng cơ sở, sản xuất, mua sắm trang thiết bị phục vụ hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của Luật Đầu tư công; tổng hợp trình cấp có thẩm quyền phê duyệt thực hiện.\n6. Bộ Ngoại giao:\na) Chủ trì, phối hợp với Bộ Công an trong công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ trụ sở cơ quan đại diện ngoại giao, cơ quan lãnh sự, cơ quan đại diện của tổ chức quốc tế và nhà ở của thành viên các cơ quan này; đăng tải thông tin về những tổ chức quốc tế, tổ chức, cá nhân nước ngoài tại Việt Nam được hưởng quyền ưu đãi, miễn trừ huy động để tham gia chữa cháy, cứu nạn, cứu hộ;\nb) Thông báo cho Bộ Công an về trụ sở của cơ quan lãnh sự của những nước ký kết với Việt Nam hiệp định lãnh sự, trụ sở cơ quan đại diện của tổ chức quốc tế thuộc hệ thống Liên hợp quốc, trụ sở cơ quan đại diện của tổ chức quốc tế liên Chính phủ ngoài hệ thống Liên hợp quốc, các đoàn thể của tổ chức quốc tế mà lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ của Việt Nam chỉ được phép vào để chữa cháy khi có yêu cầu hoặc có sự đồng ý của người đứng đầu hoặc người được ủy quyền của các cơ quan đó; thông báo cho Bộ Công an về nhà ở của viên chức lãnh sự không phải là công dân Việt Nam hoặc không phải là người thường trú tại Việt Nam mà trong hiệp định lãnh sự giữa Việt Nam và nước cử lãnh sự có quy định lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ của Việt Nam chỉ được phép vào để chữa cháy khi có yêu cầu hoặc có sự đồng ý của những người đó.\n7. Bộ Công Thương:\na) Chủ trì, phối hợp với Bộ Công an quy định về giải pháp kỹ thuật nâng cao an toàn phòng cháy, chữa cháy cho các cơ sở, công trình không bảo đảm yêu cầu về phòng cháy và chữa cháy và không có khả năng khắc phục theo các tiêu chuẩn, quy chuẩn kỹ thuật tại thời điểm đưa vào hoạt động đến trước ngày Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ có hiệu lực thi hành thuộc thẩm quyền quản lý;\nb) Hướng dẫn, chỉ đạo, tổ chức thực hiện thẩm định thiết kế, kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy thuộc lĩnh vực quản lý quy định tại Điều 17 và Điều 18 của Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ;\nc) Chỉ đạo, hướng dẫn các đơn vị bán lẻ điện tư vấn việc lắp đặt, sử dụng đối với hệ thống, thiết bị điện để bảo đảm an toàn về phòng cháy khi đấu nối điện sinh hoạt;\nd) Chỉ đạo thực hiện tuyên truyền, hướng dẫn, kiểm tra về bảo đảm an toàn sử dụng điện trong sinh hoạt, sản xuất và thực hiện các nhiệm vụ khác về an toàn sử dụng điện theo quy định của pháp luật về điện lực;\nđ) Kiểm tra cơ quan chuyên môn trực thuộc trong việc tổ chức thẩm định thiết kế, kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy cùng với kiểm tra việc tổ chức thẩm định Báo cáo nghiên cứu khả thi đầu tư xây dựng, Báo cáo kinh tế - kỹ thuật đầu tư xây dựng,\nthiết kế xây dựng triển khai sau thiết kế cơ sở , kiểm tra công tác nghiệm thu dự án, công trình xây dựng theo quy định của pháp luật về xây dựng; quy định việc phân cấp quản lý, kiểm tra về phòng cháy, chữa cháy đối với cơ sở do cơ quan chuyên môn trực thuộc thực hiện.\n8. Bộ Nông nghiệp và Môi trường:\na) Chủ trì, phối hợp với Bộ Công an quy định về giải pháp kỹ thuật nâng cao an toàn phòng cháy, chữa cháy cho các cơ sở, công trình không bảo đảm yêu cầu về phòng cháy và chữa cháy và không có khả năng khắc phục theo các tiêu chuẩn, quy chuẩn kỹ thuật tại thời điểm đưa vào hoạt động đến trước ngày Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ có hiệu lực thi hành thuộc thẩm quyền quản lý sau khi thống nhất với Bộ Xây dựng;\nb) Hướng dẫn, chỉ đạo, tổ chức thực hiện thẩm định thiết kế, kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy thuộc lĩnh vực quản lý quy định tại Điều 17 và Điều 18 của Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ;\nc) Kiểm tra cơ quan chuyên môn trực thuộc trong việc tổ chức thẩm định thiết kế, kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy cùng với kiểm tra việc tổ chức thẩm định Báo cáo nghiên cứu khả thi đầu tư xây dựng, Báo cáo kinh tế - kỹ thuật đầu tư xây dựng,\nthiết kế xây dựng triển khai sau thiết kế cơ sở , kiểm tra công tác nghiệm thu dự án, công trình xây dựng theo quy định của pháp luật về xây dựng; quy định việc phân cấp quản lý, kiểm tra về phòng cháy, chữa cháy đối với cơ sở do cơ quan chuyên môn trực thuộc thực hiện.\n9. Bộ Văn hóa, Thể thao và Du lịch chủ trì, phối hợp với Bộ Công an và các cơ quan liên quan hướng dẫn, chỉ đạo cơ quan thông tin, truyền thông tuyên truyền, phổ biến, giáo dục kiến thức, pháp luật, kỹ năng về phòng cháy, chữa cháy, cứu nạn, cứu hộ trên các phương tiện thông tin đại chúng.\n10. Bộ Khoa học và Công nghệ thực hiện giao nhiệm vụ hoặc đặt hàng cho các nhà mạng viễn thông định kỳ tổ chức gửi tin nhắn cho các thuê bao di động để khuyến cáo, cảnh báo và hướng dẫn các kỹ năng phòng ngừa, xử lý các tình huống cháy, nổ, tai nạn, sự cố theo quy định của pháp luật về đấu thầu, ngân sách nhà nước; chủ trì, phối hợp với Bộ Công an và các cơ quan liên quan thực hiện nhiệm vụ khoa học và công nghệ cấp quốc gia về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n11. Đài Truyền hình Việt Nam, Đài Tiếng nói Việt Nam, Thông tấn xã Việt Nam:\na) Tăng cường thời lượng, ưu tiên bố trí khung giờ tuyên truyền, phổ biến kiến thức, kỹ năng phòng cháy, chữa cháy, thoát hiểm, thoát nạn, cảnh báo nguy cơ cháy;\nb) Mở chuyên mục tuyên truyền thường xuyên về phòng cháy, chữa cháy, cứu nạn, cứu hộ vào các khung giờ khán giả dễ theo dõi.","y":"1. 각 부, 부급 기관, 정부 소속 기관은 자신의 임무, 권한, 관리 분야의 범위 내에서 다음의 책임을 진다:\na) 권한에 따라 소방 및 구조·구난에 관한 법규범 문서, 기술 표준·기술 규정을 제정하거나 권한 있는 기관에 제출하여 제정하도록 하고 그 시행을 조직한다;\nb) 소방 및 구조·구난 업무에 관한 관리의 조직, 지도를 지휘한다;\nc) 소방 및 구조·구난 활동, 소방 및 구조·구난 장비·설비 비치를 위한 경비를 배정한다;\nd) 법령에 따른 그 밖의 임무를 수행한다.\n2. 국방부:\na) 국방부의 관리 범위에 속하며 군사·국방 목적에 사용되는 사업장, 건축물, 군사구역, 교통수단 및 국방시설·군사구역의 관리·보호 관련 법령에 따른 민군 겸용(이중용도) 국방시설에 대하여 소방 및 구조·구난에 관한 국가관리를 수행한다; 필요하다고 인정하는 경우, 국방부는 군사·국방 사업, 시설에 대한 소방 및 구조·구난 안전 보장에 관한 국내 또는 국제 규정의 적용을 지도하여 줄 것을 공안부에 요청한다;\nb) 관리 범위에 속하는 기능 기관·단위가 주관하여 공안기관 및 관련 기관과 협력하여 민군 겸용(이중용도) 국방시설에 대한 화재진압·구조구난 계획(방안)을 수립, 훈련(실습)하고 화재진압, 구조·구난을 조직하도록 지휘한다.\n3. 건설부:\na) 관리 권한에 속하는 것으로서, 소방 요건을 충족하지 못하고 「소방 및 구조·구난법」 시행일 전까지의 가동 개시 시점의 기술 표준·기술 규정에 따라 시정할 능력이 없는 사업장, 건축물에 대한 소방 안전 향상 기술적 해결책에 관하여 주관하여 공안부와 협력하여 규정한다;\nb) 「소방 및 구조·구난법」 제17조 및 제18조에 규정된 관리 분야에 속하는 소방 설계 심사, 소방 준공검사(인수검사) 확인의 수행을 지도, 지휘, 조직한다;\nc) 도시·농촌 계획, 관리 범위에 속하는 각 계획을 소방 기반시설 계획과 연계하여 검토, 조정하여 실제 상황에 부합하도록 보장한다;\nd) 방화·내화 자재, 부재(구조부재)에 대한 유통 허가서를 발급할 권한이 있는 기관·단위를 분권(위임)한다;\nđ) 건설 전문기관의 소방 설계 심사, 소방 준공검사(인수검사) 확인 실시를, 건설 투자 타당성조사 보고서, 건설 투자 경제·기술 보고서,\n기본설계 이후 전개되는 건설설계의 심사 실시 및 건설 관련 법령에 따른 사업, 건설공사 준공검사(인수검사) 확인에 대한 점검과 함께 점검한다;\ne) 이 시행령에 첨부된 부록 II에 속하는 사업장, 교통수단에 대하여 소속 전문기관이 수행하는 소방 관리, 점검(검사)의 분권(위임)에 관하여 규정한다.\n4. 교육훈련부:\na) 공안부와 협력하여 교육기관, 직업교육기관의 학생, 대학생을 위한 소방 및 구조·구난에 관한 지식, 기능(기술) 내용을 작성한다;\nb) 교육기관이 소방 및 구조·구난에 관한 지식·법령을 교육과정에 통합, 연계하여 시행하도록 지도, 지휘한다. 유아교육, 보통교육(초·중등교육), 대학교육, 직업교육 기관에서 각 학교급, 전공에 부합하게 소방 및 구조·구난에 관한 교육, 지식 구비, 기능 실습을 보장하는 조건을 규정하는 문서를 주관하여 제정한다.\n5. 재무부:\na) 주관하여 중앙의 각 부·부문, 부급 기관과 협력하여 국가예산 관련 법령에 따라 소방 및 구조·구난 임무를 수행하기 위한 연간 지출 예산을 배정하도록 권한 있는 기관에 제출한다; 각 부, 부문, 지방의 소방 및 구조·구난 활동을 위한 5개년 개발투자계획, 3개년 재정·국가예산계획, 연간 국가예산 추계에서의 자원 배분을 종합한다;\nb) 「공공투자법」의 규정에 따라 소방 및 구조·구난 활동에 사용되는 시설의 건설 투자, 장비·설비의 생산·구매를 위한 것으로서, 국가목표프로그램, 국가 중요 사업에 속하는 프로그램·사업, 정부가 투자 방침을 결정하는 공공투자 프로그램, 총리가 투자 방침을 결정하는 공공투자 프로그램·사업의 자금원 및 자금 균형 능력을 심사한다; 종합하여 권한 있는 기관에 제출하여 승인받아 시행한다.\n6. 외교부:\na) 외교공관, 영사기관, 국제기구 대표기관의 청사 및 이들 기관 구성원의 주택에 대한 소방 및 구조·구난 업무에서 주관하여 공안부와 협력한다; 화재진압, 구조·구난 참여를 위한 동원에 대하여 특권·면제를 누리는 베트남 주재 국제기구, 외국 조직·개인에 관한 정보를 게시한다;\nb) 베트남과 영사협정을 체결한 국가의 영사기관 청사, 유엔 체계에 속하는 국제기구 대표기관의 청사, 유엔 체계 밖의 정부 간 국제기구 대표기관의 청사, 국제기구의 각 대표단으로서 해당 기관의 장 또는 그 위임을 받은 사람의 요청이나 동의가 있는 경우에만 베트남의 소방 및 구조·구난 조직이 화재진압을 위하여 출입할 수 있는 곳에 관하여 공안부에 통보한다; 베트남 국민이 아니거나 베트남에 상주하는 사람이 아닌 영사관원의 주택으로서 베트남과 영사 파견국 간의 영사협정에 베트남의 소방 및 구조·구난 조직이 그 사람들의 요청이나 동의가 있는 경우에만 화재진압을 위하여 출입할 수 있다고 규정되어 있는 곳에 관하여 공안부에 통보한다.\n7. 산업무역부:\na) 관리 권한에 속하는 것으로서, 소방 요건을 충족하지 못하고 「소방 및 구조·구난법」 시행일 전까지의 가동 개시 시점의 기술 표준·기술 규정에 따라 시정할 능력이 없는 사업장, 건축물에 대한 소방 안전 향상 기술적 해결책에 관하여 주관하여 공안부와 협력하여 규정한다;\nb) 「소방 및 구조·구난법」 제17조 및 제18조에 규정된 관리 분야에 속하는 소방 설계 심사, 소방 준공검사(인수검사) 확인의 수행을 지도, 지휘, 조직한다;\nc) 전기 소매 단위가 생활용 전기를 연결할 때 화재예방 안전을 보장하기 위하여 전기 설비(시스템)·기기의 설치, 사용에 관하여 상담하도록 지휘, 지도한다;\nd) 생활, 생산에서의 전기 사용 안전 보장에 관한 홍보, 지도, 점검의 수행을 지휘하고 전력 관련 법령에 따른 전기 사용 안전에 관한 그 밖의 임무를 수행한다;\nđ) 소속 전문기관의 소방 설계 심사, 소방 준공검사(인수검사) 확인 실시를, 건설 투자 타당성조사 보고서, 건설 투자 경제·기술 보고서,\n기본설계 이후 전개되는 건설설계의 심사 실시 및 건설 관련 법령에 따른 사업, 건설공사 준공검사(인수검사) 확인에 대한 점검과 함께 점검한다; 사업장에 대하여 소속 전문기관이 수행하는 소방 관리, 점검(검사)의 분권(위임)에 관하여 규정한다.\n8. 농업환경부:\na) 관리 권한에 속하는 것으로서, 소방 요건을 충족하지 못하고 「소방 및 구조·구난법」 시행일 전까지의 가동 개시 시점의 기술 표준·기술 규정에 따라 시정할 능력이 없는 사업장, 건축물에 대한 소방 안전 향상 기술적 해결책에 관하여 건설부와 합의한 후 주관하여 공안부와 협력하여 규정한다;\nb) 「소방 및 구조·구난법」 제17조 및 제18조에 규정된 관리 분야에 속하는 소방 설계 심사, 소방 준공검사(인수검사) 확인의 수행을 지도, 지휘, 조직한다;\nc) 소속 전문기관의 소방 설계 심사, 소방 준공검사(인수검사) 확인 실시를, 건설 투자 타당성조사 보고서, 건설 투자 경제·기술 보고서,\n기본설계 이후 전개되는 건설설계의 심사 실시 및 건설 관련 법령에 따른 사업, 건설공사 준공검사(인수검사) 확인에 대한 점검과 함께 점검한다; 사업장에 대하여 소속 전문기관이 수행하는 소방 관리, 점검(검사)의 분권(위임)에 관하여 규정한다.\n9. 문화체육관광부는 주관하여 공안부 및 관련 기관과 협력하여 정보·언론 기관이 대중매체를 통하여 소방 및 구조·구난에 관한 지식, 법령, 기능을 홍보, 보급, 교육하도록 지도, 지휘한다.\n10. 과학기술부는 입찰, 국가예산 관련 법령에 따라 통신사업자에게 임무를 부여하거나 발주하여 이동통신 가입자에게 화재·폭발, 사고, 사건 상황의 예방·대처 기능을 권고, 경고 및 안내하는 문자메시지를 정기적으로 발송하도록 한다; 주관하여 공안부 및 관련 기관과 협력하여 소방 및 구조·구난에 관한 국가급 과학기술 임무를 수행한다.\n11. 베트남 텔레비전 방송국, 베트남의 소리 방송국, 베트남 통신사:\na) 화재예방, 화재진압, 탈출, 피난에 관한 지식·기능의 홍보·보급, 화재 위험 경고를 위한 방송 시간을 늘리고 시간대를 우선 배정한다;\nb) 시청자가 시청하기 쉬운 시간대에 소방 및 구조·구난에 관한 상시 홍보 고정 프로그램(코너)을 개설한다.","o":[["Điểm b khoản 3 Điều 41 được sửa đổi bởi điểm a khoản 1 Điều 27 Nghị định số 347/2026/NĐ-CP","nd347-27"],["Điểm d khoản 3 Điều 41 bị bãi bỏ bởi khoản 2 Điều 30 Nghị định số 347/2026/NĐ-CP","nd347-30"],["Điểm đ khoản 3 Điều 41 được sửa đổi bởi điểm b khoản 1 Điều 27 Nghị định số 347/2026/NĐ-CP","nd347-27"],["Điều 74 bị bãi bỏ bởi Điều 39 Nghị định số 347/2026/NĐ-CP","nd347-39"],["Cụm từ ''thiết kế xây dựng triển khai sau thiết kế cơ sở'' bị thay thế bởi Khoản 2 Điều 74 Nghị định số 217/2026/NĐ-CP",""],["Điểm e khoản 3 Điều 41 bị bãi bỏ bởi khoản 2 Điều 30 Nghị định số 347/2026/NĐ-CP","nd347-30"],["Điểm b khoản 7 Điều 41 được sửa đổi bởi điểm a khoản 2 Điều 27 Nghị định số 347/2026/NĐ-CP","nd347-27"],["Điểm đ khoản 7 Điều 41 được sửa đổi bởi điểm b khoản 2 Điều 27 Nghị định số 347/2026/NĐ-CP","nd347-27"],["Điểm b khoản 8 Điều 41 được sửa đổi bởi điểm a khoản 3 Điều 27 Nghị định số 347/2026/NĐ-CP","nd347-27"],["Điểm c khoản 8 Điều 41 được sửa đổi bởi điểm b khoản 3 Điều 27 Nghị định số 347/2026/NĐ-CP","nd347-27"]]},{"id":"nd105-42","d":"nd105","n":"42","t":"Trách nhiệm của Ủy ban nhân dân các cấp","k":"각급 인민위원회의 책임","c":"제7장 소방 및 구조·구난 국가관리","x":"1. Ủy ban nhân dân cấp tỉnh trong phạm vi nhiệm vụ, quyền hạn của mình có trách nhiệm thực hiện chức năng quản lý nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ ở địa phương và có nhiệm vụ cụ thể sau đây:\na) Ban hành các quy định về phòng cháy, chữa cháy, cứu nạn, cứu hộ tại địa phương theo thẩm quyền quy định của pháp luật;\nb) Chỉ đạo, kiểm tra và tổ chức việc thực hiện các quy định của pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ tại địa phương; xử lý vi phạm quy định về phòng cháy, chữa cháy, cứu nạn, cứu hộ theo thẩm quyền;\nc) Hướng dẫn, chỉ đạo tuyên truyền, phổ biến, giáo dục kiến thức, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ; xây dựng phong trào toàn dân tham gia phòng cháy, chữa cháy, cứu nạn, cứu hộ; chỉ đạo thành lập và duy trì điều kiện hoạt động của các trung tâm học tập cộng đồng về phòng cháy, chữa cháy, cứu nạn, cứu hộ lồng ghép với các trung tâm học tập cộng đồng; chỉ đạo việc tổ chức thực hiện quy định tại khoản 1 Điều 27 Nghị định này;\nd) Đầu tư ngân sách cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ; trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật;\nđ) Bảo đảm điều kiện về thông tin báo cháy, báo tình huống cứu nạn, cứu hộ, đường giao thông, nguồn nước phục vụ chữa cháy;\ne) Bảo đảm kinh phí trang bị thiết bị truyền tin báo cháy kết nối với hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy đối với nhà ở tại thành phố trực thuộc trung ương thuộc khu vực không bảo đảm hạ tầng giao thông hoặc nguồn nước phục vụ chữa cháy theo quy định của pháp luật, quy chuẩn kỹ thuật trong hoạt động phòng cháy, chữa cháy;\ng) Quy hoạch địa điểm, đề xuất cấp đất và xây dựng doanh trại cho lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ;\nh) Chỉ đạo việc xây dựng và thực tập phương án chữa cháy, cứu nạn, cứu hộ, phương án cứu nạn, cứu hộ cần huy động nhiều lực lượng, phương tiện tham gia;\ni) Chỉ đạo tổ chức chữa cháy, cứu nạn, cứu hộ và khắc phục hậu quả vụ cháy;\nk) Kiểm tra cơ quan chuyên môn trực thuộc trong việc tổ chức thẩm định\nthiết kế, kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy cùng với kiểm tra việc tổ chức thẩm định Báo cáo nghiên cứu khả thi đầu tư xây dựng, Báo cáo kinh tế - kỹ thuật đầu tư xây dựng, thiết kế xây dựng triển khai sau thiết kế cơ sở, kiểm tra công tác nghiệm thu dự án, công trình xây dựng theo quy định của pháp luật về xây dựng.\n2. Ủy ban nhân dân cấp xã trong phạm vi nhiệm vụ, quyền hạn của mình có trách nhiệm thực hiện quản lý nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ ở địa phương và có nhiệm vụ cụ thể sau đây:\na) Chỉ đạo, kiểm tra và tổ chức thực hiện các quy định của pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ; quản lý, kiểm tra về phòng cháy, chữa cháy đối với nhà ở, nhà ở kết hợp sản xuất, kinh doanh, cơ sở thuộc Phụ lục I, trừ cơ sở có nguy hiểm về cháy, nổ quy định tại Phụ lục II kèm theo Nghị định này; xử lý vi phạm quy định về phòng cháy, chữa cháy, cứu nạn, cứu hộ theo thẩm quyền;\nb) Tổ chức tuyên truyền, phổ biến, giáo dục kiến thức, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ; xây dựng phong trào toàn dân tham gia phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nc) Tổ chức quản lý Đội dân phòng;\nd) Đầu tư kinh phí cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ; trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng dân phòng theo quy định của pháp luật;\nđ) Tổ chức chữa cháy, cứu nạn, cứu hộ và khắc phục hậu quả vụ cháy.","y":"1. 성급 인민위원회는 자신의 임무, 권한의 범위 내에서 지방의 소방 및 구조·구난에 관한 국가관리 기능을 수행할 책임이 있으며 다음의 구체적 임무를 가진다:\na) 법령이 규정한 권한에 따라 지방의 소방 및 구조·구난에 관한 규정을 제정한다;\nb) 지방에서 소방 및 구조·구난에 관한 법령 규정의 이행을 지휘, 점검하고 조직한다; 권한에 따라 소방 및 구조·구난에 관한 규정 위반을 처리한다;\nc) 소방 및 구조·구난에 관한 지식·법령의 홍보, 보급, 교육을 지도, 지휘한다; 전 국민이 소방 및 구조·구난에 참여하는 운동을 조성한다; 소방 및 구조·구난에 관한 지역사회 학습센터를 지역사회 학습센터와 연계하여 설립하고 그 활동 여건을 유지하도록 지휘한다; 이 시행령 제27조 제1항 규정의 시행 조직을 지휘한다;\nd) 소방 및 구조·구난 활동을 위하여 예산을 투자한다; 법령에 따라 소방 및 구조·구난 장비·설비를 비치한다;\nđ) 화재 신고, 구조·구난 상황 신고를 위한 통신, 도로, 화재진압용 수원에 관한 여건을 보장한다;\ne) 법령 및 소방 활동에 관한 기술 규정에 따라 화재진압을 위한 교통 기반시설 또는 수원이 확보되지 아니한 지역에 속하는 중앙직할시 내 주택에 대하여 소방, 구조·구난 및 화재 신호 전송 데이터베이스 시스템과 연결되는 화재 신호 전송 장치를 비치하기 위한 경비를 보장한다;\ng) 소방경찰(소방·구조구난 경찰)을 위한 부지를 계획하고 토지 배정을 제안하며 병영을 건설한다;\nh) 다수의 인력, 장비의 동원이 필요한 화재진압·구조구난 계획(방안), 구조·구난 계획(방안)의 수립 및 훈련(실습)을 지휘한다;\ni) 화재진압, 구조·구난의 조직 및 화재 사건의 결과 복구를 지휘한다;\nk) 소속 전문기관의 소방\n설계 심사, 소방 준공검사(인수검사) 확인 실시를, 건설 투자 타당성조사 보고서, 건설 투자 경제·기술 보고서, 기본설계 이후 전개되는 건설설계의 심사 실시 및 건설 관련 법령에 따른 사업, 건설공사 준공검사(인수검사) 확인에 대한 점검과 함께 점검한다.\n2. 사(면)급 인민위원회는 자신의 임무, 권한의 범위 내에서 지방의 소방 및 구조·구난에 관한 국가관리를 수행할 책임이 있으며 다음의 구체적 임무를 가진다:\na) 소방 및 구조·구난에 관한 법령 규정의 이행을 지휘, 점검하고 조직한다; 주택, 생산·영업 겸용 주택, 부록 I에 속하는 사업장에 대하여 소방 관리, 점검(검사)을 한다. 다만, 이 시행령에 첨부된 부록 II에 규정된 화재·폭발 위험 사업장은 제외한다; 권한에 따라 소방 및 구조·구난에 관한 규정 위반을 처리한다;\nb) 소방 및 구조·구난에 관한 지식·법령의 홍보, 보급, 교육을 조직한다; 전 국민이 소방 및 구조·구난에 참여하는 운동을 조성한다;\nc) 민방위 소방대의 관리를 조직한다;\nd) 소방 및 구조·구난 활동을 위하여 경비를 투자한다; 법령에 따라 민방위 소방대를 위한 소방 및 구조·구난 장비·설비를 비치한다;\nđ) 화재진압, 구조·구난 및 화재 사건의 결과 복구를 조직한다.","o":[["Cụm từ \"thiết kế, kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy cùng với kiểm tra việc tổ chức thẩm định Báo cáo nghiên cứu khả thi đầu tư xây dựng, Báo cáo kinh tế - kỹ thuật đầu tư xây dựng, thiết kế xây dựng triển khai sau thiết kế cơ sở, kiểm tra công tác nghiệm thu\" bị thay thế bởi khoản 7 Điều 31 Nghị định số 347/2026/NĐ-CP","nd347-31"]]},{"id":"nd105-43","d":"nd105","n":"43","t":"Lộ trình xử lý đối với các cơ sở không bảo đảm yêu cầu về phòng cháy và chữa cháy được đưa vào sử dụng trước ngày Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ có hiệu lực thi hành","k":"「소방 및 구조·구난법」 시행일 전에 사용 개시된 사업장으로서 소방 요건을 충족하지 못하는 사업장에 대한 처리 로드맵(일정)","c":"제7장 소방 및 구조·구난 국가관리","x":"1. Chậm nhất đến ngày 01 tháng 01 năm 2026, Ủy ban nhân dân cấp tỉnh hoàn thành việc phân loại, lập và công bố danh sách cơ sở không bảo đảm yêu cầu về phòng cháy và chữa cháy quy định tại khoản 1 Điều 16 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ và không có khả năng khắc phục theo các tiêu chuẩn, quy chuẩn kỹ thuật tại thời điểm đưa vào hoạt động đến trước ngày Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ có hiệu lực thi hành trên địa bàn quản lý.\n2. Chậm nhất đến ngày 01 tháng 7 năm 2026, các bộ quản lý công trình xây dựng chuyên ngành theo quy định của pháp luật về xây dựng có trách nhiệm chủ trì, phối hợp với Bộ Công an thực hiện quy định tại điểm b khoản 6 Điều 55 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ.\n3. Chậm nhất đến ngày 01 tháng 7 năm 2028, cơ sở thuộc danh sách công bố của Ủy ban nhân dân cấp tỉnh quy định tại khoản 1 Điều này phải hoàn thành các nội dung quy định tại điểm c khoản 6 Điều 55 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ. Đối với cơ sở không thể áp dụng được giải pháp kỹ thuật tương ứng do các bộ quản lý công trình xây dựng chuyên ngành ban hành thì sau ngày 01 tháng 7 năm 2028 phải chuyển đổi công năng phù hợp với quy mô, tính chất hoạt động của cơ sở.","y":"1. 늦어도 2026년 01월 01일까지, 성급 인민위원회는 관할 지역 내에서 「소방 및 구조·구난법」 제16조 제1항에 규정된 소방 요건을 충족하지 못하고 「소방 및 구조·구난법」 시행일 전까지의 가동 개시 시점의 기술 표준·기술 규정에 따라 시정할 능력이 없는 사업장의 분류, 명단 작성 및 공표를 완료한다.\n2. 늦어도 2026년 7월 01일까지, 건설 관련 법령에 따른 전문 분야 건설공사 관리 부는 주관하여 공안부와 협력하여 「소방 및 구조·구난법」 제55조 제6항 b호의 규정을 이행할 책임이 있다.\n3. 늦어도 2028년 7월 01일까지, 이 조 제1항에 규정된 성급 인민위원회의 공표 명단에 속하는 사업장은 「소방 및 구조·구난법」 제55조 제6항 c호에 규정된 내용을 완료하여야 한다. 전문 분야 건설공사 관리 부가 제정한 해당 기술적 해결책을 적용할 수 없는 사업장의 경우에는 2028년 7월 01일 이후 사업장의 규모, 활동 성격에 부합하게 용도(기능)를 전환하여야 한다.","o":[]},{"id":"nd105-44","d":"nd105","n":"44","t":"Sửa đổi, bổ sung, bãi bỏ một số điều của Nghị định số 67/2023/NĐ-CP ngày 06 tháng 9 năm 2023 quy định về bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới, bảo hiểm cháy, nổ bắt buộc, bảo hiểm bắt buộc trong hoạt động đầu tư xây dựng, Nghị định số 78/2021/NĐ-CP ngày 01 tháng 8 năm 2021 về thành lập và quản lý Quỹ phòng, chống thiên tai, Nghị định số 175/2024/NĐ-CP ngày 30 tháng 12 năm 2024 quy định chi tiết một số điều và biện pháp thi hành Luật Xây dựng về quản lý hoạt động xây dựng, Nghị định số 161/2024/NĐ-CP ngày 18 tháng 12 năm 2024 quy định danh mục hàng hóa nguy hiểm, vận chuyển hàng hóa nguy hiểm và trình tự, thủ tục cấp giấy phép, cấp giấy chứng nhận hoàn thành chương trình tập huấn cho người lái xe hoặc người áp tải vận chuyển hàng hóa nguy hiểm trên đường bộ, Nghị định số 34/2024/NĐ-CP ngày 31 tháng 3 năm 2024 quy định danh mục hàng hoá nguy hiểm, vận chuyển hàng hoá nguy hiểm bằng phương tiện giao thông cơ giới đường bộ và phương tiện thủy nội địa, Nghị định số 65/2018/NĐ-CP ngày 12 tháng 5 năm 2018 quy định chi tiết thi hành một số điều của Luật Đường sắt","k":"자동차 소유자의 민사책임 의무보험, 화재·폭발 의무보험, 건설 투자 활동에서의 의무보험에 관하여 규정하는 2023년 9월 06일자 시행령 제67/2023/NĐ-CP호, 재난 예방·대응 기금의 설립 및 관리에 관한 2021년 8월 01일자 시행령 제78/2021/NĐ-CP호, 건설 활동 관리에 관한 「건설법」의 일부 조항 및 시행 조치를 상세히 규정하는 2024년 12월 30일자 시행령 제175/2024/NĐ-CP호, 위험물(위험 화물) 목록, 위험물 운송 및 도로에서 위험물을 운송하는 운전자 또는 호송인에 대한 허가서 발급, 교육과정 수료증 발급의 절차·순서를 규정하는 2024년 12월 18일자 시행령 제161/2024/NĐ-CP호, 위험물(위험 화물) 목록, 도로 자동차 교통수단 및 내수로 선박에 의한 위험물 운송을 규정하는 2024년 3월 31일자 시행령 제34/2024/NĐ-CP호, 「철도법」의 일부 조항의 시행을 상세히 규정하는 2018년 5월 12일자 시행령 제65/2018/NĐ-CP호의 일부 조항의 개정, 보충, 폐지","c":"제8장 시행 조항","x":"1. Sửa đổi, bổ sung, bãi bỏ một số điều của Nghị định số 67/2023/NĐ-CP:\na) Sửa đổi, bổ sung điểm b khoản 5 Điều 4 như sau:\n“b) Đối với bảo hiểm cháy, nổ bắt buộc: Cơ sở thuộc diện phải thẩm duyệt thiết kế, thẩm định thiết kế về phòng cháy và chữa cháy nhưng chưa có văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy của cơ quan Công an, cơ quan chuyên môn về xây dựng;”;\nb) Sửa đổi, bổ sung điểm a khoản 1 Điều 23 như sau:\n“a)\nNhà, công trình và các tài sản gắn liền với nhà, công trình; máy móc, thiết bị phục vụ hoạt động, sản xuất, kinh doanh; ”;\nc) Sửa đổi, bổ sung khoản 1 Điều 24 như sau:\n“1. Số tiền bảo hiểm cháy, nổ bắt buộc tối thiểu là giá trị tính thành tiền theo giá thị trường của các tài sản quy định tại khoản 1 Điều 23 Nghị định này tại thời điểm giao kết hợp đồng bảo hiểm.\nĐối với các tài sản quy định tại điểm b khoản 1 Điều 23 Nghị định này được bảo hiểm phù hợp thời gian lưu trữ hàng hóa, vật tư tại cơ sở.”;\nd) Bãi bỏ cụm từ “Căn cứ vào mức độ rủi ro của đối tượng bảo hiểm, doanh nghiệp bảo hiểm được điều chỉnh tăng hoặc giảm phí bảo hiểm tối đa 25% tính trên phí bảo hiểm” tại khoản 1 Điều 26;\nđ) Thay thế cụm từ “Trong mọi trường hợp, mức phí bảo hiểm không được thấp hơn mức phí bảo hiểm tương ứng với 1.000 tỷ đồng nhân (x) 75% tỷ lệ phí bảo hiểm quy định tại khoản 1 Mục I Phụ lục II ban hành kèm theo Nghị định này.” quy định tại khoản 2 Điều 26 bằng cụm từ “Trong mọi trường hợp, tỷ lệ phí bảo hiểm không được thấp hơn 75% tỷ lệ phí bảo hiểm tối thiểu quy định tại khoản 1 Mục I Phụ lục II kèm theo Nghị định này.”;\ne) Thay cụm từ “biên bản kiểm tra an toàn về phòng cháy, chữa cháy” bằng cụm từ “biên bản kiểm tra về phòng cháy, chữa cháy” tại khoản 3 Điều 28 và khoản 3 Điều 29;\ng) Bãi bỏ khoản 1 Điều 30 và khoản 2 Điều 31;\nh) Thay thế Phụ lục II kèm theo Nghị định số 67/2023/NĐ-CP bằng Phụ lục VI kèm theo Nghị định này.\n2. Bổ sung điểm d vào sau điểm c khoản 1 Điều 16 Nghị định số 78/2021/NĐ-CP như sau:\n“d) Chi hỗ trợ các hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định.”.\n3. Sửa đổi, bổ sung một số điều của Nghị định số 175/2024/NĐ-CP:\na) Sửa đổi, bổ sung điểm b khoản 3 Điều 5 như sau:\n“b) Dự án đầu tư xây dựng mới, cải tạo, nâng cấp có tổng mức đầu tư không quá 20 tỷ đồng (không bao gồm chi phí bồi thường, giải phóng mặt bằng, tiền sử dụng đất), trừ dự án đầu tư xây dựng công trình di sản văn hoá thực hiện theo pháp luật về di sản văn hoá và các trường hợp phải thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan chuyên môn về xây dựng khi xây dựng mới, thay đổi công năng, cải tạo trong quá trình sử dụng theo quy định của pháp luật về phòng cháy và chữa cháy;”;\nb) Bãi bỏ cụm từ “hoặc pháp luật về phòng cháy chữa cháy” tại điểm c khoản 6 Điều 19;\nc) Bổ sung điểm đ vào sau điểm d khoản 2 Điều 23 như sau:\n“đ) Khi điều chỉnh thiết kế thuộc trường hợp phải thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan chuyên môn về xây dựng theo quy định của pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ.”;\nd) Thay thế cụm từ “kết quả thực hiện thủ tục phòng cháy, chữa cháy theo quy định;” tại điểm a khoản 5 Điều 46 bằng cụm từ “Báo cáo kết quả thẩm tra thiết kế xây dựng theo quy định tại khoản 5 Điều 43 Nghị định này;”;\nđ) Bổ sung cụm từ “hoặc Báo cáo kết quả thẩm tra thiết kế xây dựng theo quy định tại khoản 5 Điều 43 Nghị định này;” vào sau cụm từ “đối tượng có yêu cầu thẩm duyệt về phòng cháy, chữa cháy” tại điểm b khoản 2 Điều 52.\n4. Sửa đổi, bổ sung một số điều của Nghị định số 161/2024/NĐ-CP:\na) Bãi bỏ khoản 1 Điều 14 và Điều 19;\nb) Sửa đổi, bổ sung khoản 3 Điều 14 như sau:\n“3. Bộ Công Thương tổ chức cấp Giấy phép vận chuyển hàng hóa nguy hiểm loại 1, loại 2, loại 3, loại 4, loại 5, loại 8, loại 9 theo quy định tại khoản 1 Điều 4 của Nghị định này (trừ hóa chất bảo vệ thực vật và quy định tại khoản 2 Điều này).”;\nc) Sửa đổi, bổ sung khoản 1 Điều 23 như sau:\n“1. Quản lý danh mục hàng hóa nguy hiểm đối với loại 1, loại 2, loại 3, loại 4, loại 5, loại 8, loại 9, các loại xăng dầu, khí đốt và các hóa chất nguy hiểm, các hóa chất độc nguy hiểm còn lại theo quy định tại khoản 1 Điều 4 của Nghị định này.”;\nd) Sửa đổi, bổ sung khoản 3 Điều 23 như sau:\n“3. Chủ trì, phối hợp với Bộ Xây dựng, Bộ Khoa học và Công nghệ và các bộ, ngành có liên quan tham mưu Chính phủ sửa đổi, bổ sung danh mục hàng hóa nguy hiểm loại 1, loại 2, loại 3, loại 4, loại 5, loại 8, loại 9, các loại xăng dầu, khí đốt và các hóa chất nguy hiểm, các hóa chất độc nguy hiểm còn lại theo quy định tại khoản 1 Điều 4 của Nghị định này.”;\nđ) Sửa đổi, bổ sung khoản 4 Điều 23 như sau:\n“4. Quy định loại hàng hóa nguy hiểm thuộc loại 1, loại 2, loại 3, loại 4, loại 5, loại 8, loại 9 khi vận chuyển bắt buộc phải có người áp tải.”;\ne) Sửa đổi, bổ sung điểm b khoản 7 Điều 31 như sau:\n“3. Bộ Công Thương tổ chức cấp Giấy phép vận chuyển hàng hóa nguy hiểm loại 1, loại 2, loại 3, loại 4, loại 5, loại 8, loại 9 theo quy định tại khoản 1 Điều 4 của Nghị định này (trừ hóa chất bảo vệ thực vật và quy định tại khoản 2 Điều này).”;\ng) Sửa đổi, bổ sung khoản 13 Điều 31 như sau:\n“Điều 26. Bộ Công Thương\n1. Quản lý danh mục hàng hóa nguy hiểm đối với loại 1, loại 2, loại 3, loại 4, loại 5, loại 8, loại 9, các loại xăng dầu, khí đốt và các hóa chất nguy hiểm, các hóa chất độc nguy hiểm còn lại theo quy định tại khoản 1 Điều 4 của Nghị định này.\n2. Quản lý hoạt động vận chuyển hàng hóa nguy hiểm và tổ chức thực hiện việc cấp Giấy phép vận chuyển hàng hóa nguy hiểm trong phạm vi quản lý theo quy định tại khoản 3 Điều 17 của Nghị định này.\n3. Chủ trì, phối hợp với Bộ Xây dựng, Bộ Khoa học và Công nghệ và các bộ, ngành có liên quan tham mưu Chính phủ sửa đổi, bổ sung danh mục hàng hóa nguy hiểm loại 1, loại 2, loại 3, loại 4, loại 5, loại 8, loại 9, các loại xăng dầu, khí đốt và các hóa chất nguy hiểm, các hóa chất độc nguy hiểm còn lại theo quy định tại khoản 1 Điều 4 của Nghị định này.\n4. Quy định loại hàng hóa nguy hiểm thuộc loại 1, loại 2, loại 3, loại 4, loại 5, loại 8, loại 9 khi vận chuyển bắt buộc phải có người áp tải.\n5. Chủ trì, phối hợp với các bộ, ngành có liên quan trong công tác quản lý, thanh tra, kiểm tra và xử lý vi phạm đối với hoạt động vận chuyển hàng hóa nguy hiểm theo thẩm quyền. Thanh tra, kiểm tra và xử lý vi phạm đối với hoạt động huấn luyện an toàn hàng hóa nguy hiểm theo thẩm quyền.”.\n5. Bãi bỏ khoản 1 Điều 17 và Điều 22 Nghị định số 34/2024/NĐ-CP.\n6. Sửa đổi, bổ sung điểm a khoản 2 Điều 39 Nghị định số 65/2018/NĐ-CP như sau:\n“a) Bộ Công Thương tổ chức cấp Giấy phép vận chuyển hàng hóa nguy hiểm loại 1, loại 2, loại 3, loại 4, loại 9 quy định tại khoản 1 Điều 26 Nghị định này (trừ hóa chất bảo vệ thực vật và quy định tại điểm b khoản 2 Điều này);”.","y":"1. 시행령 제67/2023/NĐ-CP호의 일부 조항의 개정, 보충, 폐지:\na) 제4조 제5항 b호를 다음과 같이 개정, 보충한다:\n“b) 화재·폭발 의무보험의 경우: 소방 설계 승인(thẩm duyệt), 소방 설계 심사를 받아야 하는 대상에 속하나 공안기관, 건설 전문기관의 소방 준공검사(인수검사) 결과 승인 문서를 아직 받지 못한 사업장;”;\nb) 제23조 제1항 a호를 다음과 같이 개정, 보충한다:\n“a)\n주택(건물), 건축물 및 주택(건물), 건축물에 부착된 자산; 활동, 생산, 영업에 사용되는 기계, 설비; ”;\nc) 제24조 제1항을 다음과 같이 개정, 보충한다:\n“1. 화재·폭발 의무보험의 최저 보험가입금액은 보험계약 체결 시점에 이 시행령 제23조 제1항에 규정된 자산을 시장가격에 따라 금액으로 환산한 가치이다.\n이 시행령 제23조 제1항 b호에 규정된 자산은 사업장에서의 화물, 자재 보관 기간에 맞추어 보험에 가입된다.”;\nd) 제26조 제1항에서 “보험 대상의 위험도에 근거하여, 보험회사는 보험료를 기준으로 계산하여 최대 25%까지 보험료를 인상 또는 인하 조정할 수 있다”라는 문구를 폐지한다;\nđ) 제26조 제2항에 규정된 “어떠한 경우에도 보험료 수준은 1.000 tỷ(십억) 동에 이 시행령에 첨부하여 공포된 부록 II 제I절 제1항에 규정된 보험료율의 75%를 곱한(x) 금액에 해당하는 보험료 수준보다 낮아서는 아니 된다.”라는 문구를 “어떠한 경우에도 보험료율은 이 시행령에 첨부된 부록 II 제I절 제1항에 규정된 최저 보험료율의 75%보다 낮아서는 아니 된다.”라는 문구로 대체한다;\ne) 제28조 제3항 및 제29조 제3항에서 “소방 안전 점검 조서”라는 문구를 “소방 점검(검사) 조서”라는 문구로 바꾼다;\ng) 제30조 제1항 및 제31조 제2항을 폐지한다;\nh) 시행령 제67/2023/NĐ-CP호에 첨부된 부록 II를 이 시행령에 첨부된 부록 VI으로 대체한다.\n2. 시행령 제78/2021/NĐ-CP호 제16조 제1항 c호 다음에 d호를 다음과 같이 보충한다:\n“d) 규정에 따른 소방 및 구조·구난 활동의 지원 지출.”.\n3. 시행령 제175/2024/NĐ-CP호의 일부 조항의 개정, 보충:\na) 제5조 제3항 b호를 다음과 같이 개정, 보충한다:\n“b) 총투자액이 20 tỷ(십억) 동 이하(보상비, 부지 정리비, 토지사용료는 포함하지 아니한다)인 신축, 개조, 개량 건설 투자 사업. 다만, 문화유산 관련 법령에 따라 시행하는 문화유산 건축물 건설 투자 사업 및 소방 관련 법령에 따라 신축, 용도(기능) 변경, 사용 과정 중 개조 시 건설 전문기관의 소방 설계 심사를 받아야 하는 경우는 제외한다;”;\nb) 제19조 제6항 c호에서 “또는 소방 관련 법령”이라는 문구를 폐지한다;\nc) 제23조 제2항 d호 다음에 đ호를 다음과 같이 보충한다:\n“đ) 설계를 조정하는 것이 소방 및 구조·구난 관련 법령에 따라 건설 전문기관의 소방 설계 심사를 받아야 하는 경우에 해당하는 때.”;\nd) 제46조 제5항 a호에서 “규정에 따른 소방 절차 이행 결과;”라는 문구를 “이 시행령 제43조 제5항의 규정에 따른 건설설계 검증(thẩm tra) 결과 보고서;”라는 문구로 대체한다;\nđ) 제52조 제2항 b호에서 “소방 승인(thẩm duyệt) 요구가 있는 대상”이라는 문구 다음에 “또는 이 시행령 제43조 제5항의 규정에 따른 건설설계 검증(thẩm tra) 결과 보고서;”라는 문구를 보충한다.\n4. 시행령 제161/2024/NĐ-CP호의 일부 조항의 개정, 보충:\na) 제14조 제1항 및 제19조를 폐지한다;\nb) 제14조 제3항을 다음과 같이 개정, 보충한다:\n“3. 산업무역부는 이 시행령 제4조 제1항의 규정에 따른 제1류, 제2류, 제3류, 제4류, 제5류, 제8류, 제9류 위험물 운송 허가서의 발급을 조직한다(식물보호 화학물질 및 이 조 제2항의 규정은 제외한다).”;\nc) 제23조 제1항을 다음과 같이 개정, 보충한다:\n“1. 이 시행령 제4조 제1항의 규정에 따른 제1류, 제2류, 제3류, 제4류, 제5류, 제8류, 제9류, 각종 석유류, 연료가스 및 나머지 위험 화학물질, 위험 독성 화학물질에 대한 위험물 목록을 관리한다.”;\nd) 제23조 제3항을 다음과 같이 개정, 보충한다:\n“3. 주관하여 건설부, 과학기술부 및 관련 부·부문과 협력하여 이 시행령 제4조 제1항의 규정에 따른 제1류, 제2류, 제3류, 제4류, 제5류, 제8류, 제9류, 각종 석유류, 연료가스 및 나머지 위험 화학물질, 위험 독성 화학물질의 위험물 목록을 개정, 보충하도록 정부에 자문(건의)한다.”;\nđ) 제23조 제4항을 다음과 같이 개정, 보충한다:\n“4. 제1류, 제2류, 제3류, 제4류, 제5류, 제8류, 제9류에 속하는 위험물 중 운송 시 반드시 호송인이 있어야 하는 위험물의 종류를 규정한다.”;\ne) 제31조 제7항 b호를 다음과 같이 개정, 보충한다:\n“3. 산업무역부는 이 시행령 제4조 제1항의 규정에 따른 제1류, 제2류, 제3류, 제4류, 제5류, 제8류, 제9류 위험물 운송 허가서의 발급을 조직한다(식물보호 화학물질 및 이 조 제2항의 규정은 제외한다).”;\ng) 제31조 제13항을 다음과 같이 개정, 보충한다:\n“제26조. 산업무역부\n1. 이 시행령 제4조 제1항의 규정에 따른 제1류, 제2류, 제3류, 제4류, 제5류, 제8류, 제9류, 각종 석유류, 연료가스 및 나머지 위험 화학물질, 위험 독성 화학물질에 대한 위험물 목록을 관리한다.\n2. 이 시행령 제17조 제3항의 규정에 따라 관리 범위 내에서 위험물 운송 활동을 관리하고 위험물 운송 허가서 발급의 시행을 조직한다.\n3. 주관하여 건설부, 과학기술부 및 관련 부·부문과 협력하여 이 시행령 제4조 제1항의 규정에 따른 제1류, 제2류, 제3류, 제4류, 제5류, 제8류, 제9류, 각종 석유류, 연료가스 및 나머지 위험 화학물질, 위험 독성 화학물질의 위험물 목록을 개정, 보충하도록 정부에 자문(건의)한다.\n4. 제1류, 제2류, 제3류, 제4류, 제5류, 제8류, 제9류에 속하는 위험물 중 운송 시 반드시 호송인이 있어야 하는 위험물의 종류를 규정한다.\n5. 주관하여 관련 부·부문과 협력하여 권한에 따라 위험물 운송 활동에 대한 관리, 감사, 점검 및 위반 처리 업무를 수행한다. 권한에 따라 위험물 안전 훈련 활동에 대한 감사, 점검 및 위반 처리를 한다.”.\n5. 시행령 제34/2024/NĐ-CP호 제17조 제1항 및 제22조를 폐지한다.\n6. 시행령 제65/2018/NĐ-CP호 제39조 제2항 a호를 다음과 같이 개정, 보충한다:\n“a) 산업무역부는 이 시행령 제26조 제1항에 규정된 제1류, 제2류, 제3류, 제4류, 제9류 위험물 운송 허가서의 발급을 조직한다(식물보호 화학물질 및 이 조 제2항 b호의 규정은 제외한다);”.","o":[["Tên Điều 44 được sửa đổi bởi khoản 1 Điều 28 Nghị định số 347/2026/NĐ-CP","nd347-28"],["Điểm a khoản 1 Điều 44 được sửa đổi, bổ sung bởi khoản 2 Điều 28 Nghị định số 347/2026/NĐ-CP","nd347-28"],["Điểm b khoản 1 Điều 44 được sửa đổi, bổ sung bởi khoản 3 Điều 28 Nghị định số 347/2026/NĐ-CP","nd347-28"],["Điểm c khoản 1 Điều 44 được sửa đổi, bổ sung bởi khoản 4 Điều 28 Nghị định số 347/2026/NĐ-CP","nd347-28"],["Khoản 3 Điều 44 bị bãi bỏ bởi Khoản 4 Điều 74 Nghị định số 217/2026/NĐ-CP",""],["Khoản 3 Điều 44 bị bãi bỏ bởi khoản 2 Điều 30 Nghị định số 347/2026/NĐ-CP","nd347-30"],["Điều 74 bị bãi bỏ bởi Điều 39 Nghị định số 347/2026/NĐ-CP","nd347-39"],["Khoản 6 Điều 44 bị bãi bỏ bởi Khoản 4 Điều 64 Nghị định số 16/2026/NĐ-CP",""]]},{"id":"nd105-45","d":"nd105","n":"45","t":"Hiệu lực thi hành","k":"시행일(효력)","c":"제8장 시행 조항","x":"1. Nghị định này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2025.\n2. Các Nghị định sau đây hết hiệu lực kể từ ngày Nghị định này có hiệu lực thi hành, trừ trường hợp quy định tại Điều 46 của Nghị định này:\na) Nghị định số 83/2017/NĐ-CP ngày 18 tháng 7 năm 2017 quy định về công tác cứu nạn, cứu hộ của lực lượng phòng cháy và chữa cháy;\nb) Nghị định số 136/2020/NĐ-CP ngày 24 tháng 11 năm 2020 quy định chi tiết một số điều và biện pháp thi hành Luật Phòng cháy và chữa cháy và Luật sửa đổi, bổ sung một số điều của Luật Phòng cháy và chữa cháy;\nc) Nghị định số 50/2024/NĐ-CP ngày 10 tháng 5 năm 2024 sửa đổi, bổ sung một số điều của Nghị định số 136/2020/NĐ-CP ngày 24 tháng 11 năm 2020 của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật Phòng cháy và chữa cháy và Luật sửa đổi, bổ sung một số điều của Luật Phòng cháy và chữa cháy và Nghị định số 83/2017/NĐ-CP ngày 18 tháng 7 năm 2017 của Chính phủ quy định về công tác cứu nạn, cứu hộ của lực lượng phòng cháy và chữa cháy;\nd) Nghị định số 78/2011/NĐ-CP ngày 01 tháng 9 năm 2011 quy định việc phối hợp giữa Bộ Công an với Bộ Quốc phòng trong tổ chức thực hiện công tác phòng cháy và chữa cháy đối với cơ sở quốc phòng.\n3. Các văn bản quy phạm pháp luật dẫn chiếu trong Nghị định này khi được sửa đổi, bổ sung, thay thế thì nội dung dẫn chiếu trong Nghị định này cũng được điều chỉnh và thực hiện theo văn bản quy phạm pháp luật sửa đổi, bổ sung, thay thế.","y":"1. 이 시행령은 2025년 7월 01일부터 시행한다.\n2. 다음 각 호의 시행령은 이 시행령의 시행일부터 효력을 상실한다. 다만, 이 시행령 제46조에 규정된 경우는 제외한다:\na) 소방대의 구조·구난 업무에 관하여 규정하는 2017년 7월 18일자 시행령 제83/2017/NĐ-CP호;\nb) 「소방법」 및 「소방법 일부 조항의 개정·보충법」의 일부 조항 및 시행 조치를 상세히 규정하는 2020년 11월 24일자 시행령 제136/2020/NĐ-CP호;\nc) 「소방법」 및 「소방법 일부 조항의 개정·보충법」의 일부 조항 및 시행 조치를 상세히 규정하는 정부의 2020년 11월 24일자 시행령 제136/2020/NĐ-CP호와 소방대의 구조·구난 업무에 관하여 규정하는 정부의 2017년 7월 18일자 시행령 제83/2017/NĐ-CP호의 일부 조항을 개정, 보충하는 2024년 5월 10일자 시행령 제50/2024/NĐ-CP호;\nd) 국방 사업장(국방 시설)에 대한 소방 업무의 시행 조직에 있어 공안부와 국방부 간의 협력을 규정하는 2011년 9월 01일자 시행령 제78/2011/NĐ-CP호.\n3. 이 시행령에서 인용하는 법규범 문서가 개정, 보충, 대체되는 경우에는 이 시행령의 인용 내용도 그 개정, 보충, 대체하는 법규범 문서에 따라 조정되어 시행된다.","o":[]},{"id":"nd105-46","d":"nd105","n":"46","t":"Quy định chuyển tiếp","k":"경과 규정","c":"제8장 시행 조항","x":"1. Việc cấp Giấy chứng nhận kiểm định phương tiện phòng cháy và chữa cháy, quản lý, sử dụng tem kiểm định phương tiện phòng cháy và chữa cháy được tiếp tục thực hiện đến hết ngày 30 tháng 6 năm 2026. Danh mục phương tiện phòng cháy và chữa cháy và việc kiểm định phương tiện phòng cháy và chữa cháy thực hiện theo quy định tại Điều 38 và Phụ lục VII kèm theo Nghị định số 136/2020/NĐ-CP, được sửa đổi, bổ sung theo quy định tại khoản 13 Điều 1 và Phụ lục VII kèm theo Nghị định số 50/2024/NĐ-CP.\n2. Đối với công trình không thuộc danh mục quy định tại Phụ lục V kèm theo Nghị định số 50/2024/NĐ-CP đã được cơ quan quản lý xây dựng thẩm định, cấp giấy phép xây dựng hoặc đã tổ chức thi công, nếu thuộc đối tượng quy định tại Phụ lục III kèm theo Nghị định này thì chủ đầu tư tiếp tục thi công, nghiệm thu và chịu trách nhiệm bảo đảm an toàn phòng cháy và chữa cháy đối với công trình.\n3. Đối với dự án đầu tư xây dựng công trình, công trình, phương tiện giao thông đã được cơ quan Công an cấp Giấy chứng nhận thẩm duyệt thiết kế về phòng cháy và chữa cháy mà chưa được chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy thì việc nghiệm thu, kiểm tra kết quả nghiệm thu về phòng cháy và chữa cháy được tiếp tục thực hiện theo quy định tại Điều 15 Nghị định số 136/2020/NĐ-CP và khoản 7 Điều 1 Nghị định số 50/2024/NĐ-CP. Trường hợp điều chỉnh thiết kế trong quá trình thi công thì việc thẩm duyệt điều chỉnh được tiếp tục thực hiện theo quy định tại Điều 13, Điều 14 Nghị định số 136/2020/NĐ-CP và khoản 5 Điều 1 Nghị định số 50/2024/NĐ-CP. Thời hạn xử lý hồ sơ đề nghị thẩm duyệt điều chỉnh, kiểm tra kết quả nghiệm thu thực hiện theo quy định tại khoản 6 Điều 9, khoản 3 Điều 10 Nghị định này.\nTheo quy định tại điểm II khoản C Mục 2 Phụ lục I.1 Nghị quyết số 66.18/2026/NQ-CP: Không thực hiện thủ tục Nghiệm thu về phòng cháy và chữa cháy (đối với công trình, phương tiện giao thông đã được cơ quan Công an cấp Giấy chứng nhận thẩm duyệt thiết kế nhưng chưa được chấp thuận kết quả nghiệm thu) quy định tại khoản 3 Điều 46 Nghị định số 105/2025/NĐ-CP.\n4. Đối với cá nhân thuộc đối tượng quy định tại khoản 1 Điều 45 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ đã được cơ quan có thẩm quyền cấp Chứng nhận huấn luyện nghiệp vụ phòng cháy, chữa cháy, Chứng nhận huấn luyện nghiệp vụ cứu nạn, cứu hộ theo quy định tại Nghị định số 136/2020/NĐ-CP khi hết thời hạn thì thực hiện huấn luyện nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định tại Nghị định này; cá nhân thuộc đối tượng quy định tại khoản 1 Điều 45 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ đã được cơ quan có thẩm quyền cấp Chứng nhận huấn luyện nghiệp vụ phòng cháy, chữa cháy, Chứng nhận huấn luyện nghiệp vụ cứu nạn, cứu hộ theo quy định tại Nghị định số 50/2024/NĐ-CP thì sau 05 năm kể từ ngày được cấp Chứng nhận huấn luyện nghiệp vụ phòng cháy, chữa cháy, Chứng nhận huấn luyện nghiệp vụ cứu nạn, cứu hộ phải thực hiện huấn luyện nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định tại Nghị định này.\n5. Xử lý đối với cơ sở, phương tiện giao thông cơ giới, hộ gia đình đang bị tạm đình chỉ, đình chỉ hoạt động trước ngày Nghị định này có hiệu lực thi hành:\na) Cơ sở, phương tiện giao thông cơ giới, hộ gia đình đã bị tạm đình chỉ hoạt động khi hết thời hạn tạm đình chỉ mà không khắc phục hoặc không thể khắc phục thì bị đình chỉ hoạt động; việc đình chỉ hoạt động thực hiện theo quy định tại Điều 17 Nghị định số 136/2020/NĐ-CP, được sửa đổi, bổ sung tại khoản 9 Điều 1 Nghị định số 50/2024/NĐ-CP;\nb) Việc phục hồi hoạt động của cơ sở, phương tiện giao thông cơ giới, hộ gia đình đã bị tạm đình chỉ hoạt động, đình chỉ hoạt động thực hiện theo quy định tại Điều 18 Nghị định số 136/2020/NĐ-CP, được sửa đổi, bổ sung tại khoản 10 Điều 1 Nghị định số 50/2024/NĐ-CP.\nBổ sung\nBổ sung\nTheo quy định tại điểm III khoản C Mục 2 Phụ lục I.1 Nghị quyết số 66.18/2026/NQ-CP: Không thực hiện thủ tục Phục hồi hoạt động của cơ sở, phương tiện giao thông cơ giới, hộ gia đình và cá nhân quy định tại điểm b khoản 5 Điều 46 Nghị định số 105/2025/NĐ-CP.","y":"1. 소방 장비·설비 검정 증명서의 발급, 소방 장비·설비 검정 스티커(증지)의 관리·사용은 2026년 6월 30일까지 계속 시행한다. 소방 장비·설비의 목록 및 소방 장비·설비의 검정은 시행령 136/2020/NĐ-CP 제38조 및 그에 첨부된 부록 VII의 규정(시행령 50/2024/NĐ-CP 제1조 제13항 및 그에 첨부된 부록 VII의 규정에 따라 개정·보충된 것)에 따라 시행한다.\n2. 시행령 50/2024/NĐ-CP에 첨부된 부록 V에 규정된 목록에 속하지 않는 건축물로서 건설 관리기관이 이미 심사하여 건축허가를 발급하였거나 이미 시공에 착수한 건축물이 이 시행령에 첨부된 부록 III에 규정된 대상에 해당하는 경우, 발주자(투자자)는 시공, 준공검사(인수검사)를 계속하고 해당 건축물의 소방 안전 확보에 대하여 책임을 진다.\n3. 공안기관으로부터 소방 설계 심사승인 증명서를 이미 발급받았으나 소방 준공검사(인수검사) 결과에 대한 승인을 아직 받지 못한 건축물 건설 투자 프로젝트, 건축물, 교통수단의 경우, 소방 준공검사(인수검사) 및 준공검사(인수검사) 결과의 확인은 시행령 136/2020/NĐ-CP 제15조 및 시행령 50/2024/NĐ-CP 제1조 제7항의 규정에 따라 계속 시행한다. 시공 과정에서 설계를 조정하는 경우 조정에 대한 심사승인은 시행령 136/2020/NĐ-CP 제13조, 제14조 및 시행령 50/2024/NĐ-CP 제1조 제5항의 규정에 따라 계속 시행한다. 조정 심사승인 신청 서류 및 준공검사(인수검사) 결과 확인 신청 서류의 처리 기한은 이 시행령 제9조 제6항, 제10조 제3항의 규정에 따른다.\n결의 66.18/2026/NQ-CP 부록 I.1 제2절 C항 II호의 규정에 따름: 시행령 105/2025/NĐ-CP 제46조 제3항에 규정된 소방 준공검사(인수검사) 절차(공안기관으로부터 설계 심사승인 증명서를 이미 발급받았으나 준공검사(인수검사) 결과에 대한 승인을 아직 받지 못한 건축물, 교통수단에 대한 것)를 시행하지 아니한다.\n4. 「소방 및 구조·구난법」 제45조 제1항에 규정된 대상에 해당하는 개인으로서 시행령 136/2020/NĐ-CP의 규정에 따라 권한 있는 기관으로부터 소방 직무 훈련 증명서, 구조·구난 직무 훈련 증명서를 이미 발급받은 사람은 그 기한이 만료되면 이 시행령의 규정에 따라 소방, 구조·구난 직무 훈련을 실시한다; 「소방 및 구조·구난법」 제45조 제1항에 규정된 대상에 해당하는 개인으로서 시행령 50/2024/NĐ-CP의 규정에 따라 권한 있는 기관으로부터 소방 직무 훈련 증명서, 구조·구난 직무 훈련 증명서를 이미 발급받은 사람은 소방 직무 훈련 증명서, 구조·구난 직무 훈련 증명서를 발급받은 날부터 05년이 지난 후 이 시행령의 규정에 따라 소방, 구조·구난 직무 훈련을 실시하여야 한다.\n5. 이 시행령의 시행일 전에 일시 정지, 영업(활동) 정지 중인 사업장, 자동차 등 동력 교통수단, 가구에 대한 처리:\na) 이미 일시 정지된 사업장, 자동차 등 동력 교통수단, 가구가 일시 정지 기한이 만료되었는데도 시정하지 않거나 시정할 수 없는 경우에는 영업(활동) 정지된다; 영업(활동) 정지는 시행령 136/2020/NĐ-CP 제17조의 규정(시행령 50/2024/NĐ-CP 제1조 제9항에서 개정·보충된 것)에 따라 시행한다;\nb) 이미 일시 정지, 영업(활동) 정지된 사업장, 자동차 등 동력 교통수단, 가구의 영업(활동) 재개는 시행령 136/2020/NĐ-CP 제18조의 규정(시행령 50/2024/NĐ-CP 제1조 제10항에서 개정·보충된 것)에 따라 시행한다.\n(신설)\n(신설)\n결의 66.18/2026/NQ-CP 부록 I.1 제2절 C항 III호의 규정에 따름: 시행령 105/2025/NĐ-CP 제46조 제5항 b호에 규정된 사업장, 자동차 등 동력 교통수단, 가구 및 개인의 영업(활동) 재개 절차를 시행하지 아니한다.","o":[["Khoản 3 Điều 46 được sửa đổi, bổ sung bởi khoản 1 Điều 29 Nghị định số 347/2026/NĐ-CP","nd347-29"],["Khoản 6 Điều 46 được bổ sung bởi khoản 2 Điều 29 2 Nghị định số 347/2026/NĐ-CP","nd347-29"],["Khoản 7 Điều 46 được bổ sung bởi khoản 3 Điều 29 3 Nghị định số 347/2026/NĐ-CP","nd347-29"],["Khoản 5 Điều 46 bị bãi bỏ bởi khoản 2 Điều 30 Nghị định số 347/2026/NĐ-CP","nd347-30"]]},{"id":"nd105-47","d":"nd105","n":"47","t":"Trách nhiệm thi hành","k":"시행 책임","c":"제8장 시행 조항","x":"Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các cấp và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này.","y":"장관, 부급(部級) 기관의 장, 정부 소속 기관의 장, 각급 인민위원회 위원장 및 관련 조직·개인은 이 시행령을 시행할 책임을 진다.","o":[]},{"id":"nd105-PLI","d":"nd105","n":"PLI","t":"DANH MỤC CƠ SỞ THUỘC DIỆNQUẢN LÝ VỀ PHÒNG CHÁY, CHỮA CHÁY (Kèm theo Nghị định số 105/2025/NĐ-CP ngày 15 tháng 5 năm 2025 của Chính phủ) ______________ Cơ sở thuộc diện quản lý về phòng cháy, chữa cháy là các cơ sở được quy định tại khoản 7 Điều 2 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ, gồm:","k":"소방 관리 대상 사업장 목록 (2025년 5월 15일자 정부 시행령 105/2025/NĐ-CP에 첨부) ______________ 소방 관리 대상 사업장은 「소방 및 구조·구난법」 제2조 제7항에 규정된 사업장으로서, 다음을 포함한다:","c":"부록","x":"1. Nhà chung cư; nhà ở tập thể.\n2. Nhà trẻ; trường mẫu giáo; trường mầm non; trường tiểu học; trường trung học cơ sở; trường trung học phổ thông; trường phổ thông có nhiều cấp học; trường đại học, trường cao đẳng; trường trung học chuyên nghiệp; trường dạy nghề; trường công nhân kỹ thuật; cơ sở giáo dục khác theo quy định của pháp luật về giáo dục.\n3. Cơ sở nghiên cứu vũ trụ, trung tâm cơ sở dữ liệu chuyên ngành và cơ sở nghiên cứu chuyên ngành khác có nhà cao từ 2 tầng trở lên hoặc có tổng diện tích sàn từ 300 m2 trở lên.\n4. Bệnh viện; phòng khám (đa khoa hoặc chuyên khoa), trạm y tế, nhà hộ sinh, cơ sở phòng chống dịch bệnh, cơ sở nghiên cứu, thí nghiệm chuyên ngành y tế, nhà điều dưỡng, phục hồi chức năng, chỉnh hình, dưỡng lão và cơ sở y tế khác theo Luật Khám bệnh, chữa bệnh có nhà cao từ 2 tầng trở lên hoặc có tổng diện tích sàn từ 50 m2 trở lên.\n5. Sân vận động; nhà thi đấu, nhà tập luyện các môn thể thao, bể bơi, sân thi đấu các môn thể thao có khán đài; trường đua, trường bắn; cơ sở thể thao khác được thành lập theo Luật Thể dục, thể thao có nhà cao từ 2 tầng trở lên hoặc có tổng diện tích sàn từ 50 m2 trở lên.\n6. Nhà hát, rạp chiếu phim, rạp xiếc.\n7. Trung tâm hội nghị;bảo tàng;thư viện; nhà trưng bày; nhà triển lãm; nhà văn hóa có từ 100 chỗ ngồi trở lên.\n8. Thủy cung; cơ sở kinh doanh dịch vụ karaoke, vũ trường; cơ sở kinh doanh dịch vụ vui chơi, giải trí; cơ sở biểu diễn nghệ thuật, hoạt động văn hóa khác có tổng diện tích sàn từ 50 m2 trở lên.\n9. Cơ sở tôn giáo; cơ sở tín ngưỡng (trừ nhà thờ dòng họ) cao từ 2 tầng trở lên hoặc có tổng diện tích sàn từ 100 m2 trở lên; công trình di tích lịch sử - văn hóa cấp tỉnh trở lên.\n10. Chợ; trung tâm thương mại; siêu thị.\n11. Cơ sở kinh doanh dịch vụ ăn uống, cơ sở kinh doanh dịch vụ khác theo quy định của pháp luật có tổng diện tích phục vụ kinh doanh từ 100 m2 trở lên.\n12. Cơ sở kinh doanh hàng hóa dễ cháycó tổng diện tích phục vụ kinh doanh từ 30 m2 trở lên; cơ sở kinh doanh hàng hóa khó cháy hoặc hàng hóa không cháy đựng trong bao bì dễ cháycó tổng diện tích phục vụ kinh doanh từ 300 m2 trở lên.\n13. Cơ sở kinh doanh khí đốt; cửa hàng xăng dầu.\n14. Khách sạn, nhà khách, nhà nghỉ; cơ sở nghỉ dưỡng, cơ sở dịch vụ lưu trú khác cao từ 2 tầng trở lên hoặc có tổng diện tích sàn từ 50 m2 trở lên.\n15. Bưu điện; bưu cục, cơ sở cung cấp dịch vụ bưu chính, viễn thông khác cao từ 2 tầng trở lên hoặc có tổng diện tích sàn từ 100 m2 trở lên.\n16. Trụ sở làm việc của cơ quan nhà nước; trụ sở, nhà làm việc của doanh nghiệp, tổ chức chính trị, xã hội cao từ 2 tầng trở lên hoặc có tổng diện tích sàn từ 100 m2 trở lên.\n17. Nhà đa năng, nhà hỗn hợp có từ 2 tầng trở lên hoặc có tổng diện tích sàn từ 100 m2 trở lên, trừ nhà ở kết hợp sản xuất, kinh doanh.\n18. Nhà máy lọc dầu;nhà máy hóa dầu; nhà máy lọc, hóa dầu; nhà máy chế biến khí; nhà máy sản xuất nhiên liệu sinh học; kho chứa dầu mỏ, sản phẩm dầu mỏ; kho chứa khí hóa lỏng; trạm chiết nạp khí hóa lỏng; trạm phân phối khí đốt.\n19. Nhà máy điện; trạm biến áp có điện áp từ 110 kV trở lên.\n20. Cơ sở sản xuất vật liệu nổ, tiền chất thuốc nổ công nghiệp, vũ khí, công cụ hỗ trợ; kho cố định chứa vật liệu nổ, tiền chất thuốc nổ công nghiệp, vũ khí, công cụ hỗ trợ.\n21. Cơ sở sản xuất công nghiệp có nhà phục vụ sản xuất thuộchạng nguy hiểm cháy nổ A, B; cơ sở sản xuất công nghiệp có nhà phục vụ sản xuất thuộchạng nguy hiểm cháy C; cơ sở sản xuất công nghiệp có nhà phục vụ sản xuất thuộc hạng nguy hiểm cháy D, E có tổng khối tích từ 2.500 m3 trở lên hoặc tổng diện tích sàn từ 500 m2 trở lên.\n22. Kho dự trữ quốc gia; kho chứa hàng hóa có hạng nguy hiểm cháy và cháy nổ A, B; kho chứa hàng hóa có hạng nguy hiểm cháy C; kho chứa hàng hóa có hạng nguy hiểm cháy D, E có tổng khối tích từ 2.500 m3 trở lên hoặc tổng diện tích sàn từ 500 m2.\n23. Nhà để xe ô tô, xe máy,nhà trưng bày ô tô, xe máy có diện tích từ 100 m2 trở lên.\n24. Nhà máy nước, nhà máy xử lý chất thải.\n25. Nhà ga hành khách, nhà khách phục vụ ngoại giao, nhà ga hàng hóa thuộc cảng hàng không; nhà kỹ thuật máy bay; đài kiểm soát không lưu.\n26. Cảng, bến thủy nội địa; bến cảng biển; cảng cá; cảng cạn.\n27. Bến xe khách; trung tâm đăng kiểm phương tiện giao thông; trạm dừng nghỉ; hầm đường ô tôcó chiều dài từ 500 m trở lên.\n28. Nhà ga hành khách, nhà ga hàng hóa, đề - pô (depot) đường sắt; nhà ga cáp treo; hầm đường sắt có chiều dài từ 500 m trở lên; hầm, nhà ga hành khách, đề - pô (depot) đường sắt đô thị.\n29. Cơ sở sửa chữa, bảo dưỡng phương tiện giao thông cơ giới đường bộ có tổng diện tích sàn từ 100 m2 trở lên; cơ sở sửa chữa phương tiện thủy nội địa, tàu biển.\n30. Cơ sở hạt nhân.\n31. Cơ sở trợ giúp xã hội cao từ 2 tầng trở lên hoặc có tổng diện tích sàn từ 100 m2 trở lên.\n32. Nhà ở kết hợp sản xuất, kinh doanh có tổng diện tích phục vụ sản xuất, kinh doanh từ 50 m2 trở lên.\n33. Bãi chứa hàng hóa, vật tư, phế liệu cháy được có diện tích từ 500 m² trở lên.\n34. Hạ tầng kỹ thuật của khu đô thị, khu nhà ở, khu công nghiệp, cụm công nghiệp, khu du lịch, khu nghiên cứu, đào tạo, khu thể dục, thể thao./.","y":"1. 공동주택(아파트); 집단주택(기숙형 공동주택).\n2. 어린이집; 유치원; 유아학교; 초등학교; 중학교; 고등학교; 여러 학교급이 있는 일반학교; 대학교, 전문대학; 중등전문학교; 직업학교; 기술공 양성학교; 교육 관련 법령에 따른 그 밖의 교육기관.\n3. 우주 연구시설, 전문 분야 데이터베이스 센터 및 그 밖의 전문 분야 연구시설로서 높이 2층 이상인 건물이 있거나 연면적 합계가 300 m2 이상인 것.\n4. 병원; 진료소(종합 또는 전문), 보건소, 조산원, 전염병 예방·방역 시설, 의료 전문 분야 연구·실험 시설, 요양원, 재활·정형 시설, 양로원 및 「진료·치료법」에 따른 그 밖의 의료시설로서 높이 2층 이상인 건물이 있거나 연면적 합계가 50 m2 이상인 것.\n5. 종합운동장(스타디움); 실내경기장, 각종 체육 종목 훈련장, 수영장, 관람석이 있는 각종 체육 종목 경기장; 경주장, 사격장; 「체육·스포츠법」에 따라 설립된 그 밖의 체육시설로서 높이 2층 이상인 건물이 있거나 연면적 합계가 50 m2 이상인 것.\n6. 극장(공연장), 영화관, 서커스장.\n7. 컨벤션(회의)센터; 박물관; 도서관; 전시관(진열관); 전람회장; 좌석 100석 이상인 문화회관.\n8. 수족관; 노래방(가라오케)·무도장 서비스 영업 사업장; 오락·유흥 서비스 영업 사업장; 예술공연 및 그 밖의 문화활동 사업장으로서 연면적 합계가 50 m2 이상인 것.\n9. 종교시설; 높이 2층 이상이거나 연면적 합계가 100 m2 이상인 신앙시설(문중 사당 제외); 성급 이상의 역사·문화 유적 건축물.\n10. 시장; 상업센터(쇼핑몰); 슈퍼마켓.\n11. 음식 서비스 영업 사업장, 법령에 따른 그 밖의 서비스 영업 사업장으로서 영업용 면적 합계가 100 m2 이상인 것.\n12. 가연성 상품 판매 사업장으로서 영업용 면적 합계가 30 m2 이상인 것; 난연성 상품 또는 가연성 포장재에 담긴 불연성 상품 판매 사업장으로서 영업용 면적 합계가 300 m2 이상인 것.\n13. 가스 판매 사업장; 주유소.\n14. 호텔, 영빈관(게스트하우스), 여관; 휴양시설, 그 밖의 숙박 서비스 시설로서 높이 2층 이상이거나 연면적 합계가 50 m2 이상인 것.\n15. 우체국; 우편취급국, 그 밖의 우편·통신 서비스 제공 시설로서 높이 2층 이상이거나 연면적 합계가 100 m2 이상인 것.\n16. 국가기관 청사; 기업, 정치·사회 조직의 본사·업무용 건물로서 높이 2층 이상이거나 연면적 합계가 100 m2 이상인 것.\n17. 2층 이상이거나 연면적 합계가 100 m2 이상인 다목적 건물, 복합 건물. 다만, 생산·영업 겸용 주택은 제외한다.\n18. 정유공장; 석유화학공장; 정유·석유화학공장; 가스 가공 공장; 바이오연료 생산 공장; 석유·석유제품 저장창고; 액화가스 저장창고; 액화가스 충전소; 가스 배급소.\n19. 발전소; 전압 110 kV 이상인 변전소.\n20. 폭발물, 산업용 폭약 전구물질, 무기, 보조도구 생산 사업장; 폭발물, 산업용 폭약 전구물질, 무기, 보조도구 보관 고정 창고.\n21. 생산용 건물이 화재·폭발 위험 등급 A, B에 속하는 산업 생산 사업장; 생산용 건물이 화재 위험 등급 C에 속하는 산업 생산 사업장; 생산용 건물이 화재 위험 등급 D, E에 속하는 산업 생산 사업장으로서 체적 합계가 2.500 m3 이상이거나 연면적 합계가 500 m2 이상인 것.\n22. 국가비축창고; 화재 및 화재·폭발 위험 등급 A, B의 화물 보관 창고; 화재 위험 등급 C의 화물 보관 창고; 화재 위험 등급 D, E의 화물 보관 창고로서 체적 합계가 2.500 m3 이상이거나 연면적 합계가 500 m2인 것.\n23. 면적 100 m2 이상인 자동차·오토바이 주차건물, 자동차·오토바이 전시장.\n24. 정수장(상수도 공장), 폐기물 처리 공장.\n25. 공항에 속하는 여객터미널, 외교용 귀빈관, 화물터미널; 항공기 정비동; 항공교통관제탑.\n26. 내륙수로 항만·부두; 해항 부두; 어항; 내륙컨테이너기지(ICD).\n27. 여객 버스터미널; 교통수단 등록검사 센터; 휴게소; 길이 500 m 이상인 자동차도로 터널.\n28. 철도 여객역, 화물역, 차량기지(depot); 케이블카 역사; 길이 500 m 이상인 철도 터널; 도시철도의 터널, 여객역, 차량기지(depot).\n29. 연면적 합계가 100 m2 이상인 도로 동력 교통수단 수리·정비 사업장; 내륙수로 운송수단, 해상 선박 수리 사업장.\n30. 원자력 시설.\n31. 사회복지(사회부조) 시설로서 높이 2층 이상이거나 연면적 합계가 100 m2 이상인 것.\n32. 생산·영업 겸용 주택으로서 생산·영업용 면적 합계가 50 m2 이상인 것.\n33. 면적 500 m² 이상인 가연성 화물·자재·폐자재 야적장.\n34. 도시구역, 주거단지, 공단(산업단지), 산업클러스터, 관광단지, 연구·교육단지, 체육·스포츠단지의 기술 기반시설./.","o":[]},{"id":"nd105-PLII","d":"nd105","n":"PLII","t":"DANH MỤC CƠ SỞ CÓ NGUY HIỂM VỀ CHÁY, NỔ (Kèm theo Nghị định số 105/2025/NĐ-CP Ngày 15 tháng 5 năm 2025 của Chính phủ) ______________ Cơ sở có nguy hiểm về cháy, nổ là các cơ sở thuộc diện quản lý về phòng cháy, chữa cháy có nguy cơ cháy, nổ cao quy định tại khoản 8 Điều 2 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ, gồm:","k":"화재·폭발 위험 사업장 목록 (2025년 5월 15일자 정부 시행령 105/2025/NĐ-CP에 첨부) ______________ 화재·폭발 위험 사업장은 「소방 및 구조·구난법」 제2조 제8항에 규정된, 화재·폭발 위험이 높은 소방 관리 대상 사업장으로서, 다음을 포함한다:","c":"부록","x":"TT\nLoại hình cơ sở\nNhóm 1\nNhóm 2\n1\nNhà chung cư, nhà ở tập thể\nCó nhà cao từ 7 tầng trở lên hoặc tổng diện tích sàn từ 3.000 m² trở lên\nCó nhà cao từ 5 tầng đến dưới 7 tầng hoặc tổng diện tích sàn từ 1.000 m² đến dưới 3.000 m²\n2\nNhà trẻ, trường mẫu giáo, trường mầm non\nCó từ 150 cháu trở lên hoặc tổng diện tích sàn từ 2.000 m2 trở lên\nCó từ 50 cháu đến dưới 150 cháu hoặc tổng diện tích sàn từ 500 m2 đến dưới 2.000 m2\n3\nTrường tiểu học; trường trung học cơ sở; trường trung học phổ thông; trường phổ thông có nhiều cấp học; trường đại học, trường cao đẳng; trường trung học chuyên nghiệp; trường dạy nghề; trường công nhân kỹ thuật; cơ sở giáo dục khác theo quy định của pháp luật về giáo dục; cơ sở nghiên cứu vũ trụ, trung tâm cơ sở dữ liệu chuyên ngành và cơ sở nghiên cứu chuyên ngành khác\nCó nhà cao từ 5 tầng trở lên hoặc tổng diện tích sàn từ 3.000 m² trở lên\nCó nhà cao từ 3 tầng đến dưới 5 tầng hoặc có tổng diện tích sàn từ 1.500 m² đến dưới 3.000 m²\n4\nBệnh viện\nTổng số giường bệnh từ 250 giường trở lên\nTổng số giường bệnh dưới 250 giường\n5\nPhòng khám (đa khoa hoặc chuyên khoa), trạm y tế, nhà hộ sinh, cơ sở phòng chống dịch bệnh, cơ sở nghiên cứu, thí nghiệm chuyên ngành y tế, nhà điều dưỡng, phục hồi chức năng, chỉnh hình, dưỡng lão và cơ sở y tế khác theo Luật Khám bệnh, chữa bệnh\nCó nhà cao từ 5 tầng trở lên hoặc tổng diện tích sàn từ 2.000 m² trở lên\nCó nhà cao từ 3 tầng đến dưới 5 tầng hoặc có tổng diện tích sàn từ 300 m² đến dưới 2.000 m²\n6\nSân vận động\nCó sức chứa của khán đài từ 5.000 chỗ ngồi trở lên\nCó sức chứa của khán đài từ 2.000 chỗ ngồi đến dưới 5.000 chỗ ngồi\n7\nNhà thi đấu, nhà tập luyện các môn thể thao, bể bơi, sân thi đấu các môn thể thao có khán đài; trường đua, trường bắn; cơ sở thể thao khác được thành lập theo h sàn từ 500 m2 trở lên.\n3. Trường tiểu học, trường trung học cơ sở, trường trung học phổ thông, trường phổ thông có nhiều cấp học, trường đại học, trường cao đẳng, trường trung học chuyên nghiệp, trường dạy nghề, trường công nhân kỹ thuật, cơ sở giáo dục khác theo quy định của pháp luật về giáo dục, cơ sở nghiên cứu vũ trụ, trung tâm cơ sở dữ liệu chuyên ngành và cơ sở nghiên cứu chuyên ngành khác có nhà cao từ 3 tầng trở lên hoặc có tổng diện tích sàn từ 1.500 m² trở lên.\n4. Bệnh viện.\n5. Phòng khám (đa khoa hoặc chuyên khoa), trạm y tế, nhà hộ sinh, cơ sở phòng chống dịch bệnh, cơ sở nghiên cứu, thí nghiệm chuyên ngành y tế, nhà điều dưỡng, phục hồi chức năng, chỉnh hình, dưỡng lão và cơ sở y tế khác theo Luật Khám bệnh, chữa bệnh có nhà cao từ 3 tầng trở lên hoặc có tổng diện tích sàn từ 300 m² trở lên.\n6. Sân vận động có sức chứa của khán đài từ 2.000 chỗ ngồi trở lên.\n7. Nhà thi đấu, nhà tập luyện các môn thể thao, bể bơi, sân thi đấu các môn thể thao có khán đài, trường đua, trường bắn, cơ sở thể thao khác được thành lập theo Luật Thể dục, thể thao có từ 1.000 chỗ ngồi trở lên hoặc có tổng diện tích sàn từ 1.000 m² trở lên.\n8. Nhà hát, rạp chiếu phim, rạp xiếc.\n9. Trung tâm hội nghị, bảo tàng, thư viện, nhà trưng bày, nhà triển lãm có nhà cao từ 3 tầng trở lên hoặc tổng diện tích sàn từ 500 m² trở lên.\n10. Thủy cung, cơ sở kinh doanh dịch vụ karaoke, vũ trường, cơ sở kinh doanh dịch vụ vui chơi, giải trí, cơ sở biểu diễn nghệ thuật, hoạt động văn hóa khác cao từ 2 tầng trở lên hoặc có tổng diện tích sàn từ 300 m2 trở lên.\n11. Chợ, trung tâm thương mại, siêu thị có tổng diện tích sàn từ 300 m² trở lên.\n12. Cơ sở kinh doanh dịch vụ ăn uống, cơ sở kinh doanh dịch vụ khác theo quy định của pháp luật có tổng diện tích sàn từ 300 m² trở lên.\n13. Cơ sở kinh doanh hàng hóa dễ cháy có tổng diện tích sàn từ 200 m² trở lên.\n14. Cơ sở kinh doanh hàng hóa khó cháy hoặc hàng hóa không cháy đựng trong bao bì dễ cháy có tổng diện tích sàn từ 1.000 m² trở lên.\n15
