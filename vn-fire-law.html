 과태료를 부과한다:\na) 상시 근무자가 20명 미만인 소방 관리 대상 사업장에서 소방 및 구조·구난 임무 수행자를 지정하지 아니하는 행위;\nb) 사업장 자체 소방·구조구난대, 전문 소방·구조구난대의 화재진압, 구조·구난 당직(대기) 장소를 배치하지 아니하는 행위.\n3. 사업장 자체 소방·구조구난대, 전문 소방·구조구난대의 인력, 장비를 매일 화재진압, 구조·구난 당직(대기)에 배치하지 아니하는 행위에 대하여 8.000.000동 이상 10.000.000동 이하의 과태료를 부과한다.\n4. 사업장 자체 소방·구조구난대를 설립하지 아니하는 행위에 대하여 10.000.000동 이상 20.000.000동 이하의 과태료를 부과한다.\n5. 전문 소방·구조구난대를 설립하지 아니하는 행위에 대하여 20.000.000동 이상 30.000.000동 이하의 과태료를 부과한다.","o":[]},{"id":"nd106-9","d":"nd106","n":"9","t":"Vi phạm quy định hồ sơ về phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난에 관한 서류(관리 기록) 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 1.000.000 đồng đến 3.000.000 đồng đối với hành vi không đủ tài liệu trong hồ sơ về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n2. Phạt tiền từ 5.000.000 đồng đến 7.000.000 đồng đối với hành vi không lập hồ sơ về phòng cháy, chữa cháy, cứu nạn, cứu hộ.","y":"1. 소방 및 구조·구난에 관한 서류(관리 기록)에 자료를 충분히 갖추지 아니하는 행위에 대하여 1.000.000동 이상 3.000.000동 이하의 과태료를 부과한다.\n2. 소방 및 구조·구난에 관한 서류(관리 기록)를 작성하지 아니하는 행위에 대하여 5.000.000동 이상 7.000.000동 이하의 과태료를 부과한다.","o":[]},{"id":"nd106-10","d":"nd106","n":"10","t":"Vi phạm quy định kiểm tra về phòng cháy, chữa cháy","k":"소방 점검(검사)에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với một trong các hành vi sau đây:\na) Không xuất trình hồ sơ về phòng cháy, chữa cháy, cứu nạn, cứu hộ phục vụ kiểm tra về phòng cháy, chữa cháy;\nb) Gửi báo cáo kết quả thực hiện công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ của cơ sở không đúng thời hạn;\nc) Không thực hiện yêu cầu về phòng cháy, chữa cháy, cứu nạn, cứu hộ tại văn bản kiến nghị để cơ sở khắc phục những tồn tại, hạn chế.\n2. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với một trong các hành vi sau đây:\na) Không bố trí người có thẩm quyền, trách nhiệm làm việc với người có thẩm quyền kiểm tra sau khi đã nhận được thông báo kiểm tra về phòng cháy, chữa cháy;\nb) Không gửi báo cáo kết quả thực hiện công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ của cơ sở.\n3. Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với hành vi không thực hiện tự kiểm tra về phòng cháy, chữa cháy định kỳ.\n4. Phạt tiền từ 20.000.000 đồng đến 30.000.000 đồng đối với một trong các hành vi sau đây:\na) Không chấp hành việc đình chỉ hoạt động có thời hạn tại quyết định xử phạt vi phạm hành chính trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ của người có thẩm quyền;\nb) Không chấp hành quyết định tạm đình chỉ, quyết định đình chỉ hoạt động theo quy định của pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ.","y":"1. 다음 각 행위 중 하나에 대하여 3.000.000동 이상 5.000.000동 이하의 과태료를 부과한다:\na) 소방 점검(검사)을 위한 소방 및 구조·구난에 관한 서류(관리 기록)를 제시하지 아니하는 행위;\nb) 사업장의 소방 및 구조·구난 업무 수행 결과 보고서를 기한에 맞지 아니하게 제출하는 행위;\nc) 사업장이 미비점, 한계를 시정하도록 한 건의 문서상의 소방 및 구조·구난에 관한 요구를 이행하지 아니하는 행위.\n2. 다음 각 행위 중 하나에 대하여 5.000.000동 이상 10.000.000동 이하의 과태료를 부과한다:\na) 소방 점검(검사) 통지를 받은 후 점검 권한자와 업무를 처리할 권한·책임이 있는 사람을 배치하지 아니하는 행위;\nb) 사업장의 소방 및 구조·구난 업무 수행 결과 보고서를 제출하지 아니하는 행위.\n3. 정기 소방 자체 점검을 실시하지 아니하는 행위에 대하여 10.000.000동 이상 20.000.000동 이하의 과태료를 부과한다.\n4. 다음 각 행위 중 하나에 대하여 20.000.000동 이상 30.000.000동 이하의 과태료를 부과한다:\na) 권한자의 소방 및 구조·구난 분야 행정위반 처벌 결정서상의 기한부 영업(활동) 정지를 준수하지 아니하는 행위;\nb) 소방 및 구조·구난에 관한 법률의 규정에 따른 일시 정지 결정, 영업(활동) 정지 결정을 준수하지 아니하는 행위.","o":[["Điểm a khoản 1 Điều 10 được sửa đổi, bổ sung bởi khoản 1 Điều 5 Nghị định số 69/2026/NĐ-CP","nd69-5"],["Điểm a khoản 2 Điều 10 được sửa đổi, bổ sung bởi khoản 2 Điều 5 Nghị định số 69/2026/NĐ-CP","nd69-5"]]},{"id":"nd106-11","d":"nd106","n":"11","t":"Vi phạm quy định về phòng cháy, chữa cháy trong sử dụng nguồn lửa, nguồn nhiệt, thiết bị, dụng cụ sinh lửa, sinh nhiệt","k":"화원, 열원, 불·열을 발생시키는 설비·기구의 사용에서의 소방(화재예방·진압)에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với hành vi sử dụng nguồn lửa, nguồn nhiệt, thiết bị, dụng cụ sinh lửa, sinh nhiệt mà không bảo đảm khoảng cách phòng cháy, chữa cháy theo quy định.\n2. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với một trong các hành vi sau đây:\na) Sử dụng nguồn lửa, nguồn nhiệt, thiết bị, dụng cụ sinh lửa, sinh nhiệt ở những khu vực có quy định cấm;\nb) Hàn, cắt kim loại mà không có biện pháp phòng cháy, chữa cháy theo quy định.\n3. Phạt tiền gấp hai lần mức tiền phạt đối với các hành vi quy định tại khoản 1 và khoản 2 Điều này khi để xảy ra cháy nhưng chưa đến mức truy cứu trách nhiệm hình sự.","y":"1. 화원, 열원, 불·열을 발생시키는 설비·기구를 규정에 따른 소방 안전거리를 확보하지 아니하고 사용하는 행위에 대하여 5.000.000동 이상 10.000.000동 이하의 과태료를 부과한다.\n2. 다음 각 행위 중 하나에 대하여 20.000.000동 이상 25.000.000동 이하의 과태료를 부과한다:\na) 금지 규정이 있는 구역에서 화원, 열원, 불·열을 발생시키는 설비·기구를 사용하는 행위;\nb) 규정에 따른 소방(화재예방·진압) 조치 없이 금속을 용접, 절단하는 행위.\n3. 이 조 제1항 및 제2항에 규정된 행위로 화재가 발생하였으나 형사책임을 추궁할 정도에 이르지 아니한 경우에는 해당 과태료 수준의 2배의 과태료를 부과한다.","o":[]},{"id":"nd106-12","d":"nd106","n":"12","t":"Vi phạm quy định về phòng cháy, chữa cháy trong lắp đặt, sử dụng điện","k":"전기의 설치, 사용에서의 소방(화재예방·진압)에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 6.000.000 đồng đến 8.000.000 đồng đối với hành vi lắp đặt, sử dụng dây dẫn điện, thiết bị điện, thiết bị đóng ngắt, bảo vệ không bảo đảm an toàn phòng cháy.\n2. Phạt tiền từ 10.000.000 đồng đến 15.000.000 đồng đối với hành vi không duy trì thiết bị điện phòng nổ đã được trang bị, lắp đặt.\n3. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với hành vi không trang bị, lắp đặt, sử dụng thiết bị điện phòng nổ.\n4. Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với một trong các hành vi sau đây:\na) Không có giải pháp ngăn cháy đối với khu vực sạc điện cho xe động cơ điện tập trung trong nhà;\nb) Không có hệ thống điện phục vụ phòng cháy và chữa cháy;\nc) Không duy trì nguồn điện phục vụ phòng cháy và chữa cháy.\n5. Phạt tiền gấp hai lần mức tiền phạt đối với các hành vi quy định tại các khoản 1, 2 và khoản 3 Điều này khi để xảy ra cháy nhưng chưa đến mức truy cứu trách nhiệm hình sự.\n6. Biện pháp khắc phục hậu quả:\nBuộc thực hiện giải pháp ngăn cháy đối với hành vi vi phạm quy định tại điểm a khoản 4 Điều này.","y":"1. 화재예방 안전을 확보하지 아니한 채 전선, 전기 설비, 개폐·보호 장치를 설치, 사용하는 행위에 대하여 6.000.000동 이상 8.000.000동 이하의 과태료를 부과한다.\n2. 이미 비치, 설치된 방폭 전기 설비를 유지하지 아니하는 행위에 대하여 10.000.000동 이상 15.000.000동 이하의 과태료를 부과한다.\n3. 방폭 전기 설비를 비치, 설치, 사용하지 아니하는 행위에 대하여 20.000.000동 이상 25.000.000동 이하의 과태료를 부과한다.\n4. 다음 각 행위 중 하나에 대하여 40.000.000동 이상 50.000.000동 이하의 과태료를 부과한다:\na) 실내 집중식 전기자동차 충전 구역에 대하여 방화(구획) 대책을 갖추지 아니하는 행위;\nb) 소방용 전기 설비(시스템)를 갖추지 아니하는 행위;\nc) 소방용 전원을 유지하지 아니하는 행위.\n5. 이 조 제1항, 제2항 및 제3항에 규정된 행위로 화재가 발생하였으나 형사책임을 추궁할 정도에 이르지 아니한 경우에는 해당 과태료 수준의 2배의 과태료를 부과한다.\n6. 시정조치(결과 복구 조치):\n이 조 제4항 a호에 규정된 위반 행위에 대하여 방화(구획) 대책의 시행을 강제한다.","o":[]},{"id":"nd106-13","d":"nd106","n":"13","t":"Vi phạm quy định về an toàn phòng cháy và chữa cháy trong lắp đặt, kiểm tra, bảo trì hệ thống tiếp địa, chống sét","k":"접지, 피뢰 설비의 설치, 점검, 유지보수에서의 소방 안전에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 1.000.000 đồng đến 3.000.000 đồng đối với hành vi không kiểm tra, bảo trì định kỳ hệ thống tiếp địa, chống sét.\n2. Phạt tiền từ 10.000.000 đồng đến 15.000.000 đồng đối với một trong các hành vi sau đây:\na) Lắp đặt hệ thống tiếp địa, chống sét không bảo đảm theo quy định;\nb) Không duy trì hệ thống tiếp địa, chống sét đã được lắp đặt.\n3. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với hành vi không lắp đặt hệ thống tiếp địa, chống sét cho nhà, công trình.\n4. Phạt tiền gấp hai lần mức tiền phạt đối với các hành vi quy định tại các khoản 1, 2 và khoản 3 Điều này khi để xảy ra cháy nhưng chưa đến mức truy cứu trách nhiệm hình sự.","y":"1. 접지, 피뢰 설비를 정기적으로 점검, 유지보수하지 아니하는 행위에 대하여 1.000.000동 이상 3.000.000동 이하의 과태료를 부과한다.\n2. 다음 각 행위 중 하나에 대하여 10.000.000동 이상 15.000.000동 이하의 과태료를 부과한다:\na) 접지, 피뢰 설비를 규정에 맞지 아니하게 설치하는 행위;\nb) 이미 설치된 접지, 피뢰 설비를 유지하지 아니하는 행위.\n3. 주택(건물), 건축물에 접지, 피뢰 설비를 설치하지 아니하는 행위에 대하여 20.000.000동 이상 25.000.000동 이하의 과태료를 부과한다.\n4. 이 조 제1항, 제2항 및 제3항에 규정된 행위로 화재가 발생하였으나 형사책임을 추궁할 정도에 이르지 아니한 경우에는 해당 과태료 수준의 2배의 과태료를 부과한다.","o":[]},{"id":"nd106-14","d":"nd106","n":"14","t":"Vi phạm quy định về phòng cháy, chữa cháy trong quản lý, bảo quản, sử dụng chất, hàng hóa nguy hiểm về cháy, nổ","k":"화재·폭발 위험 물질·화물의 관리, 보관, 사용에서의 소방(화재예방·진압)에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với một trong các hành vi sau đây:\na) Sắp xếp hoặc bố trí chất, hàng hóa nguy hiểm về cháy, nổ không bảo đảm theo quy định;\nb) Bảo quản chất, hàng hóa nguy hiểm về cháy, nổ vượt quá số lượng, khối lượng theo quy định.\n2. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với hành vi bảo quản hoặc sử dụng chất, hàng hóa nguy hiểm về cháy, nổ không đúng nơi quy định.\n3. Phạt tiền từ 10.000.000 đồng đến 15.000.000 đồng đối với hành vi để hình thành môi trường nguy hiểm cháy, nổ có chỉ số nguy hiểm cháy, nổ vượt quá giới hạn dưới của giới hạn nồng độ bắt cháy.\n4. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với hành vi tàng trữ trái phép chất, hàng hóa nguy hiểm về cháy, nổ nhưng chưa đến mức truy cứu trách nhiệm hình sự.\n5. Phạt tiền từ 45.000.000 đồng đến 50.000.000 đồng đối với hành vi sử dụng trái phép chất, hàng hóa nguy hiểm về cháy, nổ nhưng chưa đến mức truy cứu trách nhiệm hình sự.\n6. Phạt tiền gấp hai lần mức tiền phạt đối với các hành vi quy định tại các khoản 1, 2, 3 và khoản 4 Điều này khi để xảy ra cháy nhưng chưa đến mức truy cứu trách nhiệm hình sự.\n7. Hình thức xử phạt bổ sung:\nTịch thu tang vật vi phạm hành chính đối với hành vi vi phạm quy định tại các khoản 4 và khoản 5 Điều này.\n8. Biện pháp khắc phục hậu quả:\na) Buộc giảm số lượng, khối lượng chất, hàng hóa nguy hiểm về cháy, nổ đối với hành vi vi phạm quy định tại điểm b khoản 1 Điều này;\nb) Buộc di chuyển chất, hàng hóa nguy hiểm về cháy, nổ đúng nơi quy định đối với hành vi vi phạm quy định tại khoản 2 Điều này.","y":"1. 다음 각 행위 중 하나에 대하여 3.000.000동 이상 5.000.000동 이하의 과태료를 부과한다:\na) 화재·폭발 위험 물질·화물을 규정에 맞지 아니하게 정리하거나 배치하는 행위;\nb) 화재·폭발 위험 물질·화물을 규정에 따른 수량, 중량을 초과하여 보관하는 행위.\n2. 화재·폭발 위험 물질·화물을 규정된 장소가 아닌 곳에 보관하거나 사용하는 행위에 대하여 5.000.000동 이상 10.000.000동 이하의 과태료를 부과한다.\n3. 화재·폭발 위험 지수가 연소(발화) 농도 한계의 하한을 초과하는 화재·폭발 위험 환경이 형성되도록 방치하는 행위에 대하여 10.000.000동 이상 15.000.000동 이하의 과태료를 부과한다.\n4. 화재·폭발 위험 물질·화물을 불법으로 저장(은닉)하였으나 형사책임을 추궁할 정도에 이르지 아니한 행위에 대하여 20.000.000동 이상 25.000.000동 이하의 과태료를 부과한다.\n5. 화재·폭발 위험 물질·화물을 불법으로 사용하였으나 형사책임을 추궁할 정도에 이르지 아니한 행위에 대하여 45.000.000동 이상 50.000.000동 이하의 과태료를 부과한다.\n6. 이 조 제1항, 제2항, 제3항 및 제4항에 규정된 행위로 화재가 발생하였으나 형사책임을 추궁할 정도에 이르지 아니한 경우에는 해당 과태료 수준의 2배의 과태료를 부과한다.\n7. 추가 처벌:\n이 조 제4항 및 제5항에 규정된 위반 행위에 대하여 행정위반 증거물을 몰수한다.\n8. 시정조치(결과 복구 조치):\na) 이 조 제1항 b호에 규정된 위반 행위에 대하여 화재·폭발 위험 물질·화물의 수량, 중량의 감축을 강제한다;\nb) 이 조 제2항에 규정된 위반 행위에 대하여 화재·폭발 위험 물질·화물을 규정된 장소로 이동할 것을 강제한다.","o":[]},{"id":"nd106-15","d":"nd106","n":"15","t":"Vi phạm quy định về phòng cháy, chữa cháy trong sản xuất, kinh doanh chất, hàng hóa nguy hiểm về cháy, nổ","k":"화재·폭발 위험 물질·화물의 생산, 영업에서의 소방(화재예방·진압)에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với một trong các hành vi sau đây:\na) Không duy trì thiết bị phát hiện rò rỉ chất, hàng hóa nguy hiểm về cháy, nổ đã được trang bị, lắp đặt;\nb) Không duy trì thiết bị, hệ thống chống tĩnh điện đã được trang bị, lắp đặt.\n2. Phạt tiền từ 10.000.000 đồng đến 15.000.000 đồng đối với một trong các hành vi sau đây:\na) Không trang bị, lắp đặt thiết bị phát hiện rò rỉ chất, hàng hóa nguy hiểm về cháy, nổ;\nb) Không trang bị, lắp đặt thiết bị, hệ thống chống tĩnh điện.\n3. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với một trong các hành vi sau đây:\na) San, chiết, nạp chất, hàng hóa nguy hiểm về cháy, nổ không đúng nơi quy định;\nb) San, chiết, nạp chất, hàng hóa nguy hiểm về cháy, nổ sang thiết bị chứa không đúng chủng loại hoặc không phù hợp với loại chất, hàng hóa nguy hiểm về cháy, nổ.\n4. Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với hành vi sản xuất hoặc kinh doanh trái phép chất, hàng hóa nguy hiểm về cháy, nổ nhưng chưa đến mức truy cứu trách nhiệm hình sự.\n5. Phạt tiền gấp hai lần mức tiền phạt đối với các hành vi quy định tại các khoản 1, 2 và khoản 3 Điều này khi để xảy ra cháy nhưng chưa đến mức truy cứu trách nhiệm hình sự.\n6. Hình thức xử phạt bổ sung:\na) Tịch thu tang vật vi phạm hành chính đối với hành vi vi phạm quy định tại điểm b khoản 3 và khoản 4 Điều này;\nb) Tước quyền sử dụng giấy phép là văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy từ 06 tháng đến 12 tháng đối với hành vi vi phạm tại khoản 4 Điều này.","y":"1. 다음 각 행위 중 하나에 대하여 3.000.000동 이상 5.000.000동 이하의 과태료를 부과한다:\na) 이미 비치, 설치된 화재·폭발 위험 물질·화물 누출 감지 장치를 유지하지 아니하는 행위;\nb) 이미 비치, 설치된 정전기 방지 장치, 설비를 유지하지 아니하는 행위.\n2. 다음 각 행위 중 하나에 대하여 10.000.000동 이상 15.000.000동 이하의 과태료를 부과한다:\na) 화재·폭발 위험 물질·화물 누출 감지 장치를 비치, 설치하지 아니하는 행위;\nb) 정전기 방지 장치, 설비를 비치, 설치하지 아니하는 행위.\n3. 다음 각 행위 중 하나에 대하여 20.000.000동 이상 25.000.000동 이하의 과태료를 부과한다:\na) 화재·폭발 위험 물질·화물을 규정된 장소가 아닌 곳에서 옮겨 담기, 소분, 충전하는 행위;\nb) 화재·폭발 위험 물질·화물을 종류가 맞지 아니하거나 해당 화재·폭발 위험 물질·화물의 종류에 적합하지 아니한 저장 용기(장치)로 옮겨 담기, 소분, 충전하는 행위.\n4. 화재·폭발 위험 물질·화물을 불법으로 생산하거나 영업하였으나 형사책임을 추궁할 정도에 이르지 아니한 행위에 대하여 40.000.000동 이상 50.000.000동 이하의 과태료를 부과한다.\n5. 이 조 제1항, 제2항 및 제3항에 규정된 행위로 화재가 발생하였으나 형사책임을 추궁할 정도에 이르지 아니한 경우에는 해당 과태료 수준의 2배의 과태료를 부과한다.\n6. 추가 처벌:\na) 이 조 제3항 b호 및 제4항에 규정된 위반 행위에 대하여 행정위반 증거물을 몰수한다;\nb) 이 조 제4항의 위반 행위에 대하여 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서인 허가서의 사용권을 06개월부터 12개월까지 박탈한다.","o":[]},{"id":"nd106-16","d":"nd106","n":"16","t":"Vi phạm quy định trong vận chuyển chất, hàng hóa nguy hiểm về cháy, nổ","k":"화재·폭발 위험 물질·화물의 운송에서의 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với hành vi sắp xếp, bố trí chất, hàng hóa nguy hiểm về cháy, nổ trên phương tiện vận chuyển không bảo đảm an toàn phòng cháy.\n2. Phạt tiền từ 5.000.000 đồng đến 7.000.000 đồng đối với một trong các hành vi sau đây:\na) Không duy trì các điều kiện an toàn về phòng cháy của phương tiện giao thông khi vận chuyển chất, hàng hóa nguy hiểm về cháy, nổ;\nb) Vận chuyển hàng hóa khác cùng với chất, hàng hóa nguy hiểm về cháy, nổ mà không được phép trên cùng một phương tiện giao thông;\nc) Chở người không có nhiệm vụ trên phương tiện giao thông vận chuyển chất, hàng hóa nguy hiểm về cháy, nổ.\n3. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với một trong những hành vi sau đây:\na) Không thực hiện các điều kiện bảo đảm an toàn về phòng cháy, chữa cháy khi bốc, dỡ, bơm, chuyển chất, hàng hóa nguy hiểm về cháy, nổ ra khỏi phương tiện giao thông;\nb) Không duy trì các biện pháp an toàn phòng cháy cho thiết bị, đường ống chuyển chất khí, chất lỏng dễ cháy, nổ;\nc) Bốc, dỡ, bơm, chuyển chất, hàng hóa nguy hiểm về cháy, nổ tại địa điểm không bảo đảm an toàn phòng cháy.\n4. Phạt tiền gấp hai lần mức tiền phạt đối với các hành vi quy định tại khoản 1, điểm a và điểm b khoản 2 và khoản 3 Điều này khi để xảy ra cháy nhưng chưa đến mức truy cứu trách nhiệm hình sự.\n5. Biện pháp khắc phục hậu quả:\na) Buộc duy trì các điều kiện an toàn về phòng cháy của phương tiện giao thông khi vận chuyển chất, hàng hóa nguy hiểm về cháy, nổ đối với hành vi vi phạm quy định tại điểm a khoản 2 Điều này;\nb) Buộc duy trì các biện pháp an toàn phòng cháy cho thiết bị, đường ống chuyển chất khí, chất lỏng dễ cháy, nổ đối với hành vi vi phạm quy định tại điểm b khoản 3 Điều này;\nc) Buộc bốc, dỡ, bơm, chuyển chất, hàng hóa nguy hiểm về cháy, nổ tại địa điểm bảo đảm an toàn phòng cháy đối với hành vi vi phạm quy định tại điểm c khoản 3 Điều này.","y":"1. 운송 수단 위에 화재·폭발 위험 물질·화물을 화재예방 안전을 확보하지 아니한 채 정리, 배치하는 행위에 대하여 3.000.000동 이상 5.000.000동 이하의 과태료를 부과한다.\n2. 다음 각 행위 중 하나에 대하여 5.000.000동 이상 7.000.000동 이하의 과태료를 부과한다:\na) 화재·폭발 위험 물질·화물을 운송할 때 교통수단의 화재예방 안전 조건을 유지하지 아니하는 행위;\nb) 허가 없이 동일한 교통수단에 화재·폭발 위험 물질·화물과 함께 다른 화물을 운송하는 행위;\nc) 화재·폭발 위험 물질·화물을 운송하는 교통수단에 임무가 없는 사람을 태우는 행위.\n3. 다음 각 행위 중 하나에 대하여 20.000.000동 이상 25.000.000동 이하의 과태료를 부과한다:\na) 화재·폭발 위험 물질·화물을 교통수단에서 상차, 하차, 펌프 이송, 이송할 때 소방(화재예방·진압) 안전 확보 조건을 이행하지 아니하는 행위;\nb) 가연성·폭발성 기체, 액체를 이송하는 설비, 배관에 대한 화재예방 안전 조치를 유지하지 아니하는 행위;\nc) 화재예방 안전이 확보되지 아니한 장소에서 화재·폭발 위험 물질·화물을 상차, 하차, 펌프 이송, 이송하는 행위.\n4. 이 조 제1항, 제2항 a호 및 b호, 제3항에 규정된 행위로 화재가 발생하였으나 형사책임을 추궁할 정도에 이르지 아니한 경우에는 해당 과태료 수준의 2배의 과태료를 부과한다.\n5. 시정조치(결과 복구 조치):\na) 이 조 제2항 a호에 규정된 위반 행위에 대하여 화재·폭발 위험 물질·화물을 운송할 때 교통수단의 화재예방 안전 조건을 유지할 것을 강제한다;\nb) 이 조 제3항 b호에 규정된 위반 행위에 대하여 가연성·폭발성 기체, 액체를 이송하는 설비, 배관에 대한 화재예방 안전 조치를 유지할 것을 강제한다;\nc) 이 조 제3항 c호에 규정된 위반 행위에 대하여 화재예방 안전이 확보된 장소에서 화재·폭발 위험 물질·화물을 상차, 하차, 펌프 이송, 이송할 것을 강제한다.","o":[]},{"id":"nd106-17","d":"nd106","n":"17","t":"Vi phạm quy định về bảo hiểm cháy, nổ bắt buộc","k":"화재·폭발 의무보험에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 10.000.000 đồng đến 15.000.000 đồng đối với một trong các hành vi sau đây:\na) Mua bảo hiểm cháy, nổ bắt buộc không đúng mức phí bảo hiểm cháy, nổ bắt buộc theo quy định đối với cơ sở phải mua bảo hiểm cháy, nổ bắt buộc;\nb) Nộp từ 50% đến dưới 100% tổng số tiền được trích cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ từ bảo hiểm cháy, nổ bắt buộc theo quy định.\n2. Phạt tiền từ 20.000.000 đồng đến 30.000.000 đồng đối với hành vi nộp dưới 50% tổng số tiền được trích cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ từ bảo hiểm cháy, nổ bắt buộc theo quy định.\n3. Phạt tiền từ 30.000.000 đồng đến 40.000.000 đồng đối với hành vi không mua bảo hiểm cháy, nổ bắt buộc đối với cơ sở có nguy hiểm về cháy, nổ thuộc nhóm 2 theo quy định của pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ.\n4. Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với một trong các hành vi sau đây:\na) Không mua bảo hiểm cháy, nổ bắt buộc đối với cơ sở có nguy hiểm về cháy, nổ thuộc nhóm 1 theo quy định của pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ;\nb) Không nộp tiền được trích cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ từ bảo hiểm cháy, nổ bắt buộc theo quy định.\nBổ sung","y":"1. 다음 각 행위 중 하나에 대하여 10.000.000동 이상 15.000.000동 이하의 과태료를 부과한다:\na) 화재·폭발 의무보험에 가입하여야 하는 사업장에 대하여 규정에 따른 화재·폭발 의무보험 보험료 수준에 맞지 아니하게 화재·폭발 의무보험에 가입하는 행위;\nb) 규정에 따라 화재·폭발 의무보험에서 소방 및 구조·구난 활동을 위하여 공제(적립)되는 금액 총액의 50% 이상 100% 미만을 납부하는 행위.\n2. 규정에 따라 화재·폭발 의무보험에서 소방 및 구조·구난 활동을 위하여 공제(적립)되는 금액 총액의 50% 미만을 납부하는 행위에 대하여 20.000.000동 이상 30.000.000동 이하의 과태료를 부과한다.\n3. 소방 및 구조·구난에 관한 법률의 규정에 따른 제2군(nhóm 2)에 속하는 화재·폭발 위험 사업장에 대하여 화재·폭발 의무보험에 가입하지 아니하는 행위에 대하여 30.000.000동 이상 40.000.000동 이하의 과태료를 부과한다.\n4. 다음 각 행위 중 하나에 대하여 40.000.000동 이상 50.000.000동 이하의 과태료를 부과한다:\na) 소방 및 구조·구난에 관한 법률의 규정에 따른 제1군(nhóm 1)에 속하는 화재·폭발 위험 사업장에 대하여 화재·폭발 의무보험에 가입하지 아니하는 행위;\nb) 규정에 따라 화재·폭발 의무보험에서 소방 및 구조·구난 활동을 위하여 공제(적립)되는 금액을 납부하지 아니하는 행위.\n(신설)","o":[["Khoản 5 Điều 17 được bổ sung bởi khoản 2 Điều 6 Nghị định số 69/2026/NĐ-CP","nd69-6"],["Điểm a khoản 1 Điều 17 được sửa đổi, bổ sung bởi khoản 1 Điều 6 Nghị định số 69/2026/NĐ-CP","nd69-6"]]},{"id":"nd106-18","d":"nd106","n":"18","t":"Vi phạm quy định về thẩm định thiết kế, nghiệm thu về phòng cháy và chữa cháy","k":"소방 설계 심사, 소방 준공검사(인수검사)에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 15.000.000 đồng đến 20.000.000 đồng đối với một trong các hành vi sau đây:\na) Chuyển đổi, bổ sung công năng hoặc cải tạo công trình, hạng mục công trình trong quá trình sử dụng thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy khi chưa có văn bản thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan quản lý chuyên ngành;\nb) Hoán cải phương tiện giao thông trong quá trình sử dụng thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy khi chưa có văn bản thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan quản lý chuyên ngành.\n2. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với hành vi thi công xây dựng công trình, hạng mục công trình hoặc sản xuất lắp ráp, đóng mới phương tiện giao thông thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy khi chưa có văn bản thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan quản lý chuyên ngành.\n3. Phạt tiền từ 30.000.000 đồng đến 50.000.000 đồng đối với hành vi đưa công trình, hạng mục công trình, phương tiện giao thông đã được thẩm duyệt thiết kế hoặc thẩm định thiết kế về phòng cháy và chữa cháy vào khai thác, sử dụng khi chưa có văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy của cơ quan quản lý chuyên ngành.\n4. Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với hành vi đưa công trình, hạng mục công trình, phương tiện giao thông thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy vào sử dụng, hoạt động khi chưa có văn bản thẩm định thiết kế về phòng cháy và chữa cháy và văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy của cơ quan quản lý chuyên ngành.\n5. Phạt tiền gấp hai lần mức tiền phạt đối với các hành vi quy định tại các khoản 1 và khoản 2 Điều này khi để xảy ra cháy nhưng chưa đến mức truy cứu trách nhiệm hình sự.\n6. Hình thức xử phạt bổ sung:\na) Đình chỉ hoạt động từ 03 tháng đến 06 tháng đối với hành vi vi phạm quy định tại khoản 3 Điều này;\nb) Đình chỉ hoạt động từ 06 tháng đến 12 tháng đối với hành vi vi phạm quy định tại khoản 4 Điều này.","y":"1. 다음 각 행위 중 하나에 대하여 15.000.000동 이상 20.000.000동 이하의 과태료를 부과한다:\na) 소방 설계 심사 대상에 해당하는 건축물, 건축물의 공종(부분 공사)을 사용 과정에서 전문 관리기관의 소방 설계 심사 문서를 받지 아니한 채 용도를 변경·추가하거나 개조하는 행위;\nb) 소방 설계 심사 대상에 해당하는 교통수단을 사용 과정에서 전문 관리기관의 소방 설계 심사 문서를 받지 아니한 채 개조(구조 변경)하는 행위.\n2. 소방 설계 심사 대상에 해당하는 건축물, 건축물의 공종(부분 공사)을 시공하거나 교통수단을 생산·조립, 신규 건조(제작)하면서 전문 관리기관의 소방 설계 심사 문서를 받지 아니한 행위에 대하여 20.000.000동 이상 25.000.000동 이하의 과태료를 부과한다.\n3. 소방 설계 승인(thẩm duyệt) 또는 소방 설계 심사를 받은 건축물, 건축물의 공종(부분 공사), 교통수단을 전문 관리기관의 소방 준공검사(인수검사) 결과 승인 문서를 받지 아니한 채 운영, 사용에 투입하는 행위에 대하여 30.000.000동 이상 50.000.000동 이하의 과태료를 부과한다.\n4. 소방 설계 심사 대상에 해당하는 건축물, 건축물의 공종(부분 공사), 교통수단을 전문 관리기관의 소방 설계 심사 문서 및 소방 준공검사(인수검사) 결과 승인 문서를 받지 아니한 채 사용, 운영(활동)에 투입하는 행위에 대하여 40.000.000동 이상 50.000.000동 이하의 과태료를 부과한다.\n5. 이 조 제1항 및 제2항에 규정된 행위로 화재가 발생하였으나 형사책임을 추궁할 정도에 이르지 아니한 경우에는 해당 과태료 수준의 2배의 과태료를 부과한다.\n6. 추가 처벌:\na) 이 조 제3항에 규정된 위반 행위에 대하여 03개월부터 06개월까지 영업(활동) 정지;\nb) 이 조 제4항에 규정된 위반 행위에 대하여 06개월부터 12개월까지 영업(활동) 정지.","o":[["Khoản 3 Điều 18 được sửa đổi, bổ sung bởi khoản 1 Điều 32 Nghị định số 347/2026/NĐ-CP","nd347-32"],["Khoản 4 Điều 18 được sửa đổi, bổ sung bởi khoản 2 Điều 32 Nghị định số 347/2026/NĐ-CP","nd347-32"],["Khoản 6 Điều 18 được sửa đổi, bổ sung bởi Điều 7 Nghị định số 69/2026/NĐ-CP","nd69-7"]]},{"id":"nd106-19","d":"nd106","n":"19","t":"Hành vi vi phạm về lưu thông phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ và vật liệu, cấu kiện ngăn cháy, chống cháy","k":"소방 및 구조·구난 장비·설비와 방화·내화 자재, 부재의 유통에 관한 위반 행위","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 20.000.000 đồng đến 30.000.000 đồng đối với hành vi tẩy xóa, sửa chữa làm sai lệch nội dung giấy phép lưu thông phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ, vật liệu, cấu kiện ngăn cháy, chống cháy.\n2. Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với một trong các hành vi sau đây:\na) Kinh doanh, đưa phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ, vật liệu, cấu kiện ngăn cháy, chống cháy vào lưu thông khi chưa được cấp phép;\nb) Sử dụng hồ sơ, tài liệu sai sự thật để đề nghị cấp giấy phép lưu thông phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ, vật liệu, cấu kiện ngăn cháy, chống cháy.\n3. Biện pháp khắc phục hậu quả:\na) Buộc nộp lại giấy phép lưu thông phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ, vật liệu, cấu kiện ngăn cháy, chống cháy cho cơ quan, người có thẩm quyền đã cấp giấy phép đối với hành vi vi phạm quy định tại khoản 1 và điểm b khoản 2 Điều này;\nb) Buộc thu hồi phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ, vật liệu, cấu kiện ngăn cháy, chống cháy đối với hành vi vi phạm quy định tại điểm a khoản 2 Điều này.","y":"1. 소방 및 구조·구난 장비·설비, 방화·내화 자재, 부재의 유통 허가서를 삭제, 수정하여 내용을 왜곡하는 행위에 대하여 20.000.000동 이상 30.000.000동 이하의 과태료를 부과한다.\n2. 다음 각 행위 중 하나에 대하여 40.000.000동 이상 50.000.000동 이하의 과태료를 부과한다:\na) 허가를 받지 아니한 채 소방 및 구조·구난 장비·설비, 방화·내화 자재, 부재를 영업하거나 유통에 투입하는 행위;\nb) 소방 및 구조·구난 장비·설비, 방화·내화 자재, 부재의 유통 허가서 발급을 신청하기 위하여 사실과 다른 서류, 자료를 사용하는 행위.\n3. 시정조치(결과 복구 조치):\na) 이 조 제1항 및 제2항 b호에 규정된 위반 행위에 대하여 소방 및 구조·구난 장비·설비, 방화·내화 자재, 부재의 유통 허가서를 그 허가서를 발급한 권한 있는 기관, 권한자에게 반납할 것을 강제한다;\nb) 이 조 제2항 a호에 규정된 위반 행위에 대하여 소방 및 구조·구난 장비·설비, 방화·내화 자재, 부재의 회수를 강제한다.","o":[]},{"id":"nd106-20","d":"nd106","n":"20","t":"Vi phạm quy định về trang bị, lắp đặt phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 장비·설비의 비치, 설치에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 1.000.000 đồng đến 2.000.000 đồng đối với hành vi trang bị phương tiện chữa cháy thông dụng, dụng cụ phá dỡ thô sơ không bảo đảm theo quy định.\n2. Phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với hành vi không trang bị, lắp đặt phương tiện chữa cháy thông dụng, dụng cụ phá dỡ thô sơ.\n3. Phạt tiền từ 5.000.000 đồng đến 7.000.000 đồng đối với hành vi trang bị, lắp đặt đèn, phương tiện chiếu sáng sự cố, chỉ dẫn thoát nạn không bảo đảm theo quy định.\n4. Phạt tiền từ 8.000.000 đồng đến 10.000.000 đồng đối với hành vi trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành không bảo đảm theo quy định.\n5. Phạt tiền từ 10.000.000 đồng đến 15.000.000 đồng đối với hành vi không trang bị, lắp đặt đèn, phương tiện chiếu sáng sự cố, chỉ dẫn thoát nạn.\n6. Phạt tiền từ 15.000.000 đồng đến 20.000.000 đồng đối với hành vi không trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở.\n7. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với hành vi không trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành.\n8. Phạt tiền từ 30.000.000 đồng đến 40.000.000 đồng đối với một trong các hành vi sau đây:\na) Trang bị, lắp đặt thiết bị thuộc hệ thống báo cháy không bảo đảm theo quy định;\nb) Trang bị, lắp đặt thiết bị thuộc hệ thống chữa cháy không bảo đảm theo quy định.\nBổ sung\n9. Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với một trong các hành vi sau đây:\na) Không trang bị, lắp đặt hệ thống báo cháy;\nb) Không trang bị, lắp đặt hệ thống chữa cháy;\nc) Không trang bị phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới.\n10. Phạt tiền gấp hai lần mức tiền phạt đối với các hành vi quy định tại các khoản 2, 5, 6 và khoản 7 Điều này khi để xảy ra cháy nhưng chưa đến mức truy cứu trách nhiệm hình sự.\n11. Hình thức xử phạt bổ sung:\nĐình chỉ hoạt động từ 03 tháng đến 06 tháng đối với hành vi vi phạm quy định tại điểm a và điểm b khoản 9 Điều này.\n12. Biện pháp khắc phục hậu quả:\na) Buộc trang bị phương tiện chữa cháy thông dụng, dụng cụ phá dỡ thô sơ đối với hành vi vi phạm tại khoản 1 Điều này;\nb) Buộc trang bị, lắp đặt đèn, phương tiện chiếu sáng sự cố, chỉ dẫn thoát nạn đối với hành vi vi phạm tại khoản 3 Điều này;\nc) Buộc trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành đối với hành vi vi phạm tại khoản 4 Điều này;\nd) Buộc trang bị, lắp đặt hệ thống báo cháy đối với hành vi vi phạm quy định tại điểm a khoản 8 Điều này;\nđ) Buộc trang bị, lắp đặt hệ thống chữa cháy đối với hành vi vi phạm quy định tại điểm b khoản 8 Điều này.","y":"1. 일반 화재진압 장비, 수동식 파괴 도구를 규정에 맞지 아니하게 비치하는 행위에 대하여 1.000.000동 이상 2.000.000동 이하의 과태료를 부과한다.\n2. 일반 화재진압 장비, 수동식 파괴 도구를 비치, 설치하지 아니하는 행위에 대하여 3.000.000동 이상 5.000.000동 이하의 과태료를 부과한다.\n3. 비상 조명, 피난 유도용 등 및 장비를 규정에 맞지 아니하게 비치, 설치하는 행위에 대하여 5.000.000동 이상 7.000.000동 이하의 과태료를 부과한다.\n4. 사업장 자체 소방·구조구난대, 전문 소방·구조구난대에 소방 및 구조·구난 장비·설비를 규정에 맞지 아니하게 비치하는 행위에 대하여 8.000.000동 이상 10.000.000동 이하의 과태료를 부과한다.\n5. 비상 조명, 피난 유도용 등 및 장비를 비치, 설치하지 아니하는 행위에 대하여 10.000.000동 이상 15.000.000동 이하의 과태료를 부과한다.\n6. 사업장 자체 소방·구조구난대에 소방 및 구조·구난 장비·설비를 비치하지 아니하는 행위에 대하여 15.000.000동 이상 20.000.000동 이하의 과태료를 부과한다.\n7. 전문 소방·구조구난대에 소방 및 구조·구난 장비·설비를 비치하지 아니하는 행위에 대하여 20.000.000동 이상 25.000.000동 이하의 과태료를 부과한다.\n8. 다음 각 행위 중 하나에 대하여 30.000.000동 이상 40.000.000동 이하의 과태료를 부과한다:\na) 화재경보 설비에 속하는 장치를 규정에 맞지 아니하게 비치, 설치하는 행위;\nb) 소화 설비에 속하는 장치를 규정에 맞지 아니하게 비치, 설치하는 행위.\n(신설)\n9. 다음 각 행위 중 하나에 대하여 40.000.000동 이상 50.000.000동 이하의 과태료를 부과한다:\na) 화재경보 설비를 비치, 설치하지 아니하는 행위;\nb) 소화 설비를 비치, 설치하지 아니하는 행위;\nc) 동력식 화재진압, 구조·구난 장비를 비치하지 아니하는 행위.\n10. 이 조 제2항, 제5항, 제6항 및 제7항에 규정된 행위로 화재가 발생하였으나 형사책임을 추궁할 정도에 이르지 아니한 경우에는 해당 과태료 수준의 2배의 과태료를 부과한다.\n11. 추가 처벌:\n이 조 제9항 a호 및 b호에 규정된 위반 행위에 대하여 03개월부터 06개월까지 영업(활동) 정지.\n12. 시정조치(결과 복구 조치):\na) 이 조 제1항의 위반 행위에 대하여 일반 화재진압 장비, 수동식 파괴 도구의 비치를 강제한다;\nb) 이 조 제3항의 위반 행위에 대하여 비상 조명, 피난 유도용 등 및 장비의 비치, 설치를 강제한다;\nc) 이 조 제4항의 위반 행위에 대하여 사업장 자체 소방·구조구난대, 전문 소방·구조구난대에 소방 및 구조·구난 장비·설비를 비치할 것을 강제한다;\nd) 이 조 제8항 a호에 규정된 위반 행위에 대하여 화재경보 설비의 비치, 설치를 강제한다;\nđ) 이 조 제8항 b호에 규정된 위반 행위에 대하여 소화 설비의 비치, 설치를 강제한다.","o":[["Điểm c khoản 8 Điều 20 được bổ sung bởi khoản 1 Điều 8 Nghị định số 69/2026/NĐ-CP","nd69-8"],["Khoản 12 Điều 20 được sửa đổi, bổ sung bởi khoản 2 Điều 8 Nghị định số 69/2026/NĐ-CP","nd69-8"]]},{"id":"nd106-21","d":"nd106","n":"21","t":"Vi phạm quy định về sử dụng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 장비·설비의 사용에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 1.000.000 đồng đến 3.000.000 đồng đối với hành vi tự ý di chuyển, che khuất phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ đã được trang bị, lắp đặt.\n2. Phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với hành vi không duy trì đủ số lượng hoặc không bảo đảm chất lượng của phương tiện chữa cháy thông dụng, dụng cụ phá dỡ thô sơ đã được trang bị, lắp đặt.\n3. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với một trong các hành vi sau đây:\na) Không duy trì hoạt động của đèn, phương tiện chiếu sáng sự cố, chỉ dẫn thoát nạn đã được trang bị, lắp đặt;\nb) Không duy trì hoạt động của thiết bị báo cháy độc lập đã được trang bị, lắp đặt.\n4. Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với một trong các hành vi sau đây:\na) Không duy trì hoạt động của thiết bị thuộc hệ thống báo cháy đã được trang bị, lắp đặt;\nb) Không duy trì hoạt động của thiết bị thuộc hệ thống chữa cháy đã được trang bị, lắp đặt.\n5. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với hành vi không đưa phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới vào trực chữa cháy, cứu nạn, cứu hộ.\n6. Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với một trong các hành vi sau đây:\na) Không duy trì hoạt động của hệ thống báo cháy đã được trang bị, lắp đặt;\nb) Không duy trì hoạt động của hệ thống chữa cháy đã được trang bị, lắp đặt.\n7. Phạt tiền gấp hai lần mức tiền phạt đối với các hành vi quy định tại các khoản 2, 3, 4 và khoản 5 Điều này khi để xảy ra cháy nhưng chưa đến mức truy cứu trách nhiệm hình sự.\n8. Hình thức xử phạt bổ sung:\nĐình chỉ hoạt động từ 01 tháng đến 03 tháng đối với hành vi vi phạm quy định tại khoản 6 Điều này.\n9. Biện pháp khắc phục hậu quả:\na) Buộc khôi phục lại tình trạng ban đầu đối với hành vi vi phạm quy định tại khoản 1 Điều này;\nb) Buộc duy trì đủ số lượng, bảo đảm chất lượng phương tiện chữa cháy thông dụng, dụng cụ phá dỡ thô sơ đối với hành vi vi phạm quy định tại khoản 2 Điều này;\nc) Buộc duy trì đèn, phương tiện chiếu sáng sự cố, chỉ dẫn thoát nạn đối với hành vi vi phạm quy định tại điểm a khoản 3 Điều này;\nd) Buộc duy trì thiết bị báo cháy độc lập đối với hành vi vi phạm quy định tại điểm b khoản 3 Điều này;\nđ) Buộc duy trì hệ thống báo cháy đối với hành vi vi phạm quy định tại điểm a khoản 4, điểm a khoản 6 Điều này;\ne) Buộc duy trì hệ thống chữa cháy đối với hành vi vi phạm quy định tại điểm b khoản 4, điểm b khoản 6 Điều này.","y":"1. 이미 비치, 설치된 소방 및 구조·구난 장비·설비를 임의로 이동하거나 가리는 행위에 대하여 1.000.000동 이상 3.000.000동 이하의 과태료를 부과한다.\n2. 이미 비치, 설치된 일반 화재진압 장비, 수동식 파괴 도구의 수량을 충분히 유지하지 아니하거나 품질을 확보하지 아니하는 행위에 대하여 3.000.000동 이상 5.000.000동 이하의 과태료를 부과한다.\n3. 다음 각 행위 중 하나에 대하여 5.000.000동 이상 10.000.000동 이하의 과태료를 부과한다:\na) 이미 비치, 설치된 비상 조명, 피난 유도용 등 및 장비의 작동을 유지하지 아니하는 행위;\nb) 이미 비치, 설치된 단독형 화재경보 장치의 작동을 유지하지 아니하는 행위.\n4. 다음 각 행위 중 하나에 대하여 10.000.000동 이상 20.000.000동 이하의 과태료를 부과한다:\na) 이미 비치, 설치된 화재경보 설비에 속하는 장치의 작동을 유지하지 아니하는 행위;\nb) 이미 비치, 설치된 소화 설비에 속하는 장치의 작동을 유지하지 아니하는 행위.\n5. 동력식 화재진압, 구조·구난 장비를 화재진압, 구조·구난 당직(대기)에 투입하지 아니하는 행위에 대하여 20.000.000동 이상 25.000.000동 이하의 과태료를 부과한다.\n6. 다음 각 행위 중 하나에 대하여 40.000.000동 이상 50.000.000동 이하의 과태료를 부과한다:\na) 이미 비치, 설치된 화재경보 설비의 작동을 유지하지 아니하는 행위;\nb) 이미 비치, 설치된 소화 설비의 작동을 유지하지 아니하는 행위.\n7. 이 조 제2항, 제3항, 제4항 및 제5항에 규정된 행위로 화재가 발생하였으나 형사책임을 추궁할 정도에 이르지 아니한 경우에는 해당 과태료 수준의 2배의 과태료를 부과한다.\n8. 추가 처벌:\n이 조 제6항에 규정된 위반 행위에 대하여 01개월부터 03개월까지 영업(활동) 정지.\n9. 시정조치(결과 복구 조치):\na) 이 조 제1항에 규정된 위반 행위에 대하여 원상회복을 강제한다;\nb) 이 조 제2항에 규정된 위반 행위에 대하여 일반 화재진압 장비, 수동식 파괴 도구의 수량을 충분히 유지하고 품질을 확보할 것을 강제한다;\nc) 이 조 제3항 a호에 규정된 위반 행위에 대하여 비상 조명, 피난 유도용 등 및 장비의 유지를 강제한다;\nd) 이 조 제3항 b호에 규정된 위반 행위에 대하여 단독형 화재경보 장치의 유지를 강제한다;\nđ) 이 조 제4항 a호, 제6항 a호에 규정된 위반 행위에 대하여 화재경보 설비의 유지를 강제한다;\ne) 이 조 제4항 b호, 제6항 b호에 규정된 위반 행위에 대하여 소화 설비의 유지를 강제한다.","o":[["Khoản 2 Điều 21 được sửa đổi, bổ sung bởi khoản 1 Điều 9 Nghị định số 69/2026/NĐ-CP","nd69-9"],["Khoản 8 Điều 21 bị bãi bỏ bởi khoản 2 Điều 9 Nghị định số 69/2026/NĐ-CP","nd69-9"],["Điểm b khoản 9 Điều 21 được sửa đổi, bổ sung bởi điểm a khoản 3 Điều 9 Nghị định số 69/2026/NĐ-CP","nd69-9"],["Điểm đ khoản 9 Điều 21 được sửa đổi, bổ sung bởi điểm b khoản 3 Điều 9 Nghị định số 69/2026/NĐ-CP","nd69-9"],["Điểm e khoản 9 Điều 21 được sửa đổi, bổ sung bởi điểm c khoản 3 Điều 9 Nghị định số 69/2026/NĐ-CP","nd69-9"]]},{"id":"nd106-22","d":"nd106","n":"22","t":"Vi phạm quy định về bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 장비·설비의 보관, 정비에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với một trong các hành vi sau đây:\na) Không bảo quản, bảo dưỡng phương tiện chữa cháy thông dụng hoặc thiết bị báo cháy độc lập;\nb) Bảo quản, bảo dưỡng hệ thống báo cháy không bảo đảm nội dung theo quy định;\nc) Bảo quản, bảo dưỡng hệ thống chữa cháy không bảo đảm nội dung theo quy định;\nd) Bảo quản, bảo dưỡng phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới không bảo đảm nội dung theo quy định.\n2. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với hành vi không bảo quản, bảo dưỡng phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới.\n3. Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với một trong các hành vi sau đây:\na) Không bảo dưỡng hệ thống báo cháy;\nb) Không bảo dưỡng hệ thống chữa cháy.","y":"1. 다음 각 행위 중 하나에 대하여 3.000.000동 이상 5.000.000동 이하의 과태료를 부과한다:\na) 일반 화재진압 장비 또는 단독형 화재경보 장치를 보관, 정비하지 아니하는 행위;\nb) 화재경보 설비를 규정에 따른 내용을 충족하지 아니하게 보관, 정비하는 행위;\nc) 소화 설비를 규정에 따른 내용을 충족하지 아니하게 보관, 정비하는 행위;\nd) 동력식 화재진압, 구조·구난 장비를 규정에 따른 내용을 충족하지 아니하게 보관, 정비하는 행위.\n2. 동력식 화재진압, 구조·구난 장비를 보관, 정비하지 아니하는 행위에 대하여 5.000.000동 이상 10.000.000동 이하의 과태료를 부과한다.\n3. 다음 각 행위 중 하나에 대하여 10.000.000동 이상 20.000.000동 이하의 과태료를 부과한다:\na) 화재경보 설비를 정비하지 아니하는 행위;\nb) 소화 설비를 정비하지 아니하는 행위.","o":[]},{"id":"nd106-23","d":"nd106","n":"23","t":"Vi phạm quy định về thông gió, chống khói","k":"환기·방연에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với một trong các hành vi sau đây:\na) Trang bị, lắp đặt thiết bị thuộc hệ thống thông gió thoát khói không bảo đảm theo quy định;\nb) Trang bị, lắp đặt thiết bị thuộc hệ thống tạo áp suất dư cho khu vực cần chống nhiễm khói không bảo đảm theo quy định.\n2. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với một trong các hành vi sau đây:\na) Không duy trì thông gió tự nhiên hoặc không duy trì hệ thống thông gió thoát khói đã được trang bị, lắp đặt;\nb) Không duy trì hệ thống tạo áp suất dư cho khu vực cần chống nhiễm khói đã được trang bị, lắp đặt.\n3. Phạt tiền từ 30.000.000 đồng đến 40.000.000 đồng đối với hành vi không duy trì giải pháp thông gió cho khu vực sản xuất, bảo quản, kinh doanh, sử dụng chất, hàng hóa nguy hiểm về cháy, nổ đã được trang bị, lắp đặt.\n4. Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với một trong các hành vi sau đây:\na) Không có giải pháp thông gió tự nhiên hoặc không có giải pháp thông gió thoát khói;\nb) Không trang bị, lắp đặt hệ thống tạo áp suất dư cho khu vực phải trang bị, lắp đặt.\n5. Phạt tiền gấp hai lần mức tiền phạt đối với các hành vi quy định tại các khoản 1 và khoản 2 Điều này khi để xảy ra cháy nhưng chưa đến mức truy cứu trách nhiệm hình sự.\n6. Hình thức xử phạt bổ sung:\nĐình chỉ hoạt động từ 03 tháng đến 06 tháng đối với hành vi vi phạm quy định tại khoản 3 Điều này.\n7. Biện pháp khắc phục hậu quả:\na) Buộc trang bị, lắp đặt hệ thống thông gió thoát khói đối với hành vi vi phạm quy định tại điểm a khoản 1 Điều này;\nb) Buộc trang bị, lắp đặt hệ thống tạo áp suất dư đối với hành vi vi phạm quy định tại điểm b khoản 1 Điều này;\nc) Buộc duy trì giải pháp thông gió, hệ thống thông gió thoát khói đối với hành vi vi phạm quy định tại điểm a khoản 2 Điều này;\nd) Buộc duy trì hệ thống tạo áp suất dư đối với hành vi vi phạm quy định tại điểm b khoản 2 Điều này;\nđ) Buộc duy trì giải pháp thông gió cho khu vực sản xuất, bảo quản, kinh doanh, sử dụng chất, hàng hóa nguy hiểm về cháy, nổ đối với hành vi vi phạm quy định tại khoản 3 Điều này.","y":"1. 다음 각 행위 중 하나에 대하여 10.000.000동부터 20.000.000동까지의 과태료를 부과한다:\na) 배연 환기 설비에 속하는 장치를 규정에 맞지 않게 구비·설치하는 행위;\nb) 연기 침투를 방지해야 하는 구역을 위한 가압(잉여압력 형성) 설비에 속하는 장치를 규정에 맞지 않게 구비·설치하는 행위.\n2. 다음 각 행위 중 하나에 대하여 20.000.000동부터 25.000.000동까지의 과태료를 부과한다:\na) 자연 환기를 유지하지 않거나 이미 구비·설치된 배연 환기 설비를 유지하지 않는 행위;\nb) 연기 침투를 방지해야 하는 구역을 위하여 이미 구비·설치된 가압(잉여압력 형성) 설비를 유지하지 않는 행위.\n3. 화재·폭발 위험 물질·화물을 생산·보관·영업·사용하는 구역을 위하여 이미 구비·설치된 환기 대책을 유지하지 않는 행위에 대하여 30.000.000동부터 40.000.000동까지의 과태료를 부과한다.\n4. 다음 각 행위 중 하나에 대하여 40.000.000동부터 50.000.000동까지의 과태료를 부과한다:\na) 자연 환기 대책이 없거나 배연 환기 대책이 없는 행위;\nb) 구비·설치하여야 하는 구역에 가압(잉여압력 형성) 설비를 구비·설치하지 않는 행위.\n5. 이 조 제1항 및 제2항에 규정된 행위로 화재가 발생하였으나 형사책임을 추궁할 정도에 이르지 않은 경우에는 해당 과태료 금액의 두 배의 과태료를 부과한다.\n6. 추가 처벌:\n이 조 제3항에 규정된 위반행위에 대하여 03개월부터 06개월까지 영업(활동) 정지.\n7. 시정조치(결과 복구 조치):\na) 이 조 제1항 a호에 규정된 위반행위에 대하여 배연 환기 설비를 구비·설치하도록 강제;\nb) 이 조 제1항 b호에 규정된 위반행위에 대하여 가압(잉여압력 형성) 설비를 구비·설치하도록 강제;\nc) 이 조 제2항 a호에 규정된 위반행위에 대하여 환기 대책, 배연 환기 설비를 유지하도록 강제;\nd) 이 조 제2항 b호에 규정된 위반행위에 대하여 가압(잉여압력 형성) 설비를 유지하도록 강제;\nđ) 이 조 제3항에 규정된 위반행위에 대하여 화재·폭발 위험 물질·화물을 생산·보관·영업·사용하는 구역을 위한 환기 대책을 유지하도록 강제.","o":[["Khoản 6 Điều 23 bị bãi bỏ bởi Điều 10 Nghị định số 69/2026/NĐ-CP","nd69-10"]]},{"id":"nd106-24","d":"nd106","n":"24","t":"Vi phạm quy định về thoát nạn trong phòng cháy và chữa cháy","k":"소방(화재예방·진압)에서의 피난에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 1.000.000 đồng đến 3.000.000 đồng đối với một trong các hành vi sau đây:\na) Lắp gương trên đường thoát nạn;\nb) Cửa đi trên lối ra thoát nạn không mở theo chiều thoát nạn.\n2. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với hành vi để vật tư, hàng hóa, phương tiện giao thông, vật dụng, thiết bị khác cản trở lối thoát nạn hoặc đường thoát nạn.\n3. Phạt tiền từ 10.000.000 đồng đến 15.000.000 đồng đối với một trong các hành vi sau đây:\na) Không duy trì cửa đi đã được lắp đặt trên lối thoát nạn hoặc đường thoát nạn;\nb) Khóa cửa đi lắp đặt trên lối thoát nạn hoặc đường thoát nạn.\n4. Phạt tiền từ 20.000.000 đồng đến 30.000.000 đồng đối với một trong các hành vi sau đây:\na) Không duy trì lối thoát nạn hoặc đường thoát nạn của gian phòng, khu vực;\nb) Không có đủ lối thoát nạn hoặc đường thoát nạn của gian phòng, khu vực.\n5. Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với một trong các hành vi sau đây:\na) Không duy trì lối thoát nạn hoặc đường thoát nạn của nhà, công trình;\nb) Không có đủ lối thoát nạn hoặc đường thoát nạn của nhà, công trình.\n6. Hình thức xử phạt bổ sung:\nĐình chỉ hoạt động từ 03 tháng đến 06 tháng đối với hành vi vi phạm quy định tại khoản 5 Điều này.\n7. Biện pháp khắc phục hậu quả:\na) Buộc tháo gương trên đường thoát nạn đối với hành vi vi phạm quy định tại điểm a khoản 1 Điều này;\nb) Buộc mở cửa theo chiều thoát nạn đối với hành vi vi phạm quy định tại điểm b khoản 1 Điều này;\nc) Buộc di chuyển vật tư, hàng hóa, phương tiện giao thông, vật dụng, thiết bị khác đối với hành vi vi phạm quy định tại khoản 2 Điều này;\nd) Buộc duy trì cửa đi trên lối thoát nạn, đường thoát nạn đối với hành vi vi phạm quy định tại khoản 3 Điều này.\nBổ sung","y":"1. 다음 각 행위 중 하나에 대하여 1.000.000동부터 3.000.000동까지의 과태료를 부과한다:\na) 피난로에 거울을 설치하는 행위;\nb) 피난 출구의 출입문이 피난 방향으로 열리지 않는 행위.\n2. 자재, 화물, 교통수단, 물품, 그 밖의 장비를 두어 피난구 또는 피난로를 방해하는 행위에 대하여 5.000.000동부터 10.000.000동까지의 과태료를 부과한다.\n3. 다음 각 행위 중 하나에 대하여 10.000.000동부터 15.000.000동까지의 과태료를 부과한다:\na) 피난구 또는 피난로에 이미 설치된 출입문을 유지하지 않는 행위;\nb) 피난구 또는 피난로에 설치된 출입문을 잠그는 행위.\n4. 다음 각 행위 중 하나에 대하여 20.000.000동부터 30.000.000동까지의 과태료를 부과한다:\na) 실(室), 구역의 피난구 또는 피난로를 유지하지 않는 행위;\nb) 실(室), 구역의 피난구 또는 피난로가 충분하지 않은 행위.\n5. 다음 각 행위 중 하나에 대하여 40.000.000동부터 50.000.000동까지의 과태료를 부과한다:\na) 건물, 건축물의 피난구 또는 피난로를 유지하지 않는 행위;\nb) 건물, 건축물의 피난구 또는 피난로가 충분하지 않은 행위.\n6. 추가 처벌:\n이 조 제5항에 규정된 위반행위에 대하여 03개월부터 06개월까지 영업(활동) 정지.\n7. 시정조치(결과 복구 조치):\na) 이 조 제1항 a호에 규정된 위반행위에 대하여 피난로의 거울을 철거하도록 강제;\nb) 이 조 제1항 b호에 규정된 위반행위에 대하여 문을 피난 방향으로 열리게 하도록 강제;\nc) 이 조 제2항에 규정된 위반행위에 대하여 자재, 화물, 교통수단, 물품, 그 밖의 장비를 이동하도록 강제;\nd) 이 조 제3항에 규정된 위반행위에 대하여 피난구, 피난로의 출입문을 유지하도록 강제.\n(신설)","o":[["Khoản 3 Điều 24 bị bãi bỏ bởi khoản 1 Điều 11 Nghị định số 69/2026/NĐ-CP","nd69-11"],["Khoản 6 Điều 24 được sửa đổi, bổ sung bởi khoản 2 Điều 11 Nghị định số 69/2026/NĐ-CP","nd69-11"],["Điểm đ khoản 7 Điều 24 được bổ sung bởi điểm b khoản 3 Điều 11 Nghị định số 69/2026/NĐ-CP","nd69-11"],["Điểm d khoản 7 Điều 24 được sửa đổi, bổ sung bởi điểm a khoản 3 Điều 11 Nghị định số 69/2026/NĐ-CP","nd69-11"]]},{"id":"nd106-25","d":"nd106","n":"25","t":"Vi phạm quy định về ngăn cháy","k":"방화(구획)에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền từ 2.000.000 đồng đến 4.000.000 đồng đối với hành vi để vật tư, hàng hóa, phương tiện giao thông, vật dụng, thiết bị khác không bảo đảm khoảng cách phòng cháy, chữa cháy.\n2. Phạt tiền từ 5.000.000 đồng đến 7.000.000 đồng đối với hành vi không duy trì bộ phận ngăn cháy đã được thi công, lắp đặt, trừ hành vi quy định tại khoản 5 Điều này.\n3. Phạt tiền từ 8.000.000 đồng đến 10.000.000 đồng đối với một trong các hành vi sau đây:\na) Không dọn sạch chất dễ cháy nằm trong hành lang an toàn tuyến ống dẫn dầu mỏ, khí đốt và sản phẩm dầu mỏ;\nb) Lắp đặt ống dẫn khí cháy, chất lỏng cháy tại khu vực không được phép hoặc không bảo đảm an toàn phòng cháy.\n4. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với một trong các hành vi sau đây:\na) Không duy trì khoảng cách phòng cháy, chữa cháy giữa các nhà và công trình;\nb) Không có bộ phận ngăn cháy, trừ hành vi quy định tại khoản 5 Điều này.\n5. Phạt tiền từ 30.000.000 đồng đến 40.000.000 đồng đối với hành vi không có hoặc không duy trì tường ngăn cháy hoặc vách ngăn cháy hoặc sàn ngăn cháy.\n6. Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với hành vi xây dựng nhà, công trình không bảo đảm khoảng cách phòng cháy, chữa cháy.\n7. Phạt tiền gấp hai lần mức tiền phạt đối với các hành vi quy định tại các khoản 2, 3 và khoản 4 Điều này khi để xảy ra cháy nhưng chưa đến mức truy cứu trách nhiệm hình sự.\n8. Hình thức xử phạt bổ sung:\nĐình chỉ hoạt động từ 06 tháng đến 12 tháng đối với hành vi vi phạm quy định tại khoản 6 Điều này.\n9. Biện pháp khắc phục hậu quả:\na) Buộc di chuyển vật tư, hàng hóa, phương tiện giao thông, vật dụng, thiết bị khác bảo đảm khoảng cách phòng cháy, chữa cháy đối với hành vi vi phạm quy định tại khoản 1 Điều này;\nb) Buộc duy trì bộ phận ngăn cháy đối với hành vi vi phạm quy định tại khoản 2 Điều này;\nc) Buộc duy trì khoảng cách phòng cháy, chữa cháy đối với hành vi vi phạm quy định tại điểm a khoản 4 Điều này;\nd) Buộc lắp đặt hoặc duy trì tường ngăn cháy hoặc vách ngăn cháy hoặc sàn ngăn cháy hành vi vi phạm quy định tại khoản 5 Điều này.","y":"1. 자재, 화물, 교통수단, 물품, 그 밖의 장비를 소방(화재예방·진압) 이격거리를 확보하지 않은 채 두는 행위에 대하여 2.000.000동부터 4.000.000동까지의 과태료를 부과한다.\n2. 이미 시공·설치된 방화(구획) 부분을 유지하지 않는 행위에 대하여 5.000.000동부터 7.000.000동까지의 과태료를 부과한다. 다만, 이 조 제5항에 규정된 행위는 제외한다.\n3. 다음 각 행위 중 하나에 대하여 8.000.000동부터 10.000.000동까지의 과태료를 부과한다:\na) 석유, 가스 및 석유제품 배관 노선의 안전 회랑 안에 있는 가연성 물질을 깨끗이 치우지 않는 행위;\nb) 가연성 가스, 가연성 액체 배관을 허용되지 않는 구역에 설치하거나 화재예방 안전을 확보하지 않고 설치하는 행위.\n4. 다음 각 행위 중 하나에 대하여 20.000.000동부터 25.000.000동까지의 과태료를 부과한다:\na) 건물과 건축물 사이의 소방(화재예방·진압) 이격거리를 유지하지 않는 행위;\nb) 방화(구획) 부분이 없는 행위. 다만, 이 조 제5항에 규정된 행위는 제외한다.\n5. 방화벽 또는 방화 칸막이벽 또는 방화 바닥이 없거나 이를 유지하지 않는 행위에 대하여 30.000.000동부터 40.000.000동까지의 과태료를 부과한다.\n6. 소방(화재예방·진압) 이격거리를 확보하지 않고 건물, 건축물을 건설하는 행위에 대하여 40.000.000동부터 50.000.000동까지의 과태료를 부과한다.\n7. 이 조 제2항, 제3항 및 제4항에 규정된 행위로 화재가 발생하였으나 형사책임을 추궁할 정도에 이르지 않은 경우에는 해당 과태료 금액의 두 배의 과태료를 부과한다.\n8. 추가 처벌:\n이 조 제6항에 규정된 위반행위에 대하여 06개월부터 12개월까지 영업(활동) 정지.\n9. 시정조치(결과 복구 조치):\na) 이 조 제1항에 규정된 위반행위에 대하여 자재, 화물, 교통수단, 물품, 그 밖의 장비를 소방(화재예방·진압) 이격거리가 확보되도록 이동하도록 강제;\nb) 이 조 제2항에 규정된 위반행위에 대하여 방화(구획) 부분을 유지하도록 강제;\nc) 이 조 제4항 a호에 규정된 위반행위에 대하여 소방(화재예방·진압) 이격거리를 유지하도록 강제;\nd) 이 조 제5항에 규정된 위반행위에 대하여 방화벽 또는 방화 칸막이벽 또는 방화 바닥을 설치하거나 유지하도록 강제.","o":[["Khoản 2 Điều 25 được sửa đổi, bổ sung bởi khoản 1 Điều 12 Nghị định số 69/2026/NĐ-CP","nd69-12"],["Khoản 4 Điều 25 được sửa đổi, bổ sung bởi khoản 2 Điều 12 Nghị định số 69/2026/NĐ-CP","nd69-12"],["Khoản 5 Điều 25 được sửa đổi, bổ sung bởi khoản 3 Điều 12 Nghị định số 69/2026/NĐ-CP","nd69-12"],["Khoản 8 Điều 25 được sửa đổi, bổ sung bởi khoản 4 Điều 12 Nghị định số 69/2026/NĐ-CP","nd69-12"],["Điểm b khoản 9 Điều 25 được sửa đổi, bổ sung bởi điểm a khoản 5 Điều 12 Nghị định số 69/2026/NĐ-CP","nd69-12"],["Điểm c khoản 9 Điều 25 được sửa đổi, bổ sung bởi điểm b khoản 5 Điều 12 Nghị định số 69/2026/NĐ-CP","nd69-12"],["Điểm d khoản 9 Điều 25 bị bãi bỏ bởi điểm c khoản 5 Điều 12 Nghị định số 69/2026/NĐ-CP","nd69-12"]]},{"id":"nd106-26","d":"nd106","n":"26","t":"Vi phạm quy định về xây dựng, phê duyệt và thực tập phương án chữa cháy, cứu nạn, cứu hộ","k":"화재진압·구조구난 계획(방안)의 수립, 승인 및 계획 훈련(실습)에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt tiền 3.000.000 đồng đến 5.000.000 đồng đối với một trong các hành vi sau đây:\na) Xây dựng phương án chữa cháy, cứu nạn, cứu hộ của cơ sở, phương tiện giao thông không bảo đảm nội dung theo quy định;\nb) Không cập nhật, bổ sung hoặc không chỉnh lý phương án chữa cháy, cứu nạn, cứu hộ của cơ sở, phương tiện giao thông;\nc) Không phê duyệt hoặc phê duyệt phương án chữa cháy, cứu nạn, cứu hộ của cơ sở, phương tiện giao thông không đúng thẩm quyền.\n2. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với một trong các hành vi sau đây:\na) Không thực tập hết các tình huống trong phương án chữa cháy, cứu nạn, cứu hộ của cơ sở, phương tiện giao thông;\nb) Không bố trí đủ lực lượng hoặc phương tiện thuộc phạm vi quản lý tham gia thực tập phương án chữa cháy, cứu nạn, cứu hộ của cơ quan Công an khi được người có thẩm quyền huy động.\n3. Phạt tiền từ 10.000.000 đồng đến 15.000.000 đồng đối với một trong các hành vi sau đây:\na) Không phối hợp xây dựng phương án chữa cháy, cứu nạn, cứu hộ của cơ quan Công an theo yêu cầu của cơ quan Công an có thẩm quyền;\nb) Không phối hợp tham gia thực tập phương án chữa cháy, cứu nạn, cứu hộ của cơ quan Công an theo yêu cầu của cơ quan Công an có thẩm quyền.\n4. Phạt tiền từ 15.000.000 đồng đến 20.000.000 đồng đối với hành vi không tổ chức thực tập phương án chữa cháy, cứu nạn, cứu hộ của cơ sở, phương tiện giao thông.\n5. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với hành vi không xây dựng phương án chữa cháy, cứu nạn, cứu hộ của cơ sở, phương tiện giao thông.","y":"1. 다음 각 행위 중 하나에 대하여 3.000.000동부터 5.000.000동까지의 과태료를 부과한다:\na) 사업장, 교통수단의 화재진압·구조구난 계획(방안)을 규정에 따른 내용을 갖추지 않고 수립하는 행위;\nb) 사업장, 교통수단의 화재진압·구조구난 계획(방안)을 갱신·보완하지 않거나 수정하지 않는 행위;\nc) 사업장, 교통수단의 화재진압·구조구난 계획(방안)을 승인하지 않거나 권한에 맞지 않게 승인하는 행위.\n2. 다음 각 행위 중 하나에 대하여 5.000.000동부터 10.000.000동까지의 과태료를 부과한다:\na) 사업장, 교통수단의 화재진압·구조구난 계획(방안)에 있는 상황 전부를 훈련(실습)하지 않는 행위;\nb) 권한 있는 자가 동원하였을 때 공안기관의 화재진압·구조구난 계획(방안) 훈련(실습)에 참가할 관리 범위 내의 인력 또는 장비를 충분히 배치하지 않는 행위.\n3. 다음 각 행위 중 하나에 대하여 10.000.000동부터 15.000.000동까지의 과태료를 부과한다:\na) 권한 있는 공안기관의 요구에 따른 공안기관의 화재진압·구조구난 계획(방안) 수립에 협조하지 않는 행위;\nb) 권한 있는 공안기관의 요구에 따른 공안기관의 화재진압·구조구난 계획(방안) 훈련(실습) 참가에 협조하지 않는 행위.\n4. 사업장, 교통수단의 화재진압·구조구난 계획(방안) 훈련(실습)을 실시하지 않는 행위에 대하여 15.000.000동부터 20.000.000동까지의 과태료를 부과한다.\n5. 사업장, 교통수단의 화재진압·구조구난 계획(방안)을 수립하지 않는 행위에 대하여 20.000.000동부터 25.000.000동까지의 과태료를 부과한다.","o":[]},{"id":"nd106-27","d":"nd106","n":"27","t":"Vi phạm quy định về chữa cháy, cứu nạn, cứu hộ","k":"화재진압, 구조·구난에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt cảnh cáo hoặc phạt tiền từ 500.000 đồng đến 1.000.000 đồng đối với hành vi tự ý vào khu vực chữa cháy, cứu nạn, cứu hộ khi không được phép của người có thẩm quyền.\n2. Phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với một trong các hành vi sau đây:\na) Không chấp hành mệnh lệnh hoặc quyết định huy động tham gia chữa cháy, cứu nạn, cứu hộ của người có thẩm quyền;\nb) Không tổ chức thực hiện khắc phục hậu quả vụ cháy trong điều kiện, khả năng cho phép.\n3. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với hành vi ngăn cản hoặc cản trở việc thông tin báo cháy, báo tình huống cứu nạn, cứu hộ.\n4. Phạt tiền từ 10.000.000 đồng đến 15.000.000 đồng đối với một trong các hành vi sau đây:\na) Lấn chiếm hoặc bố trí vật cản gây cản trở hoạt động của phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới;\nb) Cố ý báo cháy giả hoặc cố ý báo tình huống cứu nạn, cứu hộ giả;\nc) Không báo cháy hoặc không báo tình huống cứu nạn, cứu hộ.\n5. Phạt tiền từ 15.000.000 đồng đến 25.000.000 đồng đối với một trong các hành vi sau đây:\na) Cản trở lực lượng và phương tiện chữa cháy, cứu nạn, cứu hộ thực hiện chữa cháy, cứu nạn, cứu hộ;\nb) Lợi dụng việc tham gia chữa cháy, cứu nạn, cứu hộ để xâm phạm đến lợi ích của Nhà nước hoặc quyền, lợi ích hợp pháp của cơ quan, tổ chức, cá nhân.\n6. Phạt tiền từ 30.000.000 đồng đến 40.000.000 đồng đối với hành vi không duy trì đường giao thông cho phương tiện chữa cháy, cứu nạn, cứu hộ hoạt động.\n7. Biện pháp khắc phục hậu quả:\nBuộc duy trì đường giao thông cho phương tiện chữa cháy, cứu nạn, cứu hộ hoạt động đối với hành vi vi phạm quy định tại khoản 6 Điều này.","y":"1. 권한 있는 자의 허가 없이 화재진압, 구조·구난 구역에 임의로 들어가는 행위에 대하여 경고 또는 500.000동부터 1.000.000동까지의 과태료를 부과한다.\n2. 다음 각 행위 중 하나에 대하여 3.000.000동부터 5.000.000동까지의 과태료를 부과한다:\na) 권한 있는 자의 화재진압, 구조·구난 참가 동원 명령 또는 결정을 이행하지 않는 행위;\nb) 여건과 능력이 허용하는 범위에서 화재 사고의 결과 복구를 실시하지 않는 행위.\n3. 화재 신고, 구조·구난 상황 신고를 저지하거나 방해하는 행위에 대하여 5.000.000동부터 10.000.000동까지의 과태료를 부과한다.\n4. 다음 각 행위 중 하나에 대하여 10.000.000동부터 15.000.000동까지의 과태료를 부과한다:\na) 무단 점유하거나 장애물을 두어 화재진압, 구조·구난 기동 장비(차량)의 활동을 방해하는 행위;\nb) 고의로 허위 화재 신고를 하거나 고의로 허위 구조·구난 상황 신고를 하는 행위;\nc) 화재를 신고하지 않거나 구조·구난 상황을 신고하지 않는 행위.\n5. 다음 각 행위 중 하나에 대하여 15.000.000동부터 25.000.000동까지의 과태료를 부과한다:\na) 화재진압, 구조·구난 인력과 장비가 화재진압, 구조·구난을 수행하는 것을 방해하는 행위;\nb) 화재진압, 구조·구난 참가를 이용하여 국가의 이익 또는 기관, 조직, 개인의 적법한 권리·이익을 침해하는 행위.\n6. 화재진압, 구조·구난 장비(차량)가 활동할 수 있는 교통로를 유지하지 않는 행위에 대하여 30.000.000동부터 40.000.000동까지의 과태료를 부과한다.\n7. 시정조치(결과 복구 조치):\n이 조 제6항에 규정된 위반행위에 대하여 화재진압, 구조·구난 장비(차량)가 활동할 수 있는 교통로를 유지하도록 강제.","o":[]},{"id":"nd106-28","d":"nd106","n":"28","t":"Vi phạm quy định về hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy","k":"소방, 구조·구난 데이터베이스 및 화재 신호 전송 시스템에 관한 규정 위반","c":"제2장 행정위반 행위, 처벌 형식 및 시정조치","x":"1. Phạt cảnh cáo hoặc phạt tiền từ 500.000 đồng đến 1.000.000 đồng đối với một trong các hành vi sau đây:\na) Khai báo không đầy đủ thông tin của cơ sở vào hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy theo quy định;\nb) Khai báo không đầy đủ thông tin của phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ, vật liệu, cấu kiện ngăn cháy, chống cháy vào cơ sở dữ liệu của cơ quan quản lý chuyên ngành khi lưu thông phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ, vật liệu, cấu kiện ngăn cháy, chống cháy theo quy định.\n2. Phạt tiền từ 1.000.000 đồng đến 3.000.000 đồng đối với một trong các hành vi sau đây:\na) Không cập nhật thông tin khi cơ sở có thay đổi so với thông tin đã khai báo trước đó vào hệ thống Cơ sở dữ liệu về phòng cháy, cháy, cứu nạn, cứu hộ và truyền tin báo cháy;\nb) Không chi trả chi phí duy trì hoạt động của thiết bị truyền tin báo cháy để kết nối với hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy.\n3. Phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với hành vi không khai báo thông tin của phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ, vật liệu, cấu kiện ngăn cháy, chống cháy vào cơ sở dữ liệu của cơ quan quản lý chuyên ngành khi lưu thông phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ, vật liệu, cấu kiện ngăn cháy, chống cháy theo quy định.\n4. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với hành vi không khai báo thông tin của cơ sở vào hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy.\n5. Phạt tiền từ 10.000.000 đồng đến 15.000.000 đồng đối với hành vi cố ý ngắt kết nối hoặc không khắc phục các hư hỏng dẫn đến làm mất khả năng kết nối của thiết bị truyền tin báo cháy với hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy.\n6. Phạt tiền từ 20.000.000 đồng đến 30.000.000 đồng đối với một trong các hành vi sau đây:\na) Không trang bị, lắp đặt thiết bị truyền tin báo cháy;\nb) Không kết nối thiết bị truyền tin báo cháy với hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy theo quy định.","y":"1. 다음 각 행위 중 하나에 대하여 경고 또는 500.000동부터 1.000.000동까지의 과태료를 부과한다:\na) 규정에 따라 소방, 구조·구난 데이터베이스 및 화재 신호 전송 시스템에 사업장의 정보를 충분히 신고하지 않는 행위;\nb) 규정에 따라 소방 및 구조·구난 장비·설비, 방화·내화 자재·부재를 유통할 때 소방 및 구조·구난 장비·설비, 방화·내화 자재·부재의 정보를 전문 분야 관리기관의 데이터베이스에 충분히 신고하지 않는 행위.\n2. 다음 각 행위 중 하나에 대하여 1.000.000동부터 3.000.000동까지의 과태료를 부과한다:\na) 사업장에 이전에 신고한 정보와 비교하여 변경이 있을 때 소방, 구조·구난 데이터베이스 및 화재 신호 전송 시스템에 정보를 갱신하지 않는 행위;\nb) 소방, 구조·구난 데이터베이스 및 화재 신호 전송 시스템과 연결하기 위한 화재 신호 전송 장치의 작동 유지 비용을 지급하지 않는 행위.\n3. 규정에 따라 소방 및 구조·구난 장비·설비, 방화·내화 자재·부재를 유통할 때 소방 및 구조·구난 장비·설비, 방화·내화 자재·부재의 정보를 전문 분야 관리기관의 데이터베이스에 신고하지 않는 행위에 대하여 3.000.000동부터 5.000.000동까지의 과태료를 부과한다.\n4. 소방, 구조·구난 데이터베이스 및 화재 신호 전송 시스템에 사업장의 정보를 신고하지 않는 행위에 대하여 5.000.000동부터 10.000.000동까지의 과태료를 부과한다.\n5. 화재 신호 전송 장치와 소방, 구조·구난 데이터베이스 및 화재 신호 전송 시스템의 연결을 고의로 차단하거나, 연결 능력을 상실하게 하는 고장을 수리하지 않는 행위에 대하여 10.000.000동부터 15.000.000동까지의 과태료를 부과한다.\n6. 다음 각 행위 중 하나에 대하여 20.000.000동부터 30.000.000동까지의 과태료를 부과한다:\na) 화재 신호 전송 장치를 구비·설치하지 않는 행위;\nb) 규정에 따라 화재 신호 전송 장치를 소방, 구조·구난 데이터베이스 및 화재 신호 전송 시스템과 연결하지 않는 행위.","o":[]},{"id":"nd106-29","d":"nd106","n":"29","t":"Thẩm quyền lập biên bản vi phạm hành chính","k":"행정위반 조서 작성 권한","c":"제3장 조서 작성 및 행정위반 처벌 권한","x":"Người có thẩm quyền lập biên bản vi phạm hành chính đối với các hành vi vi phạm quy định tại Nghị định này bao gồm:\n1. Người có thẩm quyền xử phạt quy định tại các Điều 30, 31, 32, 33, 34, 35 và Điều 36 Nghị định này.\n2. Công chức, viên chức thuộc Ủy ban nhân dân các cấp, cơ quan chuyên môn về xây dựng, cơ quan đăng kiểm đang thi hành công vụ.","y":"이 시행령에 규정된 위반행위에 대하여 행정위반 조서를 작성할 권한이 있는 자는 다음을 포함한다:\n1. 이 시행령 제30조, 제31조, 제32조, 제33조, 제34조, 제35조 및 제36조에 규정된 처벌 권한이 있는 자.\n2. 공무 수행 중인 각급 인민위원회, 건설 전문기관, 등록검사기관 소속 공무원, 공공기관 직원(viên chức).","o":[["Điều 29 được sửa đổi, bổ sung bởi Điều 13 Nghị định số 69/2026/NĐ-CP","nd69-13"]]},{"id":"nd106-30","d":"nd106","n":"30","t":"Thẩm quyền xử phạt vi phạm hành chính của Chủ tịch Ủy ban nhân dân các cấp","k":"각급 인민위원회 위원장의 행정위반 처벌 권한","c":"제3장 조서 작성 및 행정위반 처벌 권한","x":"1. Chủ tịch Ủy ban nhân dân cấp xã có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 5.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a khoản 1 Điều 28 Luật Xử lý vi phạm hành chính.\n2. Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tước quyền sử dụng giấy phép là văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy;\nd) Tịch thu tang vật vi phạm hành chính;\nđ) Đình chỉ hoạt động có thời hạn;\ne) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.","y":"1. 사(면)급 인민위원회 위원장은 다음의 권한을 가진다:\na) 경고;\nb) 5.000.000동까지의 과태료 부과;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수;\nd) 「행정위반처리법」 제28조 제1항 a호에 규정된 시정조치(결과 복구 조치) 적용.\n2. 성, 중앙직할시 인민위원회 위원장은 다음의 권한을 가진다:\na) 경고;\nb) 50.000.000동까지의 과태료 부과;\nc) 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서인 허가증의 사용권 박탈;\nd) 행정위반 증거물 몰수;\nđ) 기한부 영업(활동) 정지;\ne) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.","o":[["khoản 1 Điều 30 được sửa đổi, bổ sung bởi Điều 14 Nghị định số 69/2026/NĐ-CP","nd69-14"]]},{"id":"nd106-31","d":"nd106","n":"31","t":"Thẩm quyền xử phạt vi phạm hành chính của Công an nhân dân","k":"인민공안의 행정위반 처벌 권한","c":"제3장 조서 작성 및 행정위반 처벌 권한","x":"1. Chiến sĩ Công an nhân dân đang thi hành công vụ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 500.000 đồng.\n2. Thủ trưởng đơn vị Cảnh sát cơ động cấp đại đội, Trưởng trạm, Đội trưởng của người được quy định tại khoản 1 Điều này có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 1.500.000 đồng.\n3. Trưởng Công an cấp xã, Trưởng đồn Công an, Trưởng trạm Công an cửa khẩu, khu chế xuất, Trưởng Công an cửa khẩu Cảng hàng không quốc tế, Tiểu đoàn trưởng Tiểu đoàn Cảnh sát cơ động, Thủy đội trưởng có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 2.500.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a khoản 1 Điều 28 Luật Xử lý vi phạm hành chính.\n4. Trưởng phòng nghiệp vụ thuộc Cục Cảnh sát quản lý hành chính về trật tự xã hội; Trưởng phòng nghiệp vụ thuộc Cục Cảnh sát giao thông; Trưởng phòng nghiệp vụ thuộc Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ; Trưởng phòng Công an cấp tỉnh gồm: Trưởng phòng Cảnh sát quản lý hành chính về trật tự xã hội, Trưởng phòng Cảnh sát giao thông, Trưởng phòng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ, Trưởng phòng Cảnh sát cơ động có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 10.000.000 đồng;\nc) Tước quyền sử dụng giấy phép là văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy;\nd) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nđ) Đình chỉ hoạt động có thời hạn;\ne) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.\n5. Giám đốc Công an cấp tỉnh có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 25.000.000 đồng;\nc) Tước quyền sử dụng giấy phép là văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy;\nd) Tịch thu tang vật vi phạm hành chính;\nđ) Đình chỉ hoạt động có thời hạn;\ne) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.\n6. Cục trưởng Cục Cảnh sát quản lý hành chính về trật tự xã hội, Cục trưởng Cục Cảnh sát giao thông, Cục trưởng Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tước quyền sử dụng giấy phép là văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy;\nd) Tịch thu tang vật vi phạm hành chính;\nđ) Đình chỉ hoạt động có thời hạn;\ne) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.","y":"1. 공무 수행 중인 인민공안 전사는 다음의 권한을 가진다:\na) 경고;\nb) 500.000동까지의 과태료 부과.\n2. 중대급 기동경찰 부대의 장, 이 조 제1항에 규정된 자의 초소장, 대장은 다음의 권한을 가진다:\na) 경고;\nb) 1.500.000동까지의 과태료 부과.\n3. 사(면)급 공안장, 공안 주재소장, 국경검문소·수출가공구 공안 초소장, 국제공항 국경검문소 공안장, 기동경찰 대대의 대대장, 수상대장은 다음의 권한을 가진다:\na) 경고;\nb) 2.500.000동까지의 과태료 부과;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수;\nd) 「행정위반처리법」 제28조 제1항 a호에 규정된 시정조치(결과 복구 조치) 적용.\n4. 사회질서 행정관리 경찰국 소속 업무과장; 교통경찰국 소속 업무과장; 소방·구조구난 경찰국 소속 업무과장; 다음을 포함하는 성급 공안의 과장: 사회질서 행정관리 경찰과장, 교통경찰과장, 소방·구조구난 경찰과장, 기동경찰과장은 다음의 권한을 가진다:\na) 경고;\nb) 10.000.000동까지의 과태료 부과;\nc) 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서인 허가증의 사용권 박탈;\nd) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수;\nđ) 기한부 영업(활동) 정지;\ne) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.\n5. 성급 공안 청장(Giám đốc)은 다음의 권한을 가진다:\na) 경고;\nb) 25.000.000동까지의 과태료 부과;\nc) 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서인 허가증의 사용권 박탈;\nd) 행정위반 증거물 몰수;\nđ) 기한부 영업(활동) 정지;\ne) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.\n6. 사회질서 행정관리 경찰국장, 교통경찰국장, 소방·구조구난 경찰국장은 다음의 권한을 가진다:\na) 경고;\nb) 50.000.000동까지의 과태료 부과;\nc) 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서인 허가증의 사용권 박탈;\nd) 행정위반 증거물 몰수;\nđ) 기한부 영업(활동) 정지;\ne) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.","o":[["Điều 31 được sửa đổi, bổ sung bởi Điều 15 Nghị định số 69/2026/NĐ-CP","nd69-15"]]},{"id":"nd106-32","d":"nd106","n":"32","t":"Thẩm quyền xử phạt vi phạm hành chính của Bộ đội biên phòng","k":"국경수비대의 행정위반 처벌 권한","c":"제3장 조서 작성 및 행정위반 처벌 권한","x":"1. Chiến sĩ Bộ đội biên phòng đang thi hành công vụ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 500.000 đồng.\n2. Trạm trưởng, Đội trưởng của người được quy định tại khoản 1 Điều này có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 2.500.000 đồng.\n3. Đội trưởng Đội đặc nhiệm phòng chống ma túy và tội phạm thuộc Đoàn đặc nhiệm phòng chống ma túy và tội phạm có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 5.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a khoản 3 Điều 3 Nghị định này.\n4. Đồn trưởng Đồn biên phòng, Hải đội trưởng Hải đội biên phòng, Chỉ huy trưởng Ban chỉ huy biên phòng Cửa khẩu cảng có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 10.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.\n5. Đoàn trưởng Đoàn đặc nhiệm phòng chống ma túy và tội phạm thuộc Cục Phòng chống ma túy và tội phạm thuộc Bộ Tư lệnh Bộ đội biên phòng có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 25.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.\n6. Chỉ huy trưởng Bộ đội Biên phòng cấp tỉnh, Hải đoàn trưởng Hải đoàn biên phòng, Cục trưởng Cục Phòng chống ma túy và tội phạm thuộc Bộ Tư lệnh Bộ đội biên phòng có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tước quyền sử dụng giấy phép là văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy;\nd) Tịch thu tang vật vi phạm hành chính;\nđ) Đình chỉ hoạt động có thời hạn;\ne) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.","y":"1. 공무 수행 중인 국경수비대 전사는 다음의 권한을 가진다:\na) 경고;\nb) 500.000동까지의 과태료 부과.\n2. 이 조 제1항에 규정된 자의 초소장, 대장은 다음의 권한을 가진다:\na) 경고;\nb) 2.500.000동까지의 과태료 부과.\n3. 마약·범죄 방지 특수임무단 소속 마약·범죄 방지 특수임무대의 대장은 다음의 권한을 가진다:\na) 경고;\nb) 5.000.000동까지의 과태료 부과;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수;\nd) 이 시행령 제3조 제3항 a호에 규정된 시정조치(결과 복구 조치) 적용.\n4. 국경수비 주둔소(Đồn biên phòng)의 소장, 국경수비 해상대(Hải đội)의 대장, 항만 국경검문소 국경수비 지휘부의 지휘장은 다음의 권한을 가진다:\na) 경고;\nb) 10.000.000동까지의 과태료 부과;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수;\nd) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.\n5. 국경수비대 사령부 소속 마약·범죄 방지국 소속 마약·범죄 방지 특수임무단의 단장은 다음의 권한을 가진다:\na) 경고;\nb) 25.000.000동까지의 과태료 부과;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수;\nd) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.\n6. 성급 국경수비대 지휘장, 국경수비 해상단(Hải đoàn)의 단장, 국경수비대 사령부 소속 마약·범죄 방지국의 국장은 다음의 권한을 가진다:\na) 경고;\nb) 50.000.000동까지의 과태료 부과;\nc) 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서인 허가증의 사용권 박탈;\nd) 행정위반 증거물 몰수;\nđ) 기한부 영업(활동) 정지;\ne) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.","o":[["Điều 32 được sửa đổi, bổ sung bởi Điều 16 Nghị định số 69/2026/NĐ-CP","nd69-16"]]},{"id":"nd106-33","d":"nd106","n":"33","t":"Thẩm quyền xử phạt vi phạm hành chính của Kiểm lâm","k":"산림감시(Kiểm lâm)의 행정위반 처벌 권한","c":"제3장 조서 작성 및 행정위반 처벌 권한","x":"1. Kiểm lâm viên đang thi hành công vụ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 500.000 đồng.\n2. Trạm trưởng Trạm Lâm nghiệp và Kiểm lâm có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 10.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này.\n3. Hạt trưởng Hạt Lâm nghiệp và Kiểm lâm, Đội trưởng Đội Kiểm lâm cơ động và phòng cháy, chữa cháy rừng có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 25.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.\n4. Chi cục trưởng Chi cục Lâm nghiệp và Kiểm lâm, Chi cục trưởng Chi cục Lâm nghiệp và Kiểm lâm vùng, Đội trưởng Đội Kiểm lâm đặc nhiệm thuộc Cục Lâm nghiệp và Kiểm lâm có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.\n5. Cục trưởng Cục Lâm nghiệp và Kiểm lâm có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.","y":"1. 공무 수행 중인 산림감시원은 다음의 권한을 가진다:\na) 경고;\nb) 500.000동까지의 과태료 부과.\n2. 임업·산림감시 초소(Trạm)의 초소장은 다음의 권한을 가진다:\na) 경고;\nb) 10.000.000동까지의 과태료 부과;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수.\n3. 임업·산림감시 지소(Hạt)의 지소장, 기동 산림감시 및 산림 화재예방·진압대의 대장은 다음의 권한을 가진다:\na) 경고;\nb) 25.000.000동까지의 과태료 부과;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수;\nd) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.\n4. 임업·산림감시 지국(Chi cục)의 지국장, 권역 임업·산림감시 지국의 지국장, 임업·산림감시국 소속 산림감시 특수임무대의 대장은 다음의 권한을 가진다:\na) 경고;\nb) 50.000.000동까지의 과태료 부과;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수;\nd) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.\n5. 임업·산림감시국의 국장은 다음의 권한을 가진다:\na) 경고;\nb) 50.000.000동까지의 과태료 부과;\nc) 행정위반 증거물 몰수;\nd) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.","o":[["Điều 33 được sửa đổi, bổ sung bởi Điều 17 Nghị định số 69/2026/NĐ-CP","nd69-17"]]},{"id":"nd106-34","d":"nd106","n":"34","t":"Thẩm quyền xử phạt vi phạm hành chính của Kiểm ngư","k":"어업감시(Kiểm ngư)의 행정위반 처벌 권한","c":"제3장 조서 작성 및 행정위반 처벌 권한","x":"1. Kiểm ngư viên đang thi hành công vụ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 2.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này.\n2. Trạm trưởng Trạm Kiểm ngư thuộc Chi cục Thủy sản và Kiểm ngư vùng có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 10.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại các điểm a khoản 3 Điều 3 Nghị định này.\n3. Chi cục trưởng Chi cục Thủy sản và Kiểm ngư vùng có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.\n4. Cục trưởng Cục Thủy sản và Kiểm ngư có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Đình chỉ hoạt động có thời hạn;\nd) Tịch thu tang vật vi phạm hành chính;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.","y":"1. 공무 수행 중인 어업감시원은 다음의 권한을 가진다:\na) 경고;\nb) 2.000.000동까지의 과태료 부과;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수.\n2. 권역 수산·어업감시 지국(Chi cục) 소속 어업감시 초소(Trạm)의 초소장은 다음의 권한을 가진다:\na) 경고;\nb) 10.000.000동까지의 과태료 부과;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수;\nd) 이 시행령 제3조 제3항 a호에 규정된 시정조치(결과 복구 조치) 적용.\n3. 권역 수산·어업감시 지국의 지국장은 다음의 권한을 가진다:\na) 경고;\nb) 50.000.000동까지의 과태료 부과;\nc) 행정위반 증거물 몰수;\nd) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.\n4. 수산·어업감시국의 국장은 다음의 권한을 가진다:\na) 경고;\nb) 50.000.000동까지의 과태료 부과;\nc) 기한부 영업(활동) 정지;\nd) 행정위반 증거물 몰수;\nđ) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.","o":[["Điều 34 được sửa đổi, bổ sung bởi Điều 18 Nghị định số 69/2026/NĐ-CP","nd69-18"]]},{"id":"nd106-35","d":"nd106","n":"35","t":"Thẩm quyền xử phạt vi phạm hành chính của Cảnh sát biển","k":"해양경찰의 행정위반 처벌 권한","c":"제3장 조서 작성 및 행정위반 처벌 권한","x":"1. Cảnh sát viên Cảnh sát biển đang thi hành công vụ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 1.000.000 đồng.\n2. Tổ trưởng Tổ nghiệp vụ Cảnh sát biển có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 2.500.000 đồng.\n3. Đội trưởng Đội nghiệp vụ Cảnh sát biển, Trạm trưởng Trạm Cảnh sát biển có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 5.000.000 đồng;\nc) Áp dụng biện pháp khắc phục hậu quả quy định tại các điểm a khoản 3 Điều 3 Nghị định này.\n4. Hải đội trưởng Hải đội Cảnh sát biển có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 10.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.\n5. Hải đoàn trưởng Hải đoàn Cảnh sát biển; Đoàn trưởng Đoàn trinh sát, Đoàn trưởng Đoàn đặc nhiệm phòng chống tội phạm ma túy thuộc Bộ Tư lệnh Cảnh sát biển Việt Nam có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 15.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.\n6. Tư lệnh Vùng Cảnh sát biển, Cục trưởng Cục Nghiệp vụ và Pháp luật thuộc Bộ Tư lệnh Cảnh sát biển Việt Nam có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 25.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.\n7. Tư lệnh Cảnh sát biển Việt Nam có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.","y":"1. 공무 수행 중인 해양경찰 경찰관은 다음의 권한을 가진다:\na) 경고;\nb) 1.000.000동까지의 과태료 부과.\n2. 해양경찰 업무조(Tổ)의 조장은 다음의 권한을 가진다:\na) 경고;\nb) 2.500.000동까지의 과태료 부과.\n3. 해양경찰 업무대(Đội)의 대장, 해양경찰 초소(Trạm)의 초소장은 다음의 권한을 가진다:\na) 경고;\nb) 5.000.000동까지의 과태료 부과;\nc) 이 시행령 제3조 제3항 a호에 규정된 시정조치(결과 복구 조치) 적용.\n4. 해양경찰 해상대(Hải đội)의 대장은 다음의 권한을 가진다:\na) 경고;\nb) 10.000.000동까지의 과태료 부과;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수;\nd) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.\n5. 해양경찰 해상단(Hải đoàn)의 단장; 베트남 해양경찰 사령부 소속 정찰단의 단장, 마약범죄 방지 특수임무단의 단장은 다음의 권한을 가진다:\na) 경고;\nb) 15.000.000동까지의 과태료 부과;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수;\nd) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.\n6. 해양경찰 권역(Vùng) 사령관, 베트남 해양경찰 사령부 소속 업무·법률국의 국장은 다음의 권한을 가진다:\na) 경고;\nb) 25.000.000동까지의 과태료 부과;\nc) 행정위반 증거물 몰수;\nd) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.\n7. 베트남 해양경찰 사령관은 다음의 권한을 가진다:\na) 경고;\nb) 50.000.000동까지의 과태료 부과;\nc) 행정위반 증거물 몰수;\nd) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.","o":[["Điều 35 được sửa đổi, bổ sung bởi Điều 19 Nghị định số 69/2026/NĐ-CP","nd69-19"]]},{"id":"nd106-36","d":"nd106","n":"36","t":"Thẩm quyền xử phạt vi phạm hành chính của Thanh tra","k":"감찰(Thanh tra)의 행정위반 처벌 권한","c":"제3장 조서 작성 및 행정위반 처벌 권한","x":"1. Thanh tra viên, người được giao thực hiện nhiệm vụ thanh tra đang thi hành công vụ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 500.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n2. Chánh Thanh tra Cục Cảnh sát Phòng cháy, chữa cháy và cứu nạn, cứu hộ; Chánh Thanh tra Công an tỉnh, thành phố trực thuộc trung ương có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 10.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Đình chỉ hoạt động có thời hạn;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.\n3. Chánh Thanh tra tỉnh có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 35.000.000 đồng;\nc) Tước quyền sử dụng giấy phép là văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy;\nd) Tịch thu tang vật vi phạm hành chính;\nđ) Đình chỉ hoạt động có thời hạn;\ne) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.\n4. Chánh Thanh tra bộ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tước quyền sử dụng giấy phép là văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy;\nd) Tịch thu tang vật vi phạm hành chính;\nđ) Đình chỉ hoạt động có thời hạn;\ne) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.\nBổ sung","y":"1. 공무 수행 중인 감찰관, 감찰 임무 수행을 부여받은 자는 다음의 권한을 가진다:\na) 경고;\nb) 500.000동까지의 과태료 부과;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수;\nd) 「행정위반처리법」 제28조 제1항 a호에 규정된 시정조치(결과 복구 조치) 적용.\n2. 소방·구조구난 경찰국의 감찰실장(Chánh Thanh tra); 성, 중앙직할시 공안의 감찰실장은 다음의 권한을 가진다:\na) 경고;\nb) 10.000.000동까지의 과태료 부과;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 않는 행정위반 증거물 몰수;\nd) 기한부 영업(활동) 정지;\nđ) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.\n3. 성 감찰원장(Chánh Thanh tra tỉnh)은 다음의 권한을 가진다:\na) 경고;\nb) 35.000.000동까지의 과태료 부과;\nc) 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서인 허가증의 사용권 박탈;\nd) 행정위반 증거물 몰수;\nđ) 기한부 영업(활동) 정지;\ne) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.\n4. 부(部) 감찰원장(Chánh Thanh tra bộ)은 다음의 권한을 가진다:\na) 경고;\nb) 50.000.000동까지의 과태료 부과;\nc) 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서인 허가증의 사용권 박탈;\nd) 행정위반 증거물 몰수;\nđ) 기한부 영업(활동) 정지;\ne) 이 시행령 제3조 제3항에 규정된 시정조치(결과 복구 조치) 적용.\n(신설)","o":[["Điều 36 được sửa đổi, bổ sung bởi Điều 20 Nghị định số 69/2026/NĐ-CP","nd69-20"],["Điều 36a được bổ sung bởi Điều 21 Nghị định số 69/2026/NĐ-CP","nd69-21"]]},{"id":"nd106-37","d":"nd106","n":"37","t":"Phân định thẩm quyền xử phạt vi phạm hành chính","k":"행정위반 처벌 권한의 구분","c":"제3장 조서 작성 및 행정위반 처벌 권한","x":"1. Chủ tịch Ủy ban nhân dân các cấp có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định từ Điều 6 đến Điều 28 Nghị định này theo thẩm quyền quy định tại Điều 30 Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.\n2. Người có thẩm quyền xử phạt của Công an nhân dân có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định từ Điều 6 đến Điều 28 Nghị định này theo thẩm quyền quy định tại Điều 31 Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.\n3. Người có thẩm quyền xử phạt của Bộ đội biên phòng có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại các Điều 7, 14, 15, 16, 21; tại các điểm a, c khoản 1, điểm a, c khoản 2 Điều 20 Nghị định này theo thẩm quyền quy định tại Điều 32 Nghị định này trong phạm vi, lĩnh vực mình quản lý và chức năng, nhiệm vụ, quyền hạn được giao.\n4. Người có thẩm quyền xử phạt của Kiểm lâm có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại Điều 6, 7, 10, 11, 20, 21, 22, 25 và Điều 27 Nghị định này theo thẩm quyền quy định tại Điều 33 Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.\n5. Người có thẩm quyền xử phạt của Kiểm ngư có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại Điều 11, 16, 20, 21 và Điều 22 Nghị định này theo thẩm quyền quy định tại Điều 34 Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.\n6. Người có thẩm quyền xử phạt của Cảnh sát biển có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại Điều 16 Nghị định này theo thẩm quyền quy định tại Điều 35 Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.\n7. Người có thẩm quyền xử phạt của Thanh tra có thẩm quyền xử phạt vi phạm hành chính đối với các hành vi vi phạm quy định từ Điều 6 đến Điều 28 Nghị định này theo thẩm quyền quy định tại Điều 36 Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.\n8. Việc phối hợp giữa các cơ quan khi xử phạt vi phạm hành chính trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ thực hiện theo quy định tại Điều 52 Luật Xử lý vi phạm hành chính.\nBổ sung\nBổ sung\nBổ sung\nBổ sung","y":"1. 각급 인민위원회 위원장은 이 시행령 제30조에 규정된 권한 및 부여받은 기능, 임무, 권한에 따라 이 시행령 제6조부터 제28조까지에 규정된 행정위반 행위에 대하여 행정위반을 처벌하고 시정조치(결과 복구 조치)를 적용할 권한을 가진다.\n2. 인민공안의 처벌 권한이 있는 자는 이 시행령 제31조에 규정된 권한 및 부여받은 기능, 임무, 권한에 따라 이 시행령 제6조부터 제28조까지에 규정된 행정위반 행위에 대하여 행정위반을 처벌하고 시정조치(결과 복구 조치)를 적용할 권한을 가진다.\n3. 국경수비대의 처벌 권한이 있는 자는 자신이 관리하는 범위·분야 안에서 이 시행령 제32조에 규정된 권한 및 부여받은 기능, 임무, 권한에 따라 이 시행령 제7조, 제14조, 제15조, 제16조, 제21조; 제20조 제1항 a호, c호, 제2항 a호, c호에 규정된 행정위반 행위에 대하여 행정위반을 처벌하고 시정조치(결과 복구 조치)를 적용할 권한을 가진다.\n4. 산림감시(Kiểm lâm)의 처벌 권한이 있는 자는 이 시행령 제33조에 규정된 권한 및 부여받은 기능, 임무, 권한에 따라 이 시행령 제6조, 제7조, 제10조, 제11조, 제20조, 제21조, 제22조, 제25조 및 제27조에 규정된 행정위반 행위에 대하여 행정위반을 처벌하고 시정조치(결과 복구 조치)를 적용할 권한을 가진다.\n5. 어업감시(Kiểm ngư)의 처벌 권한이 있는 자는 이 시행령 제34조에 규정된 권한 및 부여받은 기능, 임무, 권한에 따라 이 시행령 제11조, 제16조, 제20조, 제21조 및 제22조에 규정된 행정위반 행위에 대하여 행정위반을 처벌하고 시정조치(결과 복구 조치)를 적용할 권한을 가진다.\n6. 해양경찰의 처벌 권한이 있는 자는 이 시행령 제35조에 규정된 권한 및 부여받은 기능, 임무, 권한에 따라 이 시행령 제16조에 규정된 행정위반 행위에 대하여 행정위반을 처벌하고 시정조치(결과 복구 조치)를 적용할 권한을 가진다.\n7. 감찰(Thanh tra)의 처벌 권한이 있는 자는 이 시행령 제36조에 규정된 권한 및 부여받은 기능, 임무, 권한에 따라 이 시행령 제6조부터 제28조까지에 규정된 위반행위에 대하여 행정위반을 처벌할 권한을 가진다.\n8. 소방 및 구조·구난 분야의 행정위반을 처벌할 때 기관 간의 협조는 「행정위반처리법」 제52조의 규정에 따라 실시한다.\n(신설)\n(신설)\n(신설)\n(신설)","o":[["Khoản 9 Điều 37 được bổ sung bởi khoản 3 Điều 22 Nghị định số 69/2026/NĐ-CP","nd69-22"],["Khoản 10 Điều 37 được bổ sung bởi khoản 4 Điều 22 Nghị định số 69/2026/NĐ-CP","nd69-22"],["Khoản 11 Điều 37 được bổ sung bởi khoản 5 Điều 22 Nghị định số 69/2026/NĐ-CP","nd69-22"],["Khoản 12 Điều 37 được bổ sung bởi khoản 6 Điều 22 Nghị định số 69/2026/NĐ-CP","nd69-22"],["Khoản 3 Điều 37 được sửa đổi, bổ sung bởi khoản 1 Điều 22 Nghị định số 69/2026/NĐ-CP","nd69-22"],["khoản 8 Điều 37 bị bãi bỏ bởi khoản 2 Điều 22 Nghị định số 69/2026/NĐ-CP","nd69-22"]]},{"id":"nd106-38","d":"nd106","n":"38","t":"Sửa đổi, bổ sung một số điều của Nghị định số 119/2017/NĐ-CP ngày 01 tháng 11 năm 2017 của Chính phủ quy định về xử phạt vi phạm hành chính trong lĩnh vực tiêu chuẩn, đo lường và chất lượng sản phẩm, hàng hóa (đã được sửa đổi, bổ sung bằng Nghị định số 126/2021/NĐ-CP ngày 30 tháng 12 năm 2021 của Chính phủ sửa đổi, bổ sung một số điều của các Nghị định quy định xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp; tiêu chuẩn, đo lường và chất lượng sản phẩm, hàng hóa, hoạt động khoa học và công nghệ, chuyển giao công nghệ, năng lượng nguyên tử)","k":"표준, 계량 및 제품·상품 품질 분야의 행정위반 처벌을 규정하는 2017년 11월 01일자 정부 시행령 119/2017/NĐ-CP(산업재산권; 표준, 계량 및 제품·상품 품질, 과학기술 활동, 기술이전, 원자력 분야의 행정위반 처벌을 규정하는 시행령들의 일부 조항을 개정·보완하는 2021년 12월 30일자 정부 시행령 126/2021/NĐ-CP로 개정·보완됨)의 일부 조항 개정·보완","c":"제4장 시행 조항","x":"1. Sửa đổi, bổ sung khoản 4 Điều 36 như sau:\n“4. Trưởng phòng nghiệp vụ thuộc Cục Cảnh sát giao thông; Trưởng phòng nghiệp vụ thuộc Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ; Trưởng phòng Công an cấp tỉnh gồm: Trưởng phòng Cảnh sát quản lý hành chính về trật tự xã hội, Trưởng phòng Cảnh sát điều tra tội phạm về trật tự xã hội, Trưởng phòng Cảnh sát điều tra tội phạm về tham nhũng, kinh tế, buôn lậu và mô trưởng, Trưởng phòng Cảnh sát điều tra tội phạm về ma túy, Trưởng phòng Cảnh sát giao thông, Trưởng phòng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ, Trưởng phòng An ninh chính trị nội bộ, Trưởng phòng An ninh kinh tế có quyền:”.\n2. Sửa đổi, bổ sung khoản 6 Đi
