ều 36 như sau:\n“6. Cục trưởng Cục An ninh chính trị nội bộ, Cục trưởng Cục An ninh kinh tế, Cục trưởng Cục Cảnh sát quản lý hành chính về trật tự xã hội, Cục trưởng Cục Cảnh sát điều tra tội phạm về trật tự xã hội, Cục trưởng Cục Cảnh sát điều tra tội phạm về tham nhũng, kinh tế, buôn lậu, Cục trưởng Cục Cảnh sát điều tra tội phạm về ma túy, Cục trưởng Cục Cảnh sát giao thông, Cục trưởng Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ, Cục trưởng Cục Cảnh sát phòng, chống tội phạm về môi trường, Cục trưởng Cục An ninh mạng và phòng, chống tội phạm sử dụng công nghệ cao, Cục trưởng Cục Quản lý xuất nhập cảnh có quyền:”.","y":"1. 제36조 제4항을 다음과 같이 개정·보완한다:\n“4. 교통경찰국 소속 업무과장; 소방·구조구난 경찰국 소속 업무과장; 다음을 포함하는 성급 공안의 과장: 사회질서 행정관리 경찰과장, 사회질서 범죄 수사 경찰과장, 부패·경제·밀수 및 환경 범죄 수사 경찰과장, 마약 범죄 수사 경찰과장, 교통경찰과장, 소방·구조구난 경찰과장, 내부 정치 안보과장, 경제 안보과장은 다음의 권한을 가진다:”.\n2. 제36조 제6항을 다음과 같이 개정·보완한다:\n“6. 내부 정치 안보국장, 경제 안보국장, 사회질서 행정관리 경찰국장, 사회질서 범죄 수사 경찰국장, 부패·경제·밀수 범죄 수사 경찰국장, 마약 범죄 수사 경찰국장, 교통경찰국장, 소방·구조구난 경찰국장, 환경 범죄 예방·단속 경찰국장, 사이버 안보 및 첨단기술 이용 범죄 예방·단속국장, 출입국 관리국장은 다음의 권한을 가진다:”.","o":[]},{"id":"nd106-39","d":"nd106","n":"39","t":"Hiệu lực thi hành","k":"시행일(효력)","c":"제4장 시행 조항","x":"1. Nghị định này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2025.\n2. Bãi bỏ mục 3 của Chương II Nghị định số 144/2021/NĐ-CP ngày 31 tháng 12 năm 2021 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực an ninh, trật tự, an toàn xã hội; phòng, chống tệ nạn xã hội; phòng cháy và chữa cháy; cứu nạn, cứu hộ; phòng, chống bạo lực gia đình.","y":"1. 이 시행령은 2025년 7월 01일부터 시행한다.\n2. 안보, 질서, 사회안전; 사회악 예방·단속; 소방(화재예방·진압); 구조·구난; 가정폭력 예방·단속 분야의 행정위반 처벌을 규정하는 2021년 12월 31일자 정부 시행령 144/2021/NĐ-CP 제2장 제3절을 폐지한다.","o":[]},{"id":"nd106-40","d":"nd106","n":"40","t":"Điều khoản chuyển tiếp","k":"경과 규정","c":"제4장 시행 조항","x":"1. Đối với hành vi vi phạm hành chính trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ xảy ra và kết thúc trước thời điểm Nghị định này có hiệu lực mà bị phát hiện nhưng chưa hết thời hiệu xử phạt hoặc đang xem xét, giải quyết khi Nghị định này đã có hiệu lực thì áp dụng Nghị định của Chính phủ về xử phạt vi phạm hành chính có hiệu lực tại thời điểm thực hiện hành vi vi phạm để xử lý.\nĐối với hành vi vi phạm hành chính trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ xảy ra trước thời điểm Nghị định này có hiệu lực nhưng vẫn đang diễn ra khi Nghị định này đã có hiệu lực thì áp dụng quy định của Nghị định này để xử lý.\n2. Đối với quyết định xử phạt vi phạm hành chính đã được ban hành hoặc đã được thi hành xong trước thời điểm Nghị định này có hiệu lực thi hành, mà cá nhân, tổ chức bị xử phạt vi phạm hành chính còn khiếu nại thì áp dụng quy định về xử phạt vi phạm hành chính tại thời điểm ban hành quyết định xử phạt để giải quyết.","y":"1. 이 시행령의 시행 시점 이전에 발생하여 종료된 소방 및 구조·구난 분야의 행정위반 행위가 적발되었으나 처벌 시효가 만료되지 않았거나, 이 시행령이 시행된 때에 심의·처리 중인 경우에는 위반행위를 한 시점에 효력이 있는 행정위반 처벌에 관한 정부 시행령을 적용하여 처리한다.\n이 시행령의 시행 시점 이전에 발생하였으나 이 시행령이 시행된 때에도 계속 진행 중인 소방 및 구조·구난 분야의 행정위반 행위에 대하여는 이 시행령의 규정을 적용하여 처리한다.\n2. 이 시행령의 시행 시점 이전에 이미 발령되었거나 집행이 완료된 행정위반 처벌 결정에 대하여 행정위반 처벌을 받은 개인, 조직이 여전히 이의를 제기하는 경우에는 처벌 결정을 발령한 시점의 행정위반 처벌에 관한 규정을 적용하여 해결한다.","o":[]},{"id":"nd106-41","d":"nd106","n":"41","t":"Trách nhiệm thi hành","k":"시행 책임","c":"제4장 시행 조항","x":"Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương chịu trách nhiệm thi hành Nghị định này","y":"각 부 장관, 부급 기관의 장, 정부 소속 기관의 장, 성, 중앙직할시 인민위원회 위원장은 이 시행령을 시행할 책임을 진다","o":[]},{"id":"nd69-1","d":"nd69","n":"1","t":"Sửa đổi, bổ sung điểm i khoản 2 Điều 2 như sau:","k":"제2조 제2항 i호를 다음과 같이 개정·보충한다:","c":"","x":"“i) Tổ chức được giao trực tiếp quản lý cơ sở, tổ chức hoạt động trong phạm vi một cơ sở theo quy định của pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ;”.","y":"“i) 소방 및 구조·구난에 관한 법령의 규정에 따라 사업장을 직접 관리하도록 위임받은 조직, 하나의 사업장 범위 내에서 활동하는 조직;”.","o":[]},{"id":"nd69-2","d":"nd69","n":"2","t":"Bổ sung các khoản 6,7 và khoản 8 vào sau khoản 5 Điều 3 như sau:","k":"제3조 제5항 다음에 제6항, 제7항 및 제8항을 다음과 같이 추가한다:","c":"","x":"1. Bổ sung khoản 6\n“6. Tổ chức, cá nhân vi phạm hành chính nhiều lần đối với một hành vi vi phạm trong một cơ sở thuộc diện quản lý về phòng cháy, chữa cháy thì không bị xử phạt từng hành vi vi phạm hành chính mà xử phạt một hành vi vi phạm hành chính áp dụng tình tiết tăng nặng.”.\n2. Bổ sung khoản 7\n“7. Tổ chức hoạt động trong phạm vi một cơ sở, tổ chức, cá nhân thuê, mượn, ở nhờ nhà ở sẽ bị xử phạt đối với các hành vi vi phạm hành chính quy định tại Nghị định này tương ứng với trách nhiệm của tổ chức hoạt động trong phạm vi một cơ sở, tổ chức, cá nhân thuê, mượn, ở nhờ nhà ở theo quy định của pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ.”.\n3. Bổ sung khoản 8\n“8. Việc xử lý vi phạm hành chính trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ theo Nghị định này trên môi trường điện tử được áp dụng theo quy định tại Điều 28a và Điều 28b Nghị định số 118/2021/NĐ-CP ngày 23 tháng 12 năm 2021 của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật Xử lý vi phạm hành chính (được sửa đổi, bổ sung tại Nghị định số 190/2025/NĐ-CP ngày 01 tháng 7 năm 2025 của Chính phủ).”.","y":"1. 제6항 추가\n“6. 조직·개인이 하나의 소방 관리 대상 사업장에서 하나의 위반행위에 대하여 여러 차례 행정위반을 한 경우에는 각 행정위반 행위별로 처벌하지 아니하고 가중 사유를 적용하여 하나의 행정위반 행위로 처벌한다.”.\n2. 제7항 추가\n“7. 하나의 사업장 범위 내에서 활동하는 조직, 주택을 임차·차용·무상 거주하는 조직·개인은 소방 및 구조·구난에 관한 법령의 규정에 따른 하나의 사업장 범위 내에서 활동하는 조직, 주택을 임차·차용·무상 거주하는 조직·개인의 책임에 상응하여 이 시행령에 규정된 행정위반 행위에 대하여 처벌받는다.”.\n3. 제8항 추가\n“8. 이 시행령에 따른 소방 및 구조·구난 분야의 행정위반 처리를 전자 환경에서 하는 것은 「행정위반처리법」의 일부 조항 및 시행 조치를 상세히 규정하는 정부의 2021년 12월 23일자 시행령 118/2021/NĐ-CP(정부의 2025년 7월 01일자 시행령 190/2025/NĐ-CP에서 개정·보충됨) 제28a조 및 제28b조의 규정에 따라 적용한다.”.","o":[]},{"id":"nd69-3","d":"nd69","n":"3","t":"Sửa đổi, bổ sung khoản 4 Điều 5 như sau:","k":"제5조 제4항을 다음과 같이 개정·보충한다:","c":"","x":"“4. Thời điểm chấm dứt hành vi vi phạm được xác định như sau:\na) Thời điểm chấm dứt hành vi vi phạm để tính thời hiệu xử phạt vi phạm hành chính đối với hành vi quy định tại khoản 3 và khoản 4 Điều 6 Nghị định này được tính từ ngày cơ quan, đơn vị có thẩm quyền ra văn bản thông báo kết quả huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định;\nb) Thời điểm chấm dứt hành vi vi phạm để tính thời hiệu xử phạt vi phạm hành chính đối với hành vi quy định tại khoản 1 và khoản 2 Điều 18 Nghị định này được tính từ ngày cơ quan quản lý chuyên ngành ra văn bản thẩm định thiết kế về phòng cháy và chữa cháy theo quy định;\nc) Thời điểm chấm dứt hành vi vi phạm để tính thời hiệu xử phạt vi phạm hành chính đối với hành vi quy định tại khoản 3 và khoản 4 Điều 18 Nghị định này được tính từ ngày cơ quan quản lý chuyên ngành ra văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy theo quy định hoặc chấm dứt hoạt động;\nd) Thời điểm chấm dứt hành vi vi phạm để tính thời hiệu xử phạt vi phạm hành chính đối với hành vi quy định tại điểm a và điểm b khoản 9 Điều 20 Nghị định này đối với công trình không thuộc diện thẩm định thiết kế về phòng cháy và chữa cháy được tính từ ngày chủ đầu tư ký biên bản nghiệm thu hoàn thành hạng mục công trình hoặc công trình xây dựng để đưa vào sử dụng theo quy định.”.","y":"“4. 위반행위 종료 시점은 다음과 같이 확정한다:\na) 이 시행령 제6조 제3항 및 제4항에 규정된 행위에 대한 행정위반 처벌 시효를 계산하기 위한 위반행위 종료 시점은 권한 있는 기관·단위가 규정에 따라 소방 및 구조·구난 직무 훈련·교육 결과 통보 문서를 발급한 날부터 계산한다;\nb) 이 시행령 제18조 제1항 및 제2항에 규정된 행위에 대한 행정위반 처벌 시효를 계산하기 위한 위반행위 종료 시점은 전문 분야 관리기관이 규정에 따라 소방 설계 심사 문서를 발급한 날부터 계산한다;\nc) 이 시행령 제18조 제3항 및 제4항에 규정된 행위에 대한 행정위반 처벌 시효를 계산하기 위한 위반행위 종료 시점은 전문 분야 관리기관이 규정에 따라 소방 준공검사(인수검사) 결과 승인 문서를 발급한 날 또는 활동을 종료한 날부터 계산한다;\nd) 소방 설계 심사 대상에 해당하지 아니하는 건축물에 대하여 이 시행령 제20조 제9항 a호 및 b호에 규정된 행위에 대한 행정위반 처벌 시효를 계산하기 위한 위반행위 종료 시점은 발주자(투자자)가 규정에 따라 사용에 투입하기 위한 건축물의 공종(부분 공사) 또는 건설 공사의 완공 준공검사(인수검사) 조서에 서명한 날부터 계산한다.”.","o":[]},{"id":"nd69-4","d":"nd69","n":"4","t":"Sửa đổi, bổ sung khoản 4 Điều 6 như sau:","k":"제6조 제4항을 다음과 같이 개정·보충한다:","c":"","x":"“4. Phạt tiền từ 6.000.000 đồng đến 8.000.000 đồng đối với hành vi tổ chức, cá nhân sử dụng đối tượng quy định tại các điểm c, d, đ, e và điểm g khoản 1 Điều 45 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ nhưng chưa có văn bản thông báo kết quả huấn luyện nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ.”.","y":"“4. 조직·개인이 「소방 및 구조·구난법」 제45조 제1항 c호, d호, đ호, e호 및 g호에 규정된 대상자를 소방 및 구조·구난 임무 수행에 사용하면서 소방 및 구조·구난 직무 훈련 결과 통보 문서가 아직 없는 행위에 대하여 6.000.000동 이상 8.000.000동 이하의 과태료를 부과한다.”.","o":[]},{"id":"nd69-5","d":"nd69","n":"5","t":"Sửa đổi, bổ sung một số khoản của Điều 10 như sau:","k":"제10조의 일부 항을 다음과 같이 개정·보충한다:","c":"","x":"1. Sửa đổi, bổ sung điểm a khoản 1\n“a) Không xuất trình hồ sơ về phòng cháy, chữa cháy, cứu nạn, cứu hộ phục vụ kiểm tra, thanh tra về phòng cháy, chữa cháy;”.\n2. Sửa đổi, bổ sung điểm a khoản 2\n“a) Không bố trí người có thẩm quyền làm việc với người có thẩm quyền kiểm tra, thanh tra sau khi đã nhận được thông báo kiểm tra, quyết định thanh tra về phòng cháy, chữa cháy;”.","y":"1. 제1항 a호 개정·보충\n“a) 소방에 관한 점검(검사)·감사에 필요한 소방 및 구조·구난 관련 서류를 제시하지 아니하는 행위;”.\n2. 제2항 a호 개정·보충\n“a) 소방에 관한 점검(검사) 통보, 감사 결정을 받은 후 점검(검사)·감사 권한이 있는 자와 업무를 진행할 권한 있는 자를 배치하지 아니하는 행위;”.","o":[]},{"id":"nd69-6","d":"nd69","n":"6","t":"Sửa đổi, bổ sung một số khoản của Điều 17 như sau:","k":"제17조의 일부 항을 다음과 같이 개정·보충한다:","c":"","x":"1. Sửa đổi, bổ sung điểm a khoản 1\n“a) Mua bảo hiểm cháy, nổ bắt buộc không đủ đối tượng bảo hiểm cháy, nổ bắt buộc hoặc không đúng mức phí bảo hiểm cháy, nổ bắt buộc theo quy định đối với cơ sở phải mua bảo hiểm cháy, nổ bắt buộc;”.\n2. Bổ sung khoản 5\n“5. Biện pháp khắc phục hậu quả:\nBuộc mua bảo hiểm cháy, nổ bắt buộc theo quy định đối với hành vi vi phạm tại điểm a khoản 1 Điều này”.","y":"1. 제1항 a호 개정·보충\n“a) 화재·폭발 의무보험에 가입하여야 하는 사업장에 대하여 규정에 따른 화재·폭발 의무보험의 보험 대상을 모두 갖추지 아니하고 화재·폭발 의무보험에 가입하거나 화재·폭발 의무보험의 보험료 수준에 맞지 아니하게 가입하는 행위;”.\n2. 제5항 추가\n“5. 시정조치(결과 복구 조치):\n이 조 제1항 a호의 위반행위에 대하여 규정에 따라 화재·폭발 의무보험에 가입하도록 강제”.","o":[]},{"id":"nd69-7","d":"nd69","n":"7","t":"Sửa đổi, bổ sung khoản 6 Điều 18 như sau:","k":"제18조 제6항을 다음과 같이 개정·보충한다:","c":"","x":"“6. Hình thức xử phạt bổ sung:\na) Đình chỉ hoạt động từ 01 tháng đến 06 tháng đối với hành vi vi phạm quy định tại khoản 3 Điều này;\nb) Đình chỉ hoạt động từ 03 tháng đến 12 tháng đối với hành vi vi phạm quy định tại khoản 4 Điều này.”.","y":"“6. 추가 처벌:\na) 이 조 제3항에 규정된 위반행위에 대하여 01개월 이상 06개월 이하의 영업(활동) 정지;\nb) 이 조 제4항에 규정된 위반행위에 대하여 03개월 이상 12개월 이하의 영업(활동) 정지.”.","o":[]},{"id":"nd69-8","d":"nd69","n":"8","t":"Sửa đổi, bổ sung một số khoản của Điều 20 như sau:","k":"제20조의 일부 항을 다음과 같이 개정·보충한다:","c":"","x":"1. Bổ sung điểm c của khoản 8\n“c) Trang bị phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới không bảo đảm số lượng hoặc không bảo đảm yêu cầu kĩ thuật theo quy định.”.\n2. Sửa đổi, bổ sung khoản 12\n“12. Biện pháp khắc phục hậu quả:\na) Buộc trang bị phương tiện chữa cháy thông dụng, dụng cụ phá dỡ thô sơ đối với hành vi vi phạm tại khoản 1 và khoản 2 Điều này;\nb) Buộc trang bị, lắp đặt đèn, phương tiện chiếu sáng sự cố, chỉ dẫn thoát nạn bảo đảm theo quy định đối với hành vi vi phạm tại khoản 3 và khoản 5 Điều này;\nc) Buộc trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ bảo đảm theo quy định cho Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành đối với hành vi vi phạm tại khoản 4, khoản 6 và khoản 7 Điều này;\nd) Buộc trang bị, lắp đặt thiết bị thuộc hệ thống báo cháy, hệ thống báo cháy bảo đảm theo quy định đối với hành vi vi phạm quy định tại điểm a khoản 8 và điểm a khoản 9 Điều này;\nđ) Buộc trang bị, lắp đặt thiết bị thuộc hệ thống chữa cháy, hệ thống chữa cháy bảo đảm theo quy định đối với hành vi vi phạm quy định tại điểm b khoản 8 và điểm b khoản 9 Điều này;\ne) Buộc trang bị phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới bảo đảm theo quy định đối với hành vi vi phạm quy định tại điểm c khoản 8 và điểm c khoản 9 Điều này.”.","y":"1. 제8항에 c호 추가\n“c) 기계식(동력) 화재진압 및 구조·구난 장비를 규정에 따른 수량을 확보하지 아니하거나 기술 요건을 충족하지 아니하게 갖추는 행위.”.\n2. 제12항 개정·보충\n“12. 시정조치(결과 복구 조치):\na) 이 조 제1항 및 제2항의 위반행위에 대하여 범용 화재진압 장비, 간이 파괴 도구를 갖추도록 강제;\nb) 이 조 제3항 및 제5항의 위반행위에 대하여 규정에 맞게 비상조명등·비상조명 장비, 피난 유도 표지를 갖추고 설치하도록 강제;\nc) 이 조 제4항, 제6항 및 제7항의 위반행위에 대하여 사업장 소방 및 구조·구난대, 전문 소방 및 구조·구난대에 규정에 맞게 소방 및 구조·구난 장비·설비를 갖추도록 강제;\nd) 이 조 제8항 a호 및 제9항 a호에 규정된 위반행위에 대하여 규정에 맞게 화재경보 설비에 속하는 장치, 화재경보 설비를 갖추고 설치하도록 강제;\nđ) 이 조 제8항 b호 및 제9항 b호에 규정된 위반행위에 대하여 규정에 맞게 소화 설비에 속하는 장치, 소화 설비를 갖추고 설치하도록 강제;\ne) 이 조 제8항 c호 및 제9항 c호에 규정된 위반행위에 대하여 규정에 맞게 기계식(동력) 화재진압 및 구조·구난 장비를 갖추도록 강제.”.","o":[]},{"id":"nd69-9","d":"nd69","n":"9","t":"Sửa đổi, bổ sung, bãi bỏ một số khoản của Điều 21 như sau:","k":"제21조의 일부 항을 다음과 같이 개정·보충·폐지한다:","c":"","x":"1. Sửa đổi, bổ sung khoản 2\n“2. Phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với một trong các hành vi sau đây:\na) Không duy trì đủ số lượng hoặc không bảo đảm yêu cầu kĩ thuật theo quy định của phương tiện chữa cháy thông dụng, dụng cụ phá dỡ thô sơ đã được trang bị, lắp đặt;\nb) Không duy trì trữ lượng nước chữa cháy theo quy định.”.\n2. Bãi bỏ khoản 8.\n3. Sửa đổi, bổ sung một số điểm của khoản 9\na) Sửa đổi, bổ sung điểm b\n“b) Buộc duy trì đủ số lượng, bảo đảm yêu cầu kĩ thuật phương tiện chữa cháy thông dụng, dụng cụ phá dỡ thô sơ, trữ lượng nước chữa cháy đối với hành vi vi phạm quy định tại khoản 2 Điều này;”;\nb) Sửa đổi, bổ sung điểm đ\n“đ) Buộc duy trì thiết bị thuộc hệ thống báo cháy, hệ thống báo cháy đối với hành vi vi phạm quy định tại điểm a khoản 4 và điểm a khoản 6 Điều này;”;\nc) Sửa đổi, bổ sung điểm e\n“e) Buộc duy trì thiết bị thuộc hệ thống chữa cháy, hệ thống chữa cháy đối với hành vi vi phạm quy định tại điểm b khoản 4 và điểm b khoản 6 Điều này.”.","y":"1. 제2항 개정·보충\n“2. 다음 각 행위 중 하나에 대하여 3.000.000동 이상 5.000.000동 이하의 과태료를 부과한다:\na) 이미 갖추고 설치한 범용 화재진압 장비, 간이 파괴 도구의 수량을 규정에 따라 충분히 유지하지 아니하거나 기술 요건을 충족하지 아니하는 행위;\nb) 규정에 따른 소화용수 저수량을 유지하지 아니하는 행위.”.\n2. 제8항 폐지.\n3. 제9항의 일부 호 개정·보충\na) b호 개정·보충\n“b) 이 조 제2항에 규정된 위반행위에 대하여 범용 화재진압 장비, 간이 파괴 도구의 수량을 충분히 유지하고 기술 요건을 충족하며 소화용수 저수량을 유지하도록 강제;”;\nb) đ호 개정·보충\n“đ) 이 조 제4항 a호 및 제6항 a호에 규정된 위반행위에 대하여 화재경보 설비에 속하는 장치, 화재경보 설비를 유지하도록 강제;”;\nc) e호 개정·보충\n“e) 이 조 제4항 b호 및 제6항 b호에 규정된 위반행위에 대하여 소화 설비에 속하는 장치, 소화 설비를 유지하도록 강제.”.","o":[]},{"id":"nd69-10","d":"nd69","n":"10","t":"Bãi bỏ khoản 6 của Điều 23.","k":"제23조 제6항을 폐지한다.","c":"","x":"","y":"","o":[]},{"id":"nd69-11","d":"nd69","n":"11","t":"Sửa đổi, bổ sung một số khoản của Điều 24 như sau:","k":"제24조의 일부 항을 다음과 같이 개정·보충한다:","c":"","x":"1. Bãi bỏ khoản 3.\n2. Sửa đổi, bổ sung khoản 6\n“6. Hình thức xử phạt bổ sung:\nĐình chỉ hoạt động từ 01 tháng đến 03 tháng đối với hành vi vi phạm quy định tại điểm b khoản 5 Điều này.”.\n3. Sửa đổi, bổ sung một số điểm của khoản 7\na) Sửa đổi, bổ sung điểm d\n“d) Buộc duy trì lối thoát nạn hoặc đường thoát nạn của gian phòng, khu vực, nhà, công trình đối với hành vi vi phạm quy định tại điểm a khoản 4 và điểm a khoản 5 Điều này;”.\nb) Bổ sung điểm đ\n“đ) Buộc bảo đảm đủ lối thoát nạn hoặc đường thoát nạn của gian phòng, khu vực, nhà, công trình đối với hành vi vi phạm quy định tại điểm b khoản 4 và điểm b khoản 5 Điều này.”.","y":"1. 제3항 폐지.\n2. 제6항 개정·보충\n“6. 추가 처벌:\n이 조 제5항 b호에 규정된 위반행위에 대하여 01개월 이상 03개월 이하의 영업(활동) 정지.”.\n3. 제7항의 일부 호 개정·보충\na) d호 개정·보충\n“d) 이 조 제4항 a호 및 제5항 a호에 규정된 위반행위에 대하여 실(室)·구역·건물·건축물의 피난구 또는 피난로를 유지하도록 강제;”.\nb) đ호 추가\n“đ) 이 조 제4항 b호 및 제5항 b호에 규정된 위반행위에 대하여 실(室)·구역·건물·건축물의 피난구 또는 피난로를 충분히 확보하도록 강제.”.","o":[]},{"id":"nd69-12","d":"nd69","n":"12","t":"Sửa đổi, bổ sung một số khoản của Điều 25 như sau:","k":"제25조의 일부 항을 다음과 같이 개정·보충한다:","c":"","x":"1. Sửa đổi, bổ sung khoản 2\n“2. Phạt tiền từ 5.000.000 đồng đến 7.000.000 đồng đối với hành vi không duy trì vật liệu ngăn cháy hoặc cửa ngăn cháy hoặc vách ngăn cháy hoặc màn ngăn cháy hoặc rèm ngăn cháy hoặc vật liệu chống cháy đã được trang bị, lắp đặt.”.\n2. Sửa đổi, bổ sung khoản 4\n“4. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với hành vi không duy trì khoảng cách phòng cháy, chữa cháy giữa nhà, công trình.”.\n3. Sửa đổi, bổ sung khoản 5\n“5. Phạt tiền từ 30.000.000 đồng đến 40.000.000 đồng đối với hành vi không trang bị, lắp đặt vật liệu ngăn cháy hoặc cửa ngăn cháy hoặc vách ngăn cháy hoặc màn ngăn cháy hoặc rèm ngăn cháy hoặc vật liệu chống cháy.”.\n4. Sửa đổi, bổ sung khoản 8\n“8. Hình thức xử phạt bổ sung:\nĐình chỉ hoạt động từ 01 tháng đến 03 tháng đối với hành vi vi phạm quy định tại khoản 6 Điều này.”.\n5. Sửa đổi, bổ sung một số điểm của khoản 9\na) Sửa đổi, bổ sung điểm b\n“b) Buộc duy trì, lắp đặt vật liệu ngăn cháy hoặc cửa ngăn cháy hoặc vách ngăn cháy hoặc màn ngăn cháy hoặc rèm ngăn cháy hoặc vật liệu chống cháy đối với hành vi vi phạm quy định tại khoản 2 và khoản 5 Điều này;”;\nb) Sửa đổi, bổ sung điểm c\n“c) Buộc duy trì khoảng cách phòng cháy, chữa cháy đối với hành vi vi phạm quy định tại khoản 4 Điều này;”;\nc) Bãi bỏ điểm d khoản 9.","y":"1. 제2항 개정·보충\n“2. 이미 갖추고 설치한 방화 재료 또는 방화문 또는 방화벽(방화 칸막이) 또는 방화 스크린 또는 방화 커튼 또는 내화 재료를 유지하지 아니하는 행위에 대하여 5.000.000동 이상 7.000.000동 이하의 과태료를 부과한다.”.\n2. 제4항 개정·보충\n“4. 건물·건축물 사이의 소방 안전거리(이격거리)를 유지하지 아니하는 행위에 대하여 20.000.000동 이상 25.000.000동 이하의 과태료를 부과한다.”.\n3. 제5항 개정·보충\n“5. 방화 재료 또는 방화문 또는 방화벽(방화 칸막이) 또는 방화 스크린 또는 방화 커튼 또는 내화 재료를 갖추지 아니하거나 설치하지 아니하는 행위에 대하여 30.000.000동 이상 40.000.000동 이하의 과태료를 부과한다.”.\n4. 제8항 개정·보충\n“8. 추가 처벌:\n이 조 제6항에 규정된 위반행위에 대하여 01개월 이상 03개월 이하의 영업(활동) 정지.”.\n5. 제9항의 일부 호 개정·보충\na) b호 개정·보충\n“b) 이 조 제2항 및 제5항에 규정된 위반행위에 대하여 방화 재료 또는 방화문 또는 방화벽(방화 칸막이) 또는 방화 스크린 또는 방화 커튼 또는 내화 재료를 유지·설치하도록 강제;”;\nb) c호 개정·보충\n“c) 이 조 제4항에 규정된 위반행위에 대하여 소방 안전거리(이격거리)를 유지하도록 강제;”;\nc) 제9항 d호 폐지.","o":[]},{"id":"nd69-13","d":"nd69","n":"13","t":"Sửa đổi, bổ sung Điều 29 như sau:","k":"제29조를 다음과 같이 개정·보충한다:","c":"","x":"“Điều 29. Thẩm quyền lập biên bản vi phạm hành chính\n1. Người có thẩm quyền xử phạt quy định từ Điều 30 đến Điều 36a Nghị định này có thẩm quyền lập biên bản vi phạm hành chính đối với các hành vi vi phạm đã được phân định thẩm quyền xử phạt cho cơ quan mình theo quy định tại Điều 37 Nghị định này.\n2. Người được giao nhiệm vụ thanh tra, kiểm tra, công chức, viên chức thuộc cơ quan quy định tại các Điều 30 và Điều 36a Nghị định này đang thi hành công vụ, nhiệm vụ có thẩm quyền lập biên bản vi phạm hành chính đối với các hành vi vi phạm thuộc lĩnh vực quản lý của mình và phạm vi công vụ, nhiệm vụ được giao.”.","y":"“제29조. 행정위반 조서 작성 권한\n1. 이 시행령 제30조부터 제36a조까지에 규정된 처벌 권한이 있는 자는 이 시행령 제37조의 규정에 따라 자기 기관에 처벌 권한이 배분된 위반행위에 대하여 행정위반 조서를 작성할 권한이 있다.\n2. 이 시행령 제30조 및 제36a조에 규정된 기관에 소속되어 공무·임무를 수행 중인 감사·점검(검사) 임무를 부여받은 자, 공무원, 공공기관 직원(viên chức)은 자기 관리 분야 및 부여받은 공무·임무의 범위에 속하는 위반행위에 대하여 행정위반 조서를 작성할 권한이 있다.”.","o":[]},{"id":"nd69-14","d":"nd69","n":"14","t":"Sửa đổi, bổ sung khoản 1 Điều 30 như sau:","k":"제30조 제1항을 다음과 같이 개정·보충한다:","c":"","x":"“1. Chủ tịch Ủy ban nhân dân xã, phường, đặc khu (sau đây gọi chung là cấp xã) có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 25.000.000 đồng;\nc) Đình chỉ hoạt động có thời hạn;\nd) Tịch thu tang vật vi phạm hành chính;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.”.","y":"“1. 사(xã)·방(phường)·특구 인민위원회 위원장(이하 사(면)급이라 통칭한다)은 다음의 권한이 있다:\na) 경고;\nb) 25.000.000동 이하의 과태료;\nc) 기한부 영업(활동) 정지;\nd) 행정위반 증거물 몰수;\nđ) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.”.","o":[]},{"id":"nd69-15","d":"nd69","n":"15","t":"Sửa đổi, bổ sung Điều 31 như sau:","k":"제31조를 다음과 같이 개정·보충한다:","c":"","x":"“Điều 31. Thẩm quyền xử phạt vi phạm hành chính của Công an nhân dân\n1. Chiến sĩ Công an nhân dân đang thi hành công vụ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 5.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này.\n2. Thủ trưởng đơn vị Cảnh sát cơ động cấp đại đội có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 10.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n3. Trưởng đồn Công an, Thủ trưởng đơn vị Cảnh sát cơ động cấp tiểu đoàn, Thủy đội trưởng, Trưởng trạm, Đội trưởng có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 15.000.000 đồng;\nc) Đình chỉ hoạt động có thời hạn;\nd) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n4. Trưởng Công an cấp xã có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 25.000.000 đồng;\nc) Đình chỉ hoạt động có thời hạn;\nd) Tịch thu tang vật vi phạm hành chính;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n5. Trưởng phòng nghiệp vụ thuộc Cục Cảnh sát quản lý hành chính về trật tự xã hội gồm: Trưởng phòng Hướng dẫn, quản lý vũ khí, vật liệu nổ, công cụ hỗ trợ và pháo, Trưởng phòng Hướng dẫn, quản lý các ngành, nghề đầu tư kinh doanh có điều kiện về an ninh, trật tự và con dấu; Trưởng phòng nghiệp vụ thuộc Cục Cảnh sát giao thông gồm: Trưởng phòng Hướng dẫn tuyên truyền, điều tra, giải quyết tai nạn giao thông, Trưởng phòng Hướng dẫn, đăng ký và kiểm định phương tiện, Trưởng phòng Hướng dẫn, đào tạo, sát hạch, quản lý giấy phép của người điều khiển phương tiện giao thông, Trưởng phòng Hướng dẫn tuần tra, kiểm soát giao thông đường bộ, đường sắt, Trưởng phòng Hướng dẫn điều khiển giao thông và dẫn đoàn, Trưởng phòng Hướng dẫn tuần tra, kiểm soát và đấu tranh phòng, chống tội phạm trên đường thủy nội địa, Thủy đoàn trưởng; Trưởng phòng nghiệp vụ thuộc Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ gồm: Trưởng phòng Công tác phòng cháy, Trưởng phòng Thẩm duyệt về phòng cháy, chữa cháy, Trưởng phòng Công tác chữa cháy và cứu nạn, cứu hộ, Trưởng phòng Quản lý khoa học - công nghệ và kiểm định phương tiện phòng cháy, chữa cháy và cứu nạn, cứu hộ; Trưởng phòng Công an cấp tỉnh gồm: Trưởng phòng Cảnh sát quản lý hành chính về trật tự xã hội, Trưởng phòng Cảnh sát giao thông, Trưởng phòng Cảnh sát cơ động, Trưởng phòng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 40.000.000 đồng;\nc) Đình chỉ hoạt động có thời hạn;\nd) Tịch thu tang vật vi phạm hành chính;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n6. Giám đốc Công an cấp tỉnh có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tước quyền sử dụng giấy phép là văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy;\nd) Đình chỉ hoạt động có thời hạn;\nđ) Tịch thu tang vật vi phạm hành chính;\ne) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n7. Cục trưởng Cục Cảnh sát quản lý hành chính về trật tự xã hội, Cục trưởng Cục Cảnh sát giao thông, Cục trưởng Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tước quyền sử dụng giấy phép là văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy;\nd) Tịch thu tang vật vi phạm hành chính;\nđ) Đình chỉ hoạt động có thời hạn;\ne) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.”.","y":"“제31조. 인민공안의 행정위반 처벌 권한\n1. 공무 수행 중인 인민공안 전사는 다음의 권한이 있다:\na) 경고;\nb) 5.000.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수.\n2. 중대급 기동경찰 단위의 장은 다음의 권한이 있다:\na) 경고;\nb) 10.000.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수;\nd) 「행정위반처리법」 제28조 제1항 a호에 규정된 시정조치(결과 복구 조치) 적용.\n3. 공안 파출소장(Trưởng đồn Công an), 대대급 기동경찰 단위의 장, 수상대장(Thủy đội trưởng), 초소장(Trưởng trạm), 대장(Đội trưởng)은 다음의 권한이 있다:\na) 경고;\nb) 15.000.000동 이하의 과태료;\nc) 기한부 영업(활동) 정지;\nd) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수;\nđ) 「행정위반처리법」 제28조 제1항 a호에 규정된 시정조치(결과 복구 조치) 적용.\n4. 사(면)급 공안장은 다음의 권한이 있다:\na) 경고;\nb) 25.000.000동 이하의 과태료;\nc) 기한부 영업(활동) 정지;\nd) 행정위반 증거물 몰수;\nđ) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n5. 사회질서 행정관리 경찰국 소속 업무과장으로서 무기·폭발물·보조 도구 및 폭죽 지도·관리과장, 안보·질서 관련 조건부 투자·영업 업종 및 인장 지도·관리과장; 교통경찰국 소속 업무과장으로서 교통사고 홍보·조사·처리 지도과장, 교통수단 등록 및 검정 지도과장, 교통수단 운전자의 교육·시험·면허 관리 지도과장, 도로·철도 교통 순찰·단속 지도과장, 교통 통제 및 차량 행렬 선도 지도과장, 내륙수로상 순찰·단속 및 범죄 예방·퇴치 지도과장, 수상단장(Thủy đoàn trưởng); 소방 및 구조·구난 경찰국 소속 업무과장으로서 화재예방 업무과장, 소방 심사승인(thẩm duyệt)과장, 화재진압 및 구조·구난 업무과장, 과학기술 관리 및 소방 및 구조·구난 장비·설비 검정과장; 성급 공안의 과장으로서 사회질서 행정관리 경찰과장, 교통경찰과장, 기동경찰과장, 소방 및 구조·구난 경찰과장은 다음의 권한이 있다:\na) 경고;\nb) 40.000.000동 이하의 과태료;\nc) 기한부 영업(활동) 정지;\nd) 행정위반 증거물 몰수;\nđ) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n6. 성급 공안청장은 다음의 권한이 있다:\na) 경고;\nb) 50.000.000동 이하의 과태료;\nc) 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서인 허가증의 사용권 박탈;\nd) 기한부 영업(활동) 정지;\nđ) 행정위반 증거물 몰수;\ne) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n7. 사회질서 행정관리 경찰국장, 교통경찰국장, 소방 및 구조·구난 경찰국장은 다음의 권한이 있다:\na) 경고;\nb) 50.000.000동 이하의 과태료;\nc) 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서인 허가증의 사용권 박탈;\nd) 행정위반 증거물 몰수;\nđ) 기한부 영업(활동) 정지;\ne) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.”.","o":[]},{"id":"nd69-16","d":"nd69","n":"16","t":"Sửa đổi, bổ sung Điều 32 như sau:","k":"제32조를 다음과 같이 개정·보충한다:","c":"","x":"“Điều 32. Thẩm quyền xử phạt vi phạm hành chính của Bộ đội Biên phòng\n1. Chiến sĩ Bộ đội Biên phòng đang thi hành công vụ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 2.500.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này.\n2. Trạm trưởng, Đội trưởng của người được quy định tại khoản 1 Điều này có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 5.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n3. Đội trưởng Đội đặc nhiệm phòng chống ma túy và tội phạm thuộc Đoàn đặc nhiệm phòng chống ma túy và tội phạm có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 7.500.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n4. Đồn trưởng Đồn biên phòng, Hải đội trưởng Hải đội biên phòng, Chỉ huy trưởng Ban chỉ huy Biên phòng Cửa khẩu cảng có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 15.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n5. Đoàn trưởng Đoàn đặc nhiệm phòng chống ma túy và tội phạm thuộc Cục Phòng chống ma túy và tội phạm thuộc Bộ Tư lệnh Bộ đội Biên phòng có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 25.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Đình chỉ hoạt động có thời hạn;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n6. Chỉ huy trưởng Ban chỉ huy Bộ đội Biên phòng, Hải đoàn trưởng Hải đoàn biên phòng, Cục trưởng Cục Phòng chống ma túy và tội phạm thuộc Bộ Tư lệnh Bộ đội Biên phòng có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Đình chỉ hoạt động có thời hạn;\nđ) Tước quyền sử dụng giấy phép là văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy;\ne) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.”","y":"“제32조. 국경수비대의 행정위반 처벌 권한\n1. 공무 수행 중인 국경수비대 전사는 다음의 권한이 있다:\na) 경고;\nb) 2.500.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수.\n2. 이 조 제1항에 규정된 자의 초소장(Trạm trưởng), 대장(Đội trưởng)은 다음의 권한이 있다:\na) 경고;\nb) 5.000.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수;\nd) 「행정위반처리법」 제28조 제1항 a호에 규정된 시정조치(결과 복구 조치) 적용.\n3. 마약·범죄 예방퇴치 특수임무단 소속 마약·범죄 예방퇴치 특수임무대의 대장은 다음의 권한이 있다:\na) 경고;\nb) 7.500.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수;\nd) 「행정위반처리법」 제28조 제1항 a호에 규정된 시정조치(결과 복구 조치) 적용.\n4. 국경수비 초소(Đồn biên phòng)의 초소장, 국경수비 해상대(Hải đội)의 해상대장, 항만 국경검문소 국경수비 지휘부의 지휘관은 다음의 권한이 있다:\na) 경고;\nb) 15.000.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수;\nd) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n5. 국경수비대 사령부 소속 마약·범죄 예방퇴치국 소속 마약·범죄 예방퇴치 특수임무단의 단장은 다음의 권한이 있다:\na) 경고;\nb) 25.000.000동 이하의 과태료;\nc) 행정위반 증거물 몰수;\nd) 기한부 영업(활동) 정지;\nđ) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n6. 국경수비대 지휘부의 지휘관, 국경수비 해상단(Hải đoàn)의 해상단장, 국경수비대 사령부 소속 마약·범죄 예방퇴치국장은 다음의 권한이 있다:\na) 경고;\nb) 50.000.000동 이하의 과태료;\nc) 행정위반 증거물 몰수;\nd) 기한부 영업(활동) 정지;\nđ) 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서인 허가증의 사용권 박탈;\ne) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.”","o":[]},{"id":"nd69-17","d":"nd69","n":"17","t":"Sửa đổi, bổ sung Điều 33 như sau:","k":"제33조를 다음과 같이 개정·보충한다:","c":"","x":"“Điều 33. Thẩm quyền xử phạt vi phạm hành chính của Kiểm lâm\n1. Kiểm lâm viên đang thi hành công vụ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 2.500.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này.\n2. Trạm trưởng Trạm Kiểm lâm có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 10.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n3. Hạt trưởng Hạt Kiểm lâm, Đội trưởng Đội Kiểm lâm cơ động và phòng cháy, chữa cháy rừng có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 15.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n4. Chi cục trưởng Chi cục Kiểm lâm vùng, Đội trưởng Đội Kiểm lâm đặc nhiệm thuộc Cục Lâm nghiệp và Kiểm lâm; Chi cục trưởng Chi cục về lĩnh vực lâm nghiệp, kiểm lâm thuộc Sở Nông nghiệp và Môi trường có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 25.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Đình chỉ hoạt động có thời hạn;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n5. Cục trưởng Cục Lâm nghiệp và Kiểm lâm có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Đình chỉ hoạt động có thời hạn;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.”.","y":"“제33조. 산림보호대(Kiểm lâm)의 행정위반 처벌 권한\n1. 공무 수행 중인 산림보호관은 다음의 권한이 있다:\na) 경고;\nb) 2.500.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수.\n2. 산림보호 초소(Trạm Kiểm lâm)의 초소장은 다음의 권한이 있다:\na) 경고;\nb) 10.000.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수;\nd) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n3. 산림보호서(Hạt Kiểm lâm)의 서장, 기동 산림보호 및 산불 예방·진압대의 대장은 다음의 권한이 있다:\na) 경고;\nb) 15.000.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수;\nd) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n4. 임업·산림보호국 소속 지역 산림보호 지국장, 산림보호 특수임무대의 대장; 농업환경국(Sở) 소속 임업·산림보호 분야 지국의 지국장은 다음의 권한이 있다:\na) 경고;\nb) 25.000.000동 이하의 과태료;\nc) 행정위반 증거물 몰수;\nd) 기한부 영업(활동) 정지;\nđ) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n5. 임업·산림보호국장은 다음의 권한이 있다:\na) 경고;\nb) 50.000.000동 이하의 과태료;\nc) 행정위반 증거물 몰수;\nd) 기한부 영업(활동) 정지;\nđ) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.”.","o":[]},{"id":"nd69-18","d":"nd69","n":"18","t":"Sửa đổi, bổ sung Điều 34 như sau:","k":"제34조를 다음과 같이 개정·보충한다:","c":"","x":"“Điều 34. Thẩm quyền xử phạt vi phạm hành chính của Kiểm ngư\n1. Kiểm ngư viên đang thi hành công vụ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 2.500.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này.\n2. Trạm trưởng Trạm Kiểm ngư thuộc Chi cục Kiểm ngư vùng có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 10.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n3. Chi cục trưởng Chi cục Kiểm ngư vùng thuộc Cục Thủy sản và Kiểm ngư; Chi cục trưởng Chi cục về lĩnh vực thủy sản, kiểm ngư thuộc Sở Nông nghiệp và Môi trường có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 25.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Đình chỉ hoạt động có thời hạn;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n4. Cục trưởng Cục Thủy sản và Kiểm ngư có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Đình chỉ hoạt động có thời hạn;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.”.","y":"“제34조. 어업감시대(Kiểm ngư)의 행정위반 처벌 권한\n1. 공무 수행 중인 어업감시관은 다음의 권한이 있다:\na) 경고;\nb) 2.500.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수.\n2. 지역 어업감시 지국 소속 어업감시 초소(Trạm Kiểm ngư)의 초소장은 다음의 권한이 있다:\na) 경고;\nb) 10.000.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수;\nd) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n3. 수산·어업감시국 소속 지역 어업감시 지국장; 농업환경국(Sở) 소속 수산·어업감시 분야 지국의 지국장은 다음의 권한이 있다:\na) 경고;\nb) 25.000.000동 이하의 과태료;\nc) 행정위반 증거물 몰수;\nd) 기한부 영업(활동) 정지;\nđ) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n4. 수산·어업감시국장은 다음의 권한이 있다:\na) 경고;\nb) 50.000.000동 이하의 과태료;\nc) 행정위반 증거물 몰수;\nd) 기한부 영업(활동) 정지;\nđ) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.”.","o":[]},{"id":"nd69-19","d":"nd69","n":"19","t":"Sửa đổi, bổ sung Điều 35 như sau:","k":"제35조를 다음과 같이 개정·보충한다:","c":"","x":"“Điều 35. Thẩm quyền xử phạt vi phạm hành chính của Cảnh sát biển\n1. Cảnh sát viên Cảnh sát biển đang thi hành công vụ có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 2.500.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này.\n2. Tổ trưởng Tổ nghiệp vụ Cảnh sát biển có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 5.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này.\n3. Đội trưởng Đội nghiệp vụ Cảnh sát biển, Trạm trưởng Trạm Cảnh sát biển có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 10.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n4. Hải đội trưởng Hải đội Cảnh sát biển có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 15.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n5. Hải đoàn trưởng Hải đoàn Cảnh sát biển; Đoàn trưởng Đoàn trinh sát, Đoàn trưởng Đoàn đặc nhiệm phòng chống tội phạm ma túy thuộc Cảnh sát biển Việt Nam có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 25.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Đình chỉ hoạt động có thời hạn;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n6. Tư lệnh Vùng Cảnh sát biển, Cục trưởng Cục Nghiệp vụ và Pháp luật thuộc Cảnh sát biển Việt Nam có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 40.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n7. Tư lệnh Cảnh sát biển Việt Nam có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Đình chỉ hoạt động có thời hạn;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.”.","y":"“제35조. 해양경찰의 행정위반 처벌 권한\n1. 공무 수행 중인 해양경찰 경찰관은 다음의 권한이 있다:\na) 경고;\nb) 2.500.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수.\n2. 해양경찰 업무조(Tổ nghiệp vụ)의 조장은 다음의 권한이 있다:\na) 경고;\nb) 5.000.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수.\n3. 해양경찰 업무대(Đội nghiệp vụ)의 대장, 해양경찰 초소(Trạm)의 초소장은 다음의 권한이 있다:\na) 경고;\nb) 10.000.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수;\nd) 「행정위반처리법」 제28조 제1항 a호에 규정된 시정조치(결과 복구 조치) 적용.\n4. 해양경찰 해상대(Hải đội)의 해상대장은 다음의 권한이 있다:\na) 경고;\nb) 15.000.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수;\nd) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n5. 해양경찰 해상단(Hải đoàn)의 해상단장; 베트남 해양경찰 소속 정찰단의 단장, 마약범죄 예방퇴치 특수임무단의 단장은 다음의 권한이 있다:\na) 경고;\nb) 25.000.000동 이하의 과태료;\nc) 행정위반 증거물 몰수;\nd) 기한부 영업(활동) 정지;\nđ) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n6. 해양경찰 지역사령부 사령관, 베트남 해양경찰 소속 업무·법무국장은 다음의 권한이 있다:\na) 경고;\nb) 40.000.000동 이하의 과태료;\nc) 행정위반 증거물 몰수;\nd) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n7. 베트남 해양경찰 사령관은 다음의 권한이 있다:\na) 경고;\nb) 50.000.000동 이하의 과태료;\nc) 행정위반 증거물 몰수;\nd) 기한부 영업(활동) 정지;\nđ) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.”.","o":[]},{"id":"nd69-20","d":"nd69","n":"20","t":"Sửa đổi, bổ sung Điều 36 như sau:","k":"제36조를 다음과 같이 개정·보충한다:","c":"","x":"“Điều 36. Thẩm quyền xử phạt vi phạm hành chính của Thanh tra\n1. Thanh tra viên các Bộ: Quốc phòng, Công an có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 5.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này.\n2. Trưởng đoàn thanh tra của các cơ quan: Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ, Công an cấp tỉnh có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 25.000.000 đồng;\nc) Tịch thu tang vật, phương tiện vi phạm hành chính;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n3. Chánh Thanh tra Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ, Chánh Thanh tra quốc phòng quân khu, Chánh Thanh tra Công an cấp tỉnh có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 40.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Đình chỉ hoạt động có thời hạn;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n4. Chánh Thanh tra các Bộ: Quốc phòng, Công an; Trưởng đoàn thanh tra do Chánh thanh tra các Bộ: Quốc phòng, Công an thành lập có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 50.000.000 đồng;\nc) Tước quyền sử dụng giấy phép là văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy;\nd) Tịch thu tang vật vi phạm hành chính;\nđ) Đình chỉ hoạt động có thời hạn;\ne) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.”.","y":"“제36조. 감사기관(Thanh tra)의 행정위반 처벌 권한\n1. 국방부, 공안부의 감사관은 다음의 권한이 있다:\na) 경고;\nb) 5.000.000동 이하의 과태료;\nc) 가액이 이 항 b호에 규정된 과태료 금액의 02배를 초과하지 아니하는 행정위반 증거물 몰수.\n2. 소방 및 구조·구난 경찰국, 성급 공안의 감사단장은 다음의 권한이 있다:\na) 경고;\nb) 25.000.000동 이하의 과태료;\nc) 행정위반 증거물·수단 몰수;\nd) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n3. 소방 및 구조·구난 경찰국 수석감사관(Chánh Thanh tra), 군구 국방 수석감사관, 성급 공안 수석감사관은 다음의 권한이 있다:\na) 경고;\nb) 40.000.000동 이하의 과태료;\nc) 행정위반 증거물 몰수;\nd) 기한부 영업(활동) 정지;\nđ) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n4. 국방부, 공안부의 수석감사관; 국방부, 공안부의 수석감사관이 구성한 감사단의 단장은 다음의 권한이 있다:\na) 경고;\nb) 50.000.000동 이하의 과태료;\nc) 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서인 허가증의 사용권 박탈;\nd) 행정위반 증거물 몰수;\nđ) 기한부 영업(활동) 정지;\ne) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.”.","o":[]},{"id":"nd69-21","d":"nd69","n":"21","t":"Bổ sung Điều 36a như sau:","k":"제36a조를 다음과 같이 추가한다:","c":"","x":"“Điều 36a. Thẩm quyền của Thủ trưởng cơ quan thực hiện nhiệm vụ quản lý nhà nước theo chuyên ngành, lĩnh vực\n1. Giám đốc các Sở: Xây dựng, Công Thương, Nông nghiệp và Môi trường có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến 40.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Đình chỉ hoạt động có thời hạn;\nd) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.\n2. Cục trưởng Cục Quản lý, giám sát bảo hiểm; Thủ trưởng cơ quan chuyên môn về xây dựng thuộc Bộ Xây dựng, Bộ Công Thương, Bộ Nông nghiệp và Môi trường có quyền:\na) Phạt cảnh cáo;\nb) Phạt tiền đến mức 50.000.000 đồng;\nc) Tịch thu tang vật vi phạm hành chính;\nd) Đình chỉ hoạt động có thời hạn;\nđ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm a và điểm k khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính.”.","y":"“제36a조. 전문 부문·분야별 국가관리 임무를 수행하는 기관의 장의 권한\n1. 건설국, 공상국, 농업환경국(각 Sở)의 국장은 다음의 권한이 있다:\na) 경고;\nb) 40.000.000동 이하의 과태료;\nc) 행정위반 증거물 몰수;\nd) 기한부 영업(활동) 정지;\nd) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.\n2. 보험관리감독국장; 건설부, 공상부, 농업환경부 소속 건설 전문기관의 장은 다음의 권한이 있다:\na) 경고;\nb) 50.000.000동 이하의 과태료;\nc) 행정위반 증거물 몰수;\nd) 기한부 영업(활동) 정지;\nđ) 「행정위반처리법」 제28조 제1항 a호 및 k호에 규정된 시정조치(결과 복구 조치) 적용.”.","o":[]},{"id":"nd69-22","d":"nd69","n":"22","t":"Sửa đổi, bổ sung một số khoản của Điều 37 như sau:","k":"제37조의 일부 항을 다음과 같이 개정·보충한다:","c":"","x":"1. Sửa đổi, bổ sung khoản 3\n“3. Người có thẩm quyền xử phạt của Bộ đội Biên phòng có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại các Điều 7,14,15, 16, 20 và Điều 21 Nghị định này theo thẩm quyền quy định tại Điều 32 Nghị định này trong phạm vi, lĩnh vực mình quản lý và chức năng, nhiệm vụ, quyền hạn được giao.”.\n2. Bãi bỏ khoản 8.\n3. Bổ sung khoản 9\n“9. Giám đốc các Sở: Xây dựng, Công Thương, Nông nghiệp và Môi trường có thẩm quyền xử phạt vi phạm hành chính đối với hành vi quy định tại các Điều 18, 23, 24 và Điều 25 Nghị định này theo thẩm quyền quy định tại Điều 36a Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.”.\n4. Bổ sung khoản 10\n“10. Cục trưởng Cục Quản lý, giám sát bảo hiểm có thẩm quyền xử phạt vi phạm hành chính đối với hành vi quy định tại điểm b khoản 4 Điều 17 Nghị định này theo thẩm quyền quy định tại Điều 36a Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.”.\n5. Bổ sung khoản 11\n“11. Cục trưởng Cục Đăng kiểm Việt Nam có thẩm quyền xử phạt vi phạm hành chính đối với hành vi quy định tại các Điều 18, 19, 20, 21, 22 và Điều 25 Nghị định này theo thẩm quyền quy định tại Điều 36a Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.”.\n6. Bổ sung khoản 12\n“12. Thủ trưởng tổ chức thuộc Bộ Xây dựng, Bộ Công Thương, Bộ Nông nghiệp và Môi trường trực tiếp quản lý cơ quan chuyên môn về xây dựng có thẩm quyền xử phạt vi phạm hành chính đối với hành vi quy định tại Điều 18 Nghị định này theo thẩm quyền quy định tại Điều 36a Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.”.","y":"1. 제3항 개정·보충\n“3. 국경수비대의 처벌 권한이 있는 자는 자기가 관리하는 범위·분야 및 부여받은 기능·임무·권한 내에서 이 시행령 제32조에 규정된 권한에 따라 이 시행령 제7조, 제14조, 제15조, 제16조, 제20조 및 제21조에 규정된 행정위반 행위에 대하여 행정위반을 처벌하고 시정조치(결과 복구 조치)를 적용할 권한이 있다.”.\n2. 제8항 폐지.\n3. 제9항 추가\n“9. 건설국, 공상국, 농업환경국(각 Sở)의 국장은 이 시행령 제36a조에 규정된 권한 및 부여받은 기능·임무·권한에 따라 이 시행령 제18조, 제23조, 제24조 및 제25조에 규정된 행위에 대하여 행정위반을 처벌할 권한이 있다.”.\n4. 제10항 추가\n“10. 보험관리감독국장은 이 시행령 제36a조에 규정된 권한 및 부여받은 기능·임무·권한에 따라 이 시행령 제17조 제4항 b호에 규정된 행위에 대하여 행정위반을 처벌할 권한이 있다.”.\n5. 제11항 추가\n“11. 베트남 등록검사국(Cục Đăng kiểm Việt Nam)장은 이 시행령 제36a조에 규정된 권한 및 부여받은 기능·임무·권한에 따라 이 시행령 제18조, 제19조, 제20조, 제21조, 제22조 및 제25조에 규정된 행위에 대하여 행정위반을 처벌할 권한이 있다.”.\n6. 제12항 추가\n“12. 건설부, 공상부, 농업환경부 소속으로서 건설 전문기관을 직접 관리하는 조직의 장은 이 시행령 제36a조에 규정된 권한 및 부여받은 기능·임무·권한에 따라 이 시행령 제18조에 규정된 행위에 대하여 행정위반을 처벌할 권한이 있다.”.","o":[]},{"id":"nd69-23","d":"nd69","n":"23","t":"Điều khoản thi hành","k":"시행 조항","c":"","x":"1. Nghị định này có hiệu lực thi hành từ ngày 20 tháng 4 năm 2026.\n2. Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố và các cơ quan, tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này.","y":"1. 이 시행령은 2026년 4월 20일부터 시행한다(효력 발생).\n2. 장관, 부급(部級) 기관의 장, 정부 직속 기관의 장, 성·(중앙직할)시 인민위원회 위원장 및 관련 기관·조직·개인은 이 시행령을 시행할 책임을 진다.","o":[]},{"id":"nd69-24","d":"nd69","n":"24","t":"Điều khoản chuyển tiếp","k":"경과 규정","c":"","x":"1. Đối với hành vi vi phạm hành chính trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ xảy ra và kết thúc trước thời điểm Nghị định này có hiệu lực mà bị phát hiện nhưng chưa hết thời hiệu xử phạt hoặc đang xem xét, giải quyết khi Nghị định này đã có hiệu lực thì áp dụng Nghị định của Chính phủ về xử phạt vi phạm hành chính có hiệu lực tại thời điểm thực hiện hành vi vi phạm để xử lý.\nĐối với hành vi vi phạm hành chính trong lĩnh vực phòng cháy, chữa cháy và cứu nạn, cứu hộ xảy ra trước thời điểm Nghị định này có hiệu lực nhưng vẫn đang diễn ra khi Nghị định này đã có hiệu lực thì áp dụng quy định của Nghị định này để xử lý.\n2. Đối với quyết định xử phạt vi phạm hành chính đã được ban hành hoặc đã được thi hành xong trước thời điểm Nghị định này có hiệu lực, mà tổ chức, cá nhân bị xử phạt vi phạm hành chính còn khiếu nại thì áp dụng quy định về xử phạt vi phạm hành chính tại thời điểm ban hành quyết định xử phạt để giải quyết.","y":"1. 이 시행령의 시행(효력 발생) 시점 전에 발생하여 종료된 소방 및 구조·구난 분야의 행정위반 행위로서 적발되었으나 처벌 시효가 아직 만료되지 아니하였거나 이 시행령이 시행된 때에 심의·처리 중인 경우에는 위반행위를 한 시점에 효력이 있는 행정위반 처벌에 관한 정부 시행령을 적용하여 처리한다.\n이 시행령의 시행(효력 발생) 시점 전에 발생하였으나 이 시행령이 시행된 때에도 계속 진행 중인 소방 및 구조·구난 분야의 행정위반 행위에 대하여는 이 시행령의 규정을 적용하여 처리한다.\n2. 이 시행령의 시행(효력 발생) 시점 전에 이미 발령되었거나 집행이 완료된 행정위반 처벌 결정에 대하여 처벌받은 조직·개인이 여전히 이의를 제기(khiếu nại)하는 경우에는 처벌 결정 발령 시점의 행정위반 처벌에 관한 규정을 적용하여 처리한다.","o":[]},{"id":"tt36-1","d":"tt36","n":"1","t":"Phạm vi điều chỉnh","k":"적용 범위","c":"제1장 총칙","x":"Thông tư này quy định chi tiết một số điều của Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ và Nghị định số 105/2025/NĐ-CP ngày 15 tháng 5 năm 2025 của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ, cụ thể:\n1. Quy định chi tiết một số điều của Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ, bao gồm:\na) Khoản 4 Điều 42 về trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành, lực lượng dân phòng;\nb) Khoản 3 Điều 43 về quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ (quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ thực hiện theo quy định tại Thông tư số 37/2025/TT-BCA ngày 15 tháng 5 năm 2025 của Bộ trưởng Bộ Công an quy định về nhiệm vụ công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ của lực lượng Công an nhân dân).\n2. Quy định chi tiết một số điều của Nghị định số 105/2025/NĐ-CP, bao gồm:\na) Khoản 7 Điều 9 về thẩm quyền thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan Công an;\nb) Khoản 3 Điều 13 về thẩm quyền kiểm tra về phòng cháy, chữa cháy của cơ quan Công an;\nc) Khoản 6 Điều 15 về thẩm quyền xây dựng, phê duyệt phương án chữa cháy, cứu nạn, cứu hộ, phương án cứu nạn, cứu hộ của cơ quan Công an;\nd) Khoản 6 Điều 23 về thẩm quyền cấp giấy phép lưu thông đối với phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nđ) Khoản 6 Điều 28 và khoản 2 Điều 30 về huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ.","y":"이 시행규칙은 「소방 및 구조·구난법」 및 「소방 및 구조·구난법」의 일부 조항과 시행 조치를 상세히 규정하는 정부의 2025년 5월 15일자 시행령 제105/2025/NĐ-CP호의 일부 조항을 상세히 규정하며, 구체적으로는 다음과 같다:\n1. 「소방 및 구조·구난법」의 일부 조항에 대한 상세 규정으로서 다음을 포함한다:\na) 사업장 자체 소방대, 전문 소방대, 민방위 소방대에 대한 소방 및 구조·구난 장비·설비의 비치에 관한 제42조 제4항;\nb) 소방 및 구조·구난 장비·설비의 관리, 보관, 정비에 관한 제43조 제3항(소방경찰(소방·구조구난 경찰)의 소방 및 구조·구난 장비·설비의 관리, 보관, 정비는 인민공안의 소방(화재예방·진압), 구조·구난 업무 임무에 관하여 규정하는 공안부 장관의 2025년 5월 15일자 시행규칙 제37/2025/TT-BCA호의 규정에 따라 시행한다).\n2. 시행령 제105/2025/NĐ-CP호의 일부 조항에 대한 상세 규정으로서 다음을 포함한다:\na) 공안기관의 소방 설계 심사 권한에 관한 제9조 제7항;\nb) 공안기관의 소방 점검(검사) 권한에 관한 제13조 제3항;\nc) 공안기관의 화재진압·구조구난 계획(방안), 구조·구난 계획(방안)의 수립, 승인 권한에 관한 제15조 제6항;\nd) 소방 및 구조·구난 장비·설비에 대한 유통 허가증 발급 권한에 관한 제23조 제6항;\nđ) 소방(화재예방·진압), 구조·구난 직무 훈련·교육에 관한 제28조 제6항 및 제30조 제2항.","o":[]},{"id":"tt36-2","d":"tt36","n":"2","t":"Phụ lục","k":"부록","c":"제1장 총칙","x":"Ban hành kèm theo Thông tư này các phụ lục:\n1. Phụ lục I: Danh mục, số lượng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ trang bị cho lực lượng dân phòng, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành.\n2. Phụ lục II: Bảo quản, bảo dưỡng phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới.\n3. Phụ lục III: Bảo quản, bảo dưỡng phương tiện chữa cháy thông dụng, phương tiện cứu người, phương tiện, thiết bị phục vụ cứu nạn, cứu hộ, chất chữa cháy, phương tiện, thiết bị thông tin liên lạc phục vụ chữa cháy, cứu nạn, cứu hộ.\n4. Phụ lục IV: Bảo quản, bảo dưỡng trang phục và thiết bị bảo hộ cá nhân phục vụ công tác chữa cháy, cứu nạn, cứu hộ.\n5. Phụ lục V: Bảo quản, bảo dưỡng thiết bị báo cháy độc lập, thiết bị thuộc hệ thống báo cháy, thiết bị thuộc hệ thống loa thông báo và hướng dẫn thoát nạn, thiết bị thuộc hệ thống chữa cháy, đèn, phương tiện chiếu sáng sự cố, chỉ dẫn thoát nạn.\n6. Phụ lục VI: Các biểu mẫu.","y":"이 시행규칙에 다음의 부록을 첨부하여 공포한다:\n1. 부록 I: 민방위 소방대, 사업장 자체 소방대, 전문 소방대에 비치하는 소방 및 구조·구난 장비·설비의 목록, 수량.\n2. 부록 II: 동력식 화재진압·구조구난 장비의 보관, 정비.\n3. 부록 III: 일반 소화 기구, 인명 구조 장비, 구조·구난용 장비·기기, 소화 약제, 화재진압·구조구난용 통신 장비·기기의 보관, 정비.\n4. 부록 IV: 화재진압, 구조·구난 업무용 복장 및 개인 보호 장비의 보관, 정비.\n5. 부록 V: 단독형 화재경보 장치, 화재경보 설비에 속하는 장치, 피난 안내 방송 스피커 설비에 속하는 장치, 소화 설비에 속하는 장치, 비상 조명등·비상 조명 기구, 피난 유도 표지의 보관, 정비.\n6. 부록 VI: 각종 서식.","o":[]},{"id":"tt36-3","d":"tt36","n":"3","t":"Trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng dân phòng","k":"민방위 소방대에 대한 소방 및 구조·구난 장비·설비의 비치","c":"제2장 민방위·사업장·전문 소방대의 장비 지급","x":"1. Phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ trang bị cho lực lượng dân phòng theo danh mục, số lượng quy định tại Phụ lục I kèm theo Thông tư này.\n2. Ủy ban nhân dân cấp xã có trách nhiệm trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng dân phòng theo quy định tại khoản 1 Điều này.\nCăn cứ yêu cầu bảo đảm an toàn phòng cháy, chữa cháy, cứu nạn, cứu hộ và khả năng bảo đảm ngân sách của địa phương, Ủy ban nhân dân cấp xã có thể trang bị thêm số lượng, thêm loại phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ, phương tiện, thiết bị cần thiết khác cho lực lượng dân phòng để thực hiện nhiệm vụ.","y":"1. 민방위 소방대에 비치하는 소방 및 구조·구난 장비·설비는 이 시행규칙에 첨부된 부록 I에 규정된 목록, 수량에 따른다.\n2. 사(면)급 인민위원회는 이 조 제1항의 규정에 따라 민방위 소방대에 소방 및 구조·구난 장비·설비를 비치할 책임이 있다.\n소방(화재예방·진압), 구조·구난 안전 확보 요구와 지방의 예산 확보 능력에 근거하여, 사(면)급 인민위원회는 민방위 소방대가 임무를 수행하도록 소방 및 구조·구난 장비·설비, 그 밖에 필요한 장비·기기의 수량, 종류를 추가로 비치할 수 있다.","o":[]},{"id":"tt36-4","d":"tt36","n":"4","t":"Trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành","k":"사업장 자체 소방대, 전문 소방대에 대한 소방 및 구조·구난 장비·설비의 비치","c":"제2장 민방위·사업장·전문 소방대의 장비 지급","x":"1. Phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ trang bị cho lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành theo danh mục, số lượng quy định tại Phụ lục I kèm theo Thông tư này.\n2. Người đứng đầu cơ sở quyết định hoặc đề xuất người có thẩm quyền quyết định trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành thuộc phạm vi quản lý bảo đảm theo quy định tại khoản 1 Điều này.\nCăn cứ yêu cầu bảo đảm an toàn phòng cháy, chữa cháy, cứu nạn, cứu hộ tại cơ sở, người đứng đầu cơ sở quyết định hoặc đề xuất người có thẩm quyền quyết định trang bị thêm số lượng, thêm loại phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ, phương tiện, thiết bị cần thiết khác cho lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành thuộc phạm vi quản lý để thực hiện nhiệm vụ.\n3. Kinh phí bảo đảm trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành quy định tại khoản 8 Điều 20 Nghị định số 105/2025/NĐ-CP.\nKinh phí bảo đảm trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành thuộc cơ quan, tổ chức thụ hưởng ngân sách nhà nước do ngân sách nhà nước bảo đảm và thực hiện theo quy định của pháp luật về ngân sách nhà nước.","y":"1. 사업장 자체 소방대, 전문 소방대에 비치하는 소방 및 구조·구난 장비·설비는 이 시행규칙에 첨부된 부록 I에 규정된 목록, 수량에 따른다.\n2. 사업장 대표자는 관리 범위에 속하는 사업장 자체 소방대, 전문 소방대에 대한 소방 및 구조·구난 장비·설비의 비치를 이 조 제1항의 규정에 따라 보장되도록 결정하거나 권한 있는 자에게 결정하도록 제안한다.\n사업장에서의 소방(화재예방·진압), 구조·구난 안전 확보 요구에 근거하여, 사업장 대표자는 관리 범위에 속하는 사업장 자체 소방대, 전문 소방대가 임무를 수행하도록 소방 및 구조·구난 장비·설비, 그 밖에 필요한 장비·기기의 수량, 종류를 추가로 비치할 것을 결정하거나 권한 있는 자에게 결정하도록 제안한다.\n3. 사업장 자체 소방대, 전문 소방대에 대한 소방 및 구조·구난 장비·설비의 비치를 보장하는 경비는 시행령 제105/2025/NĐ-CP호 제20조 제8항에 규정되어 있다.\n국가예산의 지원을 받는 기관, 조직에 속하는 사업장 자체 소방대, 전문 소방대에 대한 소방 및 구조·구난 장비·설비의 비치를 보장하는 경비는 국가예산으로 보장하며 국가예산에 관한 법령의 규정에 따라 시행한다.","o":[]},{"id":"tt36-5","d":"tt36","n":"5","t":"Địa điểm, nơi quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 장비·설비의 관리, 보관, 정비 장소","c":"제3장 소방 장비·설비의 관리·보관·정비","x":"1. Phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ được quản lý, bảo quản tại nhà, kho, bến, âu thuyền, bến cảng hoặc địa điểm khác do người có thẩm quyền quyết định và phải bảo đảm yêu cầu sau đây:\na) Nhà, kho để phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ phải có mái che, tường bao quanh, bảo đảm khô ráo, thoáng khí, sạch sẽ, bảo đảm an ninh, trật tự, có hệ thống thiết bị chiếu sáng, được trang bị phương tiện chữa cháy thông dụng;\nb) Bến, âu thuyền, bến cảng để phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ phải bảo đảm an ninh, trật tự, phòng cháy, chữa cháy.\n2. Xe chữa cháy, xe chuyên dùng phục vụ chữa cháy, cứu nạn, cứu hộ, máy bơm chữa cháy phải được để trong nhà, kho; tàu chữa cháy, xuồng, ca nô chữa cháy, cứu nạn, cứu hộ phải được neo đậu tại bến, bến cảng, địa điểm khác bảo đảm an ninh, trật tự, phòng cháy, chữa cháy. Các phương tiện chữa cháy, cứu nạn, cứu hộ khác phải được để ở địa điểm, nơi đáp ứng yêu cầu theo quy định tại khoản 1 và khoản 3 Điều này hoặc để trong các khoang chứa phương tiện của xe chữa cháy, xe chuyên dùng phục vụ chữa cháy, cứu nạn, cứu hộ, tàu chữa cháy, xuồng, ca nô chữa cháy, cứu nạn, cứu hộ bảo đảm sẵn sàng chữa cháy, cứu nạn, cứu hộ.\n3. Các phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ chưa sử dụng phải được bảo quản trong nhà, kho hoặc địa điểm, nơi quản lý phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ phù hợp với từng loại phương tiện.","y":"1. 소방 및 구조·구난 장비·설비는 건물, 창고, 선착장, 선거(船渠), 항만 부두 또는 권한 있는 자가 결정하는 그 밖의 장소에서 관리, 보관하며 다음의 요건을 충족하여야 한다:\na) 소방 및 구조·구난 장비·설비를 두는 건물, 창고는 지붕과 둘레 벽이 있어야 하고, 건조하고 통풍이 잘되며 청결하여야 하고, 안전(보안)·질서가 확보되어야 하며, 조명 설비 시스템이 있고, 일반 소화 기구가 비치되어 있어야 한다;\nb) 소방 및 구조·구난 장비·설비를 두는 선착장, 선거(船渠), 항만 부두는 안전(보안)·질서, 소방(화재예방·진압)이 확보되어야 한다.\n2. 소방차, 화재진압·구조구난용 특수차, 소방펌프는 건물, 창고 안에 두어야 한다; 소방선, 화재진압·구조구난용 소형 보트, 카누(모터보트)는 안전(보안)·질서, 소방(화재예방·진압)이 확보되는 선착장, 항만 부두, 그 밖의 장소에 정박시켜야 한다. 그 밖의 화재진압·구조구난 장비는 이 조 제1항 및 제3항의 규정에 따른 요건을 충족하는 장소에 두거나, 화재진압, 구조·구난 준비 태세가 확보되도록 소방차, 화재진압·구조구난용 특수차, 소방선, 화재진압·구조구난용 소형 보트, 카누(모터보트)의 장비 적재 칸에 두어야 한다.\n3. 아직 사용하지 아니한 소방 및 구조·구난 장비·설비는 각 장비·설비의 종류에 적합한 건물, 창고 또는 소방 및 구조·구난 장비·설비의 관리 장소에서 보관하여야 한다.","o":[]},{"id":"tt36-6","d":"tt36","n":"6","t":"Bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 장비·설비의 보관, 정비","c":"제3장 소방 장비·설비의 관리·보관·정비","x":"1. Bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ theo nội dung quy định tại khoản 3 Điều này và do người đứng đầu cơ sở quyết định về thời gian, địa điểm thực hiện việc bảo quản, bảo dưỡng phù hợp với từng loại phương tiện, hướng dẫn của nhà sản xuất (nếu có), bảo đảm phương tiện sẵn sàng chữa cháy, cứu nạn, cứu hộ.\nĐối với phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới, mặt nạ phòng độc cách ly được bảo quản, bảo dưỡng thường xuyên hằng ngày hoặc trong và sau mỗi lần sử dụng.\n2. Trường hợp phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ có tiêu chuẩn, quy chuẩn kỹ thuật quy định về việc bảo quản, bảo dưỡng thì thực hiện theo tiêu chuẩn, quy chuẩn kỹ thuật đó.\n3. Nội dung bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ thực hiện theo quy định tại các Phụ lục II, III, IV và Phụ lục V kèm theo Thông tư này và theo hướng dẫn của nhà sản xuất (nếu có).\n4. Kết thúc việc bảo quản, bảo dưỡng, người được phân công quản lý phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ phải ghi kết quả bảo quản, bảo dưỡng vào Sổ theo dõi phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ theo Mẫu số 01 Phụ lục VI kèm theo Thông tư này.\nSổ theo dõi phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ là tài liệu trong hồ sơ về phòng cháy, chữa cháy, cứu nạn, cứu hộ của cơ sở theo quy định.","y":"1. 소방 및 구조·구난 장비·설비의 보관, 정비는 이 조 제3항에 규정된 내용에 따르며, 보관, 정비를 실시하는 시간, 장소는 각 장비·설비의 종류, 제조자의 지침(있는 경우)에 적합하고 장비·설비가 화재진압, 구조·구난 준비 태세를 갖추도록 사업장 대표자가 결정한다.\n동력식 화재진압·구조구난 장비, 자급식 호흡기(격리식 방독면)는 매일 상시로 또는 매 사용 중과 사용 후에 보관, 정비한다.\n2. 소방 및 구조·구난 장비·설비에 대하여 보관, 정비에 관하여 규정하는 기술 표준·기술 규정이 있는 경우에는 그 기술 표준·기술 규정에 따라 시행한다.\n3. 소방 및 구조·구난 장비·설비의 보관, 정비 내용은 이 시행규칙에 첨부된 부록 II, III, IV 및 부록 V의 규정과 제조자의 지침(있는 경우)에 따라 시행한다.\n4. 보관, 정비를 마치면, 소방 및 구조·구난 장비·설비의 관리를 배정받은 자는 이 시행규칙에 첨부된 부록 VI의 서식 01에 따른 소방 및 구조·구난 장비·설비 관리대장에 보관, 정비 결과를 기록하여야 한다.\n소방 및 구조·구난 장비·설비 관리대장은 규정에 따른 사업장의 소방(화재예방·진압), 구조·구난 관련 서류철에 포함되는 자료이다.","o":[]},{"id":"tt36-7","d":"tt36","n":"7","t":"Thống kê, báo cáo công tác quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 장비·설비의 관리, 보관, 정비 업무의 통계, 보고","c":"제3장 소방 장비·설비의 관리·보관·정비","x":"Việc thống kê, báo cáo công tác quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ được lồng ghép trong Báo cáo kết quả thực hiện công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ của cơ sở theo Mẫu số PC04 Phụ lục VIII kèm theo Nghị định số 105/2025/NĐ-CP, bảo đảm các nội dung sau:\n1. Kết quả thực hiện việc quản lý, bảo quản, bảo dưỡng (số lượng, chất lượng, chủng loại, nội dung bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ đã trang bị).\n2. Kết quả thực hiện các yêu cầu, kiến nghị của cơ quan có thẩm quyền về việc quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ (nếu có).\n3. Đề xuất, kiến nghị giải pháp để nâng cao hiệu quả công tác quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ.","y":"소방 및 구조·구난 장비·설비의 관리, 보관, 정비 업무의 통계, 보고는 시행령 제105/2025/NĐ-CP호에 첨부된 부록 VIII의 서식 PC04에 따른 사업장의 소방(화재예방·진압), 구조·구난 업무 수행 결과 보고서에 통합하여 실시하며, 다음의 내용을 갖추어야 한다:\n1. 관리, 보관, 정비의 수행 결과(비치된 소방 및 구조·구난 장비·설비의 수량, 품질, 종류, 보관·정비 내용).\n2. 소방 및 구조·구난 장비·설비의 관리, 보관, 정비에 관한 권한 있는 기관의 요구, 권고 사항의 이행 결과(있는 경우).\n3. 소방 및 구조·구난 장비·설비의 관리, 보관, 정비 업무의 효과를 높이기 위한 해결책의 제안, 건의.","o":[]},{"id":"tt36-8","d":"tt36","n":"8","t":"Trách nhiệm của người đứng đầu cơ sở, chủ hộ gia đình, cá nhân trong quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 장비·설비의 관리, 보관, 정비에 있어서 사업장 대표자, 가구주, 개인의 책임","c":"제3장 소방 장비·설비의 관리·보관·정비","x":"1. Trách nhiệm của người đứng đầu cơ sở:\na) Tổ chức, chỉ đạo, kiểm tra việc thực hiện quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ thuộc phạm vi quản lý;\nb) Tổ chức cho cán bộ, nhân viên, người lao động thuộc phạm vi quản lý học tập, biết sử dụng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ trang bị;\nc) Phân công, xác định cụ thể trách nhiệm của người được phân công quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nd) Kiểm tra, xử lý hoặc kiến nghị cơ quan có thẩm quyền xử lý vi phạm trong quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật;\nđ) Bảo đảm kinh phí phục vụ công tác quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ trong phạm vi quản lý.\n2. Chủ hộ gia đình, cá nhân quy định tại khoản 2 Điều 43 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ tự bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ đã trang bị để bảo đảm sử dụng được phương tiện khi xảy ra cháy, tai nạn, sự cố.","y":"1. 사업장 대표자의 책임:\na) 관리 범위에 속하는 소방 및 구조·구난 장비·설비의 관리, 보관, 정비의 시행을 조직, 지휘, 점검한다;\nb) 관리 범위에 속하는 간부, 직원, 근로자가 비치된 소방 및 구조·구난 장비·설비를 학습하고 사용할 줄 알도록 조직한다;\nc) 소방 및 구조·구난 장비·설비의 관리, 보관, 정비를 배정받은 자의 책임을 배정하고 구체적으로 정한다;\nd) 소방 및 구조·구난 장비·설비의 관리, 보관, 정비에서의 위반을 법령의 규정에 따라 점검, 처리하거나 권한 있는 기관에 처리하도록 건의한다;\nđ) 관리 범위 내에서 소방 및 구조·구난 장비·설비의 관리, 보관, 정비 업무에 필요한 경비를 보장한다.\n2. 「소방 및 구조·구난법」 제43조 제2항에 규정된 가구주, 개인은 화재, 사고, 재난(사고) 발생 시 장비·설비를 사용할 수 있도록 비치한 소방 및 구조·구난 장비·설비를 스스로 보관, 정비한다.","o":[]},{"id":"tt36-9","d":"tt36","n":"9","t":"Thẩm quyền thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan Công an","k":"공안기관의 소방 설계 심사 권한","c":"제4장 공안기관의 소방 관리 권한 분담","x":"1. Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ thẩm định thiết kế về phòng cháy và chữa cháy đối với công trình quy định tại Phụ lục III kèm theo Nghị định số 105/2025/NĐ-CP, cụ thể:\na) Công trình thuộc thẩm quyền quyết định chủ trương đầu tư, chấp thuận chủ trương đầu tư của Quốc hội, Thủ tướng Chính phủ theo quy định của pháp luật về đầu tư, pháp luật về đầu tư công, pháp luật về đầu tư theo phương thức đối tác công tư;\nb) Công trình thuộc dự án có công trình cấp đặc biệt theo quy định của pháp luật về xây dựng;\nc) Công trình trụ sở, nhà làm việc của các đơn vị thuộc cơ quan Bộ Công an, công trình thuộc dự án có công trình cấp I khi có đề nghị của chủ đầu tư, chủ sở hữu công trình;\nd) Công trình xây dựng trên địa bàn hành chính từ 02 tỉnh, thành phố trực thuộc trung ương trở lên;\nđ) Công trình dân dụng có chiều cao phòng cháy và chữa cháy trên 150 m;\ne) Công trình có quy mô lớn, kỹ thuật phức tạp thuộc danh mục theo quy định của pháp luật về xây dựng;\ng) Công trình sử dụng công nghệ, thiết bị, hệ thống phòng cháy và chữa cháy mà Việt Nam chưa có tiêu chuẩn, quy chuẩn kỹ thuật.\n2. Phòng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ Công an cấp tỉnh thẩm định thiết kế về phòng cháy và chữa cháy đối với công trình, phương tiện giao thông, cụ thể:\na) Công trình quy định tại Phụ lục III kèm theo Nghị định số 105/2025/NĐ-CP trên địa bàn quản lý, trừ các công trình quy định tại khoản 1 Điều này;\nb) Phương tiện giao thông quy định tại Phụ lục III kèm theo Nghị định số 105/2025/NĐ-CP của cơ quan, tổ chức, cá nhân có trụ sở, văn phòng đại diện, chi nhánh, có đăng ký kinh doanh hoặc sản xuất, lắp ráp, đóng mới, hoán cải trên địa bàn quản lý;\nc) Công trình trên địa bàn quản lý đã được Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy mà trong quá trình sử dụng thay đổi công năng hoặc cải tạo làm thay đổi điều kiện an toàn phòng cháy và chữa cháy theo quy định tại khoản 3 Điều 9 Nghị định số 105/2025/NĐ-CP.","y":"1. 소방·구조구난 경찰국은 시행령 제105/2025/NĐ-CP호에 첨부된 부록 III에 규정된 건축물에 대하여 소방 설계 심사를 하며, 구체적으로는 다음과 같다:\na) 투자에 관한 법령, 공공투자에 관한 법령, 민관협력 방식 투자에 관한 법령의 규정에 따라 국회, 정부 총리의 투자 방침 결정, 투자 방침 승인 권한에 속하는 건축물;\nb) 건설에 관한 법령의 규정에 따른 특급 건축물이 있는 프로젝트에 속하는 건축물;\nc) 공안부 본부 소속 단위의 청사, 업무용 건물 건축물, 발주자(투자자), 건축물 소유자의 요청이 있는 경우 I급 건축물이 있는 프로젝트에 속하는 건축물;\nd) 02개 이상의 성, 중앙직할시의 행정구역에 걸쳐 건설되는 건축물;\nđ) 소방 높이가 150 m를 초과하는 민간용(민용) 건축물;\ne) 건설에 관한 법령의 규정에 따른 목록에 속하는 대규모이고 기술이 복잡한 건축물;\ng) 베트남에 아직 기술 표준·기술 규정이 없는 소방 기술, 설비, 시스템을 사용하는 건축물.\n2. 성급 공안 소방·구조구난 경찰과는 건축물, 교통수단에 대하여 소방 설계 심사를 하며, 구체적으로는 다음과 같다:\na) 관할 지역 내에 있는 시행령 제105/2025/NĐ-CP호에 첨부된 부록 III에 규정된 건축물. 다만, 이 조 제1항에 규정된 건축물은 제외한다;\nb) 관할 지역 내에 본사, 대표사무소, 지점이 있거나, 사업자등록이 되어 있거나 또는 생산, 조립, 신조, 개조를 하는 기관, 조직, 개인의 시행령 제105/2025/NĐ-CP호에 첨부된 부록 III에 규정된 교통수단;\nc) 관할 지역 내의 건축물로서 소방·구조구난 경찰국이 소방 준공검사(인수검사) 결과를 승인하였으나 사용 과정에서 시행령 제105/2025/NĐ-CP호 제9조 제3항의 규정에 따라 용도를 변경하거나 개조하여 소방 안전 조건을 변경시키는 건축물.","o":[["Điều 9 được sửa đổi, bổ sung bởi Điều 8 Thông tư số 62/2026/TT-BCA","tt62-8"]]},{"id":"tt36-10","d":"tt36","n":"10","t":"Thẩm quyền quản lý, kiểm tra về phòng cháy, chữa cháy của cơ quan Công an","k":"공안기관의 소방 관리, 점검(검사) 권한","c":"제4장 공안기관의 소방 관리 권한 분담","x":"Phòng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ Công an cấp tỉnh quản lý về phòng cháy, chữa cháy đối với cơ sở thuộc Phụ lục II kèm theo Nghị định số 105/202 5/NĐ-CP; thực hiện kiểm tra định kỳ, đột xuất về phòng cháy, chữa cháy đối với cơ sở, công trình, phương tiện quy định tại điểm a khoản 2 Điều 13 Nghị định số 105/2025/NĐ-CP theo trình tự, thủ tục quy định tại khoản 3 Điều 14 Nghị định số 105/2025/NĐ-CP.","y":"성급 공안 소방·구조구난 경찰과는 시행령 제105/202 5/NĐ-CP호에 첨부된 부록 II에 속하는 사업장에 대하여 소방을 관리한다; 시행령 제105/2025/NĐ-CP호 제13조 제2항 a호에 규정된 사업장, 건축물, 교통수단에 대하여 시행령 제105/2025/NĐ-CP호 제14조 제3항에 규정된 절차에 따라 소방에 관한 정기, 수시 점검(검사)을 실시한다.","o":[]},{"id":"tt36-11","d":"tt36","n":"11","t":"Thẩm quyền cấp giấy phép lưu thông đối với phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 장비·설비에 대한 유통 허가증 발급 권한","c":"제4장 공안기관의 소방 관리 권한 분담","x":"Phòng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ Công an cấp tỉnh cấp giấy phép lưu thông đối với phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ quy định tại Mục 1 Phụ lục V kèm theo Nghị định số 105/2025/NĐ-CP.","y":"성급 공안 소방·구조구난 경찰과는 시행령 제105/2025/NĐ-CP호에 첨부된 부록 V 제1절에 규정된 소방 및 구조·구난 장비·설비에 대하여 유통 허가증을 발급한다.","o":[]},{"id":"tt36-12","d":"tt36","n":"12","t":"Thẩm quyền xây dựng, phê duyệt phương án chữa cháy, cứu nạn, cứu hộ, phương án cứu nạn, cứu hộ của cơ quan Công an","k":"공안기관의 화재진압·구조구난 계획(방안), 구조·구난 계획(방안)의 수립, 승인 권한","c":"제4장 공안기관의 소방 관리 권한 분담","x":"Phòng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ Công an cấp tỉnh có trách nhiệm tổ chức xây dựng và phê duyệt phương án chữa cháy, cứu nạn, cứu hộ, phương án cứu nạn, cứu hộ của cơ quan Công an quy định tại khoản 3 và khoản 4 Điều 15 Nghị định số 105/2025/NĐ-CP.\nSau khi phương án chữa cháy, cứu nạn, cứu hộ của cơ quan Công an được phê duyệt, đơn vị trực tiếp xây dựng phương án có trách nhiệm xây dựng Phiếu chiến thuật chữa cháy, cứu nạn, cứu hộ theo Mẫu số 02 Phụ lục VI kèm theo Thông tư này.","y":"성급 공안 소방·구조구난 경찰과는 시행령 제105/2025/NĐ-CP호 제15조 제3항 및 제4항에 규정된 공안기관의 화재진압·구조구난 계획(방안), 구조·구난 계획(방안)의 수립을 조직하고 승인할 책임이 있다.\n공안기관의 화재진압·구조구난 계획(방안)이 승인된 후, 계획(방안)을 직접 수립한 단위는 이 시행규칙에 첨부된 부록 VI의 서식 02에 따른 화재진압·구조구난 전술 카드를 작성할 책임이 있다.","o":[]},{"id":"tt36-13","d":"tt36","n":"13","t":"Huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방(화재예방·진압), 구조·구난 직무 훈련·교육","c":"제4장 공안기관의 소방 관리 권한 분담","x":"1. Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ chủ trì, phối hợp với trường Đại học Phòng cháy chữa cháy và đơn vị liên quan xây dựng khung chương trình, biên soạn tài liệu huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ và phát hành đến Công an các đơn vị, địa phương.\n2. Thẩm quyền huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ:\na) Cơ sở đào tạo về phòng cháy, chữa cháy, cứu nạn, cứu hộ: huấn luyện nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ cho người được phân công thực hiện kiểm tra về phòng cháy, chữa cháy tại các cơ sở thuộc nhóm 1 Phụ lục II kèm theo Nghị định số 105/2025/NĐ-CP; huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ cho Chủ tịch, Phó Chủ tịch Ủy ban nhân dân cấp xã và cho đối tượng quy định tại điểm b khoản này khi có đề nghị; bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ cho người được phân công thực hiện kiểm tra về phòng cháy, chữa cháy tại các cơ sở thuộc nhóm 1 Phụ lục II kèm theo Nghị định số 105/2025/NĐ-CP khi có đề nghị;\nb) Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ cho đối tượng quy định tại các điểm c, d, đ, e, g và điểm i khoản 1 Điều 45 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ thuộc cơ quan Đảng, nhà nước ở trung ương, tập đoàn kinh tế, tổng công ty khi có đề nghị, trừ người được phân công thực hiện kiểm tra về phòng cháy, chữa cháy tại cơ sở thuộc nhóm 1 Phụ lục II kèm theo Nghị định số 105/2025/NĐ-CP do cơ sở đào tạo về phòng cháy, chữa cháy, cứu nạn, cứu hộ huấn luyện và thành viên Đội dân phòng;\nc) Phòng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ Công an cấp tỉnh: huấn luyện nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ cho đối tượng quy định tại khoản 1 Điều 45 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ khi có đề nghị, trừ người được phân công thực hiện kiểm tra về phòng cháy, chữa cháy tại cơ sở thuộc nhóm 1 Phụ lục II kèm theo Nghị định số 105/2025/NĐ-CP do cơ sở đào tạo về phòng cháy, chữa cháy, cứu nạn, cứu hộ huấn luyện; bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ cho đối tượng quy định tại khoản 1 Điều 45 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ khi có đề nghị.\nTrường hợp khi có đề nghị tổ chức huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ cho cá nhân là đối tượng được huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ thuộc cơ sở do Ủy ban nhân dân cấp xã quản lý, Trưởng thôn, Tổ trưởng tổ dân phố, thành viên Đội dân phòng thuộc phạm vi quản lý của Ủy ban nhân dân cấp xã thì Phòng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ Công an cấp tỉnh chủ trì, phối hợp với Công an cấp xã để tổ chức thực hiện.\n3. Tổ chức huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ:\na) Ủy ban nhân dân cấp xã, cơ sở thuộc nhóm 1 Phụ lục II kèm theo Nghị định số 105/2025/NĐ-CP đăng ký với cơ quan, đơn vị có thẩm quyền quy định tại điểm a hoặc điểm c khoản 2 Điều này để tổ chức huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ cho Chủ tịch, Phó Chủ tịch Ủy ban nhân dân cấp xã, người được phân công thực hiện kiểm tra về phòng cháy, chữa cháy tại cơ sở;\nb) Cơ quan, tổ chức, cá nhân đăng ký với cơ quan, đơn vị có thẩm quyền quy định tại điểm b hoặc điểm c khoản 2 Điều này để tổ chức huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ cho đối tượng thuộc phạm vi quản lý;\nc) Cơ quan, đơn vị có thẩm quyền quy định tại khoản 2 Điều này có trách nhiệm: bố trí địa điểm, nơi tổ chức huấn luyện, bồi dưỡng để thuận tiện về thời gian, đi lại cho đối tượng được huấn luyện, bồi dưỡng; thực hiện huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ, kiểm tra và có văn bản thông báo kết quả huấn luyện, bồi dưỡng cho cơ quan, tổ chức, cá nhân đã đăng ký, có tham gia huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ.","y":"1. 소방·구조구난 경찰국은 소방대학교(Đại học Phòng cháy chữa cháy) 및 관련 단위와 협력하여 주관하여 소방(화재예방·진압), 구조·구난 직무 훈련·교육의 프로그램 기본 틀을 수립하고 교재를 편찬하여 각 단위, 지방의 공안에 배포한다.\n2. 소방(화재예방·진압), 구조·구난 직무 훈련·교육의 권한:\na) 소방(화재예방·진압), 구조·구난 교육훈련 기관: 시행령 제105/2025/NĐ-CP호에 첨부된 부록 II 제1그룹에 속하는 사업장에서 소방 점검(검사)의 실시를 배정받은 자에 대하여 소방(화재예방·진압), 구조·구난 직무 훈련을 한다; 요청이 있는 경우 사(면)급 인민위원회 위원장, 부위원장 및 이 항 b호에 규정된 대상에 대하여 소방(화재예방·진압), 구조·구난 직무 훈련·교육을 한다; 요청이 있는 경우 시행령 제105/2025/NĐ-CP호에 첨부된 부록 II 제1그룹에 속하는 사업장에서 소방 점검(검사)의 실시를 배정받은 자에 대하여 소방(화재예방·진압), 구조·구난 직무 교육(보수교육)을 한다;\nb) 소방·구조구난 경찰국은 요청이 있는 경우 중앙의 당·국가 기관, 경제 그룹(기업집단), 총공사에 속하는 「소방 및 구조·구난법」 제45조 제1항 c호, d호, đ호, e호, g호 및 i호에 규정된 대상에 대하여 소방(화재예방·진압), 구조·구난 직무 훈련·교육을 한다. 다만, 소방(화재예방·진압), 구조·구난 교육훈련 기관이 훈련하는 시행령 제105/2025/NĐ-CP호에 첨부된 부록 II 제1그룹에 속하는 사업장에서 소방 점검(검사)의 실시를 배정받은 자 및 민방위 소방대 대원은 제외한다;\nc) 성급 공안 소방·구조구난 경찰과: 요청이 있는 경우 「소방 및 구조·구난법」 제45조 제1항에 규정된 대상에 대하여 소방(화재예방·진압), 구조·구난 직무 훈련을 한다. 다만, 소방(화재예방·진압), 구조·구난 교육훈련 기관이 훈련하는 시행령 제105/2025/NĐ-CP호에 첨부된 부록 II 제1그룹에 속하는 사업장에서 소방 점검(검사)의 실시를 배정받은 자는 제외한다; 요청이 있는 경우 「소방 및 구조·구난법」 제45조 제1항에 규정된 대상에 대하여 소방(화재예방·진압), 구조·구난 직무 교육(보수교육)을 한다.\n사(면)급 인민위원회가 관리하는 사업장에 속하는 소방(화재예방·진압), 구조·구난 직무 훈련·교육 대상인 개인, 사(면)급 인민위원회의 관리 범위에 속하는 촌장, 주민조(tổ dân phố) 조장, 민방위 소방대 대원에 대하여 소방(화재예방·진압), 구조·구난 직무 훈련·교육의 실시 요청이 있는 경우에는 성급 공안 소방·구조구난 경찰과가 주관하고 사(면)급 공안과 협력하여 실시한다.\n3. 소방(화재예방·진압), 구조·구난 직무 훈련·교육의 실시:\na) 사(면)급 인민위원회, 시행령 제105/2025/NĐ-CP호에 첨부된 부록 II 제1그룹에 속하는 사업장은 사(면)급 인민위원회 위원장, 부위원장, 사업장에서 소방 점검(검사)의 실시를 배정받은 자에 대한 소방(화재예방·진압), 구조·구난 직무 훈련·교육을 실시하기 위하여 이 조 제2항 a호 또는 c호에 규정된 권한 있는 기관, 단위에 등록한다;\nb) 기관, 조직, 개인은 관리 범위에 속하는 대상에 대한 소방(화재예방·진압), 구조·구난 직무 훈련·교육을 실시하기 위하여 이 조 제2항 b호 또는 c호에 규정된 권한 있는 기관, 단위에 등록한다;\nc) 이 조 제2항에 규정된 권한 있는 기관, 단위는 다음의 책임이 있다: 훈련·교육 대상자의 시간, 이동에 편리하도록 훈련·교육을 실시하는 장소를 마련한다; 소방(화재예방·진압), 구조·구난 직무 훈련·교육을 실시하고, 평가(시험)하며, 등록하고 소방(화재예방·진압), 구조·구난 직무 훈련·교육에 참가한 기관, 조직, 개인에게 훈련·교육 결과를 서면으로 통보한다.","o":[]},{"id":"tt36-14","d":"tt36","n":"14","t":"Hiệu lực thi hành","k":"시행일(효력)","c":"제5장 시행 조항","x":"1. Thông tư này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2025.\n2. Các Thông tư sau đây hết hiệu lực kể từ ngày Thông tư này có hiệu lực thi hành, trừ trường hợp quy định tại khoản 3 Điều này:\na) Thông tư số 17/2021/TT-BCA ngày 05 tháng 02 năm 2021 của Bộ trưởng Bộ Công an quy định về quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy và cứu nạn, cứu hộ;\nb) Thông tư số 150/2020/TT-BCA ngày 31 tháng 12 năm 2020 của Bộ trưởng Bộ Công an quy định về trang bị phương tiện phòng cháy, chữa cháy và cứu nạn, cứu hộ cho lực lượng dân phòng, lực lượng phòng cháy và chữa cháy cơ sở, lực lượng phòng cháy và chữa cháy chuyên ngành, được sửa đổi, bổ sung theo quy định tại Thông tư số 55/2024/TT-BCA ngày 31 tháng 10 năm 2024 của Bộ trưởng Bộ Công an sửa đổi, bổ sung một số điều của Thông tư số 141/2020/TT-BCA ngày 23 tháng 12 năm 2020 của Bộ trưởng Bộ Công an quy định công tác kiểm tra về phòng cháy, chữa cháy và cứu nạn, cứu hộ của lực lượng Công an nhân dân; Thông tư số 150/2020/TT-BCA ngày 31 tháng 12 năm 2020 của Bộ trưởng Bộ Công an quy định về trang bị phương tiện phòng cháy, chữa cháy và cứu nạn, cứu hộ cho lực lượng dân phòng, lực lượng phòng cháy và chữa cháy cơ sở, lực lượng phòng cháy và chữa cháy chuyên ngành; Thông tư số 82/2021/TT-BCA ngày 06 tháng 8 năm 2021 của Bộ trưởng Bộ Công an quy định về tiêu chuẩn, nhiệm vụ, tập huấn, kiểm tra nghiệp vụ thẩm duyệt thiết kế, nghiệm thu về phòng cháy và chữa cháy của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ; Thông tư số 06/2022/TT-BCA ngày 17 tháng 01 năm 2022 của Bộ trưởng Bộ Công an quy định quy trình thực hiện nhiệm vụ công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ trong Công an nhân dân;\nc) Thông tư số 149/2020/TT-BCA ngày 31 tháng 12 năm 2020 của Bộ trưởng Bộ Công an quy định chi tiết một số điều và biện pháp thi hành Luật Phòng cháy và chữa cháy và Luật sửa đổi, bổ sung một số điều của Luật Phòng cháy và chữa cháy và Nghị định số 136/2020/NĐ-CP ngày 24 tháng 11 năm 2020 của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật Phòng cháy và chữa cháy và Luật sửa đổi, bổ sung một số điều của Luật Phòng cháy và chữa cháy;\nd) Thông tư số 32/2024/TT-BCA ngày 10 tháng 7 năm 2024 của Bộ trưởng Bộ Công an sửa đổi, bổ sung một số điều của Thông tư số 149/2020/TT-BCA ngày 31 tháng 12 năm 2020 của Bộ trưởng Bộ Công an quy định chi tiết một số điều và biện pháp thi hành Luật Phòng cháy và chữa cháy và Luật sửa đổi, bổ sung một số điều của Luật Phòng cháy và chữa cháy và Nghị định số 136/2020/NĐ-CP ngày 24 tháng 11 năm 2020 của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật Phòng cháy và chữa cháy và Luật sửa đổi, bổ sung một số điều của Luật Phòng cháy và chữa cháy và Thông tư số 08/2018/TT-BCA ngày 05 tháng 3 năm 2018 của Bộ trưởng Bộ Công an quy định chi tiết một số điều của Nghị định số 83/2017/NĐ-CP ngày 18 tháng 7 năm 2017 của Chính phủ quy định về công tác cứu nạn, cứu hộ của lực lượng phòng cháy và chữa cháy.\n3. Tem kiểm định phương tiện phòng cháy và chữa cháy theo Mẫu số 03 quy định tại Phụ lục ban hành kèm theo Thông tư số 149/2020/TT-BCA và việc quản lý, sử dụng, in, phát hành tem kiểm định phương tiện phòng cháy và chữa cháy theo quy định tại khoản 6 Điều 1 Thông tư số 32/2024/TT-BCA được tiếp tục thực hiện đến hết ngày 30 tháng 6 năm 2026.","y":"1. 이 시행규칙은 2025년 7월 01일부터 시행한다.\n2. 다음의 시행규칙은 이 시행규칙의 시행일부터 효력을 상실한다. 다만, 이 조 제3항에 규정된 경우는 제외한다:\na) 소방 및 구조·구난 장비·설비의 관리, 보관, 정비에 관하여 규정하는 공안부 장관의 2021년 02월 05일자 시행규칙 제17/2021/TT-BCA호;\nb) 민방위 소방대, 사업장 자체 소방대, 전문 소방대에 대한 소방 및 구조·구난 장비·설비의 비치에 관하여 규정하는 공안부 장관의 2020년 12월 31일자 시행규칙 제150/2020/TT-BCA호로서, 인민공안의 소방 및 구조·구난 점검(검사) 업무를 규정하는 공안부 장관의 2020년 12월 23일자 시행규칙 제141/2020/TT-BCA호; 민방위 소방대, 사업장 자체 소방대, 전문 소방대에 대한 소방 및 구조·구난 장비·설비의 비치에 관하여 규정하는 공안부 장관의 2020년 12월 31일자 시행규칙 제150/2020/TT-BCA호; 소방경찰(소방·구조구난 경찰)의 소방 설계 심사승인, 준공검사(인수검사)의 기준, 임무, 직무 연수, 직무 평가에 관하여 규정하는 공안부 장관의 2021년 8월 06일자 시행규칙 제82/2021/TT-BCA호; 인민공안 내 소방(화재예방·진압), 구조·구난 업무 임무의 수행 절차를 규정하는 공안부 장관의 2022년 01월 17일자 시행규칙 제06/2022/TT-BCA호의 일부 조항을 개정·보충하는 공안부 장관의 2024년 10월 31일자 시행규칙 제55/2024/TT-BCA호의 규정에 따라 개정·보충된 것;\nc) 「소방법(화재예방 및 진압법)」 및 「소방법(화재예방 및 진압법)」의 일부 조항을 개정·보충하는 법과, 「소방법(화재예방 및 진압법)」 및 「소방법(화재예방 및 진압법)」의 일부 조항을 개정·보충하는 법의 일부 조항과 시행 조치를 상세히 규정하는 정부의 2020년 11월 24일자 시행령 제136/2020/NĐ-CP호의 일부 조항과 시행 조치를 상세히 규정하는 공안부 장관의 2020년 12월 31일자 시행규칙 제149/2020/TT-BCA호;\nd) 「소방법(화재예방 및 진압법)」 및 「소방법(화재예방 및 진압법)」의 일부 조항을 개정·보충하는 법과, 「소방법(화재예방 및 진압법)」 및 「소방법(화재예방 및 진압법)」의 일부 조항을 개정·보충하는 법의 일부 조항과 시행 조치를 상세히 규정하는 정부의 2020년 11월 24일자 시행령 제136/2020/NĐ-CP호의 일부 조항과 시행 조치를 상세히 규정하는 공안부 장관의 2020년 12월 31일자 시행규칙 제149/2020/TT-BCA호 및 소방대의 구조·구난 업무에 관하여 규정하는 정부의 2017년 7월 18일자 시행령 제83/2017/NĐ-CP호의 일부 조항을 상세히 규정하는 공안부 장관의 2018년 3월 05일자 시행규칙 제08/2018/TT-BCA호의 일부 조항을 개정·보충하는 공안부 장관의 2024년 7월 10일자 시행규칙 제32/2024/TT-BCA호.\n3. 시행규칙 제149/2020/TT-BCA호에 첨부하여 공포된 부록에 규정된 서식 03에 따른 소방 장비·설비 검정 스티커(검정필증) 및 시행규칙 제32/2024/TT-BCA호 제1조 제6항의 규정에 따른 소방 장비·설비 검정 스티커(검정필증)의 관리, 사용, 인쇄, 발행은 2026년 6월 30일까지 계속 시행한다.","o":[]},{"id":"tt36-15","d":"tt36","n":"15","t":"Trách nhiệm thi hành","k":"시행 책임","c":"제5장 시행 조항","x":"1. Cục trưởng Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ có trách nhiệm theo dõi, hướng dẫn, kiểm tra, đôn đốc việc thực hiện Thông tư này.\n2. Công an tỉnh, thành phố trực thuộc trung ương có trách nhiệm tham mưu cho Ủy ban nhân dân cùng cấp ban hành quy chế về quản lý, sử dụng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng dân phòng trên địa bàn thuộc phạm vi quản lý với các nội dung: nguyên tắc quản lý, sử dụng phương tiện; trách nhiệm của Ủy ban nhân dân cấp xã, thành viên Đội dân phòng trong việc trang bị, quản lý, sử dụng phương tiện; điều kiện, trách nhiệm của người được phân công quản lý kho, nơi bảo quản phương tiện; các nội dung khác có liên quan.\n3. Thủ trưởng đơn vị thuộc cơ quan Bộ, Giám đốc Công an tỉnh, thành phố trực thuộc trung ương và tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này.\n4. Đề nghị Thủ trưởng các bộ, cơ quan ngang bộ, cơ quan thuộc Chính phủ, Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương trong phạm vi chức năng, nhiệm vụ, quyền hạn của mình phối hợp với Bộ Công an trong việc quản lý, kiểm tra việc thực hiện công tác quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ của cơ quan, tổ chức do bộ, ngành, địa phương mình quản lý.\nTrong quá trình thực hiện Thông tư này, nếu có khó khăn, vướng mắc, Công an các đơn vị, địa phương, cơ quan, tổ chức, cá nhân có liên qu
