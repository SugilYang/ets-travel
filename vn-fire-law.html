67-74","d":"nd67","n":"74","t":"Trách nhiệm của cơ quan, tổ chức và cá nhân có cơ sở có nguy hiểm về cháy, nổ","k":"화재·폭발 위험 사업장을 보유한 기관, 조직 및 개인의 책임","c":"제5장 시행 조직","x":"Xác định hạng nguy hiểm cháy, nổ A, B, C, D, E của cơ sở sản xuất công nghiệp đối với cơ sở có nguy hiểm về cháy, nổ theo quy định của pháp luật phòng cháy và chữa cháy.","y":"소방 법령의 규정에 따라 화재·폭발 위험 사업장에 대하여 공업 생산 사업장의 화재·폭발 위험 등급 A, B, C, D, E를 확정한다.","o":[]}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const DOCS = D.docs, ITEMS = D.items, BYID = {};
ITEMS.forEach(it => BYID[it.id] = it);
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 검색용 정규화: 소문자 + 베트남어 성조 제거
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').normalize('NFC');
const SYN = {'벌금':['과태료'],'비상구':['피난구','피난로'],'대피':['피난'],'스프링클러':['sprinkler','자동 소화'],'소방서':['소방경찰','공안기관'],
  '경보':['화재경보'],'소방훈련':['훈련','실습'],'영업정지':['정지'],'검사':['점검','검사'],'소방대':['소방대'],'허가':['심사','준공검사']};
const QUICK = ['사업장 대표자 책임','소화기','피난로','화재경보','자체 점검','훈련','사업장 자체 소방대','과태료','정지','의무보험','설계 심사','준공검사','전기','창고','공단'];
const label = it => it.n.startsWith('PL') ? '부록 ' + it.n.slice(2) : '제' + it.n + '조';
let curDoc = '';

ITEMS.forEach(it => { it.h = norm([it.k, it.y, it.t, it.x].join('\n')); it.hk = norm(it.k + ' ' + it.t); });

function terms(q) {
  return q.trim().split(/\s+/).filter(Boolean).map(w => [w].concat(SYN[w] || []).map(norm));
}
function hl(text, ts) {
  let out = esc(text);
  ts.flat().sort((a, b) => b.length - a.length).forEach(t => {
    if (!/[가-힣]/.test(t) && t.length < 2) return;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    out = out.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, txt) => tag || txt.replace(re, x => '<mark>' + x + '</mark>'));
  });
  return out;
}
function search() {
  const q = $('q').value, ts = terms(q);
  $('home').hidden = !!(ts.length || curDoc);
  if (!ts.length && !curDoc) { $('results').innerHTML = ''; $('count').textContent = ''; return; }
  let res = [];
  for (const it of ITEMS) {
    if (curDoc && it.d !== curDoc) continue;
    let score = 0, ok = true;
    for (const alts of ts) {
      const inTitle = alts.some(a => it.hk.includes(a)), inBody = alts.some(a => it.h.includes(a));
      if (!inBody) { ok = false; break; }
      score += inTitle ? 10 : 1;
    }
    if (ok) res.push([score, it]);
  }
  if (ts.length) res.sort((a, b) => b[0] - a[0]);
  $('count').textContent = (curDoc ? DOCS[curDoc].ko + ' · ' : '') + res.length + '건';
  $('results').innerHTML = res.slice(0, 300).map(([, it]) => {
    let snip = '';
    if (ts.length) {
      const ls = it.y.split('\n'), i = ls.findIndex(l => ts.some(alts => alts.some(a => norm(l).includes(a))));
      const vs = it.x.split('\n'), j = i < 0 ? vs.findIndex(l => ts.some(alts => alts.some(a => norm(l).includes(a)))) : -1;
      const line = i >= 0 ? ls[i] : j >= 0 ? vs[j] : '';
      snip = line ? '<div class="snip">' + hl(line.length > 220 ? line.slice(0, 220) + '…' : line, ts) + '</div>' : '';
    }
    return '<button class="card" data-id="' + it.id + '"><span class="tag">' + esc(DOCS[it.d].short) + '</span>' + (it.o.length ? '<span class="tag am">개정 표시</span>' : '') +
      '<b>' + label(it) + ' ' + hl(it.k, ts) + '</b><div class="vi">' + esc(it.t) + '</div>' + snip + '</button>';
  }).join('');
}
function noteKind(s) {
  return /bãi bỏ/.test(s) ? '삭제' : /thay thế/.test(s) ? '대체' : /hướng dẫn|quy định chi tiết/.test(s) ? '세부지침' : /sửa đổi/.test(s) ? '개정' : /bổ sung/.test(s) ? '신설' : '참고';
}
function show(id) {
  const it = BYID[id];
  if (!it) return home();
  const doc = DOCS[it.d], ko = it.y.split('\n'), vi = it.x.split('\n');
  const notes = it.o.length ? '<div class="notes"><b>이 조문의 개정·관련 표시</b> (아래 본문은 개정 전 원문일 수 있으니 반드시 함께 확인)' +
    it.o.map(([s, ref]) => '<div>[' + noteKind(s) + '] ' + esc(s) + (ref && BYID[ref] ? '<button data-id="' + ref + '">개정 조문 보기</button>' : '') + '</div>').join('') + '</div>' : '';
  $('view').innerHTML = '<button class="back" id="back">← 목록으로</button><div class="art" id="art">' +
    '<span class="tag">' + esc(doc.short) + '</span><div class="where">' + esc(doc.ko) + (it.c ? ' · ' + esc(it.c) : '') + '</div>' +
    '<h2>' + label(it) + ' ' + esc(it.k) + '</h2><div class="vt">' + (it.n.startsWith('PL') ? 'Phụ lục ' + it.n.slice(2) : 'Điều ' + it.n) + '. ' + esc(it.t) + '</div>' + notes +
    '<div class="tools"><button class="chip" id="tvi">베트남어 원문 함께 보기</button></div>' +
    ko.map((l, i) => '<div class="ln">' + esc(l) + '<div class="v" lang="vi">' + esc(vi[i] || '') + '</div></div>').join('') +
    '<div class="src">출처: ' + esc(doc.vi) + ' — <a href="' + doc.url + '" target="_blank" rel="noopener">원문 페이지</a><br>' + esc(doc.info) + '</div></div>';
  $('list').hidden = true; $('view').hidden = false;
  if (localStorage.getItem('showvi') === '1') { $('art').classList.add('showvi'); $('tvi').classList.add('on'); }
  window.scrollTo(0, 0);
}
function home() { $('view').hidden = true; $('list').hidden = false; }
function route() { const id = decodeURIComponent(location.hash.slice(1)); id ? show(id) : home(); }

$('quick').innerHTML = QUICK.map(w => '<button class="chip" data-q="' + w + '">' + w + '</button>').join('');
$('docs').innerHTML = '<button class="chip on" data-doc="">전체</button>' + Object.keys(DOCS).map(k => '<button class="chip" data-doc="' + k + '">' + esc(DOCS[k].short) + '</button>').join('');
$('home').innerHTML = '<div class="label">수록 법령 (' + ITEMS.length + '개 조문·부록, 기준일 ' + D.asof + ')</div>' +
  Object.keys(DOCS).map(k => '<div class="doc"><b>' + esc(DOCS[k].ko) + '</b><small lang="vi">' + esc(DOCS[k].vi) + '</small><small>' + esc(DOCS[k].info) + ' · ' + ITEMS.filter(i => i.d === k).length + '개 항목</small></div>').join('') +
  '<div class="label">수록하지 않은 관련 기준 (명칭만 안내)</div><ul class="refs">' + D.refs.map(r => '<li>' + esc(r) + '</li>').join('') + '</ul>' +
  '<div class="warn"><b>이용 안내</b><br>· 베트남어 원문은 법령 원문을 그대로 수록했고, 한국어는 참고용 번역입니다. 법적 효력은 베트남어 원문에만 있습니다.<br>' +
  '· 「개정 표시」가 붙은 조문은 본문이 개정 전 내용일 수 있습니다. 표시에 연결된 개정 시행령 조문을 함께 읽어야 현행 내용이 됩니다.<br>' +
  '· 기준일 이후의 개정은 반영되지 않습니다. 행정처분 대응·계약·허가 등 실제 판단은 현지 변호사 또는 관할 소방경찰(공안)에 확인하십시오.</div>';

$('q').addEventListener('input', search);
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.id) location.hash = b.dataset.id;
  else if (b.dataset.q) { $('q').value = b.dataset.q; search(); }
  else if ('doc' in b.dataset) { curDoc = b.dataset.doc; document.querySelectorAll('#docs .chip').forEach(c => c.classList.toggle('on', c === b)); search(); }
  else if (b.id === 'back') { location.hash = ''; }
  else if (b.id === 'tvi') { const on = $('art').classList.toggle('showvi'); b.classList.toggle('on', on); localStorage.setItem('showvi', on ? '1' : '0'); }
});
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
