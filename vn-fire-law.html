수조, 수조, 못, 호수, 강, 개울, 수로 또는 그 밖의 기존 수원에서 취수한다.\n2. 집중 급수 계통에는 화재진압용 급수 요건을 충족하도록 기술 표준·기술 규정에 따라 소화전을 배치한다. 공안기관이 화재진압 및 화재진압·구조구난 계획(방안) 훈련(실습)을 위하여 사용하는 집중 급수 계통의 물 사용 비용은 국가예산에서 지급한다.\n3. 도시, 집중 주거 지역 내 저수조, 수조, 못, 호수, 강, 개울, 수로 구역에는 소방차, 소방펌프가 화재진압용 물을 취수할 수 있는 지점·정박장(취수장)을 배치한다.\n4. 정부는 소화전의 투자, 관리, 유지보수, 정비 책임; 소방차, 소방펌프가 화재진압용 물을 취수하는 지점·정박장(취수장)의 투자, 관리 책임에 관하여 규정한다.","o":[]},{"id":"law-28","d":"law","n":"28","t":"Người chỉ huy chữa cháy","k":"화재진압 지휘자","c":"제3장 화재진압","x":"1. Người có chức vụ cao nhất của lực lượng Công an nhân dân được phân công chỉ huy chữa cháy có mặt tại nơi xảy ra cháy là người chỉ huy chữa cháy.\n2. Trường hợp tại nơi xảy ra cháy, lực lượng Công an nhân dân chưa đến thì người chỉ huy chữa cháy được quy định như sau:\na) Cháy tại cơ sở thì người đứng đầu cơ sở là người chỉ huy chữa cháy; trường hợp người đứng đầu cơ sở vắng mặt thì Đội trưởng Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở hoặc Đội trưởng Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành hoặc người được ủy quyền là người chỉ huy chữa cháy;\nb) Cháy phương tiện giao thông đang lưu thông thì người chỉ huy phương tiện, chủ phương tiện là người chỉ huy chữa cháy; trường hợp người chỉ huy phương tiện, chủ phương tiện vắng mặt thì người điều khiển phương tiện là người chỉ huy chữa cháy;\nc) Cháy tại thôn, tổ dân phố không thuộc các trường hợp quy định tại điểm a và điểm b khoản này thì Trưởng thôn, Tổ trưởng tổ dân phố là người chỉ huy chữa cháy; trường hợp Trưởng thôn, Tổ trưởng tổ dân phố vắng mặt thì Đội trưởng Đội dân phòng hoặc người được ủy quyền là người chỉ huy chữa cháy.\n3. Người chỉ huy chữa cháy thuộc lực lượng Công an nhân dân thực hiện quyền chỉ huy bằng mệnh lệnh, chịu trách nhiệm về quyết định của mình và có các quyền sau đây:\na) Sử dụng lực lượng, phương tiện của cơ quan Công an thuộc phạm vi quản lý tham gia chữa cháy;\nb) Huy động theo thẩm quyền hoặc đề nghị người có thẩm quyền huy động lực lượng, người, phương tiện, tài sản của cơ quan, tổ chức, hộ gia đình, cá nhân tham gia chữa cháy theo quy định của pháp luật;\nc) Xác định, quyết định khu vực chữa cháy, các biện pháp chữa cháy, việc sử dụng địa hình, địa vật lân cận để chữa cháy;\nd) Cấm người và phương tiện không có nhiệm vụ vào khu vực chữa cháy;\nđ) Quyết định việc di chuyển, phá dỡ chướng ngại vật, tài sản để cứu nạn, cứu hộ, ngăn chặn nguy cơ cháy lan theo quy định của pháp luật.\n4. Người chỉ huy chữa cháy quy định tại khoản 2 Điều này chịu trách nhiệm về quyết định của mình và có các quyền sau đây:\na) Sử dụng lực lượng, phương tiện thuộc phạm vi quản lý tham gia chữa cháy;\nb) Đề nghị người có thẩm quyền huy động lực lượng, người, phương tiện, tài sản của cơ quan, tổ chức, hộ gia đình, cá nhân tham gia chữa cháy theo quy định của pháp luật;\nc) Quyết định việc di chuyển, phá dỡ chướng ngại vật, tài sản để cứu nạn, cứu hộ, ngăn chặn nguy cơ cháy lan theo quy định của pháp luật.","y":"1. 화재진압 지휘를 맡도록 지정되어 화재 발생 장소에 있는 인민공안의 최고 직위자가 화재진압 지휘자이다.\n2. 화재 발생 장소에 인민공안이 아직 도착하지 아니한 경우 화재진압 지휘자는 다음과 같이 규정한다:\na) 사업장에서 화재가 발생한 경우 사업장 대표자가 화재진압 지휘자이다; 사업장 대표자가 부재한 경우에는 사업장 자체 소방·구조구난팀 팀장 또는 전문 소방·구조구난팀 팀장 또는 위임받은 자가 화재진압 지휘자이다;\nb) 운행 중인 교통수단에서 화재가 발생한 경우 교통수단 지휘자, 교통수단 소유자가 화재진압 지휘자이다; 교통수단 지휘자, 교통수단 소유자가 부재한 경우에는 교통수단 운전자가 화재진압 지휘자이다;\nc) 이 항 a호 및 b호에 규정된 경우에 속하지 아니하는 촌(thôn), 주민조(tổ dân phố)에서 화재가 발생한 경우 촌장, 주민조 조장이 화재진압 지휘자이다; 촌장, 주민조 조장이 부재한 경우에는 민방위 소방팀 팀장 또는 위임받은 자가 화재진압 지휘자이다.\n3. 인민공안에 속하는 화재진압 지휘자는 명령으로 지휘권을 행사하고, 자신의 결정에 대하여 책임을 지며, 다음 각 호의 권한이 있다:\na) 관리 범위에 속하는 공안기관의 인력·장비·수단을 화재진압에 참여하도록 사용할 것;\nb) 법률의 규정에 따라 기관, 조직, 가구, 개인의 인력(조직), 사람, 장비·수단, 재산을 권한에 따라 동원하거나 권한 있는 자에게 동원을 요청하여 화재진압에 참여하게 할 것;\nc) 화재진압 구역, 화재진압 조치, 화재진압을 위한 인근 지형·지물의 사용을 확정·결정할 것;\nd) 임무가 없는 사람과 차량·수단이 화재진압 구역에 들어오는 것을 금지할 것;\nđ) 법률의 규정에 따라 구조·구난, 연소확대 우려 차단을 위하여 장애물, 재산의 이동·철거를 결정할 것.\n4. 이 조 제2항에 규정된 화재진압 지휘자는 자신의 결정에 대하여 책임을 지며, 다음 각 호의 권한이 있다:\na) 관리 범위에 속하는 인력·장비·수단을 화재진압에 참여하도록 사용할 것;\nb) 법률의 규정에 따라 권한 있는 자에게 기관, 조직, 가구, 개인의 인력(조직), 사람, 장비·수단, 재산을 동원하여 화재진압에 참여하게 할 것을 요청할 것;\nc) 법률의 규정에 따라 구조·구난, 연소확대 우려 차단을 위하여 장애물, 재산의 이동·철거를 결정할 것.","o":[]},{"id":"law-29","d":"law","n":"29","t":"Khắc phục hậu quả vụ cháy","k":"화재 사고의 결과 복구","c":"제3장 화재진압","x":"1. Khắc phục hậu quả vụ cháy bao gồm các hoạt động sau đây:\na) Tổ chức cấp cứu ngay người bị nạn; cứu trợ, giúp đỡ người bị thiệt hại ổn định đời sống;\nb) Thực hiện các biện pháp bảo đảm vệ sinh môi trường, trật tự, an toàn xã hội;\nc) Phục hồi kịp thời hoạt động sản xuất, kinh doanh, dịch vụ và các hoạt động khác.\n2. Người đứng đầu cơ sở, người đứng đầu cơ quan, tổ chức có cơ sở bị cháy, Chủ tịch Ủy ban nhân dân, chủ phương tiện giao thông có phương tiện bị cháy, chủ hộ gia đình có nhà bị cháy có trách nhiệm tổ chức thực hiện quy định tại khoản 1 Điều này trong điều kiện, khả năng cho phép.","y":"1. 화재 사고의 결과 복구는 다음 각 호의 활동을 포함한다:\na) 피해자에 대한 응급 구호를 즉시 조직할 것; 피해를 입은 사람이 생활을 안정시킬 수 있도록 구호·지원할 것;\nb) 환경 위생, 사회 질서·안전을 보장하는 조치를 이행할 것;\nc) 생산, 영업, 서비스 활동 및 그 밖의 활동을 적시에 복구할 것.\n2. 사업장 대표자, 화재가 난 사업장이 있는 기관·조직의 장, 인민위원회 위원장, 화재가 난 교통수단의 교통수단 소유자, 화재가 난 주택의 가구주는 여건과 능력이 허용하는 범위에서 이 조 제1항의 규정을 조직·이행할 책임이 있다.","o":[]},{"id":"law-30","d":"law","n":"30","t":"Bảo vệ hiện trường, điều tra vụ cháy","k":"화재 현장 보존, 화재 조사","c":"제3장 화재진압","x":"1. Cơ quan Công an có trách nhiệm tổ chức bảo vệ hiện trường vụ cháy, khám nghiệm hiện trường vụ cháy, điều tra vụ cháy theo quy định của pháp luật.\n2. Cơ quan, tổ chức, hộ gia đình, cá nhân nơi xảy ra cháy có trách nhiệm tham gia bảo vệ hiện trường vụ cháy, cung cấp thông tin xác thực về vụ cháy cho cơ quan Công an.","y":"1. 공안기관은 법률의 규정에 따라 화재 현장 보존, 화재 현장 감식, 화재 조사를 조직할 책임이 있다.\n2. 화재가 발생한 곳의 기관, 조직, 가구, 개인은 화재 현장 보존에 참여하고, 화재에 관한 진실한 정보를 공안기관에 제공할 책임이 있다.","o":[]},{"id":"law-31","d":"law","n":"31","t":"Chữa cháy trụ sở cơ quan đại diện ngoại giao, cơ quan đại diện lãnh sự, cơ quan đại diện tổ chức quốc tế và nhà ở của thành viên các cơ quan này","k":"외교대표기관, 영사대표기관, 국제기구 대표기관의 청사 및 이들 기관 구성원의 주택에 대한 화재진압","c":"제3장 화재진압","x":"1. Lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ của Việt Nam khi được phép vào trụ sở cơ quan đại diện ngoại giao, cơ quan đại diện lãnh sự, cơ quan đại diện của tổ chức quốc tế và nhà ở của thành viên các cơ quan này để chữa cháy thì phải tuân theo quy định của điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên và quy định của pháp luật Việt Nam.\n2. Lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ của Việt Nam có trách nhiệm chống cháy lan bên ngoài trụ sở cơ quan đại diện ngoại giao, cơ quan đại diện lãnh sự, cơ quan đại diện tổ chức quốc tế và nhà ở của thành viên các cơ quan này.","y":"1. 베트남의 소방경찰(소방·구조구난 경찰)은 외교대표기관, 영사대표기관, 국제기구 대표기관의 청사 및 이들 기관 구성원의 주택에 화재진압을 위하여 들어가도록 허가받은 경우 베트남사회주의공화국이 당사국인 국제조약의 규정 및 베트남 법률의 규정을 준수하여야 한다.\n2. 베트남의 소방 및 구조·구난대는 외교대표기관, 영사대표기관, 국제기구 대표기관의 청사 및 이들 기관 구성원의 주택 외부에서 연소확대를 방지할 책임이 있다.","o":[]},{"id":"law-32","d":"law","n":"32","t":"Tình huống cứu nạn, cứu hộ","k":"구조·구난 상황","c":"제4장 구조·구난","x":"1. Tình huống cứu nạn, cứu hộ bao gồm:\na) Cứu nạn, cứu hộ trong đám cháy;\nb) Cứu nạn, cứu hộ trong tình huống tai nạn, sự cố bao gồm: có người đuối nước; sập, đổ nhà, công trình, cây cối; tai nạn, sự cố do phương tiện, thiết bị gây ra; sạt lở đất, đá; tai nạn giao thông đường bộ, đường sắt, đường thủy nội địa; các tai nạn, sự cố khác khi có yêu cầu;\nc) Tìm kiếm nạn nhân.\n2. Lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chủ trì thực hiện hoạt động cứu nạn, cứu hộ trong các tình huống quy định tại khoản 1 Điều này; phối hợp thực hiện hoạt động cứu nạn, cứu hộ, phòng, chống, khắc phục hậu quả sự cố khác, thảm họa, thiên tai, dịch bệnh theo quy định của pháp luật.","y":"1. 구조·구난 상황은 다음 각 호를 포함한다:\na) 화재 현장에서의 구조·구난;\nb) 다음을 포함하는 재난·사고 상황에서의 구조·구난: 익수자가 있는 경우; 주택, 공사·건축물, 수목의 붕괴·전도; 차량·수단, 설비로 인한 재난·사고; 토사·암석 붕괴; 도로, 철도, 내수로 교통사고; 요청이 있는 경우의 그 밖의 재난·사고;\nc) 피해자 수색.\n2. 소방 및 구조·구난대는 이 조 제1항에 규정된 상황에서 구조·구난 활동을 주관하여 수행한다; 법률의 규정에 따라 구조·구난 활동, 그 밖의 사고, 참사, 자연재해, 전염병의 예방·대응 및 결과 복구를 협조하여 수행한다.","o":[]},{"id":"law-33","d":"law","n":"33","t":"Trách nhiệm cứu nạn, cứu hộ","k":"구조·구난 책임","c":"제4장 구조·구난","x":"1. Người phát hiện tình huống cứu nạn, cứu hộ, cơ quan, tổ chức, hộ gia đình, cá nhân gần nơi xảy ra cháy, tai nạn, sự cố tham gia cứu nạn, cứu hộ trong điều kiện, khả năng cho phép.\n2. Cơ quan y tế, điện lực, cấp nước, môi trường đô thị, giao thông và cơ quan, tổ chức, đoàn thể khác có liên quan có trách nhiệm phối hợp tham gia cứu nạn, cứu hộ ngay khi có yêu cầu của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ có thẩm quyền hoặc người chỉ huy cứu nạn, cứu hộ; điều động người và phương tiện thuộc phạm vi quản lý đến nơi xảy ra cháy, tai nạn, sự cố để tham gia, hỗ trợ cứu nạn, cứu hộ khi được huy động.\n3. Lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ khi nhận được tin báo tai nạn, sự cố cần phải cứu nạn, cứu hộ thuộc phạm vi quản lý hoặc nhận được mệnh lệnh, quyết định huy động phải kịp thời đến cứu nạn, cứu hộ.\n4. Lực lượng Công an nhân dân có trách nhiệm tổ chức bảo đảm an ninh, trật tự, bảo vệ khu vực cứu nạn, cứu hộ; tham gia cứu nạn, cứu hộ; bảo đảm trật tự, an toàn giao thông cho lực lượng, phương tiện đi cứu nạn, cứu hộ được lưu thông nhanh nhất.\n5. Người đứng đầu cơ quan, tổ chức, Chủ tịch Ủy ban nhân dân các cấp có trách nhiệm tham gia cứu nạn, cứu hộ thuộc phạm vi quản lý.\n6. Bộ trưởng Bộ Công an quy định về công tác trực sẵn sàng cứu nạn, cứu hộ, tổ chức cứu nạn, cứu hộ của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ và các lực lượng khác trong Công an nhân dân.","y":"1. 구조·구난 상황을 발견한 사람, 화재, 재난, 사고 발생 장소 인근의 기관, 조직, 가구, 개인은 여건과 능력이 허용하는 범위에서 구조·구난에 참여한다.\n2. 보건, 전력, 급수, 도시환경, 교통 기관 및 그 밖의 관련 기관, 조직, 단체는 권한 있는 소방경찰(소방·구조구난 경찰) 또는 구조·구난 지휘자의 요구가 있는 즉시 구조·구난에 협조·참여할 책임이 있다; 동원되는 경우 관리 범위에 속하는 사람과 장비·수단을 화재, 재난, 사고 발생 장소로 출동시켜 구조·구난에 참여하고 이를 지원하게 한다.\n3. 소방 및 구조·구난대는 관리 범위에 속하는 구조·구난이 필요한 재난·사고의 신고를 받거나 동원 명령·결정을 받은 경우 적시에 출동하여 구조·구난하여야 한다.\n4. 인민공안은 구조·구난 구역의 안보·질서 보장 및 경비를 조직할 책임이 있다; 구조·구난에 참여한다; 구조·구난 출동 인력·장비·수단이 가장 신속하게 통행할 수 있도록 교통 질서·안전을 보장한다.\n5. 기관·조직의 장, 각급 인민위원회 위원장은 관리 범위에 속하는 구조·구난에 참여할 책임이 있다.\n6. 공안부 장관은 소방경찰(소방·구조구난 경찰) 및 인민공안 내 그 밖의 인력의 구조·구난 대기 근무, 구조·구난 조직에 관하여 규정한다.","o":[]},{"id":"law-34","d":"law","n":"34","t":"Người chỉ huy cứu nạn, cứu hộ","k":"구조·구난 지휘자","c":"제4장 구조·구난","x":"1. Khi xảy ra cháy cần phải cứu nạn, cứu hộ, người chỉ huy chữa cháy thuộc lực lượng Công an nhân dân là người chỉ huy cứu nạn, cứu hộ.\n2. Khi xảy ra tai nạn, sự cố cần phải cứu nạn, cứu hộ, người có chức vụ cao nhất của lực lượng Công an nhân dân được phân công chỉ huy cứu nạn, cứu hộ có mặt tại nơi xảy ra tai nạn, sự cố là người chỉ huy cứu nạn, cứu hộ đối với các tai nạn, sự cố quy định tại điểm b khoản 1 Điều 32 của Luật này.\n3. Người chỉ huy cứu nạn, cứu hộ quy định tại khoản 1 và khoản 2 Điều này thực hiện quyền chỉ huy bằng mệnh lệnh, phải chịu trách nhiệm trước pháp luật về quyết định của mình và có các quyền sau đây:\na) Sử dụng lực lượng, phương tiện của cơ quan Công an thuộc phạm vi quản lý tham gia cứu nạn, cứu hộ;\nb) Huy động theo thẩm quyền hoặc đề nghị người có thẩm quyền huy động lực lượng, người, phương tiện, tài sản của cơ quan, tổ chức, hộ gia đình, cá nhân tham gia cứu nạn, cứu hộ theo quy định của pháp luật;\nc) Xác định, quyết định khu vực cứu nạn, cứu hộ, các biện pháp cứu nạn, cứu hộ, việc sử dụng địa hình, địa vật lân cận để cứu nạn, cứu hộ;\nd) Cấm người và phương tiện không có nhiệm vụ vào khu vực cứu nạn, cứu hộ;\nđ) Quyết định việc di chuyển, phá dỡ chướng ngại vật, tài sản trong phạm vi cứu nạn, cứu hộ để cứu người, cứu tài sản theo quy định của pháp luật.\n4. Khi người chỉ huy cứu nạn, cứu hộ thuộc lực lượng Công an nhân dân chưa có mặt tại nơi xảy ra tai nạn, sự cố thì người đứng đầu cơ sở, Trưởng thôn, Tổ trưởng tổ dân phố nơi xảy ra tai nạn, sự cố sử dụng lực lượng, người, phương tiện thuộc phạm vi quản lý thực hiện cứu nạn, cứu hộ và tham gia hỗ trợ, khắc phục tai nạn, sự cố.","y":"1. 구조·구난이 필요한 화재가 발생한 때에는 인민공안에 속하는 화재진압 지휘자가 구조·구난 지휘자이다.\n2. 구조·구난이 필요한 재난·사고가 발생한 때에는 구조·구난 지휘를 맡도록 지정되어 재난·사고 발생 장소에 있는 인민공안의 최고 직위자가 이 법 제32조 제1항 b호에 규정된 재난·사고에 대한 구조·구난 지휘자이다.\n3. 이 조 제1항 및 제2항에 규정된 구조·구난 지휘자는 명령으로 지휘권을 행사하고, 자신의 결정에 대하여 법률 앞에 책임을 져야 하며, 다음 각 호의 권한이 있다:\na) 관리 범위에 속하는 공안기관의 인력·장비·수단을 구조·구난에 참여하도록 사용할 것;\nb) 법률의 규정에 따라 기관, 조직, 가구, 개인의 인력(조직), 사람, 장비·수단, 재산을 권한에 따라 동원하거나 권한 있는 자에게 동원을 요청하여 구조·구난에 참여하게 할 것;\nc) 구조·구난 구역, 구조·구난 조치, 구조·구난을 위한 인근 지형·지물의 사용을 확정·결정할 것;\nd) 임무가 없는 사람과 차량·수단이 구조·구난 구역에 들어오는 것을 금지할 것;\nđ) 법률의 규정에 따라 사람과 재산을 구하기 위하여 구조·구난 범위 안의 장애물, 재산의 이동·철거를 결정할 것.\n4. 인민공안에 속하는 구조·구난 지휘자가 재난·사고 발생 장소에 아직 도착하지 아니한 때에는 재난·사고가 발생한 곳의 사업장 대표자, 촌장(thôn), 주민조(tổ dân phố) 조장이 관리 범위에 속하는 인력(조직), 사람, 장비·수단을 사용하여 구조·구난을 수행하고 재난·사고의 지원·복구에 참여한다.","o":[]},{"id":"law-35","d":"law","n":"35","t":"Huy động lực lượng, người, phương tiện, tài sản tham gia cứu nạn, cứu hộ","k":"구조·구난에 참여할 인력(조직), 사람, 장비·수단, 재산의 동원","c":"제4장 구조·구난","x":"1. Khi có tình huống cứu nạn, cứu hộ thì lực lượng, người, phương tiện, tài sản của cơ quan, tổ chức, hộ gia đình, cá nhân đều có thể được huy động để tham gia cứu nạn, cứu hộ; trường hợp cần thiết, người chỉ huy cứu nạn, cứu hộ đề nghị cơ quan đại diện ngoại giao, cơ quan đại diện lãnh sự, cơ quan đại diện của tổ chức quốc tế tại Việt Nam bố trí lực lượng, người, phương tiện để hỗ trợ, giúp đỡ cứu nạn, cứu hộ.\n2. Cơ quan, tổ chức, hộ gia đình, cá nhân khi được huy động tham gia cứu nạn, cứu hộ có trách nhiệm bố trí ngay lực lượng, người, phương tiện, tài sản để tham gia cứu nạn, cứu hộ.\n3. Phương tiện, tài sản của cơ quan, tổ chức, hộ gia đình, cá nhân được huy động tham gia cứu nạn, cứu hộ phải được hoàn trả ngay sau khi kết thúc cứu nạn, cứu hộ; trường hợp bị mất, hư hỏng, bị thiệt hại do việc huy động trực tiếp gây ra thì được bồi thường.\nNgười có thẩm quyền quyết định huy động có trách nhiệm thực hiện việc bồi thường. Mức bồi thường và việc chi trả bồi thường được thực hiện như đối với người có tài sản trưng dụng theo quy định của pháp luật về trưng mua, trưng dụng tài sản.\n4. Lực lượng, người được huy động làm nhiệm vụ cứu nạn, cứu hộ được ưu tiên khi đi trên các phương tiện giao thông công cộng.\n5. Thẩm quyền huy động lực lượng, người, phương tiện, tài sản tham gia cứu nạn, cứu hộ được quy định như sau:\na) Người đứng đầu cơ quan, tổ chức được quyền huy động lực lượng, người, phương tiện, tài sản thuộc phạm vi quản lý của mình;\nb) Cục trưởng Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ, Trưởng phòng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ Công an cấp tỉnh được quyền huy động lực lượng, phương tiện của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ thuộc phạm vi quản lý của mình;\nc) Bộ trưởng Bộ Công an, Giám đốc Công an cấp tỉnh và Trưởng Công an cấp xã11 được quyền huy động lực lượng, người, phương tiện, tài sản của lực lượng Công an nhân dân thuộc phạm vi quản lý của mình.\n11 Từ “huyện” được thay thế bằng từ “xã” theo quy định tại điểm b khoản 2 Điều 10 của Luật số 118/2025/QH15 sửa đổi, bổ sung một số điều của 10 luật có liên quan đến an ninh, trật tự, có hiệu lực kể từ ngày 01 tháng 7 năm 2026.\n6. Chính phủ quy định chi tiết thủ tục huy động lực lượng, người, phương tiện, tài sản tham gia cứu nạn, cứu hộ.","y":"1. 구조·구난 상황이 발생한 때에는 기관, 조직, 가구, 개인의 인력(조직), 사람, 장비·수단, 재산은 모두 구조·구난에 참여하도록 동원될 수 있다; 필요한 경우 구조·구난 지휘자는 베트남 주재 외교대표기관, 영사대표기관, 국제기구 대표기관에 구조·구난을 지원·조력할 인력(조직), 사람, 장비·수단을 배치하여 줄 것을 요청한다.\n2. 기관, 조직, 가구, 개인은 구조·구난 참여를 위하여 동원되는 경우 즉시 인력(조직), 사람, 장비·수단, 재산을 배치하여 구조·구난에 참여할 책임이 있다.\n3. 구조·구난 참여를 위하여 동원된 기관, 조직, 가구, 개인의 장비·수단, 재산은 구조·구난 종료 후 즉시 반환되어야 한다; 동원으로 인하여 직접 분실, 훼손, 손해가 발생한 경우에는 배상을 받는다.\n동원을 결정한 권한 있는 자는 배상을 이행할 책임이 있다. 배상 수준 및 배상금 지급은 재산의 징매(강제수매)·징용에 관한 법률의 규정에 따라 재산을 징용당한 자에 대한 것과 같이 이행한다.\n4. 구조·구난 임무 수행을 위하여 동원된 인력(조직), 사람은 대중교통수단을 이용할 때 우선권을 가진다.\n5. 구조·구난에 참여할 인력(조직), 사람, 장비·수단, 재산을 동원할 권한은 다음과 같이 규정한다:\na) 기관·조직의 장은 자신의 관리 범위에 속하는 인력(조직), 사람, 장비·수단, 재산을 동원할 권한이 있다;\nb) 소방·구조구난 경찰국장, 성급 공안의 소방·구조구난 경찰과장은 자신의 관리 범위에 속하는 소방경찰(소방·구조구난 경찰)의 인력(조직), 장비·수단을 동원할 권한이 있다;\nc) 공안부 장관, 성급 공안청장 및 사(면)급 공안서장11은 자신의 관리 범위에 속하는 인민공안의 인력(조직), 사람, 장비·수단, 재산을 동원할 권한이 있다.\n11 “현(huyện)”이라는 단어는 안보·질서와 관련된 10개 법의 일부 조항을 개정·보충하는 법 제118/2025/QH15호 제10조 제2항 b호의 규정에 따라 “사(xã)”라는 단어로 대체되었으며, 2026년 7월 01일부터 효력이 있다.\n6. 정부는 구조·구난에 참여할 인력(조직), 사람, 장비·수단, 재산의 동원 절차를 상세히 규정한다.","o":[]},{"id":"law-36","d":"law","n":"36","t":"Lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ","k":"소방 및 구조·구난대","c":"제5장 소방대의 구성·배치·임무","x":"1. Lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ.\n2. Lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở.\n3. Lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành.\n4. Lực lượng dân phòng.","y":"1. 소방경찰(소방·구조구난 경찰).\n2. 사업장 자체 소방대.\n3. 전문 소방대.\n4. 민방위 소방대.","o":[]},{"id":"law-37","d":"law","n":"37","t":"Thành lập, quản lý lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành và lực lượng dân phòng","k":"사업장 자체 소방대, 전문 소방대 및 민방위 소방대의 설립·관리","c":"제5장 소방대의 구성·배치·임무","x":"1. Lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở được thành lập, quản lý và bố trí thành Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở; lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành được thành lập, quản lý và bố trí thành Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành.\n2. Cơ sở đã thành lập Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành thì không phải thành lập Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở.\n3. Lực lượng dân phòng được thành lập ở một hoặc một số thôn, tổ dân phố thuộc đơn vị hành chính cấp xã12 theo quy định sau đây:\n12 Cụm từ “hoặc tại huyện nơi không tổ chức đơn vị hành chính cấp xã” được bãi bỏ theo quy định tại điểm b khoản 3 Điều 10 của Luật số 118/2025/QH15 sửa đổi, bổ sung một số điều của 10 luật có liên quan đến an ninh, trật tự, có hiệu lực kể từ ngày 01 tháng 7 năm 2026.\na) Được bố trí thành Đội dân phòng;\nb) Căn cứ tình hình, yêu cầu bảo đảm an toàn phòng cháy, chữa cháy, cứu nạn, cứu hộ, điều kiện kinh tế - xã hội, quy mô dân số, diện tích tự nhiên của địa phương, Hội đồng nhân dân cấp tỉnh quy định tiêu chí thành lập Đội dân phòng và tiêu chí về số lượng thành viên Đội dân phòng trên địa bàn quản lý;\nc) Ủy ban nhân dân cấp tỉnh quyết định số lượng Đội dân phòng cần thành lập, số lượng thành viên Đội dân phòng tại thôn, tổ dân phố thuộc phạm vi quản lý đến từng đơn vị hành chính cấp xã;\nd) Căn cứ quyết định của Ủy ban nhân dân cấp tỉnh quy định tại điểm c khoản này, Chủ tịch Ủy ban nhân dân cấp xã quyết định thành lập Đội dân phòng và từng thành viên Đội dân phòng;\nđ) Ưu tiên thành viên Tổ bảo vệ an ninh, trật tự theo quy định của Luật Lực lượng tham gia bảo vệ an ninh, trật tự ở cơ sở tham gia Đội dân phòng;\ne) Tại thôn, tổ dân phố đã công nhận Tổ trưởng, Tổ phó Tổ bảo vệ an ninh, trật tự theo quy định của pháp luật về lực lượng tham gia bảo vệ an ninh, trật tự ở cơ sở, Chủ tịch Ủy ban nhân dân cấp xã bổ nhiệm Tổ trưởng, Tổ phó Tổ bảo vệ an ninh, trật tự là Đội trưởng, Đội phó Đội dân phòng.\n4. Chính phủ quy định cơ sở phải thành lập Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, cư sở phải thành lập Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành; tổ chức, hoạt động và chế độ bảo đảm điều kiện hoạt động đối với lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành, lực lượng dân phòng.","y":"1. 사업장 자체 소방대는 사업장 자체 소방·구조구난팀으로 설립·관리·편성된다; 전문 소방대는 전문 소방·구조구난팀으로 설립·관리·편성된다.\n2. 전문 소방·구조구난팀을 이미 설립한 사업장은 사업장 자체 소방·구조구난팀을 설립하지 아니하여도 된다.\n3. 민방위 소방대는 사(면)급 행정단위12에 속하는 하나 또는 여러 촌(thôn), 주민조(tổ dân phố)에 다음 각 호의 규정에 따라 설립된다:\n12 “또는 사(면)급 행정단위를 두지 아니하는 현(huyện)에”라는 문구는 안보·질서와 관련된 10개 법의 일부 조항을 개정·보충하는 법 제118/2025/QH15호 제10조 제3항 b호의 규정에 따라 폐지되었으며, 2026년 7월 01일부터 효력이 있다.\na) 민방위 소방팀으로 편성된다;\nb) 소방 및 구조·구난 안전 보장의 상황·요구, 지방의 경제·사회 여건, 인구 규모, 자연 면적을 근거로 성급 인민의회는 관할 지역 내 민방위 소방팀의 설립 기준 및 민방위 소방팀 구성원 수에 관한 기준을 규정한다;\nc) 성급 인민위원회는 설립하여야 할 민방위 소방팀의 수, 관리 범위에 속하는 촌, 주민조의 민방위 소방팀 구성원 수를 각 사(면)급 행정단위별로 결정한다;\nd) 이 항 c호에 규정된 성급 인민위원회의 결정을 근거로 사(면)급 인민위원회 위원장은 민방위 소방팀 및 민방위 소방팀의 각 구성원의 설립(임명)을 결정한다;\nđ) 「기층 안보·질서 보호 참여 인력법」의 규정에 따른 안보·질서 보호조의 구성원이 민방위 소방팀에 참여하도록 우선한다;\ne) 기층 안보·질서 보호 참여 인력에 관한 법률의 규정에 따라 안보·질서 보호조의 조장, 부조장을 이미 인정한 촌, 주민조에서는 사(면)급 인민위원회 위원장이 안보·질서 보호조의 조장, 부조장을 민방위 소방팀의 팀장, 부팀장으로 임명한다.\n4. 정부는 사업장 자체 소방·구조구난팀을 설립하여야 하는 사업장, 전문 소방·구조구난팀을 설립하여야 하는 사업장; 사업장 자체 소방대, 전문 소방대, 민방위 소방대의 조직, 활동 및 활동 여건 보장 제도에 관하여 규정한다.","o":[]},{"id":"law-38","d":"law","n":"38","t":"Nhiệm vụ của lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành và lực lượng dân phòng","k":"사업장 자체 소방대, 전문 소방대 및 민방위 소방대의 임무","c":"제5장 소방대의 구성·배치·임무","x":"1. Lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành và lực lượng dân phòng thực hiện các nhiệm vụ sau đây:\na) Đề xuất người có thẩm quyền ban hành nội quy phòng cháy, chữa cháy, cứu nạn, cứu hộ, xây dựng, thực tập phương án chữa cháy, cứu nạn, cứu hộ thuộc phạm vi quản lý;\nb) Thực hiện phòng cháy, chữa cháy, cứu nạn, cứu hộ trong phạm vi, nhiệm vụ được phân công và tham gia chữa cháy, cứu nạn, cứu hộ khi được huy động.\n2. Lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành và lực lượng dân phòng tham gia thực hiện các nhiệm vụ sau đây:\na) Tuyên truyền, phổ biến kiến thức, pháp luật, kỹ năng về phòng cháy, chữa cháy, cứu nạn, cứu hộ cho các đối tượng thuộc phạm vi quản lý; xây dựng phong trào quần chúng tham gia phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nb) Xây dựng phương án chữa cháy, cứu nạn, cứu hộ và phương án cứu nạn, cứu hộ của cơ quan Công an, chuẩn bị lực lượng, người, phương tiện tham gia thực tập phương án;\nc) Thực hiện các nhiệm vụ khác theo quy định của pháp luật.","y":"1. 사업장 자체 소방대, 전문 소방대 및 민방위 소방대는 다음 각 호의 임무를 수행한다:\na) 관리 범위에 속하는 소방 및 구조·구난 내규의 제정, 화재진압·구조구난 계획(방안)의 수립 및 훈련(실습)을 권한 있는 자에게 제안할 것;\nb) 지정된 범위·임무 안에서 소방 및 구조·구난을 수행하고, 동원되는 경우 화재진압, 구조·구난에 참여할 것.\n2. 사업장 자체 소방대, 전문 소방대 및 민방위 소방대는 다음 각 호의 임무 수행에 참여한다:\na) 관리 범위에 속하는 대상자에게 소방 및 구조·구난에 관한 지식, 법률, 기능을 홍보·보급할 것; 대중이 소방 및 구조·구난에 참여하는 운동을 조성할 것;\nb) 공안기관의 화재진압·구조구난 계획(방안) 및 구조·구난 계획(방안)을 수립하고, 계획 훈련(실습)에 참여할 인력(조직), 사람, 장비·수단을 준비할 것;\nc) 법률의 규정에 따른 그 밖의 임무를 수행할 것.","o":[]},{"id":"law-39","d":"law","n":"39","t":"Phòng cháy, chữa cháy, cứu nạn, cứu hộ tình nguyện","k":"자원 소방 및 구조·구난","c":"제5장 소방대의 구성·배치·임무","x":"1. Phòng cháy, chữa cháy, cứu nạn, cứu hộ tình nguyện là việc cá nhân tự nguyện đăng ký với Công an cấp xã nơi cư trú để thường xuyên tham gia hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n2. Cá nhân tham gia hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ tình nguyện được huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n3. Trong trường hợp cần thiết, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ đề nghị Công an cấp xã huy động cá nhân đã tình nguyện đăng ký để tham gia hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n4. Nhà nước có chính sách khuyến khích người dân đăng ký tham gia hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ tình nguyện.\n5. Chính phủ quy định chi tiết Điều này.","y":"1. 자원 소방 및 구조·구난이란 개인이 소방 및 구조·구난 활동에 상시 참여하기 위하여 거주지의 사(면)급 공안에 자발적으로 등록하는 것을 말한다.\n2. 자원 소방 및 구조·구난 활동에 참여하는 개인은 소방 및 구조·구난 직무 훈련·교육을 받는다.\n3. 필요한 경우 소방 및 구조·구난대는 자원 등록한 개인을 동원하여 소방 및 구조·구난 활동에 참여하게 할 것을 사(면)급 공안에 요청한다.\n4. 국가는 주민이 자원 소방 및 구조·구난 활동 참여를 등록하도록 장려하는 정책을 둔다.\n5. 정부는 이 조를 상세히 규정한다.","o":[]},{"id":"law-40","d":"law","n":"40","t":"Xây dựng, bố trí lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ","k":"소방경찰(소방·구조구난 경찰)의 건설·배치","c":"제5장 소방대의 구성·배치·임무","x":"1. Lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ thuộc Công an nhân dân được tổ chức, bố trí và quản lý thống nhất từ trung ương đến địa phương theo quy định của Bộ trưởng Bộ Công an.\n2. Nhà nước xây dựng lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ chính quy, tinh nhuệ, hiện đại; ưu tiên nguồn lực phát triển lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ; đào tạo, bồi dưỡng lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ tinh thông về pháp luật, nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ, đáp ứng yêu cầu phát triển kinh tế - xã hội của đất nước.\n3. Cơ quan, tổ chức và công dân Việt Nam có trách nhiệm tham gia xây dựng lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ.","y":"1. 인민공안에 속하는 소방경찰(소방·구조구난 경찰)은 공안부 장관의 규정에 따라 중앙에서 지방까지 통일적으로 조직·배치·관리된다.\n2. 국가는 정규화되고 정예하며 현대적인 소방경찰(소방·구조구난 경찰)을 건설한다; 소방경찰(소방·구조구난 경찰)의 발전에 자원을 우선 배정한다; 법률, 소방 및 구조·구난 직무에 정통하고 국가의 경제·사회 발전 요구를 충족하는 소방경찰(소방·구조구난 경찰)을 양성·교육한다.\n3. 기관, 조직 및 베트남 공민은 소방경찰(소방·구조구난 경찰)의 건설에 참여할 책임이 있다.","o":[]},{"id":"law-41","d":"law","n":"41","t":"Nhiệm vụ của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ","k":"소방경찰(소방·구조구난 경찰)의 임무","c":"제5장 소방대의 구성·배치·임무","x":"1. Tham mưu, đề xuất với Bộ trưởng Bộ Công an ban hành, đề xuất cấp có thẩm quyền ban hành và tổ chức thực hiện chiến lược, chính sách, đề án, dự án, quy hoạch, kế hoạch, quy định của pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ.\n2. Tổ chức tuyên truyền, phổ biến, giáo dục kiến thức, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ; hướng dẫn xây dựng phong trào toàn dân tham gia phòng cháy, chữa cháy, cứu nạn, cứu hộ; huấn luyện, bồi dưỡng nghiệp vụ, kiến thức, kỹ năng về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n3. Xây dựng, thực tập phương án chữa cháy, cứu nạn, cứu hộ và phương án cứu nạn, cứu hộ.\n4. Thực hiện chữa cháy, cứu nạn, cứu hộ.\n5. Thẩm định thiết kế, kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy theo thẩm quyền.\n6. Hướng dẫn xây dựng lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ; hướng dẫn thực hiện công tác phòng cháy, chữa cháy và cứu nạn, cứu hộ; hướng dẫn trang bị, quản lý, sử dụng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n7. Tổ chức nghiên cứu, ứng dụng khoa học và công nghệ trong lĩnh vực phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n8. Thống kê, tổng hợp dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ; xây dựng, quản lý, khai thác, vận hành hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy.\n9. Kiểm tra, thanh tra, xử lý vi phạm pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ theo quy định của pháp luật.\n10. Thực hiện quản lý hoạt động chứng nhận hợp chuẩn, hợp quy phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật về chất lượng sản phẩm, hàng hóa và pháp luật về tiêu chuẩn, quy chuẩn kỹ thuật.\n11. Thực hiện một số hoạt động điều tra theo quy định của pháp luật về tố tụng hình sự và pháp luật về tổ chức điều tra hình sự.\n12. Thực hiện hợp tác quốc tế về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n13. Thực hiện nhiệm vụ khác theo quy định của pháp luật về Công an nhân dân và quy định khác của pháp luật có liên quan.\n14. Bộ trưởng Bộ Công an quy định chi tiết Điều này.","y":"1. 소방 및 구조·구난에 관한 전략, 정책, 방안(제안서), 사업, 계획(quy hoạch), 실행계획, 법률 규정을 공안부 장관이 제정하도록 자문·제안하고, 권한 있는 기관이 제정하도록 제안하며, 그 시행을 조직한다.\n2. 소방 및 구조·구난에 관한 지식, 법률의 홍보·보급·교육을 조직한다; 전 국민이 소방 및 구조·구난에 참여하는 운동의 조성을 안내한다; 소방 및 구조·구난에 관한 직무, 지식, 기능을 훈련·교육한다.\n3. 화재진압·구조구난 계획(방안) 및 구조·구난 계획(방안)을 수립하고 훈련(실습)한다.\n4. 화재진압, 구조·구난을 수행한다.\n5. 권한에 따라 소방 설계 심사, 소방 준공검사(인수검사) 확인을 한다.\n6. 소방 및 구조·구난대의 건설을 안내한다; 소방 및 구조·구난 업무의 수행을 안내한다; 소방 및 구조·구난 장비·설비의 구비, 관리, 사용을 안내한다.\n7. 소방 및 구조·구난 분야에서 과학 및 기술의 연구·응용을 조직한다.\n8. 소방 및 구조·구난에 관한 데이터를 통계·종합한다; 소방 및 구조·구난 데이터베이스 및 화재 신호 전송 시스템을 구축, 관리, 활용, 운영한다.\n9. 법률의 규정에 따라 소방 및 구조·구난에 관한 법률 위반을 점검(검사), 감사, 처리한다.\n10. 제품·상품의 품질에 관한 법률 및 기술 표준·기술 규정에 관한 법률의 규정에 따라 소방 및 구조·구난 장비·설비의 표준 적합·규정 적합 인증 활동을 관리한다.\n11. 형사소송에 관한 법률 및 형사 수사 조직에 관한 법률의 규정에 따라 일부 수사 활동을 수행한다.\n12. 소방 및 구조·구난에 관한 국제 협력을 수행한다.\n13. 인민공안에 관한 법률의 규정 및 그 밖의 관련 법률의 규정에 따른 그 밖의 임무를 수행한다.\n14. 공안부 장관은 이 조를 상세히 규정한다.","o":[]},{"id":"law-42","d":"law","n":"42","t":"Trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ","k":"소방 및 구조·구난대에 대한 소방 및 구조·구난 장비·설비의 구비","c":"제6장 소방 및 구조·구난 장비·설비","x":"1. Nhà nước trang bị cho lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ, các lực lượng khác trong Công an nhân dân phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ và các phương tiện, thiết bị cần thiết khác bảo đảm đồng bộ, hiện đại, đáp ứng yêu cầu chữa cháy, cứu nạn, cứu hộ trong mọi tình huống.\n2. Người đứng đầu cơ sở quyết định hoặc đề xuất người có thẩm quyền quyết định trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành thuộc phạm vi quản lý.\n3. Ủy ban nhân dân cấp xã trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng dân phòng.\n4. Bộ trưởng Bộ Công an quy định việc trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ quy định tại khoản 2 và khoản 3 Điều này.","y":"1. 국가는 소방경찰(소방·구조구난 경찰), 인민공안 내 그 밖의 인력에게 소방 및 구조·구난 장비·설비와 그 밖에 필요한 장비·설비를 일체성 있고 현대적이며 모든 상황에서 화재진압, 구조·구난 요구를 충족하도록 갖추어 준다.\n2. 사업장 대표자는 관리 범위에 속하는 사업장 자체 소방대, 전문 소방대에 소방 및 구조·구난 장비·설비를 갖추어 주는 것을 결정하거나 권한 있는 자에게 결정하도록 제안한다.\n3. 사(면)급 인민위원회는 민방위 소방대에 소방 및 구조·구난 장비·설비를 갖추어 준다.\n4. 공안부 장관은 이 조 제2항 및 제3항에 규정된 소방 및 구조·구난 장비·설비의 구비에 관하여 규정한다.","o":[]},{"id":"law-43","d":"law","n":"43","t":"Quản lý, sử dụng, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 장비·설비의 관리, 사용, 보관, 정비","c":"제6장 소방 및 구조·구난 장비·설비","x":"1. Lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ có trách nhiệm quản lý, sử dụng, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ được trang bị.\n2. Cơ quan, tổ chức, hộ gia đình, cá nhân có trách nhiệm quản lý, sử dụng, bảo quản, bảo dưỡng đối với phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ đã trang bị để sẵn sàng báo cháy, chữa cháy, cứu nạn, cứu hộ.\n3. Bộ trưởng Bộ Công an quy định việc quản lý, bảo quản, bảo dưỡng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ.","y":"1. 소방 및 구조·구난대는 갖추어진 소방 및 구조·구난 장비·설비를 관리, 사용, 보관, 정비할 책임이 있다.\n2. 기관, 조직, 가구, 개인은 화재 통보, 화재진압, 구조·구난에 즉시 대비할 수 있도록 이미 갖춘 소방 및 구조·구난 장비·설비를 관리, 사용, 보관, 정비할 책임이 있다.\n3. 공안부 장관은 소방 및 구조·구난 장비·설비의 관리, 보관, 정비에 관하여 규정한다.","o":[]},{"id":"law-44","d":"law","n":"44","t":"Sản xuất, lắp ráp, nhập khẩu, lưu thông phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ và vật liệu, cấu kiện ngăn cháy, chống cháy","k":"소방 및 구조·구난 장비·설비와 방화·내화 자재·부재의 생산, 조립, 수입, 유통","c":"제6장 소방 및 구조·구난 장비·설비","x":"1. Phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ và vật liệu, cấu kiện ngăn cháy, chống cháy sản xuất, lắp ráp trong nước trước khi lưu thông trên thị trường phải bảo đảm về chất lượng, đúng với tiêu chuẩn công bố áp dụng, quy chuẩn kỹ thuật tương ứng theo quy định của pháp luật về chất lượng sản phẩm, hàng hóa và pháp luật về tiêu chuẩn, quy chuẩn kỹ thuật.\n2. Phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ và vật liệu, cấu kiện ngăn cháy, chống cháy nhập khẩu phải đúng với tiêu chuẩn quốc tế, tiêu chuẩn khu vực, tiêu chuẩn nước ngoài hoặc tiêu chuẩn, quy chuẩn kỹ thuật của Việt Nam. Trường hợp giữa Việt Nam và các quốc gia, vùng lãnh thổ thừa nhận kết quả đánh giá sự phù hợp của nhau được thực hiện theo điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên.\n3. Chính phủ quy định việc cấp phép trước khi lưu thông trên thị trường đối với phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ và vật liệu, cấu kiện ngăn cháy, chống cháy; danh mục phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ, vật liệu, cấu kiện ngăn cháy, chống cháy.","y":"1. 국내에서 생산·조립하는 소방 및 구조·구난 장비·설비와 방화·내화 자재·부재는 시장에 유통되기 전에 제품·상품의 품질에 관한 법률 및 기술 표준·기술 규정에 관한 법률의 규정에 따라 품질이 보장되고, 적용을 공표한 표준 및 해당 기술 규정에 부합하여야 한다.\n2. 수입하는 소방 및 구조·구난 장비·설비와 방화·내화 자재·부재는 국제 표준, 지역 표준, 외국 표준 또는 베트남의 기술 표준·기술 규정에 부합하여야 한다. 베트남과 각 국가·영토 간에 서로의 적합성 평가 결과를 인정하는 경우에는 베트남사회주의공화국이 당사국인 국제조약에 따라 이행한다.\n3. 정부는 소방 및 구조·구난 장비·설비와 방화·내화 자재·부재에 대한 시장 유통 전 허가; 소방 및 구조·구난 장비·설비, 방화·내화 자재·부재의 목록에 관하여 규정한다.","o":[]},{"id":"law-45","d":"law","n":"45","t":"Huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 직무 훈련·교육","c":"제7장 소방 및 구조·구난 활동의 여건 보장","x":"1. Đối tượng được huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ bao gồm:\na) Chủ tịch, Phó Chủ tịch Ủy ban nhân dân cấp xã;\nb) Trưởng thôn, Tổ trưởng tổ dân phố;\nc) Người đứng đầu cơ sở;\nd) Thành viên Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở; thành viên Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành; thành viên Đội dân phòng;\nđ) Người được phân công thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ tại cơ sở; người được phân công thực hiện kiểm tra về phòng cháy, chữa cháy tại cơ sở;\ne) Người làm việc trong môi trường nguy hiểm cháy, nổ hoặc thường xuyên tiếp xúc với chất, hàng hóa nguy hiểm về cháy, nổ;\ng) Người điều khiển phương tiện, người làm việc trên phương tiện giao thông quy định tại khoản 10 Điều 2 của Luật này;\nh) Người đã đăng ký tham gia hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ tình nguyện;\ni) Đối tượng khác có nhu cầu.\n2. Nội dung huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ bao gồm:\na) Quy định của pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ;\nb) Kiến thức, kỹ năng về phòng cháy;\nc) Kiến thức, kỹ năng về chữa cháy;\nd) Kiến thức, kỹ năng thoát nạn, cứu nạn;\nđ) Các nội dung khác phù hợp với từng đối tượng quy định tại khoản 1 Điều này.\n3. Lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ và cơ sở đào tạo về phòng cháy, chữa cháy, cứu nạn, cứu hộ thực hiện việc huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n4. Bộ trưởng Bộ Công an quy định về huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ cho lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ và các lực lượng khác trong Công an nhân dân.\n5. Chính phủ quy định chi tiết khoản 2 và khoản 3 Điều này; quy định thời gian huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ; quy định chế độ, chính sách cho người tham gia huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ.","y":"1. 소방 및 구조·구난 직무 훈련·교육을 받는 대상자는 다음 각 호를 포함한다:\na) 사(면)급 인민위원회 위원장, 부위원장;\nb) 촌장(thôn), 주민조(tổ dân phố) 조장;\nc) 사업장 대표자;\nd) 사업장 자체 소방·구조구난팀의 구성원; 전문 소방·구조구난팀의 구성원; 민방위 소방팀의 구성원;\nđ) 사업장에서 소방 및 구조·구난 임무를 수행하도록 지정된 사람; 사업장에서 소방 점검(검사)을 수행하도록 지정된 사람;\ne) 화재·폭발 위험 환경에서 근무하거나 화재·폭발 위험 물질·화물과 상시 접촉하는 사람;\ng) 이 법 제2조 제10항에 규정된 교통수단의 운전자, 그 교통수단에서 근무하는 사람;\nh) 자원 소방 및 구조·구난 활동 참여를 등록한 사람;\ni) 수요가 있는 그 밖의 대상자.\n2. 소방 및 구조·구난 직무 훈련·교육의 내용은 다음 각 호를 포함한다:\na) 소방 및 구조·구난에 관한 법률의 규정;\nb) 화재예방에 관한 지식, 기능;\nc) 화재진압에 관한 지식, 기능;\nd) 피난, 구조에 관한 지식, 기능;\nđ) 이 조 제1항에 규정된 각 대상자에 적합한 그 밖의 내용.\n3. 소방경찰(소방·구조구난 경찰) 및 소방 및 구조·구난 교육기관이 소방 및 구조·구난 직무 훈련·교육을 실시한다.\n4. 공안부 장관은 소방경찰(소방·구조구난 경찰) 및 인민공안 내 그 밖의 인력에 대한 소방 및 구조·구난 직무 훈련·교육에 관하여 규정한다.\n5. 정부는 이 조 제2항 및 제3항을 상세히 규정한다; 소방 및 구조·구난 직무 훈련·교육의 시간을 규정한다; 소방 및 구조·구난 직무 훈련·교육에 참여하는 사람에 대한 제도·정책을 규정한다.","o":[]},{"id":"law-46","d":"law","n":"46","t":"Chế độ, chính sách đối với người được huy động, người tham gia phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"동원된 사람, 소방 및 구조·구난에 참여한 사람에 대한 제도·정책","c":"제7장 소방 및 구조·구난 활동의 여건 보장","x":"1. Người được huy động, người tham gia chữa cháy, cứu nạn, cứu hộ không thuộc lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ được hưởng chế độ bồi dưỡng, hỗ trợ khi tham gia chữa cháy, cứu nạn, cứu hộ.\n2. Cơ quan, tổ chức, cá nhân tham gia, phối hợp, cộng tác, hỗ trợ, giúp đỡ cơ quan nhà nước thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ có thành tích thì được khen thưởng, bị thiệt hại về tài sản thì được đền bù theo quy định của pháp luật.\n3. Người được huy động, người tham gia phòng cháy, chữa cháy, cứu nạn, cứu hộ bị tai nạn, bị thương, chết thì được hưởng chế độ theo quy định sau đây:\na) Người đã tham gia bảo hiểm xã hội, bảo hiểm y tế và đủ điều kiện hưởng bảo hiểm thì được chi trả chế độ từ quỹ bảo hiểm theo quy định của pháp luật;\nb) Người chưa tham gia bảo hiểm y tế mà bị tai nạn, bị thương thì được hỗ trợ thanh toán chi phí khám bệnh, chữa bệnh; trường hợp chưa tham gia bảo hiểm xã hội nếu bị tai nạn làm suy giảm khả năng lao động theo kết luận của Hội đồng giám định y khoa thì được xét trợ cấp tùy theo mức độ suy giảm khả năng lao động; nếu chết thì thân nhân được hưởng chế độ tiền tuất, tiền mai táng phí;\nc) Người bị thương, chết khi thực hiện nhiệm vụ thì được xem xét hưởng chế độ, chính sách như thương binh hoặc được xem xét để công nhận là liệt sĩ và hưởng các quyền theo quy định của pháp luật về ưu đãi người có công với cách mạng.\n4. Chính phủ quy định chi tiết khoản 1 và khoản 3 Điều này.","y":"1. 소방 및 구조·구난 인력에 속하지 않으면서 동원된 사람, 화재진압 및 구조·구난에 참여한 사람은 화재진압 및 구조·구난에 참여할 때 수당·지원 제도의 적용을 받는다.\n2. 국가기관의 소방 및 구조·구난 임무 수행에 참여·협조·협력·지원·조력한 기관, 조직, 개인은 공적이 있으면 포상을 받고, 재산상 손해를 입으면 법률 규정에 따라 보상을 받는다.\n3. 동원된 사람, 소방 및 구조·구난에 참여한 사람이 사고를 당하거나, 부상을 입거나, 사망한 경우 다음 규정에 따른 제도의 적용을 받는다:\na) 사회보험, 건강보험에 가입하였고 보험 수급 요건을 충족하는 사람은 법률 규정에 따라 보험기금에서 급여를 지급받는다;\nb) 건강보험에 가입하지 않은 사람이 사고를 당하거나 부상을 입은 경우 진료·치료 비용의 지급을 지원받는다; 사회보험에 가입하지 않은 경우로서 사고를 당하여 의학감정위원회의 결론에 따라 노동능력이 저하된 때에는 노동능력 저하 정도에 따라 보조금 지급 여부를 심사받는다; 사망한 경우 그 유족은 유족급여, 장례비 제도의 적용을 받는다;\nc) 임무 수행 중 부상을 입거나 사망한 사람은 상이군인(thương binh)에 준하는 제도·정책의 적용 여부를 심사받거나 열사(liệt sĩ)로 인정받기 위한 심사를 받으며, 혁명 유공자 우대에 관한 법률 규정에 따른 권리를 누린다.\n4. 정부는 이 조 제1항 및 제3항을 상세히 규정한다.","o":[]},{"id":"law-47","d":"law","n":"47","t":"Trang phục, phù hiệu, cấp hiệu và chế độ, chính sách đối với lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ","k":"소방경찰(소방·구조구난 경찰)의 복장, 휘장, 계급장 및 제도·정책","c":"제7장 소방 및 구조·구난 활동의 여건 보장","x":"1. Sĩ quan, hạ sĩ quan, chiến sĩ thuộc lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ được trang bị trang phục, phù hiệu, cấp hiệu theo quy định của pháp luật về Công an nhân dân và được trang bị trang phục chuyên dùng để thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n2. Sĩ quan, hạ sĩ quan, chiến sĩ thuộc lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ được hưởng chế độ, chính sách sau đây:\na) Chế độ, chính sách theo quy định của pháp luật về Công an nhân dân;\nb) Chế độ bồi dưỡng khi thực hiện huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ; thực tập phương án chữa cháy, cứu nạn, cứu hộ và phương án cứu nạn, cứu hộ; khi chữa cháy, cứu nạn, cứu hộ;\nc) Chế độ dinh dưỡng đặc thù khi huấn luyện, thực tập phương án chữa cháy, cứu nạn, cứu hộ, phương án cứu nạn, cứu hộ và trực tiếp chữa cháy, cứu nạn, cứu hộ;\nd) Chế độ theo danh mục nghề, công việc đặc biệt nặng nhọc, độc hại, nguy hiểm theo quy định của pháp luật;\nđ) Sĩ quan, hạ sĩ quan điều khiển, vận hành phương tiện chữa cháy, cứu nạn, cứu hộ được hưởng chế độ, chính sách như sĩ quan, hạ sĩ quan nghiệp vụ theo pháp luật về Công an nhân dân.\n3. Bộ trưởng Bộ Công an quy định chi tiết điểm b và điểm c khoản 2 Điều này.","y":"1. 소방경찰(소방·구조구난 경찰)에 속하는 장교, 부사관, 전사(병)는 인민공안에 관한 법률 규정에 따라 복장, 휘장, 계급장을 지급받으며, 소방 및 구조·구난 임무 수행을 위한 전용 복장을 지급받는다.\n2. 소방경찰(소방·구조구난 경찰)에 속하는 장교, 부사관, 전사(병)는 다음의 제도·정책의 적용을 받는다:\na) 인민공안에 관한 법률 규정에 따른 제도·정책;\nb) 소방 및 구조·구난 직무 훈련·교육을 실시할 때; 화재진압·구조구난 계획(방안) 및 구조·구난 계획(방안)의 훈련(실습)을 할 때; 화재진압 및 구조·구난을 할 때의 수당 제도;\nc) 훈련, 화재진압·구조구난 계획(방안) 및 구조·구난 계획(방안)의 훈련(실습)을 할 때와 화재진압 및 구조·구난을 직접 수행할 때의 특수 영양 제도;\nd) 법률 규정에 따른 특별히 힘들고, 유해하며, 위험한 직업·업무 목록에 따른 제도;\nđ) 화재진압 및 구조·구난 장비를 조종·운용하는 장교, 부사관은 인민공안에 관한 법률에 따른 직무(업무) 장교, 부사관에 준하는 제도·정책의 적용을 받는다.\n3. 공안부 장관은 이 조 제2항 b호 및 c호를 상세히 규정한다.","o":[]},{"id":"law-48","d":"law","n":"48","t":"Bảo hiểm cháy, nổ bắt buộc","k":"화재·폭발 의무보험","c":"제7장 소방 및 구조·구난 활동의 여건 보장","x":"1. Cơ quan, tổ chức, cá nhân phải tham gia bảo hiểm cháy, nổ bắt buộc đối với tài sản của cơ sở thuộc danh mục cơ sở phải mua bảo hiểm cháy, nổ bắt buộc và thực hiện theo quy định của pháp luật về bảo hiểm.\n2. Khuyến khích cơ quan, tổ chức, cá nhân tham gia bảo hiểm cháy, nổ bắt buộc đối với tài sản của cơ sở không thuộc danh mục cơ sở phải mua bảo hiểm cháy, nổ bắt buộc.\n3. Chính phủ quy định danh mục cơ sở phải mua bảo hiểm cháy, nổ bắt buộc; mức trích nộp, chế độ quản lý, sử dụng nguồn thu từ bảo hiểm cháy, nổ bắt buộc cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.","y":"1. 기관, 조직, 개인은 화재·폭발 의무보험 가입 대상 사업장 목록에 속하는 사업장의 재산에 대하여 화재·폭발 의무보험에 가입하여야 하며 보험에 관한 법률 규정에 따라 이행한다.\n2. 기관, 조직, 개인이 화재·폭발 의무보험 가입 대상 사업장 목록에 속하지 않는 사업장의 재산에 대하여 화재·폭발 의무보험에 가입하도록 장려한다.\n3. 정부는 화재·폭발 의무보험 가입 대상 사업장 목록; 소방 및 구조·구난 활동을 위한 화재·폭발 의무보험 수입의 적립·납부 비율, 관리·사용 제도를 규정한다.","o":[]},{"id":"law-49","d":"law","n":"49","t":"Nguồn tài chính bảo đảm cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 활동을 보장하는 재원","c":"제7장 소방 및 구조·구난 활동의 여건 보장","x":"1. Nguồn tài chính bảo đảm cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ bao gồm:\na) Ngân sách nhà nước;\nb) Nguồn thu từ bảo hiểm cháy, nổ bắt buộc trích lại cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nc) Đóng góp tự nguyện, tài trợ bằng tiền, hiện vật của cơ quan, tổ chức, cá nhân trong nước, tổ chức, cá nhân nước ngoài;\nd) Hỗ trợ từ Quỹ phòng, chống thiên tai theo quy định của pháp luật về phòng, chống thiên tai và các quỹ hợp pháp khác;\nđ) Nguồn tài chính huy động hợp pháp khác theo quy định của pháp luật.\n2. Việc quản lý, sử dụng nguồn tài chính bảo đảm cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ quy định tại khoản 1 Điều này được thực hiện theo quy định của pháp luật về ngân sách nhà nước, pháp luật về quản lý, sử dụng tài sản công và quy định khác của luật có liên quan.\n3. Chính phủ quy định chi tiết điểm c và điểm d khoản 1 Điều này.","y":"1. 소방 및 구조·구난 활동을 보장하는 재원은 다음을 포함한다:\na) 국가예산;\nb) 화재·폭발 의무보험 수입 중 소방 및 구조·구난 활동을 위하여 적립·환원되는 재원;\nc) 국내 기관, 조직, 개인 및 외국 조직, 개인의 자발적 기부, 금전·현물 후원;\nd) 재난 예방·대응에 관한 법률 규정에 따른 재난예방·대응기금 및 그 밖의 합법적인 기금의 지원;\nđ) 법률 규정에 따라 합법적으로 조달한 그 밖의 재원.\n2. 이 조 제1항에 규정된 소방 및 구조·구난 활동을 보장하는 재원의 관리·사용은 국가예산에 관한 법률, 공공재산의 관리·사용에 관한 법률 및 관련 법률의 그 밖의 규정에 따라 이행한다.\n3. 정부는 이 조 제1항 c호 및 d호를 상세히 규정한다.","o":[]},{"id":"law-50","d":"law","n":"50","t":"Ngân sách nhà nước bảo đảm cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 활동을 보장하는 국가예산","c":"제7장 소방 및 구조·구난 활동의 여건 보장","x":"1. Nhà nước bảo đảm ngân sách để đầu tư cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ; ưu tiên phân bổ nguồn lực trong kế hoạch tài chính 5 năm, kế hoạch tài chính - ngân sách nhà nước 3 năm, dự toán ngân sách nhà nước hằng năm cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ; trong nhiệm vụ chi ngân sách quốc phòng và an ninh hằng năm của Ủy ban nhân dân các cấp phải có nội dung bảo đảm cho công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n2. Trong trường hợp cấp bách được sử dụng dự phòng ngân sách nhà nước theo quy định của pháp luật về ngân sách nhà nước để phục vụ hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n3. Nhà nước cấp ngân sách cho lực lượng Công an nhân dân, các cơ quan nhà nước, đơn vị sự nghiệp, lực lượng vũ trang và các đơn vị khác thụ hưởng ngân sách nhà nước để phục vụ hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật về ngân sách nhà nước.\n4. Ngân sách nhà nước bảo đảm cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ được sử dụng cho các nhiệm vụ sau đây:\na) Đầu tư, trang bị, xây dựng, sửa chữa, bảo trì, bảo dưỡng hệ thống, phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nb) Hoạt động của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ và lực lượng dân phòng;\nc) Đào tạo, huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật;\nd) Các hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ khác theo quy định của pháp luật.\n5. Việc lập dự toán, phân bổ, quản lý và sử dụng ngân sách nhà nước chi cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ được thực hiện theo quy định của pháp luật về ngân sách nhà nước.\n6. Ủy ban nhân dân cấp tỉnh xây dựng, trình Hội đồng nhân dân cùng cấp ban hành chính sách ưu tiên đầu tư và huy động các nguồn lực để đầu tư, xây dựng hệ thống hạ tầng kỹ thuật đối với các khu dân cư thuộc phạm vi quản lý chưa bảo đảm điều kiện về hạ tầng giao thông, nguồn nước phục vụ chữa cháy; đầu tư, trang bị, sửa chữa, bảo trì, bảo dưỡng hệ thống, phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n7. Chính phủ quy định chi tiết Điều này.","y":"1. 국가는 소방 및 구조·구난 활동에 투자하기 위한 예산을 보장한다; 5개년 재정계획, 3개년 재정-국가예산 계획, 연간 국가예산 추계에서 소방 및 구조·구난 활동을 위한 자원 배분을 우선한다; 각급 인민위원회의 연간 국방·안보 예산 지출 임무에는 소방 및 구조·구난 업무를 보장하는 내용이 있어야 한다.\n2. 긴급한 경우 소방 및 구조·구난 활동을 위하여 국가예산에 관한 법률 규정에 따라 국가예산 예비비를 사용할 수 있다.\n3. 국가는 국가예산에 관한 법률 규정에 따라 소방 및 구조·구난 활동을 위하여 인민공안 인력, 국가기관, 공공사업기관(사업단위), 무장 인력 및 국가예산을 지원받는 그 밖의 단위에 예산을 배정한다.\n4. 소방 및 구조·구난 활동을 보장하는 국가예산은 다음의 임무에 사용된다:\na) 소방 및 구조·구난 설비·장비의 투자, 구비, 건설, 수리, 유지보수, 정비;\nb) 소방경찰(소방·구조구난 경찰) 및 민방위 소방대의 활동;\nc) 법률 규정에 따른 소방 및 구조·구난 직무의 양성, 훈련·교육;\nd) 법률 규정에 따른 그 밖의 소방 및 구조·구난 활동.\n5. 소방 및 구조·구난 활동에 지출하는 국가예산의 추계 수립, 배분, 관리 및 사용은 국가예산에 관한 법률 규정에 따라 이행한다.\n6. 성급 인민위원회는 관리 범위에 속하는 주거지역 중 화재진압을 위한 교통 인프라, 수원(水源) 조건이 보장되지 않은 주거지역에 대하여 기술 인프라 시스템을 투자·건설하기 위한; 소방 및 구조·구난 설비·장비를 투자, 구비, 수리, 유지보수, 정비하기 위한 투자 우선 및 자원 동원 정책을 수립하여 같은 급 인민의회에 제출하여 공포하도록 한다.\n7. 정부는 이 조를 상세히 규정한다.","o":[]},{"id":"law-51","d":"law","n":"51","t":"Khuyến khích đầu tư cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 활동에 대한 투자 장려","c":"제7장 소방 및 구조·구난 활동의 여건 보장","x":"1. Nhà nước khuyến khích cơ quan, tổ chức, cá nhân trong nước, người Việt Nam định cư ở nước ngoài, tổ chức, cá nhân nước ngoài và tổ chức quốc tế đầu tư, đóng góp, tài trợ cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n2. Tổ chức, cá nhân sản xuất, lắp ráp phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ trong nước được hưởng các ưu đãi về tín dụng, đất đai, khoa học và công nghệ, nguồn nhân lực theo quy định của pháp luật.","y":"1. 국가는 국내 기관, 조직, 개인, 해외에 정주하는 베트남인, 외국 조직, 개인 및 국제기구가 소방 및 구조·구난 활동에 투자, 기부, 후원하도록 장려한다.\n2. 국내에서 소방 및 구조·구난 장비·설비를 생산, 조립하는 조직, 개인은 법률 규정에 따라 신용, 토지, 과학기술, 인적자원에 관한 우대를 받는다.","o":[]},{"id":"law-52","d":"law","n":"52","t":"Hoạt động khoa học và công nghệ, hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy","k":"소방 및 구조·구난 분야의 과학기술 활동, 소방 및 구조·구난 데이터베이스·화재 신호 전송 시스템","c":"제7장 소방 및 구조·구난 활동의 여건 보장","x":"1. Hoạt động khoa học và công nghệ trong phòng cháy, chữa cháy, cứu nạn, cứu hộ bao gồm nghiên cứu cơ bản, nghiên cứu ứng dụng, phát triển công nghệ, ứng dụng công nghệ số, triển khai thực nghiệm, sản xuất thử nghiệm, chuyển giao công nghệ và các hoạt động dịch vụ khoa học và công nghệ nhằm nâng cao chất lượng công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật.\n2. Nhà nước khuyến khích cơ quan, tổ chức, cá nhân trong nước, người Việt Nam định cư ở nước ngoài, tổ chức, cá nhân nước ngoài và tổ chức quốc tế đầu tư, tài trợ, tham gia hoạt động khoa học và công nghệ trong công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n3. Ưu tiên kết hợp, ứng dụng kết quả đề tài, nhiệm vụ nghiên cứu trong nước thuộc lĩnh vực phòng cháy, chữa cháy, cứu nạn, cứu hộ vào đầu tư sản xuất, phát triển công nghệ, phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n4. Hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy do lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ quản lý, khai thác, vận hành theo quy định của pháp luật.\n5. Chính phủ quy định chi tiết khoản 4 Điều này; quy định việc cập nhật, khai báo dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n13 Khoản 1 Điều 11 của Luật số 118/2025/QH15 sửa đổi, bổ sung một số điều của 10 luật có liên quan đến an ninh, trật tự, có hiệu lực kể từ ngày 01 tháng 7 năm 2026 quy định như sau:\n“Điều 11. Điều khoản thi hành\n1. Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2026, trừ quy định tại khoản 2 Điều này.”.\nĐiều 94 của Luật Xây dựng số 135/2025/QH15, có hiệu lực kể từ ngày 01 tháng 7 năm 2026 quy định như sau:\n“Điều 94. Hiệu lực thi hành\n1. Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2026, trừ trường hợp quy định tại khoản 2 Điều này.\n2. Khoản 2, khoản 3 Điều 43, Điều 71 và các khoản 3, 4, 5 Điều 95 của Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2026.\n3. Luật Xây dựng số 50/2014/QH13 đã được sửa đổi, bổ sung một số điều theo Luật số 03/2016/QH14, Luật số 35/2018/QH14, Luật số 40/2019/QH14, Luật số 62/2020/QH14, Luật số 45/2024/QH15, Luật số 47/2024/QH15, Luật số 55/2024/QH15, Luật số 61/2024/QH15, Luật số 84/2025/QH15, Luật số 93/2025/QH15 và Luật số 95/2025/QH15 (sau đây gọi là Luật Xây dựng số 50/2014/QH13) hết hiệu lực kể từ ngày Luật này có hiệu lực thi hành.\n4. Chính phủ quy định chi tiết các nội dung quy định tại khoản 1 Điều 6, Điều 7, Điều 8, Điều 11, Điều 16, điểm a khoản 1 Điều 18, Điều 19, Điều 21, Điều 22, khoản 3 Điều 23, Điều 32, Điều 42, Điều 47, khoản 1 Điều 48, Điều 49, Điều 51, Điều 54, Điều 55, Điều 58, Điều 64, Điều 65, Điều 67, Điều 68; Điều 79, Điều 82, Điều 85, Điều 87 và hướng dẫn thực hiện Luật này.”.","y":"1. 소방 및 구조·구난 분야의 과학기술 활동은 법률 규정에 따라 소방 및 구조·구난 업무의 질을 높이기 위한 기초연구, 응용연구, 기술개발, 디지털 기술 응용, 실험 전개, 시험 생산, 기술이전 및 과학기술 서비스 활동을 포함한다.\n2. 국가는 국내 기관, 조직, 개인, 해외에 정주하는 베트남인, 외국 조직, 개인 및 국제기구가 소방 및 구조·구난 업무의 과학기술 활동에 투자, 후원, 참여하도록 장려한다.\n3. 소방 및 구조·구난 분야에 속하는 국내 연구 과제·임무의 결과를 소방 및 구조·구난 기술, 장비·설비의 생산 투자, 개발에 결합·응용하는 것을 우선한다.\n4. 소방 및 구조·구난 데이터베이스·화재 신호 전송 시스템은 소방경찰(소방·구조구난 경찰)이 법률 규정에 따라 관리, 활용, 운영한다.\n5. 정부는 이 조 제4항을 상세히 규정한다; 소방 및 구조·구난에 관한 데이터의 갱신, 신고를 규정한다.\n13 안보·질서와 관련된 10개 법률의 일부 조항을 개정·보충하는 법률 제118/2025/QH15호 제11조 제1항은 2026년 7월 01일부터 효력이 있으며 다음과 같이 규정한다:\n“제11조. 시행 조항\n1. 이 법은 2026년 7월 01일부터 시행한다. 다만, 이 조 제2항의 규정은 제외한다.”.\n2026년 7월 01일부터 효력이 있는 건설법 제135/2025/QH15호 제94조는 다음과 같이 규정한다:\n“제94조. 시행일(효력)\n1. 이 법은 2026년 7월 01일부터 시행한다. 다만, 이 조 제2항에 규정된 경우는 제외한다.\n2. 이 법 제43조 제2항, 제3항, 제71조 및 제95조 제3, 4, 5항은 2026년 01월 01일부터 시행한다.\n3. 법률 제03/2016/QH14호, 법률 제35/2018/QH14호, 법률 제40/2019/QH14호, 법률 제62/2020/QH14호, 법률 제45/2024/QH15호, 법률 제47/2024/QH15호, 법률 제55/2024/QH15호, 법률 제61/2024/QH15호, 법률 제84/2025/QH15호, 법률 제93/2025/QH15호 및 법률 제95/2025/QH15호에 따라 일부 조항이 개정·보충된 건설법 제50/2014/QH13호(이하 건설법 제50/2014/QH13호라 한다)는 이 법의 시행일부터 효력을 상실한다.\n4. 정부는 제6조 제1항, 제7조, 제8조, 제11조, 제16조, 제18조 제1항 a호, 제19조, 제21조, 제22조, 제23조 제3항, 제32조, 제42조, 제47조, 제48조 제1항, 제49조, 제51조, 제54조, 제55조, 제58조, 제64조, 제65조, 제67조, 제68조; 제79조, 제82조, 제85조, 제87조에 규정된 내용을 상세히 규정하고 이 법의 시행을 안내한다.”.","o":[]},{"id":"law-53","d":"law","n":"53","t":"Sửa đổi, bổ sung một số điều của các luật có liên quan","k":"관련 법률의 일부 조항 개정·보충","c":"제8장 시행 조항","x":"1. Bổ sung điểm d vào sau điểm c khoản 3 Điều 10 của Luật Phòng chống thiên tai số 33/2013/QH13 đã được sửa đổi, bổ sung một số điều theo Luật số 60/2020/QH14 và Luật số 18/2023/QH15 như sau:\n“d) Hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.”.\n2. Thay thế từ “thẩm duyệt” bằng từ “thẩm định” tại điểm c khoản 3 Điều 56 và khoản 4 Điều 82 của Luật Xây dựng số 50/2014/QH13 đã được sửa đổi, bổ sung một số điều theo Luật số 03/2016/QH14, Luật số 35/2018/QH14, Luật số 40/2019/QH14 và Luật số 62/2020/QH14.\n3. Sửa đổi, bổ sung các điểm c, d và đ khoản 2 Điều 33 của Luật Thủ đô số 39/2024/QH15 như sau:\n“c) Công trình xây dựng thuộc diện phải thẩm duyệt hoặc thẩm định thiết kế về phòng cháy, chữa cháy nhưng được tổ chức thi công khi chưa có giấy chứng nhận hoặc văn bản thẩm duyệt hoặc văn bản thẩm định thiết kế về phòng cháy, chữa cháy của cơ quan quản lý chuyên ngành;\nd) Công trình thi công không đúng theo thiết kế về phòng cháy, chữa cháy đã được thẩm duyệt hoặc thẩm định;\nđ) Công trình xây dựng, phần công trình xây dựng, hạng mục công trình xây dựng, cơ sở sản xuất, kinh doanh, dịch vụ chưa có văn bản chấp thuận kết quả nghiệm thu về phòng cháy, chữa cháy của cơ quan quản lý chuyên ngành mà đã đưa vào hoạt động;”.","y":"1. 법률 제60/2020/QH14호 및 법률 제18/2023/QH15호에 따라 일부 조항이 개정·보충된 재난예방·대응법 제33/2013/QH13호 제10조 제3항 c호 다음에 d호를 다음과 같이 보충한다:\n“d) 소방 및 구조·구난 활동.”.\n2. 법률 제03/2016/QH14호, 법률 제35/2018/QH14호, 법률 제40/2019/QH14호 및 법률 제62/2020/QH14호에 따라 일부 조항이 개정·보충된 건설법 제50/2014/QH13호 제56조 제3항 c호 및 제82조 제4항에서 “thẩm duyệt”(심의승인)이라는 단어를 “thẩm định”(심사)이라는 단어로 대체한다.\n3. 수도법 제39/2024/QH15호 제33조 제2항 c호, d호 및 đ호를 다음과 같이 개정·보충한다:\n“c) 소방 설계 심의승인(thẩm duyệt) 또는 소방 설계 심사(thẩm định)를 받아야 하는 대상에 속하는 건설공사(건축물)임에도 전문 관리기관의 소방 설계 심의승인 증명서 또는 심의승인 문서 또는 소방 설계 심사 문서가 없는 상태에서 시공이 이루어진 경우;\nd) 심의승인 또는 심사를 받은 소방 설계와 다르게 시공한 건축물;\nđ) 전문 관리기관의 소방 준공검사(인수검사) 결과 승인 문서가 없음에도 이미 운영에 들어간 건설공사(건축물), 건설공사의 일부, 건설공사의 세부 공종(항목), 생산·영업·서비스 사업장;”.","o":[]},{"id":"law-54","d":"law","n":"54","t":"Hiệu lực thi hành","k":"시행일(효력)","c":"제8장 시행 조항","x":"1. Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2025, trừ trường hợp quy định tại khoản 4 Điều này.\n2. Luật Phòng cháy và chữa cháy số 27/2001/QH10 đã được sửa đổi, bổ sung một số điều theo Luật số 40/2013/QH13 và Luật số 30/2023/QH15 hết hiệu lực từ ngày Luật này có hiệu lực thi hành, trừ trường hợp quy định tại Điều 55 của Luật này.\n3. Nghị quyết số 99/2019/QH14 ngày 27/11/2019 của Quốc hội về tiếp tục hoàn thiện, nâng cao hiệu lực, hiệu quả thực hiện chính sách, pháp luật về phòng cháy và chữa cháy hết hiệu lực từ ngày Luật này có hiệu lực thi hành.\n4. Việc trang bị thiết bị truyền tin báo cháy kết nối với hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy theo lộ trình quy định tại khoản 5 Điều 20 và điểm c khoản 1 Điều 23 của Luật này được thực hiện chậm nhất từ ngày 01 tháng 7 năm 2027.","y":"1. 이 법은 2025년 7월 01일부터 시행한다. 다만, 이 조 제4항에 규정된 경우는 제외한다.\n2. 법률 제40/2013/QH13호 및 법률 제30/2023/QH15호에 따라 일부 조항이 개정·보충된 소방법(화재예방 및 진압법) 제27/2001/QH10호는 이 법의 시행일부터 효력을 상실한다. 다만, 이 법 제55조에 규정된 경우는 제외한다.\n3. 소방에 관한 정책·법률 이행의 효력·효과를 계속 보완·제고하는 것에 관한 국회의 2019년 11월 27일(27/11/2019)자 결의 제99/2019/QH14호는 이 법의 시행일부터 효력을 상실한다.\n4. 이 법 제20조 제5항 및 제23조 제1항 c호에 규정된 로드맵(단계별 일정)에 따라 소방 및 구조·구난 데이터베이스·화재 신호 전송 시스템에 연결되는 화재 신호 전송 장치를 구비하는 것은 늦어도 2027년 7월 01일부터 이행한다.","o":[]},{"id":"law-55","d":"law","n":"55","t":"Quy định chuyển tiếp","k":"경과 규정","c":"제8장 시행 조항","x":"1. Hồ sơ giải quyết các thủ tục liên quan đến phòng cháy, chữa cháy, cứu nạn, cứu hộ đã được cơ quan có thẩm quyền tiếp nhận trước ngày Luật này có hiệu lực thi hành nhưng đến ngày Luật này có hiệu lực thi hành chưa giải quyết xong thì được tiếp tục giải quyết theo quy định của Luật Phòng cháy và chữa cháy số 27/2001/QH10 đã được sửa đổi, bổ sung một số điều theo Luật số 40/2013/QH13 và Luật số 30/2023/QH15.\n2. Dự án đầu tư xây dựng công trình, công trình, phương tiện giao thông đã được cơ quan Công an cấp giấy chứng nhận thẩm duyệt thiết kế về phòng cháy và chữa cháy nhưng đến ngày Luật này có hiệu lực thi hành chưa được chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy thì được tiếp tục thực hiện theo quy định của Luật Phòng cháy và chữa cháy số 27/2001/QH10 đã được sửa đổi, bổ sung một số điều theo Luật số 40/2013/QH13 và Luật số 30/2023/QH15.\n3. Chứng nhận huấn luyện nghiệp vụ về phòng cháy, chữa cháy và cứu nạn, cứu hộ đã được cấp trước ngày Luật này có hiệu lực thi hành thì có giá trị sử dụng đến hết thời hạn ghi trong chứng nhận đó.\n4. Cơ quan, tổ chức có chức năng, nhiệm vụ kiểm định phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ trước ngày Luật này có hiệu lực thi hành tiếp tục thực hiện kiểm định phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ cho đến thời hạn theo lộ trình do Chính phủ quy định.\n5. Cơ sở không bảo đảm yêu cầu về phòng cháy và chữa cháy được đưa vào sử dụng trước ngày Luật Phòng cháy và chữa cháy số 27/2001/QH10 có hiệu lực thi hành đã có quy định về giải pháp xử lý của Hội đồng nhân dân cấp tỉnh thì tiếp tục thực hiện theo Nghị quyết của Hội đồng nhân dân cấp tỉnh đã ban hành và phải hoàn thành việc khắc phục các yêu cầu bảo đảm an toàn về phòng cháy và chữa cháy.\n6. Cơ sở không bảo đảm yêu cầu về phòng cháy và chữa cháy và không có khả năng khắc phục theo các tiêu chuẩn, quy chuẩn kỹ thuật tại thời điểm đưa vào hoạt động đến trước ngày Luật này có hiệu lực thi hành, trừ trường hợp quy định tại khoản 5 Điều này thì thực hiện theo quy định sau đây:\na) Ủy ban nhân dân cấp tỉnh phân loại, lập, công bố danh sách cơ sở không bảo đảm yêu cầu về phòng cháy, chữa cháy và không có khả năng khắc phục theo các tiêu chuẩn, quy chuẩn kỹ thuật tại thời điểm đưa vào hoạt động đến trước ngày Luật này có hiệu lực thi hành trên địa bàn quản lý; quy định về cải tạo, chỉnh trang đối với các khu vực đô thị không bảo đảm hạ tầng giao thông hoặc nguồn nước phục vụ chữa cháy theo quy định của pháp luật, quy chuẩn kỹ thuật trong hoạt động phòng cháy và chữa cháy;\nb) Bộ quản lý công trình xây dựng chuyên ngành theo quy định của pháp luật về xây dựng chủ trì, phối hợp với Bộ Công an quy định về phương tiện, thiết bị phòng cháy, chữa cháy và giải pháp kỹ thuật nâng cao an toàn phòng cháy, chữa cháy cho các công trình không bảo đảm yêu cầu phòng cháy, chữa cháy thuộc thẩm quyền quản lý;\nc) Người đứng đầu cơ sở căn cứ hiện trạng kiến trúc, kết cấu, công năng, thiết bị, dây chuyền sản xuất để trang bị phương tiện, thiết bị phòng cháy, chữa cháy phù hợp và lựa chọn giải pháp kỹ thuật tương ứng quy định tại điểm b khoản này để tăng cường giải pháp kỹ thuật bảo đảm an toàn phòng cháy và chữa cháy; tổ chức khắc phục theo các giải pháp kỹ thuật đã lựa chọn, chịu trách nhiệm về kết quả thực hiện, báo cáo bằng văn bản gửi cơ quan quản lý trực tiếp về phòng cháy, chữa cháy, cứu nạn, cứu hộ sau khi hoàn thành việc khắc phục và phải duy trì giải pháp kỹ thuật đã áp dụng trong suốt quá trình hoạt động;\nd) Đối với cơ sở không thể áp dụng được giải pháp kỹ thuật theo quy định tại điểm b khoản này thì phải chuyển đổi công năng phù hợp với quy mô, tính chất hoạt động của cơ sở;\nđ) Chính phủ quy định lộ trình thực hiện nội dung quy định tại khoản này.\n7. Cơ sở, phương tiện giao thông, hộ gia đình và cá nhân không bảo đảm an toàn về phòng cháy và chữa cháy đang bị tạm đình chỉ, đình chỉ hoạt động trước ngày Luật này có hiệu lực thi hành thì tiếp tục được giải quyết theo quy định của Luật Phòng cháy và chữa cháy số 27/2001/QH10 đã được sửa đổi, bổ sung một số điều theo Luật số 40/2013/QH13 và Luật số 30/2023/QH15.","y":"1. 소방 및 구조·구난과 관련된 절차의 처리 서류로서 이 법의 시행일 전에 관할 기관이 접수하였으나 이 법의 시행일까지 처리가 완료되지 않은 것은 법률 제40/2013/QH13호 및 법률 제30/2023/QH15호에 따라 일부 조항이 개정·보충된 소방법(화재예방 및 진압법) 제27/2001/QH10호의 규정에 따라 계속 처리한다.\n2. 공안기관으로부터 소방 설계 심의승인(thẩm duyệt) 증명서를 발급받았으나 이 법의 시행일까지 소방 준공검사(인수검사) 결과 승인을 받지 못한 건설공사 투자사업, 건축물, 교통수단은 법률 제40/2013/QH13호 및 법률 제30/2023/QH15호에 따라 일부 조항이 개정·보충된 소방법(화재예방 및 진압법) 제27/2001/QH10호의 규정에 따라 계속 이행한다.\n3. 이 법의 시행일 전에 발급된 소방 및 구조·구난 직무 훈련 증명서는 그 증명서에 기재된 기한이 끝날 때까지 사용 효력이 있다.\n4. 이 법의 시행일 전에 소방 및 구조·구난 장비·설비를 검정하는 기능·임무를 가진 기관, 조직은 정부가 규정하는 로드맵(단계별 일정)에 따른 기한까지 소방 및 구조·구난 장비·설비의 검정을 계속 수행한다.\n5. 소방법(화재예방 및 진압법) 제27/2001/QH10호의 시행일 전에 사용에 들어간 사업장으로서 소방 요건을 충족하지 못하는 사업장에 대하여 성급 인민의회의 처리 방안에 관한 규정이 이미 있는 경우, 이미 공포된 성급 인민의회의 결의에 따라 계속 이행하며 소방 안전 보장 요건의 시정을 완료하여야 한다.\n6. 소방 요건을 충족하지 못하고, 운영에 들어간 시점의 기술 표준·기술 규정에 따라 이 법의 시행일 전까지 시정할 능력이 없는 사업장은, 이 조 제5항에 규정된 경우를 제외하고, 다음 규정에 따라 이행한다:\na) 성급 인민위원회는 관할 지역 내에서 소방 요건을 충족하지 못하고 운영에 들어간 시점의 기술 표준·기술 규정에 따라 이 법의 시행일 전까지 시정할 능력이 없는 사업장을 분류하고 그 명단을 작성·공표한다; 법률 규정, 소방 활동에 관한 기술 규정에 따라 화재진압을 위한 교통 인프라 또는 수원(水源)이 보장되지 않는 도시 지역에 대한 개조·정비에 관하여 규정한다;\nb) 건설에 관한 법률 규정에 따른 전문 분야 건설공사 관리 부처는 주관하여 공안부와 협조하여, 관리 권한에 속하는 건축물로서 소방 요건을 충족하지 못하는 건축물에 대한 소방 장비·설비 및 소방 안전을 높이는 기술적 해결방안에 관하여 규정한다;\nc) 사업장 대표자는 건축, 구조, 용도(기능), 설비, 생산라인의 현황에 근거하여 적합한 소방 장비·설비를 구비하고, 소방 안전을 보장하는 기술적 해결방안을 강화하기 위하여 이 항 b호에 규정된 해당 기술적 해결방안을 선택한다; 선택한 기술적 해결방안에 따라 시정을 실시하고, 이행 결과에 대하여 책임을 지며, 시정을 완료한 후 소방 및 구조·구난에 관한 직접 관리기관에 서면으로 보고하고, 운영 기간 내내 적용한 기술적 해결방안을 유지하여야 한다;\nd) 이 항 b호의 규정에 따른 기술적 해결방안을 적용할 수 없는 사업장은 사업장의 규모, 활동 성격에 적합하게 용도(기능)를 전환하여야 한다;\nđ) 정부는 이 항에 규정된 내용의 이행 로드맵(단계별 일정)을 규정한다.\n7. 소방 안전을 보장하지 못하여 이 법의 시행일 전에 일시 정지, 영업(활동) 정지 중인 사업장, 교통수단, 가구 및 개인은 법률 제40/2013/QH13호 및 법률 제30/2023/QH15호에 따라 일부 조항이 개정·보충된 소방법(화재예방 및 진압법) 제27/2001/QH10호의 규정에 따라 계속 처리한다.","o":[]},{"id":"nd105-1","d":"nd105","n":"1","t":"Phạm vi điều chỉnh","k":"적용 범위","c":"제1장 총칙","x":"Nghị định này quy định chi tiết một số điều và biện pháp thi hành Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ bao gồm:\n1. Khoản 7, khoản 8 Điều 2 về danh mục cơ sở thuộc diện quản lý về phòng cháy, chữa cháy, danh mục cơ sở có nguy hiểm về cháy, nổ.\n2. Điều 7 về nội dung quản lý nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ; trách nhiệm của các bộ, cơ quan ngang bộ, Ủy ban nhân dân các cấp trong thực hiện quản lý nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n3. Khoản 10 Điều 8 về ban hành nội quy phòng cháy, chữa cháy, cứu nạn, cứu hộ; việc lập, quản lý hồ sơ về phòng cháy, chữa cháy, cứu nạn, cứu hộ; việc khai báo, cập nhật dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n4. Khoản 6 Điều 10 về nội dung, thời gian thực tập phương án chữa cháy, cứu nạn, cứu hộ và phương án cứu nạn, cứu hộ.\n5. Khoản 4 Điều 11 về nội dung, thẩm quyền, trình tự, thủ tục kiểm tra về phòng cháy, chữa cháy.\n6. Khoản 5 Điều 15 về yêu cầu phòng cháy, chữa cháy khi lập, điều chỉnh, phê duyệt quy hoạch đô thị và nông thôn.\n7. Khoản 4 Điều 17 về việc thẩm định thiết kế về phòng cháy và chữa cháy đối với dự án đầu tư xây dựng công trình, công trình, phương tiện giao thông; việc điều chỉnh thiết kế, thay đổi công năng, cải tạo; danh mục công trình, phương tiện giao thông thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy; nội dung, trình tự, thủ tục, thẩm quyền thẩm định thiết kế về phòng cháy và chữa cháy; trách nhiệm phối hợp trong thẩm định thiết kế về phòng cháy và chữa cháy.\n8. Khoản 6 Điều 18 về tổ chức thi công, nghiệm thu công trình, phương tiện giao thông; bảo đảm an toàn phòng cháy và chữa cháy trong quá trình thi công; nội dung, trình tự, thủ tục, thẩm quyền kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy; trách nhiệm phối hợp kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy.\n9. Khoản 5 Điều 20 về lộ trình phải trang bị bình chữa cháy, thiết bị truyền tin báo cháy kết nối với hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy.\n10. Điểm c khoản 1 Điều 23 về lộ trình trang bị thiết bị truyền tin báo cháy kết nối với hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy; lộ trình khai báo, cập nhật dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n11. Khoản 8 Điều 25 về việc Bộ Quốc phòng phối hợp với Bộ Công an tổ chức chữa cháy đối với công trình lưỡng dụng thuộc phạm vi quản lý của Bộ Quốc phòng.\n12. Khoản 6 Điều 26 về thủ tục huy động lực lượng, người, phương tiện, tài sản để chữa cháy; việc huy động lực lượng, người, phương tiện, tài sản của Quân đội để tham gia chữa cháy.\n13. Khoản 4 Điều 27 về trách nhiệm đầu tư, quản lý, bảo trì, bảo dưỡng trụ nước chữa cháy; đầu tư, quản lý các điểm, bến để xe chữa cháy, máy bơm chữa cháy lấy nước phục vụ chữa cháy.\n14. Khoản 6 Điều 35 về thủ tục huy động lực lượng, người, phương tiện, tài sản tham gia cứu nạn, cứu hộ.\n15. Khoản 4 Điều 37 về thành lập Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành; tổ chức, hoạt động và chế độ bảo đảm điều kiện hoạt động đối với lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành, lực lượng dân phòng.\n16. Khoản 5 Điều 39 về phòng cháy, chữa cháy, cứu nạn, cứu hộ tình nguyện.\n17. Khoản 3 Điều 44 về việc cấp phép trước khi lưu thông trên thị trường đối với phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ và vật liệu, cấu kiện ngăn cháy, chống cháy; danh mục phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ, vật liệu, cấu kiện ngăn cháy, chống cháy.\n18. Khoản 5 Điều 45 về nội dung, thẩm quyền, thời gian huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ; chế độ, chính sách cho người tham gia huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n19. Khoản 4 Điều 46 về chế độ, chính sách đối với người được huy động, người tham gia chữa cháy, cứu nạn, cứu hộ không thuộc lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ; người được huy động, người tham gia phòng cháy, chữa cháy, cứu nạn, cứu hộ bị tai nạn, bị thương, chết.\n20. Khoản 3 Điều 48 về danh mục cơ sở phải mua bảo hiểm cháy, nổ bắt buộc; mức trích nộp, chế độ quản lý, sử dụng nguồn thu từ bảo hiểm cháy, nổ bắt buộc cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n21. Khoản 3 Điều 49 về đóng góp tự nguyện, tài trợ bằng tiền, hiện vật của cơ quan, tổ chức, cá nhân trong nước, nước ngoài cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ; việc hỗ trợ từ Quỹ phòng, chống thiên tai cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n22. Khoản 7 Điều 50 về ngân sách nhà nước bảo đảm cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n23. Khoản 5 Điều 52 về hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy; việc cập nhật, khai báo dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n24. Khoản 4 và điểm đ khoản 6 Điều 55 về quy định chuyển tiếp về kiểm định phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ; lộ trình xử lý cơ sở không bảo đảm yêu cầu về phòng cháy và chữa cháy và không có khả năng khắc phục theo các tiêu chuẩn, quy chuẩn kỹ thuật tại thời điểm đưa vào hoạt động đến trước ngày Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ có hiệu lực thi hành.","y":"이 시행령은 「소방 및 구조·구난법」의 일부 조항 및 시행 조치를 상세히 규정하며 다음을 포함한다:\n1. 소방 관리 대상 사업장 목록, 화재·폭발 위험 사업장 목록에 관한 제2조 제7항, 제8항.\n2. 소방 및 구조·구난에 관한 국가관리의 내용; 소방 및 구조·구난에 관한 국가관리 수행에서 각 부, 부급 기관, 각급 인민위원회의 책임에 관한 제7조.\n3. 소방 및 구조·구난 내규의 제정; 소방 및 구조·구난에 관한 서류의 작성·관리; 소방 및 구조·구난에 관한 데이터의 신고·갱신에 관한 제8조 제10항.\n4. 화재진압·구조구난 계획(방안) 및 구조·구난 계획(방안)의 훈련(실습) 내용, 시간에 관한 제10조 제6항.\n5. 소방 점검(검사)의 내용, 권한, 순서, 절차에 관한 제11조 제4항.\n6. 도시 및 농촌 계획을 수립, 조정, 승인할 때의 소방 요건에 관한 제15조 제5항.\n7. 건설공사 투자사업, 건축물, 교통수단에 대한 소방 설계 심사; 설계 조정, 용도(기능) 변경, 개조; 소방 설계 심사를 받아야 하는 대상에 속하는 건축물, 교통수단 목록; 소방 설계 심사의 내용, 순서, 절차, 권한; 소방 설계 심사에서의 협조 책임에 관한 제17조 제4항.\n8. 건축물, 교통수단의 시공, 준공검사(인수검사)의 실시; 시공 과정에서의 소방 안전 보장; 소방 준공검사(인수검사) 확인의 내용, 순서, 절차, 권한; 소방 준공검사(인수검사) 확인의 협조 책임에 관한 제18조 제6항.\n9. 소화기, 소방 및 구조·구난 데이터베이스·화재 신호 전송 시스템에 연결되는 화재 신호 전송 장치를 구비하여야 하는 로드맵(단계별 일정)에 관한 제20조 제5항.\n10. 소방 및 구조·구난 데이터베이스·화재 신호 전송 시스템에 연결되는 화재 신호 전송 장치를 구비하는 로드맵(단계별 일정); 소방 및 구조·구난에 관한 데이터의 신고·갱신 로드맵(단계별 일정)에 관한 제23조 제1항 c호.\n11. 국방부가 공안부와 협조하여 국방부의 관리 범위에 속하는 군민 겸용(이중용도) 건축물에 대한 화재진압을 실시하는 것에 관한 제25조 제8항.\n12. 화재진압을 위한 인력(부대), 사람, 장비, 재산의 동원 절차; 화재진압 참여를 위한 군대의 인력(부대), 사람, 장비, 재산의 동원에 관한 제26조 제6항.\n13. 소화전의 투자, 관리, 유지보수, 정비 책임; 소방차, 소방펌프가 화재진압용 물을 취수하는 지점, 부두(취수장)의 투자, 관리에 관한 제27조 제4항.\n14. 구조·구난에 참여하는 인력(부대), 사람, 장비, 재산의 동원 절차에 관한 제35조 제6항.\n15. 사업장 자체 소방·구조구난대, 전문 소방·구조구난대의 설립; 사업장 자체 소방대(소방·구조구난), 전문 소방대(소방·구조구난), 민방위 소방대의 조직, 활동 및 활동 조건 보장 제도에 관한 제37조 제4항.\n16. 자원(봉사) 소방 및 구조·구난에 관한 제39조 제5항.\n17. 소방 및 구조·구난 장비·설비 및 방화·내화 자재, 부재에 대한 시장 유통 전 허가; 소방 및 구조·구난 장비·설비, 방화·내화 자재, 부재의 목록에 관한 제44조 제3항.\n18. 소방 및 구조·구난 직무 훈련·교육의 내용, 권한, 시간; 소방 및 구조·구난 직무 훈련·교육에 참여하는 사람에 대한 제도·정책에 관한 제45조 제5항.\n19. 소방 및 구조·구난 인력에 속하지 않으면서 동원된 사람, 화재진압 및 구조·구난에 참여한 사람; 동원된 사람, 소방 및 구조·구난에 참여한 사람으로서 사고를 당하거나, 부상을 입거나, 사망한 사람에 대한 제도·정책에 관한 제46조 제4항.\n20. 화재·폭발 의무보험 가입 대상 사업장 목록; 소방 및 구조·구난 활동을 위한 화재·폭발 의무보험 수입의 적립·납부 비율, 관리·사용 제도에 관한 제48조 제3항.\n21. 소방 및 구조·구난 활동을 위한 국내, 외국 기관, 조직, 개인의 자발적 기부, 금전·현물 후원; 소방 및 구조·구난 활동을 위한 재난예방·대응기금의 지원에 관한 제49조 제3항.\n22. 소방 및 구조·구난 활동을 보장하는 국가예산에 관한 제50조 제7항.\n23. 소방 및 구조·구난 데이터베이스·화재 신호 전송 시스템; 소방 및 구조·구난에 관한 데이터의 갱신, 신고에 관한 제52조 제5항.\n24. 소방 및 구조·구난 장비·설비 검정에 관한 경과 규정; 소방 요건을 충족하지 못하고 운영에 들어간 시점의 기술 표준·기술 규정에 따라 「소방 및 구조·구난법」의 시행일 전까지 시정할 능력이 없는 사업장의 처리 로드맵(단계별 일정)에 관한 제55조 제4항 및 제6항 đ호.","o":[["Khoản 8 Điều 1 được sửa đổi, bổ sung bởi khoản 1 Điều 10 Nghị định số 347/2026/NĐ-CP","nd347-10"],["Khoản 17 Điều 1 được sửa đổi, bổ sung bởi khoản 2 Điều 10 Nghị định số 347/2026/NĐ-CP","nd347-10"]]},{"id":"nd105-2","d":"nd105","n":"2","t":"Phụ lục","k":"부록","c":"제1장 총칙","x":"Ban hành kèm theo Nghị định này các phụ lục sau đây:\n1. Phụ lục I: Danh mục cơ sở thuộc diện quản lý về phòng cháy, chữa cháy.\n2. Phụ lục II: Danh mục cơ sở có nguy hiểm về cháy, nổ.\n3. Phụ lục III: Danh mục công trình, phương tiện giao thông thuộc diện thẩm định thiết kế về phòng cháy và chữa cháy do cơ quan quản lý chuyên ngành thầm định.\n4. Phụ lục IV: Danh mục phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ và vật liệu, cấu kiện ngăn cháy, chống cháy.\n5. Phụ lục V: Danh mục phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ và vật liệu, cấu kiện ngăn cháy, chống cháy thuộc diện cấp giấy phép lưu thông.\n6. Phụ lục VI: Mức phí bảo hiểm và mức khấu trừ bảo hiểm cháy, nổ bắt buộc.\n7. Phụ lục VII: Danh mục cơ sở phải mua bảo hiểm cháy, nổ bắt buộc.\n8. Phụ lục VIII: Các biểu mẫu.","y":"이 시행령에 다음의 부록을 첨부하여 공포한다:\n1. 부록 I: 소방 관리 대상 사업장 목록.\n2. 부록 II: 화재·폭발 위험 사업장 목록.\n3. 부록 III: 전문 관리기관이 심사하는 소방 설계 심사 대상 건축물, 교통수단 목록.\n4. 부록 IV: 소방 및 구조·구난 장비·설비 및 방화·내화 자재, 부재 목록.\n5. 부록 V: 유통 허가서 발급 대상에 속하는 소방 및 구조·구난 장비·설비 및 방화·내화 자재, 부재 목록.\n6. 부록 VI: 화재·폭발 의무보험의 보험료율 및 자기부담금.\n7. 부록 VII: 화재·폭발 의무보험 가입 대상 사업장 목록.\n8. 부록 VIII: 각종 서식.","o":[]},{"id":"nd105-3","d":"nd105","n":"3","t":"Nội quy phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 내규","c":"제2장 화재예방","x":"1. Nội quy phòng cháy, chữa cháy, cứu nạn, cứu hộ đối với cơ sở gồm các nội dung cơ bản sau:\na) Quy định việc quản lý, sử dụng điện, nguồn lửa, nguồn nhiệt, thiết bị, dụng cụ sinh lửa, sinh nhiệt, chất dễ cháy, nổ;\nb) Quy định việc quản lý, sử dụng phương tiện, thiết bị phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nc) Quy định nội dung cần thực hiện khi có cháy, nổ, tai nạn, sự cố xảy ra.\n2. Nội quy phòng cháy, chữa cháy, cứu nạn, cứu hộ đối với phương tiện giao thông gồm các nội dung cơ bản sau:\na) Các nội dung quy định tại khoản 1 Điều này;\nb) Quy định việc bố trí, sắp xếp hàng hóa nguy hiểm về cháy, nổ trên phương tiện giao thông.\n3. Người đứng đầu cơ sở, chủ phương tiện giao thông ban hành hoặc tham mưu người có thẩm quyền ban hành nội quy phòng cháy, chữa cháy, cứu nạn, cứu hộ; nội quy phòng cháy, chữa cháy, cứu nạn, cứu hộ phải phù hợp với tính chất, đặc điểm hoạt động của cơ sở, phương tiện giao thông và được phổ biến, niêm yết ở vị trí dễ thấy.","y":"1. 사업장에 대한 소방 및 구조·구난 내규는 다음의 기본 내용을 포함한다:\na) 전기, 화원(불씨), 열원, 불·열을 발생시키는 설비·기구, 가연성·폭발성 물질의 관리·사용에 관한 규정;\nb) 소방 및 구조·구난 장비·설비의 관리·사용에 관한 규정;\nc) 화재, 폭발, 사고, 장애(비상사태)가 발생한 때 이행하여야 할 내용에 관한 규정.\n2. 교통수단에 대한 소방 및 구조·구난 내규는 다음의 기본 내용을 포함한다:\na) 이 조 제1항에 규정된 내용;\nb) 교통수단에서 화재·폭발 위험 화물의 배치·적재에 관한 규정.\n3. 사업장 대표자, 교통수단 소유자는 소방 및 구조·구난 내규를 제정하거나 권한 있는 자가 제정하도록 건의(보좌)한다; 소방 및 구조·구난 내규는 사업장, 교통수단의 활동 성격·특성에 적합하여야 하며 주지시키고 잘 보이는 위치에 게시하여야 한다.","o":[]},{"id":"nd105-4","d":"nd105","n":"4","t":"Hồ sơ về phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난에 관한 서류","c":"제2장 화재예방","x":"1. Hồ sơ về phòng cháy, chữa cháy, cứu nạn, cứu hộ của cơ sở gồm các tài liệu sau:\na) Phiếu thông tin của cơ sở theo Mẫu số PC01 kèm theo Nghị định này;\nb) Nội quy phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nc) Giấy chứng nhận thẩm duyệt thiết kế hoặc văn bản thẩm duyệt thiết kế về phòng cháy và chữa cháy hoặc văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy của cơ quan quản lý chuyên ngành đối với công trình thuộc diện phải thẩm duyệt thiết kế, thẩm định thiết kế về phòng cháy và chữa cháy;\nd) Quyết định thành lập Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở hoặc Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành hoặc văn bản phân công người thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ tại cơ sở; thông báo kết quả huấn luyện nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nđ) Phương án chữa cháy, cứu nạn, cứu hộ của cơ sở theo Mẫu số PC06 kèm theo Nghị định này;\ne) Sổ theo dõi phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của Bộ trưởng Bộ Công an;\ng) Biên bản tự kiểm tra về phòng cháy, chữa cháy của cơ sở theo Mẫu số PC02 kèm theo Nghị định này;\nh) Báo cáo kết quả thực hiện công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ của cơ sở theo Mẫu số PC04 kèm theo Nghị định này;\ni) Giấy Chứng nhận bảo hiểm cháy, nổ bắt buộc đối với cơ sở phải mua bảo hiểm cháy, nổ bắt buộc;\nk) Bản vẽ hoàn công hệ thống, hạng mục liên quan đến phòng cháy và chữa cháy đối với công trình thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy;\nl) Thông báo kết quả xác minh, giải quyết vụ cháy của cơ quan Công an (nếu có);\nm) Biên bản kiểm tra về phòng cháy, chữa cháy của Ủy ban nhân dân cấp xã hoặc cơ quan Công an, cơ quan chuyên môn về xây dựng trực tiếp quản lý cơ sở;\nn) Biên bản vi phạm hành chính, quyết định xử phạt vi phạm hành chính về phòng cháy, chữa cháy và cứu nạn, cứu hộ, quyết định tạm đình chỉ, đình chỉ hoạt động, phục hồi hoạt động của người có thẩm quyền, văn bản kiến nghị về phòng cháy, chữa cháy của Ủy ban nhân dân cấp xã hoặc cơ quan Công an, cơ quan chuyên môn về xây dựng trực tiếp quản lý cơ sở (nếu có);\no) Văn bản thể hiện việc phân công người thực hiện kiểm tra về phòng cháy, chữa cháy tại cơ sở (nếu có).\n2. Người đứng đầu cơ sở lập, quản lý, cập nhật hồ sơ về phòng cháy, chữa cháy, cứu nạn, cứu hộ của cơ sở gồm các tài liệu quy định tại khoản 1 Điều này.\n3. Cơ quan quản lý chuyên ngành lập hồ sơ quản lý về phòng cháy, chữa cháy, cứu nạn, cứu hộ đối với cơ sở thuộc diện quản lý theo quy định sau:\na) Cơ quan chuyên môn về xây dựng lập hồ sơ quản lý về phòng cháy, chữa cháy, cứu nạn, cứu hộ đối với cơ sở thuộc phạm vi quản lý gồm các tài liệu quy định tại các điểm h, k, m, n và điểm o khoản 1 Điều này;\nb) Cơ quan Công an lập hồ sơ quản lý về phòng cháy, chữa cháy, cứu nạn, cứu hộ đối với cơ sở thuộc phạm vi quản lý gồm các tài liệu quy định tại các điểm a, h, k, l, m, n và điểm o khoản 1 Điều này, các tài liệu khác theo quy định về công tác hồ sơ nghiệp vụ Công an nhân dân;\nc) Ủy ban nhân dân cấp xã lập hồ sơ quản lý về phòng cháy, chữa cháy, cứu nạn, cứu hộ đối với cơ sở thuộc phạm vi quản lý gồm các tài liệu quy định tại các điểm a, h, k, l, m, n và điểm o khoản 1 Điều này.\n4. Tài liệu có trong hồ sơ quy định tại khoản 2 và khoản 3 Điều này được lưu trữ dưới dạng tài liệu giấy hoặc tài liệu điện tử hoặc kết hợp tài liệu giấy và tài liệu điện tử theo quy định của pháp luật về lưu trữ.\nTài liệu quy định tại các điểm g, h, i, l và điểm n khoản 1 Điều này được lưu trữ tối thiểu 05 năm kể từ năm lập, ban hành.","y":"1. 사업장의 소방 및 구조·구난에 관한 서류는 다음의 자료를 포함한다:\na) 이 시행령에 첨부된 서식 PC01에 따른 사업장 정보표;\nb) 소방 및 구조·구난 내규;\nc) 소방 설계 심의승인(thẩm duyệt), 소방 설계 심사를 받아야 하는 대상에 속하는 건축물에 대한 전문 관리기관의 소방 설계 심의승인 증명서 또는 소방 설계 심의승인 문서 또는 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서;\nd) 사업장 자체 소방·구조구난대 또는 전문 소방·구조구난대의 설립 결정서 또는 사업장에서 소방 및 구조·구난 임무를 수행할 사람을 지정한 문서; 소방 및 구조·구난 직무 훈련 결과 통보서;\nđ) 이 시행령에 첨부된 서식 PC06에 따른 사업장의 화재진압·구조구난 계획(방안);\ne) 공안부 장관의 규정에 따른 소방 및 구조·구난 장비·설비 관리대장;\ng) 이 시행령에 첨부된 서식 PC02에 따른 사업장의 소방 자체 점검 기록서;\nh) 이 시행령에 첨부된 서식 PC04에 따른 사업장의 소방 및 구조·구난 업무 이행 결과 보고서;\ni) 화재·폭발 의무보험 가입 대상 사업장의 경우 화재·폭발 의무보험 증명서;\nk) 소방 설계 심사를 받아야 하는 대상에 속하는 건축물의 경우 소방과 관련된 설비(시스템), 세부 공종(항목)의 준공도면;\nl) 공안기관의 화재 사건 확인·처리 결과 통보서(있는 경우);\nm) 사업장을 직접 관리하는 사(면)급 인민위원회 또는 공안기관, 건설 전문기관의 소방 점검(검사) 기록서;\nn) 행정위반 기록서, 소방 및 구조·구난에 관한 행정위반 처벌 결정서, 권한 있는 자의 일시 정지, 영업(활동) 정지, 활동 재개 결정서, 사업장을 직접 관리하는 사(면)급 인민위원회 또는 공안기관, 건설 전문기관의 소방에 관한 건의(권고) 문서(있는 경우);\no) 사업장에서 소방 점검(검사)을 수행할 사람을 지정하였음을 나타내는 문서(있는 경우).\n2. 사업장 대표자는 이 조 제1항에 규정된 자료로 구성되는 사업장의 소방 및 구조·구난에 관한 서류를 작성, 관리, 갱신한다.\n3. 전문 관리기관은 관리 대상 사업장에 대하여 다음 규정에 따라 소방 및 구조·구난에 관한 관리 서류를 작성한다:\na) 건설 전문기관은 관리 범위에 속하는 사업장에 대하여 이 조 제1항 h호, k호, m호, n호 및 o호에 규정된 자료로 구성되는 소방 및 구조·구난에 관한 관리 서류를 작성한다;\nb) 공안기관은 관리 범위에 속하는 사업장에 대하여 이 조 제1항 a호, h호, k호, l호, m호, n호 및 o호에 규정된 자료, 인민공안 업무(직무) 서류 작업에 관한 규정에 따른 그 밖의 자료로 구성되는 소방 및 구조·구난에 관한 관리 서류를 작성한다;\nc) 사(면)급 인민위원회는 관리 범위에 속하는 사업장에 대하여 이 조 제1항 a호, h호, k호, l호, m호, n호 및 o호에 규정된 자료로 구성되는 소방 및 구조·구난에 관한 관리 서류를 작성한다.\n4. 이 조 제2항 및 제3항에 규정된 서류에 포함된 자료는 기록보존(보관)에 관한 법률 규정에 따라 종이 자료 또는 전자 자료 또는 종이 자료와 전자 자료를 병행하는 형태로 보관한다.\n이 조 제1항 g호, h호, i호, l호 및 n호에 규정된 자료는 작성·발행한 해부터 최소 05년간 보관한다.","o":[["Điểm c khoản 1 Điều 4 được sửa đổi, bổ sung bởi khoản 1 Điều 11 Nghị định số 347/2026/NĐ-CP","nd347-11"],["Khoản 4 Điều 4 được sửa đổi, bổ sung bởi khoản 2 Điều 11 Nghị định số 347/2026/NĐ-CP","nd347-11"]]},{"id":"nd105-5","d":"nd105","n":"5","t":"Yêu cầu về phòng cháy, chữa cháy khi lập, điều chỉnh, phê duyệt quy hoạch đô thị và nông thôn","k":"도시 및 농촌 계획을 수립, 조정, 승인할 때의 소방 요건","c":"제2장 화재예방","x":"1. Quy hoạch chung phải thể hiện định hướng phát triển trục giao thông, tuyến truyền dẫn cấp nước, tuyến thông tin viễn thông phục vụ phòng cháy, chữa cháy và mạng lưới trụ sở đơn vị Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ.\nQuy hoạch chung phải thể hiện các nội dung theo quy định tại khoản 2 Điều này đối với khu vực thuộc phạm vi quy hoạch chung nhưng không có yêu cầu lập quy hoạch phân khu theo quy định của pháp luật về quy hoạch đô thị và nông thôn.\n2. Quy hoạch phân khu đô thị, khu chức năng được lập theo quy định của pháp luật về quy hoạch đô thị và nông thôn phải thể hiện các nội dung quy định tại điểm a và điểm b khoản 2 Điều 15 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ và vị trí ô đất, quy mô dự kiến bố trí các trụ sở đơn vị Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ bảo đảm bán kính phục vụ theo quy chuẩn kỹ thuật quốc gia về quy hoạch xây dựng.\n3. Quy hoạch chi tiết đô thị, khu dân cư, cụm công nghiệp, khu chức năng khác được lập theo quy định của pháp luật về quy hoạch đô thị và nông thôn phải bảo đảm các yêu cầu về phòng cháy, chữa cháy được quy định tại các điểm a, b và điểm c khoản 3 Điều 15 Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ theo tiêu chuẩn, quy chuẩn kỹ thuật quốc gia; diện tích xây dựng của trụ sở đơn vị Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ phải bảo đảm theo quy định của Bộ trưởng Bộ Công an.","y":"1. 종합계획(quy hoạch chung)은 소방을 위한 교통축, 급수 송수 노선, 정보통신 노선의 발전 방향과 소방경찰(소방·구조구난 경찰) 단위의 청사 네트워크를 나타내야 한다.\n종합계획은 종합계획의 범위에 속하지만 도시 및 농촌 계획에 관한 법률 규정에 따라 구역계획 수립이 요구되지 않는 지역에 대하여 이 조 제2항의 규정에 따른 내용을 나타내야 한다.\n2. 도시 및 농촌 계획에 관한 법률 규정에 따라 수립되는 도시, 기능구역의 구역계획(quy hoạch phân khu)은 「소방 및 구조·구난법」 제15조 제2항 a호 및 b호에 규정된 내용과, 건설계획에 관한 국가기술규정에 따른 서비스 반경을 보장하도록 소방경찰(소방·구조구난 경찰) 단위의 청사를 배치할 예정인 필지의 위치, 규모를 나타내야 한다.\n3. 도시 및 농촌 계획에 관한 법률 규정에 따라 수립되는 도시, 주거지역, 산업클러스터, 그 밖의 기능구역의 상세계획(quy hoạch chi tiết)은 「소방 및 구조·구난법」 제15조 제3항 a호, b호 및 c호에 규정된 소방 요건을 국가 기술 표준·기술 규정에 따라 보장하여야 한다; 소방경찰(소방·구조구난 경찰) 단위 청사의 건축면적은 공안부 장관의 규정에 따라 보장되어야 한다.","o":[]},{"id":"nd105-6","d":"nd105","n":"6","t":"Thẩm định thiết kế về phòng cháy và chữa cháy, kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy của cơ quan chuyên môn về xây dựng","k":"건설 전문기관의 소방 설계 심사, 소방 준공검사(인수검사) 확인","c":"제2장 화재예방","x":"1. Công trình thuộc đối tượng phải thẩm định Báo cáo nghiên cứu khả thi đầu tư xây dựng, thiết kế xây dựng triển khai sau thiết kế cơ sở tại cơ quan chuyên môn về xây dựng và thuộc Phụ lục III kèm theo Nghị định này phải được cơ quan chuyên môn về xây dựng thẩm định thiết kế về phòng cháy và chữa cháy. Việc thực hiện thẩm định thiết kế về phòng cháy và chữa cháy trong báo cáo nghiên cứu khả thi, thiết kế xây dựng triển khai sau thiết kế cơ sở và thời gian trả kết quả thẩm định thiết kế về phòng cháy và chữa cháy được tích hợp, lồng ghép với quá trình thực hiện thẩm định báo cáo nghiên cứu khả thi, thiết kế xây dựng triển khai sau thiết kế cơ sở và trả kết quả thẩm định theo quy định của pháp luật về xây dựng.\nĐối với công trình thuộc trường hợp quy định tại khoản 1 Điều 9 Nghị định này, chủ đầu tư, chủ sở hữu công trình được nộp đồng thời hồ sơ thẩm định thiết kế xây dựng triển khai sau thiết kế cơ sở của cơ quan chuyên môn về xây dựng và hồ sơ thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan Công an.\n2. Nội dung thẩm định thiết kế về phòng cháy và chữa cháy:\na) Khoảng cách phòng cháy, chữa cháy giữa các công trình, hạng mục công trình trong cùng lô đất; khoảng cách phòng cháy, chữa cháy từ công trình, hạng mục công trình đến công trình tiếp giáp hoặc ranh giới khu đất; khoảng cách phòng cháy, chữa cháy từ công trình, hạng mục công trình đến các đối tượng tiếp giáp theo quy định của pháp luật chuyên ngành;\nb) Đường, bãi đỗ, vị trí, lối vào để tiếp cận và tổ chức các hoạt động chữa cháy, cứu nạn, cứu hộ;\nc) Lối thoát nạn, đường thoát nạn, thang bộ thoát nạn, thang máy chữa cháy, lối
