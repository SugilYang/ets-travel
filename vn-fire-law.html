an báo cáo về Bộ Công an (qua Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ) để kịp thời hướng dẫn./.","y":"1. 소방·구조구난 경찰국 국장은 이 시행규칙의 시행을 추적, 지도, 점검, 독려할 책임이 있다.\n2. 성, 중앙직할시 공안은 동급 인민위원회가 관리 범위에 속하는 지역의 민방위 소방대를 위한 소방 및 구조·구난 장비·설비의 관리, 사용에 관한 규정(규제)을 다음의 내용으로 공포하도록 자문할 책임이 있다: 장비·설비의 관리, 사용 원칙; 장비·설비의 비치, 관리, 사용에 있어서 사(면)급 인민위원회, 민방위 소방대 대원의 책임; 장비·설비의 창고, 보관 장소의 관리를 배정받은 자의 조건, 책임; 그 밖의 관련 내용.\n3. 부 본부 소속 단위의 장, 성, 중앙직할시 공안 청장 및 관련 조직, 개인은 이 시행규칙을 시행할 책임을 진다.\n4. 각 부, 부급 기관, 정부 직속 기관의 장, 각 성, 중앙직할시 인민위원회는 자신의 기능, 임무, 권한의 범위 내에서 자신의 부, 부문, 지방이 관리하는 기관, 조직의 소방 및 구조·구난 장비·설비의 관리, 보관, 정비 업무 수행을 관리, 점검하는 데 공안부와 협력하여 줄 것을 요청한다.\n이 시행규칙의 시행 과정에서 어려움, 문제점이 있는 경우, 각 단위, 지방의 공안, 관련 기관, 조직, 개인은 적시에 지도받을 수 있도록 공안부(소방·구조구난 경찰국 경유)에 보고한다./.","o":[]},{"id":"tt36-PLI","d":"tt36","n":"PLI","t":"DANH MỤC, SỐ LƯỢNG PHƯƠNG TIỆN PHÒNG CHÁY, CHỮA CHÁY, CỨU NẠN, CỨU HỘ TRANG BỊ CHO LỰC LƯỢNG DÂN PHÒNG, LỰC LƯỢNG PHÒNG CHÁY, CHỮA CHÁY VÀ CỨU NẠN, CỨU HỘ CƠ SỞ, LỰC LƯỢNG PHÒNG CHÁY, CHỮA CHÁY VÀ CỨU NẠN, CỨU HỘ CHUYÊN NGÀNH (Kèm theo Thông tư số 36/2025/TT-BCA ngày 15 tháng 5 năm 2025 của Bộ trưởng Bộ Công an) _________________","k":"민방위 소방대, 사업장 자체 소방대, 전문 소방대에 비치하는 소방 및 구조·구난 장비·설비의 목록, 수량 (공안부 장관의 2025년 5월 15일자 시행규칙 제36/2025/TT-BCA호에 첨부) _________________","c":"부록","x":"STT\nDANH MỤC\nĐƠN VỊ\nSỐ LƯỢNG\n(Trang bị cho 01 đội)\nĐội dân phòng\nĐội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở\nĐội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành\nCơ sở thuộc Phụ lục II kèm theo Nghị định số 105/2025/NĐ-CP\nCơ sở còn lại thuộc Phụ lục I kèm theo Nghị định số 105/2025/NĐ-CP\n1\nBình bột chữa cháy xách tay có khối lượng chất chữa cháy không nhỏ hơn 04 kg\nBình\n05\n2\nBình khí chữa cháy xách tay có khối lượng chất chữa cháy không nhỏ hơn 03kg hoặc bình chữa cháy gốc nước xách tay có dung tích chất chữa cháy không nhỏ hơn 06 lít\nBình\n05\n3\nĐèn (độ sáng tối thiểu 200 lm, chịu nước tối thiểu IPX5)\nChiếc\n02\n02\n01\n03\n4\nRìu (chất liệu đầu rìu bằng thép cacbon cao)\nChiếc\n01\n02\n01\n02\n5\nXà beng (một đầu nhọn, một đầu dẹt; dài tối thiểu 100 cm)\nChiếc\n01\n01\n01\n01\n6\nBúa (chất liệu đầu búa bằng thép cacbon cao, nặng tối thiểu 5 kg,)\nChiếc\n01\n01\n01\n01\n7\nKìm cộng lực (có tải cắt tối thiểu 60 kg)\nChiếc\n01\n01\n01\n01\n8\nMặt nạ lọc độc hoặc mặt nạ phòng độc cách ly\nBộ\n03\n03\n03\n* Ghi chú:\n- Các phương tiện phải được quản lý, bảo quản, bảo dưỡng theo quy định tại Thông tư này; thời hạn sử dụng theo niên hạn của nhà sản xuất, được thay thế khi hết niên hạn sử dụng hoặc khi bị hư hỏng.\n- Trường hợp phương tiện quy định trong Phụ lục này đã được trang bị tại cơ sở theo quy định của tiêu chuẩn, quy chuẩn kỹ thuật hoặc trang bị trên phương tiện chữa cháy cơ giới của cơ sở thì không bắt buộc trang bị những phương tiện đã có cho Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành.\n- Trong quá trình thực hiện nhiệm vụ, Đội trưởng Đội dân phòng, Đội trưởng Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, Đội trưởng Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành quyết định việc giao phương tiện cho từng thành viên trong đội để sử dụng và loại phương tiện để sử dụng chung./.","y":"순번\n목록\n단위\n수량\n(01개 대에 비치)\n민방위 소방대\n사업장 자체 소방대\n전문 소방대\n시행령 제105/2025/NĐ-CP호에 첨부된 부록 II에 속하는 사업장\n시행령 제105/2025/NĐ-CP호에 첨부된 부록 I에 속하는 나머지 사업장\n1\n소화 약제 질량이 04 kg 이상인 휴대용 분말 소화기\n개(소화기)\n05\n2\n소화 약제 질량이 03kg 이상인 휴대용 가스 소화기 또는 소화 약제 용량이 06 리터 이상인 휴대용 수계(물 기반) 소화기\n개(소화기)\n05\n3\n조명등(최소 밝기 200 lm, 최소 방수 등급 IPX5)\n개\n02\n02\n01\n03\n4\n도끼(도끼 머리 재질은 고탄소강)\n개\n01\n02\n01\n02\n5\n쇠지렛대(한쪽 끝은 뾰족하고 한쪽 끝은 납작함; 최소 길이 100 cm)\n개\n01\n01\n01\n01\n6\n망치(망치 머리 재질은 고탄소강, 최소 무게 5 kg,)\n개\n01\n01\n01\n01\n7\n볼트 커터(절단 하중 최소 60 kg)\n개\n01\n01\n01\n01\n8\n여과식 방독면 또는 자급식 호흡기(격리식 방독면)\n세트\n03\n03\n03\n* 비고:\n- 각 장비·설비는 이 시행규칙의 규정에 따라 관리, 보관, 정비하여야 한다; 사용 기한은 제조자의 내용연수에 따르며, 내용연수가 만료되거나 손상된 때에는 교체한다.\n- 이 부록에 규정된 장비·설비가 기술 표준·기술 규정의 규정에 따라 사업장에 이미 비치되어 있거나 사업장의 동력식 화재진압 장비에 비치되어 있는 경우에는, 이미 있는 장비·설비를 사업장 자체 소방대, 전문 소방대에 비치할 의무가 없다.\n- 임무 수행 과정에서 민방위 소방대 대장, 사업장 자체 소방대 대장, 전문 소방대 대장은 대의 각 대원에게 사용하도록 장비·설비를 지급하는 것과 공동으로 사용할 장비·설비의 종류를 결정한다./.","o":[]},{"id":"tt36-PLII","d":"tt36","n":"PLII","t":"BẢO QUẢN, BẢO DƯỠNG PHƯƠNG TIỆN CHỮA CHÁY, CỨU NẠN, CỨU HỘ CƠ GIỚI (Kèm theo Thông tư số 36/2025/TT-BCA ngày 15 tháng 5 năm 2025 của Bộ trưởng Bộ Công an) _______________ I. Bảo quản phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới","k":"동력식 화재진압·구조구난 장비의 보관, 정비 (공안부 장관의 2025년 5월 15일자 시행규칙 제36/2025/TT-BCA호에 첨부) _______________ I. 동력식 화재진압·구조구난 장비의 보관","c":"부록","x":"1. Bảo quản thường xuyên\n1.1. Thực hiện theo hướng dẫn của nhà sản xuất.\n1.2. Kiểm đếm số lượng và sắp xếp phương tiện, thiết bị, dụng cụ được trang bị theo phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới.\n1.3. Làm sạch, lau khô bề mặt các bộ phận cấu thành của phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới và các phương tiện, thiết bị, dụng cụ được trang bị kèm theo.\n1.4. Bảo vệ phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới:\na) Đối với xe chữa cháy, xe chuyên dùng phục vụ chữa cháy, cứu nạn, cứu hộ phải sử dụng thiết bị chèn lốp để cố định vị trí phương tiện;\nb) Đối với tàu chữa cháy, xuồng chữa cháy, cứu nạn, cứu hộ, ca nô chữa cháy, cứu nạn, cứu hộ phải sử dụng dây neo và thiết bị, dụng cụ chống va đập để cố định khi neo đậu tại bến, âu thuyền, bến cảng;\nc) Đối với phương tiện, thiết bị, dụng cụ có các bộ phận dễ bị ăn mòn, biến dạng, oxy hoá khi tiếp xúc với nước, oxy trong không khí hoặc hoá chất độc hại phải sử dụng các chất chống oxy hoá hoặc thiết bị bao, phủ, che, chắn để bảo quản theo hướng dẫn của nhà sản xuất.\n1.5. Nhà, kho, bến, bãi, nơi bảo quản phương tiện phải có các biện pháp chống động vật, côn trùng xâm nhập; không được lưu trữ chất hóa học có tính độc hại, ăn mòn, dễ cháy, nổ trong cùng khu vực nhà, kho, nơi bảo quản phương tiện.\n2. Bảo quản trong và sau mỗi lần sử dụng\n2.1. Trong quá trình sử dụng:\na) Khi sử dụng phương tiện để thực tập phương án, làm nhiệm vụ chữa cháy, cứu, nạn, cứu hộ phải dừng, đỗ, đặt trên địa hình, địa vật bằng phẳng, khoá phanh tay, sử dụng thiết bị chèn lốp để cố định vị trí phương tiện, có biển cảnh báo, sử dụng thiết bị che, chắn bảo vệ phương tiện, thiết bị, đường vòi chữa cháy, đường ống dẫn dầu thuỷ lực;\nb) Vận hành phương tiện theo hướng dẫn của nhà sản xuất.\n2.2. Sau mỗi lần sử dụng:\na) Kiểm đếm số lượng và làm sạch, phơi hoặc lau khô phương tiện, thiết bị trước khi sắp xếp vào vị trí, nơi bảo quản;\nb) Kiểm tra, đóng kín các van, nắp bảo vệ trên hệ thống bơm, hệ thống điều khiển phương tiện, thiết bị bảo đảm an toàn theo thiết kế của nhà sản xuất. Mở van xả đáy guồng bơm để xả hết nước trong guồng bơm, sau đó đóng kín van xả đáy guồng bơm (đối với các loại xe được trang bị bơm chữa cháy) bảo đảm độ kín và bên trong guồng bơm luôn được khô ráo;\nc) Kiểm tra và bổ sung nhiên liệu bảo đảm tối thiểu 80% mức nhiên liệu trong bình chứa. Đối với phương tiện sử dụng pin, ắc quy, bảo đảm nạp tối thiểu 80% dung lượng pin, ắc quy. Kiểm tra và bổ sung đủ nước, chất tạo bọt chữa cháy (nếu có), dung dịch làm mát động cơ, các loại dầu, mỡ bôi trơn, dầu thủy lực (nếu thiếu) trước khi đưa phương tiện vào vị trí, nơi bảo quản;\nd) Đóng kín các cửa, khoang chứa phương tiện không để nước, bụi, hoá chất, côn trùng xâm nhập.\nII. Bảo dưỡng phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới\n1. Bảo dưỡng thường xuyên\n1.1. Khởi động phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới:\na) Đối với xe chữa cháy, xe chuyên dùng phục vụ chữa cháy, cứu nạn, cứu hộ, tàu chữa cháy, xuồng chữa cháy, cứu nạn, cứu hộ, ca nô chữa cháy, cứu nạn, cứu hộ thực hiện khởi động động cơ 01 lần tối thiểu trong 15 phút. Trường hợp nhiệt độ môi trường trong ngày thấp hơn 10°C, thực hiện khởi động động cơ 02 lần/ngày, mỗi lần khởi động tối thiểu trong 15 phút và cách nhau 08 tiếng. Đối với xe chữa cháy, xe chuyên dùng phục vụ chữa cháy, cứu nạn, cứu hộ có thể kết hợp di chuyển trong quá trình khởi động;\nb) Đối với máy bơm chữa cháy thực hiện khởi động động cơ tối đa 01 lần trong 03 phút (khi không phun, hút nước) hoặc 15 phút (khi có phun, hút nước). Trường hợp nhiệt độ môi trường trong ngày thấp hơn 10°C, thực hiện khởi động động cơ 02 lần/ngày, mỗi lần cách nhau 08 tiếng;\nc) Đối với máy nạp khí sạch, 03 ngày khởi động 01 lần tối thiểu trong 05 phút hoặc theo hướng dẫn của nhà sản xuất;\nd) Đối với phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới khác thực hiện khởi động động cơ 01 lần tối thiểu trong 05 phút hoặc theo hướng dẫn của nhà sản xuất.\n1.2. Kiểm tra tình trạng hoạt động, các hệ thống, bộ phận kỹ thuật của phương tiện:\na) Đối với xe chữa cháy, xe chuyên dùng phục vụ chữa cháy, cứu nạn, cứu hộ, thực hiện kiểm tra: hệ thống truyền lực đến bơm ly tâm, hệ thống ly hợp, hệ thống phanh, hệ thống trợ lực lái, bộ trích công suất (PTO), hệ thống bơm chữa cháy, hệ thống bơm chân không mồi nước, hệ thống trộn chất tạo bọt chữa cháy, lăng giá cố định chữa cháy (đối với xe chữa cháy), hệ thống nén khí (đối với xe chữa cháy sử dụng công nghệ bọt khí nén), hệ thống thủy lực nâng, hạ, quay cẩu, hệ thống tời, chân chống thuỷ lực, tháp đèn chiếu sáng (đối với xe cứu nạn, cứu hộ), cơ cấu ra thang, vào thang, giỏ thang, cơ cấu bảo đảm an toàn (đối với xe thang), cơ cấu nâng, hạ, xoay và hoạt động của hệ thống quạt hút khói (đối với xe hút khói), các loại đèn báo, đồng hồ của bảng táp lô, đèn, còi tín hiệu giao thông, thiết bị phát tín hiệu ưu tiên, công tắc, van điều khiển, tay gạt điều khiển hệ thống chuyên dùng, dây ga tay, máy phát điện, cơ cấu bảo đảm an toàn;\nb) Đối với tàu chữa cháy, xuồng chữa cháy, cứu nạn, cứu hộ, ca nô chữa cháy, cứu nạn, cứu hộ, thực hiện kiểm tra: động cơ, hệ thống lái, thiết bị dẫn đường, đèn, còi tín hiệu, hệ thống bơm nước chữa cháy, hệ thống trộn chất tạo bọt chữa cháy, lăng giá chữa cháy, hệ thống neo;\nc) Đối với máy bơm chữa cháy, thực hiện kiểm tra: động cơ, hệ thống cảnh báo quá nhiệt bảo vệ động cơ, hệ thống điều khiển (khi không phun, hút nước), hệ thống bơm chân không mồi nước, hệ thống đo áp suất, hệ thống làm mát động cơ, hệ thống phun, hút nước (khi phun, hút nước);\nd) Đối với phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới khác, thực hiện kiểm tra: động cơ và hệ thống điều khiển, hệ thống đèn, còi cảnh báo, hệ thống điều khiển từ xa, hệ thống truyền động và cơ cấu điều khiển lăng chữa cháy, hệ thống đèn chiếu sáng, hệ thống camera quan sát (đối với robot chữa cháy, cứu nạn, cứu hộ), hệ thống nén khí, hệ thống đo, cảnh báo áp suất làm việc của hệ thống nén khí (đối với máy nạp khí sạch), động cơ, hệ thống khởi động, công tắc điều khiển, máy bơm, vòi phun (đối với thiết bị chữa cháy đeo vai có động cơ), hệ thống điều khiển, vận hành, bộ phận banh, cắt thuỷ lực, cưa, khoan, đục, đập, tời, kéo, kích, nâng (đối với các loại máy banh, cắt, cưa, khoan, đục, đập tời, kéo, banh, kích, nâng), động cơ, hệ thống khởi động, hệ thống đèn cảnh báo, đồng hồ, công tắc điều khiển (đối với máy phát điện), động cơ, hệ thống khởi động, công tắc điều khiển, hệ thống cánh quạt (đối với quạt thổi khói, quạt hút khói, máy thổi gió).\n1.3. Việc kiểm tra tình trạng hoạt động, các hệ thống, bộ phận kỹ thuật của phương tiện được thực hiện trong quá trình khởi động động cơ phương tiện. Trường hợp phát hiện phương tiện bị hư hỏng, sự cố phải báo cáo người có thẩm quyền để tổ chức khắc phục, sửa chữa kịp thời.\n2. Bảo dưỡng sau mỗi lần sử dụng\n2.1. Thay thế, sửa chữa các linh kiện, bộ phận bị hư hỏng, mất.\n2.2. Kiểm tra, bổ sung dầu bôi trơn, dầu thủy lực, nước làm mát, nhiên liệu (nếu thiếu).\n2.3. Mở hết các van hút, phun nước, van xả đáy guồng bơm để xả hết nước đọng trong bơm chữa cháy.\n2.4. Bổ sung đủ chất chữa cháy vào téc chứa của xe chữa cháy.\n2.5. Kiểm đếm số lượng và làm sạch phương tiện, thiết bị, dụng cụ trước khi sắp xếp vào vị trí, nơi bảo quản: làm sạch bên ngoài xe, dưới gầm xe; vệ sinh máy bơm, động cơ, ca bin, đèn chiếu sáng; giặt sạch, phơi khô vòi chữa cháy và các phương tiện chữa cháy, cứu nạn, cứu hộ khác.\nTrường hợp phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới có sử dụng nước mặn, nước bẩn hoặc chất tạo bọt chữa cháy thì phải vệ sinh, rửa sạch phương tiện, hệ thống bơm chữa cháy bằng nước sạch.\nTrường hợp phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới sử dụng trong vùng có dịch bệnh hoặc chất độc, phóng xạ phải được khử trùng, tiêu độc.\n2.6. Đối với các loại phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới khác, cần làm sạch các chi tiết máy, kiểm tra các ống dẫn dầu thủy lực, khí nén, bổ sung nhiên liệu, dầu bôi trơn (nếu thiếu)./.","y":"1. 상시 보관\n1.1. 제조자의 지침에 따라 시행한다.\n1.2. 동력식 화재진압·구조구난 장비에 딸려 비치된 장비, 기기, 도구의 수량을 점검하여 세고 정리한다.\n1.3. 동력식 화재진압·구조구난 장비의 구성 부분과 함께 비치된 장비, 기기, 도구의 표면을 깨끗이 하고 닦아 말린다.\n1.4. 동력식 화재진압·구조구난 장비의 보호:\na) 소방차, 화재진압·구조구난용 특수차에 대하여는 장비의 위치를 고정하기 위하여 타이어 고임 장치(고임목)를 사용하여야 한다;\nb) 소방선, 화재진압·구조구난용 소형 보트, 화재진압·구조구난용 카누(모터보트)에 대하여는 선착장, 선거(船渠), 항만 부두에 정박할 때 고정하기 위하여 계류줄과 충돌 방지 장치·도구를 사용하여야 한다;\nc) 물, 공기 중의 산소 또는 유해 화학물질과 접촉할 때 부식, 변형, 산화되기 쉬운 부분이 있는 장비, 기기, 도구에 대하여는 제조자의 지침에 따라 보관하기 위하여 산화 방지제 또는 싸고, 덮고, 가리고, 막는 장치를 사용하여야 한다.\n1.5. 장비를 보관하는 건물, 창고, 선착장, 야적장(주차장), 장소에는 동물, 곤충의 침입을 방지하는 조치가 있어야 한다; 장비를 보관하는 건물, 창고, 장소와 같은 구역 안에 유독성, 부식성, 인화성, 폭발성이 있는 화학물질을 보관하여서는 아니 된다.\n2. 매 사용 중 및 사용 후의 보관\n2.1. 사용 과정에서:\na) 계획 훈련(실습), 화재진압, 구조·구난 임무 수행을 위하여 장비를 사용할 때에는 평탄한 지형·지물 위에 정차, 주차, 설치하고, 주차 브레이크(핸드 브레이크)를 잠그며, 장비의 위치를 고정하기 위하여 타이어 고임 장치(고임목)를 사용하고, 경고 표지판을 두며, 장비, 기기, 소방호스 라인, 유압유 배관을 보호하는 가림·차단 장치를 사용하여야 한다;\nb) 제조자의 지침에 따라 장비를 운용한다.\n2.2. 매 사용 후:\na) 위치, 보관 장소에 정리하기 전에 장비, 기기의 수량을 점검하여 세고 깨끗이 하며 말리거나 닦아 말린다;\nb) 펌프 시스템, 장비 제어 시스템, 기기의 밸브, 보호 덮개를 점검하고 꼭 닫아 제조자의 설계에 따라 안전을 확보한다. 펌프 케이싱 하부 배수 밸브를 열어 펌프 케이싱 안의 물을 모두 빼낸 다음 펌프 케이싱 하부 배수 밸브를 꼭 닫아(소방펌프가 장착된 차종의 경우) 기밀성을 확보하고 펌프 케이싱 내부가 항상 건조하도록 한다;\nc) 연료를 점검하고 보충하여 탱크 내 연료량이 최소 80%가 되도록 한다. 배터리(전지), 축전지를 사용하는 장비에 대하여는 배터리(전지), 축전지 용량의 최소 80%가 충전되도록 한다. 장비를 위치, 보관 장소에 넣기 전에 물, 포 소화약제(있는 경우), 엔진 냉각액, 각종 윤활유·그리스, 유압유(부족한 경우)를 점검하고 충분히 보충한다;\nd) 물, 먼지, 화학물질, 곤충이 침입하지 아니하도록 문, 장비 적재 칸을 꼭 닫는다.\nII. 동력식 화재진압·구조구난 장비의 정비\n1. 상시 정비\n1.1. 동력식 화재진압·구조구난 장비의 시동:\na) 소방차, 화재진압·구조구난용 특수차, 소방선, 화재진압·구조구난용 소형 보트, 화재진압·구조구난용 카누(모터보트)에 대하여는 엔진 시동을 01회, 최소 15분간 실시한다. 당일 주변 온도가 10°C보다 낮은 경우에는 엔진 시동을 하루 02회 실시하며, 매 시동은 최소 15분간, 08시간 간격으로 한다. 소방차, 화재진압·구조구난용 특수차에 대하여는 시동 과정에서 이동을 병행할 수 있다;\nb) 소방펌프에 대하여는 엔진 시동을 01회, 최대 03분간(물을 방수, 흡수하지 아니하는 때) 또는 15분간(물을 방수, 흡수하는 때) 실시한다. 당일 주변 온도가 10°C보다 낮은 경우에는 엔진 시동을 하루 02회, 매회 08시간 간격으로 실시한다;\nc) 청정 공기 충전기에 대하여는 03일에 01회, 최소 05분간 또는 제조자의 지침에 따라 시동한다;\nd) 그 밖의 동력식 화재진압·구조구난 장비에 대하여는 엔진 시동을 01회, 최소 05분간 또는 제조자의 지침에 따라 실시한다.\n1.2. 장비의 작동 상태, 각 시스템, 기술 부분의 점검:\na) 소방차, 화재진압·구조구난용 특수차에 대하여는 다음을 점검한다: 원심 펌프로의 동력 전달 시스템, 클러치 시스템, 제동 시스템, 조향 보조(파워 스티어링) 시스템, 동력인출장치(PTO), 소방펌프 시스템, 진공 프라이밍(마중물) 펌프 시스템, 포 소화약제 혼합 시스템, 고정식 방수총(모니터 노즐)(소방차의 경우), 공기 압축 시스템(압축공기포 기술을 사용하는 소방차의 경우), 크레인의 상승, 하강, 선회 유압 시스템, 윈치 시스템, 유압 아우트리거(지지대), 조명탑(구조·구난차의 경우), 사다리 전개, 수납 기구, 사다리 바스켓, 안전 확보 기구(사다리차의 경우), 배연 송풍기 시스템의 상승, 하강, 회전 기구 및 작동(배연차의 경우), 계기판의 각종 표시등, 계기, 교통 신호용 등화, 경음기, 우선 신호 발신 장치, 스위치, 제어 밸브, 전용 시스템의 제어 레버, 수동 스로틀 케이블, 발전기, 안전 확보 기구;\nb) 소방선, 화재진압·구조구난용 소형 보트, 화재진압·구조구난용 카누(모터보트)에 대하여는 다음을 점검한다: 엔진, 조타 시스템, 항법 장치, 신호용 등화, 경음기, 소화용수 펌프 시스템, 포 소화약제 혼합 시스템, 방수총(모니터 노즐), 닻(계류) 시스템;\nc) 소방펌프에 대하여는 다음을 점검한다: 엔진, 엔진 보호용 과열 경보 시스템, 제어 시스템(물을 방수, 흡수하지 아니하는 때), 진공 프라이밍(마중물) 펌프 시스템, 압력 측정 시스템, 엔진 냉각 시스템, 물의 방수, 흡수 시스템(물을 방수, 흡수하는 때);\nd) 그 밖의 동력식 화재진압·구조구난 장비에 대하여는 다음을 점검한다: 엔진 및 제어 시스템, 경고용 등화, 경음기 시스템, 원격 제어 시스템, 구동 시스템 및 소방 관창(노즐) 제어 기구, 조명등 시스템, 감시 카메라 시스템(화재진압·구조구난 로봇의 경우), 공기 압축 시스템, 공기 압축 시스템의 작동 압력 측정·경보 시스템(청정 공기 충전기의 경우), 엔진, 시동 시스템, 제어 스위치, 펌프, 분사 호스(엔진이 달린 배낭식 소화 장치의 경우), 제어, 운용 시스템, 유압식 전개·절단, 톱질, 천공, 끌질, 파쇄, 윈치, 견인, 잭, 인양 부분(각종 전개, 절단, 톱질, 천공, 끌질, 파쇄, 윈치, 견인, 전개, 잭, 인양 기계의 경우), 엔진, 시동 시스템, 경고등 시스템, 계기, 제어 스위치(발전기의 경우), 엔진, 시동 시스템, 제어 스위치, 팬 날개 시스템(연기 송풍기, 배연 송풍기, 송풍기의 경우).\n1.3. 장비의 작동 상태, 각 시스템, 기술 부분의 점검은 장비의 엔진 시동 과정에서 실시한다. 장비의 손상, 고장을 발견한 경우에는 적시에 조치, 수리를 실시하도록 권한 있는 자에게 보고하여야 한다.\n2. 매 사용 후의 정비\n2.1. 손상되거나 분실된 부품, 부분을 교체, 수리한다.\n2.2. 윤활유, 유압유, 냉각수, 연료를 점검, 보충한다(부족한 경우).\n2.3. 흡수, 방수 밸브, 펌프 케이싱 하부 배수 밸브를 모두 열어 소방펌프 안에 고인 물을 모두 빼낸다.\n2.4. 소방차의 저장 탱크에 소화 약제를 충분히 보충한다.\n2.5. 위치, 보관 장소에 정리하기 전에 장비, 기기, 도구의 수량을 점검하여 세고 깨끗이 한다: 차량 외부, 차량 하부를 깨끗이 한다; 펌프, 엔진, 운전실(캐빈), 조명등을 청소한다; 소방호스 및 그 밖의 화재진압·구조구난 장비를 깨끗이 세탁하고 말린다.\n동력식 화재진압·구조구난 장비가 염수, 오수 또는 포 소화약제를 사용한 경우에는 깨끗한 물로 장비, 소방펌프 시스템을 청소하고 깨끗이 씻어야 한다.\n동력식 화재진압·구조구난 장비를 전염병 또는 독성 물질, 방사능이 있는 지역에서 사용한 경우에는 소독, 제독하여야 한다.\n2.6. 그 밖의 각종 동력식 화재진압·구조구난 장비에 대하여는 기계 부품을 깨끗이 하고, 유압유, 압축 공기 배관을 점검하며, 연료, 윤활유를 보충하여야 한다(부족한 경우)./.","o":[]},{"id":"tt36-PLIII","d":"tt36","n":"PLIII","t":"BẢO QUẢN, BẢO DƯỠNG PHƯƠNG TIỆN CHỮA CHÁY THÔNG DỤNG, PHƯƠNG TIỆN CỨU NGƯỜI, PHƯƠNG TIỆN, THIẾT BỊ PHỤC VỤ CỨU NẠN, CỨU HỘ, CHẤT CHỮA CHÁY, PHƯƠNG TIỆN, THIẾT BỊ THÔNG TIN LIÊN LẠC PHỤC VỤ CHỮA CHÁY, CỨU NẠN, CỨU HỘ (Kèm theo Thông tư số 36/2025/TT-BCA ngày 15 tháng 5 năm 2025 của Bộ trưởng Bộ Công an) ________________ I. Bảo quản phương tiện chữa cháy thông dụng, phương tiện cứu người, phương tiện, thiết bị phục vụ cứu nạn, cứu hộ, chất chữa cháy, phương tiện, thiết bị thông tin liên lạc","k":"범용 화재진압 장비, 인명구조 장비, 구조·구난용 장비·기기, 소화약제, 화재진압 및 구조·구난용 통신 장비·기기의 보관·정비 (공안부 장관의 2025년 5월 15일자 시행규칙 제36/2025/TT-BCA호에 첨부) ________________ I. 범용 화재진압 장비, 인명구조 장비, 구조·구난용 장비·기기, 소화약제, 통신 장비·기기의 보관","c":"부록","x":"1. Bảo quản thường xuyên\n1.1. Kiểm đếm số lượng phương tiện, thiết bị.\n1.2. Sắp xếp phương tiện, thiết bị được trang bị theo xe chữa cháy, xe chuyên dùng phục vụ chữa cháy, tàu chữa cháy, xuồng chữa cháy, cứu nạn, cứu hộ, ca nô chữa cháy, cứu nạn, cứu hộ tại các khoang, ngăn chứa theo thiết kế của nhà sản xuất.\n1.3. Đối với phương tiện, thiết bị chưa sử dụng được bảo quản trong nhà, kho và phải được phân loại, sắp xếp theo từng chủng loại, cụ thể:\na) Vòi, ống hút chữa cháy, lăng chữa cháy, đầu nối, ba chạc, hai chạc chữa cháy, ezectơ, đai cứu nạn, cứu hộ, dây cứu nạn, cứu hộ, đệm cứu người, phương tiện, thiết bị phục vụ cứu nạn, cứu hộ trên cao, phương tiện, thiết bị phục vụ cứu nạn, cứu hộ trong không gian hạn chế, phương tiện, thiết bị phục vụ cứu nạn, cứu hộ dưới nước để trên kệ, bảo quản trong nhà, kho; ống tụt cứu người để tại vị trí được quy định trên xe thang;\nb) Chất chữa cháy (hoá chất chữa cháy gốc nước, bột chữa cháy, khí chữa cháy, chất tạo bọt chữa cháy) được lưu trữ trong các can, thùng, bình chứa;\nc) Phương tiện, thiết bị thông tin liên lạc để ở vị trí khô ráo, thoáng mát;\nd) Phương tiện, thiết bị dò tìm người, máy phân tích nồng độ hoá chất (đối với phương tiện, thiết bị phục vụ cứu nạn, cứu hộ sự cố hoá chất), máy đo cường độ phóng xạ (đối với phương tiện, thiết bị phục vụ cứu nạn, cứu hộ sự cố phóng xạ) phải bảo quản trong tủ bảo ôn; bộ quần, áo chống hoá chất (đối với phương tiện, thiết bị phục vụ cứu nạn, cứu hộ sự cố hoá chất), bộ quần, áo chống phóng xạ (đối với phương tiện, thiết bị phục vụ cứu nạn, cứu hộ sự cố phóng xạ) phải được treo trên giá.\n1.4. Làm sạch bề mặt của phương tiện chữa cháy thông dụng, phương tiện cứu người, phương tiện, thiết bị phục vụ cứu nạn, cứu hộ phương tiện, thiết bị thông tin liên lạc, can, thùng, bình chứa chất chữa cháy.\n1.5. Nhà, kho, nơi bảo quản phương tiện, thiết bị phải có các biện pháp chống động vật, côn trùng xâm nhập; không được lưu trữ chất hoá học có tính độc hại, ăn mòn, dễ cháy, nổ trong cùng khu vực nhà, kho, nơi bảo quản phương tiện, thiết bị.\n2. Bảo quản trong và sau mỗi lần sử dụng\n2.1. Khi sử dụng phương tiện, thiết bị để thực tập phương án, làm nhiệm vụ chữa cháy, cứu nạn, cứu hộ phải vận hành phương tiện, thiết bị theo hướng dẫn của nhà sản xuất.\n2.2. Sau mỗi lần sử dụng:\na) Kiểm đếm số lượng và làm sạch, phơi hoặc lau khô phương tiện, thiết bị trước khi sắp xếp vào vị trí, nơi bảo quản;\nb) Tháo rời các bộ phận của phương tiện, thiết bị phục vụ cứu nạn, cứu hộ trên cao, phương tiện, thiết bị phục vụ cứu nạn, cứu hộ dưới nước, phương tiện, thiết bị phục vụ cứu nạn, cứu hộ trong không gian hạn chế, đệm cứu người và cất giữ trong bao bì chuyên dụng; xếp gọn ống tụt cứu người và để tại vị trí quy định trên xe thang; thiết bị dò tìm người, máy phân tích nồng độ hoá chất, máy đo cường độ phóng xạ (đối với phương tiện, thiết bị phục vụ cứu nạn, cứu hộ sự cố hoá chất, phóng xạ) được cất giữ trong thùng chứa chuyên dụng hoặc tủ bảo ôn;\nc) Kiểm tra và bổ sung nhiên liệu bảo đảm tối thiểu 80% mức nhiên liệu trong bình chứa (đối đối với máy phát điện của đệm cứu người). Các phương tiện sử dụng pin, ắc quy sau khi sử dụng bảo đảm nạp tối thiểu 80% dung lượng pin, ắc quy.\nII. Bảo dưỡng phương tiện chữa cháy thông dụng, phương tiện cứu người, phương tiện, thiết bị phục vụ cứu nạn, cứu hộ, phương tiện, thiết bị thông tin liên lạc\n1. Bảo dưỡng thường xuyên\n1.1. Thực hiện khởi động động cơ phương tiện:\na) Đối với máy phát điện của đệm cứu người, hằng ngày thực hiện khởi động động cơ 01 lần trong 15 phút; trường hợp nhiệt độ môi trường trong ngày thấp hơn 10°C, thực hiện khởi động động cơ 02 lần/ngày, mỗi lần khởi động trong 15 phút và cách nhau 08 tiếng;\nb) Đối với thiết bị dò tìm người, máy phân tích nồng độ hoá chất, máy đo cường độ phóng xạ, hằng ngày khởi động toàn bộ máy, thiết bị 01 lần trong 15 phút hoặc theo hướng dẫn của nhà sản xuất.\n1.2. Kiểm tra tình trạng hoạt động, các hệ thống, bộ phận kỹ thuật của phương tiện: mỏ vịt, đầu phun, đồng hồ báo áp suất khí nén (đối với các loại bình chữa cháy), đầu nối, gioăng làm kín, van khoá (đối với lăng, ba chạc, hai chạc chữa cháy), bộ điều chỉnh tỉ lệ trộn bọt, khớp nối và gioăng làm kín (đối với ezectơ hút bọt), cơ cấu thu/phóng thang, cơ cấu chốt hãm (đối với thang chữa cháy, thang cứu người), camera, cảm biến dò tìm nạn nhân, micro, tai nghe, màn hình điều khiển thiết bị (đối với thiết bị dò tìm người), la bàn, thiết bị đo độ sâu, van nhu cầu thở, áo phao (đối với phương tiện, thiết bị phục vụ cứu nạn, cứu hộ dưới nước), khoá kéo, nhám dính, khoá bấm, van một chiều (đối với bộ quần, áo thuộc phương tiện, thiết bị phục vụ cứu nạn, cứu hộ sự cố hoá chất), khoá kéo, nhám dính (đối với bộ quần, áo thuộc phương tiện, thiết bị phục vụ cứu nạn, cứu hộ sự cố phóng xạ), động cơ, hệ thống khởi động, hệ thống đèn cảnh báo, đồng hồ, công tắc điều khiển (đối với máy phát điện), quạt thổi khí, van giảm áp (đối với đệm cứu người), màn hình hiển thị, kim báo chỉ số, các nút điều khiển (đối với máy phân tích nồng độ hoá chất, máy đo cường độ phóng xạ), khoá an toàn, các đường chỉ may (đối với đai cứu nạn, cứu hộ), màn hình hiển thị, loa và micro đàm thoại, các nút điều khiển (đối với bộ đàm).\nTrường hợp phát hiện phương tiện, thiết bị bị hư hỏng, sự cố phải báo cáo người có thẩm quyền để tổ chức khắc phục, sửa chữa kịp thời.\n2. Bảo dưỡng sau mỗi lần sử dụng\n2.1. Thực hiện các công việc kiểm tra tình trạng hoạt động, các hệ thống, bộ phận kỹ thuật của phương tiện, thiết bị; thay thế, sửa chữa các linh kiện bị hư hỏng, mất; tắt nguồn bộ đàm, tháo ăng ten và pin.\n2.2. Kiểm đếm số lượng và làm sạch, phơi hoặc lau khô phương tiện, thiết bị trước khi sắp xếp vào vị trí, nơi bảo quản.\n2.3. Kiểm tra và bảo đảm nạp tối thiểu 80% dung lượng pin, ắc quy; bổ sung nhiên liệu bảo đảm tối thiểu 80% mức nhiên liệu trong bình chứa đối với máy phát điện; nạp bổ sung bảo đảm áp suất khí trong bình khí nén đạt tối thiểu 80% áp suất làm việc tối đa.\nTrường hợp phương tiện chữa cháy thông dụng, phương tiện, thiết bị thông tin liên lạc sử dụng trong vùng có dịch bệnh hoặc chất độc, phóng xạ phải được khử trùng, tiêu độc./.","y":"1. 상시 보관\n1.1. 장비·기기의 수량을 점검하여 센다.\n1.2. 소방차, 화재진압용 특수차, 소방선, 화재진압 및 구조·구난용 소형 보트, 화재진압 및 구조·구난용 카누(모터보트)에 따라 비치된 장비·기기를 제조자의 설계에 따른 각 격실·수납칸에 정리한다.\n1.3. 아직 사용하지 않은 장비·기기는 건물·창고 안에 보관하고 종류별로 분류·정리하여야 하며, 구체적으로 다음과 같다:\na) 소방호스, 소방용 흡수관, 소방용 관창, 연결구, 소방용 3방향 분기관, 2방향 분기관, 이젝터, 구조·구난용 벨트, 구조·구난용 로프, 인명구조 매트, 고소 구조·구난용 장비·기기, 제한 공간 내 구조·구난용 장비·기기, 수중 구조·구난용 장비·기기는 선반 위에 두고 건물·창고 안에 보관한다; 인명구조용 강하 튜브는 사다리차의 지정된 위치에 둔다;\nb) 소화약제(수계 소화용 화학약제, 소화 분말, 소화 가스, 포 소화약제)는 통, 용기, 저장 용기에 저장한다;\nc) 통신 장비·기기는 건조하고 통풍이 잘되며 서늘한 위치에 둔다;\nd) 인명 탐지 장비·기기, 화학물질 농도 분석기(화학물질 사고 구조·구난용 장비·기기의 경우), 방사선 강도 측정기(방사선 사고 구조·구난용 장비·기기의 경우)는 보온 보관함에 보관하여야 한다; 화학 방호복(화학물질 사고 구조·구난용 장비·기기의 경우), 방사선 방호복(방사선 사고 구조·구난용 장비·기기의 경우)은 걸이대에 걸어 두어야 한다.\n1.4. 범용 화재진압 장비, 인명구조 장비, 구조·구난용 장비·기기, 통신 장비·기기, 소화약제를 담는 통, 용기, 저장 용기의 표면을 청소한다.\n1.5. 장비·기기를 보관하는 건물, 창고, 장소에는 동물, 곤충의 침입을 방지하는 조치가 있어야 한다; 장비·기기를 보관하는 건물, 창고, 장소와 같은 구역 안에 독성, 부식성, 인화성, 폭발성이 있는 화학물질을 저장해서는 안 된다.\n2. 사용 중 및 매회 사용 후의 보관\n2.1. 계획 훈련(실습), 화재진압 및 구조·구난 임무 수행을 위하여 장비·기기를 사용할 때에는 제조자의 안내에 따라 장비·기기를 운용하여야 한다.\n2.2. 매회 사용 후:\na) 장비·기기를 보관 위치·장소에 정리하기 전에 수량을 점검하여 세고 청소하며, 말리거나 닦아서 건조시킨다;\nb) 고소 구조·구난용 장비·기기, 수중 구조·구난용 장비·기기, 제한 공간 내 구조·구난용 장비·기기, 인명구조 매트의 각 부분을 분리하여 전용 포장재에 넣어 보관한다; 인명구조용 강하 튜브를 가지런히 접어 사다리차의 지정된 위치에 둔다; 인명 탐지 기기, 화학물질 농도 분석기, 방사선 강도 측정기(화학물질·방사선 사고 구조·구난용 장비·기기의 경우)는 전용 보관 상자 또는 보온 보관함에 넣어 보관한다;\nc) 연료를 점검하고 보충하여 저장 탱크 내 연료 수준이 최소 80%가 되도록 보장한다(인명구조 매트의 발전기의 경우). 전지, 축전지를 사용하는 장비는 사용 후 전지, 축전지 용량의 최소 80%가 충전되도록 보장한다.\nII. 범용 화재진압 장비, 인명구조 장비, 구조·구난용 장비·기기, 통신 장비·기기의 정비\n1. 상시 정비\n1.1. 장비의 엔진 시동을 실시한다:\na) 인명구조 매트의 발전기는 매일 엔진 시동을 01회, 15분간 실시한다; 당일 주변 온도가 10°C보다 낮은 경우에는 엔진 시동을 하루 02회 실시하며, 매회 15분간 시동하고 08시간 간격을 둔다;\nb) 인명 탐지 기기, 화학물질 농도 분석기, 방사선 강도 측정기는 매일 기계·기기 전체를 01회, 15분간 또는 제조자의 안내에 따라 가동한다.\n1.2. 장비의 작동 상태, 각 계통, 기술 부품을 점검한다: 누름 레버, 분사 노즐, 압축가스 압력계(각종 소화기의 경우), 연결구, 밀봉 개스킷, 개폐 밸브(관창, 소방용 3방향 분기관, 2방향 분기관의 경우), 포 혼합 비율 조절기, 연결 이음쇠 및 밀봉 개스킷(포 흡입 이젝터의 경우), 사다리 수축/전개 기구, 고정 잠금 기구(소방 사다리, 인명구조 사다리의 경우), 카메라, 피해자 탐지 센서, 마이크, 이어폰, 기기 제어 화면(인명 탐지 기기의 경우), 나침반, 수심 측정 기기, 호흡 공급 밸브, 구명조끼(수중 구조·구난용 장비·기기의 경우), 지퍼, 벨크로, 스냅 잠금쇠, 체크 밸브(화학물질 사고 구조·구난용 장비·기기에 속하는 방호복의 경우), 지퍼, 벨크로(방사선 사고 구조·구난용 장비·기기에 속하는 방호복의 경우), 엔진, 시동 계통, 경고등 계통, 계기, 제어 스위치(발전기의 경우), 송풍기, 감압 밸브(인명구조 매트의 경우), 표시 화면, 수치 지시 바늘, 각 제어 버튼(화학물질 농도 분석기, 방사선 강도 측정기의 경우), 안전 잠금장치, 각 봉제선(구조·구난용 벨트의 경우), 표시 화면, 통화용 스피커 및 마이크, 각 제어 버튼(무전기의 경우).\n장비·기기가 고장·이상이 있는 것을 발견한 경우에는 권한 있는 사람에게 보고하여 적시에 조치·수리하도록 하여야 한다.\n2. 매회 사용 후의 정비\n2.1. 장비·기기의 작동 상태, 각 계통, 기술 부품을 점검하는 작업을 실시한다; 고장 나거나 분실된 부품을 교체·수리한다; 무전기의 전원을 끄고 안테나와 전지를 분리한다.\n2.2. 장비·기기를 보관 위치·장소에 정리하기 전에 수량을 점검하여 세고 청소하며, 말리거나 닦아서 건조시킨다.\n2.3. 전지, 축전지 용량의 최소 80%가 충전되도록 점검하고 보장한다; 발전기는 저장 탱크 내 연료 수준이 최소 80%가 되도록 연료를 보충한다; 압축가스 용기 내 가스 압력이 최대 사용 압력의 최소 80%에 도달하도록 추가 충전한다.\n범용 화재진압 장비, 통신 장비·기기를 전염병 또는 독성물질, 방사선이 있는 지역에서 사용한 경우에는 소독, 제독하여야 한다./.","o":[]},{"id":"tt36-PLIV","d":"tt36","n":"PLIV","t":"BẢO QUẢN, BẢO DƯỠNG TRANG PHỤC VÀ THIẾT BỊ BẢO HỘ CÁ NHÂN PHỤC VỤ CÔNG TÁC CHỮA CHÁY, CỨU NẠN, CỨU HỘ (Kèm theo Thông tư số 36/2025/TT-BCA ngày 15 tháng 5 năm 2025 của Bộ trưởng Bộ Công an) _________________ I. Bảo quản trang phục và thiết bị bảo hộ cá nhân","k":"화재진압 및 구조·구난 업무용 복장 및 개인 보호 장비의 보관·정비 (공안부 장관의 2025년 5월 15일자 시행규칙 제36/2025/TT-BCA호에 첨부) _________________ I. 복장 및 개인 보호 장비의 보관","c":"부록","x":"1. Bảo quản thường xuyên\n1.1. Thực hiện theo hướng dẫn của nhà sản suất.\n1.2. Kiểm đếm số lượng, phân loại và sắp xếp theo từng chủng loại trên kệ bảo quản trong nhà, kho; không để trang phục và thiết bị bảo hộ cá nhân trực tiếp xuống mặt sàn hoặc tiếp xúc trực tiếp với tường, trần nhà, kho; không được xếp thành đống hoặc để các vật nặng, sắc, nhọn lên bề mặt trang phục và thiết bị bảo hộ cá nhân; trang phục và thiết bị bảo hộ cá nhân trang bị theo phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới phải được sắp xếp trong các ngăn, khoang theo đúng thiết kế của nhà sản xuất và hướng dẫn của đơn vị trực tiếp quản lý; quần, áo cách nhiệt, quần, áo chữa cháy phải được treo trên giá hoặc bảo quản trong tủ dưới dạng treo; sử dụng thiết bị bao, phủ, che, chắn để bảo bảo quản trang phục và thiết bị bảo hộ cá nhân theo hướng dẫn của nhà sản xuất.\n1.3. Làm sạch, phơi khô hoặc lau khô.\n1.4. Nhà, kho, nơi bảo quản trang phục và thiết bị bảo hộ cá nhân phải có các biện pháp chống động vật, côn trùng xâm nhập; không được lưu trữ chất hoá học có tính độc hại, ăn mòn, dễ cháy, nổ trong cùng khu vực nhà, kho, nơi bảo quản trang phục và thiết bị bảo hộ cá nhân.\n2. Bảo quản trong và sau mỗi lần sử dụng\n2.1. Trong quá trình sử dụng, thực hiện việc bảo quản theo hướng dẫn của nhà sản suất.\n2.2. Sau mỗi lần sử dụng:\na) Kiểm đếm số lượng và làm sạch, phơi hoặc lau khô trang phục và thiết bị bảo hộ cá nhân trước khi sắp xếp vào vị trí, nơi bảo quản;\nb) Đối với mặt nạ lọc độc: thay mới quả lọc (phin lọc) sau khi đã tiếp xúc với môi trường không khí bên ngoài;\nc) Đối với mặt nạ phòng độc cách ly: tháo rời bình khí nén, van nhu cầu thở, mặt trùm, các khớp nối trước khi đưa vào vị trí bảo quản.\n2.3. Kiểm tra và bổ sung áp suất khí trong bình khí nén phải đạt tối thiểu 80% áp suất làm việc tối đa; kiểm tra, thay mới pin (đối với loại pin dùng 01 lần) hoặc nạp đầy dung lượng pin cho đèn, thiết bị chiếu sáng sử dụng pin có khả năng sạc nhiều lần.\nII. Bảo dưỡng trang phục và thiết bị bảo hộ cá nhân\n1. Bảo dưỡng thường xuyên\n1.1. Đối với quần, áo cách nhiệt, quần, áo chữa cháy: kiểm tra khoá kéo, nhám dính, khoá bấm, dây đai quần chữ Y.\n1.2. Đối với mặt nạ lọc độc: mặt trùm bảo đảm kín khít, các dây đai dễ dàng điều chỉnh theo thể trạng người sử dụng.\n1.3. Đối với mặt nạ phòng độc cách ly: bình khí nén phải đạt áp suất tối thiểu 80% áp suất khí làm việc tối đa; mặt trùm bảo đảm kín khít, không bị hở trong quá trình sử dụng; dây dẫn khí không bị nứt, thủng; khớp kết nối phải dễ tháo lắp, không bị rò rỉ khí nén; van nhu cầu thở, đồng hồ báo áp suất và còi cảnh báo hoạt động bình thường; các dây đai, móc khoá phải liên kết chắc chắn và dễ dàng điều chỉnh theo thể trạng người sử dụng.\n1.4. Đối với đèn, thiết bị chiếu sáng: bóng đèn, nút bấm, các gioăng cao su chống nước (nếu có) hoạt động bình thường.\n1.5. Trường hợp phát hiện trang phục và thiết bị bảo hộ cá nhân bị hư hỏng, mặt nạ phòng độc cách ly rò rỉ khí nén phải báo cáo người có thẩm quyền để tổ chức khắc phục, sửa chữa kịp thời.\n2. Bảo dưỡng sau mỗi lần sử dụng\n2.1. Thực hiện các công việc như bảo dưỡng thường xuyên.\n2.2. Kiểm đếm số lượng và làm sạch, phơi hoặc lau khô trang phục và thiết bị bảo hộ cá nhân trước khi sắp xếp vào vị trí, nơi bảo quản.\n2.3. Trường hợp trang phục và thiết bị bảo hộ cá nhân sử dụng trong vùng có dịch bệnh hoặc chất độc, phóng xạ phải được khử trùng, tiêu độc./.","y":"1. 상시 보관\n1.1. 제조자의 안내에 따라 실시한다.\n1.2. 수량을 점검하여 세고, 분류하여 건물·창고 안의 보관 선반 위에 종류별로 정리한다; 복장 및 개인 보호 장비를 바닥에 직접 놓거나 건물·창고의 벽, 천장에 직접 닿게 두지 않는다; 복장 및 개인 보호 장비의 표면 위에 더미로 쌓거나 무겁고 날카롭고 뾰족한 물건을 올려 두어서는 안 된다; 기계식 화재진압 및 구조·구난 장비에 따라 비치된 복장 및 개인 보호 장비는 제조자의 설계와 직접 관리 단위의 안내에 맞게 각 칸, 격실에 정리하여야 한다; 방열복, 방화복은 걸이대에 걸거나 걸어 두는 형태로 보관함 안에 보관하여야 한다; 제조자의 안내에 따라 복장 및 개인 보호 장비를 보관하기 위한 포장, 덮개, 가림, 차단 기구를 사용한다.\n1.3. 청소하고, 말리거나 닦아서 건조시킨다.\n1.4. 복장 및 개인 보호 장비를 보관하는 건물, 창고, 장소에는 동물, 곤충의 침입을 방지하는 조치가 있어야 한다; 복장 및 개인 보호 장비를 보관하는 건물, 창고, 장소와 같은 구역 안에 독성, 부식성, 인화성, 폭발성이 있는 화학물질을 저장해서는 안 된다.\n2. 사용 중 및 매회 사용 후의 보관\n2.1. 사용 과정에서는 제조자의 안내에 따라 보관을 실시한다.\n2.2. 매회 사용 후:\na) 복장 및 개인 보호 장비를 보관 위치·장소에 정리하기 전에 수량을 점검하여 세고 청소하며, 말리거나 닦아서 건조시킨다;\nb) 여과식 방독면의 경우: 외부 공기 환경에 접촉한 후에는 정화통(필터)을 새것으로 교체한다;\nc) 격리식 방독면의 경우: 보관 위치에 넣기 전에 압축공기 용기, 호흡 공급 밸브, 면체, 각 연결 이음쇠를 분리한다.\n2.3. 압축공기 용기 내 가스 압력을 점검하고 보충하여 최대 사용 압력의 최소 80%에 도달하여야 한다; 전지를 점검하고 새것으로 교체하거나(01회용 전지의 경우), 여러 번 충전할 수 있는 전지를 사용하는 등(燈)·조명 기기는 전지 용량을 가득 충전한다.\nII. 복장 및 개인 보호 장비의 정비\n1. 상시 정비\n1.1. 방열복, 방화복의 경우: 지퍼, 벨크로, 스냅 잠금쇠, Y자형 바지 멜빵 끈을 점검한다.\n1.2. 여과식 방독면의 경우: 면체가 빈틈없이 밀착되도록 보장하고, 각 끈은 사용자의 체격에 따라 쉽게 조절되어야 한다.\n1.3. 격리식 방독면의 경우: 압축공기 용기는 최대 사용 가스 압력의 최소 80%의 압력에 도달하여야 한다; 면체는 빈틈없이 밀착되도록 보장하고 사용 과정에서 틈이 생기지 않아야 한다; 공기 도관은 균열, 구멍이 없어야 한다; 연결 이음쇠는 탈착이 쉬워야 하고 압축공기가 누설되지 않아야 한다; 호흡 공급 밸브, 압력계 및 경보 호각은 정상적으로 작동하여야 한다; 각 끈, 잠금 고리는 견고하게 연결되고 사용자의 체격에 따라 쉽게 조절되어야 한다.\n1.4. 등, 조명 기기의 경우: 전구, 누름 버튼, 각 방수 고무 개스킷(있는 경우)이 정상적으로 작동하여야 한다.\n1.5. 복장 및 개인 보호 장비가 고장 난 것, 격리식 방독면에서 압축공기가 누설되는 것을 발견한 경우에는 권한 있는 사람에게 보고하여 적시에 조치·수리하도록 하여야 한다.\n2. 매회 사용 후의 정비\n2.1. 상시 정비와 같은 작업을 실시한다.\n2.2. 복장 및 개인 보호 장비를 보관 위치·장소에 정리하기 전에 수량을 점검하여 세고 청소하며, 말리거나 닦아서 건조시킨다.\n2.3. 복장 및 개인 보호 장비를 전염병 또는 독성물질, 방사선이 있는 지역에서 사용한 경우에는 소독, 제독하여야 한다./.","o":[]},{"id":"tt36-PLV","d":"tt36","n":"PLV","t":"BẢO QUẢN, BẢO DƯỠNG THIẾT BỊ BÁO CHÁY ĐỘC LẬP, THIẾT BỊ","k":"보관·정비: 단독형 화재경보 장치,","c":"부록","x":"THUỘC HỆ THỐNG BÁO CHÁY, THIẾT BỊ THUỘC HỆ THỐNG LOA\nTHÔNG BÁO VÀ HƯỚNG DẪN THOÁT NẠN, THIẾT BỊ THUỘC HỆ\nTHỐNG CHỮA CHÁY, ĐÈN, PHƯƠNG TIỆN CHIẾU SÁNG SỰ CỐ,\nCHỈ DẪN THOÁT NẠN\n(Kèm theo Thông tư số 36/2025/TT-BCA ngày 15 tháng 5 năm 2025\ncủa Bộ trưởng Bộ Công an)\nI. Bảo quản, bảo dưỡng thiết bị báo cháy độc lập, thiết bị thuộc hệ thống báo cháy\nViệc bảo quản, bảo dưỡng thiết bị báo cháy độc lập, thiết bị thuộc hệ thống báo cháy (tủ trung tâm báo cháy, đầu báo cháy các loại, thiết bị truyền tin báo cháy, module các loại, chuông báo cháy, đèn báo cháy, nút ấn báo cháy) tuân theo hướng dẫn của nhà sản xuất, tiêu chuẩn, quy chuẩn kỹ thuật có liên quan.\nII. Bảo quản, bảo dưỡng thiết bị thuộc hệ thống loa thông báo và hướng dẫn thoát nạn\nViệc bảo quản, bảo dưỡng thiết bị thuộc hệ thống loa thông báo và hướng dẫn thoát nạn (thiết bị điều khiển hệ thống âm thanh, mi-cờ-rô-phôn (microphone), thiết bị truyền tín hiệu, loa) tuân theo hướng dẫn của nhà sản xuất, tiêu chuẩn, quy chuẩn kỹ thuật có liên quan.\nIII. Bảo quản, bảo dưỡng thiết bị thuộc hệ thống chữa cháy bằng khí, sol-khí, nước, bột, bọt, chất chữa cháy gốc nước\nViệc bảo quản, bảo dưỡng thiết bị thuộc hệ thống chữa cháy bằng khí, sol-khí, nước, bột, bọt, chất chữa cháy gốc nước (tủ điều khiển chữa cháy, chuông, còi, đèn, bảng hiển thị cảnh báo xả chất chữa cháy, van báo động, van tràn ngập, van giám sát, van chọn vùng, công tắc áp lực, công tắc dòng chảy, ống phi kim loại dùng trong hệ thống cấp nước chữa cháy tự động, ống mềm dùng cho đầu phun chữa cháy, họng tiếp nước chữa cháy (họng chờ), đầu phun chất chữa cháy các loại, chai, thiết bị chứa khí, sol-khí, bột, bọt, chất chữa cháy gốc nước các loại) tuân theo hướng dẫn của nhà sản xuất, tiêu chuẩn, quy chuẩn kỹ thuật có liên quan.\nIV. Bảo quản, bảo dưỡng đèn, phương tiện chiếu sáng sự cố, chỉ dẫn thoát nạn\nViệc bảo quản, bảo dưỡng đèn, phương tiện chiếu sáng sự cố, chỉ dẫn thoát nạn tuân theo hướng dẫn của nhà sản xuất, tiêu chuẩn, quy chuẩn kỹ thuật có liên quan./.","y":"화재경보 설비에 속하는 장치, 방송(스피커)\n안내 및 피난 유도 설비에 속하는 장치,\n소화 설비에 속하는 장치, 비상조명등·비상조명 기구,\n피난 유도 표지\n(공안부 장관의 2025년 5월 15일자 시행규칙 제36/2025/TT-BCA호에\n첨부)\nI. 단독형 화재경보 장치, 화재경보 설비에 속하는 장치의 보관·정비\n단독형 화재경보 장치, 화재경보 설비에 속하는 장치(화재경보 수신반, 각종 화재감지기, 화재 신호 전송 장치, 각종 모듈, 화재경보 벨, 화재경보등, 화재경보 누름 버튼)의 보관·정비는 제조자의 안내, 관련 기술 표준·기술 규정을 따른다.\nII. 방송(스피커) 안내 및 피난 유도 설비에 속하는 장치의 보관·정비\n방송(스피커) 안내 및 피난 유도 설비에 속하는 장치(음향 설비 제어 장치, 마이크로폰(microphone), 신호 전송 장치, 스피커)의 보관·정비는 제조자의 안내, 관련 기술 표준·기술 규정을 따른다.\nIII. 가스, 에어로졸(sol-khí), 물, 분말, 포, 수계 소화약제에 의한 소화 설비에 속하는 장치의 보관·정비\n가스, 에어로졸(sol-khí), 물, 분말, 포, 수계 소화약제에 의한 소화 설비에 속하는 장치(소화 제어반, 벨, 경적, 등, 소화약제 방출 경고 표시판, 경보 밸브, 일제개방 밸브, 감시 밸브, 구역 선택 밸브, 압력 스위치, 유수 스위치, 자동 소화용수 공급 설비에 사용하는 비금속 배관, 소화 분사 헤드용 플렉시블 호스, 소화용수 송수구(대기 송수구), 각종 소화약제 분사 헤드, 각종 가스, 에어로졸(sol-khí), 분말, 포, 수계 소화약제 용기·저장 장치)의 보관·정비는 제조자의 안내, 관련 기술 표준·기술 규정을 따른다.\nIV. 비상조명등·비상조명 기구, 피난 유도 표지의 보관·정비\n비상조명등·비상조명 기구, 피난 유도 표지의 보관·정비는 제조자의 안내, 관련 기술 표준·기술 규정을 따른다./.","o":[]},{"id":"tt62-8","d":"tt62","n":"8","t":"Sửa đổi, bổ sung Điều 9 Thông tư số 36/2025/TT-BCA ngày 15 tháng 5 năm 2025 của Bộ trưởng Bộ Công an quy định chi tiết một số điều của Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ và Nghị định số 105/2025/NĐ-CP ngày 15 tháng 5 năm 2025 của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ","k":"「소방 및 구조·구난법」의 일부 조항을 상세 규정하는 공안부 장관의 2025년 5월 15일자 시행규칙 제36/2025/TT-BCA호 및 「소방 및 구조·구난법」의 일부 조항 및 시행 조치를 상세 규정하는 정부의 2025년 5월 15일자 시행령 제105/2025/NĐ-CP호 관련, 시행규칙 제36/2025/TT-BCA호 제9조의 개정·보충","c":"제2장 세부 규정","x":"“Điều 9. Thẩm quyền thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan Công an\n1. Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ thẩm định thiết kế về phòng cháy và chữa cháy đối với công trình quy định tại Phụ lục III kèm theo Nghị định số 105/2025/NĐ-CP ngày 15 tháng 5 năm 2025 của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ (sau đây viết gọn là Nghị định số 105/2025/NĐ-CP), cụ thể:\na) Công trình thuộc thẩm quyền quyết định chủ trương đầu tư, chấp thuận chủ trương đầu tư của Quốc hội, Thủ tướng Chính phủ theo quy định của pháp luật về đầu tư, pháp luật về đầu tư công, pháp luật về đầu tư theo phương thức đối tác công tư;\nb) Công trình thuộc dự án có công trình cấp đặc biệt theo quy định của pháp luật về xây dựng;\nc) Công trình trụ sở, nhà làm việc của các đơn vị thuộc cơ quan Bộ Công an, công trình thuộc dự án có công trình cấp I khi có đề nghị của chủ đầu tư, chủ sở hữu công trình;\nd) Công trình xây dựng trên địa bàn hành chính từ 02 tỉnh, thành phố trực thuộc trung ương trở lên;\nđ) Công trình dân dụng có chiều cao phòng cháy và chữa cháy trên 150 m;\ne) Công trình có quy mô lớn, kỹ thuật phức tạp thuộc danh mục theo quy định của pháp luật về xây dựng.\n2. Phòng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ Công an cấp tỉnh thẩm định thiết kế về phòng cháy và chữa cháy đối với công trình, phương tiện giao thông, cụ thể:\na) Công trình quy định tại Phụ lục III kèm theo Nghị định số 105/2025/NĐ-CP trên địa bàn quản lý, trừ các công trình quy định tại khoản 1 Điều này;\nb) Phương tiện giao thông quy định tại Phụ lục III kèm theo Nghị định số 105/2025/NĐ-CP của cơ quan, tổ chức, cá nhân có trụ sở, văn phòng đại diện, chi nhánh, có đăng ký kinh doanh hoặc sản xuất, lắp ráp, đóng mới, hoán cải trên địa bàn quản lý;\nc) Công trình quy định tại Phụ lục III kèm theo Nghị định số 105/2025/NĐ-CP trên địa bàn quản lý đã được Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ thẩm duyệt thiết kế về phòng cháy và chữa cháy, thẩm định thiết kế về phòng cháy và chữa cháy và đã tổ chức nghiệm thu về phòng cháy và chữa cháy theo quy định của pháp luật mà trong quá trình sử dụng có thay đổi công năng hoặc cải tạo làm thay đổi điều kiện an toàn phòng cháy và chữa cháy theo quy định tại khoản 3 Điều 9 Nghị định số 105/2025/NĐ-CP.”.","y":"“제9조. 공안기관의 소방 설계 심사 권한\n1. 소방·구조구난 경찰국은 「소방 및 구조·구난법」의 일부 조항 및 시행 조치를 상세 규정하는 정부의 2025년 5월 15일자 시행령 제105/2025/NĐ-CP호(이하 시행령 제105/2025/NĐ-CP호라 약칭한다)에 첨부된 부록 III에 규정된 건축물에 대하여 소방 설계 심사를 하며, 구체적으로 다음과 같다:\na) 투자에 관한 법령, 공공투자에 관한 법령, 민관협력 방식 투자에 관한 법령의 규정에 따라 국회, 정부 총리의 투자 방침 결정, 투자 방침 승인 권한에 속하는 건축물;\nb) 건설에 관한 법령의 규정에 따른 특급 건축물이 있는 사업에 속하는 건축물;\nc) 발주자(투자자), 건축물 소유자의 요청이 있는 경우 공안부 기관 소속 각 단위의 청사·업무용 건물인 건축물, I급 건축물이 있는 사업에 속하는 건축물;\nd) 02개 이상의 성, 중앙직할시의 행정 구역에 걸쳐 건설되는 건축물;\nđ) 소방 높이가 150 m를 초과하는 민용 건축물;\ne) 건설에 관한 법령의 규정에 따른 목록에 속하는 대규모이고 기술이 복잡한 건축물.\n2. 성급 공안의 소방·구조구난 경찰과는 건축물, 교통수단에 대하여 소방 설계 심사를 하며, 구체적으로 다음과 같다:\na) 관할 지역 내에서 시행령 제105/2025/NĐ-CP호에 첨부된 부록 III에 규정된 건축물. 다만, 이 조 제1항에 규정된 건축물은 제외한다;\nb) 관할 지역 내에 본점, 대표사무소, 지점이 있거나 사업자등록이 되어 있거나 관할 지역 내에서 생산, 조립, 신조, 개조하는 기관, 조직, 개인의 것으로서 시행령 제105/2025/NĐ-CP호에 첨부된 부록 III에 규정된 교통수단;\nc) 관할 지역 내에서 시행령 제105/2025/NĐ-CP호에 첨부된 부록 III에 규정된 건축물로서 소방·구조구난 경찰국이 소방 설계 심사승인(thẩm duyệt), 소방 설계 심사를 하였고 법령의 규정에 따라 소방 준공검사(인수검사)를 실시하였으나, 사용 과정에서 시행령 제105/2025/NĐ-CP호 제9조 제3항의 규정에 따라 용도를 변경하거나 소방 안전 조건을 변경시키는 개조를 하는 건축물.”.","o":[]},{"id":"tt62-9","d":"tt62","n":"9","t":"Hiệu lực thi hành và điều khoản chuyển tiếp","k":"시행일(효력) 및 경과 규정","c":"제3장 시행 조항","x":"1. Thông tư này có hiệu lực thi hành kể từ ngày ký, trừ quy định tại khoản 2 Điều này.\n2. Điều 8 Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2026.\n3. Đối với hồ sơ đề nghị giải quyết thủ tục hành chính thuộc các lĩnh vực được quy định tại Chương II Thông tư này đã được cơ quan có thẩm quyền tiếp nhận hoặc đã được đóng dấu bưu chính trước ngày Thông tư này có hiệu lực thì thực hiện theo quy định của pháp luật đang có hiệu lực điều chỉnh trong lĩnh vực đó tại thời điểm hồ sơ được tiếp nhận.","y":"1. 이 시행규칙은 서명일부터 시행한다. 다만, 이 조 제2항의 규정은 제외한다.\n2. 이 시행규칙 제8조는 2026년 7월 01일부터 시행한다.\n3. 이 시행규칙 제2장에 규정된 각 분야에 속하는 행정절차 처리 신청 서류로서 이 시행규칙의 시행일 전에 권한 있는 기관이 접수하였거나 우편 소인이 찍힌 것은 서류가 접수된 시점에 해당 분야를 규율하는 현행 법령의 규정에 따라 처리한다.","o":[]},{"id":"tt63-1","d":"tt63","n":"1","t":"Phạm vi điều chỉnh và đối tượng áp dụng","k":"규율 범위 및 적용 대상","c":"","x":"1. Phạm vi điều chỉnh\nThông tư này hướng dẫn điểm b khoản 6 và điểm b khoản 11 Điều 23 của Nghị định số 105/2025/NĐ-CP ngày 15/5/2025 của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ (sau đây gọi tắt là Nghị định số 105/2025/NĐ-CP) thuộc phạm vi quản lý nhà nước của Bộ Xây dựng, bao gồm:\na) Thẩm quyền cấp phép lưu thông đối với vật liệu, cấu kiện ngăn cháy, chống cháy;\nb) Thẩm quyền kiểm tra chất lượng vật liệu, cấu kiện ngăn cháy, chống cháy lưu thông trên thị trường sau khi được cấp giấy phép;\nc) Thẩm quyền chỉ định tổ chức đánh giá sự phù hợp thực hiện hoạt động thử nghiệm vật liệu, cấu kiện ngăn cháy, chống cháy.\n2. Đối tượng áp dụng\nCác cơ quan, đơn vị trực thuộc Bộ Xây dựng; Ủy ban nhân dân các tỉnh, thành phố và các tổ chức, cá nhân có liên quan đến các nội dung quy định tại khoản 1 Điều 1 Thông tư này.","y":"1. 규율 범위\n이 시행규칙은 건설부의 국가 관리 범위에 속하는, 「소방 및 구조·구난법」의 일부 조항 및 시행 조치를 상세 규정하는 정부의 15/5/2025자 시행령 제105/2025/NĐ-CP호(이하 시행령 제105/2025/NĐ-CP호라 약칭한다) 제23조 제6항 b호 및 제11항 b호를 안내하며, 다음을 포함한다:\na) 방화·내화 자재 및 부재에 대한 유통 허가 권한;\nb) 허가를 받은 후 시장에 유통되는 방화·내화 자재 및 부재의 품질 검사 권한;\nc) 방화·내화 자재 및 부재의 시험 활동을 수행하는 적합성 평가 기관의 지정 권한.\n2. 적용 대상\n건설부 직속 각 기관·단위; 각 성, 시 인민위원회 및 이 시행규칙 제1조 제1항에 규정된 내용과 관련된 조직, 개인.","o":[]},{"id":"tt63-2","d":"tt63","n":"2","t":"Thẩm quyền cấp giấy phép lưu thông đối với vật liệu, cấu kiện ngăn cháy, chống cháy","k":"방화·내화 자재 및 부재에 대한 유통 허가서 발급 권한","c":"","x":"1. Ủy ban nhân dân các tỉnh, thành phố giao cơ quan chuyên môn về xây dựng ở địa phương thực hiện cấp giấy phép lưu thông đối với vật liệu, cấu kiện ngăn cháy, chống cháy.\n2. Việc cấp giấy phép lưu thông đối với vật liệu, cấu kiện ngăn cháy, chống cháy được thực hiện theo quy định tại Điều 23 của Nghị định số 105/2025/NĐ-CP và pháp luật có liên quan.","y":"1. 각 성, 시 인민위원회는 지방의 건설 전문기관에 방화·내화 자재 및 부재에 대한 유통 허가서 발급을 수행하도록 위임한다.\n2. 방화·내화 자재 및 부재에 대한 유통 허가서 발급은 시행령 제105/2025/NĐ-CP호 제23조의 규정 및 관련 법령에 따라 실시한다.","o":[]},{"id":"tt63-3","d":"tt63","n":"3","t":"Thẩm quyền kiểm tra chất lượng đối với vật liệu, cấu kiện ngăn cháy, chống cháy lưu thông trên thị trường sau khi được cấp giấy phép","k":"허가를 받은 후 시장에 유통되는 방화·내화 자재 및 부재에 대한 품질 검사 권한","c":"","x":"1. Cục Giám định nhà nước về chất lượng công trình xây dựng tổ chức kiểm tra chất lượng đối với vật liệu, cấu kiện ngăn cháy, chống cháy lưu thông trên thị trường sau khi được cấp giấy phép.\n2. Việc kiểm tra chất lượng và xử lý vi phạm về chất lượng đối với vật liệu, cấu kiện ngăn cháy, chống cháy lưu thông trên thị trường thực hiện theo quy định của pháp luật về chất lượng sản phẩm, hàng hóa và pháp luật có liên quan.","y":"1. 건설공사 품질 국가감정국은 허가를 받은 후 시장에 유통되는 방화·내화 자재 및 부재에 대한 품질 검사를 실시한다.\n2. 시장에 유통되는 방화·내화 자재 및 부재에 대한 품질 검사 및 품질 위반 처리는 제품·상품 품질에 관한 법령 및 관련 법령의 규정에 따라 실시한다.","o":[]},{"id":"tt63-4","d":"tt63","n":"4","t":"Thẩm quyền chỉ định tổ chức đánh giá sự phù hợp thực hiện hoạt động thử nghiệm đối với vật liệu, cấu kiện ngăn cháy, chống cháy","k":"방화·내화 자재 및 부재에 대한 시험 활동을 수행하는 적합성 평가 기관의 지정 권한","c":"","x":"1. Vụ Khoa học công nghệ, môi trường và Vật liệu xây dựng chỉ định tổ chức đánh giá sự phù hợp thực hiện hoạt động thử nghiệm đối với vật liệu, cấu kiện ngăn cháy, chống cháy.\n2. Việc chỉ định tổ chức đánh giá sự phù hợp thực hiện hoạt động thử nghiệm đối với vật liệu, cấu kiện ngăn cháy, chống cháy thực hiện theo quy định của pháp luật về chất lượng sản phẩm, hàng hóa và pháp luật có liên quan.","y":"1. 과학기술·환경 및 건축자재국은 방화·내화 자재 및 부재에 대한 시험 활동을 수행하는 적합성 평가 기관을 지정한다.\n2. 방화·내화 자재 및 부재에 대한 시험 활동을 수행하는 적합성 평가 기관의 지정은 제품·상품 품질에 관한 법령 및 관련 법령의 규정에 따라 실시한다.","o":[]},{"id":"tt63-5","d":"tt63","n":"5","t":"Trách nhiệm thi hành","k":"시행 책임","c":"","x":"1. Trách nhiệm của Ủy ban nhân dân các tỉnh, thành phố:\na) Tổ chức cấp giấy phép lưu thông đối với vật liệu, cấu kiện ngăn cháy, chống cháy;\nb) Thực hiện kiểm tra định kỳ hoặc đột xuất hoạt động của các tổ chức, cá nhân được cấp giấy phép lưu thông đối với vật liệu, cấu kiện ngăn cháy, chống cháy;\nc) Xây dựng hệ thống Cơ sở dữ liệu quản lý chuyên ngành để các cơ quan, tổ chức, cá nhân sản xuất, nhập khẩu, lắp ráp vật liệu, cấu kiện ngăn cháy, chống cháy thực hiện khai báo theo quy định của pháp luật;\nd) Định kỳ trước ngày 20 tháng 12 hàng năm, tổng hợp, báo cáo kết quả triển khai thực hiện nhiệm vụ được phân cấp theo quy định về Bộ Xây dựng.\nđ) Phối hợp với Bộ Xây dựng trong công tác kiểm tra chất lượng đối với vật liệu, cấu kiện ngăn cháy, chống cháy khi được yêu cầu.\n2. Trách nhiệm của Cục Giám định nhà nước về chất lượng công trình xây dựng:\na) Tổ chức kiểm tra định kỳ hàng năm hoặc đột xuất chất lượng đối với vật liệu, cấu kiện ngăn cháy, chống cháy theo quy định.\nb) Xây dựng báo cáo hàng năm về kết quả thực hiện các nhiệm vụ được giao gửi về Vụ Khoa học công nghệ, môi trường và Vật liệu xây dựng để tổng hợp, báo cáo Bộ Xây dựng.\n3. Trách nhiệm của Vụ Khoa học công nghệ, môi trường và Vật liệu xây dựng:\na) Tổ chức kiểm tra định kỳ hàng năm hoặc đột xuất việc cấp giấy phép lưu thông đối với vật liệu, cấu kiện ngăn cháy, chống cháy theo quy định pháp luật;\nb) Tổ chức theo dõi, kiểm tra; xây dựng báo cáo hàng năm về việc thực hiện Thông tư này gửi về Bộ Xây dựng.\n4. Trách nhiệm của tổ chức, cá nhân sản xuất, nhập khẩu, lắp ráp vật liệu, cấu kiện ngăn cháy, chống cháy:\na) Thực hiện việc khai báo thông tin theo quy định của pháp luật.\nb) Thực hiện theo yêu cầu của các cơ quan nhà nước có thẩm quyền quy định tại khoản 1 và khoản 2 Điều này.\nc) Đảm bảo về chất lượng vật liệu, cấu kiện ngăn cháy, chống cháy theo quy định của pháp luật.","y":"1. 각 성, 시 인민위원회의 책임:\na) 방화·내화 자재 및 부재에 대한 유통 허가서 발급을 실시한다;\nb) 방화·내화 자재 및 부재에 대한 유통 허가서를 발급받은 조직, 개인의 활동에 대하여 정기 또는 수시 검사를 실시한다;\nc) 방화·내화 자재 및 부재를 생산, 수입, 조립하는 기관, 조직, 개인이 법령의 규정에 따라 신고를 할 수 있도록 전문 분야 관리 데이터베이스 시스템을 구축한다;\nd) 매년 12월 20일 전에 정기적으로, 규정에 따라 분권 받은 임무의 추진·이행 결과를 종합하여 건설부에 보고한다.\nđ) 요청이 있는 경우 방화·내화 자재 및 부재에 대한 품질 검사 업무에서 건설부와 협조한다.\n2. 건설공사 품질 국가감정국의 책임:\na) 규정에 따라 방화·내화 자재 및 부재에 대한 품질을 매년 정기 또는 수시로 검사한다.\nb) 부여받은 임무의 이행 결과에 관한 연간 보고서를 작성하여 과학기술·환경 및 건축자재국에 송부하고, 동 국이 종합하여 건설부에 보고하도록 한다.\n3. 과학기술·환경 및 건축자재국의 책임:\na) 법령의 규정에 따라 방화·내화 자재 및 부재에 대한 유통 허가서 발급을 매년 정기 또는 수시로 검사한다;\nb) 추적·검사를 실시한다; 이 시행규칙의 이행에 관한 연간 보고서를 작성하여 건설부에 송부한다.\n4. 방화·내화 자재 및 부재를 생산, 수입, 조립하는 조직, 개인의 책임:\na) 법령의 규정에 따라 정보 신고를 한다.\nb) 이 조 제1항 및 제2항에 규정된 권한 있는 국가기관의 요구에 따라 이행한다.\nc) 법령의 규정에 따라 방화·내화 자재 및 부재의 품질을 보장한다.","o":[]},{"id":"tt63-6","d":"tt63","n":"6","t":"Hiệu lực thi hành","k":"시행일(효력)","c":"","x":"Thông tư này có hiệu lực thi hành kể từ ngày 16 tháng 02 năm 2026./.","y":"이 시행규칙은 2026년 02월 16일부터 시행한다./.","o":[]},{"id":"nd67-1","d":"nd67","n":"1","t":"Phạm vi điều chỉnh","k":"규율 범위","c":"제1장 총칙","x":"Nghị định này quy định về:\n1. Điều kiện bảo hiểm, mức phí bảo hiểm, số tiền bảo hiểm tối thiểu đối với bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới, bảo hiểm cháy, nổ bắt buộc, bảo hiểm bắt buộc trong\nhoạt động đầu tư xây dựng .\n2. Cơ chế quản lý, sử dụng Quỹ bảo hiểm xe cơ giới; mức thu, chế độ quản lý, sử dụng nguồn thu từ bảo hiểm cháy, nổ bắt buộc cho hoạt động phòng cháy, chữa cháy.\n3. Trách nhiệm của các bộ, cơ quan có liên quan, bên mua bảo hiểm và doanh nghiệp bảo hiểm trong việc thực hiện bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới, bảo hiểm cháy, nổ bắt buộc, bảo hiểm bắt buộc trong\nhoạt động đầu tư xây dựng .","y":"이 시행령은 다음에 관하여 규정한다:\n1. 자동차 소유자의 민사책임 의무보험, 화재·폭발 의무보험 및\n건설투자 활동에서의 의무보험에 대한 보험 조건, 보험료 수준, 최저 보험가입금액.\n2. 자동차보험기금의 관리·사용 체계; 소방(화재예방·진압) 활동을 위한 화재·폭발 의무보험 수입의 징수 수준, 관리·사용 제도.\n3. 자동차 소유자의 민사책임 의무보험, 화재·폭발 의무보험 및\n건설투자 활동에서의 의무보험의 이행에 있어서 관련 각 부처·기관, 보험계약자 및 보험회사의 책임.","o":[["Cụm từ ''hoạt động đầu tư xây dựng'' bị thay thế bởi Khoản 2 Điều 9 Nghị định số 220/2026/NĐ-CP",""]]},{"id":"nd67-2","d":"nd67","n":"2","t":"Đối tượng áp dụng","k":"적용 대상","c":"제1장 총칙","x":"Nghị định này áp dụng đối với:\n1. Chủ xe cơ giới tham gia giao thông, hoạt động trên lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam đối với bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới.\n2. Cơ quan, tổ chức và cá nhân có cơ sở có nguy hiểm về cháy, nổ theo quy định của pháp luật phòng cháy và chữa cháy đối với bảo hiểm cháy, nổ bắt buộc.\n3. Chủ đầu tư, nhà thầu theo quy định của pháp luật xây dựng đối với bảo hiểm bắt buộc trong\nhoạt động đầu tư xây dựng .\n4. Doanh nghiệp bảo hiểm phi nhân thọ, chi nhánh doanh nghiệp bảo hiểm phi nhân thọ nước ngoài (sau đây gọi là “doanh nghiệp bảo hiểm”); doanh nghiệp tái bảo hiểm, chi nhánh doanh nghiệp tái bảo hiểm nước ngoài (sau đây gọi là “doanh nghiệp tái bảo hiểm”).\n5. Cơ quan, tổ chức, cá nhân khác có liên quan đến bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới, bảo hiểm cháy, nổ bắt buộc, bảo hiểm bắt buộc trong\nhoạt động đầu tư xây dựng .","y":"이 시행령은 다음에 적용한다:\n1. 자동차 소유자의 민사책임 의무보험에 대하여는 베트남 사회주의 공화국 영토에서 교통에 참여하고 운행하는 자동차의 소유자.\n2. 화재·폭발 의무보험에 대하여는 소방 법령의 규정에 따른 화재·폭발 위험 사업장을 보유한 기관, 조직 및 개인.\n3. 건설 법령의 규정에 따른 발주자(투자자), 수급인(시공·용역 업체) —\n건설투자 활동에서의 의무보험에 대하여.\n4. 손해보험회사, 외국 손해보험회사의 지점(이하 “보험회사”라 한다); 재보험회사, 외국 재보험회사의 지점(이하 “재보험회사”라 한다).\n5. 자동차 소유자의 민사책임 의무보험, 화재·폭발 의무보험 및\n건설투자 활동에서의 의무보험과 관련된 그 밖의 기관, 조직, 개인.","o":[["Cụm từ ''hoạt động đầu tư xây dựng'' bị thay thế bởi Khoản 2 Điều 9 Nghị định số 220/2026/NĐ-CP",""]]},{"id":"nd67-3","d":"nd67","n":"3","t":"Giải thích từ ngữ","k":"용어의 해석","c":"제1장 총칙","x":"Trong Nghị định này, các từ ngữ dưới đây được hiểu như sau:\n1. Chủ xe cơ giới là chủ sở hữu xe cơ giới hoặc được chủ sở hữu xe cơ giới giao chiếm hữu, sử dụng hợp pháp xe cơ giới.\n2. Xe cơ giới hoạt động là xe cơ giới đang vận hành gồm di chuyển, dừng xe, đỗ xe có sự điều khiển của chủ xe cơ giới hoặc người lái xe.\n3. Xe cơ giới tham gia giao thông là việc chủ xe cơ giới hoặc người lái xe điều khiển xe cơ giới tham gia giao thông đường bộ.\n4. Nhà thầu tư vấn là nhà thầu tư vấn khảo sát xây dựng, nhà thầu tư vấn thiết kế xây dựng của công trình xây dựng từ cấp II trở lên.\n5.\nNgười thứ ba\na) Đối với bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới:\nNgười thứ ba là người bị thiệt hại về sức khỏe, tính mạng, tài sản do xe cơ giới gây ra, trừ những người sau: Người lái xe, người trên xe, hành khách trên chính chiếc xe đó; chủ sở hữu xe trừ trường hợp chủ sở hữu đã giao cho tổ chức, cá nhân khác chiếm hữu, sử dụng chiếc xe đó.\nb) Đối với bảo hiểm bắt buộc trong\nhoạt động đầu tư xây dựng :\nNgười thứ ba là bên bị thiệt hại về sức khỏe, tính mạng, tài sản hoặc quyền, lợi ích hợp pháp khác có nguyên nhân từ việc khảo sát xây dựng, thiết kế xây dựng, thi công xây dựng trừ doanh nghiệp bảo hiểm, bên mua bảo hiểm, người lao động thi công trên công trường.\n6. Mức khấu trừ bảo hiểm là số tiền mà bên mua bảo hiểm phải tự chịu trong mỗi sự kiện bảo hiểm.\n7. Đưa vào sử dụng là việc đưa công trình, hạng mục công trình xây dựng vào vận hành, khai thác.\n8. Bệnh nghề nghiệp theo quy định tại Luật An toàn, vệ sinh lao động.\n9. Người lao động theo quy định tại Bộ luật Lao động.\n10. Tai nạn lao động theo quy định tại Luật An toàn, vệ sinh lao động.","y":"이 시행령에서 아래 용어는 다음과 같이 이해한다:\n1. 자동차 소유자란 자동차의 소유자 또는 자동차 소유자로부터 자동차의 적법한 점유·사용을 위임받은 자를 말한다.\n2. 운행 중인 자동차란 자동차 소유자 또는 운전자의 조종하에 이동, 정차, 주차를 포함하여 운용 중인 자동차를 말한다.\n3. 자동차의 교통 참여란 자동차 소유자 또는 운전자가 자동차를 조종하여 도로 교통에 참여하는 것을 말한다.\n4. 자문 수급인이란 II급 이상 건설공사의 건설 조사 자문 수급인, 건설 설계 자문 수급인을 말한다.\n5.\n제3자\na) 자동차 소유자의 민사책임 의무보험의 경우:\n제3자란 자동차로 인하여 건강, 생명, 재산에 손해를 입은 사람을 말한다. 다만, 다음의 사람은 제외한다: 바로 그 자동차의 운전자, 탑승자, 승객; 자동차의 소유자. 다만, 소유자가 그 자동차를 다른 조직, 개인에게 점유·사용하도록 넘겨준 경우는 제외한다.\nb) 다음의 의무보험의 경우 —\n건설투자 활동에서의 의무보험:\n제3자란 건설 조사, 건설 설계, 건설 시공에서 비롯된 원인으로 건강, 생명, 재산 또는 그 밖의 적법한 권리·이익에 손해를 입은 측을 말한다. 다만, 보험회사, 보험계약자, 공사 현장에서 시공하는 근로자는 제외한다.\n6. 자기부담금이란 각 보험사고에서 보험계약자가 스스로 부담하여야 하는 금액을 말한다.\n7. 사용 개시란 건설공사, 건설공사의 세부 공종(시설)을 운영, 활용에 투입하는 것을 말한다.\n8. 직업병은 「산업안전·위생법」의 규정에 따른다.\n9. 근로자는 「노동법전」의 규정에 따른다.\n10. 산업재해는 「산업안전·위생법」의 규정에 따른다.","o":[["Cụm từ ''Người thứ ba'' bị thay thế bởi Khoản 1 Điều 9 Nghị định số 220/2026/NĐ-CP",""],["Cụm từ ''hoạt động đầu tư xây dựng'' bị thay thế bởi Khoản 2 Điều 9 Nghị định số 220/2026/NĐ-CP",""]]},{"id":"nd67-4","d":"nd67","n":"4","t":"Nguyên tắc chung","k":"일반 원칙","c":"제1장 총칙","x":"1. Cơ quan, tổ chức và cá nhân quy định tại khoản 1, khoản 2, khoản 3 Điều 2 Nghị định này (sau đây gọi là “bên mua bảo hiểm”) phải mua bảo hiểm bắt buộc tại các doanh nghiệp bảo hiểm được phép triển khai nghiệp vụ bảo hiểm theo quy định pháp luật.\n2. Bên mua bảo hiểm và doanh nghiệp bảo hiểm triển khai bảo hiểm bắt buộc theo điều kiện bảo hiểm, mức phí bảo hiểm, số tiền bảo hiểm tối thiểu quy định tại Nghị định này.\n3. Ngoài việc tham gia bảo hiểm bắt buộc theo điều kiện bảo hiểm, mức phí bảo hiểm, số tiền bảo hiểm tối thiểu hoặc giới hạn trách nhiệm bảo hiểm quy định tại Nghị định này, bên mua bảo hiểm và doanh nghiệp bảo hiểm có thể thỏa thuận tại hợp đồng bảo hiểm về mở rộng điều kiện bảo hiểm, số tiền bảo hiểm tăng thêm và mức phí bảo hiểm bổ sung tương ứng phù hợp với quy định pháp luật. Trong trường hợp này, doanh nghiệp bảo hiểm có trách nhiệm tách riêng phần bảo hiểm bắt buộc trong hợp đồng bảo hiểm.\nNhà nước khuyến khích các cơ quan, tổ chức và cá nhân không thuộc đối tượng phải mua bảo hiểm bắt buộc theo quy định tại Nghị định này mua bảo hiểm trên cơ sở thỏa thuận với doanh nghiệp bảo hiểm và phù hợp với quy định pháp luật.\n4. Trong bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới, đối với mỗi xe cơ giới, trách nhiệm bồi thường bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới chỉ phát sinh theo một hợp đồng bảo hiểm duy nhất.\n5. Doanh nghiệp bảo hiểm có quyền từ chối bán bảo hiểm bắt buộc trong các trường hợp sau:\na) Đối với bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới:\nXe cơ giới hết niên hạn sử dụng theo quy định của pháp luật.\nb) Đối với bảo hiểm cháy, nổ bắt buộc:\nCơ sở có nguy hiểm về cháy, nổ chưa được nghiệm thu về phòng cháy và chữa cháy theo quy định pháp luật.\nCơ sở có nguy hiểm về cháy, nổ không có biên bản kiểm tra an toàn về phòng cháy và chữa cháy của cơ quan Công an có thẩm quyền hoặc biên bản kiểm tra đã quá 1 năm tính từ thời điểm lập đến thời điểm mua bảo hiểm cháy, nổ bắt buộc.\nCơ sở có nguy hiểm về cháy, nổ đang bị tạm đình chỉ hoặc đình chỉ hoạt động do vi phạm quy định pháp luật phòng cháy và chữa cháy.\nc) Đối với bảo hiểm bắt buộc trong\nhoạt động đầu tư xây dựng :\nBên mua bảo hiểm không đáp ứng đầy đủ điều kiện năng lực hoạt động xây dựng quy định tại Luật Xây dựng và các văn bản hướng dẫn thi hành.\n6. Chi phí mua bảo hiểm bắt buộc:\na) Đối với bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới và bảo hiểm cháy, nổ bắt buộc: Bên mua bảo hiểm được tính chi phí mua bảo hiểm bắt buộc vào giá thành sản phẩm, dịch vụ hoặc chi phí hoạt động kinh doanh (đối với cơ sở sản xuất kinh doanh) hoặc vào chi thường xuyên (đối với cơ quan hành chính nhà nước, đơn vị sự nghiệp công lập, tổ chức chính trị xã hội và các tổ chức khác).\nb) Chi phí mua bảo hiểm bắt buộc trong\nhoạt động đầu tư xây dựng : Thực hiện theo quy định pháp luật về xây dựng và các quy định tại Nghị định này.\n7. Thời hạn thanh toán phí bảo hiểm thực hiện theo quy định của Bộ trưởng Bộ Tài chính. Đối với các hợp đồng bảo hiểm cho các công trình xây dựng thuộc các dự án đầu tư xây dựng quy định tại Nghị định số 50/2021/NĐ-CP ngày 01 tháng 4 năm 2021 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số 37/2015/NĐ-CP ngày 22 tháng 4 năm 2015 của Chính phủ quy định chi tiết về hợp đồng xây dựng, doanh nghiệp bảo hiểm và bên mua bảo hiểm thỏa thuận thời hạn thanh toán phí bảo hiểm ghi trong hợp đồng bảo hiểm và không chậm hơn tiến độ thanh toán của hợp đồng xây dựng. Trong mọi trường hợp, thời hạn thanh toán phí bảo hiểm không được vượt quá thời hạn bảo hiểm.\n8. Doanh nghiệp bảo hiểm không có trách nhiệm bồi thường bảo hiểm đối với những khoản tiền phát sinh, tăng thêm do hành vi gian lận bảo hiểm theo quy định tại Bộ luật Hình sự.\n9. Doanh nghiệp, tổ chức bảo hiểm nước ngoài đứng đầu nhận tái bảo hiểm và doanh nghiệp, tổ chức bảo hiểm nước ngoài nhận tái bảo hiểm từ 10% tổng mức trách nhiệm của mỗi hợp đồng tái bảo hiểm phải được xếp hạng tối thiểu “BBB” theo Standard & Poor’s hoặc Fitch, “B++” theo A.M.Best, “Baal” theo Moody’s hoặc các kết quả xếp hạng tương đương của các tổ chức có chức năng, kinh nghiệm xếp hạng khác tại năm tài chính gần nhất so với thời điểm giao kết hợp đồng tái bảo hiểm.\n10. Các nội dung liên quan đến hợp đồng bảo hiểm không được quy định tại Nghị định này được thực hiện theo pháp luật kinh doanh bảo hiểm và pháp luật có liên quan.\nĐIỀU KIỆN BẢO HIỂM, MỨC PHÍ BẢO HIỂM, GIỚI HẠN TRÁCH NHIỆM BẢO HIỂM","y":"1. 이 시행령 제2조 제1항, 제2항, 제3항에 규정된 기관, 조직 및 개인(이하 “보험계약자”라 한다)은 법령의 규정에 따라 해당 보험 종목을 영위할 수 있는 보험회사에서 의무보험에 가입하여야 한다.\n2. 보험계약자와 보험회사는 이 시행령에 규정된 보험 조건, 보험료 수준, 최저 보험가입금액에 따라 의무보험을 시행한다.\n3. 이 시행령에 규정된 보험 조건, 보험료 수준, 최저 보험가입금액 또는 보험 책임 한도에 따라 의무보험에 가입하는 것 외에, 보험계약자와 보험회사는 보험계약에서 법령의 규정에 부합하게 보험 조건의 확대, 증액된 보험가입금액 및 이에 상응하는 추가 보험료 수준에 관하여 합의할 수 있다. 이 경우 보험회사는 보험계약에서 의무보험 부분을 별도로 구분할 책임이 있다.\n국가는 이 시행령의 규정에 따라 의무보험에 가입하여야 하는 대상에 속하지 않는 기관, 조직 및 개인이 보험회사와의 합의를 기초로 법령의 규정에 부합하게 보험에 가입하는 것을 장려한다.\n4. 자동차 소유자의 민사책임 의무보험에서, 각 자동차에 대하여 자동차 소유자의 민사책임 의무보험의 보험금 지급 책임은 단 하나의 보험계약에 따라서만 발생한다.\n5. 보험회사는 다음의 경우 의무보험의 판매를 거절할 권리가 있다:\na) 자동차 소유자의 민사책임 의무보험의 경우:\n법령의 규정에 따른 사용 연한이 만료된 자동차.\nb) 화재·폭발 의무보험의 경우:\n화재·폭발 위험 사업장이 법령의 규정에 따른 소방 준공검사(인수검사)를 아직 받지 않은 경우.\n화재·폭발 위험 사업장에 권한 있는 공안기관의 소방 안전 점검(검사) 조서가 없거나, 점검(검사) 조서가 작성 시점부터 화재·폭발 의무보험 가입 시점까지 1년을 경과한 경우.\n화재·폭발 위험 사업장이 소방 법령의 규정 위반으로 일시 정지 또는 영업(활동) 정지 중인 경우.\nc) 다음의 의무보험의 경우 —\n건설투자 활동에서의 의무보험:\n보험계약자가 「건설법」 및 그 시행 안내 문서에 규정된 건설 활동 능력 조건을 충분히 충족하지 못하는 경우.\n6. 의무보험 가입 비용:\na) 자동차 소유자의 민사책임 의무보험 및 화재·폭발 의무보험의 경우: 보험계약자는 의무보험 가입 비용을 제품·서비스의 원가 또는 영업 활동 비용(생산·영업 사업장의 경우)에, 또는 경상 지출(국가 행정기관, 공립 사업 단위, 정치·사회 조직 및 그 밖의 조직의 경우)에 산입할 수 있다.\nb) 다음 활동에서의 의무보험 가입 비용 —\n건설투자 활동: 건설에 관한 법령의 규정 및 이 시행령의 규정에 따라 실시한다.\n7. 보험료 납부 기한은 재무부 장관의 규정에 따라 실시한다. 건설 계약에 관하여 상세히 규정하는 정부의 2015년 4월 22일자 시행령 제37/2015/NĐ-CP호의 일부 조항을 개정·보충하는 정부의 2021년 4월 01일자 시행령 제50/2021/NĐ-CP호에 규정된 건설투자 사업에 속하는 건설공사에 대한 보험계약의 경우, 보험회사와 보험계약자는 보험료 납부 기한을 합의하여 보험계약에 기재하되 건설 계약의 대금 지급 일정보다 늦어서는 안 된다. 어떠한 경우에도 보험료 납부 기한은 보험 기간을 초과해서는 안 된다.\n8. 보험회사는 「형법전」의 규정에 따른 보험 사기 행위로 인하여 발생하거나 증가한 금액에 대하여는 보험금 지급 책임이 없다.\n9. 재보험을 인수하는 주간(선도) 외국 보험회사·보험 조직 및 각 재보험계약의 총 책임 한도의 10% 이상의 재보험을 인수하는 외국 보험회사·보험 조직은 재보험계약 체결 시점과 가장 가까운 회계연도에 Standard & Poor’s 또는 Fitch 기준 최소 “BBB”, A.M.Best 기준 “B++”, Moody’s 기준 “Baal” 또는 신용평가 기능과 경험을 갖춘 그 밖의 기관의 이에 상당하는 평가 결과로 등급을 받아야 한다.\n10. 이 시행령에 규정되지 않은 보험계약 관련 내용은 보험업 법령 및 관련 법령에 따라 실시한다.\n보험 조건, 보험료 수준, 보험 책임 한도","o":[["Điểm b Khoản 5 Điều 4 được sửa đổi, bổ sung bởi Điểm a Khoản 1 Điều 44 Nghị định số 105/2025/NĐ-CP","nd105-44"],["Điểm a khoản 1 Điều 44 được sửa đổi, bổ sung bởi khoản 2 Điều 28 Nghị định số 347/2026/NĐ-CP","nd347-28"],["Cụm từ ''hoạt động đầu tư xây dựng'' bị thay thế bởi Khoản 2 Điều 9 Nghị định số 220/2026/NĐ-CP",""]]},{"id":"nd67-23","d":"nd67","n":"23","t":"Đối tượng bảo hiểm","k":"보험의 목적(보험 대상)","c":"제3장 화재·폭발 의무보험 규정 · 제1절","x":"1. Đối tượng bảo hiểm cháy, nổ bắt buộc là toàn bộ tài sản của cơ sở có nguy hiểm về cháy, nổ, bao gồm:\na) Nhà, công trình và các tài sản gắn liền với nhà, công trình; máy móc, thiết bị.\nb) Các loại hàng hóa, vật tư (bao gồm cả nguyên vật liệu, bán thành phẩm, thành phẩm).\n2. Đối tượng bảo hiểm và địa điểm của đối tượng bảo hiểm phải được ghi rõ trong hợp đồng bảo hiểm, Giấy chứng nhận bảo hiểm.","y":"1. 화재·폭발 의무보험의 보험 대상은 화재·폭발 위험 사업장의 재산 전부이며, 다음을 포함한다:\na) 건물, 공작물 및 건물, 공작물에 부착된 재산; 기계, 설비.\nb) 각종 상품, 물자(원자재, 반제품, 완제품을 포함한다).\n2. 보험 대상 및 보험 대상의 소재지는 보험계약, 보험증명서에 명확히 기재되어야 한다.","o":[["Điểm a Khoản 1 Điều 23 được sửa đổi, bổ sung bởi Điểm b Khoản 1 Điều 44 Nghị định số 105/2025/NĐ-CP","nd105-44"]]},{"id":"nd67-24","d":"nd67","n":"24","t":"Số tiền bảo hiểm tối thiểu","k":"최저 보험가입금액","c":"제3장 화재·폭발 의무보험 규정 · 제1절","x":"1. Số tiền bảo hiểm cháy, nổ bắt buộc tối thiểu là giá trị tính thành tiền theo giá thị trường của các tài sản quy định tại khoản 1 Điều 23 Nghị định này tại thời điểm giao kết hợp đồng bảo hiểm.\n2. Trường hợp không xác định được giá thị trường của tài sản thì số tiền bảo hiểm cháy, nổ bắt buộc do các bên thỏa thuận như sau:\na) Đối với các tài sản quy định tại điểm a khoản 1 Điều 23 Nghị định này: Số tiền bảo hiểm là giá trị tính thành tiền của tài sản theo giá trị còn lại hoặc giá trị thay thế của tài sản tại thời điểm giao kết hợp đồng bảo hiểm.\nb) Đối với các tài sản quy định tại điểm b khoản 1 Điều 23 Nghị định này: Số tiền bảo hiểm là giá trị tính thành tiền của tài sản căn cứ theo hóa đơn, chứng từ hợp lệ hoặc các tài liệu có liên quan.","y":"1. 화재·폭발 의무보험의 최저 보험가입금액은 보험계약 체결 시점에 이 시행령 제23조 제1항에 규정된 재산을 시장 가격에 따라 금전으로 환산한 가액이다.\n2. 재산의 시장 가격을 확정할 수 없는 경우 화재·폭발 의무보험의 보험가입금액은 당사자들이 다음과 같이 합의한다:\na) 이 시행령 제23조 제1항 a호에 규정된 재산의 경우: 보험가입금액은 보험계약 체결 시점에 재산의 잔존 가치 또는 대체 가치에 따라 재산을 금전으로 환산한 가액이다.\nb) 이 시행령 제23조 제1항 b호에 규정된 재산의 경우: 보험가입금액은 적법한 계산서, 증빙 또는 관련 자료에 근거하여 재산을 금전으로 환산한 가액이다.","o":[["Khoản 1 Điều 24 được sửa đổi, bổ sung bởi Điểm c Khoản 1 Điều 44 Nghị định số 105/2025/NĐ-CP","nd105-44"],["Điểm c khoản 1 Điều 44 được sửa đổi, bổ sung bởi khoản 4 Điều 28 Nghị định số 347/2026/NĐ-CP","nd347-28"]]},{"id":"nd67-25","d":"nd67","n":"25","t":"Phạm vi bảo hiểm và loại trừ trách nhiệm bảo hiểm","k":"보험 범위 및 보험 책임의 면책(제외)","c":"제3장 화재·폭발 의무보험 규정 · 제1절","x":"1. Phạm vi bảo hiểm:\nDoanh nghiệp bảo hiểm thực hiện trách nhiệm bồi thường bảo hiểm cho các thiệt hại xảy ra đối với đối tượng bảo hiểm quy định tại khoản 1 Điều 23 Nghị định này phát sinh từ rủi ro cháy, nổ, trừ các trường hợp quy định tại khoản 2, khoản 3 Điều này.\n2. Các trường hợp loại trừ trách nhiệm bảo hiểm đối với cơ sở có nguy hiểm về cháy, nổ theo quy định của pháp luật phòng cháy và chữa cháy (trừ cơ sở hạt nhân): Doanh nghiệp bảo hiểm không có trách nhiệm bồi thường bảo hiểm trong các trường hợp sau:\na) Động đất, núi lửa phun hoặc những biến động khác của thiên nhiên.\nb) Thiệt hại do những biến cố về chính trị, an ninh và trật tự an toàn xã hội gây ra.\nc) Tài sản bị đốt cháy, làm nổ theo quyết định của cơ quan nhà nước có thẩm quyền.\nd) Tài sản tự lên men hoặc tự tỏa nhiệt; tài sản chịu tác động của một quá trình xử lý có dùng nhiệt.\nđ) Sét đánh trực tiếp vào tài sản được bảo hiểm nhưng không gây cháy, nổ.\ne) Nguyên liệu vũ khí hạt nhân gây cháy, nổ.\ng) Máy móc, thiết bị điện hay các bộ phận của thiết bị điện bị thiệt hại do chịu tác động trực tiếp của việc chạy quá tải, quá áp lực, đoản mạch, tự đốt nóng, hồ quang điện, rò điện do bất kỳ nguyên nhân nào, kể cả do sét đánh.\nh) Thiệt hại do hành động cố ý gây cháy, nổ của người được bảo hiểm; do cố ý vi phạm các quy định về phòng cháy, chữa cháy và là nguyên nhân trực tiếp gây ra cháy, nổ.\ni) Thiệt hại đối với dữ liệu, phần mềm và các chương trình máy tính.\nk) Thiệt hại do đốt rừng, bụi cây, đồng cỏ, hoặc đốt cháy với mục đích làm sạch đồng ruộng, đất đai.\n3. Các trường hợp loại trừ trách nhiệm bảo hiểm đối với cơ sở hạt nhân: Doanh nghiệp bảo hiểm và bên mua bảo hiểm thỏa thuận về các trường hợp loại trừ trách nhiệm bảo hiểm trên cơ sở được doanh nghiệp nhận tái bảo hiểm chấp thuận.","y":"1. 보험 범위:\n보험회사는 이 시행령 제23조 제1항에 규정된 보험 대상에 발생한 손해로서 화재·폭발 위험에서 발생한 것에 대하여 보험금 지급 책임을 이행한다. 다만, 이 조 제2항, 제3항에 규정된 경우는 제외한다.\n2. 소방 법령의 규정에 따른 화재·폭발 위험 사업장(원자력 시설은 제외한다)에 대한 보험 책임의 면책 사유: 보험회사는 다음의 경우 보험금 지급 책임이 없다:\na) 지진, 화산 분화 또는 그 밖의 자연의 변동.\nb) 정치, 안보 및 사회 질서·안전에 관한 변고로 인한 손해.\nc) 권한 있는 국가기관의 결정에 따라 재산이 소각되거나 폭파된 경우.\nd) 재산이 자연 발효하거나 자연 발열한 경우; 재산이 열을 사용하는 처리 과정의 영향을 받은 경우.\nđ) 낙뢰가 보험에 든 재산을 직접 타격하였으나 화재·폭발을 일으키지 않은 경우.\ne) 핵무기 원료가 화재·폭발을 일으킨 경우.\ng) 기계, 전기 설비 또는 전기 설비의 부품이 과부하 운전, 과압, 단락, 자체 과열, 전기 아크, 누전의 직접적인 영향을 받아 손해를 입은 경우. 낙뢰로 인한 것을 포함하여 그 원인을 불문한다.\nh) 피보험자의 고의로 화재·폭발을 일으킨 행위로 인한 손해; 소방에 관한 규정을 고의로 위반하고 그것이 화재·폭발의 직접적인 원인이 된 경우의 손해.\ni) 데이터, 소프트웨어 및 컴퓨터 프로그램에 대한 손해.\nk) 산림, 덤불, 초지를 태우거나 논밭, 토지를 정리할 목적으로 불을 놓아 발생한 손해.\n3. 원자력 시설에 대한 보험 책임의 면책 사유: 보험회사와 보험계약자는 재보험을 인수하는 회사의 승낙을 기초로 보험 책임의 면책 사유에 관하여 합의한다.","o":[]},{"id":"nd67-26","d":"nd67","n":"26","t":"Mức phí bảo hiểm và mức khấu trừ bảo hiểm","k":"보험료 수준 및 자기부담금","c":"제3장 화재·폭발 의무보험 규정 · 제1절","x":"1. Đối với cơ sở có nguy hiểm về cháy, nổ (trừ cơ sở hạt nhân) có tổng số tiền bảo hiểm của các tài sản tại một địa điểm dưới 1.000 tỷ đồng: Mức phí bảo hiểm và mức khấu trừ bảo hiểm quy định tại khoản 1 Mục I Phụ lục II và khoản 1 Mục II Phụ lục II ban hành kèm theo Nghị định này.\nCăn cứ vào mức độ rủi ro của đối tượng bảo hiểm, doanh nghiệp bảo hiểm được điều chỉnh tăng hoặc giảm phí bảo hiểm tối đa 25% tính trên phí bảo hiểm .\nTrường hợp trong năm tài chính trước liền kề, đối tượng bảo hiểm là nguyên nhân trực tiếp dẫn đến số tiền chi bồi thường bảo hiểm gốc lớn hơn doanh thu phí bảo hiểm gốc của bảo hiểm cháy, nổ bắt buộc, trên cơ sở số liệu có xác nhận của chuyên gia tính toán của doanh nghiệp bảo hiểm và xác nhận của tổ chức kiểm toán độc lập, khi tái tục hợp đồng bảo hiểm, doanh nghiệp bảo hiểm và bên mua bảo hiểm có thể thỏa thuận mức phí bảo hiểm và mức khấu trừ bảo hiểm bảo đảm khả năng thanh toán của doanh nghiệp bảo hiểm.\n2. Đối với cơ sở có nguy hiểm về cháy, nổ có tổng số tiền bảo hiểm của các tài sản tại một địa điểm từ 1.000 tỷ đồng trở lên (trừ cơ sở hạt nhân):\nDoanh nghiệp bảo hiểm và bên mua bảo hiểm có thể thỏa thuận mức phí bảo hiểm và mức khấu trừ bảo hiểm trên cơ sở bằng chứng chứng minh doanh nghiệp, tổ chức bảo hiểm nước ngoài đứng đầu nhận tái bảo hiểm xác nhận. Doanh nghiệp, tổ chức bảo hiểm nước ngoài đứng đầu nhận tái bảo hiểm và doanh nghiệp, tổ chức bảo hiểm nước ngoài nhận tái bảo hiểm từ 10% tổng mức trách nhiệm của mỗi hợp đồng tái bảo hiểm phải đáp ứng quy định tại khoản 9 Điều 4 Nghị định này.\nTrong mọi trường hợp, mức phí bảo hiểm không được thấp hơn mức phí bảo hiểm tương ứng với 1.000 tỷ đồng nhân (x) 75% tỷ lệ phí bảo hiểm quy định tại khoản 1 Mục I Phụ lục II ban hành kèm theo Nghị định này.\n3. Đối với cơ sở hạt nhân: Doanh nghiệp bảo hiểm và bên mua bảo hiểm có thể thỏa thuận quy tắc, điều khoản, phí bảo hiểm và mức khấu trừ bảo hiểm trên cơ sở bằng chứng chứng minh doanh nghiệp, tổ chức bảo hiểm nước ngoài đứng đầu nhận tái bảo hiểm xác nhận nhận tái bảo hiểm theo đúng quy tắc, điều khoản, phí bảo hiểm và mức khấu trừ bảo hiểm mà doanh nghiệp bảo hiểm cung cấp cho bên mua bảo hiểm. Doanh nghiệp, tổ chức bảo hiểm nước ngoài đứng đầu nhận tái bảo hiểm và doanh nghiệp, tổ chức bảo hiểm nước ngoài nhận tái bảo hiểm từ 10% tổng mức trách nhiệm của mỗi hợp đồng tái bảo hiểm phải đáp ứng quy định tại khoản 9 Điều 4 Nghị định này.","y":"1. 한 소재지에 있는 재산의 보험가입금액 총액이 1.000 tỷ(십억) 동(1조 동) 미만인 화재·폭발 위험 사업장(원자력 시설은 제외한다)의 경우: 보험료 수준 및 자기부담금은 이 시행령에 첨부하여 공포된 부록 II 제I절 제1항 및 부록 II 제II절 제1항에 규정된다.\n보험 대상의 위험 정도에 근거하여 보험회사는 보험료를 기준으로 계산하여 최대 25%까지 보험료를 인상 또는 인하 조정할 수 있다.\n직전 회계연도에 보험 대상이 화재·폭발 의무보험의 원수 보험금 지급액이 원수 보험료 수입보다 커지게 한 직접적인 원인인 경우, 보험회사의 보험계리사의 확인 및 독립 감사 조직의 확인이 있는 수치를 기초로, 보험계약 갱신 시 보험회사와 보험계약자는 보험회사의 지급 능력을 보장하는 보험료 수준 및 자기부담금을 합의할 수 있다.\n2. 한 소재지에 있는 재산의 보험가입금액 총액이 1.000 tỷ(십억) 동(1조 동) 이상인 화재·폭발 위험 사업장(원자력 시설은 제외한다)의 경우:\n보험회사와 보험계약자는 재보험을 인수하는 주간(선도) 외국 보험회사·보험 조직이 확인하였음을 증명하는 증거를 기초로 보험료 수준 및 자기부담금을 합의할 수 있다. 재보험을 인수하는 주간(선도) 외국 보험회사·보험 조직 및 각 재보험계약의 총 책임 한도의 10% 이상의 재보험을 인수하는 외국 보험회사·보험 조직은 이 시행령 제4조 제9항의 규정을 충족하여야 한다.\n어떠한 경우에도 보험료 수준은 1.000 tỷ(십억) 동(1조 동)에 이 시행령에 첨부하여 공포된 부록 II 제I절 제1항에 규정된 보험료율의 75%를 곱한(x) 것에 상응하는 보험료 수준보다 낮아서는 안 된다.\n3. 원자력 시설의 경우: 보험회사와 보험계약자는 재보험을 인수하는 주간(선도) 외국 보험회사·보험 조직이 보험회사가 보험계약자에게 제공하는 약관, 조항, 보험료 및 자기부담금 그대로 재보험을 인수함을 확인하였음을 증명하는 증거를 기초로 약관, 조항, 보험료 및 자기부담금을 합의할 수 있다. 재보험을 인수하는 주간(선도) 외국 보험회사·보험 조직 및 각 재보험계약의 총 책임 한도의 10% 이상의 재보험을 인수하는 외국 보험회사·보험 조직은 이 시행령 제4조 제9항의 규정을 충족하여야 한다.","o":[["Cụm từ ''Căn cứ vào mức độ rủi ro của đối tượng bảo hiểm, doanh nghiệp bảo hiểm được điều chỉnh tăng hoặc giảm phí bảo hiểm tối đa 25% tính trên phí bảo hiểm'' bị bãi bỏ bởi Điểm d Khoản 1 Điều 44 Nghị định số 105/2025/NĐ-CP","nd105-44"],["Cụm từ ''Trong mọi trường hợp, mức phí bảo hiểm không được thấp hơn mức phí bảo hiểm tương ứng với 1.000 tỷ đồng nhân (x) 75% tỷ lệ phí bảo hiểm quy định tại khoản 1 Mục I Phụ lục II ban hành kèm theo Nghị định này.'' được thay thế bởi Điểm đ Khoản 1 Điều 44 Nghị định số 105/2025/NĐ-CP","nd105-44"]]},{"id":"nd67-27","d":"nd67","n":"27","t":"Giấy chứng nhận bảo hiểm","k":"보험증명서","c":"제3장 화재·폭발 의무보험 규정 · 제1절","x":"1. Doanh nghiệp bảo hiểm phải cấp Giấy chứng nhận bảo hiểm cháy, nổ bắt buộc cho bên mua bảo hiểm. Giấy chứng nhận bảo hiểm cháy, nổ bắt buộc do doanh nghiệp bảo hiểm chủ động thiết kế và phải bao gồm các nội dung sau đây:\na) Tên, địa chỉ, số điện thoại (nếu có) của bên mua bảo hiểm, người được bảo hiểm.\nb) Tên, địa chỉ, số điện thoại đường dây nóng của doanh nghiệp bảo hiểm.\nc) Tên cơ sở có nguy hiểm về cháy, nổ theo quy định của pháp luật phòng cháy và chữa cháy.\nd) Địa điểm của đối tượng bảo hiểm.\nđ) Tài sản được bảo hiểm.\ne) Số tiền bảo hiểm.\ng) Mức khấu trừ bảo hiểm.\nh) Thời hạn bảo hiểm.\ni) Tỷ lệ phí bảo hiểm, phí bảo hiểm.\nk) Ngày, tháng, năm cấp Giấy chứng nhận bảo hiểm.\nl) Mã số, mã vạch được đăng ký, quản lý và sử dụng theo quy định của pháp luật để lưu trữ, chuyển tải và truy xuất thông tin định danh doanh nghiệp bảo hiểm và định danh sản phẩm bảo hiểm cháy, nổ bắt buộc.\n2. Trường hợp cấp Giấy chứng nhận bảo hiểm điện tử, doanh nghiệp bảo hiểm phải tuân thủ các quy định của Luật Giao dịch điện tử và các văn bản hướng dẫn thi hành; Giấy chứng nhận bảo hiểm điện tử phải tuân thủ đầy đủ các quy định hiện hành và phản ánh đầy đủ các nội dung quy định tại khoản 1 Điều này.","y":"1. 보험회사는 보험계약자에게 화재·폭발 의무보험 증명서를 발급하여야 한다. 화재·폭발 의무보험 증명서는 보험회사가 자율적으로 설계하되 다음의 내용을 포함하여야 한다:\na) 보험계약자, 피보험자의 명칭, 주소, 전화번호(있는 경우).\nb) 보험회사의 명칭, 주소, 핫라인 전화번호.\nc) 소방 법령의 규정에 따른 화재·폭발 위험 사업장의 명칭.\nd) 보험 대상의 소재지.\nđ) 보험에 든 재산.\ne) 보험가입금액.\ng) 자기부담금.\nh) 보험 기간.\ni) 보험료율, 보험료.\nk) 보험증명서 발급 연월일.\nl) 보험회사 식별 정보 및 화재·폭발 의무보험 상품 식별 정보를 저장, 전달 및 조회하기 위하여 법령의 규정에 따라 등록, 관리 및 사용되는 코드 번호, 바코드.\n2. 전자 보험증명서를 발급하는 경우 보험회사는 「전자거래법」 및 그 시행 안내 문서의 규정을 준수하여야 한다; 전자 보험증명서는 현행 규정을 모두 준수하고 이 조 제1항에 규정된 내용을 모두 반영하여야 한다.","o":[]},{"id":"nd67-28","d":"nd67","n":"28","t":"Nguyên tắc bồi thường bảo hiểm","k":"보험금 지급 원칙","c":"제3장 화재·폭발 의무보험 규정 · 제1절","x":"Doanh nghiệp bảo hiểm thực hiện xem xét, giải quyết bồi thường bảo hiểm theo quy định pháp luật về kinh doanh bảo hiểm và theo nguyên tắc sau:\n1. Khi xảy ra tổn thất, bên mua bảo hiểm lập tức thông báo ngay cho doanh nghiệp bảo hiểm bằng các phương tiện thông tin liên lạc, sau đó trong thời hạn 14 ngày kể từ ngày xảy ra tổn thất đối với cơ sở có nguy hiểm về cháy, nổ phải thông báo bằng văn bản cho doanh nghiệp bảo hiểm.\n2. Số tiền bồi thường bảo hiểm đối với tài sản bị thiệt hại không vượt quá số tiền bảo hiểm của tài sản đó (đã được thỏa thuận và ghi trong hợp đồng bảo hiểm, Giấy chứng nhận bảo hiểm) trừ đi mức giảm trừ bảo hiểm quy định tại khoản 3 Điều này.\n3. Giảm trừ tối đa 20% số tiền bồi thường bảo hiểm trong trường hợp cơ sở có nguy hiểm về cháy, nổ không thực hiện đầy đủ, đúng thời hạn các kiến nghị tại\nbiên bản kiểm tra an toàn về phòng cháy, chữa cháy của cơ quan Công an có thẩm quyền, dẫn đến tăng thiệt hại khi xảy ra cháy, nổ.","y":"보험회사는 보험업에 관한 법령의 규정 및 다음의 원칙에 따라 보험금 지급을 심사, 처리한다:\n1. 손실이 발생한 때 보험계약자는 통신 수단으로 즉시 보험회사에 통지하고, 그 후 화재·폭발 위험 사업장에 손실이 발생한 날부터 14일 이내에 보험회사에 서면으로 통지하여야 한다.\n2. 손해를 입은 재산에 대한 보험금 지급액은 그 재산의 보험가입금액(합의되어 보험계약, 보험증명서에 기재된 것)에서 이 조 제3항에 규정된 보험 감액분을 뺀 금액을 초과하지 않는다.\n3. 다음 조서의 권고 사항을 화재·폭발 위험 사업장이 충분히, 기한 내에 이행하지 않아 화재·폭발 발생 시 손해가 증가한 경우 보험금 지급액의 최대 20%를 감액한다 —\n권한 있는 공안기관의 소방 안전 점검(검사) 조서.","o":[["Cụm từ ''biên bản kiểm tra an toàn về phòng cháy, chữa cháy'' bị thay thế bởi Điểm e Khoản 1 Điều 44 Nghị định số 105/2025/NĐ-CP","nd105-44"]]},{"id":"nd67-29","d":"nd67","n":"29","t":"Hồ sơ bồi thường bảo hiểm","k":"보험금 지급 서류","c":"제3장 화재·폭발 의무보험 규정 · 제1절","x":"Hồ sơ bồi thường bảo hiểm cháy, nổ bắt buộc bao gồm các tài liệu sau:\n1. Văn bản yêu cầu bồi thường của bên mua bảo hiểm.\n2. Tài liệu liên quan đến đối tượng bảo hiểm, bao gồm: Hợp đồng bảo hiểm, Giấy chứng nhận bảo hiểm.\n3.\nBiên bản kiểm tra an toàn về phòng cháy và chữa cháy của cơ quan Công an có thẩm quyền tại thời điểm gần nhất thời điểm xảy ra sự kiện bảo hiểm (bản sao).\n4. Biên bản giám định của doanh nghiệp bảo hiểm hoặc người được doanh nghiệp bảo hiểm ủy quyền.\n5. Văn bản kết luận hoặc thông báo về nguyên nhân vụ cháy, nổ của cơ quan có thẩm quyền (bản sao) hoặc các bằng chứng chứng minh nguyên nhân vụ cháy, nổ.\n6. Bản kê khai thiệt hại và các giấy tờ chứng minh thiệt hại.\nBên mua bảo hiểm có trách nhiệm thu thập và gửi doanh nghiệp bảo hiểm các tài liệu quy định tại khoản 1, khoản 2, khoản 3, khoản 5 và khoản 6 Điều này. Doanh nghiệp bảo hiểm có trách nhiệm thu thập tài liệu quy định tại khoản 4 Điều này.\nMỨC THU, CHẾ ĐỘ QUẢN LÝ, SỬ DỤNG NGUỒN THU TỪ BẢO HIỂM CHÁY, NỔ BẮT BUỘC CHO HOẠT ĐỘNG PHÒNG CHÁY VÀ CHỮA CHÁY","y":"화재·폭발 의무보험의 보험금 지급 서류는 다음의 자료를 포함한다:\n1. 보험계약자의 보험금 지급 청구서.\n2. 보험 대상과 관련된 자료. 다음을 포함한다: 보험계약, 보험증명서.\n3.\n보험사고 발생 시점과 가장 가까운 시점의 권한 있는 공안기관의 소방 안전 점검(검사) 조서(사본).\n4. 보험회사 또는 보험회사로부터 위임받은 자의 손해사정(감정) 조서.\n5. 권한 있는 기관의 화재·폭발 사고 원인에 관한 결론서 또는 통지서(사본) 또는 화재·폭발 사고 원인을 증명하는 증거.\n6. 손해 명세서 및 손해를 증명하는 서류.\n보험계약자는 이 조 제1항, 제2항, 제3항, 제5항 및 제6항에 규정된 자료를 수집하여 보험회사에 송부할 책임이 있다. 보험회사는 이 조 제4항에 규정된 자료를 수집할 책임이 있다.\n소방(화재예방·진압) 활동을 위한 화재·폭발 의무보험 수입의 징수 수준, 관리·사용 제도","o":[["Cụm từ ''biên bản kiểm tra an toàn về phòng cháy, chữa cháy'' bị thay thế bởi Điểm e Khoản 1 Điều 44 Nghị định số 105/2025/NĐ-CP","nd105-44"]]},{"id":"nd67-30","d":"nd67","n":"30","t":"Mức thu, nộp từ bảo hiểm cháy, nổ bắt buộc cho hoạt động phòng cháy và chữa cháy","k":"소방(화재예방·진압) 활동을 위한 화재·폭발 의무보험으로부터의 징수·납부 수준","c":"제3장 화재·폭발 의무보험 규정 · 제2절","x":"1. Mức thu từ doanh nghiệp bảo hiểm triển khai bảo hiểm cháy, nổ bắt buộc trong năm tài chính là 1% tổng số phí bảo hiểm cháy, nổ bắt buộc thực tế thu được của các hợp đồng bảo hiểm gốc trong năm tài chính trước liền kề.\n2. Hàng năm, doanh nghiệp bảo hiểm có trách nhiệm nộp số tiền quy định tại khoản 1 Điều này vào Tài khoản của Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ do Bộ Công an mở tại Kho bạc Nhà nước Trung ương theo thời hạn sau:\na) Trước ngày 30 tháng 6 hàng năm: Nộp 50% tổng số tiền quy định tại khoản 1 Điều này.\nb) Trước ngày 31 tháng 12 hàng năm: Nộp số tiền còn lại quy định tại khoản 1 Điều này.","y":"1. 회계연도에 화재·폭발 의무보험을 영위하는 보험회사로부터의 징수 수준은 직전 회계연도에 원수 보험계약에서 실제로 수수한 화재·폭발 의무보험 보험료 총액의 1%이다.\n2. 매년 보험회사는 이 조 제1항에 규정된 금액을 공안부가 중앙 국고에 개설한 소방·구조구난 경찰국의 계좌에 다음의 기한에 따라 납부할 책임이 있다:\na) 매년 6월 30일 전: 이 조 제1항에 규정된 금액 총액의 50%를 납부한다.\nb) 매년 12월 31일 전: 이 조 제1항에 규정된 나머지 금액을 납부한다.","o":[["Khoản 1 Điều 30 bị bãi bỏ bởi Điểm g Khoản 1 Điều 44 Nghị định số 105/2025/NĐ-CP","nd105-44"]]},{"id":"nd67-31","d":"nd67","n":"31","t":"Chế độ quản lý, sử dụng nguồn thu từ bảo hiểm cháy, nổ bắt buộc","k":"화재·폭발 의무보험 수입의 관리·사용 제도","c":"제3장 화재·폭발 의무보험 규정 · 제2절","x":"1. Việc quản lý, sử dụng nguồn thu từ bảo hiểm cháy, nổ bắt buộc phải bảo đảm minh bạch, đúng mục đích theo quy định tại Nghị định này và quy định pháp luật có liên quan.\n2. Nguồn thu từ bảo hiểm cháy, nổ bắt buộc cho hoạt động phòng cháy và chữa cháy được sử dụng như sau:\na) Chi hỗ trợ mua sắm trang bị phương tiện, thiết bị phòng cháy, chữa cháy cho lực lượng Cảnh sát phòng cháy và chữa cháy: Tối đa không quá 65% số tiền thực tế thu được từ bảo hiểm cháy, nổ bắt buộc của các doanh nghiệp bảo hiểm trong năm tài chính. Việc mua sắm trang thiết bị phương tiện, thiết bị phòng cháy, chữa cháy thực hiện theo quy định của pháp luật về đấu thầu.\nb) Chi hỗ trợ tuyên truyền, phổ biến pháp luật, kiến thức phòng cháy, chữa cháy và bảo hiểm cháy, nổ bắt buộc: Tối đa không quá 15% số tiền thực tế thu được từ bảo hiểm cháy, nổ bắt buộc của các doanh nghiệp bảo hiểm trong năm tài chính. Nội dung và mức chi tuyên truyền, phổ biến pháp luật, kiến thức thực hiện theo quy định của pháp luật về quản lý, sử dụng và quyết toán kinh phí bảo đảm cho công tác phổ biến, giáo dục pháp luật\nc) Chi hỗ trợ lực lượng Cảnh sát phòng cháy và chữa cháy trong các hoạt động điều tra nguyên nhân vụ cháy; bồi dưỡng nghiệp vụ, kiểm tra an toàn về phòng cháy và chữa cháy; giám sát việc tham gia bảo hiểm cháy, nổ bắt buộc của các cơ sở có nguy hiểm về cháy, nổ: Tối đa không quá 15% số tiền thực tế thu được từ bảo hiểm cháy, nổ bắt buộc của các doanh nghiệp bảo hiểm trong năm tài chính. Nội dung chi, mức chi thực hiện theo chế độ chi tiêu tài chính hiện hành.\nd) Chi hỗ trợ khen thưởng thành tích của tổ chức, cá nhân trực tiếp tham gia, phối hợp trong công tác phòng cháy, chữa cháy: Tối đa không quá 5% số tiền thực tế thu được từ bảo hiểm cháy, nổ bắt buộc của các doanh nghiệp bảo hiểm trong năm tài chính. Trong đó:\nChi khen thưởng thường xuyên: Thực hiện theo quy định của pháp luật về thi đua, khen thưởng.\nChi khen thưởng đột xuất cho các tổ chức, cá nhân trực tiếp tham gia phòng cháy, chữa cháy: Bộ trưởng Bộ Công an căn cứ thành tích của các tổ chức, cá nhân, nguồn thu từ bảo hiểm cháy, nổ bắt buộc quyết định những trường hợp cụ thể được khen thưởng và mức khen thưởng đột xuất.\n3. Hàng năm, cùng thời điểm lập dự toán ngân sách nhà nước hàng năm, Bộ Công an lập dự toán thu từ phí bảo hiểm cháy, nổ bắt buộc, tổng hợp chung vào dự toán của Bộ Công an, gửi Bộ Tài chính theo quy định của Luật Ngân sách nhà nước và các văn bản hướng dẫn để tổng hợp, theo dõi.\n4. Việc quản lý và sử dụng kinh phí theo đúng quy định về chế độ, định mức, tiêu chuẩn hiện hành. Bộ Công an có trách nhiệm xét duyệt, thẩm định quyết toán năm đối với nguồn kinh phí thu từ bảo hiểm cháy, nổ bắt buộc cho các đơn vị trực thuộc; tổng hợp và lập báo cáo quyết toán năm vào nguồn kinh phí khác được để lại, gửi Bộ Tài chính cùng với thời điểm nộp báo cáo quyết toán ngân sách nhà nước để tổng hợp, theo dõi.\n5. Số tiền thực tế thu được từ bảo hiểm cháy, nổ bắt buộc cho hoạt động phòng cháy, chữa cháy cuối năm chưa sử dụng hết cho từng nội dung quy định tại khoản 2 Điều này được chuyển sang năm sau để tiếp tục sử dụng theo quy định của pháp luật. Sau 5 năm, trường hợp kinh phí thu được từ bảo hiểm cháy, nổ bắt buộc không sử dụng hết, Bộ Công an chủ trì, phối hợp với Bộ Tài chính rà soát, đánh giá nguồn thu từ bảo hiểm cháy, nổ bắt buộc, báo cáo Chính phủ điều chỉnh tỷ lệ trích nộp cho phù hợp.\nHOẠT ĐỘNG ĐẦU TƯ XÂY DỰNG\nĐIỀU KIỆN BẢO HIỂM, MỨC PHÍ BẢO HIỂM, SỐ TIỀN BẢO HIỂM TỐI THIỂU ĐỐI VỚI BẢO HIỂM BẮT BUỘC CÔNG TRÌNH TRONG THỜI GIAN XÂY DỰNG","y":"1. 화재·폭발 의무보험 수입의 관리·사용은 이 시행령의 규정 및 관련 법령의 규정에 따라 투명성과 목적 부합성을 보장하여야 한다.\n2. 소방(화재예방·진압) 활동을 위한 화재·폭발 의무보험 수입은 다음과 같이 사용한다:\na) 소방경찰을 위한 소방 장비·기기의 구매·비치 지원 지출: 회계연도에 보험회사들의 화재·폭발 의무보험으로부터 실제로 징수한 금액의 최대 65%를 초과하지 않는다. 소방 장비·기기의 구매는 입찰에 관한 법령의 규정에 따라 실시한다.\nb) 소방 및 화재·폭발 의무보험에 관한 법령·지식의 홍보, 보급 지원 지출: 회계연도에 보험회사들의 화재·폭발 의무보험으로부터 실제로 징수한 금액의 최대 15%를 초과하지 않는다. 법령·지식의 홍보, 보급 지출의 내용 및 수준은 법령 보급·교육 업무를 보장하는 경비의 관리, 사용 및 결산에 관한 법령의 규정에 따라 실시한다\nc) 화재 사고 원인 조사; 직무 교육, 소방 안전 점검(검사); 화재·폭발 위험 사업장의 화재·폭발 의무보험 가입 감독 활동에서 소방경찰을 지원하는 지출: 회계연도에 보험회사들의 화재·폭발 의무보험으로부터 실제로 징수한 금액의 최대 15%를 초과하지 않는다. 지출 내용, 지출 수준은 현행 재정 지출 제도에 따라 실시한다.\nd) 소방 업무에 직접 참여, 협조한 조직, 개인의 공적 포상 지원 지출: 회계연도에 보험회사들의 화재·폭발 의무보험으로부터 실제로 징수한 금액의 최대 5%를 초과하지 않는다. 그중:\n정기 포상 지출: 경쟁·포상에 관한 법령의 규정에 따라 실시한다.\n소방(화재예방·진압)에 직접 참여한 조직, 개인에 대한 수시 포상 지출: 공안부 장관은 조직, 개인의 공적, 화재·폭발 의무보험 수입에 근거하여 포상을 받는 구체적인 경우 및 수시 포상 수준을 결정한다.\n3. 매년, 연간 국가예산 추계 편성 시점과 같은 시점에 공안부는 화재·폭발 의무보험 보험료로부터의 수입 추계를 편성하고 공안부의 추계에 통합하여, 「국가예산법」 및 그 안내 문서의 규정에 따라 재무부에 송부하여 종합, 추적하도록 한다.\n4. 경비의 관리 및 사용은 현행 제도, 정액 기준, 표준에 관한 규정에 맞게 한다. 공안부는 소속 단위에 대하여 화재·폭발 의무보험으로부터 징수한 경비 재원의 연간 결산을 심의·승인, 심사할 책임이 있다; 유보가 허용된 그 밖의 경비 재원에 포함하여 연간 결산 보고서를 종합·작성하고, 국가예산 결산 보고서 제출 시점과 함께 재무부에 송부하여 종합, 추적하도록 한다.\n5. 소방(화재예방·진압) 활동을 위한 화재·폭발 의무보험으로부터 실제로 징수한 금액 중 이 조 제2항에 규정된 각 내용별로 연말까지 다 사용하지 못한 금액은 법령의 규정에 따라 계속 사용하기 위하여 다음 연도로 이월한다. 5년 후 화재·폭발 의무보험으로부터 징수한 경비를 다 사용하지 못한 경우, 공안부는 주관하여 재무부와 협조하여 화재·폭발 의무보험 수입을 검토, 평가하고 정부에 보고하여 납부 공제 비율을 적합하게 조정하도록 한다.\n건설투자 활동\n건설 기간 중 공사 의무보험에 대한 보험 조건, 보험료 수준, 최저 보험가입금액","o":[["Khoản 2 Điều 31 bị bãi bỏ bởi Điểm g Khoản 1 Điều 44 Nghị định số 105/2025/NĐ-CP","nd105-44"],["Cụm từ ''HOẠT ĐỘNG ĐẦU TƯ XÂY DỰNG'' bị thay thế bởi Khoản 2 Điều 9 Nghị định số 220/2026/NĐ-CP",""]]},{"id":"nd
