  .card .vi{font-size:12px;color:var(--soft)}

  mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
  .back{font:inherit;font-size:14px;background:none;border:none;color:var(--navy);cursor:pointer;padding:8px 0;font-weight:700}

  .art .where{font-size:12px;color:var(--soft)}
  .notes{background:var(--amber-s);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:13px}
  .notes div{margin:3px 0;overflow-wrap:anywhere}
  .notes button{font:inherit;font-size:12px;font-weight:700;color:var(--navy);background:#fff;border:1px solid var(--navy);border-radius:6px;padding:1px 8px;margin-left:4px;cursor:pointer}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
  .ln{padding:5px 0;border-top:1px solid #f0f2f5;overflow-wrap:anywhere}
  .ln .v{display:none;font-size:13px;color:var(--soft);margin-top:2px}
  .showvi .ln .v{display:block}
  .src{font-size:12px;color:var(--soft);margin-top:14px;overflow-wrap:anywhere}
  a{color:var(--navy)}
  .doc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px}
  .doc b{display:block}
  .doc small{color:var(--soft);display:block}
  .warn{font-size:12px;color:var(--soft);background:#fff;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:16px}
  .refs li{font-size:13px;margin:3px 0 3px 18px}

23/TT-BCA)","QCVN 02:2020/BCA — 소방 펌프장","TCVN 3890:2023 — 건축물·시설용 소방 장비의 설치·배치","TCVN 7336:2021 — 물·포 자동 소화설비 설계·설치 요건","TCVN 7568-14:2025 — 화재경보 설비의 설계·설치","TCVN 13456:2022 — 비상조명 및 피난 유도 설비 설계·설치","TCVN 2622:1995 — 건축물·시설의 방화 설계 요건","공안부 시행규칙 37/2025/TT-BCA — 공안 인민의 소방·구조구난 업무","재무부 시행규칙 70/2025/TT-BTC — 소방 설계 심사 수수료","형법전(Bộ luật Hình sự) 제313조 — 소방 규정 위반죄 (형사책임, 본 앱 미수록)"],"items":[{"id":"law-1","d":"law","n":"1","t":"Phạm vi điều chỉnh","k":"적용 범위","c":"제1장 총칙","x":"Luật này quy định về phòng cháy, chữa cháy, cứu nạn, cứu hộ; lực lượng, phương tiện, bảo đảm điều kiện hoạt động và quyền, nghĩa vụ, trách nhiệm của cơ quan, tổ chức, hộ gia đình, cá nhân có liên quan trong hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.","y":"이 법은 소방 및 구조·구난, 그 인력, 장비·설비, 활동 여건의 보장과 소방 및 구조·구난 활동에 관련된 기관, 조직, 가구, 개인의 권리, 의무, 책임에 관하여 규정한다.","o":[]},{"id":"law-2","d":"law","n":"2","t":"Giải thích từ ngữ","k":"용어의 정의","c":"제1장 총칙","x":"Trong Luật này, các từ ngữ dưới đây được hiểu như sau:\n1. Cháy là phản ứng hóa học có tỏa nhiệt, phát ra ánh sáng hoặc khói, gây thiệt hại hoặc có khả năng gây thiệt hại về người, tài sản của cơ quan, tổ chức, cá nhân, ảnh hưởng đến kinh tế, môi trường, an ninh, trật tự.\n2. Phòng cháy là tổng hợp các hoạt động, biện pháp, giải pháp để hạn chế, loại trừ nguyên nhân, điều kiện, nguy cơ xảy ra cháy nhằm bảo đảm an toàn, giảm thiểu thiệt hại do cháy gây ra.\n3. Chữa cháy là tổng hợp các hoạt động chống cháy lan, dập tắt đám cháy và các hoạt động khác để giảm thiểu thiệt hại do cháy gây ra.\n4. Tai nạn, sự cố là tình huống quy định tại điểm b khoản 1 Điều 32 của Luật này gây thiệt hại hoặc có khả năng gây thiệt hại về người, tài sản của cơ quan, tổ chức, cá nhân cần phải cứu nạn, cứu hộ.\n5. Cứu nạn là hoạt động cứu người thoát khỏi nguy hiểm đang đe dọa đến tính mạng, sức khỏe trong các vụ cháy, tai nạn, sự cố và hoạt động tìm kiếm nạn nhân.\n6. Cứu hộ là hoạt động cứu phương tiện, tài sản thoát khỏi nguy hiểm trong các vụ cháy, tai nạn, sự cố.\n7. Cơ sở thuộc diện quản lý về phòng cháy, chữa cháy (sau đây gọi là cơ sở) là nhà, công trình, địa điểm được sử dụng để ở, sản xuất, kinh doanh, hoạt động thương mại, làm việc hoặc mục đích khác, được xây dựng, hoạt động theo quy định của pháp luật, thuộc danh mục do Chính phủ quy định. Trong một cơ quan, tổ chức có thể có một hoặc nhiều cơ sở; trong một cơ sở có thể có một hoặc nhiều cơ quan, tổ chức.\n8. Cơ sở có nguy hiểm về cháy, nổ là cơ sở có nguy cơ cháy, nổ cao thuộc danh mục do Chính phủ quy định.\n9. Hàng hóa nguy hiểm về cháy, nổ là hàng hóa có chứa các chất, vật phẩm có nguy cơ cháy, nổ ở dạng khí, dạng lỏng hoặc dạng rắn mà khi quản lý, vận chuyển, sử dụng có khả năng gây cháy, nổ, làm nguy hại đến tính mạng, sức khỏe con người, gây thiệt hại về tài sản, ảnh hưởng đến môi trường, an ninh, trật tự, thuộc danh mục do Chính phủ quy định.\n10. Phương tiện giao thông có yêu cầu về bảo đảm an toàn phòng cháy và chữa cháy (sau đây gọi là phương tiện giao thông) là phương tiện giao thông cơ giới đường bộ, phương tiện giao thông đường sắt, phương tiện thủy nội địa, tàu biển được sản xuất, lắp ráp, đóng mới, hoán cải để vận tải hành khách, hàng hóa nguy hiểm về cháy, nổ; trường hợp là phương tiện giao thông cơ giới đường bộ vận tải hành khách thì phải trên 08 chỗ (không kể chỗ của người lái xe).\n11. Người đứng đầu cơ sở là người chịu trách nhiệm trước pháp luật trong tổ chức thực hiện, duy trì điều kiện an toàn về phòng cháy, chữa cháy, cứu nạn, cứu hộ tại cơ sở, bao gồm: người đại diện theo pháp luật của cơ sở hoặc người được giao trực tiếp quản lý cơ sở; chủ hộ gia đình trực tiếp sử dụng nhà ở đối với nhà ở là cơ sở thuộc trường hợp quy định tại khoản 7 Điều này.\n12. Lực lượng dân phòng là lực lượng do chính quyền địa phương thành lập để thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ ở thôn, làng, ấp, bản, buôn, bon, phum, sóc (sau đây gọi chung là thôn), tổ dân phố, khu phố, khối phố, khóm, tiểu khu (sau đây gọi chung là tổ dân phố).\n13. Lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở là lực lượng kiêm nhiệm do người đứng đầu cơ sở thành lập để thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ tại cơ sở.\n14. Lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành là lực lượng chuyên trách hoặc kiêm nhiệm do người đứng đầu cơ sở thành lập để thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ tại một số cơ sở có nguy hiểm về cháy, nổ.\n15. Khu vực chữa cháy là khu vực được giới hạn trong một phạm vi nhất định, ở đó diễn ra các hoạt động chữa cháy của các lực lượng chức năng theo quy định của pháp luật.\n16. Khu vực cứu nạn, cứu hộ là khu vực được giới hạn trong một phạm vi nhất định, ở đó diễn ra các hoạt động cứu nạn, cứu hộ của các lực lượng chức năng theo quy định của pháp luật.\n17. Thẩm định thiết kế về phòng cháy và chữa cháy là việc xem xét, đánh giá sự tuân thủ các quy định của pháp luật, tiêu chuẩn, quy chuẩn kỹ thuật được áp dụng đối với thiết kế về phòng cháy và chữa cháy trong dự án đầu tư xây dựng công trình, công trình, phương tiện giao thông.\n18. Nghiệm thu về phòng cháy và chữa cháy là việc kiểm tra, đối chiếu thực tế thi công dự án đầu tư xây dựng công trình, công trình, phương tiện giao thông với hồ sơ thiết kế đã được thẩm định.\n19. Kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy là việc cơ quan quản lý chuyên ngành có thẩm quyền kiểm tra kết quả nghiệm thu về phòng cháy và chữa cháy đối với dự án đầu tư xây dựng công trình, công trình, phương tiện giao thông.\n20. Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ là cơ sở dữ liệu chuyên ngành để phục vụ quản lý nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ và các mục đích khác; được kết nối, chia sẻ với Cơ sở dữ liệu tổng hợp quốc gia và các cơ sở dữ liệu khác có liên quan.\n21. Cơ quan quản lý chuyên ngành là cơ quan thực hiện chức năng quản lý nhà nước về một lĩnh vực nhất định liên quan đến phòng cháy, chữa cháy, bao gồm: cơ quan Công an, cơ quan chuyên môn về xây dựng và cơ quan đăng kiểm.\n22. Hạ tầng phòng cháy và chữa cháy bao gồm mạng lưới trụ sở, doanh trại, công trình, hệ thống cung cấp nước, hệ thống giao thông và hệ thống thông tin liên lạc phục vụ phòng cháy và chữa cháy.","y":"이 법에서 아래의 용어는 다음과 같이 이해한다:\n1. 화재란 열을 내고 빛 또는 연기를 발생시키는 화학반응으로서, 기관, 조직, 개인의 인명, 재산에 피해를 주거나 피해를 줄 우려가 있고 경제, 환경, 안보, 질서에 영향을 미치는 것을 말한다.\n2. 화재예방이란 안전을 보장하고 화재로 인한 피해를 최소화하기 위하여 화재 발생의 원인, 조건, 위험을 제한·제거하는 활동, 조치, 해결책의 총체를 말한다.\n3. 화재진압이란 연소확대 방지, 화재의 소화 활동 및 화재로 인한 피해를 최소화하기 위한 그 밖의 활동의 총체를 말한다.\n4. 사고·재난이란 이 법 제32조 제1항 b호에 규정된 상황으로서 기관, 조직, 개인의 인명, 재산에 피해를 주거나 피해를 줄 우려가 있어 구조·구난이 필요한 것을 말한다.\n5. 구조란 화재, 사고·재난에서 생명, 건강을 위협하고 있는 위험으로부터 사람을 구하는 활동과 피해자를 수색하는 활동을 말한다.\n6. 구난이란 화재, 사고·재난에서 위험으로부터 수단(차량 등), 재산을 구하는 활동을 말한다.\n7. 소방 관리 대상 사업장(이하 “사업장”이라 한다)이란 거주, 생산, 영업, 상업 활동, 근무 또는 그 밖의 목적으로 사용되는 주택, 건축물, 장소로서 법률의 규정에 따라 건설·운영되고 정부가 규정하는 목록에 속하는 것을 말한다. 하나의 기관, 조직 안에 하나 또는 여러 개의 사업장이 있을 수 있으며, 하나의 사업장 안에 하나 또는 여러 개의 기관, 조직이 있을 수 있다.\n8. 화재·폭발 위험 사업장이란 정부가 규정하는 목록에 속하는 화재·폭발 위험이 높은 사업장을 말한다.\n9. 화재·폭발 위험 화물이란 기체, 액체 또는 고체 형태의 화재·폭발 위험이 있는 물질, 물품을 함유한 화물로서 관리, 운송, 사용 시 화재·폭발을 일으켜 사람의 생명, 건강에 위해를 가하고 재산에 피해를 주며 환경, 안보, 질서에 영향을 미칠 우려가 있고 정부가 규정하는 목록에 속하는 것을 말한다.\n10. 소방 안전 보장이 요구되는 교통수단(이하 “교통수단”이라 한다)이란 여객, 화재·폭발 위험 화물을 운송하기 위하여 생산, 조립, 신조, 개조되는 도로 자동차 교통수단, 철도 교통수단, 내수로 수단, 해상 선박을 말한다. 여객을 운송하는 도로 자동차 교통수단인 경우에는 08석 초과(운전자의 좌석은 제외한다)이어야 한다.\n11. 사업장 대표자란 사업장에서 소방 및 구조·구난에 관한 안전 조건의 실시·유지를 조직하는 데 있어 법 앞에 책임을 지는 사람으로서, 사업장의 법정대리인 또는 사업장을 직접 관리하도록 위임받은 사람, 그리고 주택이 이 조 제7항에 규정된 경우에 해당하는 사업장인 때에는 그 주택을 직접 사용하는 가구주를 포함한다.\n12. 민방위 소방대란 촌(thôn), 마을(làng), 압(ấp), 반(bản), 부온(buôn), 본(bon), 품(phum), 속(sóc)(이하 “촌”이라 통칭한다), 주민조(tổ dân phố), 구역(khu phố), 블록(khối phố), 콤(khóm), 소구역(tiểu khu)(이하 “주민조”라 통칭한다)에서 소방 및 구조·구난 임무를 수행하기 위하여 지방 당국이 설립하는 인력을 말한다.\n13. 사업장 자체 소방대(사업장 소방 및 구조·구난대)란 사업장에서 소방 및 구조·구난 임무를 수행하기 위하여 사업장 대표자가 설립하는 겸임 인력을 말한다.\n14. 전문 소방대(전문 소방 및 구조·구난대)란 일부 화재·폭발 위험 사업장에서 소방 및 구조·구난 임무를 수행하기 위하여 사업장 대표자가 설립하는 전담 또는 겸임 인력을 말한다.\n15. 화재진압 구역이란 일정한 범위로 한정된 구역으로서 그곳에서 법률의 규정에 따라 직능 기관(관계 인력)의 화재진압 활동이 이루어지는 구역을 말한다.\n16. 구조·구난 구역이란 일정한 범위로 한정된 구역으로서 그곳에서 법률의 규정에 따라 직능 기관(관계 인력)의 구조·구난 활동이 이루어지는 구역을 말한다.\n17. 소방 설계 심사란 건축물 건설투자사업, 건축물, 교통수단의 소방 설계에 대하여 적용되는 법률의 규정, 기술 표준·기술 규정의 준수 여부를 검토·평가하는 것을 말한다.\n18. 소방 준공검사(인수검사)란 건축물 건설투자사업, 건축물, 교통수단의 실제 시공 상태를 심사받은 설계 서류와 점검·대조하는 것을 말한다.\n19. 소방 준공검사(인수검사) 확인이란 권한 있는 전문 분야 관리기관이 건축물 건설투자사업, 건축물, 교통수단에 대한 소방 준공검사(인수검사) 결과를 점검하는 것을 말한다.\n20. 소방 및 구조·구난 데이터베이스란 소방 및 구조·구난에 관한 국가관리와 그 밖의 목적에 이바지하기 위한 전문 분야 데이터베이스로서, 국가 종합 데이터베이스 및 그 밖의 관련 데이터베이스와 연결·공유된다.\n21. 전문 분야 관리기관이란 소방과 관련된 일정 분야에 대한 국가관리 기능을 수행하는 기관으로서 공안기관, 건설 전문기관 및 등록검사기관을 포함한다.\n22. 소방 인프라는 소방에 이바지하는 청사, 병영, 건축물(시설)의 망, 급수 시스템, 교통 시스템 및 정보통신 시스템을 포함한다.","o":[]},{"id":"law-3","d":"law","n":"3","t":"Áp dụng pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ","k":"소방 및 구조·구난에 관한 법률의 적용","c":"제1장 총칙","x":"1. Hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ trên lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam thực hiện theo quy định của Luật này và quy định của pháp luật có liên quan.\n2. Hoạt động phòng cháy và chữa cháy rừng, trách nhiệm phòng cháy và chữa cháy rừng thực hiện theo quy định của pháp luật về lâm nghiệp.\n3. Trường hợp sự cố, thảm họa, thiên tai, dịch bệnh đã được ban bố tình trạng khẩn cấp, ban bố cấp độ phòng thủ dân sự thì hoạt động cứu nạn, cứu hộ thực hiện theo quy định của pháp luật về tình trạng khẩn cấp, pháp luật về phòng thủ dân sự, quy định của Luật này và quy định khác của pháp luật có liên quan.","y":"1. 베트남사회주의공화국 영토에서의 소방 및 구조·구난 활동은 이 법의 규정과 관련 법률의 규정에 따라 실시한다.\n2. 산림 소방(산불 예방·진압) 활동, 산림 소방 책임은 임업에 관한 법률의 규정에 따라 실시한다.\n3. 사고, 재난, 자연재해, 전염병으로 비상사태가 선포되거나 민방위 단계가 선포된 경우에는 구조·구난 활동은 비상사태에 관한 법률, 민방위에 관한 법률, 이 법의 규정 및 그 밖의 관련 법률의 규정에 따라 실시한다.","o":[]},{"id":"law-4","d":"law","n":"4","t":"Chính sách của Nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난에 관한 국가의 정책","c":"제1장 총칙","x":"1. Bảo đảm ngân sách nhà nước, cơ sở, vật chất, phương tiện, thiết bị hiện đại, nguồn nhân lực, chế độ, chính sách, các điều kiện hoạt động cho lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ; xây dựng lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ chính quy, tinh nhuệ, hiện đại, đáp ứng yêu cầu phòng cháy, chữa cháy, cứu nạn, cứu hộ trong mọi tình huống.\n2. Huy động, sử dụng các nguồn lực cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ. Đầu tư, xây dựng hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy bảo đảm kết nối, chia sẻ dữ liệu tại những nơi bố trí đơn vị Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ.\n3. Đào tạo, bồi dưỡng, bảo đảm nguồn nhân lực trực tiếp thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ và nguồn nhân lực thực hiện thẩm định thiết kế, kiểm tra công tác nghiệm thu, kiểm tra về phòng cháy và chữa cháy.\n4. Bố trí lực lượng, phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ phù hợp với từng địa bàn cơ sở; khuyến khích cơ quan, tổ chức, cá nhân xây dựng, tham gia, duy trì các mô hình an toàn về phòng cháy, chữa cháy, cứu nạn, cứu hộ tại cộng đồng.\n5. Khuyến khích, tạo điều kiện để cơ quan, tổ chức, cá nhân nghiên cứu, ứng dụng khoa học và chuyển giao công nghệ trong hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ, đầu tư, xây dựng, chuyển giao hệ thống, phương tiện, thiết bị phục vụ hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n6. Cơ quan, tổ chức, cá nhân tham gia phối hợp, cộng tác, hỗ trợ, giúp đỡ cơ quan nhà nước thực hiện công tác phòng cháy, chữa cháy, cứu nạn, cứu hộ được hưởng chế độ, chính sách theo quy định của pháp luật căn cứ vào tính chất, mức độ đóng góp.","y":"1. 소방경찰(소방·구조구난 경찰)을 위한 국가예산, 시설, 물자, 현대적인 장비·설비, 인적 자원, 제도, 정책, 활동 여건을 보장한다. 모든 상황에서 소방 및 구조·구난의 요구에 부응하는 정규화되고 정예화되며 현대적인 소방경찰(소방·구조구난 경찰)을 건설한다.\n2. 소방 및 구조·구난 활동을 위한 각종 자원을 동원·사용한다. 소방경찰(소방·구조구난 경찰) 부대가 배치된 곳에서 데이터의 연결·공유를 보장하는 소방 및 구조·구난 데이터베이스 시스템과 화재 신호 전송 시스템을 투자·구축한다.\n3. 소방 및 구조·구난 임무를 직접 수행하는 인적 자원과 소방 설계 심사, 소방 준공검사(인수검사) 확인, 소방 점검(검사)을 수행하는 인적 자원을 양성·교육하고 보장한다.\n4. 각 기초 지역에 적합하게 소방 및 구조·구난 인력, 장비·설비를 배치한다. 기관, 조직, 개인이 지역사회에서 소방 및 구조·구난 안전 모델을 구축하고 그에 참여하며 이를 유지하도록 장려한다.\n5. 기관, 조직, 개인이 소방 및 구조·구난 활동에서 과학을 연구·응용하고 기술을 이전하며, 소방 및 구조·구난 활동에 이바지하는 시스템, 장비·설비를 투자, 구축, 이전하도록 장려하고 여건을 조성한다.\n6. 국가기관의 소방 및 구조·구난 업무 수행에 협조, 협력, 지원, 조력하는 기관, 조직, 개인은 기여의 성격, 정도에 따라 법률의 규정에 따른 제도, 정책의 혜택을 받는다.","o":[]},{"id":"law-5","d":"law","n":"5","t":"Nguyên tắc phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난의 원칙","c":"제1장 총칙","x":"1. Tuân thủ Hiến pháp, pháp luật Việt Nam và điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên. Trường hợp giữa Việt Nam và nước ngoài chưa có điều ước quốc tế thì hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ được thực hiện trên nguyên tắc có đi có lại hoặc yêu cầu đối ngoại nhưng không trái pháp luật Việt Nam, phù hợp với pháp luật và tập quán quốc tế.\n2. Huy động sức mạnh tổng hợp của toàn dân tham gia hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ; phát huy vai trò nòng cốt của lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ.\n3. Chủ động phòng ngừa, lấy phòng ngừa là chính; kịp thời phát hiện sơ hở, thiếu sót về phòng cháy, chữa cháy và có biện pháp khắc phục; xác định phòng cháy, phòng ngừa tai nạn, sự cố là nhiệm vụ thường xuyên.\n4. Chuẩn bị sẵn sàng lực lượng, phương tiện, phương án và các điều kiện cần thiết để kịp thời chữa cháy, cứu nạn, cứu hộ.\n5. Thống nhất chỉ huy, điều hành, phát huy vai trò của lực lượng, phương tiện, hậu cần tại chỗ khi xảy ra cháy, tai nạn, sự cố; ưu tiên cứu người, cứu tài sản; mọi nguồn nước, chất chữa cháy phải được ưu tiên sử dụng cho chữa cháy.\n6. Ứng dụng khoa học và công nghệ hiện đại trong hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n7. Mọi hành vi vi phạm pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ phải được phát hiện, ngăn chặn kịp thời và xử lý nghiêm minh theo quy định của pháp luật.\n8. Bảo đảm tính nhân đạo, công bằng, bình đẳng giới trong hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.","y":"1. 헌법, 베트남 법률 및 베트남사회주의공화국이 당사국인 국제조약을 준수한다. 베트남과 외국 사이에 아직 국제조약이 없는 경우에는 소방 및 구조·구난 활동은 상호주의 원칙 또는 대외적 요구에 따라 실시하되 베트남 법률에 위배되지 아니하고 국제법 및 국제관례에 부합하여야 한다.\n2. 전 국민의 종합적인 힘을 동원하여 소방 및 구조·구난 활동에 참여하게 한다. 소방 및 구조·구난 인력의 중추적 역할을 발휘하게 한다.\n3. 능동적으로 예방하고 예방을 위주로 한다. 소방에 관한 허점, 미비점을 적시에 발견하고 시정 조치를 한다. 화재예방, 사고·재난 예방을 상시적인 임무로 정한다.\n4. 적시에 화재진압, 구조·구난을 할 수 있도록 인력, 장비·설비, 계획(방안) 및 필요한 여건을 준비하여 갖춘다.\n5. 화재, 사고·재난이 발생한 때에는 지휘·운영을 통일하고 현장의 인력, 장비·설비, 후방지원의 역할을 발휘하게 한다. 인명 구조, 재산 구조를 우선한다. 모든 수원(물), 소화약제는 화재진압에 우선적으로 사용되어야 한다.\n6. 소방 및 구조·구난 활동에 현대적인 과학과 기술을 응용한다.\n7. 소방 및 구조·구난에 관한 법률을 위반하는 모든 행위는 적시에 발견·저지되고 법률의 규정에 따라 엄정하게 처리되어야 한다.\n8. 소방 및 구조·구난 활동에서 인도주의, 공정성, 성평등을 보장한다.","o":[]},{"id":"law-6","d":"law","n":"6","t":"Báo cháy, báo tình huống cứu nạn, cứu hộ","k":"화재 신고, 구조·구난 상황 신고","c":"제1장 총칙","x":"1. Người phát hiện cháy, tình huống cứu nạn, cứu hộ thì báo ngay cho lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ, cơ quan Công an hoặc Ủy ban nhân dân cấp xã nơi gần nhất.\n2. Thông tin báo cháy, báo tình huống cứu nạn, cứu hộ được thực hiện bằng hiệu lệnh, điện thoại hoặc tín hiệu từ thiết bị truyền tin báo cháy hoặc báo trực tiếp cho cơ quan, lực lượng quy định tại khoản 1 Điều này.\nSố điện thoại báo cháy, báo tình huống cứu nạn, cứu hộ được quy định thống nhất trong cả nước là 114.\n3. Lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ, cơ quan Công an hoặc Ủy ban nhân dân cấp xã nhận được tin báo phải thông tin ngay cho lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ có thẩm quyền để giải quyết.","y":"1. 화재, 구조·구난 상황을 발견한 사람은 가장 가까운 곳의 소방 및 구조·구난 인력, 공안기관 또는 사(면)급 인민위원회에 즉시 신고한다.\n2. 화재 신고, 구조·구난 상황 신고의 통보는 신호(경보), 전화 또는 화재 신호 전송 장치의 신호로 하거나 이 조 제1항에 규정된 기관, 인력에 직접 신고하는 방법으로 한다.\n화재 신고, 구조·구난 상황 신고 전화번호는 전국적으로 114로 통일하여 규정한다.\n3. 신고를 받은 소방 및 구조·구난 인력, 공안기관 또는 사(면)급 인민위원회는 처리를 위하여 권한 있는 소방경찰(소방·구조구난 경찰)에 즉시 통보하여야 한다.","o":[]},{"id":"law-7","d":"law","n":"7","t":"Trách nhiệm quản lý nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난에 관한 국가관리 책임","c":"제1장 총칙","x":"1. Chính phủ thống nhất quản lý nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n2. Bộ Công an là cơ quan đầu mối giúp Chính phủ thống nhất thực hiện quản lý nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n3. Bộ Quốc phòng, các Bộ, cơ quan ngang Bộ, trong phạm vi nhiệm vụ, quyền hạn của mình, phối hợp với Bộ Công an thực hiện quản lý nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n4.2 Ủy ban nhân dân các cấp thực hiện quản lý nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ tại địa phương.\n2 Khoản này được sửa đổi, bổ sung theo quy định tại khoản 1 Điều 10 của Luật số 118/2025/QH15 sửa đổi, bổ sung một số điều của 10 luật có liên quan đến an ninh, trật tự, có hiệu lực kể từ ngày 01 tháng 7 năm 2026.","y":"1. 정부는 소방 및 구조·구난에 관한 국가관리를 통일적으로 수행한다.\n2. 공안부는 정부를 도와 소방 및 구조·구난에 관한 국가관리를 통일적으로 수행하는 주무(창구) 기관이다.\n3. 국방부, 각 부, 부급 기관은 자신의 임무, 권한의 범위에서 공안부와 협조하여 소방 및 구조·구난에 관한 국가관리를 수행한다.\n4.2 각급 인민위원회는 지방에서 소방 및 구조·구난에 관한 국가관리를 수행한다.\n2 이 항은 안보, 질서와 관련된 10개 법률의 일부 조항을 개정·보충하는 법률 제118/2025/QH15호 제10조 제1항의 규정에 따라 개정·보충되었으며, 2026년 7월 01일부터 효력이 있다.","o":[]},{"id":"law-8","d":"law","n":"8","t":"Trách nhiệm của cơ quan, tổ chức, hộ gia đình, cá nhân trong hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난 활동에서의 기관, 조직, 가구, 개인의 책임","c":"제1장 총칙","x":"1. Phòng cháy, chữa cháy, cứu nạn, cứu hộ là trách nhiệm của cơ quan, tổ chức, hộ gia đình, cá nhân hoạt động, sinh sống trên lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam.\n2. Công dân từ đủ 18 tuổi trở lên, đủ sức khỏe có trách nhiệm tham gia vào Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở, Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành hoặc Đội dân phòng khi có yêu cầu.\n3. Người đứng đầu cơ sở có trách nhiệm sau đây:\na) Tổ chức tuyên truyền, phổ biến, giáo dục kiến thức, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ; tổ chức huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ cho các đối tượng thuộc phạm vi quản lý;\nb) Thành lập, duy trì hoạt động Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở hoặc Đội phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành theo quy định tại Điều 37 của Luật này hoặc phân công người thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ thuộc phạm vi quản lý;\nc) Ban hành hoặc tham mưu người có thẩm quyền ban hành nội quy phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nd) Tổ chức thực hiện, kiểm tra, đôn đốc, giám sát cơ quan, tổ chức, cá nhân thuộc phạm vi quản lý về việc thực hiện quy định, nội quy, biện pháp, yêu cầu và duy trì điều kiện an toàn về phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nđ) Xây dựng, tổ chức thực tập phương án chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật;\ne) Quyết định hoặc đề xuất người có thẩm quyền quyết định trang bị, duy trì tính năng sử dụng của phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ; tổ chức chữa cháy, cứu nạn, cứu hộ; khắc phục hậu quả do cháy, tai nạn, sự cố gây ra;\ng) Lập, quản lý hồ sơ về phòng cháy, chữa cháy, cứu nạn, cứu hộ thuộc phạm vi quản lý; khai báo, cập nhật dữ liệu về phòng cháy, chữa cháy;\nh) Thực hiện nhiệm vụ khác về phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật.\n4. Chủ phương tiện giao thông có trách nhiệm sau đây:\na) Tổ chức tuyên truyền, phổ biến kiến thức, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ; tổ chức huấn luyện, bồi dưỡng nghiệp vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ cho các đối tượng thuộc phạm vi quản lý;\nb) Ban hành nội quy phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nc) Tổ chức thực hiện, kiểm tra, đôn đốc, giám sát cá nhân thuộc phạm vi quản lý về việc thực hiện quy định, nội quy, biện pháp, yêu cầu và duy trì điều kiện an toàn về phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nd) Trang bị, duy trì tính năng sử dụng của phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ; tổ chức chữa cháy, cứu nạn, cứu hộ; khắc phục hậu quả do cháy, tai nạn, sự cố gây ra;\nđ) Xây dựng, tổ chức thực tập phương án chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật;\ne) Thực hiện nhiệm vụ khác về phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật.\n5. Người quyết định đầu tư, chủ đầu tư, chủ sở hữu công trình, chủ phương tiện giao thông, cơ quan, tổ chức, cá nhân trong hoạt động đầu tư xây dựng công trình, sản xuất, lắp ráp, đóng mới, hoán cải phương tiện giao thông có trách nhiệm thực hiện các yêu cầu về phòng cháy và chữa cháy trong việc áp dụng tiêu chuẩn, quy chuẩn kỹ thuật, thẩm định, thi công, giám sát thi công, nghiệm thu về phòng cháy và chữa cháy.\n6. Chủ hộ gia đình trực tiếp sử dụng nhà ở mà không phải là người đứng đầu cơ sở có trách nhiệm sau đây:\na) Thực hiện quy định tại Điều 20 và Điều 21 của Luật này;\nb) Tuyên truyền, đôn đốc, nhắc nhở thành viên khác trong gia đình thực hiện pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ;\nc) Thường xuyên tự kiểm tra, phát hiện và khắc phục kịp thời nguy cơ gây cháy, nổ, tai nạn, sự cố;\nd) Thực hiện các nhiệm vụ khác về phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật.\n7. Cá nhân có trách nhiệm sau đây:\na) Chấp hành quy định, nội quy, biện pháp, yêu cầu về phòng cháy, chữa cháy, cứu nạn, cứu hộ của cơ quan, tổ chức hoặc người có thẩm quyền theo quy định của pháp luật;\nb) Tìm hiểu kiến thức về phòng cháy, chữa cháy, cứu nạn, cứu hộ và kỹ năng thoát nạn, sử dụng dụng cụ, phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ thông dụng;\nc) Bảo đảm an toàn trong sử dụng nguồn lửa, nguồn nhiệt, thiết bị, dụng cụ sinh lửa, sinh nhiệt, chất dễ cháy, nổ;\nd) Phát hiện, ngăn chặn nguy cơ trực tiếp gây cháy, nổ và các hành vi vi phạm quy định an toàn về phòng cháy, chữa cháy, cứu nạn, cứu hộ trong điều kiện, khả năng cho phép;\nđ) Tham gia chữa cháy, cứu nạn, cứu hộ khi được cơ quan, người có thẩm quyền huy động; chấp hành yêu cầu, quyết định của người chỉ huy chữa cháy, người chỉ huy cứu nạn, cứu hộ khi tham gia chữa cháy, cứu nạn, cứu hộ.\n8. Trách nhiệm về phòng cháy, chữa cháy, cứu nạn, cứu hộ đối với trường hợp thuê, mượn, ở nhờ nhà ở được quy định như sau:\na) Người cho thuê, cho mượn, cho ở nhờ nhà ở có trách nhiệm tuyên truyền, đôn đốc, nhắc nhở người thuê, mượn, ở nhờ thực hiện quy định của pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ;\nb) Người thuê, mượn, ở nhờ nhà ở có trách nhiệm theo quy định tại khoản 6 Điều này, trừ trường hợp có thỏa thuận khác với người cho thuê, mượn, ở nhờ nhà ở.\nTrường hợp thuê, mượn, ở nhờ nhà ở kết hợp sản xuất, kinh doanh thì người thuê, mượn, ở nhờ còn có trách nhiệm bảo đảm điều kiện an toàn về phòng cháy theo quy định tại Điều 21 của Luật này.\n9. Cơ quan, tổ chức, cá nhân không thuộc đối tượng quy định tại khoản 3 Điều 50 của Luật này có trách nhiệm bảo đảm kinh phí cho hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ trong phạm vi quản lý.\n10. Chính phủ quy định chi tiết điểm c và điểm g khoản 3, điểm b khoản 4 và khoản 5 Điều này.","y":"1. 소방 및 구조·구난은 베트남사회주의공화국 영토에서 활동하거나 거주하는 기관, 조직, 가구, 개인의 책임이다.\n2. 만 18세 이상으로서 건강이 충분한 공민은 요구가 있는 때에는 사업장 자체 소방대(사업장 소방 및 구조·구난대), 전문 소방대(전문 소방 및 구조·구난대) 또는 민방위 소방대에 참여할 책임이 있다.\n3. 사업장 대표자는 다음 각 호의 책임이 있다:\na) 소방 및 구조·구난에 관한 지식, 법률의 선전, 보급, 교육을 조직한다. 관리 범위에 속하는 대상자에게 소방 및 구조·구난 직무 훈련·교육을 조직한다;\nb) 이 법 제37조의 규정에 따라 사업장 자체 소방대(사업장 소방 및 구조·구난대) 또는 전문 소방대(전문 소방 및 구조·구난대)를 설립하고 그 활동을 유지하거나, 관리 범위에서 소방 및 구조·구난 임무를 수행할 사람을 지정한다;\nc) 소방 및 구조·구난 내규를 제정하거나 권한 있는 사람이 제정하도록 건의(자문)한다;\nd) 관리 범위에 속하는 기관, 조직, 개인이 소방 및 구조·구난에 관한 규정, 내규, 조치, 요구를 이행하고 안전 조건을 유지하는지에 대하여 그 실시를 조직하고 점검, 독려, 감독한다;\nđ) 법률의 규정에 따라 화재진압·구조구난 계획(방안)을 수립하고 그 훈련(실습)을 조직한다;\ne) 소방 및 구조·구난 장비·설비의 비치, 사용 성능의 유지를 결정하거나 권한 있는 사람이 결정하도록 제안한다. 화재진압, 구조·구난을 조직한다. 화재, 사고·재난으로 인한 결과를 복구한다;\ng) 관리 범위에 속하는 소방 및 구조·구난 관련 서류를 작성·관리한다. 소방에 관한 데이터를 신고·갱신한다;\nh) 법률의 규정에 따라 소방 및 구조·구난에 관한 그 밖의 임무를 수행한다.\n4. 교통수단 소유자는 다음 각 호의 책임이 있다:\na) 소방 및 구조·구난에 관한 지식, 법률의 선전, 보급을 조직한다. 관리 범위에 속하는 대상자에게 소방 및 구조·구난 직무 훈련·교육을 조직한다;\nb) 소방 및 구조·구난 내규를 제정한다;\nc) 관리 범위에 속하는 개인이 소방 및 구조·구난에 관한 규정, 내규, 조치, 요구를 이행하고 안전 조건을 유지하는지에 대하여 그 실시를 조직하고 점검, 독려, 감독한다;\nd) 소방 및 구조·구난 장비·설비를 비치하고 그 사용 성능을 유지한다. 화재진압, 구조·구난을 조직한다. 화재, 사고·재난으로 인한 결과를 복구한다;\nđ) 법률의 규정에 따라 화재진압·구조구난 계획(방안)을 수립하고 그 훈련(실습)을 조직한다;\ne) 법률의 규정에 따라 소방 및 구조·구난에 관한 그 밖의 임무를 수행한다.\n5. 투자 결정권자, 발주자(투자자), 건축물 소유자, 교통수단 소유자, 건축물 건설투자 활동 및 교통수단의 생산, 조립, 신조, 개조 활동에 종사하는 기관, 조직, 개인은 기술 표준·기술 규정의 적용, 소방에 관한 심사, 시공, 시공 감리, 준공검사(인수검사)에서 소방에 관한 요구사항을 이행할 책임이 있다.\n6. 주택을 직접 사용하는 가구주로서 사업장 대표자가 아닌 사람은 다음 각 호의 책임이 있다:\na) 이 법 제20조 및 제21조의 규정을 이행한다;\nb) 가족의 다른 구성원이 소방 및 구조·구난에 관한 법률을 이행하도록 선전, 독려, 주의 환기한다;\nc) 수시로 자체 점검하여 화재·폭발, 사고·재난을 일으킬 위험을 발견하고 적시에 시정한다;\nd) 법률의 규정에 따라 소방 및 구조·구난에 관한 그 밖의 임무를 수행한다.\n7. 개인은 다음 각 호의 책임이 있다:\na) 법률의 규정에 따른 기관, 조직 또는 권한 있는 사람의 소방 및 구조·구난에 관한 규정, 내규, 조치, 요구를 준수한다;\nb) 소방 및 구조·구난에 관한 지식과 피난 요령, 통상적인 소방 및 구조·구난 기구, 장비·설비의 사용 요령을 익힌다;\nc) 화원, 열원, 불·열을 발생시키는 설비, 기구, 가연성·폭발성 물질의 사용에서 안전을 보장한다;\nd) 여건, 능력이 허용하는 범위에서 화재·폭발을 직접 일으킬 위험과 소방 및 구조·구난 안전 규정을 위반하는 행위를 발견하고 저지한다;\nđ) 권한 있는 기관, 사람에 의하여 동원된 때에는 화재진압, 구조·구난에 참여한다. 화재진압, 구조·구난에 참여하는 때에는 화재진압 지휘자, 구조·구난 지휘자의 요구, 결정을 따른다.\n8. 주택을 임차, 차용(무상 사용), 얹혀 거주하는 경우의 소방 및 구조·구난에 관한 책임은 다음과 같이 규정한다:\na) 주택을 임대하거나 빌려주거나 얹혀 거주하게 하는 사람은 임차인, 차용인, 얹혀 거주하는 사람이 소방 및 구조·구난에 관한 법률의 규정을 이행하도록 선전, 독려, 주의 환기할 책임이 있다;\nb) 주택을 임차, 차용하거나 얹혀 거주하는 사람은 이 조 제6항의 규정에 따른 책임이 있다. 다만, 주택을 임대하거나 빌려주거나 얹혀 거주하게 하는 사람과 달리 합의한 경우는 제외한다.\n생산·영업 겸용 주택을 임차, 차용하거나 얹혀 거주하는 경우에는 임차인, 차용인, 얹혀 거주하는 사람은 이 법 제21조의 규정에 따라 화재예방에 관한 안전 조건을 보장할 책임도 진다.\n9. 이 법 제50조 제3항에 규정된 대상에 해당하지 아니하는 기관, 조직, 개인은 관리 범위에서 소방 및 구조·구난 활동을 위한 경비를 보장할 책임이 있다.\n10. 정부는 이 조 제3항 c호 및 g호, 제4항 b호 및 제5항을 상세히 규정한다.","o":[]},{"id":"law-9","d":"law","n":"9","t":"Trách nhiệm tuyên truyền, phổ biến, giáo dục kiến thức, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ","k":"소방 및 구조·구난에 관한 지식, 법률의 선전, 보급, 교육 책임","c":"제1장 총칙","x":"1. Cơ quan quản lý nhà nước về phòng cháy, chữa cháy, cứu nạn, cứu hộ chủ trì, phối hợp với các cơ quan, tổ chức, cá nhân có liên quan thực hiện tuyên truyền, phổ biến, giáo dục kiến thức, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ.\n2. Cơ quan thông tin, truyền thông có trách nhiệm tổ chức tuyên truyền, phổ biến, giáo dục kiến thức, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ trên các phương tiện thông tin đại chúng.\n3. Bộ Xây dựng3 chủ trì, phối hợp với Bộ Công an tích hợp, lồng ghép kiến thức, pháp luật và kỹ năng phòng cháy, chữa cháy, cứu nạn, cứu hộ vào nội dung đào tạo lái xe.\n3 Cụm từ “Bộ Giao thông vận tải” được thay thế bằng cụm từ “Bộ Xây dựng” theo quy định tại điểm a khoản 2 Điều 10 của Luật số 118/2025/QH15 sửa đổi, bổ sung một số điều của 10 luật có liên quan đến an ninh, trật tự, có hiệu lực kể từ ngày 01 tháng 7 năm 2026.\n4. Bộ Giáo dục và Đào tạo4 trong phạm vi nhiệm vụ, quyền hạn của mình, chủ trì, phối hợp với Bộ Công an và Bộ, cơ quan ngang Bộ có liên quan xây dựng, tích hợp, lồng ghép kiến thức, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ vào chương trình giảng dạy và bảo đảm điều kiện thực hiện trong cơ sở giáo dục mầm non, cơ sở giáo dục phổ thông, cơ sở giáo dục nghề nghiệp, cơ sở giáo dục đại học phù hợp với từng cấp học, ngành học.\n4 Cụm từ “, Bộ Lao động - Thương binh và Xã hội,” được bãi bỏ theo quy định tại điểm a khoản 3 Điều 10 của Luật số 118/2025/QH15 sửa đổi, bổ sung một số điều của 10 luật có liên quan đến an ninh, trật tự, có hiệu lực kể từ ngày 01 tháng 7 năm 2026.\n5. Bộ, cơ quan ngang Bộ, Ủy ban nhân dân các cấp, trong phạm vi nhiệm vụ, quyền hạn của mình, có trách nhiệm tổ chức tuyên truyền, phổ biến, giáo dục kiến thức, pháp luật về phòng cháy, chữa cháy và cứu nạn, cứu hộ, có hình thức tuyên truyền, phổ biến, giáo dục phù hợp với các đối tượng thuộc phạm vi quản lý.\n6. Đơn vị lực lượng vũ trang nhân dân, cơ quan, tổ chức, cơ sở giáo dục có trách nhiệm tuyên truyền, phổ biến, giáo dục kiến thức, pháp luật, hướng dẫn kỹ năng về phòng cháy, chữa cháy, cứu nạn, cứu hộ cho đối tượng thuộc phạm vi quản lý.","y":"1. 소방 및 구조·구난에 관한 국가관리 기관은 관련 기관, 조직, 개인과 협조하여 소방 및 구조·구난에 관한 지식, 법률의 선전, 보급, 교육을 주관하여 실시한다.\n2. 정보, 언론(통신) 기관은 대중매체를 통하여 소방 및 구조·구난에 관한 지식, 법률의 선전, 보급, 교육을 조직할 책임이 있다.\n3. 건설부3는 공안부와 협조하여 소방 및 구조·구난에 관한 지식, 법률 및 기능(요령)을 운전자 양성 교육 내용에 통합·반영하는 것을 주관한다.\n3 “교통운수부”라는 문구는 안보, 질서와 관련된 10개 법률의 일부 조항을 개정·보충하는 법률 제118/2025/QH15호 제10조 제2항 a호의 규정에 따라 “건설부”라는 문구로 대체되었으며, 2026년 7월 01일부터 효력이 있다.\n4. 교육훈련부4는 자신의 임무, 권한의 범위에서 공안부 및 관련 부, 부급 기관과 협조하여 소방 및 구조·구난에 관한 지식, 법률을 교육과정에 편성, 통합·반영하는 것을 주관하고, 각 학교급, 전공 분야에 적합하게 유아교육기관, 보통교육기관, 직업교육기관, 대학교육기관에서 그 실시 여건을 보장한다.\n4 “, 노동·보훈·사회부,”라는 문구는 안보, 질서와 관련된 10개 법률의 일부 조항을 개정·보충하는 법률 제118/2025/QH15호 제10조 제3항 a호의 규정에 따라 삭제되었으며, 2026년 7월 01일부터 효력이 있다.\n5. 부, 부급 기관, 각급 인민위원회는 자신의 임무, 권한의 범위에서 소방 및 구조·구난에 관한 지식, 법률의 선전, 보급, 교육을 조직할 책임이 있으며, 관리 범위에 속하는 대상자에게 적합한 선전, 보급, 교육 형식을 갖춘다.\n6. 인민무장력 부대, 기관, 조직, 교육기관은 관리 범위에 속하는 대상자에게 소방 및 구조·구난에 관한 지식, 법률을 선전, 보급, 교육하고 그 기능(요령)을 지도할 책임이 있다.","o":[]},{"id":"law-10","d":"law","n":"10","t":"Xây dựng, thực tập các phương án chữa cháy, cứu nạn, cứu hộ","k":"화재진압·구조구난 계획(방안)의 수립, 훈련(실습)","c":"제1장 총칙","x":"1. Người đứng đầu cơ sở, chủ phương tiện giao thông quy định tại khoản 2 Điều 22 của Luật này có trách nhiệm tổ chức xây dựng, thực tập phương án chữa cháy, cứu nạn, cứu hộ sử dụng lực lượng, phương tiện tại chỗ của cơ sở, phương tiện giao thông trong phạm vi quản lý.\n2. Cơ quan Công an có trách nhiệm sau đây:\na) Tổ chức xây dựng, thực tập phương án chữa cháy, cứu nạn, cứu hộ đối với cơ sở có nguy hiểm về cháy, nổ;\nb) Tổ chức xây dựng, thực tập phương án cứu nạn, cứu hộ đối với các tình huống tai nạn, sự cố quy định tại điểm b khoản 1 Điều 32 của Luật này cần huy động lực lượng, phương tiện của nhiều cơ quan, tổ chức, cá nhân.\n3. Người đứng đầu cơ sở có nguy hiểm về cháy, nổ có trách nhiệm phối hợp với cơ quan Công an trong xây dựng, thực tập phương án chữa cháy, cứu nạn, cứu hộ quy định tại điểm a khoản 2 Điều này; Chủ tịch Ủy ban nhân dân cấp xã có trách nhiệm phối hợp với cơ quan Công an xây dựng, thực tập phương án cứu nạn, cứu hộ quy định tại điểm b khoản 2 Điều này.\n4. Cơ quan, tổ chức, cá nhân có trong phương án chữa cháy, cứu nạn, cứu hộ hoặc phương án cứu nạn, cứu hộ do cơ quan Công an xây dựng có trách nhiệm bố trí lực lượng, người, phương tiện tham gia thực tập phương án.\n5. Cơ quan Quân sự, Biên phòng có trách nhiệm chủ trì, phối hợp cơ quan Công an tổ chức xây dựng, diễn tập phương án chữa cháy, cứu nạn, cứu hộ đối với cơ sở có nguy hiểm về cháy, nổ thuộc phạm vi quản lý.\n6. Chính phủ quy định về nội dung, thời gian thực tập phương án chữa cháy, cứu nạn, cứu hộ và phương án cứu nạn, cứu hộ.","y":"1. 이 법 제22조 제2항에 규정된 사업장 대표자, 교통수단 소유자는 관리 범위에서 사업장, 교통수단의 현장 인력, 장비·설비를 사용하는 화재진압·구조구난 계획(방안)의 수립, 훈련(실습)을 조직할 책임이 있다.\n2. 공안기관은 다음 각 호의 책임이 있다:\na) 화재·폭발 위험 사업장에 대한 화재진압·구조구난 계획(방안)의 수립, 훈련(실습)을 조직한다;\nb) 이 법 제32조 제1항 b호에 규정된 사고·재난 상황으로서 여러 기관, 조직, 개인의 인력, 장비·설비를 동원할 필요가 있는 상황에 대한 구조·구난 계획(방안)의 수립, 훈련(실습)을 조직한다.\n3. 화재·폭발 위험 사업장의 대표자는 이 조 제2항 a호에 규정된 화재진압·구조구난 계획(방안)의 수립, 훈련(실습)에서 공안기관과 협조할 책임이 있다. 사(면)급 인민위원회 위원장은 이 조 제2항 b호에 규정된 구조·구난 계획(방안)의 수립, 훈련(실습)에서 공안기관과 협조할 책임이 있다.\n4. 공안기관이 수립한 화재진압·구조구난 계획(방안) 또는 구조·구난 계획(방안)에 포함된 기관, 조직, 개인은 계획 훈련(실습)에 참여할 인력, 사람, 장비·설비를 배치할 책임이 있다.\n5. 군사기관, 국경수비대는 관리 범위에 속하는 화재·폭발 위험 사업장에 대한 화재진압·구조구난 계획(방안)의 수립, 연습(훈련)을 주관하고 공안기관과 협조하여 조직할 책임이 있다.\n6. 정부는 화재진압·구조구난 계획(방안) 및 구조·구난 계획(방안)의 훈련(실습) 내용, 시기에 관하여 규정한다.","o":[]},{"id":"law-11","d":"law","n":"11","t":"Kiểm tra về phòng cháy, chữa cháy","k":"소방 점검(검사)","c":"제1장 총칙","x":"1. Đối tượng kiểm tra về phòng cháy, chữa cháy bao gồm:\na) Cơ sở quy định tại khoản 7 Điều 2 của Luật này;\nb) Nhà ở, nhà ở kết hợp sản xuất, kinh doanh;\nc) Phương tiện giao thông quy định tại khoản 10 Điều 2 của Luật này;\nd) Công trình xây dựng trong quá trình thi công.\n2. Nội dung kiểm tra về phòng cháy, chữa cháy bao gồm:\na) Việc thực hiện trách nhiệm phòng cháy, chữa cháy, cứu nạn, cứu hộ của người đứng đầu cơ sở, chủ hộ gia đình, chủ phương tiện giao thông theo quy định;\nb) Việc bảo đảm và duy trì điều kiện an toàn về phòng cháy và chữa cháy đối với công trình xây dựng trong quá trình thi công, nhà ở, nhà ở kết hợp sản xuất, kinh doanh, phương tiện giao thông, cơ sở theo quy định tại các điều 19, 20, 21, 22 và 23 của Luật này; việc thực hiện, duy trì giải pháp kỹ thuật về phòng cháy và chữa cháy đối với các cơ sở quy định tại khoản 6 Điều 55 của Luật này.\n3. Thẩm quyền kiểm tra về phòng cháy, chữa cháy được quy định như sau:\na) Người đứng đầu cơ sở, chủ hộ gia đình, chủ phương tiện giao thông, chủ đầu tư tự tổ chức kiểm tra về phòng cháy, chữa cháy;\nb) Ủy ban nhân dân cấp xã, cơ quan Công an, cơ quan chuyên môn về xây dựng, cơ quan đăng kiểm, trong phạm vi nhiệm vụ, quyền hạn của mình, thực hiện kiểm tra về phòng cháy, chữa cháy theo quy định của pháp luật.\n4. Chính phủ quy định chi tiết khoản 2 và khoản 3 Điều này; quy định trình tự, thủ tục kiểm tra về phòng cháy, chữa cháy.","y":"1. 소방 점검(검사)의 대상은 다음 각 호를 포함한다:\na) 이 법 제2조 제7항에 규정된 사업장;\nb) 주택, 생산·영업 겸용 주택;\nc) 이 법 제2조 제10항에 규정된 교통수단;\nd) 시공 과정에 있는 건설 공사(건축물).\n2. 소방 점검(검사)의 내용은 다음 각 호를 포함한다:\na) 규정에 따른 사업장 대표자, 가구주, 교통수단 소유자의 소방 및 구조·구난 책임의 이행;\nb) 이 법 제19조, 제20조, 제21조, 제22조 및 제23조의 규정에 따른 시공 과정에 있는 건설 공사(건축물), 주택, 생산·영업 겸용 주택, 교통수단, 사업장에 대한 소방 안전 조건의 보장 및 유지. 이 법 제55조 제6항에 규정된 사업장에 대한 소방 기술적 해결책의 이행, 유지.\n3. 소방 점검(검사)의 권한은 다음과 같이 규정한다:\na) 사업장 대표자, 가구주, 교통수단 소유자, 발주자(투자자)는 소방 점검(검사)을 스스로 조직하여 실시한다(자체 점검);\nb) 사(면)급 인민위원회, 공안기관, 건설 전문기관, 등록검사기관은 자신의 임무, 권한의 범위에서 법률의 규정에 따라 소방 점검(검사)을 실시한다.\n4. 정부는 이 조 제2항 및 제3항을 상세히 규정한다. 소방 점검(검사)의 절차, 수속을 규정한다.","o":[]},{"id":"law-12","d":"law","n":"12","t":"Ngày toàn dân phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"전 국민 소방 및 구조·구난의 날","c":"제1장 총칙","x":"Ngày 04 tháng 10 hằng năm là “Ngày toàn dân phòng cháy, chữa cháy, cứu nạn, cứu hộ”.","y":"매년 10월 04일은 “전 국민 소방 및 구조·구난의 날”이다.","o":[]},{"id":"law-13","d":"law","n":"13","t":"Hợp tác quốc tế về phòng cháy, chữa cháy, cứu nạn, cứu hộ","k":"소방 및 구조·구난에 관한 국제협력","c":"제1장 총칙","x":"1. Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam thực hiện hợp tác quốc tế về phòng cháy, chữa cháy, cứu nạn, cứu hộ. Việc hợp tác quốc tế về phòng cháy, chữa cháy, cứu nạn, cứu hộ phải bảo đảm những nguyên tắc sau đây:\na) Tôn trọng độc lập, chủ quyền, bình đẳng, cùng có lợi; tuân thủ pháp luật Việt Nam, điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên và thỏa thuận quốc tế có liên quan về phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nb) Tạo điều kiện cho tổ chức, cá nhân trong nước, người Việt Nam định cư ở nước ngoài, tổ chức, cá nhân nước ngoài và tổ chức quốc tế hợp tác về phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nc) Mở rộng, phát triển đào tạo, nghiên cứu, ứng dụng khoa học và công nghệ; phối hợp tìm kiếm, cứu nạn; đầu tư, xây dựng hạ tầng, công trình phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nd) Ưu tiên hoạt động hợp tác quốc tế trong lĩnh vực đào tạo, nghiên cứu, ứng dụng khoa học và chuyển giao công nghệ; chia sẻ kinh nghiệm và phối hợp trong hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n2. Nội dung hợp tác quốc tế về phòng cháy, chữa cháy, cứu nạn, cứu hộ bao gồm:\na) Trao đổi thông tin, học tập, tham khảo kinh nghiệm về phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nb) Hỗ trợ chữa cháy, tìm kiếm, cứu nạn;\nc) Đào tạo, huấn luyện, diễn tập, đầu tư, nghiên cứu, ứng dụng khoa học và chuyển giao công nghệ phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nd) Xây dựng hạ tầng, công trình phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nđ) Trang bị phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n3. Bộ Công an chủ trì, phối hợp với các Bộ, ngành liên quan giúp Chính phủ đàm phán, ký kết điều ước quốc tế, thỏa thuận quốc tế hoặc đề xuất cấp có thẩm quyền ký kết điều ước quốc tế, thỏa thuận quốc tế về phòng cháy, chữa cháy, cứu nạn, cứu hộ; chủ trì, phối hợp với các Bộ, ngành liên quan thực hiện hợp tác quốc tế về phòng cháy, chữa cháy, cứu nạn, cứu hộ.","y":"1. 베트남사회주의공화국 국가는 소방 및 구조·구난에 관한 국제협력을 실시한다. 소방 및 구조·구난에 관한 국제협력은 다음 각 호의 원칙을 보장하여야 한다:\na) 독립, 주권, 평등, 호혜를 존중한다. 베트남 법률, 베트남사회주의공화국이 당사국인 국제조약 및 소방 및 구조·구난에 관한 관련 국제합의를 준수한다;\nb) 국내 조직, 개인, 외국에 정주하는 베트남인, 외국 조직, 개인 및 국제기구가 소방 및 구조·구난에 관하여 협력하도록 여건을 조성한다;\nc) 양성, 연구, 과학과 기술의 응용을 확대·발전시킨다. 수색, 구조에 협조한다. 소방 및 구조·구난 인프라, 시설(건축물)을 투자·건설한다;\nd) 양성, 연구, 과학의 응용 및 기술 이전 분야의 국제협력 활동을 우선한다. 소방 및 구조·구난 활동에서 경험을 공유하고 협조한다.\n2. 소방 및 구조·구난에 관한 국제협력의 내용은 다음 각 호를 포함한다:\na) 소방 및 구조·구난에 관한 정보의 교환, 경험의 학습·참고;\nb) 화재진압, 수색, 구조의 지원;\nc) 소방 및 구조·구난에 관한 양성, 훈련, 연습, 투자, 연구, 과학의 응용 및 기술 이전;\nd) 소방 및 구조·구난 인프라, 시설(건축물)의 건설;\nđ) 소방 및 구조·구난 장비·설비의 비치.\n3. 공안부는 관련 부, 부문과 협조하여 정부를 도와 소방 및 구조·구난에 관한 국제조약, 국제합의를 교섭·체결하거나 권한 있는 기관이 국제조약, 국제합의를 체결하도록 제안하는 것을 주관한다. 관련 부, 부문과 협조하여 소방 및 구조·구난에 관한 국제협력을 주관하여 실시한다.","o":[]},{"id":"law-14","d":"law","n":"14","t":"Các hành vi bị nghiêm cấm","k":"엄격히 금지되는 행위","c":"제1장 총칙","x":"1. Cố ý gây cháy, nổ, tai nạn, sự cố hoặc kích động, xúi giục, dụ dỗ người khác gây cháy, nổ, tai nạn, sự cố gây thiệt hại hoặc có khả năng gây thiệt hại về người, tài sản của cơ quan, tổ chức, cá nhân, ảnh hưởng đến kinh tế, môi trường, an ninh, trật tự.\n2. Xúc phạm, đe dọa, cản trở, chống đối lực lượng thực hiện nhiệm vụ và người tham gia phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n3. Lợi dụng, lạm dụng việc thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ để thực hiện hành vi vi phạm pháp luật, nhũng nhiễu, xâm phạm lợi ích của Nhà nước, quyền, lợi ích hợp pháp của cơ quan, tổ chức, cá nhân.\n4. Lợi dụng việc tham gia chữa cháy, cứu nạn, cứu hộ để thực hiện hành vi vi phạm pháp luật, xâm phạm lợi ích của Nhà nước, quyền, lợi ích hợp pháp của cơ quan, tổ chức, cá nhân.\n5. Làm giả, làm sai lệch kết quả thẩm định thiết kế về phòng cháy và chữa cháy, kết quả kiểm tra nghiệm thu về phòng cháy và chữa cháy.\n6. Báo cháy giả; báo tình huống cứu nạn, cứu hộ giả.\n7. Sản xuất, tàng trữ, vận chuyển, sử dụng, mua bán trái phép hàng hóa, chất, vật phẩm nguy hiểm về cháy, nổ.\n8. Chuyển đổi, bổ sung công năng sử dụng công trình, hạng mục công trình không bảo đảm an toàn phòng cháy và chữa cháy theo quy định của pháp luật.\n9. Kinh doanh phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ có chất lượng không đúng với tiêu chuẩn công bố áp dụng, quy chuẩn kỹ thuật tương ứng.\n10. Chiếm đoạt, hủy hoại, cố ý làm hư hỏng phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ; tự ý thay đổi, di chuyển, che khuất phương tiện phòng cháy, chữa cháy, cứu nạn, cứu hộ, biển báo, biển chỉ dẫn đã được trang bị theo quy định; cản trở lối thoát nạn; làm mất tác dụng của lối thoát nạn, đường thoát nạn, ngăn cháy lan.\n11. Lấn chiếm, bố trí vật cản gây cản trở hoạt động của phương tiện chữa cháy, cứu nạn, cứu hộ cơ giới.","y":"1. 고의로 화재·폭발, 사고·재난을 일으키거나 다른 사람이 화재·폭발, 사고·재난을 일으키도록 선동, 교사, 유인하여 기관, 조직, 개인의 인명, 재산에 피해를 주거나 피해를 줄 우려가 있게 하고 경제, 환경, 안보, 질서에 영향을 미치는 행위.\n2. 소방 및 구조·구난 임무를 수행하는 인력과 그에 참여하는 사람을 모욕, 위협, 방해하거나 그에 저항하는 행위.\n3. 소방 및 구조·구난 임무의 수행을 이용, 남용하여 법률 위반 행위를 하거나 괴롭히고(부당한 요구를 하고) 국가의 이익, 기관, 조직, 개인의 적법한 권리, 이익을 침해하는 행위.\n4. 화재진압, 구조·구난에 참여하는 것을 이용하여 법률 위반 행위를 하거나 국가의 이익, 기관, 조직, 개인의 적법한 권리, 이익을 침해하는 행위.\n5. 소방 설계 심사 결과, 소방 준공검사(인수검사) 확인 결과를 위조하거나 왜곡하는 행위.\n6. 허위로 화재를 신고하는 행위, 허위로 구조·구난 상황을 신고하는 행위.\n7. 화재·폭발 위험 화물, 물질, 물품을 불법으로 생산, 보관, 운송, 사용, 매매하는 행위.\n8. 법률의 규정에 따른 소방 안전을 보장하지 아니하고 건축물, 건축물 세부 항목의 사용 용도를 변경하거나 추가하는 행위.\n9. 품질이 공표된 적용 표준, 해당 기술 규정에 맞지 아니하는 소방 및 구조·구난 장비·설비를 영업(판매)하는 행위.\n10. 소방 및 구조·구난 장비·설비를 탈취, 훼손하거나 고의로 손상시키는 행위. 규정에 따라 비치된 소방 및 구조·구난 장비·설비, 표지판, 안내 표지를 임의로 변경, 이동하거나 가리는 행위. 피난구를 막는 행위. 피난구, 피난로, 방화(연소확대 방지 구획)의 기능을 상실하게 하는 행위.\n11. 침범·점유하거나 장애물을 두어 동력 화재진압·구조·구난 장비(차량)의 활동을 방해하는 행위.","o":[]},{"id":"law-15","d":"law","n":"15","t":"Yêu cầu về phòng cháy, chữa cháy khi lập, điều chỉnh, phê duyệt quy hoạch đô thị và nông thôn","k":"도시 및 농촌 계획의 수립, 조정, 승인 시 소방에 관한 요구사항","c":"제2장 화재예방","x":"Khi lập, điều chỉnh, phê duyệt quy hoạch chung, quy hoạch phân khu, quy hoạch chi tiết đô thị, khu dân cư, cụm công nghiệp và các khu chức năng theo quy định của pháp luật về quy hoạch đô thị và nông thôn phải có giải pháp, thiết kế về phòng cháy và chữa cháy phù hợp với từng cấp độ quy hoạch và được quy định như sau:\n1. Quy hoạch chung phải có nội dung phát triển hạ tầng phòng cháy và chữa cháy;\n2. Quy hoạch phân khu đô thị, khu chức năng có yêu cầu lập quy hoạch phân khu phải có:\na) Nguồn nước và phương án tổ chức mạng lưới cấp nước chữa cháy;\nb) Mạng lưới giao thông phục vụ chữa cháy, cứu nạn, cứu hộ;\nc) Vị trí, quy mô của trụ sở đơn vị phòng cháy, chữa cháy và cứu nạn, cứu hộ trong khu vực lập quy hoạch;\n3. Quy hoạch chi tiết đô thị, khu dân cư, cụm công nghiệp và các khu chức năng phải có:\na) Đường bộ, bãi đỗ, khoảng trống bảo đảm cho xe chữa cháy và phương tiện chữa cháy cơ giới triển khai hoạt động;\nb) Nguồn nước chữa cháy từ bồn, bể, ao, hồ tự nhiên, hồ nhân tạo hoặc hệ thống cấp nước chữa cháy ngoài nhà;\nc) Nguồn điện phục vụ hoạt động phòng cháy, chữa cháy;\nd) Địa điểm cho đơn vị phòng cháy, chữa cháy và cứu nạn, cứu hộ bảo đảm diện tích xây dựng và yêu cầu đã được xác định tại quy hoạch quy định tại khoản 1 và khoản 2 Điều này;\n4. Cơ quan có thẩm quyền theo quy định của pháp luật về quy hoạch đô thị và nông thôn chỉ phê duyệt quy hoạch chung, quy hoạch phân khu, quy hoạch chi tiết đô thị, khu dân cư, cụm công nghiệp và các khu chức năng khi bảo đảm các yêu cầu về phòng cháy, chữa cháy theo quy định tại các khoản 1, 2 và 3 Điều này;\n5. Chính phủ quy định chi tiết Điều này.","y":"도시 및 농촌 계획에 관한 법률의 규정에 따라 도시, 주거지역, 산업클러스터 및 각 기능구역의 총괄계획, 구역계획, 상세계획을 수립, 조정, 승인하는 때에는 각 계획 단계에 적합한 소방에 관한 해결책, 설계가 있어야 하며 다음과 같이 규정한다:\n1. 총괄계획에는 소방 인프라 개발에 관한 내용이 있어야 한다;\n2. 도시 구역계획, 구역계획 수립이 요구되는 기능구역의 구역계획에는 다음 각 호가 있어야 한다:\na) 수원 및 소방용수 공급망의 구성 방안;\nb) 화재진압, 구조·구난에 이바지하는 교통망;\nc) 계획 수립 구역 내 소방 및 구조·구난 부대 청사의 위치, 규모;\n3. 도시, 주거지역, 산업클러스터 및 각 기능구역의 상세계획에는 다음 각 호가 있어야 한다:\na) 소방차 및 동력 화재진압 장비가 활동을 전개할 수 있도록 보장하는 도로, 주차(정차) 공간, 공지;\nb) 저수조, 수조, 못, 자연 호수, 인공 호수로부터의 소방용수원 또는 옥외 소방용수 공급 설비;\nc) 소방 활동에 이바지하는 전원;\nd) 이 조 제1항 및 제2항에 규정된 계획에서 확정된 건축 면적 및 요구사항을 보장하는 소방 및 구조·구난 부대를 위한 부지;\n4. 도시 및 농촌 계획에 관한 법률의 규정에 따른 권한 있는 기관은 이 조 제1항, 제2항 및 제3항의 규정에 따른 소방에 관한 요구사항을 보장하는 경우에만 도시, 주거지역, 산업클러스터 및 각 기능구역의 총괄계획, 구역계획, 상세계획을 승인한다;\n5. 정부는 이 조를 상세히 규정한다.","o":[]},{"id":"law-16","d":"law","n":"16","t":"Yêu cầu về phòng cháy, chữa cháy khi lập, điều chỉnh dự án đầu tư xây dựng công trình, thiết kế công trình, cải tạo, thay đổi công năng sử dụng công trình, sản xuất, lắp ráp, đóng mới, hoán cải phương tiện giao thông","k":"건축물 건설투자사업의 수립·조정, 건축물의 설계, 건축물의 개보수·사용 용도 변경, 교통수단의 생산, 조립, 신조, 개조 시 소방에 관한 요구사항","c":"제2장 화재예방","x":"1. Khi lập, điều chỉnh dự án đầu tư xây dựng công trình, thiết kế công trình, cải tạo, thay đổi công năng sử dụng công trình quy định tại khoản 7 Điều 2 của Luật này và xây dựng công trình tạm theo quy định của pháp luật về xây dựng phải có giải pháp, thiết kế về phòng cháy và chữa cháy phù hợp với công năng, đặc điểm của công trình và bảo đảm các yêu cầu sau đây:\na) Khoảng cách phòng cháy, chữa cháy;\nb) Đường bộ, bãi đỗ, khoảng trống phục vụ hoạt động phòng cháy, chữa cháy, cứu nạn, cứu hộ;\nc) Giải pháp thoát nạn;\nd) Dự kiến bậc chịu lửa, giải pháp ngăn cháy, chống cháy lan;\nđ) Giải pháp chống khói;\ne) Hệ thống điện phục vụ phòng cháy và chữa cháy;\ng) Phương tiện, hệ thống phòng cháy và chữa cháy.\n2. Khi sản xuất, lắp ráp, đóng mới, hoán cải phương tiện giao thông phải có giải pháp, thiết kế về phòng cháy và chữa cháy phù hợp với tính chất, đặc điểm của phương tiện giao thông và bảo đảm các yêu cầu sau đây:\na) Giải pháp ngăn cháy, chống cháy lan;\nb) Giải pháp bảo đảm an toàn phòng cháy cho hệ thống cung cấp năng lượng, nhiên liệu và động cơ;\nc) Hệ thống, thiết bị phát hiện sự cố rò rỉ chất khí, chất lỏng nguy hiểm về cháy, nổ;\nd) Phương tiện, hệ thống phòng cháy và chữa cháy.","y":"1. 이 법 제2조 제7항에 규정된 건축물의 건설투자사업 수립·조정, 건축물의 설계, 건축물의 개보수·사용 용도 변경을 하는 때와 건설에 관한 법률의 규정에 따른 임시 건축물을 건설하는 때에는 건축물의 용도, 특성에 적합한 소방에 관한 해결책, 설계가 있어야 하며 다음 각 호의 요구사항을 보장하여야 한다:\na) 소방 이격거리;\nb) 소방 및 구조·구난 활동에 이바지하는 도로, 주차(정차) 공간, 공지;\nc) 피난 해결책;\nd) 예정 내화등급, 방화(구획), 연소확대 방지 해결책;\nđ) 제연(방연) 해결책;\ne) 소방에 이바지하는 전기 설비;\ng) 소방 장비·설비, 소방 시스템.\n2. 교통수단을 생산, 조립, 신조, 개조하는 때에는 교통수단의 성질, 특성에 적합한 소방에 관한 해결책, 설계가 있어야 하며 다음 각 호의 요구사항을 보장하여야 한다:\na) 방화(구획), 연소확대 방지 해결책;\nb) 에너지·연료 공급 시스템 및 엔진에 대한 화재예방 안전을 보장하는 해결책;\nc) 화재·폭발 위험이 있는 기체, 액체의 누출 사고를 감지하는 시스템, 설비;\nd) 소방 장비·설비, 소방 시스템.","o":[]},{"id":"law-17","d":"law","n":"17","t":"Thẩm định thiết kế về phòng cháy và chữa cháy","k":"소방 설계 심사","c":"제2장 화재예방","x":"1. Việc thẩm định thiết kế về phòng cháy và chữa cháy đối với dự án đầu tư xây dựng công trình, công trình và phương tiện giao thông, trừ công trình tạm theo quy định của pháp luật về xây dựng được quy định như sau:\na) Người quyết định đầu tư tổ chức thẩm định các nội dung quy định tại các điểm a, b, c, d và đ khoản 1 Điều 16 của Luật này đối với báo cáo kinh tế - kỹ thuật đầu tư xây dựng, tổ chức thẩm định các nội dung quy định tại khoản 1 Điều 16 của Luật này đối với báo cáo nghiên cứu khả thi đầu tư xây dựng không thuộc diện thẩm định dự án của cơ quan chuyên môn về xây dựng theo quy định của pháp luật về xây dựng nhưng thuộc diện thẩm định thiết kế về phòng cháy và chữa cháy;\nb)5 Cơ quan chuyên môn về xây dựng tổ chức thẩm định các nội dung quy định tại các điểm a, b, c, d và đ khoản 1 Điều 16 của Luật này đối với dự án thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy khi thực hiện thẩm định Báo cáo nghiên cứu khả thi đầu tư xây dựng công trình theo quy định của pháp luật về xây dựng;\n5 Điểm này được sửa đổi, bổ sung theo quy định tại điểm a khoản 2 Điều 93 của Luật Xây dựng số 135/2025/QH15, có hiệu lực kể từ ngày 01 tháng 7 năm 2026.\nc) Cơ quan đăng kiểm tổ chức thẩm định các nội dung quy định tại các điểm a, b và c khoản 2 Điều 16 của Luật này khi thực hiện thẩm định thiết kế theo quy định của pháp luật về đăng kiểm đối với phương tiện giao thông thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy;\nd) Cơ quan Công an tổ chức thẩm định các nội dung quy định tại điểm e và điểm g khoản 1 Điều 16 của Luật này đối với báo cáo kinh tế - kỹ thuật đầu tư xây dựng, thiết kế xây dựng triển khai sau khi dự án được phê duyệt6 của công trình thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy; tổ chức thẩm định nội dung quy định tại điểm d khoản 2 Điều 16 của Luật này đối với phương tiện giao thông thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy;\n6 Cụm từ “thiết kế xây dựng triển khai sau thiết kế cơ sở” được thay thế bằng cụm từ “thiết kế xây dựng triển khai sau khi dự án được phê duyệt” theo quy định tại điểm b khoản 2 Điều 93 của Luật Xây dựng số 135/2025/QH15, có hiệu lực kể từ ngày 01 tháng 7 năm 2026.\nđ) Chủ đầu tư, chủ sở hữu công trình tổ chức thẩm định các nội dung quy định tại các điểm a, b, c, d và đ khoản 1 Điều 16 của Luật này đối với thiết kế xây dựng triển khai sau khi dự án được phê duyệt7 của công trình không thuộc diện phải thẩm định thiết kế xây dựng triển khai sau khi dự án được phê duyệt8 tại cơ quan chuyên môn về xây dựng theo quy định của pháp luật về xây dựng nhưng thuộc diện thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan Công an; tổ chức thẩm định các nội dung quy định tại điểm e và điểm g khoản 1 Điều 16 của Luật này đối với thiết kế xây dựng triển khai sau khi dự án được phê duyệt9 của công trình không thuộc diện thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan Công an.\n7 Cụm từ “thiết kế xây dựng triển khai sau thiết kế cơ sở” được thay thế bằng cụm từ “thiết kế xây dựng triển khai sau khi dự án được phê duyệt” theo quy định tại điểm b khoản 2 Điều 93 của Luật Xây dựng số 135/2025/QH15, có hiệu lực kể từ ngày 01 tháng 7 năm 2026.\n8 Cụm từ “thiết kế xây dựng triển khai sau thiết kế cơ sở” được thay thế bằng cụm từ “thiết kế xây dựng triển khai sau khi dự án được phê duyệt” theo quy định tại điểm b khoản 2 Điều 93 của Luật Xây dựng số 135/2025/QH15, có hiệu lực kể từ ngày 01 tháng 7 năm 2026.\n9 Cụm từ “thiết kế xây dựng triển khai sau thiết kế cơ sở” được thay thế bằng cụm từ “thiết kế xây dựng triển khai sau khi dự án được phê duyệt” theo quy định tại điểm b khoản 2 Điều 93 của Luật Xây dựng số 135/2025/QH15, có hiệu lực kể từ ngày 01 tháng 7 năm 2026.\n2. Công trình thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy khi điều chỉnh thiết kế mà làm thay đổi một trong các yêu cầu về phòng cháy và chữa cháy quy định tại khoản 1 Điều 16 của Luật này hoặc trong quá trình sử dụng mà thay đổi công năng hoặc cải tạo làm thay đổi điều kiện an toàn về phòng cháy và chữa cháy phải thực hiện điều chỉnh thiết kế, thẩm định thiết kế về phòng cháy và chữa cháy. Việc điều chỉnh thiết kế, thẩm định thiết kế về phòng cháy và chữa cháy thực hiện theo quy định tại khoản 1 Điều 16 và khoản 1 Điều 17 của Luật này.\n3. Chủ đầu tư, chủ sở hữu công trình, chủ phương tiện giao thông chỉ được tổ chức thi công xây dựng, cải tạo công trình, hạng mục công trình và sản xuất, lắp ráp, đóng mới, hoán cải phương tiện giao thông thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy khi có văn bản thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan quản lý chuyên ngành.\n4. Chính phủ quy định chi tiết khoản 1 và khoản 2 Điều này; quy định danh mục công trình, phương tiện giao thông thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy của cơ quan Công an, cơ quan chuyên môn về xây dựng và cơ quan đăng kiểm; quy định nội dung, trình tự, thủ tục, thẩm quyền thẩm định thiết kế về phòng cháy và chữa cháy; quy định trách nhiệm phối hợp trong thẩm định thiết kế về phòng cháy và chữa cháy.","y":"1. 건설에 관한 법률의 규정에 따른 임시 건축물을 제외한 건축물 건설투자사업, 건축물 및 교통수단에 대한 소방 설계 심사는 다음과 같이 규정한다:\na) 투자 결정권자는 건설투자 경제·기술 보고서에 대하여 이 법 제16조 제1항 a호, b호, c호, d호 및 đ호에 규정된 내용의 심사를 조직하고, 건설에 관한 법률의 규정에 따른 건설 전문기관의 사업 심사 대상에는 해당하지 아니하나 소방 설계 심사 대상에 해당하는 건설투자 타당성조사 보고서에 대하여 이 법 제16조 제1항에 규정된 내용의 심사를 조직한다;\nb)5 건설 전문기관은 건설에 관한 법률의 규정에 따라 건축물 건설투자 타당성조사 보고서를 심사하는 때에 소방 설계 심사를 받아야 하는 대상에 해당하는 사업에 대하여 이 법 제16조 제1항 a호, b호, c호, d호 및 đ호에 규정된 내용의 심사를 조직한다;\n5 이 호는 건설법 제135/2025/QH15호 제93조 제2항 a호의 규정에 따라 개정·보충되었으며, 2026년 7월 01일부터 효력이 있다.\nc) 등록검사기관은 소방 설계 심사를 받아야 하는 대상에 해당하는 교통수단에 대하여 등록검사에 관한 법률의 규정에 따라 설계 심사를 하는 때에 이 법 제16조 제2항 a호, b호 및 c호에 규정된 내용의 심사를 조직한다;\nd) 공안기관은 소방 설계 심사를 받아야 하는 대상에 해당하는 건축물의 건설투자 경제·기술 보고서, 사업이 승인된 후 전개하는 건설 설계6에 대하여 이 법 제16조 제1항 e호 및 g호에 규정된 내용의 심사를 조직한다. 소방 설계 심사를 받아야 하는 대상에 해당하는 교통수단에 대하여 이 법 제16조 제2항 d호에 규정된 내용의 심사를 조직한다;\n6 “기본설계 이후 전개하는 건설 설계”라는 문구는 건설법 제135/2025/QH15호 제93조 제2항 b호의 규정에 따라 “사업이 승인된 후 전개하는 건설 설계”라는 문구로 대체되었으며, 2026년 7월 01일부터 효력이 있다.\nđ) 발주자(투자자), 건축물 소유자는 건설에 관한 법률의 규정에 따라 건설 전문기관에서 사업이 승인된 후 전개하는 건설 설계8의 심사를 받아야 하는 대상에는 해당하지 아니하나 공안기관의 소방 설계 심사 대상에 해당하는 건축물의 사업이 승인된 후 전개하는 건설 설계7에 대하여 이 법 제16조 제1항 a호, b호, c호, d호 및 đ호에 규정된 내용의 심사를 조직한다. 공안기관의 소방 설계 심사 대상에 해당하지 아니하는 건축물의 사업이 승인된 후 전개하는 건설 설계9에 대하여 이 법 제16조 제1항 e호 및 g호에 규정된 내용의 심사를 조직한다.\n7 “기본설계 이후 전개하는 건설 설계”라는 문구는 건설법 제135/2025/QH15호 제93조 제2항 b호의 규정에 따라 “사업이 승인된 후 전개하는 건설 설계”라는 문구로 대체되었으며, 2026년 7월 01일부터 효력이 있다.\n8 “기본설계 이후 전개하는 건설 설계”라는 문구는 건설법 제135/2025/QH15호 제93조 제2항 b호의 규정에 따라 “사업이 승인된 후 전개하는 건설 설계”라는 문구로 대체되었으며, 2026년 7월 01일부터 효력이 있다.\n9 “기본설계 이후 전개하는 건설 설계”라는 문구는 건설법 제135/2025/QH15호 제93조 제2항 b호의 규정에 따라 “사업이 승인된 후 전개하는 건설 설계”라는 문구로 대체되었으며, 2026년 7월 01일부터 효력이 있다.\n2. 소방 설계 심사를 받아야 하는 대상에 해당하는 건축물이 설계를 조정하여 이 법 제16조 제1항에 규정된 소방에 관한 요구사항 중 어느 하나를 변경하게 되거나, 사용 과정에서 용도를 변경하거나 개보수하여 소방 안전 조건을 변경하게 되는 때에는 설계 조정, 소방 설계 심사를 하여야 한다. 설계 조정, 소방 설계 심사는 이 법 제16조 제1항 및 제17조 제1항의 규정에 따라 실시한다.\n3. 발주자(투자자), 건축물 소유자, 교통수단 소유자는 전문 분야 관리기관의 소방 설계 심사 문서가 있는 경우에만 소방 설계 심사를 받아야 하는 대상에 해당하는 건축물, 건축물 세부 항목의 건설 시공, 개보수와 교통수단의 생산, 조립, 신조, 개조를 조직할 수 있다.\n4. 정부는 이 조 제1항 및 제2항을 상세히 규정한다. 공안기관, 건설 전문기관 및 등록검사기관의 소방 설계 심사를 받아야 하는 대상에 해당하는 건축물, 교통수단의 목록을 규정한다. 소방 설계 심사의 내용, 절차, 수속, 권한을 규정한다. 소방 설계 심사에서의 협조 책임을 규정한다.","o":[]},{"id":"law-18","d":"law","n":"18","t":"Nghiệm thu, kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy","k":"소방 준공검사(인수검사), 소방 준공검사(인수검사) 확인","c":"제2장 화재예방","x":"1. Chủ đầu tư, chủ sở hữu công trình, chủ phương tiện giao thông có trách nhiệm tổ chức thi công, nghiệm thu công trình, phương tiện giao thông theo thiết kế về phòng cháy và chữa cháy đã được thẩm định; chủ đầu tư, chủ sở hữu công trình, chủ phương tiện giao thông, đơn vị thi công có trách nhiệm bảo đảm an toàn về phòng cháy và chữa cháy trong suốt quá trình thi công công trình, phương tiện giao thông thuộc phạm vi quản lý của mình.\n2. Chủ đầu tư, chủ sở hữu công trình, chủ phương tiện giao thông tổ chức nghiệm thu về phòng cháy và chữa cháy đối với công trình, phương tiện giao thông theo các quy định sau đây:\na) Nghiệm thu về phòng cháy và chữa cháy từng phần, từng giai đoạn, từng hạng mục, từng hệ thống và nghiệm thu hoàn thành thi công xây dựng công trình;\nb) Đối với các bộ phận của công trình, bộ phận phương tiện giao thông bị che khuất thì phải nghiệm thu về phòng cháy và chữa cháy trước khi tiến hành các bước thi công tiếp theo;\nc) Quyết định việc nghiệm thu về phòng cháy và chữa cháy từng phần công trình, từng hạng mục công trình trong trường hợp phần công trình, hạng mục công trình đó đủ điều kiện vận hành độc lập, bảo đảm điều kiện an toàn về phòng cháy và chữa cháy.\n3. Chủ đầu tư, chủ sở hữu công trình, chủ phương tiện giao thông chịu trách nhiệm trước pháp luật về kết quả nghiệm thu về phòng cháy và chữa cháy đối với công trình, phương tiện giao thông.\n4. Công trình, phương tiện giao thông thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy sau khi tổ chức nghiệm thu về phòng cháy và chữa cháy phải được cơ quan quản lý chuyên ngành kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy; chỉ được đưa công trình, phần công trình, hạng mục công trình, phương tiện giao thông vào khai thác, sử dụng sau khi được cơ quan quản lý chuyên ngành chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy.\n5. Việc kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy được quy định như sau:\na) Cơ quan chuyên môn về xây dựng tổ chức kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy trước khi đưa công trình, phần công trình, hạng mục công trình vào sử dụng đối với công trình, phần công trình, hạng mục công trình đã được cơ quan chuyên môn về xây dựng thẩm định thiết kế về phòng cháy và chữa cháy trước đó theo quy định tại điểm b khoản 1 Điều 17 của Luật này và thuộc đối tượng phải kiểm tra công tác nghiệm thu chất lượng công trình xây dựng theo quy định của pháp luật về xây dựng;\nb) Cơ quan đăng kiểm tổ chức kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy đối với phương tiện giao thông đã được cơ quan đăng kiểm thẩm định thiết kế về phòng cháy và chữa cháy trước đó theo quy định tại điểm c khoản 1 Điều 17 của Luật này khi kiểm tra và cấp Giấy chứng nhận an toàn kỹ thuật và bảo vệ môi trường;\nc) Cơ quan Công an tổ chức kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy đối với công trình, phần công trình, hạng mục công trình, phương tiện giao thông đã được cơ quan Công an thẩm định thiết kế về phòng cháy và chữa cháy trước đó theo quy định tại điểm d khoản 1 Điều 17 của Luật này.\n6. Chính phủ quy định chi tiết khoản 1 Điều này; quy định nội dung, trình tự, thủ tục, thẩm quyền kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy; quy định trách nhiệm phối hợp kiểm tra công tác nghiệm thu về phòng cháy và chữa cháy.","y":"1. 발주자(투자자), 건축물 소유자, 교통수단 소유자는 심사받은 소방 설계에 따라 건축물, 교통수단의 시공, 준공검사(인수검사)를 조직할 책임이 있다. 발주자(투자자), 건축물 소유자, 교통수단 소유자, 시공자는 자신의 관리 범위에 속하는 건축물, 교통수단의 시공 전 과정에서 소방 안전을 보장할 책임이 있다.\n2. 발주자(투자자), 건축물 소유자, 교통수단 소유자는 다음 각 호의 규정에 따라 건축물, 교통수단에 대한 소방 준공검사(인수검사)를 조직한다:\na) 각 부분별, 각 단계별, 각 세부 항목별, 각 시스템별 소방 준공검사(인수검사) 및 건축물 건설 시공 완료 준공검사(인수검사);\nb) 건축물의 부위, 교통수단의 부위 중 가려지는(은폐되는) 부위에 대하여는 다음 시공 단계를 진행하기 전에 소방 준공검사(인수검사)를 하여야 한다;\nc) 건축물의 일부, 건축물 세부 항목이 독립적으로 운영할 수 있는 조건을 갖추고 소방 안전 조건을 보장하는 경우에는 그 건축물의 일부별, 건축물 세부 항목별 소방 준공검사(인수검사)를 결정한다.\n3. 발주자(투자자), 건축물 소유자, 교통수단 소유자는 건축물, 교통수단에 대한 소방 준공검사(인수검사) 결과에 대하여 법 앞에 책임을 진다.\n4. 소방 설계 심사를 받아야 하는 대상에 해당하는 건축물, 교통수단은 소방 준공검사(인수검사)를 조직한 후 전문 분야 관리기관으로부터 소방 준공검사(인수검사) 확인을 받아야 한다. 전문 분야 관리기관이 소방 준공검사(인수검사) 결과를 승인한 후에만 건축물, 건축물의 일부, 건축물 세부 항목, 교통수단을 운영, 사용에 제공할 수 있다.\n5. 소방 준공검사(인수검사) 확인은 다음과 같이 규정한다:\na) 건설 전문기관은 이 법 제17조 제1항 b호의 규정에 따라 건설 전문기관이 사전에 소방 설계 심사를 하였고 건설에 관한 법률의 규정에 따라 건설 공사 품질 준공검사(인수검사) 확인을 받아야 하는 대상에 해당하는 건축물, 건축물의 일부, 건축물 세부 항목에 대하여, 그 건축물, 건축물의 일부, 건축물 세부 항목을 사용에 제공하기 전에 소방 준공검사(인수검사) 확인을 조직한다;\nb) 등록검사기관은 이 법 제17조 제1항 c호의 규정에 따라 등록검사기관이 사전에 소방 설계 심사를 한 교통수단에 대하여 기술 안전 및 환경 보호 증명서를 검사·발급하는 때에 소방 준공검사(인수검사) 확인을 조직한다;\nc) 공안기관은 이 법 제17조 제1항 d호의 규정에 따라 공안기관이 사전에 소방 설계 심사를 한 건축물, 건축물의 일부, 건축물 세부 항목, 교통수단에 대하여 소방 준공검사(인수검사) 확인을 조직한다.\n6. 정부는 이 조 제1항을 상세히 규정한다. 소방 준공검사(인수검사) 확인의 내용, 절차, 수속, 권한을 규정한다. 소방 준공검사(인수검사) 확인의 협조 책임을 규정한다.","o":[]},{"id":"law-19","d":"law","n":"19","t":"Phòng cháy đối với công trình xây dựng trong quá trình thi công","k":"시공 중인 건설 공사에 대한 화재예방","c":"제2장 화재예방","x":"1. Công trình xây dựng trong quá trình thi công phải bảo đảm điều kiện an toàn về phòng cháy sau đây:\na) Có nội quy phòng cháy, chữa cháy, cứu nạn, cứu hộ phù hợp với tính chất, đặc điểm của công trình xây dựng;\nb) Có biển cấm, biển báo, biển chỉ dẫn theo quy định;\nc) Trang bị phương tiện hoặc hệ thống phòng cháy và chữa cháy phù hợp với tính chất, đặc điểm của công trình xây dựng theo quy định về an toàn trong thi công xây dựng;\nd) Có phân công người thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ thuộc phạm vi quản lý.\n2. Chủ đầu tư, chủ sở hữu công trình, đơn vị thi công công trình xây dựng có trách nhiệm thực hiện, duy trì điều kiện an toàn về phòng cháy quy định tại khoản 1 Điều này.","y":"1. 시공 중인 건설 공사는 다음 각 호의 화재예방 안전 조건을 갖추어야 한다:\na) 건설 공사의 성질·특성에 적합한 소방 및 구조·구난 내규가 있을 것;\nb) 규정에 따른 금지 표지, 경고 표지, 안내 표지가 있을 것;\nc) 건설 시공 안전에 관한 규정에 따라 건설 공사의 성질·특성에 적합한 소방(화재예방·진압) 장비 또는 설비를 갖출 것;\nd) 관리 범위에 속하는 소방 및 구조·구난 임무를 수행할 사람을 지정할 것.\n2. 발주자(투자자), 건축물 소유자, 건설 공사 시공 단위는 이 조 제1항에 규정된 화재예방 안전 조건을 이행하고 유지할 책임이 있다.","o":[]},{"id":"law-20","d":"law","n":"20","t":"Phòng cháy đối với nhà ở","k":"주택에 대한 화재예방","c":"제2장 화재예방","x":"1. Nhà ở không thuộc loại hình quy định tại khoản 3 và khoản 4 Điều này phải bảo đảm các điều kiện an toàn về phòng cháy sau đây:\na) Lắp đặt, sử dụng thiết bị điện bảo đảm điều kiện an toàn về phòng cháy quy định tại điểm c khoản 1 Điều 24 của Luật này;\nb) Bố trí bếp đun nấu, nơi thờ cúng, đốt vàng mã bảo đảm an toàn; không để vật, chất dễ cháy, nổ gần nguồn lửa, nguồn nhiệt.\n2. Nhà ở không thuộc loại hình quy định tại khoản 3 và khoản 4 Điều này phải bảo đảm các điều kiện về chữa cháy, thoát nạn sau đây:\na) Có phương tiện phòng cháy, chữa cháy phù hợp với khả năng, điều kiện thực tế để sẵn sàng chữa cháy, thoát nạn;\nb) Bố trí, duy trì lối thoát nạn, lối ra khẩn cấp hoặc lối đi bảo đảm việc thoát nạn.\n3. Nhà ở có quy chuẩn kỹ thuật, tiêu chuẩn được viện dẫn trong văn bản quy phạm pháp luật hoặc trong quy chuẩn kỹ thuật về phòng cháy, chữa cháy và cứu nạn, cứu hộ thực hiện theo tiêu chuẩn, quy chuẩn kỹ thuật đó.\n4. Nhà ở trong danh mục cơ sở thuộc diện quản lý về phòng cháy và chữa cháy thực hiện theo quy định tại Điều 23 của Luật này.\n5. Đối với nhà ở tại thành phố trực thuộc trung ương thuộc khu vực không bảo đảm hạ tầng giao thông hoặc nguồn nước phục vụ chữa cháy theo quy định của pháp luật, quy chuẩn kỹ thuật trong hoạt động phòng cháy, chữa cháy thì phải trang bị bình chữa cháy, thiết bị truyền tin báo cháy kết nối với hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy theo lộ trình do Chính phủ quy định.\nĐối với nhà ở tại khu vực khác thì khuyến khích trang bị thiết bị truyền tin báo cháy kết nối với hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy.\nỦy ban nhân dân thành phố trực thuộc trung ương xác định khu vực không bảo đảm hạ tầng giao thông hoặc nguồn nước phục vụ chữa cháy.\n6. Lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ có trách nhiệm hướng dẫn việc kết nối thiết bị truyền tin báo cháy với hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy khi có yêu cầu.","y":"1. 이 조 제3항 및 제4항에 규정된 유형에 속하지 아니하는 주택은 다음 각 호의 화재예방 안전 조건을 갖추어야 한다:\na) 이 법 제24조 제1항 c호에 규정된 화재예방 안전 조건을 충족하도록 전기 기기를 설치·사용할 것;\nb) 취사용 화덕, 제사 장소, 지전(紙錢) 소각 장소를 안전하게 배치할 것; 불씨·열원 가까이에 인화성·폭발성 물건·물질을 두지 아니할 것.\n2. 이 조 제3항 및 제4항에 규정된 유형에 속하지 아니하는 주택은 다음 각 호의 화재진압·피난 조건을 갖추어야 한다:\na) 화재진압·피난에 즉시 대비할 수 있도록 실제 능력·여건에 적합한 소방 장비·설비가 있을 것;\nb) 피난구, 비상구 또는 피난을 보장하는 통로를 배치하고 유지할 것.\n3. 법규범 문서 또는 소방 및 구조·구난에 관한 기술 규정에서 인용하는 기술 규정·표준이 있는 주택은 그 기술 표준·기술 규정에 따른다.\n4. 소방 관리 대상 사업장 목록에 포함된 주택은 이 법 제23조의 규정에 따른다.\n5. 중앙직할시의 주택으로서 소방 활동에 관한 법률 규정·기술 규정에 따른 화재진압용 교통 기반시설 또는 수원(水源)이 확보되지 아니한 지역에 속하는 주택은 정부가 정하는 로드맵에 따라 소화기와, 소방 및 구조·구난 데이터베이스 및 화재 신호 전송 시스템에 연결되는 화재 신호 전송 장치를 갖추어야 한다.\n그 밖의 지역의 주택에 대하여는 소방 및 구조·구난 데이터베이스 및 화재 신호 전송 시스템에 연결되는 화재 신호 전송 장치를 갖추도록 권장한다.\n중앙직할시 인민위원회는 화재진압용 교통 기반시설 또는 수원이 확보되지 아니한 지역을 확정한다.\n6. 소방경찰(소방·구조구난 경찰)은 요청이 있는 경우 화재 신호 전송 장치를 소방 및 구조·구난 데이터베이스 및 화재 신호 전송 시스템에 연결하는 것을 안내할 책임이 있다.","o":[]},{"id":"law-21","d":"law","n":"21","t":"Phòng cháy đối với nhà ở kết hợp sản xuất, kinh doanh","k":"생산·영업 겸용 주택에 대한 화재예방","c":"제2장 화재예방","x":"1. Nhà ở kết hợp sản xuất, kinh doanh phải bảo đảm các điều kiện an toàn về phòng cháy sau đây:\na) Các điều kiện an toàn về phòng cháy quy định tại Điều 20 của Luật này;\nb) Có biển cấm, biển báo, biển chỉ dẫn theo quy định;\nc) Khu vực sản xuất, kinh doanh hàng hóa có nguy cơ cháy, nổ phải có giải pháp ngăn cách hoặc ngăn cháy với khu vực để ở.\n2. Nhà ở kết hợp sản xuất, kinh doanh hàng hóa nguy hiểm về cháy, nổ phải bảo đảm các điều kiện an toàn về phòng cháy sau đây:\na) Các điều kiện an toàn về phòng cháy quy định tại khoản 1 Điều này;\nb) Không bố trí chỗ ngủ trong khu vực sản xuất, kinh doanh;\nc) Có phương tiện báo cháy, giải pháp thông gió, thiết bị phát hiện sự cố rò rỉ chất khí nguy hiểm về cháy, nổ phù hợp với công năng, đặc điểm của nhà ở kết hợp sản xuất, kinh doanh hàng hóa nguy hiểm về cháy, nổ;\nd) Khu vực sản xuất, kinh doanh hàng hóa nguy hiểm về cháy, nổ phải được ngăn cháy với lối thoát nạn của khu vực để ở.","y":"1. 생산·영업 겸용 주택은 다음 각 호의 화재예방 안전 조건을 갖추어야 한다:\na) 이 법 제20조에 규정된 화재예방 안전 조건;\nb) 규정에 따른 금지 표지, 경고 표지, 안내 표지가 있을 것;\nc) 화재·폭발 우려가 있는 화물을 생산·영업하는 구역은 거주 구역과 격리하거나 방화(구획)하는 방안이 있을 것.\n2. 화재·폭발 위험 화물을 생산·영업하는 생산·영업 겸용 주택은 다음 각 호의 화재예방 안전 조건을 갖추어야 한다:\na) 이 조 제1항에 규정된 화재예방 안전 조건;\nb) 생산·영업 구역 안에 잠자는 곳을 두지 아니할 것;\nc) 화재·폭발 위험 화물을 생산·영업하는 생산·영업 겸용 주택의 기능·특성에 적합한 화재경보 장비, 환기 방안, 화재·폭발 위험 가스 누출 사고 감지 장치가 있을 것;\nd) 화재·폭발 위험 화물을 생산·영업하는 구역은 거주 구역의 피난구와 방화(구획)되어야 한다.","o":[]},{"id":"law-22","d":"law","n":"22","t":"Phòng cháy đối với phương tiện giao thông","k":"교통수단에 대한 화재예방","c":"제2장 화재예방","x":"1. Phương tiện giao thông cơ giới đường bộ vận tải hành khách, hàng hóa nguy hiểm về cháy, nổ khi tham gia giao thông phải bảo đảm điều kiện an toàn về phòng cháy sau đây:\na) Có biển cấm, biển báo, biển chỉ dẫn theo quy định;\nb) Thực hiện các yêu cầu về phòng cháy và chữa cháy quy định tại khoản 2 Điều 16 của Luật này.\n2. Phương tiện giao thông đường sắt, phương tiện thủy nội địa, tàu biển vận tải hành khách, hàng hóa nguy hiểm về cháy, nổ phải bảo đảm các điều kiện an toàn về phòng cháy sau đây:\na) Điều kiện an toàn về phòng cháy theo quy định của pháp luật về đường sắt, pháp luật về giao thông đường thủy nội địa, pháp luật về hàng hải;\nb) Điều kiện quy định tại khoản 1 Điều này;\nc) Phương tiện giao thông thuộc diện thẩm định thiết kế về phòng cháy và chữa cháy phải có văn bản thẩm định thiết kế về phòng cháy và chữa cháy, văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy của cơ quan quản lý chuyên ngành;\nd) Có phương án chữa cháy, cứu nạn, cứu hộ.\n3. Phương tiện giao thông được sản xuất, lắp ráp, đóng mới, hoán cải thuộc diện phải thẩm định thiết kế về phòng cháy và chữa cháy chỉ được cấp Giấy chứng nhận an toàn kỹ thuật và bảo vệ môi trường khi có văn bản chấp thuận kết quả nghiệm thu về phòng cháy và chữa cháy theo quy định.\n4. Phương tiện giao thông thủy của tổ chức quốc tế, tổ chức, cá nhân nước ngoài khi tham gia hoạt động đường thủy nội địa Việt Nam phải đáp ứng các điều kiện an toàn về phòng cháy và chữa cháy theo quy định của pháp luật Việt Nam.\n5. Chủ sở hữu, thuyền trưởng, trưởng tàu, người điều khiển phương tiện giao thông trong phạm vi quản lý có trách nhiệm bảo đảm an toàn về phòng cháy và chữa cháy trong quá trình hoạt động của phương tiện giao thông.","y":"1. 여객, 화재·폭발 위험 화물을 운송하는 도로 동력 교통수단은 교통에 참여할 때 다음 각 호의 화재예방 안전 조건을 갖추어야 한다:\na) 규정에 따른 금지 표지, 경고 표지, 안내 표지가 있을 것;\nb) 이 법 제16조 제2항에 규정된 소방(화재예방·진압) 요건을 이행할 것.\n2. 여객, 화재·폭발 위험 화물을 운송하는 철도 교통수단, 내수로 수상 교통수단, 해상 선박은 다음 각 호의 화재예방 안전 조건을 갖추어야 한다:\na) 철도에 관한 법률, 내수로 교통에 관한 법률, 해사에 관한 법률의 규정에 따른 화재예방 안전 조건;\nb) 이 조 제1항에 규정된 조건;\nc) 소방 설계 심사 대상에 속하는 교통수단은 전문 분야 관리기관의 소방 설계 심사 문서, 소방 준공검사(인수검사) 결과 승인 문서가 있을 것;\nd) 화재진압·구조구난 계획(방안)이 있을 것.\n3. 소방 설계 심사를 받아야 하는 대상에 속하는, 생산·조립·신조·개조되는 교통수단은 규정에 따른 소방 준공검사(인수검사) 결과 승인 문서가 있는 경우에만 기술 안전 및 환경 보호 인증서를 발급받을 수 있다.\n4. 국제기구, 외국 조직·개인의 수상 교통수단은 베트남 내수로 활동에 참여할 때 베트남 법률의 규정에 따른 소방(화재예방·진압) 안전 조건을 충족하여야 한다.\n5. 소유자, 선장, 열차장, 교통수단 운전자는 관리 범위 안에서 교통수단의 운행 과정 중 소방(화재예방·진압) 안전을 보장할 책임이 있다.","o":[]},{"id":"law-23","d":"law","n":"23","t":"Phòng cháy đối với cơ sở","k":"사업장에 대한 화재예방","c":"제2장 화재예방","x":"1. Cơ sở phải bảo đảm các điều kiện an toàn về phòng cháy sau đây:\na) Có nội quy phòng cháy, chữa cháy, cứu nạn, cứu hộ phù hợp với từng loại hình cơ sở;\nb) Trang bị phương tiện, hệ thống phòng cháy, chữa cháy, cứu nạn, cứu hộ theo quy định của pháp luật;\nc) Trang bị thiết bị truyền tin báo cháy kết nối với hệ thống Cơ sở dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ và truyền tin báo cháy; khai báo, cập nhật dữ liệu về phòng cháy, chữa cháy, cứu nạn, cứu hộ theo lộ trình do Chính phủ quy định;\nd) Thực hiện các yêu cầu về phòng cháy và chữa cháy quy định tại các điểm a, b, c, d, đ và e khoản 1 Điều 16 của Luật này;\nđ) Có phương án chữa cháy, cứu nạn, cứu hộ;\ne) Thành lập lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở hoặc lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành theo quy định tại Điều 37 của Luật này hoặc phân công người thực hiện nhiệm vụ phòng cháy, chữa cháy, cứu nạn, cứu hộ.\n2. Cơ quan, tổ chức hoạt động trong phạm vi một cơ sở phải bảo đảm các điều kiện an toàn về phòng cháy sau đây:\na) Có nội quy phòng cháy, chữa cháy, cứu nạn, cứu hộ phù hợp với tính chất hoạt động của Cơ quan, tổ chức;\nb) Bảo đảm an toàn trong sử dụng nguồn lửa, nguồn nhiệt, thiết bị, dụng cụ sinh lửa, sinh nhiệt, chất dễ cháy, nổ trong phạm vi quản lý;\nc) Cử người tham gia lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ cơ sở hoặc lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ chuyên ngành theo quy định của pháp luật;\nd) Thực hiện, duy trì điều kiện an toàn về phòng cháy và chữa cháy trong phạm vi quản lý.","y":"1. 사업장은 다음 각 호의 화재예방 안전 조건을 갖추어야 한다:\na) 각 사업장 유형에 적합한 소방 및 구조·구난 내규가 있을 것;\nb) 법률의 규정에 따라 소방 및 구조·구난 장비·설비를 갖출 것;\nc) 소방 및 구조·구난 데이터베이스 및 화재 신호 전송 시스템에 연결되는 화재 신호 전송 장치를 갖출 것; 정부가 정하는 로드맵에 따라 소방 및 구조·구난에 관한 데이터를 신고·갱신할 것;\nd) 이 법 제16조 제1항 a호, b호, c호, d호, đ호 및 e호에 규정된 소방(화재예방·진압) 요건을 이행할 것;\nđ) 화재진압·구조구난 계획(방안)이 있을 것;\ne) 이 법 제37조의 규정에 따라 사업장 자체 소방대 또는 전문 소방대를 설립하거나, 소방 및 구조·구난 임무를 수행할 사람을 지정할 것.\n2. 하나의 사업장 범위 안에서 활동하는 기관·조직은 다음 각 호의 화재예방 안전 조건을 갖추어야 한다:\na) 기관·조직의 활동 성질에 적합한 소방 및 구조·구난 내규가 있을 것;\nb) 관리 범위 안에서 불씨, 열원, 불·열을 발생시키는 설비·기구, 인화성·폭발성 물질의 사용상 안전을 보장할 것;\nc) 법률의 규정에 따라 사업장 자체 소방대 또는 전문 소방대에 참여할 사람을 보낼 것;\nd) 관리 범위 안에서 소방(화재예방·진압) 안전 조건을 이행하고 유지할 것.","o":[]},{"id":"law-24","d":"law","n":"24","t":"Phòng cháy trong lắp đặt, sử dụng điện cho sinh hoạt, sản xuất","k":"생활용·생산용 전기의 설치·사용에서의 화재예방","c":"제2장 화재예방","x":"1. Trong lắp đặt, sử dụng điện cho sinh hoạt phải bảo đảm các điều kiện an toàn về phòng cháy sau đây:\na) Chấp hành quy định về an toàn trong sử dụng điện cho sinh hoạt theo quy định của pháp luật về điện lực;\nb) Đơn vị bán lẻ điện khi đấu nối điện sinh hoạt phải tư vấn việc lắp đặt, sử dụng đối với hệ thống, thiết bị điện để bảo đảm an toàn về phòng cháy;\nc) Việc lắp đặt, sử dụng dây dẫn điện, thiết bị điện trong nhà phải bảo đảm yêu cầu về an toàn điện theo quy định của pháp luật; thường xuyên kiểm tra, kịp thời sửa chữa, thay thế dây dẫn điện, thiết bị điện không bảo đảm an toàn về phòng cháy;\nd) Chỉ được sử dụng thiết bị sạc điện cho xe động cơ điện bảo đảm quy chuẩn kỹ thuật quốc gia; nơi sạc điện cho xe động cơ điện trong nhà phải có giải pháp bảo đảm an toàn về phòng cháy; khu vực sạc điện cho xe động cơ điện tập trung trong nhà còn phải có giải pháp ngăn cháy và trang bị phương tiện chữa cháy phù hợp, bảo đảm tiêu chuẩn.\n2. Trong lắp đặt, sử dụng điện cho sản xuất phải bảo đảm các điều kiện an toàn về phòng cháy sau đây:\na) Chấp hành quy định về an toàn trong sử dụng điện cho sản xuất theo quy định của pháp luật về điện lực và quy định tại điểm b và điểm c khoản 1 Điều này;\nb) Thiết bị điện được sử dụng trong môi trường nguy hiểm về cháy, nổ phải là thiết bị chuyên dụng theo quy định của pháp luật.\n3. Tổ chức, cá nhân kinh doanh sản phẩm, thiết bị điện có trách nhiệm tư vấn, cung cấp thông tin về chất lượng, thông số kỹ thuật của sản phẩm, thiết bị điện phù hợp với mục đích sử dụng.\n4. Đơn vị bán lẻ điện có trách nhiệm tuyên truyền, hướng dẫn về bảo đảm an toàn sử dụng điện trong sinh hoạt, sản xuất và thực hiện các nhiệm vụ khác về an toàn sử dụng điện theo quy định của pháp luật về điện lực.","y":"1. 생활용 전기의 설치·사용에서는 다음 각 호의 화재예방 안전 조건을 갖추어야 한다:\na) 전력에 관한 법률의 규정에 따라 생활용 전기 사용상 안전에 관한 규정을 준수할 것;\nb) 전기 소매 단위는 생활용 전기를 연결할 때 화재예방 안전을 보장하도록 전기 계통·전기 기기의 설치·사용에 관하여 자문하여야 한다;\nc) 주택 내 전선, 전기 기기의 설치·사용은 법률의 규정에 따른 전기 안전 요건을 충족하여야 한다; 화재예방 안전을 충족하지 못하는 전선, 전기 기기를 수시로 점검하고 적시에 수리·교체하여야 한다;\nd) 전기 동력 차량용 충전 장치는 국가 기술 규정을 충족하는 것만 사용할 수 있다; 주택 내 전기 동력 차량 충전 장소는 화재예방 안전을 보장하는 방안이 있어야 한다; 주택 내 전기 동력 차량 집중 충전 구역은 그에 더하여 방화(구획) 방안이 있어야 하고, 표준을 충족하는 적합한 소화 장비를 갖추어야 한다.\n2. 생산용 전기의 설치·사용에서는 다음 각 호의 화재예방 안전 조건을 갖추어야 한다:\na) 전력에 관한 법률의 규정에 따른 생산용 전기 사용상 안전에 관한 규정 및 이 조 제1항 b호 및 c호의 규정을 준수할 것;\nb) 화재·폭발 위험 환경에서 사용되는 전기 기기는 법률의 규정에 따른 전용 기기이어야 한다.\n3. 전기 제품·전기 기기를 영업하는 조직·개인은 사용 목적에 적합한 전기 제품·전기 기기의 품질, 기술 사양에 관하여 자문하고 정보를 제공할 책임이 있다.\n4. 전기 소매 단위는 생활·생산에서의 전기 사용 안전 보장에 관하여 홍보·안내하고, 전력에 관한 법률의 규정에 따라 전기 사용 안전에 관한 그 밖의 임무를 수행할 책임이 있다.","o":[]},{"id":"law-25","d":"law","n":"25","t":"Trách nhiệm chữa cháy","k":"화재진압 책임","c":"제3장 화재진압","x":"1. Người phát hiện cháy, cơ quan, tổ chức, hộ gia đình, cá nhân gần nơi xảy ra cháy có trách nhiệm tham gia chữa cháy trong điều kiện, khả năng cho phép.\n2. Người đứng đầu cơ quan, tổ chức, Trưởng thôn, Tổ trưởng tổ dân phố, Chủ tịch Ủy ban nhân dân cấp xã trở lên có trách nhiệm tổ chức chữa cháy thuộc phạm vi quản lý; huy động lực lượng, người, phương tiện, tài sản theo thẩm quyền tham gia chữa cháy theo đề nghị của người chỉ huy chữa cháy.\n3. Cơ quan y tế, điện lực, cấp nước, môi trường đô thị, giao thông và cơ quan, tổ chức, đoàn thể khác có liên quan có trách nhiệm phối hợp tham gia chữa cháy ngay khi có yêu cầu của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ có thẩm quyền hoặc người chỉ huy chữa cháy; điều động người và phương tiện thuộc phạm vi quản lý đến nơi xảy ra cháy để tham gia, hỗ trợ chữa cháy khi được huy động.\n4. Lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ khi nhận được tin báo cháy thuộc phạm vi quản lý hoặc nhận được mệnh lệnh, quyết định huy động phải kịp thời đến chữa cháy.\n5. Lực lượng Công an nhân dân có trách nhiệm tổ chức bảo đảm an ninh, trật tự, bảo vệ khu vực chữa cháy; tham gia chữa cháy; bảo đảm trật tự, an toàn giao thông cho lực lượng, phương tiện đi chữa cháy được lưu thông nhanh nhất.\n6. Ủy ban nhân dân địa phương giáp ranh với địa phương nơi xảy ra cháy có trách nhiệm huy động lực lượng, người, phương tiện, tài sản của cơ quan, tổ chức, hộ gia đình, cá nhân thuộc phạm vi quản lý tham gia chữa cháy khi người chỉ huy chữa cháy đề nghị.\n7. Bộ trưởng Bộ Công an quy định về công tác trực sẵn sàng chữa cháy, tổ chức chữa cháy của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ và các lực lượng khác trong Công an nhân dân.\n8. Bộ trưởng Bộ Quốc phòng quy định về trách nhiệm chữa cháy đối với công trình, cơ sở, phương tiện giao thông thuộc phạm vi quản lý của Bộ Quốc phòng phục vụ mục đích quân sự, quốc phòng; phối hợp với Bộ Công an tổ chức chữa cháy đối với công trình lưỡng dụng theo quy định của Chính phủ.","y":"1. 화재를 발견한 사람, 화재 발생 장소 인근의 기관, 조직, 가구, 개인은 여건과 능력이 허용하는 범위에서 화재진압에 참여할 책임이 있다.\n2. 기관·조직의 장, 촌장(thôn), 주민조(tổ dân phố) 조장, 사(면)급 이상 인민위원회 위원장은 관리 범위에 속하는 화재진압을 조직할 책임이 있다; 화재진압 지휘자의 요청에 따라 권한에 따라 인력(조직), 사람, 장비·수단, 재산을 동원하여 화재진압에 참여하게 한다.\n3. 보건, 전력, 급수, 도시환경, 교통 기관 및 그 밖의 관련 기관, 조직, 단체는 권한 있는 소방경찰(소방·구조구난 경찰) 또는 화재진압 지휘자의 요구가 있는 즉시 화재진압에 협조·참여할 책임이 있다; 동원되는 경우 관리 범위에 속하는 사람과 장비·수단을 화재 발생 장소로 출동시켜 화재진압에 참여하고 이를 지원하게 한다.\n4. 소방 및 구조·구난대는 관리 범위에 속하는 화재 신고를 받거나 동원 명령·결정을 받은 경우 적시에 출동하여 화재를 진압하여야 한다.\n5. 인민공안은 화재진압 구역의 안보·질서 보장 및 경비를 조직할 책임이 있다; 화재진압에 참여한다; 화재진압 출동 인력·장비·수단이 가장 신속하게 통행할 수 있도록 교통 질서·안전을 보장한다.\n6. 화재가 발생한 지방과 인접한 지방의 인민위원회는 화재진압 지휘자가 요청하는 경우 관리 범위에 속하는 기관, 조직, 가구, 개인의 인력(조직), 사람, 장비·수단, 재산을 동원하여 화재진압에 참여하게 할 책임이 있다.\n7. 공안부 장관은 소방경찰(소방·구조구난 경찰) 및 인민공안 내 그 밖의 인력의 화재진압 대기 근무, 화재진압 조직에 관하여 규정한다.\n8. 국방부 장관은 국방부의 관리 범위에 속하는 군사·국방 목적의 공사·건축물, 사업장, 교통수단에 대한 화재진압 책임에 관하여 규정한다; 정부의 규정에 따라 공안부와 협조하여 민군 겸용 공사·건축물에 대한 화재진압을 조직한다.","o":[]},{"id":"law-26","d":"law","n":"26","t":"Huy động lực lượng, người, phương tiện, tài sản tham gia chữa cháy","k":"화재진압에 참여할 인력(조직), 사람, 장비·수단, 재산의 동원","c":"제3장 화재진압","x":"1. Khi có cháy thì lực lượng, người, phương tiện, tài sản của cơ quan, tổ chức, hộ gia đình, cá nhân đều có thể được huy động để tham gia chữa cháy; trường hợp cần thiết, người chỉ huy chữa cháy đề nghị cơ quan đại diện ngoại giao, cơ quan đại diện lãnh sự, cơ quan đại diện của tổ chức quốc tế tại Việt Nam bố trí lực lượng, người, phương tiện để hỗ trợ, giúp đỡ chữa cháy.\n2. Cơ quan, tổ chức, hộ gia đình, cá nhân khi được huy động tham gia chữa cháy có trách nhiệm bố trí ngay lực lượng, người, phương tiện, tài sản để tham gia chữa cháy.\n3. Phương tiện, tài sản của cơ quan, tổ chức, hộ gia đình, cá nhân được huy động tham gia chữa cháy phải được hoàn trả ngay sau khi kết thúc chữa cháy; trường hợp bị mất, hư hỏng, bị thiệt hại do việc huy động trực tiếp gây ra thì được bồi thường.\nNgười có thẩm quyền quyết định huy động có trách nhiệm thực hiện việc bồi thường. Mức bồi thường và việc chi trả bồi thường được thực hiện như đối với người có tài sản trưng dụng theo quy định của pháp luật về trưng mua, trưng dụng tài sản.\n4. Lực lượng, người được huy động làm nhiệm vụ chữa cháy được ưu tiên khi đi trên các phương tiện giao thông công cộng.\n5. Thẩm quyền huy động lực lượng, người, phương tiện, tài sản tham gia chữa cháy được quy định như sau:\na) Chủ tịch Ủy ban nhân dân các cấp và người đứng đầu cơ quan, tổ chức được quyền huy động lực lượng, người, phương tiện, tài sản của cơ quan, tổ chức, hộ gia đình, cá nhân thuộc phạm vi quản lý của mình;\nb) Trưởng phòng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ Công an cấp tỉnh được quyền huy động lực lượng, người, phương tiện, tài sản của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ thuộc phạm vi quản lý của mình; Cục trưởng Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ được quyền huy động lực lượng, người, phương tiện, tài sản của lực lượng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ trong phạm vi cả nước;\nc) Giám đốc Công an cấp tỉnh và Trưởng Công an cấp xã10 được quyền huy động lực lượng, người, phương tiện, tài sản của lực lượng Công an nhân dân thuộc phạm vi quản lý của mình; Bộ trưởng Bộ Công an được quyền huy động lực lượng, người, phương tiện, tài sản của cơ quan, tổ chức, hộ gia đình, cá nhân trong phạm vi cả nước.\n10 Từ “huyện” được thay thế bằng từ “xã” theo quy định tại điểm b khoản 2 Điều 10 của Luật số 118/2025/QH15 sửa đổi, bổ sung một số điều của 10 luật có liên quan đến an ninh, trật tự, có hiệu lực kể từ ngày 01 tháng 7 năm 2026.\n6. Chính phủ quy định thủ tục huy động lực lượng, người, phương tiện, tài sản để chữa cháy; việc huy động lực lượng, người, phương tiện, tài sản của Quân đội để tham gia chữa cháy.","y":"1. 화재가 발생한 때에는 기관, 조직, 가구, 개인의 인력(조직), 사람, 장비·수단, 재산은 모두 화재진압에 참여하도록 동원될 수 있다; 필요한 경우 화재진압 지휘자는 베트남 주재 외교대표기관, 영사대표기관, 국제기구 대표기관에 화재진압을 지원·조력할 인력(조직), 사람, 장비·수단을 배치하여 줄 것을 요청한다.\n2. 기관, 조직, 가구, 개인은 화재진압 참여를 위하여 동원되는 경우 즉시 인력(조직), 사람, 장비·수단, 재산을 배치하여 화재진압에 참여할 책임이 있다.\n3. 화재진압 참여를 위하여 동원된 기관, 조직, 가구, 개인의 장비·수단, 재산은 화재진압 종료 후 즉시 반환되어야 한다; 동원으로 인하여 직접 분실, 훼손, 손해가 발생한 경우에는 배상을 받는다.\n동원을 결정한 권한 있는 자는 배상을 이행할 책임이 있다. 배상 수준 및 배상금 지급은 재산의 징매(강제수매)·징용에 관한 법률의 규정에 따라 재산을 징용당한 자에 대한 것과 같이 이행한다.\n4. 화재진압 임무 수행을 위하여 동원된 인력(조직), 사람은 대중교통수단을 이용할 때 우선권을 가진다.\n5. 화재진압에 참여할 인력(조직), 사람, 장비·수단, 재산을 동원할 권한은 다음과 같이 규정한다:\na) 각급 인민위원회 위원장 및 기관·조직의 장은 자신의 관리 범위에 속하는 기관, 조직, 가구, 개인의 인력(조직), 사람, 장비·수단, 재산을 동원할 권한이 있다;\nb) 성급 공안의 소방·구조구난 경찰과장은 자신의 관리 범위에 속하는 소방경찰(소방·구조구난 경찰)의 인력(조직), 사람, 장비·수단, 재산을 동원할 권한이 있다; 소방·구조구난 경찰국장은 전국 범위에서 소방경찰(소방·구조구난 경찰)의 인력(조직), 사람, 장비·수단, 재산을 동원할 권한이 있다;\nc) 성급 공안청장 및 사(면)급 공안서장10은 자신의 관리 범위에 속하는 인민공안의 인력(조직), 사람, 장비·수단, 재산을 동원할 권한이 있다; 공안부 장관은 전국 범위에서 기관, 조직, 가구, 개인의 인력(조직), 사람, 장비·수단, 재산을 동원할 권한이 있다.\n10 “현(huyện)”이라는 단어는 안보·질서와 관련된 10개 법의 일부 조항을 개정·보충하는 법 제118/2025/QH15호 제10조 제2항 b호의 규정에 따라 “사(xã)”라는 단어로 대체되었으며, 2026년 7월 01일부터 효력이 있다.\n6. 정부는 화재진압을 위한 인력(조직), 사람, 장비·수단, 재산의 동원 절차; 화재진압에 참여할 군대의 인력(조직), 사람, 장비·수단, 재산의 동원에 관하여 규정한다.","o":[]},{"id":"law-27","d":"law","n":"27","t":"Nguồn nước chữa cháy","k":"소방용수(화재진압용 수원)","c":"제3장 화재진압","x":"1. Nguồn nước chữa cháy lấy từ trụ nước chữa cháy thuộc hệ thống cấp nước tập trung, hệ thống cấp nước chữa cháy, bồn, bể, ao, hồ, sông, suối, kênh hoặc nguồn nước sẵn có khác.\n2. Trên hệ thống cấp nước tập trung bố trí các trụ nước chữa cháy theo tiêu chuẩn, quy chuẩn kỹ thuật bảo đảm yêu cầu cấp nước phục vụ chữa cháy. Chi phí sử dụng nước từ hệ thống cấp nước tập trung do cơ quan Công an sử dụng để chữa cháy và thực tập phương án chữa cháy, cứu nạn, cứu hộ được chi trả từ ngân sách nhà nước.\n3. Tại khu vực bồn, bể, ao, hồ, sông, suối, kênh trong đô thị, khu dân cư tập trung bố trí các điểm, bến để xe chữa cháy, máy bơm chữa cháy lấy nước phục vụ chữa cháy.\n4. Chính phủ quy định trách nhiệm đầu tư, quản lý, bảo trì, bảo dưỡng trụ nước chữa cháy; đầu tư, quản lý các điểm, bến để xe chữa cháy, máy bơm chữa cháy lấy nước phục vụ chữa cháy.","y":"1. 소방용수는 집중 급수 계통에 속하는 소화전, 소방용 급수 계통, 저
